<script>
(function () {
  'use strict';

  function loadLessons() {
    try {
      const raw = JSON.parse(localStorage.getItem('zeek_lessons') || '[]');
      if (Array.isArray(raw)) {
        if (raw.length && raw[0].phrases && !raw[0].type) {
          return raw.map((l, i) => ({ id: l.id || i + 1, type: 'lesson', custom: true, title: l.title, phrases: l.phrases }));
        }
        return raw;
      }
      return [];
    } catch (e) { return []; }
  }

  function saveLessons() { localStorage.setItem('zeek_lessons', JSON.stringify(LESSONS)); }

  async function exportLessons() {
    const data = JSON.stringify(LESSONS, null, 2);
    const filename = 'zeek-lessons.json';
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem && Capacitor.Plugins.Share) {
      try {
        const { Filesystem, Share } = Capacitor.Plugins;
        const dir = (Filesystem.Directory && Filesystem.Directory.Cache) ? Filesystem.Directory.Cache : 'CACHE';
        await Filesystem.writeFile({ path: filename, data: data, directory: dir, encoding: 'utf8' });
        const { uri } = await Filesystem.getUri({ path: filename, directory: dir });
        await Share.share({ title: 'Zeek lessons', files: [uri], dialogTitle: 'Zeek JSON' });
        showToast(t('exportSuccess'));
        return;
      } catch (e) { console.error('Capacitor export failed', e); }
    }
    const blobUrl = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    showToast(t('exportSuccess'));
  }

  function importLessons(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) throw new Error('invalid');
        if (confirm(t('importConfirm'))) {
          LESSONS = data.map((it, i) => ({ ...it, id: it.id || (Date.now() + i) }));
          ensureBuiltInLesson();
          saveLessons();
          go({ name: 'home' }, false);
          showToast(t('importSuccess'));
        }
      } catch (err) {
        showToast(t('importError'));
      }
    };
    reader.readAsText(file);
  }

  function showToast(msg, duration = 2200) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    if (el._timer) clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), duration);
  }

  function cleanPhrasePart(s) {
    let r = String(s).trim();
    const trim = '*–—-:=;';
    while (r && trim.includes(r[0])) r = r.slice(1).trim();
    while (r && trim.includes(r[r.length - 1])) r = r.slice(0, -1).trim();
    return r;
  }

  function extractRawParts(line) {
    const cleanLine = String(line).trim();
    if (!cleanLine) return null;
    const delims = /\s*(?:\|{1,2}|,|;|=>|->|→|=|:|\s+-\s+|\s+)\s*/;
    const tokens = cleanLine.split(delims).map(s => s.trim()).filter(Boolean);
    if (tokens.length < 3) return null;
    const isAr = s => /[\u0600-\u06FF]/.test(s);
    const firstAr = tokens.findIndex(isAr);
    if (firstAr === -1) return null;
    const lastAr = tokens.length - 1 - [...tokens].reverse().findIndex(isAr);
    return {
      first: tokens.slice(0, firstAr).join(' '),
      ar: tokens.slice(firstAr, lastAr + 1).join(' '),
      last: tokens.slice(lastAr + 1).join(' ')
    };
  }

  function classifyLatinLang(s) {
    const text = String(s).trim();
    if (!text || /[\u0600-\u06FF]/.test(text)) return '';
    const lower = text.toLowerCase();
    if (/[éèêàâäæçíïîìôöòûüùœ]/.test(lower)) return 'fr';
    const enMatch = lower.match(/\b(the|a|an|and|or|is|are|am|was|were|be|been|have|has|had|do|does|did|will|would|could|should|may|might|can|this|that|these|those|my|your|his|her|its|our|their|in|on|at|to|for|with|of|from|by|about|into|through|during|before|after|i|you|he|she|we|they|it|me|him|them|us|there|here|where|what|when|why|how|all|some|no|not|yes|please|thank|thanks|very|much|more|less)\b/g);
    const frMatch = lower.match(/\b(le|la|les|l'|un|une|des|du|de|d'|et|ou|en|je|tu|il|elle|nous|vous|ils|elles|est|sont|ai|as|a|avons|avez|ont|avoir|faire|suis|es|sommes|etes|êtes|mon|ma|mes|ton|ta|tes|son|sa|ses|ce|cet|cette|ces|que|qui|quoi|pour|avec|dans|sur|par|sous|contre|vers|avant|après|plus|moins|très|bien|oui|non|merci|s'il|te|me|se|lui|y|en|où|dont|quand|comment|pourquoi|parce|car|si|quel|quelle|quels|quelles)\b/g);
    const enWords = enMatch ? enMatch.length : 0;
    const frWords = frMatch ? frMatch.length : 0;
    if (enWords > frWords) return 'en';
    if (frWords > enWords) return 'fr';
    const words = lower.split(/[^a-z0-9'àâäæçéèêëïîôùûüœ'-]+/i).filter(Boolean);
    const frHints = new Set(['vagin','vulve','clitoris','lèvres','grandes','petites','utérus','ovaires','seins','mamelons','col','hymen','mont','vénus','périnée','trompes','fallope','anus','pénis','gland','prépuce','testicules','scrotum','prostate','point']);
    const enHints = new Set(['vagina','vulva','labia','majora','minora','uterus','womb','ovaries','breasts','nipples','cervix','mons','pubis','perineum','fallopian','tubes','penis','glans','foreskin','testicles','balls','scrotum','prostate','g-spot']);
    let frAny = false, enAny = false;
    words.forEach(w => { if (frHints.has(w)) frAny = true; if (enHints.has(w)) enAny = true; });
    if (frAny && !enAny) return 'fr';
    if (enAny && !frAny) return 'en';
    return '';
  }

  function getLineOrder(first, last, blockOrder) {
    const langFirst = classifyLatinLang(first);
    const langLast = classifyLatinLang(last);
    if (langFirst === 'fr' && langLast !== 'fr') return 'fr-ar-en';
    if (langFirst === 'en' && langLast !== 'en') return 'en-ar-fr';
    if (langLast === 'fr' && langFirst !== 'fr') return 'en-ar-fr';
    if (langLast === 'en' && langFirst !== 'en') return 'fr-ar-en';
    return blockOrder;
  }

  function detectBlockOrder(text) {
    let firstFr = 0, firstEn = 0, lastFr = 0, lastEn = 0;
    text.split('\n').forEach(raw => {
      const parts = extractRawParts(raw);
      if (!parts) return;
      const first = cleanPhrasePart(parts.first);
      const last = cleanPhrasePart(parts.last);
      const langFirst = classifyLatinLang(first);
      const langLast = classifyLatinLang(last);
      if (langFirst === 'fr') firstFr++; else if (langFirst === 'en') firstEn++;
      if (langLast === 'fr') lastFr++; else if (langLast === 'en') lastEn++;
    });
    if (firstEn > firstFr && lastFr >= lastEn) return 'en-ar-fr';
    if (firstFr > firstEn && lastEn >= lastFr) return 'fr-ar-en';
    if (firstEn > 0 && lastFr > 0) return 'en-ar-fr';
    if (firstFr > 0 && lastEn > 0) return 'fr-ar-en';
    return 'fr-ar-en';
  }

  function formatTitle(obj) {
    if (!obj) return '';
    const seen = new Set();
    const parts = [];
    [obj.fr, obj.ar, obj.en].forEach(v => { if (v && !seen.has(v)) { seen.add(v); parts.push(v); } });
    return parts.join(' | ');
  }

  function parseTitle(text) {
    const s = String(text).trim();
    if (!s) return null;
    const p = parsePhrases(s, 'auto');
    if (p && p[0]) return p[0];
    const tokens = s.split(/\s*(?:\|{1,2}|,|;|=>|->|→|=|:|\s+-\s+|\s+)\s*/).map(x => x.trim()).filter(Boolean);
    if (!tokens.length) return null;
    if (tokens.length === 1) {
      const v = tokens[0];
      return { fr: v, ar: v, en: v };
    }
    let fr = '', ar = '', en = '';
    tokens.forEach(tok => {
      if (/[\u0600-\u06FF]/.test(tok)) { if (!ar) ar = tok; }
      else {
        const lang = classifyLatinLang(tok);
        if (lang === 'en' && !en) en = tok;
        else if (lang === 'fr' && !fr) fr = tok;
        else if (!fr) fr = tok;
        else if (!en) en = tok;
      }
    });
    if (!fr && !ar && !en) return null;
    return { fr, ar, en };
  }

  function parsePhrases(text, userOrder = 'auto') {
    const phrases = [];
    const blockOrder = (userOrder === 'auto') ? detectBlockOrder(text) : userOrder;
    text.split('\n').forEach(raw => {
      const parts = extractRawParts(raw);
      if (!parts) return;
      const ar = cleanPhrasePart(parts.ar);
      const first = cleanPhrasePart(parts.first);
      const last = cleanPhrasePart(parts.last);
      if (!ar || !first || !last) return;
      const lineOrder = getLineOrder(first, last, blockOrder);
      let fr, en;
      if (lineOrder === 'en-ar-fr') { en = first; fr = last; }
      else { fr = first; en = last; }
      phrases.push({ fr, ar, en });
    });
    return phrases;
  }

  let LESSONS = loadLessons();

  const BIENVENUE_LESSON = {
    type: 'lesson',
    protected: true,
    title: { fr: 'Bienvenue', ar: 'أهلاً وسهلاً', en: 'Welcome' },
    image: 'bienvenue-lesson.jpg',
    phrases: [
      { fr: "Bienvenue dans notre application d'apprentissage du français", ar: 'مرحبًا بك في تطبيقنا لتعلّم اللغة الفرنسية', en: 'Welcome to our French learning app' },
      { fr: 'Je suis ravi de vous accueillir parmi nous.', ar: 'يسعدني أن أرحب بك بيننا.', en: 'I’m delighted to welcome you.' },
      { fr: 'Cette application a été conçue pour vous aider à apprendre le français de manière simple, efficace et progressive.', ar: 'صُمم هذا التطبيق لمساعدتك على تعلم اللغة الفرنسية بطريقة سهلة وفعّالة وتدريجية.', en: 'This app was designed to help you learn French in a simple, effective, and progressive way.' },
      { fr: 'Vous y trouverez des leçons, du vocabulaire, des expressions courantes et de nombreux outils pour améliorer votre compréhension, votre expression et votre communication au quotidien.', ar: 'ستجد فيه دروسًا ومفردات وعبارات شائعة والعديد من الأدوات لتحسين الفهم والتعبير والتواصل اليومي.', en: 'You will find lessons, vocabulary, common expressions, and many tools to improve your comprehension, speaking, and daily communication.' },
      { fr: 'Mon objectif est de rendre l\'apprentissage du français accessible à tous, quel que soit votre niveau.', ar: 'هدفي هو جعل تعلم اللغة الفرنسية متاحًا للجميع مهما كان مستواهم.', en: 'My goal is to make learning French accessible to everyone, regardless of their level.' },
      { fr: "Merci d'utiliser cette application.", ar: 'شكرًا لاستخدامك هذا التطبيق.', en: 'Thank you for using this app.' },
      { fr: 'Je vous souhaite un excellent apprentissage et beaucoup de réussite dans votre parcours linguistique !', ar: 'أتمنى لك تعلمًا ممتعًا ونجاحًا كبيرًا في رحلتك اللغوية!', en: 'I wish you an enjoyable learning experience and great success in your language journey!' },
      { fr: 'À propos du créateur', ar: 'نبذة عن المطور', en: 'About the creator' },
      { fr: 'Je m\'appelle Mohammad.', ar: 'اسمي محمد.', en: 'My name is Mohammad.' },
      { fr: 'Je suis né le 15 juillet 1989.', ar: 'وُلدت في 15 يوليو 1989.', en: 'I was born on July 15, 1989.' },
      { fr: 'Je viens de Syrie.', ar: 'أنا من سوريا.', en: 'I am from Syria.' },
      { fr: 'Pour me contacter', ar: 'للتواصل معي', en: 'Contact me' },
      { fr: 'WhatsApp : +33 7 75 81 36 43', ar: 'واتساب: +33 7 75 81 36 43', en: 'WhatsApp: +33 7 75 81 36 43' },
      { fr: 'E-mail : Syrian020@gmail.com', ar: 'البريد الإلكتروني: Syrian020@gmail.com', en: 'Email: Syrian020@gmail.com' }
    ]
  };

  function ensureBuiltInLesson() {
    const builtIn = JSON.parse(JSON.stringify(BIENVENUE_LESSON));
    const existing = LESSONS.find(it => it.type === 'lesson' && it.protected);
    if (existing) {
      existing.title = builtIn.title;
      const oldMedia = existing.phrases.map(p => p.media);
      const oldCaptions = existing.phrases.map(p => p.captionText);
      existing.phrases = builtIn.phrases;
      existing.phrases.forEach((p, i) => {
        if (oldMedia[i]) p.media = oldMedia[i];
        if (oldCaptions[i]) p.captionText = oldCaptions[i];
      });
      if (!existing.image) existing.image = builtIn.image;
    } else {
      builtIn.id = nextId();
      LESSONS.unshift(builtIn);
    }
    saveLessons();
  }

  function nextId() {
    let max = 0;
    LESSONS.forEach(it => {
      if (it.id > max) max = it.id;
      if (it.type === 'folder') (it.lessons || []).forEach(l => { if (l.id > max) max = l.id; });
    });
    return max + 1;
  }

  function findItem(id) { return LESSONS.find(it => it.id === id); }

  function findFolder(id) { return LESSONS.find(it => it.type === 'folder' && it.id === id); }

  function findLesson(id) {
    const root = LESSONS.find(it => it.type === 'lesson' && it.id === id);
    if (root) return { lesson: root, parent: null };
    for (let i = 0; i < LESSONS.length; i++) {
      const f = LESSONS[i];
      if (f.type === 'folder') {
        const l = (f.lessons || []).find(x => x.id === id);
        if (l) return { lesson: l, parent: f };
      }
    }
    return null;
  }

  function getAllLessons() {
    const all = [];
    LESSONS.forEach(it => {
      if (it.type === 'lesson') all.push({ lesson: it, parent: null });
      else if (it.type === 'folder') (it.lessons || []).forEach(l => all.push({ lesson: l, parent: it }));
    });
    return all;
  }

  const UI = {
    appName: { ar: 'Zeek', en: 'Zeek', fr: 'Zeek' },
    appTitle: { ar: 'Zeek — فرنسي / عربي / إنجليزي', en: 'Zeek — French / Arabic / English', fr: 'Zeek — Français / Arabe / Anglais' },
    searchPlaceholder: { ar: 'ابحث بالعربية أو الفرنسية أو الإنجليزية…', en: 'Search in Arabic, French, or English…', fr: 'Rechercher en arabe, français ou anglais…' },
    rateTitle: { ar: 'سرعة الصوت والفيديو', en: 'Audio & video speed', fr: 'Vitesse audio et vidéo' },
    loopModeTitle: { ar: 'محتوى التكرار', en: 'Loop content', fr: 'Contenu de la répétition' },
    loopFrenchArabicEnglish: { ar: '🔁 فرنسي + عربي + إنجليزي', en: '🔁 French + Arabic + English', fr: '🔁 Français + Arabe + Anglais' },
    loopFrenchArabic: { ar: '🔁 فرنسي + عربي', en: '🔁 French + Arabic', fr: '🔁 Français + Arabe' },
    loopFrenchOnly: { ar: '🔁 فرنسي فقط', en: '🔁 French only', fr: '🔁 Français seulement' },
    favourites: { ar: 'المحفوظات', en: 'Favourites', fr: 'Favoris' },
    themeMode: { ar: 'الوضع الليلي/النهاري', en: 'Dark / light mode', fr: 'Mode sombre / clair' },
    stopAudio: { ar: 'إيقاف الصوت', en: 'Stop audio', fr: 'Arrêter le son' },
    library: { ar: 'المكتبة', en: 'Library', fr: 'Bibliothèque' },
    phrases: { ar: 'عبارة', en: 'phrases', fr: 'phrases' },
    lessonsCount: { ar: 'درس', en: 'lessons', fr: 'leçons' },
    speakOnce: { ar: 'نطق مرة واحدة', en: 'Speak once', fr: 'Parler une fois' },
    loopTitle: { ar: 'تكرار: فرنسي ← عربي ← إنجليزي', en: 'Repeat: French ← Arabic ← English', fr: 'Répéter : Français ← Arabe ← Anglais' },
    ttsLoopTitle: { ar: 'تكرار النطق', en: 'Repeat pronunciation', fr: 'Répéter la prononciation' },
    aiTitle: { ar: 'شرح العبارة بالذكاء الاصطناعي من Google', en: 'Explain phrase with Google AI', fr: 'Expliquer la phrase avec Google AI' },
    noteTitle: { ar: 'دفتر الملاحظات', en: 'Notebook', fr: 'Carnet' },
    favTitle: { ar: 'حفظ', en: 'Save', fr: 'Enregistrer' },
    playAll: { ar: '▶ تشغيل كل الدرس', en: '▶ Play whole lesson', fr: '▶ Lire toute la leçon' },
    stopAll: { ar: '⏹ إيقاف', en: '⏹ Stop', fr: '⏹ Arrêter' },
    loading: { ar: '…جاري التحميل', en: '…Loading', fr: '…Chargement' },

  function t(key) {
    const v = UI[key];
    return (v && v[state.uiLang]) || (v && v.en) || (v && v.ar) || key;
  }

  function title(obj) {
    return (obj && obj[state.uiLang]) || (obj && obj.fr) || (obj && obj.en) || (obj && obj.ar) || '';
  }

  function subtitle(obj) {
    if (!obj) return '';
    const seen = new Set();
    const parts = [];
    [obj.fr, obj.ar, obj.en].forEach(v => { if (v && !seen.has(v)) { seen.add(v); parts.push(esc(v)); } });
    return parts.join(' · ');
  }

  function chevron() { return document.documentElement.dir === 'rtl' ? '‹' : '›'; }

  function applyTranslations() {
    document.title = t('appTitle');
    document.querySelectorAll('[data-t]').forEach(el => {
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = t(el.dataset.t);
      else el.textContent = t(el.dataset.t);
    });
    document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
    const loopmode = document.getElementById('loopmode');
    if (loopmode) {
      Array.from(loopmode.options).forEach(opt => { opt.textContent = t(opt.dataset.t); });
    }

  function setUILang(lang) {

    localStorage.setItem('zeek_ui_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

    go(state.route, false);

  function setTheme(theme) {

    localStorage.setItem('zeek_theme', theme);
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : '');
    const btn = document.getElementById('btn-theme');
    if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';

  function toggleTheme() { setTheme(state.theme === 'light' ? 'dark' : 'light'); }

  function isAndroid() {
    return !!(window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android');
  }

  function nativeTTS() {
    if (!window.Capacitor) return null;
    if (window.Capacitor.getPlatform && window.Capacitor.getPlatform() !== 'android') return null;
    return window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech;
  }

  function toWebUrl(url) {
    if (typeof Capacitor === 'undefined' || !Capacitor.convertFileSrc) return url;
    if (typeof url !== 'string') return url;
    if (url.startsWith('file://') || url.startsWith('content://')) return Capacitor.convertFileSrc(url);
    return url;
  }

  const MEDIA_DB_NAME = 'zeek-media';
  const MEDIA_DB_VERSION = 1;
  const MEDIA_STORE_NAME = 'media';
  let mediaDb = null;
  const mediaUrlCache = new Map();

  function isIDBMedia(url) {
    return typeof url === 'string' && url.startsWith('idb://');
  }

  function idbMediaId(url) {
    return url.slice(6);
  }

  function idbMediaSupported() {
    return 'indexedDB' in window;
  }

  async function openMediaDb() {
    if (mediaDb) return mediaDb;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(MEDIA_DB_NAME, MEDIA_DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(MEDIA_STORE_NAME)) {
          db.createObjectStore(MEDIA_STORE_NAME);
        }
      };
      req.onsuccess = () => { mediaDb = req.result; resolve(mediaDb); };
    });
  }

  async function storeMedia(file) {
    if (!file || !idbMediaSupported()) return null;
    const db = await openMediaDb();
    const id = Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    return new Promise((resolve, reject) => {
      const tx = db.transaction([MEDIA_STORE_NAME], 'readwrite');
      const req = tx.objectStore(MEDIA_STORE_NAME).put(file, id);
      req.onsuccess = () => resolve('idb://' + id);
      req.onerror = () => reject(req.error);
    });
  }

  async function getMediaBlob(id) {
    const db = await openMediaDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction([MEDIA_STORE_NAME], 'readonly');
      const req = tx.objectStore(MEDIA_STORE_NAME).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function deleteMediaById(id) {
    const db = await openMediaDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction([MEDIA_STORE_NAME], 'readwrite');
      const req = tx.objectStore(MEDIA_STORE_NAME).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async function resolveMediaRef(ref) {
    if (!isIDBMedia(ref)) return { url: toWebUrl(ref), type: '', blob: null };
    const id = idbMediaId(ref);
    const blob = await getMediaBlob(id);
    if (!blob) return { url: '', type: '', blob: null };
    if (!mediaUrlCache.has(id)) mediaUrlCache.set(id, URL.createObjectURL(blob));
    return { url: mediaUrlCache.get(id), type: blob.type || '', blob };
  }

  async function deleteMediaRef(ref) {
    if (!ref || typeof ref !== 'string') return;
    if (isIDBMedia(ref)) {
      const id = idbMediaId(ref);
      if (mediaUrlCache.has(id)) { URL.revokeObjectURL(mediaUrlCache.get(id)); mediaUrlCache.delete(id); }
      try { await deleteMediaById(id); } catch (e) { console.error('deleteMediaById', id, e); }
    } else if (ref.startsWith('file://')) {
      await deleteLocalFile(ref);
    }
  }

  async function deleteLocalFile(uri) {
    if (!uri || typeof uri !== 'string' || !uri.startsWith('file://')) return;
    if (!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem)) return;
    try { await window.Capacitor.Plugins.Filesystem.deleteFile({ path: uri }); } catch (e) { console.error('deleteLocalFile', uri, e); }
  }

  async function deleteItemMedia(it) {
    if (!it) return;
    if (it.image) await deleteMediaRef(it.image);
    if (it.media) { await deleteMediaRef(it.media); it.media = ''; }
    if (it.captionText) delete it.captionText;
    if (it.lessons) { for (const l of it.lessons) await deleteItemMedia(l); }
    if (it.phrases) { for (const p of it.phrases) { if (p.media) await deleteMediaRef(p.media); if (p.captionText) delete p.captionText; } }
  }

  function findPhraseByKey(key) {
    if (!key) return null;
    const [lessonId, idx] = key.split('.').map(Number);
    const found = findLesson(lessonId);
    return found ? found.lesson.phrases[idx] : null;
  }

  function parseCaptions(text) {
    text = (text || '').trim();
    if (!text) return [];
    if (text.includes('-->')) return parseSRT(text);
    return parseCustomCaptions(text);
  }

  function parseCustomCaptions(text) {
    const captions = [];
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (line === 'الحوار' || /^\d+$/.test(line)) continue;
      const m = line.match(/^(\d{1,2}):(\d{2})\s+(.+)$/);
      if (!m) continue;
      const start = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
      const parts = m[3].split(/\s*\|\s*/);
      captions.push({ start, end: start + 4, fr: parts[0] || '', ar: parts[1] || '', en: parts[2] || '' });
    }
    for (let i = 0; i < captions.length; i++) {
      if (i + 1 < captions.length) captions[i].end = captions[i + 1].start;
    }
    return captions;
  }

  function parseSRT(text) {
    const captions = [];
    const blocks = text.split(/\n\s*\n/);
    for (const block of blocks) {
      const lines = block.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const timeIdx = lines.findIndex(l => l.includes('-->'));
      if (timeIdx === -1 || timeIdx + 1 >= lines.length) continue;
      const m = lines[timeIdx].match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})/);
      if (!m) continue;
      const start = parseInt(m[1],10)*3600 + parseInt(m[2],10)*60 + parseInt(m[3],10) + parseInt(m[4],10)/1000;
      const end = parseInt(m[5],10)*3600 + parseInt(m[6],10)*60 + parseInt(m[7],10) + parseInt(m[8],10)/1000;
      const text = lines.slice(timeIdx + 1).join(' ');
      const parts = text.split(/\s*\|\s*/);
      captions.push({ start, end, fr: parts[0] || '', ar: parts[1] || '', en: parts[2] || '' });
    }
    return captions.sort((a, b) => a.start - b.start);
  }

  function highlightVideoPhrase(lessonId, idx) {
    document.querySelectorAll('.phrase').forEach(el => {
      const parts = el.dataset.key ? el.dataset.key.split('.').map(Number) : [];
      const on = parts.length === 2 && parts[0] === lessonId && parts[1] === idx;
      el.classList.toggle('synced', on);
      el.querySelectorAll('.line').forEach(line => line.classList.toggle('synced', on));
    });
  }

  async function attachCaptionSync(video, captionText, lessonId) {
    if (!video || video.dataset.captionSync === '1') return;
    let captions = [];
    try { captions = parseCaptions(captionText); } catch (e) { console.error('parse captions', e); }
    if (!captions.length) return;
    const container = video.closest('.phrase-media');
    const overlay = document.createElement('div');
    overlay.className = 'caption-overlay';
    if (container) container.appendChild(overlay);
    const update = () => {
      const t = video.currentTime || 0;
      let activeIdx = -1;
      const c = captions.find((c, i) => { if (t >= c.start && t < c.end) { activeIdx = i; return true; } return false; });
      if (!c) { overlay.style.display = 'none'; if (lessonId != null) highlightVideoPhrase(lessonId, -1); return; }
      const parts = ['<span class="cap-line cap-fr" dir="ltr">' + esc(c.fr) + '</span>',
                     '<span class="cap-line cap-ar" dir="rtl">' + esc(c.ar) + '</span>',
                     '<span class="cap-line cap-en" dir="ltr">' + esc(c.en) + '</span>'].filter(s => !s.includes('></span>'));
      overlay.innerHTML = parts.join('<br>');
      overlay.style.display = 'block';
      if (lessonId != null) highlightVideoPhrase(lessonId, activeIdx);
    };
    video.addEventListener('timeupdate', update);
    video.addEventListener('seeked', update);
    video.addEventListener('play', update);
    video.addEventListener('loadedmetadata', update);
    video.addEventListener('pause', () => { if (lessonId != null) highlightVideoPhrase(lessonId, -1); });
    video.addEventListener('ended', () => { if (lessonId != null) highlightVideoPhrase(lessonId, -1); });
    video.dataset.captionSync = '1';
    update();
  }

  async function syncAllCaptions() {
    const phrases = document.querySelectorAll('.phrase');
    for (const el of phrases) {
      const key = el.dataset.key;
      if (!key) continue;
      const p = findPhraseByKey(key);
      if (!p || !p.captionText) continue;
      const video = el.querySelector('video');
      if (video) await attachCaptionSync(video, p.captionText);
    }
  }

  async function loadMedia() {
    const placeholders = document.querySelectorAll('.media-placeholder');
    for (const el of placeholders) {
      const ref = el.dataset.mediaRef;
      if (!ref) continue;
      const resolved = await resolveMediaRef(ref);
      if (!resolved.url) { el.remove(); continue; }
      const yt = youtubeId(resolved.url);
      if (yt) {
        el.innerHTML = `<iframe width="100%" height="240" src="https://www.youtube.com/embed/${yt}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius:var(--radius);border:none;background:#000"></iframe>`;
      } else {
        const isVideo = (resolved.type || '').startsWith('video/') || isVideoUrl(resolved.url);
        if (isVideo) {
          el.innerHTML = `<video src="${esc(resolved.url)}" controls playsinline></video>`;
          const v = el.querySelector('video');
          if (v) { try { v.playbackRate = state.rate || 1; } catch (e) {} }
        } else {
          el.innerHTML = `<img src="${esc(resolved.url)}" alt="" onerror="this.style.display='none'">`;
        }
      }
      const captionText = el.dataset.captionText || '';
      const lessonId = el.dataset.lessonId ? +el.dataset.lessonId : null;
      if (captionText) {
        const video = el.querySelector('video');
        if (video) {
          if (lessonId != null) video.dataset.lessonId = lessonId;
          await attachCaptionSync(video, captionText, lessonId);
        }
      }
      el.classList.remove('media-placeholder');
    }
    await syncAllCaptions();
  }

  function showTTSBanner(msg, btnText) {
    if (!ttsBanner) return;
    ttsMsg.textContent = msg;
    ttsInstall.textContent = btnText;
    ttsInstall.onclick = () => { openTTSInstall(); };
    ttsBanner.style.display = 'flex';
  }

  function hideTTSBanner() {
    if (ttsBanner) ttsBanner.style.display = 'none';
  }

  function openTTSInstall() {
    const tts = nativeTTS();
    if (!tts || !tts.openInstall) return;
    tts.openInstall().catch(() => {}).then(() => { setTimeout(checkNativeTTS, 3000); });
  }

  async function supportsLangTag(tts, tags) {
    for (const tag of tags) {
      try {
        const r = await tts.isLanguageSupported({ lang: tag });
        if (r && r.supported) return tag;
      } catch (e) {}
    }
    return null;
  }

  async function checkNativeTTS(retry = 0) {
    const tts = nativeTTS();
    if (!tts) {
      state.ttsAvailable = false;
      if (!('speechSynthesis' in window)) showTTSBanner(t('ttsNotAvailable'), t('installTTS'));
      return;
    }
    try {
      let frTag = await supportsLangTag(tts, ['fr-FR','fr','fra','fr-CA','fr-CH']);
      let langs = [];
      if (!frTag) {
        const r = await tts.getSupportedLanguages().catch(() => ({}));
        langs = ((r && r.languages) || []).map(l => String(l).toLowerCase());
        const pick = (tags) => tags.find(tag => langs.includes(tag.toLowerCase()));
        frTag = pick(['fr-FR','fr','fra','fr-CA','fr-CH']);
      }
      if (!frTag && retry < 8) {
        setTimeout(() => checkNativeTTS(retry + 1), 600);
        return;
      }
      if (!frTag) {
        state.ttsAvailable = false;
        if (!webTTS()) showTTSBanner(t('ttsNotAvailable'), t('installTTS'));
        return;
      }
      state.voiceLang = {
        fr: frTag,
        ar: await supportsLangTag(tts, ['ar-SA','ar','ara','ar-EG']),
        en: await supportsLangTag(tts, ['en-US','en','eng','en-GB','en-CA'])
      };
      state.ttsAvailable = true;
      hideTTSBanner();
    } catch (e) {
      if (retry < 8) {
        setTimeout(() => checkNativeTTS(retry + 1), 600);
      } else {
        state.ttsAvailable = false;
        showTTSBanner(t('ttsNotAvailable'), t('installTTS'));
      }
    }
  }

  function estimatedSpeechTimeout(text, rate) {
    const words = String(text).trim().split(/\s+/).filter(Boolean).length;
    return Math.max(8000, Math.ceil(words * 900 / (rate || 1)) + 3000);
  }

  function nativeSpeak(text, lang) {
    const tts = nativeTTS();
    if (!tts) return Promise.reject('no tts');
    const tag = (state.voiceLang && state.voiceLang[lang]);
    if (!tag) return Promise.reject('unsupported lang');
    const p = tts.speak({ text: text, lang: tag, rate: state.rate || 1 });
    const timeout = new Promise((_, reject) => setTimeout(() => reject('timeout'), estimatedSpeechTimeout(text, state.rate)));
    return Promise.race([p, timeout]);
  }

  function nativeStop() {
    const tts = nativeTTS();
    if (tts) tts.stop().catch(() => {});
  }

  function webTTS() {
    const synth = window.speechSynthesis;
    if (!synth) return null;
    const voices = synth.getVoices();
    return (voices && voices.length) ? synth : null;
  }

  function webSpeak(text, lang) {
    const synth = webTTS();
    if (!synth) return Promise.reject('no web tts');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (state.voiceLang && state.voiceLang[lang]) || VOICE_LANG[lang] || 'en-US';
    u.rate = state.rate || 1;
    return new Promise((resolve, reject) => {
      let settled = false;
      u.onend = () => { if (!settled) { settled = true; clearTimeout(timer); resolve(); } };
      u.onerror = () => { if (!settled) { settled = true; clearTimeout(timer); reject('web tts error'); } };
      const timer = setTimeout(() => { if (!settled) { settled = true; resolve(); } }, estimatedSpeechTimeout(text, state.rate) + 2000);
      synth.speak(u);
    });
  }

  function anySpeak(text, lang) {
    if (speakSupported()) return nativeSpeak(text, lang);
    if (webTTS()) return webSpeak(text, lang);
    return Promise.reject('no tts');
  }

  function anyStop() {
    nativeStop();
    const synth = webTTS();
    if (synth) synth.cancel();
  }

  function anyTTSAvailable() {
    return speakSupported() || !!webTTS();
  }

  async function prepareTTS() {
    if (anyTTSAvailable()) { hideTTSBanner(); return true; }
    if (!nativeTTS() && !('speechSynthesis' in window)) return false;
    if (nativeTTS()) checkNativeTTS();
    for (let i = 0; i < 15; i++) {
      await new Promise(r => setTimeout(r, 400));
      if (anyTTSAvailable()) { hideTTSBanner(); return true; }
    }
    return false;
  }

  function speakSupported() { return !!nativeTTS() && state.ttsAvailable; }

  function stopSpeech() {
    state.loop = null;
    if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
    speechRun++;
    anyStop();
    highlight(null);
    refreshButtons();
    const video = document.querySelector('video');
    if (video) { video.pause(); }
  }

  function updateVideoRate() {
    document.querySelectorAll('video').forEach(v => { try { v.playbackRate = state.rate || 1; } catch (e) {} });
  }

  async function speakOnce(phrase, langs, key, onDone) {
    const run = ++speechRun;
    anyStop();
    const ready = await prepareTTS();
    if (run !== speechRun) return;
    if (!ready) { highlight(null); return; }
    const seq = langs.filter(l => phrase[l] && state.voiceLang[l]);
    let i = 0;
    (function next() {
      if (run !== speechRun) return;
      if (i >= seq.length) { highlight(null); if (onDone) onDone(); return; }
      const lang = seq[i++];
      highlight(key, lang);
      anySpeak(phrase[lang], lang).then(() => { if (run === speechRun) setTimeout(next, 250); }).catch(() => {
        if (run === speechRun) setTimeout(next, 250);
      });
    })();
  }

  function getVideoForPhrase(key) {
    const el = document.querySelector(`.phrase[data-key="${key}"]`);
    if (el) { const v = el.querySelector('video'); if (v) return v; }
    return document.querySelector('.lesson-media video') || document.querySelector('video');
  }

  async function toggleTTSLoop(phrase, key) {
    if (state.loop && state.loop.key === key && state.loop.type === 'tts') { stopSpeech(); return; }
    const ready = await prepareTTS();
    if (!ready) return;
    stopSpeech();
    state.loop = { key, type: 'tts' };
    refreshButtons();
    (function cycle() {
      if (!state.loop || state.loop.key !== key) return;
      speakOnce(phrase, state.langs, key, () => {
        if (!state.loop || state.loop.key !== key) return;
        setTimeout(cycle, 600);
      });
    })();
  }

  async function toggleLoop(phrase, key) {
    if (state.loop && state.loop.key === key) { stopSpeech(); return; }
    const video = getVideoForPhrase(key);
    if (!video) return;
    let start = phrase.start, end = phrase.end;
    if ((typeof start !== 'number' || typeof end !== 'number') && key) {
      const [lessonId, idx] = key.split('.').map(Number);
      const found = findLesson(lessonId);
      if (found && found.lesson.captionText) {
        const caps = parseCaptions(found.lesson.captionText);
        const c = caps[idx];
        if (c) { start = c.start; end = c.end; }
      }
    }
    if (typeof start !== 'number' || typeof end !== 'number') return;
    stopSpeech();
    if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
    state.loop = { key, type: 'video', start, end };
    refreshButtons();
    const seekAndPlay = () => {
      try { video.currentTime = start; } catch (e) {}
      updateVideoRate();
      try { video.play(); } catch (e) {}
    };
    updateVideoRate();
    if (video.readyState >= 1) seekAndPlay();
    else {
      video.addEventListener('loadedmetadata', seekAndPlay, { once: true });
      try { video.play(); } catch (e) {}
    }
    loopTimer = setInterval(() => {
      if (!state.loop || state.loop.key !== key) { clearInterval(loopTimer); loopTimer = null; return; }
      if (video.paused) { try { video.play(); } catch (e) {} }
      if (video.currentTime >= end || video.currentTime < start - 0.1) {
        video.currentTime = start;
        try { video.play(); } catch (e) {}
      }
    }, 200);
  }

  async function toggleLangLoop(lang, key) {
    if (!lang) return;
    const [lessonId, idx] = key.split('.').map(Number);
    const found = findLesson(lessonId);
    if (!found) return;
    const p = found.lesson.phrases[idx];
    const text = p[lang];
    if (!text) return;
    const loopKey = 'lang:' + key + ':' + lang;
    if (state.loop && state.loop.key === loopKey) { stopSpeech(); return; }
    const ready = await prepareTTS();
    if (!ready) return;
    state.loop = { key: loopKey, phraseKey: key, lang };
    refreshButtons();
    const pseudo = { [lang]: text };
    highlight(key, lang);
    (function cycle() {
      if (!state.loop || state.loop.key !== loopKey) return;
      speakOnce(pseudo, [lang], key, () => {
        if (!state.loop || state.loop.key !== loopKey) return;
        setTimeout(cycle, 600);
      });
    })();
  }

  async function toggleWordLoop(word, lang, key) {
    if (!word || !lang) return;
    const loopKey = 'word:' + key + ':' + lang + ':' + word;
    if (state.loop && state.loop.key === loopKey) { stopSpeech(); return; }
    const ready = await prepareTTS();
    if (!ready) return;
    state.loop = { key: loopKey, phraseKey: key, lang, word };
    refreshButtons();
    const pseudo = { [lang]: word };
    highlight(key, lang);
    (function cycle() {
      if (!state.loop || state.loop.key !== loopKey) return;
      speakOnce(pseudo, [lang], key, () => {
        if (!state.loop || state.loop.key !== loopKey) return;
        setTimeout(cycle, 600);
      });
    })();
  }

  function highlight(key, lang) {
    document.querySelectorAll('.phrase').forEach(el => {
      const on = key && el.dataset.key === key;
      el.classList.toggle('playing', !!on);
      el.querySelectorAll('.line').forEach(line => {
        line.classList.toggle('active', !!on && (!lang || line.dataset.lang === lang));
      });
    });
  }

  function refreshButtons() {
    document.querySelectorAll('.word').forEach(w => w.classList.remove('active'));
    document.querySelectorAll('.loop-lang').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tts-loop-btn').forEach(b => { b.classList.remove('active'); b.textContent = '🔂'; });
    document.querySelectorAll('.phrase').forEach(el => {
      const videoOn = state.loop && state.loop.type === 'video' && state.loop.key === el.dataset.key;
      const ttsOn = state.loop && state.loop.type === 'tts' && state.loop.key === el.dataset.key;
      const loopBtn = el.querySelector('.loop-btn');
      if (loopBtn) {
        loopBtn.classList.toggle('active', !!videoOn);
        loopBtn.textContent = videoOn ? '⏸' : '🔁';
      }
      const ttsBtn = el.querySelector('.tts-loop-btn');
      if (ttsBtn) {
        ttsBtn.classList.toggle('active', !!ttsOn);
        ttsBtn.textContent = ttsOn ? '⏸' : '🔂';
      }
      if (state.loop && state.loop.phraseKey === el.dataset.key && state.loop.lang && !state.loop.word) {
        const langBtn = el.querySelector('.loop-lang[data-lang="' + state.loop.lang + '"]');
        if (langBtn) langBtn.classList.add('active');
      }
    });
    if (state.loop && state.loop.word) {
      const p = document.querySelector(`.phrase[data-key="${state.loop.phraseKey}"]`);
      if (p) {
        p.querySelectorAll('.word').forEach(w => {
          if (w.dataset.lang === state.loop.lang && w.dataset.word === state.loop.word) w.classList.add('active');
        });
      }
    }
  }

  function isFav(key) { return state.favs.includes(key); }
  function hasNote(key) { return !!state.notes[key]; }
  function saveNotes() { localStorage.setItem('zeek_notes', JSON.stringify(state.notes)); }

  function toggleFav(key) {
    const i = state.favs.indexOf(key);
    if (i === -1) state.favs.push(key); else state.favs.splice(i, 1);
    localStorage.setItem('zeek_favs', JSON.stringify(state.favs));
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function wordSpans(text, lang) {
    if (!text) return '';
    return String(text).trim().split(/\s+/).map(w => {
      const clean = w.replace(/^[\p{P}\p{S}]+|[\p{P}\p{S}]+$/gu, '');
      return `<span class="word" data-lang="${esc(lang)}" data-word="${esc(clean || w)}">${esc(w)}</span>`;
    }).join(' ');
  }

  function phraseKey(lessonId, idx) { return lessonId + '.' + idx; }

  async function deleteRootItem(id) {
    const it = findItem(id);
    if (!it) return;
    if (it.protected) { showToast(t('protected')); return; }
    if (!confirm(it.type === 'folder' ? t('deleteFolderConfirm') : t('deleteConfirm'))) return;
    await deleteItemMedia(it);
    LESSONS = LESSONS.filter(x => x.id !== id);
    saveLessons();
    showToast(t('deleted'));
    go({ name: 'home' }, false);
  }

  async function deleteLesson(id) {
    const found = findLesson(id);
    if (!found) return;
    if (found.lesson.protected) { showToast(t('protected')); return; }
    if (!confirm(t('deleteConfirm'))) return;
    await deleteItemMedia(found.lesson);
    if (found.parent) {
      found.parent.lessons = found.parent.lessons.filter(l => l.id !== id);
    } else {
      LESSONS = LESSONS.filter(it => !(it.type === 'lesson' && it.id === id));
    }
    saveLessons();
    showToast(t('deleted'));
    if (state.route.name === 'lesson' && state.route.lesson === id) go({ name: 'home' }, false);
    else go(state.route, false);
  }

  function cardThumb(it, idx) {
    if (it.image) {
      if (isIDBMedia(it.image)) return `<div class="card-thumb media-placeholder" data-media-ref="${esc(it.image)}"></div>`;
      return `<div class="card-thumb"><img src="${esc(toWebUrl(it.image))}" alt=""></div>`;
    }
    if (it.type === 'folder') return `<div class="card-thumb" style="color:#fff; background:var(--accent-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v1H2V6zm0 3h20v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9z"/></svg></div>`;
    return `<div class="num">${idx || it.id}</div>`;
  }

  function menuBtn(it, type) {
    return it.protected ? '' : `<button class="menu-btn" data-menu="${it.id}" data-type="${type}" title="${t('actions')}">⋮</button>`;
  }

  function openActionSheet(id, type) {
    const sheet = document.getElementById('action-sheet');
    const titleEl = document.getElementById('sheet-title');
    const actions = document.getElementById('sheet-actions');
    const it = type === 'folder' ? findFolder(id) : (findLesson(id) || {}).lesson;
    const label = it ? title(it.title) : '';
    titleEl.textContent = esc(label);
    actions.innerHTML = `
      <button type="button" class="btn" data-edit="${id}" data-type="${type}">${t('edit')}</button>
      <button type="button" class="btn ghost" data-set-image="${id}" data-type="${type}">${t('setImage')}</button>
      <button type="button" class="btn ghost" style="color:var(--danger); border-color:var(--danger)" data-delete-sheet="${id}" data-type="${type}">${type === 'folder' ? t('deleteFolder') : t('deleteLesson')}</button>
    `;
    sheet.classList.add('show');
  }

  function closeActionSheet() {
    document.getElementById('action-sheet').classList.remove('show');
  }

  async function setItemImage(id, type, file) {
    if (!file || !file.type.startsWith('image/')) { showToast(t('invalidImage')); return; }
    let it;
    if (type === 'folder') it = findFolder(id);
    else { const found = findLesson(id); it = found ? found.lesson : null; }
    if (!it) return;
    if (it.protected) { showToast(t('protected')); return; }
    try {
      const uri = await storeMedia(file) || await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      if (it.image) await deleteMediaRef(it.image);
      it.image = uri;
      saveLessons();
      showToast(t('saved'));
      go(state.route, false);
    } catch (e) {
      console.error('setItemImage', e);
      showToast(t('mediaSaveError'));
    }
  }

  function editItem(id, type) {
    if (type === 'folder') {
      const folder = findFolder(id);
      if (!folder) return;
      if (folder.protected) { showToast(t('protected')); return; }
      const ttl = parseTitle(prompt(t('editFolderTitle'), formatTitle(folder.title)) || '');
      if (!ttl) return;
      folder.title = ttl;
      saveLessons();
      showToast(t('saved'));
      go(state.route, false);
    } else {
      const found = findLesson(id);
      if (found && found.lesson.protected) { showToast(t('protected')); return; }
      go({ name: 'edit-lesson', lesson: id });
    }
  }

  function addFolder() {
    const form = document.getElementById('add-folder-form');
    const ttl = parseTitle(form.elements.title.value);
    if (!ttl) { alert(t('fillTitleError')); return; }
    LESSONS.push({ id: nextId(), type: 'folder', title: ttl, lessons: [] });
    saveLessons();
    showToast(t('saved'));
    go({ name: 'home' });
  }

  function readFileText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = e => reject(e);
      reader.readAsText(file);
    });
  }

  function generatePhrasesFromCaptions() {
    const form = document.getElementById('add-lesson-form');
    if (!form) return;
    const text = form.elements.captions.value.trim();
    if (!text) { alert(t('captionParseError')); return; }
    const captions = parseCaptions(text);
    if (!captions.length) { alert(t('captionParseError')); return; }
    form.elements.phrases.value = captions.map(c => `${c.fr} | ${c.ar} | ${c.en}`).join('\n');
    showToast(t('phrasesGenerated').replace('{n}', captions.length));
  }

  async function addLesson() {
    const form = document.getElementById('add-lesson-form');
    const ttl = parseTitle(form.elements.title.value);
    if (!ttl) { alert(t('fillTitleError')); return; }
    const folderId = +form.elements.folderId.value || 0;
    const folder = folderId ? findFolder(folderId) : null;

    let media = '';
    const videoFile = document.getElementById('lesson-video-file').files[0];
    const videoUrl = form.elements.videoUrl.value.trim();
    if (videoFile) {
      media = await storeMedia(videoFile);
      if (!media) { alert(t('mediaSaveError')); return; }
    } else if (videoUrl) {
      const valid = /^https?:\/\//.test(videoUrl) || /^data:/.test(videoUrl) || /^file:\/\//.test(videoUrl) || /^idb:\/\//.test(videoUrl) || isVideoUrl(videoUrl);
      if (!valid) { alert(t('mediaInvalid')); return; }
      media = videoUrl;
    }

    let captionText = form.elements.captions.value.trim();
    const captionFile = document.getElementById('lesson-captions-file').files[0];
    if (captionFile) {
      try { captionText = await readFileText(captionFile); }
      catch (e) { alert(t('captionParseError')); return; }
    }

    let phrases = [];
    if (captionText) {
      const captions = parseCaptions(captionText);
      if (!captions.length) { alert(t('captionParseError')); return; }
      phrases = captions.map(c => ({ fr: c.fr, ar: c.ar, en: c.en, start: c.start, end: c.end }));
    } else {
      phrases = parsePhrases(form.elements.phrases.value, form.elements.order.value);
    }
    if (!phrases.length) { alert(t('noPhrasesError')); return; }

    const lesson = { id: nextId(), type: 'lesson', title: ttl, phrases };
    if (media) lesson.media = media;
    if (captionText) lesson.captionText = captionText;
    if (folder) folder.lessons.push(lesson); else LESSONS.push(lesson);
    saveLessons();
    showToast(t('saved'));
    go(folder ? { name: 'folder', folder: folder.id } : { name: 'home' });
  }

  function youtubeId(url) {
    const m = String(url).match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function isVideoUrl(url) {
    return /^data:video|\.(mp4|webm|mov|ogv|3gp|3gpp|avi|mkv|flv|m4v|mpeg|mpg)(\?|$)/i.test(url);
  }

  function mediaHTML(media) {
    if (!media) return '';
    if (isIDBMedia(media)) return `<div class="phrase-media media-placeholder" data-media-ref="${esc(media)}"></div>`;
    const src = toWebUrl(media);
    const yt = youtubeId(src);
    if (yt) return `<div class="phrase-media"><iframe width="100%" height="240" src="https://www.youtube.com/embed/${yt}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius:var(--radius);border:none;background:#000"></iframe></div>`;

  async function playLesson(lesson) {
    const ready = await prepareTTS();
    if (!ready) { return; }
    stopSpeech();
    let i = 0;
    const runKey = 'lesson:' + lesson.id;
    state.loop = { key: runKey };
    (function next() {
      if (!state.loop || state.loop.key !== runKey) return;
      if (i >= lesson.phrases.length) { i = 0; }
      const p = lesson.phrases[i];
      const key = phraseKey(lesson.id, i);
      i++;
      const el = document.querySelector(`.phrase[data-key="${key}"]`);
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      speakOnce(p, state.langs, key, () => {
        if (!state.loop || state.loop.key !== runKey) return;
        setTimeout(next, 400);
      });
    })();
  }

  let noteKey = null;
  let noteCtx = null;
  let mediaKey = null;
  let mediaFileData = null;
  let captionFileData = null;
  let noteDrawing = false;
  let noteErasing = false;
  let noteColor = '#000000';
  let noteSize = 3;

  function setupNoteCanvas() {
    const canvas = document.getElementById('note-canvas');
    noteCtx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || 600;
    const cssHeight = canvas.clientHeight || 400;
    canvas.width = Math.max(1, cssWidth * dpr);
    canvas.height = Math.max(1, cssHeight * dpr);
    noteCtx.setTransform(1, 0, 0, 1, 0, 0);
    noteCtx.scale(dpr, dpr);
    noteCtx.lineCap = 'round';
    noteCtx.lineJoin = 'round';
  }

  function openNote(key) {
    noteKey = key;
    const modal = document.getElementById('note-modal');
    modal.classList.add('show');
    const canvas = document.getElementById('note-canvas');
    setTimeout(() => {
      setupNoteCanvas();
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.width / dpr;
      const h = canvas.height / dpr;
      noteCtx.fillStyle = '#ffffff';
      noteCtx.fillRect(0, 0, w, h);
      if (state.notes[key]) {
        const img = new Image();
        img.onload = () => { noteCtx.drawImage(img, 0, 0, w, h); };
        img.src = state.notes[key];
      }
    }, 50);
    noteColor = '#000000';
    noteErasing = false;
    noteSize = 3;
    document.getElementById('note-size').value = 3;
    document.querySelectorAll('.note-tool').forEach(b => b.classList.toggle('active', b.dataset.color === noteColor));
  }

  function closeNote() {
    document.getElementById('note-modal').classList.remove('show');
    noteKey = null;
    noteCtx = null;
  }

  function saveNote() {
    if (!noteKey || !noteCtx) return;
    const canvas = document.getElementById('note-canvas');
    state.notes[noteKey] = canvas.toDataURL('image/png');
    saveNotes();
    const btn = document.querySelector(`.phrase[data-key="${noteKey}"] .note-btn`);
    if (btn) { btn.classList.add('note-on'); btn.textContent = '📔'; }
    closeNote();
    showToast(t('saved'));
  }

  function clearNote() {
    if (!noteCtx) return;
    const canvas = document.getElementById('note-canvas');
    noteCtx.fillStyle = '#ffffff';
    noteCtx.fillRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
  }

  function getNotePos(e) {
    const canvas = document.getElementById('note-canvas');
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function noteStart(e) {
    if (!noteCtx) return;
    e.preventDefault();
    noteDrawing = true;
    const p = getNotePos(e);
    noteCtx.beginPath();
    noteCtx.moveTo(p.x, p.y);
    noteCtx.strokeStyle = noteErasing ? '#ffffff' : noteColor;
    noteCtx.lineWidth = noteSize;
  }

  function noteMove(e) {
    if (!noteDrawing || !noteCtx) return;
    e.preventDefault();
    const p = getNotePos(e);
    noteCtx.lineTo(p.x, p.y);
    noteCtx.stroke();
  }

  function noteEnd() {
    if (!noteCtx) return;
    noteDrawing = false;
    noteCtx.closePath();
  }

  function bindNoteCanvas() {
    const canvas = document.getElementById('note-canvas');
    canvas.addEventListener('mousedown', noteStart);
    canvas.addEventListener('mousemove', noteMove);
    window.addEventListener('mouseup', noteEnd);
    canvas.addEventListener('touchstart', noteStart, { passive: false });
    canvas.addEventListener('touchmove', noteMove, { passive: false });
    canvas.addEventListener('touchend', noteEnd);
  }

  function bindViewEvents() {
    view.addEventListener('click', e => {
      const exportBtn = e.target.closest('#btn-export');
      if (exportBtn) { e.stopPropagation(); exportLessons(); return; }

      const infoBtn = e.target.closest('[data-info]');
      if (infoBtn) { e.stopPropagation(); showPhraseExamples(); return; }

      const menuBtn = e.target.closest('[data-menu]');
      if (menuBtn) { e.stopPropagation(); openActionSheet(+menuBtn.dataset.menu, menuBtn.dataset.type); return; }

      const routeBtn = e.target.closest('[data-route]');
      if (routeBtn) { go(JSON.parse(routeBtn.dataset.route)); return; }

      const phrase = e.target.closest('.phrase');
      if (!phrase) return;
      const key = phrase.dataset.key;

      const langLoopBtn = e.target.closest('.loop-lang');
      if (langLoopBtn) {
        e.stopPropagation();
        toggleLangLoop(langLoopBtn.dataset.lang, key);
        return;
      }

      const word = e.target.closest('.word');
      if (word) {
        e.stopPropagation();
        toggleWordLoop(word.dataset.word, word.dataset.lang, key);
        return;
      }

      const [lessonId, idx] = key.split('.').map(Number);
      const found = findLesson(lessonId);
      if (!found) return;
      const p = found.lesson.phrases[idx];

      if (e.target.closest('.loop-btn')) {
        toggleLoop(p, key);
      } else if (e.target.closest('.tts-loop-btn')) {
        toggleTTSLoop(p, key);
      } else if (e.target.closest('.ai-btn')) {
        const query = 'Explain the phrase "' + p.fr + '" in French, Arabic and English. French: ' + p.fr + ' / Arabic: ' + p.ar + ' / English: ' + p.en + ' (without tables)';
        window.open('https://www.google.com/search?q=' + encodeURIComponent(query) + '&udm=50&hl=' + state.uiLang, '_blank');
      } else if (e.target.closest('.media-btn')) {
        openMedia(key);
      } else if (e.target.closest('.note-btn')) {
        openNote(key);
      } else if (e.target.closest('.fav-btn')) {
        toggleFav(key);
        const favBtn = phrase.querySelector('.fav-btn');
        const on = isFav(key);
        favBtn.classList.toggle('fav-on', on);
        favBtn.textContent = on ? '★' : '☆';
      }
    });
  }

  function bindActionSheet() {
    const sheet = document.getElementById('action-sheet');
    document.getElementById('sheet-cancel').onclick = closeActionSheet;
    sheet.addEventListener('click', e => {
      if (e.target === sheet) { closeActionSheet(); return; }
      const edit = e.target.closest('[data-edit]');
      if (edit) { closeActionSheet(); editItem(+edit.dataset.edit, edit.dataset.type); return; }
      const del = e.target.closest('[data-delete-sheet]');
      if (del) {
        closeActionSheet();
        const id = +del.dataset.deleteSheet;
        if (del.dataset.type === 'folder') deleteRootItem(id); else deleteLesson(id);
        return;
      }
      const setImg = e.target.closest('[data-set-image]');
      if (setImg) {
        closeActionSheet();
        const id = +setImg.dataset.setImage;
        const type = setImg.dataset.type;
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.style.display = 'none';
        input.onchange = () => {
          if (input.files && input.files[0]) setItemImage(id, type, input.files[0]);
          input.remove();
        };
        document.body.appendChild(input);
        input.click();
        return;
      }
    });
  }

  async function updateMediaPreview(url) {
    const wrap = document.getElementById('media-preview');
    const img = document.getElementById('media-preview-img');
    const vid = document.getElementById('media-preview-video');
    if (!url) { wrap.style.display = 'none'; img.style.display = 'none'; vid.style.display = 'none'; img.src = ''; vid.src = ''; return; }
    wrap.style.display = 'block';
    if (isIDBMedia(url)) {
      const resolved = await resolveMediaRef(url);
      if (!resolved.url) { img.style.display = 'none'; vid.style.display = 'none'; return; }
      const isVideo = (resolved.type || '').startsWith('video/') || isVideoUrl(resolved.url);
      if (isVideo) {
        img.style.display = 'none'; vid.style.display = 'block'; vid.src = resolved.url; img.src = '';
      } else {
        img.style.display = 'block'; vid.style.display = 'none'; img.src = resolved.url; vid.src = '';
      }
      return;
    }
    const src = toWebUrl(url);
    const yt = youtubeId(src);
    if (isVideoUrl(src)) {
      img.style.display = 'none'; vid.style.display = 'block'; vid.src = src; img.src = '';
    } else if (yt) {
      img.style.display = 'block'; vid.style.display = 'none'; img.src = 'https://img.youtube.com/vi/' + yt + '/0.jpg'; vid.src = '';
    } else {
      img.style.display = 'block'; vid.style.display = 'none'; img.src = src; vid.src = '';
    }
  }

  async function openMedia(key) {
    mediaKey = key;
    mediaFileData = null;
    captionFileData = null;
    const [lessonId, idx] = key.split('.').map(Number);
    const found = findLesson(lessonId);
    const p = found ? found.lesson.phrases[idx] : null;
    const modal = document.getElementById('media-modal');
    const urlInput = document.getElementById('media-url');
    const removeBtn = document.getElementById('btn-remove-media');
    const fileInput = document.getElementById('media-file');
    const captionText = document.getElementById('caption-text');
    const captionFileInput = document.getElementById('caption-file');
    urlInput.value = (p && p.media && !/^data:/.test(p.media) && !/^file:\/\//.test(p.media) && !/^idb:\/\//.test(p.media)) ? p.media : '';
    removeBtn.style.display = (p && p.media) ? 'inline-block' : 'none';
    fileInput.value = '';
    captionFileInput.value = '';
    captionText.value = '';
    if (p && p.captionText) {
      captionFileData = p.captionText;
      captionText.value = p.captionText;
    }
    updateMediaPreview(p ? p.media : null);
    modal.classList.add('show');
  }

  function closeMedia() {
    document.getElementById('media-modal').classList.remove('show');
    mediaKey = null;
    mediaFileData = null;
    captionFileData = null;
    updateMediaPreview(null);
  }

  async function saveMedia() {
    if (!mediaKey) return;
    const [lessonId, idx] = mediaKey.split('.').map(Number);
    const found = findLesson(lessonId);
    if (!found) { closeMedia(); return; }
    const p = found.lesson.phrases[idx];
    let url = mediaFileData || document.getElementById('media-url').value.trim() || (p && p.media);
    if (!url) { closeMedia(); return; }
    if (!/^https?:\/\//.test(url) && !/^data:/.test(url) && !/^file:\/\//.test(url) && !/^idb:\/\//.test(url)) {
      showToast(t('mediaInvalid'));
      return;
    }
    if (p.media && p.media !== url) await deleteMediaRef(p.media);
    p.media = url;
    const captionText = document.getElementById('caption-text').value.trim();
    if (captionText) {
      p.captionText = captionText;
    } else if (p.captionText) {
      delete p.captionText;
    }
    saveLessons();
    closeMedia();
    go(state.route, false);
    showToast(t('saved'));
  }

  async function removeMedia() {
    if (!mediaKey) return;
    if (!confirm(t('confirmRemoveMedia'))) return;
    const [lessonId, idx] = mediaKey.split('.').map(Number);
    const found = findLesson(lessonId);
    if (found) {
      const p = found.lesson.phrases[idx];
      if (p && p.media) await deleteMediaRef(p.media);
      delete p.media;
      if (p && p.captionText) delete p.captionText;
      saveLessons();
      go(state.route, false);
      showToast(t('deleted'));
    }
    closeMedia();
  }

  function bindMediaModal() {
    const modal = document.getElementById('media-modal');
    const fileInput = document.getElementById('media-file');
    const chooseBtn = document.getElementById('btn-choose-media-file');
    const urlInput = document.getElementById('media-url');
    const captionInput = document.getElementById('caption-file');
    const chooseCaptionBtn = document.getElementById('btn-choose-caption-file');
    const captionText = document.getElementById('caption-text');
    document.getElementById('btn-close-media').onclick = closeMedia;
    document.getElementById('btn-save-media').onclick = saveMedia;
    document.getElementById('btn-remove-media').onclick = removeMedia;
    chooseBtn.onclick = () => fileInput.click();
    chooseCaptionBtn.onclick = () => captionInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
        showToast(t('mediaInvalid'));
        fileInput.value = '';
        return;
      }
      try {
        const uri = await storeMedia(file);
        if (uri) {
          mediaFileData = uri;
          await updateMediaPreview(uri);
          urlInput.value = '';
        } else {
          const reader = new FileReader();
          reader.onload = (e) => {
            mediaFileData = e.target.result;
            updateMediaPreview(mediaFileData);
            urlInput.value = '';
          };
          reader.readAsDataURL(file);
        }
      } catch (e) {
        console.error('fileInput onchange', e);
        showToast(t('mediaSaveError'));
      }
    };
    captionInput.onchange = () => {
      const file = captionInput.files && captionInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        captionFileData = e.target.result;
        captionText.value = e.target.result;
      };
      reader.onerror = () => showToast(t('captionParseError'));
      reader.readAsText(file);
    };
    captionText.oninput = (e) => { captionFileData = e.target.value; };
    urlInput.oninput = (e) => { mediaFileData = null; updateMediaPreview(e.target.value.trim()); };
    modal.addEventListener('click', e => { if (e.target === modal) closeMedia(); });
  }

  function go(route, push = true) {
    stopSpeech();
    state.route = route;
    if (push) {
      let hash = '#/';
      if (route.name === 'folder') hash = '#/folder/' + route.folder;
      else if (route.name === 'lesson') hash = '#/lesson/' + route.lesson;
      else if (route.name === 'add-folder') hash = '#/add-folder';
      else if (route.name === 'add-lesson') hash = '#/add-lesson' + (route.folder ? '/' + route.folder : '');
      else if (route.name === 'edit-lesson') hash = '#/edit-lesson/' + route.lesson;
      else if (route.name === 'favs') hash = '#/favs';
      else if (route.name === 'search') hash = '#/search/' + encodeURIComponent(route.q);
      if (location.hash !== hash) location.hash = hash;
    }
    if (route.name === 'home') renderHome();
    else if (route.name === 'folder') renderFolder(route.folder);
    else if (route.name === 'lesson') renderLesson(route.lesson);
    else if (route.name === 'favs') renderFavs();
    else if (route.name === 'search') renderSearch(route.q);
    else if (route.name === 'add-folder') renderAddFolder();
    else if (route.name === 'add-lesson') renderAddLesson(route.folder);
    else if (route.name === 'edit-lesson') renderEditLesson(route.lesson);
    loadMedia();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function parseHash() {
    const h = location.hash || '#/';
    if (h === '#/favs') return { name: 'favs' };
    if (h === '#/add-folder') return { name: 'add-folder' };
    if (h === '#/add-lesson') return { name: 'add-lesson' };
    let m = h.match(/^#\/folder\/(\d+)$/);
    if (m) return { name: 'folder', folder: +m[1] };
    m = h.match(/^#\/lesson\/(\d+)$/);
    if (m) return { name: 'lesson', lesson: +m[1] };
    m = h.match(/^#\/add-lesson\/(\d+)$/);
    if (m) return { name: 'add-lesson', folder: +m[1] };
    m = h.match(/^#\/edit-lesson\/(\d+)$/);
    if (m) return { name: 'edit-lesson', lesson: +m[1] };
    m = h.match(/^#\/search\/(.+)$/);
    if (m) return { name: 'search', q: decodeURIComponent(m[1]) };
    return { name: 'home' };
  }

  function bindBackButton() {
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
      Capacitor.Plugins.App.addListener('backButton', ({ canGoBack }) => {
        if (canGoBack) { history.back(); }
        else if (confirm(t('exitConfirm'))) { Capacitor.Plugins.App.exitApp(); }
      });
    }
  }

  function init() {
    bindBackButton();
    document.getElementById('btn-copy-examples').onclick = copyPhraseExamples;
    document.getElementById('btn-close-examples').onclick = closePhraseExamples;
    document.getElementById('btn-theme').onclick = toggleTheme;
    document.getElementById('btn-stop').onclick = stopSpeech;
    document.getElementById('btn-fav').onclick = () => go({ name: 'favs' });
    document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => setUILang(b.dataset.lang));
    document.getElementById('rate').onchange = e => { state.rate = +e.target.value; stopSpeech(); updateVideoRate(); };
    document.getElementById('loopmode').onchange = e => { state.langs = e.target.value.split(','); stopSpeech(); };
    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim();
      if (q) go({ name: 'search', q: q }, false);
      else go({ name: 'home' }, false);
    });
    window.addEventListener('hashchange', () => { go(parseHash(), false); });
    view.addEventListener('submit', e => {
      if (e.target.id === 'add-lesson-form') { e.preventDefault(); addLesson(); }
      else if (e.target.id === 'add-folder-form') { e.preventDefault(); addFolder(); }
      else if (e.target.id === 'edit-lesson-form') { e.preventDefault(); updateLesson(); }
    });
    view.addEventListener('change', e => {
      if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) {
        importLessons(e.target.files[0]);
        e.target.value = '';
      }
    });
    bindViewEvents();
    bindActionSheet();
    bindNoteCanvas();
    bindMediaModal();
    document.getElementById('btn-save-note').onclick = saveNote;
    document.getElementById('btn-close-note').onclick = closeNote;
    document.getElementById('note-clear').onclick = clearNote;
    document.getElementById('note-erase').onclick = () => { noteErasing = !noteErasing; document.getElementById('note-erase').classList.toggle('active', noteErasing); };
    document.getElementById('note-size').oninput = e => { noteSize = +e.target.value; };
    document.getElementById('note-tools').addEventListener('click', e => {
      const t = e.target.closest('.note-tool');
      if (t) {
        noteColor = t.dataset.color;
        noteErasing = false;
        document.getElementById('note-erase').classList.remove('active');
        document.querySelectorAll('.note-tool').forEach(b => b.classList.remove('active'));
        t.classList.add('active');
      }
    });
    setTheme(state.theme);
    setUILang(state.uiLang);
    ensureBuiltInLesson();
    go(parseHash(), false);
    if (nativeTTS()) checkNativeTTS();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
