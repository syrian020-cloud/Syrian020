<script>
(function () {
  'use strict';

  function isValidLessonItem(it) {
    if (!it || typeof it !== 'object') return false;
    if (it.type === 'folder') return true;
    const hasTitle = it.title && (typeof it.title === 'string' ? it.title.trim() : true);
    return !!(hasTitle || (Array.isArray(it.phrases) && it.phrases.length));
  }

  function sanitizeLessons(list) {
    return list.filter(isValidLessonItem).map(it => {
      if (it.type === 'folder') return { ...it, lessons: (it.lessons || []).filter(isValidLessonItem).map(l => ({ ...l, phrases: l.phrases || [] })) };
      return { ...it, type: it.type || 'lesson', phrases: Array.isArray(it.phrases) ? it.phrases : [] };
    });
  }

  function loadLessons() {
    try {
      const raw = JSON.parse(localStorage.getItem('zeek_lessons') || '[]');
      if (Array.isArray(raw)) {
        if (raw.length && raw[0].phrases && !raw[0].type) {
          return sanitizeLessons(raw.map((l, i) => ({ id: l.id || i + 1, type: 'lesson', custom: true, title: l.title, phrases: l.phrases })));
        }
        return sanitizeLessons(raw);
      }
      return [];
    } catch (e) { return []; }
  }

  function saveLessons() { localStorage.setItem('zeek_lessons', JSON.stringify(LESSONS)); }

  function chooseExport() {
    const modal = document.getElementById('export-modal');
    if (!modal) { exportLessons(); return; }
    modal.querySelector('h3').textContent = t('exportChoiceTitle');
    modal.querySelector('#btn-export-full').textContent = t('exportFull');
    modal.querySelector('#btn-export-lessons').textContent = t('exportLessonsOnly');
    modal.querySelector('#btn-export-cancel').textContent = t('cancel');
    modal.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
    const list = modal.querySelector('#export-lessons-list');
    const row = (key, label, indent) => `<label style="display:flex;align-items:center;gap:0.5rem;padding:0.25rem 0;${indent ? 'padding-inline-start:1.4rem;' : ''}cursor:pointer"><input type="checkbox" class="export-pick" data-key="${key}" checked> <span>${label}</span></label>`;
    list.innerHTML = LESSONS.map(it => {
      if (it.type === 'folder') {
        return row('f:' + it.id, '📁 ' + esc(title(it.title)), false) +
          (it.lessons || []).map(l => row('f:' + it.id + ':' + l.id, '📝 ' + esc(title(l.title)), true)).join('');
      }
      return row('l:' + it.id, '📝 ' + esc(title(it.title)), false);
    }).join('');
    list.onchange = e => {
      const cb = e.target;
      if (!cb.classList.contains('export-pick')) return;
      const key = cb.getAttribute('data-key');
      if (/^f:[^:]+$/.test(key)) list.querySelectorAll(`.export-pick[data-key^="${key}:"]`).forEach(c => { c.checked = cb.checked; });
      else if (key.startsWith('f:')) {
        const fk = key.split(':').slice(0, 2).join(':');
        const kids = [...list.querySelectorAll(`.export-pick[data-key^="${fk}:"]`)];
        const parent = list.querySelector(`.export-pick[data-key="${fk}"]`);
        if (parent) parent.checked = kids.some(c => c.checked);
      }
      updateExportToggle();
    };
    updateExportToggle();
    modal.classList.add('show');
  }

  function updateExportToggle() {
    const btn = document.getElementById('btn-export-toggle-all');
    const picks = [...document.querySelectorAll('#export-lessons-list .export-pick')];
    if (btn) btn.textContent = picks.length && picks.every(c => c.checked) ? t('exportSelectNone') : t('exportSelectAll');
  }

  function selectedExportLessons() {
    const picked = new Set([...document.querySelectorAll('#export-lessons-list .export-pick:checked')].map(c => c.getAttribute('data-key')));
    const out = [];
    LESSONS.forEach(it => {
      if (it.type === 'folder') {
        const kids = (it.lessons || []).filter(l => picked.has('f:' + it.id + ':' + l.id));
        if (kids.length || (picked.has('f:' + it.id) && !(it.lessons || []).length)) out.push({ ...it, lessons: kids });
      } else if (picked.has('l:' + it.id)) out.push(it);
    });
    return out;
  }

  function collectMediaRefs(list) {
    const ids = new Set();
    const add = r => { if (isIDBMedia(r)) ids.add(idbMediaId(r)); };
    const walk = l => {
      add(l.media); add(l.image);
      (l.phrases || []).forEach(p => add(p.media));
      (l.lessons || []).forEach(walk);
    };
    (list || LESSONS).forEach(walk);
    return [...ids];
  }

  function blobToB64(part) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(',')[1] || '');
      fr.onerror = rej;
      fr.readAsDataURL(part);
    });
  }

  function createTextSink(filename, mime) {
    const native = typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
    if (!native) {
      const parts = [];
      return {
        write(str) { parts.push(str); },
        async finish() {
          const url = URL.createObjectURL(new Blob(parts, { type: mime }));
          const a = document.createElement('a');
          a.href = url; a.download = filename; a.style.display = 'none';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        }
      };
    }
    const { Filesystem, Share } = Capacitor.Plugins;
    const Directory = Filesystem.Directory || {};
    const dir = Directory.Cache || 'CACHE';
    const encoding = Filesystem.Encoding && Filesystem.Encoding.UTF8 ? Filesystem.Encoding.UTF8 : 'utf8';
    let queue = Promise.resolve(), started = false, failed = null, buf = '';
    const FLUSH = 4 * 1024 * 1024;
    const flush = () => {
      if (!buf) return;
      const data = buf; buf = '';
      queue = queue.then(async () => {
        if (failed) return;
        if (!started) { started = true; await Filesystem.writeFile({ path: filename, data, directory: dir, encoding, recursive: true }); }
        else await Filesystem.appendFile({ path: filename, data, directory: dir, encoding });
      }).catch(e => { failed = e; console.error('export write failed', e); });
    };
    return {
      write(str) { buf += str; if (buf.length >= FLUSH) flush(); },
      async finish() {
        flush();
        await queue;
        if (failed) throw failed;
        const { uri } = await Filesystem.getUri({ path: filename, directory: dir });
        if (Share && Share.share) await Share.share({ title: 'Zeek lessons', files: [uri], dialogTitle: 'Zeek export' });
      }
    };
  }

  function mediaKind(blob) {
    const type = (blob.type || mimeFromName(blob.name || '') || '').toLowerCase();
    if (type.startsWith('image/')) return 'image';
    if (type.startsWith('video/')) return 'video';
    if (type.startsWith('audio/')) return 'audio';
    return '';
  }

  async function exportLessonsFull(kinds, list) {
    list = list || LESSONS;
    const filename = 'zeek-full-' + new Date().toISOString().slice(0,10) + '.json';
    showToast(t('exportPreparing'), 60000);
    try {
      const sink = createTextSink(filename, 'application/json');
      sink.write('{"zeekExport":1,"lessons":' + JSON.stringify(list) + ',"media":{');
      const ids = collectMediaRefs(list);
      let first = true;
      for (const id of ids) {
        let blob = null;
        try { blob = await getMediaBlob(id); } catch (e) {}
        if (!blob) continue;
        const kind = mediaKind(blob);
        if (kinds && kind && kinds[kind] === false) continue;
        const type = blob.type || mimeFromName(blob.name || '') || 'application/octet-stream';
        sink.write((first ? '' : ',') + JSON.stringify(id) + ':{"type":' + JSON.stringify(type) + ',"name":' + JSON.stringify(blob.name || '') + ',"data":"');
        first = false;
        const STEP = 3 * 1024 * 1024;
        for (let off = 0; off < blob.size; off += STEP) {
          sink.write(await blobToB64(blob.slice(off, Math.min(off + STEP, blob.size))));
        }
        sink.write('"}');
      }
      sink.write('}}');
      await sink.finish();
      showToast(t('exportSuccess'));
    } catch (e) {
      console.error('full export failed', e);
      showToast(e.message || 'Export failed');
    }
  }

  async function b64ToBuffer(b64) {
    try {
      const r = await fetch('data:application/octet-stream;base64,' + b64);
      return await r.arrayBuffer();
    } catch (e) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out.buffer;
    }
  }

  function b64ChunkToBytes(str) {
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function putMediaRecord(db, id, value) {
    await new Promise((resolve, reject) => {
      const tx = db.transaction([MEDIA_STORE_NAME], 'readwrite');
      const req = tx.objectStore(MEDIA_STORE_NAME).put(value, id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
    mediaUrlCache.delete(id);
  }

  async function importMediaMap(media) {
    if (!media || !idbMediaSupported()) return;
    const db = await openMediaDb();
    for (const id of Object.keys(media)) {
      const m = media[id];
      if (!m || typeof m.data !== 'string') continue;
      const value = { data: await b64ToBuffer(m.data), type: m.type || 'application/octet-stream', name: m.name || '' };
      await putMediaRecord(db, id, value);
    }
  }

  // Streams a "with media" export from disk without loading the whole file in memory.
  async function importFullStream(file, onProgress) {
    const db = idbMediaSupported() ? await openMediaDb() : null;
    const decoder = new TextDecoder('utf-8');
    const CHUNK = 4 * 1024 * 1024;
    let off = 0, buf = '', done = false;
    const more = async () => {
      if (off >= file.size) { if (!done) { buf += decoder.decode(); done = true; } return false; }
      const ab = await readFileArrayBuffer(file.slice(off, Math.min(off + CHUNK, file.size)));
      off += ab.byteLength;
      buf += decoder.decode(ab, { stream: true });
      if (onProgress) onProgress(off / file.size);
      return true;
    };
    const needIndex = async (marker, from) => {
      let idx;
      while ((idx = buf.indexOf(marker, from)) === -1) { if (!(await more())) return -1; }
      return idx;
    };
    const skipWs = async () => {
      for (;;) {
        buf = buf.replace(/^\s+/, '');
        if (buf.length) return;
        if (!(await more())) return;
      }
    };

    // Header: {"zeekExport":1,"lessons":[...],"media":{
    let lessons = null, searchFrom = 0;
    for (;;) {
      const idx = await needIndex(',"media":{', searchFrom);
      if (idx === -1) throw new Error('invalid');
      try {
        const head = JSON.parse(buf.slice(0, idx) + '}');
        if (!head || !Array.isArray(head.lessons)) throw new Error('invalid');
        lessons = head.lessons;
        buf = buf.slice(idx + ',"media":{'.length);
        break;
      } catch (e) { searchFrom = idx + 1; }
    }

    // Media entries: "id":{"type":"..","name":"..","data":"BASE64"}
    for (;;) {
      await skipWs();
      if (buf[0] === '}') break;
      if (buf[0] === ',') { buf = buf.slice(1); continue; }
      const di = await needIndex(',"data":"', 0);
      if (di === -1) throw new Error('invalid');
      const metaObj = JSON.parse('{' + buf.slice(0, di) + '}}');
      const id = Object.keys(metaObj)[0];
      const meta = metaObj[id] || {};
      buf = buf.slice(di + ',"data":"'.length);
      const parts = [];
      for (;;) {
        const q = buf.indexOf('"');
        if (q !== -1) {
          if (q) parts.push(b64ChunkToBytes(buf.slice(0, q)));
          buf = buf.slice(q + 1);
          break;
        }
        const take = buf.length - (buf.length % 4);
        if (take) { parts.push(b64ChunkToBytes(buf.slice(0, take))); buf = buf.slice(take); }
        if (!(await more())) throw new Error('invalid');
      }
      await skipWs();
      if (buf[0] === '}') buf = buf.slice(1);
      if (db) {
        const blob = new Blob(parts, { type: meta.type || 'application/octet-stream' });
        await putMediaRecord(db, id, { data: blob, type: blob.type, name: meta.name || '' });
      }
      parts.length = 0;
    }
    return lessons;
  }

  async function exportLessons(list) {
    const data = JSON.stringify(list || LESSONS, null, 2);
    const filename = 'zeek-lessons-' + new Date().toISOString().slice(0,10) + '.json';
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem) {
      try {
        const { Filesystem, Share } = Capacitor.Plugins;
        const Directory = Filesystem.Directory || {};
        const dir = Directory.Cache || 'CACHE';
        const encoding = Filesystem.Encoding && Filesystem.Encoding.UTF8 ? Filesystem.Encoding.UTF8 : 'utf8';
        await Filesystem.writeFile({ path: filename, data: data, directory: dir, encoding: encoding });
        const { uri } = await Filesystem.getUri({ path: filename, directory: dir });
        if (Share && Share.share) {
          await Share.share({ title: 'Zeek lessons', files: [uri], dialogTitle: 'Zeek JSON' });
        }
        showToast(t('exportSuccess'));
        return;
      } catch (e) { console.error('Capacitor export failed', e); showToast(e.message || 'Export failed'); return; }
    }
    const blobUrl = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    showToast(t('exportSuccess'));
  }

  async function importLessons(file) {
    if (!file) return;
    const applyLessons = data => {
      const incoming = sanitizeLessons(data).map((it, i) => ({ ...it, id: it.id || (Date.now() + i) }));
      const merged = LESSONS.slice();
      incoming.forEach(it => {
        const idx = it.protected
          ? merged.findIndex(x => x.protected && (x.type || 'lesson') === 'lesson')
          : merged.findIndex(x => x.id === it.id && (x.type || 'lesson') === (it.type || 'lesson'));
        if (it.protected && idx !== -1) it.id = merged[idx].id;
        if (idx === -1) { merged.push(it); return; }
        if (it.type === 'folder') {
          const kids = (merged[idx].lessons || []).slice();
          (it.lessons || []).forEach(l => {
            const k = kids.findIndex(x => x.id === l.id);
            if (k === -1) kids.push(l); else kids[k] = l;
          });
          merged[idx] = { ...merged[idx], ...it, lessons: kids };
        } else merged[idx] = it;
      });
      LESSONS = merged;
      ensureBuiltInLesson();
      saveLessons();
      go({ name: 'home' }, false);
      showToast(t('importSuccess'));
    };
    try {
      const headText = new TextDecoder('utf-8').decode(await readFileArrayBuffer(file.slice(0, 64)));
      const isFull = /^\s*\{\s*"zeekExport"/.test(headText);
      if (isFull) {
        if (!confirm(t('importConfirm'))) return;
        showToast(t('exportPreparing'), 600000);
        try {
          const lessons = await importFullStream(file, p => showToast(t('exportPreparing') + ' ' + Math.round(p * 100) + '%', 600000));
          applyLessons(lessons);
          return;
        } catch (err) {
          console.error('stream import failed, falling back', err);
          if (file.size > 200 * 1024 * 1024) throw err;
        }
      }
      const text = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = () => reject(reader.error || 'read error');
        reader.readAsText(file);
      });
      const parsed = JSON.parse(text);
      const full = parsed && !Array.isArray(parsed) && parsed.zeekExport && Array.isArray(parsed.lessons);
      const data = full ? parsed.lessons : parsed;
      if (!Array.isArray(data)) throw new Error('invalid');
      if (!confirm(t('importConfirm'))) return;
      if (full) { try { await importMediaMap(parsed.media); } catch (err) { console.error('import media', err); } }
      applyLessons(data);
    } catch (err) {

      const where = err && err.stack ? String(err.stack).split('\n').slice(1, 2).join('').trim() : '';
      showToast(t('importError') + (err && err.message ? ': ' + err.message : '') + (where ? ' @ ' + where : ''), 8000);

  }

  function showToast(msg, duration = 2200) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    if (el._timer) clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), duration);
  }

  function cleanPhrasePart(s) {
    let r = String(s).trim();
    const trim = '*–—-:=;';
    while (r && trim.includes(r[0])) r = r.slice(1).trim();
    while (r && trim.includes(r[r.length - 1])) r = r.slice(0, -1).trim();
    return r;
  }

  function extractRawParts(line) {
    const cleanLine = String(line).trim();
    if (!cleanLine) return null;
    const delims = /\s*(?:\|{1,2}|,|;|=>|->|→|=|:|\s+-\s+|\s+)\s*/;
    const tokens = cleanLine.split(delims).map(s => s.trim()).filter(Boolean);
    if (tokens.length < 3) return null;
    const isAr = s => /[\u0600-\u06FF]/.test(s);
    const firstAr = tokens.findIndex(isAr);
    if (firstAr === -1) return null;
    const lastAr = tokens.length - 1 - [...tokens].reverse().findIndex(isAr);
    return {
      first: tokens.slice(0, firstAr).join(' '),
      ar: tokens.slice(firstAr, lastAr + 1).join(' '),
      last: tokens.slice(lastAr + 1).join(' ')
    };
  }

  function classifyLatinLang(s) {
    const text = String(s).trim();
    if (!text || /[\u0600-\u06FF]/.test(text)) return '';
    const lower = text.toLowerCase();
    if (/[éèêàâäæçíïîìôöòûüùœ]/.test(lower)) return 'fr';
    const enMatch = lower.match(/\b(the|a|an|and|or|is|are|am|was|were|be|been|have|has|had|do|does|did|will|would|could|should|may|might|can|this|that|these|those|my|your|his|her|its|our|their|in|on|at|to|for|with|of|from|by|about|into|through|during|before|after|i|you|he|she|we|they|it|me|him|them|us|there|here|where|what|when|why|how|all|some|no|not|yes|please|thank|thanks|very|much|more|less)\b/g);
    const frMatch = lower.match(/\b(le|la|les|l'|un|une|des|du|de|d'|et|ou|en|je|tu|il|elle|nous|vous|ils|elles|est|sont|ai|as|a|avons|avez|ont|avoir|faire|suis|es|sommes|etes|êtes|mon|ma|mes|ton|ta|tes|son|sa|ses|ce|cet|cette|ces|que|qui|quoi|pour|avec|dans|sur|par|sous|contre|vers|avant|après|plus|moins|très|bien|oui|non|merci|s'il|te|me|se|lui|y|en|où|dont|quand|comment|pourquoi|parce|car|si|quel|quelle|quels|quelles)\b/g);
    const enWords = enMatch ? enMatch.length : 0;
    const frWords = frMatch ? frMatch.length : 0;
    if (enWords > frWords) return 'en';
    if (frWords > enWords) return 'fr';
    const words = lower.split(/[^a-z0-9'àâäæçéèêëïîôùûüœ'-]+/i).filter(Boolean);
    const frHints = new Set(['vagin','vulve','clitoris','lèvres','grandes','petites','utérus','ovaires','seins','mamelons','col','hymen','mont','vénus','périnée','trompes','fallope','anus','pénis','gland','prépuce','testicules','scrotum','prostate','point']);
    const enHints = new Set(['vagina','vulva','labia','majora','minora','uterus','womb','ovaries','breasts','nipples','cervix','mons','pubis','perineum','fallopian','tubes','penis','glans','foreskin','testicles','balls','scrotum','prostate','g-spot']);
    let frAny = false, enAny = false;
    words.forEach(w => { if (frHints.has(w)) frAny = true; if (enHints.has(w)) enAny = true; });
    if (frAny && !enAny) return 'fr';
    if (enAny && !frAny) return 'en';
    return '';
  }

  function getLineOrder(first, last, blockOrder) {
    const langFirst = classifyLatinLang(first);
    const langLast = classifyLatinLang(last);
    if (langFirst === 'fr' && langLast !== 'fr') return 'fr-ar-en';
    if (langFirst === 'en' && langLast !== 'en') return 'en-ar-fr';
    if (langLast === 'fr' && langFirst !== 'fr') return 'en-ar-fr';
    if (langLast === 'en' && langFirst !== 'en') return 'fr-ar-en';
    return blockOrder;
  }

  function detectBlockOrder(text) {
    let firstFr = 0, firstEn = 0, lastFr = 0, lastEn = 0;
    text.split('\n').forEach(raw => {
      const parts = extractRawParts(raw);
      if (!parts) return;
      const first = cleanPhrasePart(parts.first);
      const last = cleanPhrasePart(parts.last);
      const langFirst = classifyLatinLang(first);
      const langLast = classifyLatinLang(last);
      if (langFirst === 'fr') firstFr++; else if (langFirst === 'en') firstEn++;
      if (langLast === 'fr') lastFr++; else if (langLast === 'en') lastEn++;
    });
    if (firstEn > firstFr && lastFr >= lastEn) return 'en-ar-fr';
    if (firstFr > firstEn && lastEn >= lastFr) return 'fr-ar-en';
    if (firstEn > 0 && lastFr > 0) return 'en-ar-fr';
    if (firstFr > 0 && lastEn > 0) return 'fr-ar-en';
    return 'fr-ar-en';
  }

  function formatTitle(obj) {
    if (!obj) return '';
    const seen = new Set();
    const parts = [];
    [obj.fr, obj.ar, obj.en].forEach(v => { if (v && !seen.has(v)) { seen.add(v); parts.push(v); } });
    return parts.join(' | ');
  }

  function parseTitle(text) {
    const s = String(text).trim();
    if (!s) return null;
    const delims = /\s*\|\s*/;
    const hasDelimiter = s.includes('|');
    if (!hasDelimiter) return { fr: s, ar: s, en: s };
    const p = parsePhrases(s, 'auto');
    if (p && p[0]) return p[0];
    const tokens = s.split(delims).map(x => x.trim()).filter(Boolean);
    if (!tokens.length) return null;
    if (tokens.length === 1) {
      const v = tokens[0];
      return { fr: v, ar: v, en: v };
    }
    let fr = '', ar = '', en = '';
    tokens.forEach(tok => {
      if (/[\u0600-\u06FF]/.test(tok)) { if (!ar) ar = tok; }
      else {
        const lang = classifyLatinLang(tok);
        if (lang === 'en' && !en) en = tok;
        else if (lang === 'fr' && !fr) fr = tok;
        else if (!fr) fr = tok;
        else if (!en) en = tok;
      }
    });
    if (!fr && !ar && !en) return null;
    return { fr, ar, en };
  }

  const FLAG_RE = /^\s*([\u{1F1E6}-\u{1F1FF}]{2})\s*/u;
  function flagLang(flag, txt) {
    if (/[\u0600-\u06FF]/.test(txt)) return 'ar';
    if (flag === '🇫🇷' || flag === '🇧🇪' || flag === '🇨🇭' || flag === '🇨🇦') return 'fr';
    if (flag === '🇺🇸' || flag === '🇬🇧' || flag === '🇦🇺') return 'en';
    return classifyLatinLang(txt) || 'fr';
  }
  function parsePhrases(text, userOrder = 'auto') {
    const phrases = [];
    const plain = text.split('\n').filter(l => !FLAG_RE.test(l)).join('\n');
    const blockOrder = (userOrder === 'auto') ? detectBlockOrder(plain) : userOrder;
    let cur = {};
    const flush = () => { if (cur.fr && cur.ar && cur.en) phrases.push(cur); cur = {}; };
    text.split('\n').forEach(raw => {
      const m = raw.trim().match(FLAG_RE);
      if (m) {
        const body = cleanPhrasePart(raw.trim().slice(m[0].length));
        if (!body) return;
        const lang = flagLang(m[1], body);
        if (cur[lang]) flush();
        cur[lang] = m[1] + ' ' + body;
        return;
      }
      flush();
      const parts = extractRawParts(raw);
      if (!parts) return;
      const ar = cleanPhrasePart(parts.ar);
      const first = cleanPhrasePart(parts.first);
      const last = cleanPhrasePart(parts.last);
      if (!ar || !first || !last) return;
      const lineOrder = getLineOrder(first, last, blockOrder);
      let fr, en;
      if (lineOrder === 'en-ar-fr') { en = first; fr = last; }
      else { fr = first; en = last; }
      phrases.push({ fr, ar, en });
    });
    flush();
    return phrases;
  }

  function ensureBuiltInLesson() {
    const builtIn = JSON.parse(JSON.stringify(BIENVENUE_LESSON));
    const existing = LESSONS.find(it => it.type === 'lesson' && it.protected);
    if (existing) {
      existing.title = builtIn.title;
      const oldMedia = existing.phrases.map(p => p.media);
      const oldCaptions = existing.phrases.map(p => p.captionText);
      existing.phrases = builtIn.phrases;
      existing.phrases.forEach((p, i) => {
        if (oldMedia[i]) p.media = oldMedia[i];
        if (oldCaptions[i]) p.captionText = oldCaptions[i];
      });
      if (!existing.image) existing.image = builtIn.image;
    } else {
      builtIn.id = nextId();
      LESSONS.unshift(builtIn);
    }
    saveLessons();
  }

  function nextId() {
    let max = 0;
    LESSONS.forEach(it => {
      if (it.id > max) max = it.id;
      if (it.type === 'folder') (it.lessons || []).forEach(l => { if (l.id > max) max = l.id; });
    });
    return max + 1;
  }

  function findItem(id) { return LESSONS.find(it => it.id === id); }

  function findFolder(id) { return LESSONS.find(it => it.type === 'folder' && it.id === id); }

  function findLesson(id) {
    const root = LESSONS.find(it => it.type === 'lesson' && it.id === id);
    if (root) return { lesson: root, parent: null };
    for (let i = 0; i < LESSONS.length; i++) {
      const f = LESSONS[i];
      if (f.type === 'folder') {
        const l = (f.lessons || []).find(x => x.id === id);
        if (l) return { lesson: l, parent: f };
      }
    }
    return null;
  }

  function getAllLessons() {
    const all = [];
    LESSONS.forEach(it => {
      if (it.type === 'lesson') all.push({ lesson: it, parent: null });
      else if (it.type === 'folder') (it.lessons || []).forEach(l => all.push({ lesson: l, parent: it }));
    });
    return all;
  }

    const v = UI[key];

  function title(obj) {
    return (obj && obj[state.uiLang]) || (obj && obj.fr) || (obj && obj.en) || (obj && obj.ar) || '';
  }

  function subtitle(obj) {
    if (!obj) return '';
    const seen = new Set();
    const parts = [];
    [obj.fr, obj.ar, obj.en].forEach(v => { if (v && !seen.has(v)) { seen.add(v); parts.push(esc(v)); } });
    return parts.join(' · ');
  }

  function cycleCaptionTheme() {

  function cycleCaptionFont() {

    localStorage.setItem('zeek_caption_font', state.captionFont);
    applyCaptionSettings();

  function adjustCaptionZoom(delta) {
    state.captionZoom = Math.max(0.5, Math.min(2, state.captionZoom + delta));
    localStorage.setItem('zeek_caption_zoom', state.captionZoom);
    applyCaptionSettings();
  }

  function applyTranslations() {

    document.querySelectorAll('[data-t]').forEach(el => {
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = t(el.dataset.t);

  function setUILang(lang) {

  function setTheme(theme) {
    state.theme = theme;

  const THEME_ORDER = ['dark','light','sepia','paper','mint','sky','lavender','graphite','forest','ocean','nord','coffee'];
  const THEME_LIGHT = ['light','sepia','paper','mint','sky','lavender'];
  const THEME_NAMES = { dark: 'Dark', light: 'Light', sepia: 'Sepia', paper: 'Paper', mint: 'Mint', sky: 'Sky', lavender: 'Lavender', graphite: 'Graphite', forest: 'Forest', ocean: 'Ocean', nord: 'Nord', coffee: 'Coffee' };
  function toggleTheme() {

    const next = THEME_ORDER[(i + 1) % THEME_ORDER.length];
    setTheme(next);
    showToast('🎨 ' + THEME_NAMES[next]);
