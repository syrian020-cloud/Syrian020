      if (edit) { closeActionSheet(); editItem(+edit.dataset.edit, edit.dataset.type); return; }
      const mv = e.target.closest('[data-move]');
      if (mv) { openMoveSheet(+mv.dataset.move); return; }
      const mvTo = e.target.closest('[data-move-to]');
      if (mvTo) { closeActionSheet(); moveLesson(+mvTo.dataset.lesson, mvTo.dataset.moveTo === 'root' ? 'root' : +mvTo.dataset.moveTo); return; }
      const del = e.target.closest('[data-delete-sheet]');
      if (del) {
        closeActionSheet();
        const id = +del.dataset.deleteSheet;
        if (del.dataset.type === 'folder') deleteRootItem(id); else deleteLesson(id);
        return;
      }
      const setImg = e.target.closest('[data-set-image]');
      if (setImg) {
        closeActionSheet();
        const id = +setImg.dataset.setImage;
        const type = setImg.dataset.type;
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.style.display = 'none';
        input.onchange = () => {
          if (input.files && input.files[0]) setItemImage(id, type, input.files[0]);
          input.remove();
        };
        document.body.appendChild(input);
        input.click();
        return;
      }
    });
  }

  async function updateMediaPreview(url) {
    const wrap = document.getElementById('media-preview');
    const img = document.getElementById('media-preview-img');
    const vid = document.getElementById('media-preview-video');
    if (!url) { wrap.style.display = 'none'; img.style.display = 'none'; vid.style.display = 'none'; img.src = ''; vid.src = ''; return; }
    wrap.style.display = 'block';
    if (isIDBMedia(url)) {
      const resolved = await resolveMediaRef(url);
      if (!resolved.url) { img.style.display = 'none'; vid.style.display = 'none'; return; }
      const isVideo = (resolved.type || '').startsWith('video/') || (resolved.type || '').startsWith('audio/') || isVideoUrl(resolved.url) || isAudioUrl(resolved.url);
      if (isVideo) {
        img.style.display = 'none'; vid.style.display = 'block'; vid.src = resolved.url; img.src = '';
      } else {
        img.style.display = 'block'; vid.style.display = 'none'; img.src = resolved.url; vid.src = '';
      }
      return;
    }
    const src = toWebUrl(url);
    const yt = youtubeId(src);
    if (isVideoUrl(src) || isAudioUrl(src)) {
      img.style.display = 'none'; vid.style.display = 'block'; vid.src = src; img.src = '';
    } else if (yt) {
      img.style.display = 'block'; vid.style.display = 'none'; img.src = 'https://img.youtube.com/vi/' + yt + '/0.jpg'; vid.src = '';
    } else {
      img.style.display = 'block'; vid.style.display = 'none'; img.src = src; vid.src = '';
    }
  }

  async function openMedia(key) {
    mediaKey = key;
    mediaScrollY = window.scrollY;
    mediaFileData = null;
    mediaFileType = null;
    captionFileData = null;
    const [lessonId, idx] = key.split('.').map(Number);
    const found = findLesson(lessonId);
    const p = found ? found.lesson.phrases[idx] : null;
    const isImage = p && p.media && (p.mediaType === 'image' || await isImageMediaRef(p.media));
    const existingMedia = (p && p.media && !isImage) ? p.media : null;
    const modal = document.getElementById('media-modal');
    const urlInput = document.getElementById('media-url');
    const removeBtn = document.getElementById('btn-remove-media');
    const fileInput = document.getElementById('media-file');
    const captionText = document.getElementById('caption-text');
    const captionFileInput = document.getElementById('caption-file');
    const audioUrlInput = document.getElementById('media-audio-url');
    const isPlainUrl = existingMedia && !/^data:/.test(existingMedia) && !/^file:\/\//.test(existingMedia) && !/^idb:\/\//.test(existingMedia);
    const existingIsAudio = isPlainUrl && isAudioUrl(existingMedia);
    urlInput.value = (isPlainUrl && !existingIsAudio) ? existingMedia : '';
    audioUrlInput.value = existingIsAudio ? existingMedia : '';
    removeBtn.style.display = existingMedia ? 'inline-block' : 'none';
    fileInput.value = '';
    document.getElementById('media-audio-file').value = '';
    captionFileInput.value = '';
    captionText.value = '';
    if (p && p.captionText) {
      captionFileData = p.captionText;
      captionText.value = p.captionText;
    }
    await updateMediaPreview(existingMedia);
    modal.classList.add('show');
  }

  function closeMedia() {
    document.getElementById('media-modal').classList.remove('show');
    mediaKey = null;
    mediaFileData = null;
    mediaFileType = null;
    captionFileData = null;
    updateMediaPreview(null);
  }

  async function saveMedia() {
    if (!mediaKey) return;
    const [lessonId, idx] = mediaKey.split('.').map(Number);
    const found = findLesson(lessonId);
    if (!found) { closeMedia(); return; }
    const p = found.lesson.phrases[idx];
    const urlInput = document.getElementById('media-url').value.trim() || document.getElementById('media-audio-url').value.trim();
    const newVideo = mediaFileData || urlInput;
    let url = newVideo || (p && p.media);
    const captionText = document.getElementById('caption-text').value.trim();
    if (!url && !captionText) { closeMedia(); return; }
    if (url && !/^https?:\/\//.test(url) && !/^data:/.test(url) && !/^file:\/\//.test(url) && !/^idb:\/\//.test(url)) {
      showToast(t('mediaInvalid'));
      return;
    }
    if (url) {
      if (p.media && p.media !== url) await deleteMediaRef(p.media);
      p.media = url;
      if (newVideo) p.mediaType = (mediaFileType === 'audio' || (!mediaFileData && isAudioUrl(url))) ? 'audio' : 'video';
    }
    if (captionText) {
      p.captionText = captionText;
    } else if (p.captionText) {
      delete p.captionText;
    }
    saveLessons();
    closeMedia();
    go(state.route, false);
    restoreMediaScroll();
    showToast(t('saved'));
  }

  async function removeMedia() {
    if (!mediaKey) return;
    if (!confirm(t('confirmRemoveMedia'))) return;
    const [lessonId, idx] = mediaKey.split('.').map(Number);
    const found = findLesson(lessonId);
    if (found) {
      const p = found.lesson.phrases[idx];
      const isImage = p && p.media && (p.mediaType === 'image' || await isImageMediaRef(p.media));
      if (p && p.media && !isImage) {
        await deleteMediaRef(p.media);
        delete p.media;
        delete p.mediaType;
      }
      if (p && p.captionText) delete p.captionText;
      saveLessons();
      go(state.route, false);
      restoreMediaScroll();
      showToast(t('deleted'));
    }
    closeMedia();
  }

  async function openImageForPhrase(key) {
    const [lessonId, idx] = key.split('.').map(Number);
    const found = findLesson(lessonId);
    const p = found ? found.lesson.phrases[idx] : null;
    if (!p) return;
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.style.display = 'none';
    input.onchange = async () => {
      const file = input.files && input.files[0];
      input.remove();
      if (!file || !isImageFile(file)) { showToast(t('invalidImage')); return; }
      try {
        const uri = await storeMedia(file) || await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = e => resolve(e.target.result);
          r.onerror = reject;
          r.readAsDataURL(file);
        });
        if (p.media) await deleteMediaRef(p.media);
        p.media = uri;
        p.mediaType = 'image';
        saveLessons();
        showToast(t('saved'));
        go(state.route, false);
      } catch (e) {
        console.error('openImageForPhrase', e);
        showToast(t('mediaSaveError'));
      }
    };
    document.body.appendChild(input);
    input.click();
  }

  function bindExportModal() {
    const modal = document.getElementById('export-modal');
    if (!modal) return;
    const close = () => modal.classList.remove('show');
    document.getElementById('btn-export-full').onclick = () => {
      const kinds = {
        image: document.getElementById('export-kind-image').checked,
        video: document.getElementById('export-kind-video').checked,
        audio: document.getElementById('export-kind-audio').checked
      };
      const list = selectedExportLessons();
      if (!list.length) { showToast(t('exportNothingSelected')); return; }
      close();
      exportLessonsFull(kinds, list);
    };
    document.getElementById('btn-export-lessons').onclick = () => {
      const list = selectedExportLessons();
      if (!list.length) { showToast(t('exportNothingSelected')); return; }
      close();
      exportLessons(list);
    };
    document.getElementById('btn-export-toggle-all').onclick = () => {
      const picks = [...document.querySelectorAll('#export-lessons-list .export-pick')];
      const all = picks.length && picks.every(c => c.checked);
      picks.forEach(c => { c.checked = !all; });
      updateExportToggle();
    };
    document.getElementById('btn-export-cancel').onclick = close;
    modal.addEventListener('click', e => { if (e.target === modal) close(); });
  }

  function bindMediaModal() {
    const modal = document.getElementById('media-modal');
    const fileInput = document.getElementById('media-file');
    const chooseBtn = document.getElementById('btn-choose-media-file');
    const urlInput = document.getElementById('media-url');
    const audioFileInput = document.getElementById('media-audio-file');
    const chooseAudioBtn = document.getElementById('btn-choose-media-audio');
    const audioUrlInput = document.getElementById('media-audio-url');
    const captionInput = document.getElementById('caption-file');
    const chooseCaptionBtn = document.getElementById('btn-choose-caption-file');
    const captionText = document.getElementById('caption-text');
    document.getElementById('btn-close-media').onclick = closeMedia;
    document.getElementById('btn-save-media').onclick = saveMedia;
    document.getElementById('btn-remove-media').onclick = removeMedia;
    chooseBtn.onclick = () => fileInput.click();
    chooseAudioBtn.onclick = () => audioFileInput.click();
    chooseCaptionBtn.onclick = () => captionInput.click();
    const onMediaFile = (input, check, kind) => async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!check(file)) {
        showToast(t('mediaInvalid'));
        input.value = '';
        return;
      }
      try {
        const uri = await storeMedia(file);
        if (uri) {
          mediaFileData = uri;
          mediaFileType = kind;
          await updateMediaPreview(uri);
          urlInput.value = '';
          audioUrlInput.value = '';
        } else {
          const reader = new FileReader();
          reader.onload = (e) => {
            mediaFileData = e.target.result;
            mediaFileType = kind;
            updateMediaPreview(mediaFileData);
            urlInput.value = '';
            audioUrlInput.value = '';
          };
          reader.onerror = () => showToast(t('mediaSaveError'));
          reader.readAsDataURL(file);
        }
      } catch (e) {
        console.error('fileInput onchange', e);
        showToast(t('mediaSaveError'));
      }
    };
    fileInput.onchange = onMediaFile(fileInput, isVideoFile, 'video');
    audioFileInput.onchange = onMediaFile(audioFileInput, isAudioFile, 'audio');
    captionInput.onchange = () => {
      const file = captionInput.files && captionInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        captionFileData = e.target.result;
        captionText.value = e.target.result;
      };
      reader.onerror = () => showToast(t('captionParseError'));
      reader.readAsText(file);
    };
    captionText.oninput = (e) => { captionFileData = e.target.value; };
    urlInput.oninput = (e) => { mediaFileData = null; mediaFileType = null; audioUrlInput.value = ''; updateMediaPreview(e.target.value.trim()); };
    audioUrlInput.oninput = (e) => { mediaFileData = null; mediaFileType = null; urlInput.value = ''; updateMediaPreview(e.target.value.trim()); };
    modal.addEventListener('click', e => { if (e.target === modal) closeMedia(); });
  }

  const scrollMemo = {};
  const routeKey = r => JSON.stringify(r);
  function go(route, push = true) {
    stopSpeech(true);
    const prevKey = routeKey(state.route);
    scrollMemo[prevKey] = window.scrollY;
    const sameRoute = !push && routeKey(route) === prevKey;
    const restoreY = sameRoute ? window.scrollY : (push ? 0 : (scrollMemo[routeKey(route)] || 0));
    state.route = route;
    if (push) {
      let hash = '#/';
      if (route.name === 'folder') hash = '#/folder/' + route.folder;
      else if (route.name === 'lesson') hash = '#/lesson/' + route.lesson;
      else if (route.name === 'add-folder') hash = '#/add-folder';
      else if (route.name === 'add-lesson') hash = '#/add-lesson' + (route.folder ? '/' + route.folder : '');
      else if (route.name === 'edit-lesson') hash = '#/edit-lesson/' + route.lesson;
      else if (route.name === 'search') hash = '#/search/' + encodeURIComponent(route.q);
      if (location.hash !== hash) location.hash = hash;
    }
    if (route.name === 'home') renderHome();
    else if (route.name === 'folder') renderFolder(route.folder);
    else if (route.name === 'lesson') renderLesson(route.lesson);
    else if (route.name === 'search') renderSearch(route.q);
    else if (route.name === 'add-folder') renderAddFolder();
    else if (route.name === 'add-lesson') renderAddLesson(route.folder);
    else if (route.name === 'edit-lesson') renderEditLesson(route.lesson);
    loadMedia();
    if (restoreY) requestAnimationFrame(() => window.scrollTo({ top: restoreY, behavior: 'auto' }));
    else window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function parseHash() {
    const h = location.hash || '#/';
    if (h === '#/add-folder') return { name: 'add-folder' };
    if (h === '#/add-lesson') return { name: 'add-lesson' };
    let m = h.match(/^#\/folder\/(\d+)$/);
    if (m) return { name: 'folder', folder: +m[1] };
    m = h.match(/^#\/lesson\/(\d+)$/);
    if (m) return { name: 'lesson', lesson: +m[1] };
    m = h.match(/^#\/add-lesson\/(\d+)$/);
    if (m) return { name: 'add-lesson', folder: +m[1] };
    m = h.match(/^#\/edit-lesson\/(\d+)$/);
    if (m) return { name: 'edit-lesson', lesson: +m[1] };
    m = h.match(/^#\/search\/(.+)$/);
    if (m) return { name: 'search', q: decodeURIComponent(m[1]) };
    return { name: 'home' };
  }

  function bindBackButton() {
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
      Capacitor.Plugins.App.addListener('backButton', ({ canGoBack }) => {
        const noteModal = document.getElementById('note-modal');
        if (noteModal && noteModal.classList.contains('show')) {
          if (noteKey && noteCtx) saveNote(); else closeNote();
          return;
        }
        if (canGoBack) { history.back(); }
        else if (confirm(t('exitConfirm'))) { Capacitor.Plugins.App.exitApp(); }
      });
    }
  }

  function init() {
    bindBackButton();
    document.getElementById('btn-copy-examples').onclick = copyPhraseExamples;
    document.getElementById('btn-close-examples').onclick = closePhraseExamples;
    document.getElementById('btn-caption-examples').onclick = showCaptionExamples;
    const lessonCapExBtn = document.getElementById('btn-lesson-caption-examples');
    if (lessonCapExBtn) lessonCapExBtn.onclick = showCaptionExamples;
    document.getElementById('btn-close-caption-examples').onclick = closeCaptionExamples;
    const captionExamplesModal = document.getElementById('caption-examples-modal');
    if (captionExamplesModal) {
      captionExamplesModal.addEventListener('click', e => {
        if (e.target === captionExamplesModal) { closeCaptionExamples(); return; }
        const copyBtn = e.target.closest('.copy-ex');
        if (copyBtn) { copyCaptionExample(+copyBtn.dataset.i); }
      });
    }
    document.getElementById('btn-theme').onclick = toggleTheme;
    document.getElementById('btn-stop').onclick = stopAll;
    document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => setUILang(b.dataset.lang));
    document.getElementById('rate').onchange = e => { state.rate = +e.target.value; stopSpeech(); updateVideoRate(); };
    document.getElementById('loopmode').onchange = e => { state.langs = e.target.value.split(','); stopSpeech(); };
    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim();
      if (q) go({ name: 'search', q: q }, false);
      else go({ name: 'home' }, false);
    });
    window.addEventListener('hashchange', () => { go(parseHash(), false); });
    view.addEventListener('submit', e => {
      if (e.target.id === 'add-lesson-form') { e.preventDefault(); addLesson(); }
      else if (e.target.id === 'add-folder-form') { e.preventDefault(); addFolder(); }
      else if (e.target.id === 'edit-lesson-form') { e.preventDefault(); updateLesson(); }
    });
    view.addEventListener('change', e => {
      if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) {
        importLessons(e.target.files[0]);
        e.target.value = '';
      }
      const sel = e.target.closest('.aspect-select');
      if (sel && sel.classList.contains('image-aspect')) {
        const wrap = sel.closest('.media-image-wrap');
        saveVideoAspect(wrap.dataset.mediaRef, sel.value);
        ['ar-9-16','ar-16-9','ar-4-3','ar-3-4','ar-3-2','ar-1-1','ar-4-5'].forEach(c => wrap.classList.remove(c));
        const cls = aspectClassFor(sel.value);
        if (cls) wrap.classList.add(cls);
      } else if (sel) setVideoAspect(sel.closest('.phrase-media'), sel.value);
    });
    bindViewEvents();
    bindActionSheet();
    bindNoteCanvas();
    bindMediaModal();
    bindExportModal();
    document.getElementById('btn-save-note').onclick = saveNote;
    document.getElementById('btn-close-note').onclick = () => { if (noteKey && noteCtx) saveNote(); else closeNote(); };
    document.getElementById('note-clear').onclick = clearNote;
    document.getElementById('note-erase').onclick = () => setNoteTool('erase');
    document.getElementById('note-hl').onclick = () => setNoteTool('hl');
    document.getElementById('note-undo').onclick = undoNote;
    document.getElementById('note-redo').onclick = redoNote;
    document.getElementById('note-size-dec').onclick = () => setNoteSize(noteSize - 1);
    document.getElementById('note-size-inc').onclick = () => setNoteSize(noteSize + 1);
    document.getElementById('note-pen').onclick = () => { setNoteTool('pen'); document.getElementById('note-palette').classList.toggle('show'); };
    document.getElementById('note-swatch').onclick = () => document.getElementById('note-palette').classList.toggle('show');
    document.getElementById('note-paper').onclick = () => {
      const lined = localStorage.getItem('zeek_note_paper') === 'lined';
      localStorage.setItem('zeek_note_paper', lined ? 'plain' : 'lined');
      applyNotePaper();
    };
    document.getElementById('note-size').oninput = e => { noteSize = +e.target.value; };
    document.getElementById('note-palette').addEventListener('click', e => {
      const tool = e.target.closest('.note-tool');
      if (tool) {
        noteColor = tool.dataset.color;
        if (noteErasing) setNoteTool('pen');
        document.querySelectorAll('.note-tool').forEach(b => b.classList.remove('active'));
        tool.classList.add('active');
        document.getElementById('note-swatch-dot').style.background = noteColor;
        document.getElementById('note-palette').classList.remove('show');
      }
    });
    setTheme(state.theme);
    setUILang(state.uiLang);
    applyCaptionSettings();
    ensureBuiltInLesson();
    go(parseHash(), false);
    if (nativeTTS()) checkNativeTTS();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
