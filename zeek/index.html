  function isAndroid() {
    return !!(window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android');
  }

  function nativeTTS() {
    if (!window.Capacitor) return null;
    if (window.Capacitor.getPlatform && window.Capacitor.getPlatform() !== 'android') return null;
    return window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech;
  }

  function toWebUrl(url) {
    if (typeof Capacitor === 'undefined' || !Capacitor.convertFileSrc) return url;
    if (typeof url !== 'string') return url;
    if (url.startsWith('file://') || url.startsWith('content://')) return Capacitor.convertFileSrc(url);
    return url;
  }

  const MEDIA_DB_NAME = 'zeek-media';
  const MEDIA_DB_VERSION = 1;
  const MEDIA_STORE_NAME = 'media';
  let mediaDb = null;
  const mediaUrlCache = new Map();

  function isIDBMedia(url) {
    return typeof url === 'string' && url.startsWith('idb://');
  }

  function isImageFile(file) {
    if (!file) return false;
    if (file.type && file.type.startsWith('image/')) return true;
    return /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif|tiff?)$/i.test(file.name || '');
  }
  function isVideoFile(file) {
    if (!file) return false;
    if (file.type && file.type.startsWith('video/')) return true;
    return /\.(mp4|webm|mov|ogv|3gp|3gpp|avi|mkv|flv|m4v|mpeg|mpg|m4p|m2v|ts)$/i.test(file.name || '');
  }
  function isAudioFile(file) {
    if (!file) return false;
    if (file.type && file.type.startsWith('audio/')) return true;
    return /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|weba|wma)$/i.test(file.name || '');
  }
  function isMediaFile(file) { return isImageFile(file) || isVideoFile(file) || isAudioFile(file); }

  function mimeFromName(name) {
    const ext = (String(name).split('.').pop() || '').toLowerCase();
    const map = {
      jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp',
      bmp: 'image/bmp', svg: 'image/svg+xml', heic: 'image/heic', heif: 'image/heif', tiff: 'image/tiff', tif: 'image/tiff',
      mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime', ogv: 'video/ogg', '3gp': 'video/3gpp',
      '3gpp': 'video/3gpp', avi: 'video/x-msvideo', mkv: 'video/x-matroska', flv: 'video/x-flv', m4v: 'video/mp4',
      mpeg: 'video/mpeg', mpg: 'video/mpeg', m4p: 'video/mp4', m2v: 'video/mpeg', ts: 'video/mp2t',
      mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', oga: 'audio/ogg', m4a: 'audio/mp4',
      aac: 'audio/aac', flac: 'audio/flac', opus: 'audio/ogg', weba: 'audio/webm', wma: 'audio/x-ms-wma'
    };
    return map[ext] || '';
  }

  function readFileArrayBuffer(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = () => reject(reader.error || 'read error');
      reader.readAsArrayBuffer(file);
    });
  }

  function idbMediaId(url) {
    return url.slice(6);
  }

  function idbMediaSupported() {
    return 'indexedDB' in window;
  }

  async function openMediaDb() {
    if (mediaDb) return mediaDb;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(MEDIA_DB_NAME, MEDIA_DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(MEDIA_STORE_NAME)) {
          db.createObjectStore(MEDIA_STORE_NAME);
        }
      };
      req.onsuccess = () => { mediaDb = req.result; resolve(mediaDb); };
    });
  }

  async function storeMedia(file) {
    if (!file || !idbMediaSupported()) return null;
    const db = await openMediaDb();
    const id = Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    let value = file;
    if (isImageFile(file)) {
      try {
        const data = await readFileArrayBuffer(file);
        value = { data, type: file.type || mimeFromName(file.name) || 'application/octet-stream', name: file.name };
      } catch (e) {
        console.error('storeMedia read image', e);
        return null;
      }
    }
    return new Promise((resolve, reject) => {
      const tx = db.transaction([MEDIA_STORE_NAME], 'readwrite');
      const req = tx.objectStore(MEDIA_STORE_NAME).put(value, id);
      req.onsuccess = () => resolve('idb://' + id);
      req.onerror = () => reject(req.error);
    });
  }

  async function getMediaBlob(id) {
    const db = await openMediaDb();
    const result = await new Promise((resolve, reject) => {
      const tx = db.transaction([MEDIA_STORE_NAME], 'readonly');
      const req = tx.objectStore(MEDIA_STORE_NAME).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (!result) return null;
    if (result && result.data && result.type) {
      try { return new Blob([result.data], { type: result.type }); } catch (e) { return null; }
    }
    return result;
  }

  async function deleteMediaById(id) {
    const db = await openMediaDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction([MEDIA_STORE_NAME], 'readwrite');
      const req = tx.objectStore(MEDIA_STORE_NAME).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async function resolveMediaRef(ref) {
    if (!isIDBMedia(ref)) return { url: toWebUrl(ref), type: '', blob: null };
    const id = idbMediaId(ref);
    const blob = await getMediaBlob(id);
    if (!blob) return { url: '', type: '', blob: null };
    if (!mediaUrlCache.has(id)) mediaUrlCache.set(id, URL.createObjectURL(blob));
    const type = blob.type || mimeFromName(blob.name || '') || '';
    return { url: mediaUrlCache.get(id), type, blob };
  }

  function cueIndex(captions, time) {
    return captions.findIndex(c => time >= c.start && time < c.end);
  }

  function nextCueIndex(captions, time) {
    for (let i = 0; i < captions.length; i++) if (captions[i].start > time) return i;
    return -1;
  }

  function prevCueIndex(captions, time) {
    for (let i = captions.length - 1; i >= 0; i--) if (captions[i].end <= time) return i;
    return -1;
  }

  function seekVideoCue(video, dir) {
    const captions = video && video._captions;
    if (!captions || !captions.length) return;
    const t = video.currentTime || 0;
    let idx;
    if (dir > 0) {
      idx = nextCueIndex(captions, t);
      if (idx === -1) idx = 0;
    } else {
      idx = prevCueIndex(captions, t);
      if (idx === -1) idx = captions.length - 1;
    }
    const c = captions[idx];
    video.currentTime = c.start;
    // if a video loop is active, re-target it to the new cue
    let phraseKey = '';
    const lessonId = video.dataset.lessonId;
    if (lessonId != null) phraseKey = lessonId + '.' + idx;
    else { const phrase = video.closest('.phrase'); if (phrase) phraseKey = phrase.dataset.key || ''; }
    const p = phraseKey ? findPhraseByKey(phraseKey) : null;
    if (state.loop && state.loop.type === 'video' && p) {
      toggleLoop(p, phraseKey);
    } else {
      video.play().catch(() => {});
    }
  }

  async function deletePhraseImage(key) {
    if (!confirm(t('confirmRemoveMedia'))) return;
    const [lessonId, idx] = key.split('.').map(Number);
    const found = findLesson(lessonId);
    if (!found) return;
    const p = found.lesson.phrases[idx];
    const isImage = p && p.media && (p.mediaType === 'image' || await isImageMediaRef(p.media));
    if (isImage) {
      await deleteMediaRef(p.media);
      delete p.media;
      delete p.mediaType;
      saveLessons();
      go(state.route, false);
      showToast(t('deleted'));
    }
  }

  async function isImageMediaRef(ref) {
    if (!ref) return false;
    if (/^data:image\//i.test(ref)) return true;
    if (isVideoUrl(ref)) return false;
    if (/\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif|tiff?)(\?|$)/i.test(ref)) return true;
    if (isIDBMedia(ref)) {
      const id = idbMediaId(ref);
      const blob = await getMediaBlob(id);
      if (!blob) return false;
      const type = blob.type || mimeFromName(blob.name || '') || '';
      return type.startsWith('image/');
    }
    return false;
  }

  async function deleteMediaRef(ref) {
    if (!ref || typeof ref !== 'string') return;
    if (isIDBMedia(ref)) {
      const id = idbMediaId(ref);
      if (mediaUrlCache.has(id)) { URL.revokeObjectURL(mediaUrlCache.get(id)); mediaUrlCache.delete(id); }
      try { await deleteMediaById(id); } catch (e) { console.error('deleteMediaById', id, e); }
    } else if (ref.startsWith('file://')) {
      await deleteLocalFile(ref);
    }
  }

  async function deleteLocalFile(uri) {
    if (!uri || typeof uri !== 'string' || !uri.startsWith('file://')) return;
    if (!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem)) return;
    try { await window.Capacitor.Plugins.Filesystem.deleteFile({ path: uri }); } catch (e) { console.error('deleteLocalFile', uri, e); }
  }

  async function deleteItemMedia(it) {
    if (!it) return;
    if (it.image) await deleteMediaRef(it.image);
    if (it.media) { await deleteMediaRef(it.media); it.media = ''; }
    if (it.captionText) delete it.captionText;
    if (it.lessons) { for (const l of it.lessons) await deleteItemMedia(l); }
    if (it.phrases) { for (const p of it.phrases) { if (p.media) await deleteMediaRef(p.media); if (p.captionText) delete p.captionText; } }
  }

  function findPhraseByKey(key) {
    if (!key) return null;
    const [lessonId, idx] = key.split('.').map(Number);
    const found = findLesson(lessonId);
    return found ? found.lesson.phrases[idx] : null;
  }

  function parseCaptions(text) {
    text = (text || '').trim();
    if (!text) return [];
    if (text.includes('-->')) return parseSRT(text);
    return parseCustomCaptions(text);
  }

  function countryCodeFromFlag(flag) {
    const chars = [...flag];
    if (chars.length !== 2) return null;
    const cp1 = chars[0].codePointAt(0), cp2 = chars[1].codePointAt(0);
    if (cp1 >= 0x1F1E6 && cp1 <= 0x1F1FF && cp2 >= 0x1F1E6 && cp2 <= 0x1F1FF) {
      return String.fromCodePoint(cp1 - 0x1F1E6 + 0x41, cp2 - 0x1F1E6 + 0x41);
    }
    return null;
  }

  function langFromCountryCode(code) {
    if (!code) return null;
    if (['FR','BE','CA','CH','LU','MC'].includes(code)) return 'fr';
    if (['SY','SA','AE','EG','IQ','JO','LB','LY','MA','OM','PS','QA','TN','YE','KW','BH','DZ','SD','MR','KM','TD','DJ','ER','SO'].includes(code)) return 'ar';
    if (['US','GB','CA','AU','NZ','IE','ZA','IN','NG','KE','GH','JM','TT','BZ','BS','BB','SG','MY','PH','HK'].includes(code)) return 'en';
    return null;
  }

  function langFromMarker(marker) {
    if (!marker) return null;
    marker = marker.trim();
    if (/^[A-Za-z]{2}$/.test(marker)) {
      const low = marker.toLowerCase();
      if (low === 'fr') return 'fr';
      if (low === 'ar' || low === 'sy' || low === 'sa' || low === 'ae' || low === 'eg') return 'ar';
      if (low === 'en' || low === 'us' || low === 'uk' || low === 'gb') return 'en';
    }
    const cc = countryCodeFromFlag(marker);
    if (cc) return langFromCountryCode(cc);
    return null;
  }

  function parseFlagLine(line) {
    let m = line.match(/^([\u{1F1E6}-\u{1F1FF}]{2})(?:\s+|\s*$)(.*)$/u);
    if (!m) m = line.match(/^([A-Za-z]{2})[:\u2192\-]\s*(.*)$/);
    if (!m) return null;
    const lang = langFromMarker(m[1]);
    if (!lang) return null;
    const isFlag = /^[\u{1F1E6}-\u{1F1FF}]{2}$/u.test(m[1]);
    const text = isFlag ? (m[1] + ' ' + m[2].trim()).trim() : m[2].trim();
    return { lang, text };
  }

  function parseCaptionLines(lines) {
    const parts = { fr: '', ar: '', en: '' };
    const ordered = ['fr', 'ar', 'en'];
    let orderIdx = 0;
    for (const line of lines) {
      if (!line || line === 'الحوار' || /^\d+$/.test(line)) continue;
      if (line.includes('|')) {
        const split = line.split(/\s*\|\s*/).map(s => s.trim()).filter(Boolean);
        for (const s of split) {
          const p = parseFlagLine(s);
          if (p) { parts[p.lang] = p.text; }
          else if (orderIdx < ordered.length) { parts[ordered[orderIdx++]] = s; }
        }
        continue;
      }
      const p = parseFlagLine(line);
      if (p) { parts[p.lang] = p.text; continue; }
      if (orderIdx < ordered.length) { parts[ordered[orderIdx++]] = line; }
    }
    return parts;
  }

  function parseCustomCaptions(text) {
    const captions = [];
    let current = null;
    function flush() {
      if (!current || typeof current.start !== 'number') { current = null; return; }
      const parts = parseCaptionLines(current.body);
      captions.push({ start: current.start, end: current.start + 4, ...parts });
      current = null;
    }
    const lines = text.split(/\r?\n/).map(l => l.trim());
    for (const line of lines) {
      if (!line) { flush(); continue; }
      if (line === 'الحوار' || /^\d+$/.test(line)) continue;
      const m = line.match(/^(\d{1,2}):(\d{2})\s+(.+)$/);
      if (m) {
        flush();
        current = { start: parseInt(m[1], 10) * 60 + parseInt(m[2], 10), body: [m[3].trim()] };
      } else if (current) {
        current.body.push(line);
      }
    }
    flush();
    for (let i = 0; i < captions.length; i++) {
      if (i + 1 < captions.length) captions[i].end = captions[i + 1].start;
    }
    return captions;
  }

  function parseSRT(text) {
    const captions = [];
    const blocks = text.split(/\n\s*\n/);
    for (const block of blocks) {
      const lines = block.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const timeIdx = lines.findIndex(l => l.includes('-->'));
      if (timeIdx === -1 || timeIdx + 1 >= lines.length) continue;
      const m = lines[timeIdx].match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})/);
      if (!m) continue;
      const start = parseInt(m[1],10)*3600 + parseInt(m[2],10)*60 + parseInt(m[3],10) + parseInt(m[4],10)/1000;
      const end = parseInt(m[5],10)*3600 + parseInt(m[6],10)*60 + parseInt(m[7],10) + parseInt(m[8],10)/1000;
      const parts = parseCaptionLines(lines.slice(timeIdx + 1));
      captions.push({ start, end, ...parts });
    }
    return captions.sort((a, b) => a.start - b.start);
  }

  function highlightVideoPhrase(lessonId, idx) {
    document.querySelectorAll('.phrase').forEach(el => {
      const parts = el.dataset.key ? el.dataset.key.split('.').map(Number) : [];
      const on = parts.length === 2 && parts[0] === lessonId && parts[1] === idx;
      el.classList.toggle('synced', on);
      el.querySelectorAll('.line').forEach(line => line.classList.toggle('synced', on));
    });
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCaptionOnCanvas(ctx, captions, curTime, W, H) {
    const c = captions.find(c => curTime >= c.start && curTime < c.end);
    if (!c) return;
    const cs = getComputedStyle(document.documentElement);
    const cardBg = cs.getPropertyValue('--cap-card-bg').trim() || 'rgba(255,255,255,0.92)';
    const textCol = cs.getPropertyValue('--cap-text').trim() || '#111';
    const borderCol = cs.getPropertyValue('--cap-card-border').trim() || 'rgba(0,0,0,0.08)';
    const frFont = cs.getPropertyValue('--cap-fr-font').trim() || 'Georgia, serif';
    const arFont = cs.getPropertyValue('--cap-ar-font').trim() || 'sans-serif';
    const enFont = cs.getPropertyValue('--cap-en-font').trim() || 'Georgia, serif';
    const lineRadiusRaw = cs.getPropertyValue('--cap-line-radius').trim();
    const lineRadiusFactor = lineRadiusRaw.endsWith('em') ? parseFloat(lineRadiusRaw) || 0 : (parseFloat(lineRadiusRaw) ? 0.35 : 0);
    const fs = Math.round(H * 0.048 * (state.captionZoom || 1));
    const padY = fs * 0.55, padX = fs * 0.9, gap = fs * 0.35;
    const lines = [
      { txt: c.fr, font: frFont, dir: 'ltr', lang: 'fr' },
      { txt: c.ar, font: arFont, dir: 'rtl', lang: 'ar' },
      { txt: c.en, font: enFont, dir: 'ltr', lang: 'en' }
    ].filter(l => l.txt && l.txt.trim());
    const bgFor = lang => {
      const v = cs.getPropertyValue('--cap-' + lang + '-bg').trim();
      if (!v) return cardBg;
      if (/gradient/.test(v)) { const cols = v.match(/#[0-9a-fA-F]{3,8}|rgba?\([^)]*\)/g); return cols && cols.length ? cols[cols.length - 1] : cardBg; }
      return v;
    };
    if (!lines.length) return;
    const wrap = (txt, font, dir) => {
      ctx.font = `600 ${fs}px ${font}`;
      ctx.direction = dir;
      const words = txt.trim().split(/\s+/);
      const out = []; let cur = '';
      const maxW = W * 0.86;
      for (const w2 of words) {
        const test = cur ? cur + ' ' + w2 : w2;
        if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = w2; }
        else cur = test;
      }
      if (cur) out.push(cur);
      return { font, dir, rows: out };
    };
    const blocks = lines.map(l => Object.assign(wrap(l.txt, l.font, l.dir), { lang: l.lang }));
    const totalH = blocks.reduce((s, b) => s + b.rows.length * fs * 1.3 + padY * 2, 0) + gap * (blocks.length - 1);
    let y = H - totalH - H * 0.045;
    for (const b of blocks) {
      ctx.font = `600 ${fs}px ${b.font}`;
      ctx.direction = b.dir;
      ctx.textBaseline = 'middle';
      const blockW = Math.min(W * 0.94, Math.max(...b.rows.map(r => ctx.measureText(r).width)) + padX * 2);
      const blockH = b.rows.length * fs * 1.3 + padY * 2;
      const x = (W - blockW) / 2;
      ctx.fillStyle = bgFor(b.lang);
      ctx.strokeStyle = borderCol;
      ctx.lineWidth = Math.max(1, fs * 0.05);
      roundRectPath(ctx, x, y, blockW, blockH, fs * lineRadiusFactor);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = textCol;
      ctx.textAlign = 'center';
      b.rows.forEach((row, i) => {
        ctx.fillText(row, W / 2, y + padY + fs * 0.65 + i * fs * 1.3);
      });
      y += blockH + gap;
    }
  }

  function stopCaptionRecording(video) {
    const rec = video._recorder;
    if (!rec) return;
    video._recorder = null;
    video._recordStop = null;
    try { rec.stop(); } catch (e) {}
  }

  async function toggleCaptionRecording(video, captions, btn) {
    if (video._recorder) { stopCaptionRecording(video); return; }
    if (typeof MediaRecorder === 'undefined' || !canvasCaptureOK()) { showToast('Recording not supported'); return; }
    let W = video.videoWidth || 1280, H = video.videoHeight || 720;
    const maxSide = 1920;
    if (Math.max(W, H) > maxSide) { const k = maxSide / Math.max(W, H); W = Math.round(W * k / 2) * 2; H = Math.round(H * k / 2) * 2; }
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const stream = canvas.captureStream(30);
    try {
      const vs = video.captureStream ? video.captureStream() : (video.mozCaptureStream ? video.mozCaptureStream() : null);
      if (vs) vs.getAudioTracks().forEach(tr => stream.addTrack(tr));
    } catch (e) { console.warn('audio capture failed', e); }
    const mimeCandidates = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4;codecs=h264,aac',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm'
    ];
    const mime = mimeCandidates.find(m => MediaRecorder.isTypeSupported(m)) || '';
    const recOpts = { videoBitsPerSecond: Math.min(6000000, Math.max(2500000, Math.round(W * H * 4))), audioBitsPerSecond: 128000 };
    if (mime) recOpts.mimeType = mime;
    let rec;
    try { rec = new MediaRecorder(stream, recOpts); }
    catch (e) { try { rec = new MediaRecorder(stream); } catch (e2) { showToast('Recording not supported'); return; } }
    const outMime0 = (rec.mimeType || mime || 'video/webm').split(';')[0];
    const sink = createRecordingSink(outMime0.includes('mp4') ? 'mp4' : 'webm', outMime0);
    rec.onerror = e => { console.error('recorder error', e); showToast('Recording error'); stopCaptionRecording(video); };
    rec.ondataavailable = e => { if (e.data && e.data.size) sink.push(e.data); };
    rec.onstop = async () => {
      cancelAnimationFrame(video._recRaf);
      video._recRaf = null;
      btn.textContent = '⬇';
      btn.title = t('recordVideoTitle');
      await sink.finish();
    };
    const draw = () => {
      if (!video._recorder) return;
      ctx.direction = 'ltr'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.drawImage(video, 0, 0, W, H);
      const ov = video.closest('.phrase-media, .lesson-media') && video.closest('.phrase-media, .lesson-media').querySelector('.lesson-image-overlay.show img');
      if (ov && ov.complete && ov.naturalWidth) {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
        const k = Math.min(W / ov.naturalWidth, H / ov.naturalHeight);
        const iw = ov.naturalWidth * k, ih = ov.naturalHeight * k;
        ctx.drawImage(ov, (W - iw) / 2, (H - ih) / 2, iw, ih);
      }
      drawCaptionOnCanvas(ctx, captions, video.currentTime || 0, W, H);
      video._recRaf = requestAnimationFrame(draw);
    };
    const tNow = video.currentTime || 0;
    const cur = captions.find(c => tNow >= c.start && tNow < c.end);
    const startAt = cur ? cur.start : (captions.find(c => c.start >= tNow) || captions[0] || { start: 0 }).start;
    stopSpeech();
    if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
    state.loop = null;
    refreshButtons();
    try { video.loop = false; } catch (e) {}
    try {
      try { video.pause(); } catch (err) {}
      video.currentTime = startAt;
      await new Promise(res => {
        if (Math.abs(video.currentTime - startAt) < 0.05) return res();
        video.addEventListener('seeked', res, { once: true });
        setTimeout(res, 800);
      });
    } catch (e) {}
    video._recorder = rec;
    video._recordStop = () => stopCaptionRecording(video);
    const onEnded = () => stopCaptionRecording(video);
    video.addEventListener('ended', onEnded, { once: true });
    rec.onstop = ((orig) => async () => { video.removeEventListener('ended', onEnded); await orig(); })(rec.onstop);
    rec.start(250);
    video._recRaf = requestAnimationFrame(draw);
    btn.textContent = '⏹';
    btn.title = t('recordStop');
    showToast(t('recordingToast'), 3000);
    try { await video.play(); } catch (e) {}
  }

  function canvasCaptureOK() {
    const c = document.createElement('canvas');
    return typeof c.captureStream === 'function';
  }

  function createRecordingSink(ext, mimeType) {
    const filename = 'zeek-video-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.' + ext;
    const native = typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
    const toB64 = part => new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(',')[1]);
      fr.onerror = rej;
      fr.readAsDataURL(part);
    });
    if (!native) {
      const chunks = [];
      return {
        push(b) { chunks.push(b); },
        async finish() {
          const blob = new Blob(chunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename; a.style.display = 'none';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          showToast(t('videoSaved'));
        }
      };
    }
    const { Filesystem, Share } = Capacitor.Plugins;
    const Directory = Filesystem.Directory || {};
    const dir = Directory.Cache || 'CACHE';
    let queue = Promise.resolve();
    let started = false, failed = null, pending = [], pendingSize = 0;
    const FLUSH = 512 * 1024;
    const writePart = part => {
      queue = queue.then(async () => {
        if (failed) return;
        const b64 = await toB64(part);
        if (!started) { started = true; await Filesystem.writeFile({ path: filename, data: b64, directory: dir, recursive: true }); }
        else await Filesystem.appendFile({ path: filename, data: b64, directory: dir });
      }).catch(e => { failed = e; console.error('write chunk failed', e); });
    };
    const flush = () => {
      if (!pending.length) return;
      writePart(new Blob(pending, { type: mimeType }));
      pending = []; pendingSize = 0;
    };
    return {
      push(b) { pending.push(b); pendingSize += b.size; if (pendingSize >= FLUSH) flush(); },
      async finish() {
        flush();
        showToast(t('videoSaving') || '…', 60000);
        await queue;
        if (failed) { showToast(failed.message || 'Save failed'); return; }
        if (!started) { showToast('Save failed'); return; }
        try {
          const { uri } = await Filesystem.getUri({ path: filename, directory: dir });
          showToast(t('videoSaved'));
          if (Share && Share.share) await Share.share({ title: 'Zeek video', files: [uri], dialogTitle: 'Zeek video' });
        } catch (e) { console.error('share video failed', e); showToast(e.message || 'Save failed'); }
      }
    };
  }

  async function attachCaptionSync(video, captionText, lessonId) {
    if (!video || video.dataset.captionSync === '1') return;
    let captions = [];
    try { captions = parseCaptions(captionText); } catch (e) { console.error('parse captions', e); }
    if (!captions.length) return;
    video._captions = captions;
    const container = video.closest('.phrase-media');
    const overlay = document.createElement('div');
    overlay.className = 'caption-overlay';
    if (container) container.appendChild(overlay);
    const textDiv = document.createElement('div');
    textDiv.className = 'cap-text';
    overlay.appendChild(textDiv);
    const loopBtn = document.createElement('button');
    loopBtn.className = 'cap-loop-btn';
    loopBtn.type = 'button';
    loopBtn.title = t('videoAudioLoopTitle');
    loopBtn.textContent = '🔁';
    loopBtn.onclick = (e) => {
      e.stopPropagation();
      const t = video.currentTime || 0;
      const idx = captions.findIndex(c => t >= c.start && t < c.end);
      if (idx === -1) return;
      let phraseKey = '';
      if (lessonId != null) {
        phraseKey = lessonId + '.' + idx;
      } else {
        const phrase = video.closest('.phrase');
        if (phrase) phraseKey = phrase.dataset.key || '';
      }
      if (!phraseKey) return;
      const p = findPhraseByKey(phraseKey);
      if (p) toggleLoop(p, phraseKey);
    };
    overlay.appendChild(loopBtn);
    const controls = document.createElement('div');
    controls.className = 'cap-controls';
    controls.innerHTML = `<button class="video-prev" type="button" title="${t('previousPhrase')}">⏮</button><button class="video-next" type="button" title="${t('nextPhrase')}">⏭</button><button class="video-rec" type="button" title="${t('recordVideoTitle')}">⬇</button>`;
    overlay.appendChild(controls);
    const recBtn = controls.querySelector('.video-rec');
    if (video.tagName !== 'VIDEO') recBtn.style.display = 'none';
    recBtn.onclick = (e) => { e.stopPropagation(); toggleCaptionRecording(video, captions, recBtn); };

    const handle = document.createElement('div');
    handle.className = 'cap-handle';
    overlay.appendChild(handle);

    // drag caption overlay inside its container
    let drag = false, sx, sy, sl, st;
    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      drag = true;
      const rect = overlay.getBoundingClientRect();
      const cRect = container.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY;
      sl = rect.left - cRect.left;
      st = rect.top - cRect.top;
      overlay.style.width = rect.width + 'px';
      overlay.style.right = 'auto';
      overlay.style.bottom = 'auto';
      overlay.style.left = sl + 'px';
      overlay.style.top = st + 'px';
      try { handle.setPointerCapture(e.pointerId); } catch (_) {}
    });
    handle.addEventListener('pointermove', e => {
      if (!drag) return;
      e.preventDefault();
      const cRect = container.getBoundingClientRect();
      let x = sl + (e.clientX - sx);
      let y = st + (e.clientY - sy);
      const maxX = cRect.width - overlay.offsetWidth;
      const maxY = cRect.height - overlay.offsetHeight;
      x = Math.max(0, Math.min(x, maxX));
      y = Math.max(0, Math.min(y, maxY));
      overlay.style.left = x + 'px';
      overlay.style.top = y + 'px';
    });
    handle.addEventListener('pointerup', () => { drag = false; });
    handle.addEventListener('pointercancel', () => { drag = false; });

    textDiv.addEventListener('click', e => {
      const lb = e.target.closest('.cap-lang-loop');
      const w = lb ? null : e.target.closest('.cap-word');
      if (!w && !lb) return;
      e.stopPropagation();
      const lang = (w || lb).dataset.lang;
      const word = w ? w.dataset.word : '';
      if (!lang || (w && !word)) return;
      let key = '';
      const phrase = video.closest('.phrase');
      if (phrase) key = phrase.dataset.key || '';
      else if (video.dataset.lessonId != null) {
        const t = video.currentTime || 0;
        const idx = captions.findIndex(c => t >= c.start && t < c.end);
        if (idx >= 0) key = video.dataset.lessonId + '.' + idx;
      }
      if (!key) return;
      if (lb) { try { video.pause(); } catch (err) {} if (state.loop && state.loop.type === 'video') state.loop = null; toggleLangLoop(lang, key); }
      else toggleWordLoop(word, lang, key);
    });

    const makeCap = (text, lang) => {
      if (!text) return '';
      let raw = text.trim();
      let flag = '';
      const fm = raw.match(/^([\u{1F1E6}-\u{1F1FF}]{2})\s*(.*)$/u);
      if (fm) { flag = fm[1]; raw = fm[2].trim(); }
      const tokens = raw.split(/(\s+|[^\p{L}\p{M}\p{N}'’-]+)/gu).filter(t => t !== '');
      let html = '';
      for (const token of tokens) {
        if (/^\s+$/.test(token) || /^[^\p{L}\p{M}\p{N}'’-]+$/u.test(token)) {
          html += esc(token);
        } else {
          html += `<span class="cap-word" data-lang="${lang}" data-word="${esc(token)}">${esc(token)}</span>`;
        }
      }
      const flagHtml = flag ? `<span class="cap-flag">${esc(flag)}</span>` : '';
      const theme = CAPTION_THEMES[state.captionTheme] || CAPTION_THEMES[0];
      const badge = `<span class="cap-badge">${lang.toUpperCase()}</span>`;
      const loop = `<button type="button" class="cap-lang-loop" data-lang="${lang}" title="${t('loopLang_' + lang)}">🔊</button>`;
      return `<span class="cap-line cap-${lang}${theme.badges ? ' has-badge' : ''}" dir="${lang === 'ar' ? 'rtl' : 'ltr'}">${badge}${loop}${flagHtml}${html}</span>`;
    };
    let lastIdx = -1;
    const update = () => {
      const t = video.currentTime || 0;
      let activeIdx = -1;
      const c = captions.find((c, i) => { if (t >= c.start && t < c.end) { activeIdx = i; return true; } return false; });
      if (!c) {
        overlay.style.display = 'none';
        if (lessonId != null) highlightVideoPhrase(lessonId, -1);
        if (lastIdx !== -1 && state.loop && state.loop.word) stopSpeech();
        lastIdx = -1;
        return;
      }
      if (activeIdx !== lastIdx) {
        const parts = [makeCap(c.fr, 'fr'), makeCap(c.ar, 'ar'), makeCap(c.en, 'en')].filter(Boolean);
        textDiv.innerHTML = parts.join('');
        lastIdx = activeIdx;
        if (state.loop && state.loop.word) {
          let phraseKey = '';
          if (lessonId != null) phraseKey = lessonId + '.' + activeIdx;
          else { const phrase = video.closest('.phrase'); if (phrase) phraseKey = phrase.dataset.key || ''; }
          if (phraseKey && state.loop.phraseKey === phraseKey) {
            highlight(phraseKey, state.loop.lang, state.loop.word);
          } else {
            stopSpeech();
          }
        }
      }
      overlay.style.display = 'flex';
      if (lessonId != null) highlightVideoPhrase(lessonId, activeIdx);
      let phraseKey = '';
      if (lessonId != null) phraseKey = lessonId + '.' + activeIdx;
      else { const phrase = video.closest('.phrase'); if (phrase) phraseKey = phrase.dataset.key || ''; }
      const active = !!(state.loop && state.loop.type === 'video' && state.loop.key === phraseKey);
      loopBtn.classList.toggle('active', active);
      loopBtn.textContent = active ? '⏸' : '🔁';
      textDiv.querySelectorAll('.cap-lang-loop').forEach(b => {
        const on = !!(state.loop && state.loop.key === 'lang:' + phraseKey + ':' + b.dataset.lang);
        b.classList.toggle('active', on);
        b.textContent = on ? '⏸' : '🔊';
      });
    };
    video.addEventListener('timeupdate', update);
    video.addEventListener('seeked', update);
    video.addEventListener('play', update);
    video.addEventListener('loadedmetadata', update);
    video.addEventListener('pause', () => { if (lessonId != null) highlightVideoPhrase(lessonId, -1); });
    video.addEventListener('ended', () => { if (lessonId != null) highlightVideoPhrase(lessonId, -1); });
    video.dataset.captionSync = '1';
    update();
  }

  async function syncAllCaptions() {
    const phrases = document.querySelectorAll('.phrase');
    for (const el of phrases) {
      const key = el.dataset.key;
      if (!key) continue;
      const p = findPhraseByKey(key);
      if (!p || !p.captionText) continue;
      const video = el.querySelector('video');
      if (video) await attachCaptionSync(video, p.captionText);
    }
  }

  function getVideoAspect(ref) { return (ref && state.videoAspects[ref]) || ''; }
  function saveVideoAspect(ref, aspect) {
    if (!ref) return;
    if (aspect) state.videoAspects[ref] = aspect;
    else delete state.videoAspects[ref];
    localStorage.setItem('zeek_video_aspects', JSON.stringify(state.videoAspects));
  }
  function aspectClassFor(ratio) { return ratio ? 'ar-' + ratio.replace('/', '-') : ''; }
  function applyVideoAspect(container, ref) {
    const ratio = getVideoAspect(ref);
    ['ar-9-16','ar-16-9','ar-4-3','ar-3-2','ar-1-1','ar-4-5'].forEach(c => container.classList.remove(c));
    const cls = aspectClassFor(ratio);
    if (cls) container.classList.add(cls);
    const sel = container.querySelector('.aspect-select');
    if (sel) sel.value = ratio || '9/16';
  }
  function setVideoAspect(container, ratio) {
    if (!container) return;
    const ref = container.dataset.mediaRef || container.dataset.mediaSrc || '';
    saveVideoAspect(ref, ratio);
    applyVideoAspect(container, ref);
  }

  async function loadMedia() {
    const placeholders = document.querySelectorAll('.media-placeholder');
    for (const el of placeholders) {
      const ref = el.dataset.mediaRef;
      if (!ref) continue;
      const resolved = await resolveMediaRef(ref);
      if (!resolved.url) { el.remove(); continue; }
      const yt = youtubeId(resolved.url);
      if (el.classList.contains('card-thumb')) {
        if (yt) {
          el.innerHTML = `<img src="https://img.youtube.com/vi/${yt}/0.jpg" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        } else {
          const isVideo = (resolved.type || '').startsWith('video/') || isVideoUrl(resolved.url) || isVideoFile({ name: (resolved.blob && resolved.blob.name) || '', type: resolved.type });
          if (isVideo) {
            el.innerHTML = `<video src="${esc(resolved.url)}" muted playsinline loop autoplay style="width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none;background:#000"></video>`;
          } else {
            el.innerHTML = `<img src="${esc(resolved.url)}" alt="" onerror="this.style.display='none'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
          }
        }
      } else if (yt) {
        el.innerHTML = `<iframe width="100%" height="240" src="https://www.youtube.com/embed/${yt}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius:var(--radius);border:none;background:#000"></iframe>`;
      } else {
        const isVideo = (resolved.type || '').startsWith('video/') || isVideoUrl(resolved.url) || isVideoFile({ name: (resolved.blob && resolved.blob.name) || '', type: resolved.type });
        const isAudio = !isVideo && ((resolved.type || '').startsWith('audio/') || isAudioUrl(resolved.url) || isAudioFile({ name: (resolved.blob && resolved.blob.name) || '', type: resolved.type }));
        if (isVideo) {
          el.classList.add('video-player');
          const phraseKey = el.dataset.phraseKey || '';
          const mediaKey = el.dataset.mediaRef || el.dataset.mediaSrc || resolved.url;
          el.innerHTML = videoHTML(resolved.url, phraseKey, mediaKey);
          applyVideoAspect(el, mediaKey);
          const v = el.querySelector('video');
          if (v) { try { v.playbackRate = state.rate || 1; } catch (e) {} }
          if (el.dataset.imageRef) await addLessonImageOverlay(el);
        } else if (isAudio) {
          el.innerHTML = audioHTML(resolved.url);
        } else {
          el.innerHTML = imageMediaHTML(resolved.url, el.dataset.phraseKey || '', el.dataset.mediaRef || el.dataset.mediaSrc || '');
        }
      }
      const captionText = el.dataset.captionText || '';
      const lessonId = el.dataset.lessonId ? +el.dataset.lessonId : null;
      if (captionText) {
        const video = el.querySelector('video,audio');
        if (video) {
          if (lessonId != null) video.dataset.lessonId = lessonId;
          await attachCaptionSync(video, captionText, lessonId);
        }
      }
      el.classList.remove('media-placeholder');
    }
    await syncAllCaptions();
  }

  function showTTSBanner(msg, btnText) {
    if (!ttsBanner) return;
    ttsMsg.textContent = msg;
    ttsInstall.textContent = btnText;
    ttsInstall.onclick = () => { openTTSInstall(); };
    ttsBanner.style.display = 'flex';
  }

  function hideTTSBanner() {
    if (ttsBanner) ttsBanner.style.display = 'none';
  }

  function openTTSInstall() {
    const tts = nativeTTS();
    if (!tts || !tts.openInstall) return;
    tts.openInstall().catch(() => {}).then(() => { setTimeout(checkNativeTTS, 3000); });
  }

  async function supportsLangTag(tts, tags) {
    for (const tag of tags) {
      try {
        const r = await tts.isLanguageSupported({ lang: tag });
        if (r && r.supported) return tag;
      } catch (e) {}
    }
    return null;
  }

  async function checkNativeTTS(retry = 0) {
    const tts = nativeTTS();
    if (!tts) {
      state.ttsAvailable = false;
      if (!('speechSynthesis' in window)) showTTSBanner(t('ttsNotAvailable'), t('installTTS'));
      return;
    }
    try {
      let frTag = await supportsLangTag(tts, ['fr-FR','fr','fra','fr-CA','fr-CH']);
      let langs = [];
      if (!frTag) {
        const r = await tts.getSupportedLanguages().catch(() => ({}));
        langs = ((r && r.languages) || []).map(l => String(l).toLowerCase());
        const pick = (tags) => tags.find(tag => langs.includes(tag.toLowerCase()));
        frTag = pick(['fr-FR','fr','fra','fr-CA','fr-CH']);
      }
      if (!frTag && retry < 8) {
        setTimeout(() => checkNativeTTS(retry + 1), 600);
        return;
      }
      if (!frTag) {
        state.ttsAvailable = false;
        if (!webTTS()) showTTSBanner(t('ttsNotAvailable'), t('installTTS'));
        return;
      }
      state.voiceLang = {
        fr: frTag,
        ar: await supportsLangTag(tts, ['ar-SA','ar','ara','ar-EG']),
        en: await supportsLangTag(tts, ['en-US','en','eng','en-GB','en-CA'])
      };
      state.ttsAvailable = true;
      hideTTSBanner();
    } catch (e) {
      if (retry < 8) {
        setTimeout(() => checkNativeTTS(retry + 1), 600);
      } else {
        state.ttsAvailable = false;
        showTTSBanner(t('ttsNotAvailable'), t('installTTS'));
      }
    }
  }

  function stripSpeechFlags(text) {
    return String(text || '')
      .replace(/[\u{1F1E6}-\u{1F1FF}]{2}/gu, '')
      .replace(/[\p{Extended_Pictographic}\p{Emoji_Modifier}\u{FE0F}\u{FE0E}\u{200D}\u{20E3}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2460}-\u{27BF}\u{2900}-\u{2BFF}\u{1F000}-\u{1FAFF}]/gu, '')
      .replace(/\s+/g, ' ').trim();
  }

  function estimatedSpeechTimeout(text, rate) {
    const words = String(text).trim().split(/\s+/).filter(Boolean).length;
    return Math.max(8000, Math.ceil(words * 900 / (rate || 1)) + 3000);
  }

  function nativeSpeak(text, lang) {
    text = stripSpeechFlags(text);
    const tts = nativeTTS();
    if (!tts) return Promise.reject('no tts');
    const tag = (state.voiceLang && state.voiceLang[lang]);
    if (!tag) return Promise.reject('unsupported lang');
    const p = tts.speak({ text: text, lang: tag, rate: state.rate || 1 });
    const timeout = new Promise((_, reject) => setTimeout(() => reject('timeout'), estimatedSpeechTimeout(text, state.rate)));
    return Promise.race([p, timeout]);
  }

  function nativeStop() {
    const tts = nativeTTS();
    if (tts) tts.stop().catch(() => {});
  }

  function webTTS() {
    const synth = window.speechSynthesis;
    if (!synth) return null;
    const voices = synth.getVoices();
    return (voices && voices.length) ? synth : null;
  }

  function webSpeak(text, lang) {
    text = stripSpeechFlags(text);
    const synth = webTTS();
    if (!synth) return Promise.reject('no web tts');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (state.voiceLang && state.voiceLang[lang]) || VOICE_LANG[lang] || 'en-US';
    u.rate = state.rate || 1;
    return new Promise((resolve, reject) => {
      let settled = false;
      u.onend = () => { if (!settled) { settled = true; clearTimeout(timer); resolve(); } };
      u.onerror = () => { if (!settled) { settled = true; clearTimeout(timer); reject('web tts error'); } };
      const timer = setTimeout(() => { if (!settled) { settled = true; resolve(); } }, estimatedSpeechTimeout(text, state.rate) + 2000);
      synth.speak(u);
    });
  }

  function anySpeak(text, lang) {
    const t = stripSpeechFlags(text);
    if (!t) return Promise.reject('empty tts');
    pauseAllMedia();
    let p;
    if (speakSupported()) p = nativeSpeak(t, lang);
    else if (webTTS()) p = webSpeak(t, lang);
    else return Promise.reject('no tts');
    ttsActive++;
    const done = () => { ttsActive = Math.max(0, ttsActive - 1); };
    p.then(done, done);
    return p;
  }

  let ttsActive = 0;
  function pauseAllMedia() {
    document.querySelectorAll('video, audio').forEach(m => { if (!m.paused) { try { m.pause(); } catch (e) {} } });
  }

  function anyStop() {
    nativeStop();
    const synth = webTTS();
    if (synth) synth.cancel();
  }

  function anyTTSAvailable() {
    return speakSupported() || !!webTTS();
  }

  async function prepareTTS() {
    if (anyTTSAvailable()) { hideTTSBanner(); return true; }
    if (!nativeTTS() && !('speechSynthesis' in window)) return false;
    if (nativeTTS()) checkNativeTTS();
    for (let i = 0; i < 15; i++) {
      await new Promise(r => setTimeout(r, 400));
      if (anyTTSAvailable()) { hideTTSBanner(); return true; }
    }
    return false;
  }

  function speakSupported() { return !!nativeTTS() && state.ttsAvailable; }

  function stopSpeech(pauseMedia) {
    state.loop = null;
    if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
    speechRun++;
    anyStop();
    highlight(null);
    refreshButtons();
    if (pauseMedia) document.querySelectorAll('video, audio').forEach(v => { try { v.pause(); v.dispatchEvent(new Event('timeupdate')); } catch (e) {} });
  }

  function stopAll() { stopSpeech(true); }

  function updateVideoRate() {
    document.querySelectorAll('video, audio').forEach(v => { try { v.playbackRate = state.rate || 1; } catch (e) {} });
  }

  document.addEventListener('play', e => {
    const el = e.target;
    if (!(el instanceof HTMLMediaElement)) return;
    try { el.playbackRate = state.rate || 1; } catch (err) {}
    if (el.tagName === 'AUDIO' && state.loop && state.loop.type === 'video') {
      state.loop = null;
      if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
      refreshButtons();
    }
    if (ttsActive > 0 || (state.loop && state.loop.type !== 'video')) stopSpeech();
    document.querySelectorAll('video, audio').forEach(m => { if (m !== el && !m.paused) { try { m.pause(); } catch (err) {} } });
  }, true);

  async function speakOnce(phrase, langs, key, onDone, activeWord) {
    const run = ++speechRun;
    anyStop();
    pauseAllMedia();
    const ready = await prepareTTS();
    if (run !== speechRun) return;
    if (!ready) { highlight(null); return; }
    const seq = langs.filter(l => phrase[l] && state.voiceLang[l]);
    let i = 0;
    (function next() {
      if (run !== speechRun) return;
      if (i >= seq.length) {
        if (activeWord && seq.length) highlight(key, seq[seq.length - 1], activeWord);
        else highlight(null);
        if (onDone) onDone();
        return;
      }
      const lang = seq[i++];
      highlight(key, lang, activeWord);
      anySpeak(phrase[lang], lang).then(() => { if (run === speechRun) setTimeout(next, 250); }).catch(() => {
        if (run === speechRun) setTimeout(next, 250);
      });
    })();
  }

  function getVideoForPhrase(key) {
    const el = document.querySelector(`.phrase[data-key="${key}"]`);
    if (el) { const v = el.querySelector('video'); if (v) return v; }
    return document.querySelector('.lesson-media video') || document.querySelector('video');
  }

  async function toggleTTSLoop(phrase, key) {
    if (state.loop && state.loop.key === key && state.loop.type === 'tts') { stopSpeech(); return; }
    pauseAllMedia();
    const ready = await prepareTTS();
    if (!ready) return;
    stopSpeech();
    state.loop = { key, type: 'tts' };
    refreshButtons();
    (function cycle() {
      if (!state.loop || state.loop.key !== key) return;
      speakOnce(phrase, state.langs, key, () => {
        if (!state.loop || state.loop.key !== key) return;
        setTimeout(cycle, 600);
      });
    })();
  }

  async function toggleLoop(phrase, key) {
    if (state.loop && state.loop.key === key) { stopSpeech(); return; }
    const video = getVideoForPhrase(key);
    if (!video) return;
    let start = phrase.start, end = phrase.end;
    if ((typeof start !== 'number' || typeof end !== 'number') && key) {
      const [lessonId, idx] = key.split('.').map(Number);
      const found = findLesson(lessonId);
      if (found && found.lesson.captionText) {
        const caps = parseCaptions(found.lesson.captionText);
        const c = caps[idx];
        if (c) { start = c.start; end = c.end; }
      }
    }
    if (typeof start !== 'number' || typeof end !== 'number') return;
    stopSpeech();
    if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
    state.loop = { key, type: 'video', start, end };
    refreshButtons();
    try { video.dispatchEvent(new Event('timeupdate')); } catch (e) {}
    const seekAndPlay = () => {
      try { video.currentTime = start; } catch (e) {}
      updateVideoRate();
      try { video.play(); } catch (e) {}
    };
    updateVideoRate();
    if (video.readyState >= 1) seekAndPlay();
    else {
      video.addEventListener('loadedmetadata', seekAndPlay, { once: true });
      try { video.play(); } catch (e) {}
    }
    loopTimer = setInterval(() => {
      if (!state.loop || state.loop.key !== key) { clearInterval(loopTimer); loopTimer = null; return; }
      if (video.paused) { try { video.play(); } catch (e) {} }
      if (video.currentTime >= end || video.currentTime < start - 0.1) {
        video.currentTime = start;
        try { video.play(); } catch (e) {}
      }
    }, 200);
  }

  async function toggleLangLoop(lang, key) {
    if (!lang) return;
    const [lessonId, idx] = key.split('.').map(Number);
    const found = findLesson(lessonId);
    if (!found) return;
    const p = found.lesson.phrases[idx];
    const text = p[lang];
    if (!text) return;
    const loopKey = 'lang:' + key + ':' + lang;
    if (state.loop && state.loop.key === loopKey) { stopSpeech(); return; }
    const ready = await prepareTTS();
    if (!ready) return;
    state.loop = { key: loopKey, phraseKey: key, lang };
    refreshButtons();
    const pseudo = { [lang]: text };
    highlight(key, lang);
    (function cycle() {
      if (!state.loop || state.loop.key !== loopKey) return;
      speakOnce(pseudo, [lang], key, () => {
        if (!state.loop || state.loop.key !== loopKey) return;
        setTimeout(cycle, 600);
      });
    })();
  }

  async function toggleWordLoop(word, lang, key) {
    if (!word || !lang) return;
    const loopKey = 'word:' + key + ':' + lang + ':' + word;
    if (state.loop && state.loop.key === loopKey) { stopSpeech(); return; }
    stopSpeech();
    const ready = await prepareTTS();
    if (!ready) return;
    state.loop = { key: loopKey, phraseKey: key, lang, word };
    refreshButtons();
    const pseudo = { [lang]: word };
    (function cycle() {
      if (!state.loop || state.loop.key !== loopKey) return;
      speakOnce(pseudo, [lang], key, () => {
        if (!state.loop || state.loop.key !== loopKey) return;
        setTimeout(cycle, 600);
      }, word);
    })();
  }

  function highlight(key, lang, word) {
    document.querySelectorAll('.phrase').forEach(el => {
      const on = key && el.dataset.key === key;
      el.classList.toggle('playing', !!on);
      el.querySelectorAll('.line').forEach(line => {
        line.classList.toggle('active', !!on && (!lang || line.dataset.lang === lang));
      });
    });
    document.querySelectorAll('.cap-word').forEach(w => {
      const on = word && w.dataset.word === word && w.dataset.lang === lang;
      w.classList.toggle('active', !!on);
    });
    document.querySelectorAll('.cap-line').forEach(line => {
      const hasActiveWord = !!line.querySelector('.cap-word.active');
      const byLang = !word && lang && line.classList.contains('cap-' + lang);
      line.classList.toggle('active', hasActiveWord || byLang);
    });
  }

  function refreshButtons() {
    document.querySelectorAll('.word').forEach(w => w.classList.remove('active'));
    document.querySelectorAll('.cap-word').forEach(w => w.classList.remove('active'));
    document.querySelectorAll('.cap-line').forEach(l => l.classList.remove('active'));
    document.querySelectorAll('.loop-lang').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tts-loop-btn').forEach(b => { b.classList.remove('active'); b.textContent = '🔂'; });
    document.querySelectorAll('.phrase').forEach(el => {
      const videoOn = state.loop && state.loop.type === 'video' && state.loop.key === el.dataset.key;
      const ttsOn = state.loop && state.loop.type === 'tts' && state.loop.key === el.dataset.key;
      const loopBtn = el.querySelector('.loop-btn');
      if (loopBtn) {
        loopBtn.classList.toggle('active', !!videoOn);
        loopBtn.textContent = videoOn ? '⏸' : '🔁';
      }
      const phraseLoopBtn = el.querySelector('.phrase-loop-btn');
      if (phraseLoopBtn) {
        phraseLoopBtn.classList.toggle('active', !!videoOn);
        phraseLoopBtn.textContent = videoOn ? '⏸' : '🔁';
      }
      const ttsBtn = el.querySelector('.tts-loop-btn');
      if (ttsBtn) {
        ttsBtn.classList.toggle('active', !!ttsOn);
        ttsBtn.textContent = ttsOn ? '⏸' : '🔂';
      }
      if (state.loop && state.loop.phraseKey === el.dataset.key && state.loop.lang && !state.loop.word) {
        const langBtn = el.querySelector('.loop-lang[data-lang="' + state.loop.lang + '"]');
        if (langBtn) langBtn.classList.add('active');
      }
    });
    if (state.loop && state.loop.word) {
      const p = document.querySelector(`.phrase[data-key="${state.loop.phraseKey}"]`);
      if (p) {
        p.querySelectorAll('.word').forEach(w => {
          if (w.dataset.lang === state.loop.lang && w.dataset.word === state.loop.word) w.classList.add('active');
        });
      }
    }
  }

  function isFav(key) { return state.favs.includes(key); }
  function hasNote(key) { return !!state.notes[key]; }
  function saveNotes() { localStorage.setItem('zeek_notes', JSON.stringify(state.notes)); }

  function toggleFav(key) {
    const i = state.favs.indexOf(key);
    if (i === -1) state.favs.push(key); else state.favs.splice(i, 1);
    localStorage.setItem('zeek_favs', JSON.stringify(state.favs));
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function wordSpans(text, lang) {
    if (!text) return '';
    return String(text).trim().split(/\s+/).map(w => {
      const clean = w.replace(/^[\p{P}\p{S}]+|[\p{P}\p{S}]+$/gu, '');
      return `<span class="word" data-lang="${esc(lang)}" data-word="${esc(clean || w)}">${esc(w)}</span>`;
    }).join(' ');
  }

  function phraseKey(lessonId, idx) { return lessonId + '.' + idx; }

  async function deleteRootItem(id) {
    const it = findItem(id);
    if (!it) return;
    if (it.protected) { showToast(t('protected')); return; }
    if (!confirm(it.type === 'folder' ? t('deleteFolderConfirm') : t('deleteConfirm'))) return;
    await deleteItemMedia(it);
    LESSONS = LESSONS.filter(x => x.id !== id);
    saveLessons();
    showToast(t('deleted'));
    go({ name: 'home' }, false);
  }

  async function deleteLesson(id) {
    const found = findLesson(id);
    if (!found) return;
    if (found.lesson.protected) { showToast(t('protected')); return; }
    if (!confirm(t('deleteConfirm'))) return;
    await deleteItemMedia(found.lesson);
    if (found.parent) {
      found.parent.lessons = found.parent.lessons.filter(l => l.id !== id);
    } else {
      LESSONS = LESSONS.filter(it => !(it.type === 'lesson' && it.id === id));
    }
    saveLessons();
    showToast(t('deleted'));
    if (state.route.name === 'lesson' && state.route.lesson === id) go({ name: 'home' }, false);
    else go(state.route, false);
  }

  function cardThumb(it, idx) {
    if (it.image) {
      if (isIDBMedia(it.image)) return `<div class="card-thumb media-placeholder" data-media-ref="${esc(it.image)}"></div>`;
      return `<div class="card-thumb"><img src="${esc(toWebUrl(it.image))}" alt="" onerror="this.style.display='none'"></div>`;
    }
    if (it.type === 'folder') return `<div class="card-thumb" style="color:#fff; background:var(--accent-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v1H2V6zm0 3h20v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9z"/></svg></div>`;
    return `<div class="num">${idx || it.id}</div>`;
  }

  function menuBtn(it, type) {
    return it.protected ? '' : `<button class="menu-btn" data-menu="${it.id}" data-type="${type}" title="${t('actions')}">⋮</button>`;
  }

  function openActionSheet(id, type) {
    const sheet = document.getElementById('action-sheet');
    const titleEl = document.getElementById('sheet-title');
    const actions = document.getElementById('sheet-actions');
    const it = type === 'folder' ? findFolder(id) : (findLesson(id) || {}).lesson;
    const label = it ? title(it.title) : '';
    titleEl.textContent = esc(label);
    actions.innerHTML = `
      <button type="button" class="btn" data-edit="${id}" data-type="${type}">${t('edit')}</button>
      <button type="button" class="btn ghost" data-set-image="${id}" data-type="${type}">${t('setImage')}</button>
      ${type === 'folder' ? '' : `<button type="button" class="btn ghost" data-move="${id}">📁 ${t('moveToFolder')}</button>`}
      <button type="button" class="btn ghost" style="color:var(--danger); border-color:var(--danger)" data-delete-sheet="${id}" data-type="${type}">${type === 'folder' ? t('deleteFolder') : t('deleteLesson')}</button>
    `;
    sheet.classList.add('show');
  }

  function openMoveSheet(id) {
    const found = findLesson(id);
    if (!found) return;
    const folders = LESSONS.filter(it => it.type === 'folder');
    if (!folders.length && !found.parent) { showToast(t('noFolders')); return; }
    const sheet = document.getElementById('action-sheet');
    document.getElementById('sheet-title').textContent = t('moveToFolder');
    const curId = found.parent ? found.parent.id : null;
    document.getElementById('sheet-actions').innerHTML =
      (found.parent ? `<button type="button" class="btn ghost" data-move-to="root" data-lesson="${id}">${t('moveToRoot')}</button>` : '') +
      folders.filter(f => f.id !== curId).map(f => `<button type="button" class="btn ghost" data-move-to="${f.id}" data-lesson="${id}">📁 ${esc(title(f.title))}</button>`).join('');
    sheet.classList.add('show');
  }

  function moveLesson(id, target) {
    const found = findLesson(id);
    if (!found) return;
    const lesson = found.lesson;
    if (found.parent) found.parent.lessons = (found.parent.lessons || []).filter(l => l.id !== id);
    else LESSONS = LESSONS.filter(it => it !== lesson);
    if (target === 'root') LESSONS.push(lesson);
    else {
      const folder = findFolder(target);
      if (!folder) { LESSONS.push(lesson); }
      else { folder.lessons = folder.lessons || []; folder.lessons.push(lesson); }
    }
    saveLessons();
    showToast(t('moved'));
    go(state.route, false);
  }

  function closeActionSheet() {
    document.getElementById('action-sheet').classList.remove('show');
  }

  async function setItemImage(id, type, file) {
    if (!file || !isImageFile(file)) { showToast(t('invalidImage')); return; }
    let it;
    if (type === 'folder') it = findFolder(id);
    else { const found = findLesson(id); it = found ? found.lesson : null; }
    if (!it) return;
    if (it.protected) { showToast(t('protected')); return; }
    try {
      const uri = await storeMedia(file) || await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      if (it.image) await deleteMediaRef(it.image);
      it.image = uri;
      saveLessons();
      showToast(t('saved'));
      go(state.route, false);
    } catch (e) {
      console.error('setItemImage', e);
      showToast(t('mediaSaveError'));
    }
  }

  async function addLessonImageOverlay(container) {
    const ref = container.dataset.imageRef;
    const lessonId = container.dataset.lessonId ? +container.dataset.lessonId : null;
    if (!ref || lessonId == null) return;
    const resolved = await resolveMediaRef(ref);
    if (!resolved.url) return;
    const overlay = document.createElement('div');
    overlay.className = 'lesson-image-overlay show';
    overlay.dataset.imageRef = ref;
    overlay.innerHTML = `<img src="${esc(resolved.url)}" alt="" onerror="this.style.display='none'" draggable="false"><button type="button" class="lesson-image-toggle" title="${t('hideImage')}">🙈</button><button type="button" class="lesson-image-del" title="${t('delete')}" data-lesson-id="${lessonId}">×</button>`;
    container.appendChild(overlay);
    overlay.querySelector('.lesson-image-toggle').onclick = (e) => { e.stopPropagation(); toggleLessonImageOverlay(); };
    overlay.querySelector('.lesson-image-del').onclick = (e) => { e.stopPropagation(); if (confirm(t('confirmDeleteImage'))) deleteLessonImage(lessonId); };
    const btn = document.getElementById('lesson-image-toggle');
    if (btn) { btn.textContent = '🙈'; btn.title = t('hideImage'); btn.onclick = toggleLessonImageOverlay; }
  }

  function toggleLessonImageOverlay() {
    const overlay = document.querySelector('.lesson-image-overlay');
    const btn = document.getElementById('lesson-image-toggle');
    if (!overlay) return;
    const show = !overlay.classList.contains('show');
    overlay.classList.toggle('show', show);
    if (btn) { btn.textContent = show ? '🙈' : '👁'; btn.title = show ? t('hideImage') : t('showImage'); }
  }

  async function deleteLessonImage(lessonId) {
    const found = findLesson(lessonId);
    if (!found) return;
    if (found.lesson.image) {
      if (isIDBMedia(found.lesson.image)) { try { await deleteMediaRef(found.lesson.image); } catch (e) {} }
      delete found.lesson.image;
      saveLessons();
    }
    showToast(t('deleted'));
    go(state.route, false);
  }

  function editItem(id, type) {
    if (type === 'folder') {
      const folder = findFolder(id);
      if (!folder) return;
      if (folder.protected) { showToast(t('protected')); return; }
      const ttl = parseTitle(prompt(t('editFolderTitle'), formatTitle(folder.title)) || '');
      if (!ttl) return;
      folder.title = ttl;
      saveLessons();
      showToast(t('saved'));
      go(state.route, false);
    } else {
      const found = findLesson(id);
      if (found && found.lesson.protected) { showToast(t('protected')); return; }
      go({ name: 'edit-lesson', lesson: id });
    }
  }

  function addFolder() {
    const form = document.getElementById('add-folder-form');
    const ttl = parseTitle(form.elements.title.value);
    if (!ttl) { alert(t('fillTitleError')); return; }
    LESSONS.push({ id: nextId(), type: 'folder', title: ttl, lessons: [] });
    saveLessons();
    showToast(t('saved'));
    go({ name: 'home' });
  }

  function readFileText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = e => reject(e);
      reader.readAsText(file);
    });
  }

  function generatePhrasesFromCaptions() {
    const form = document.getElementById('add-lesson-form') || document.getElementById('edit-lesson-form');
    if (!form) return;
    const text = form.elements.captions.value.trim();
    if (!text) { alert(t('captionParseError')); return; }
    const captions = parseCaptions(text);
    if (!captions.length) { alert(t('captionParseError')); return; }
    form.elements.phrases.value = captions.map(c => `${c.fr} | ${c.ar} | ${c.en}`).join('\n');
    showToast(t('phrasesGenerated').replace('{n}', captions.length));
  }

  async function addLesson() {
    const form = document.getElementById('add-lesson-form');
    const ttl = parseTitle(form.elements.title.value);
    if (!ttl) { alert(t('fillTitleError')); return; }
    const folderId = +form.elements.folderId.value || 0;
    const folder = folderId ? findFolder(folderId) : null;

    let media = '';
    const videoFile = document.getElementById('lesson-video-file').files[0];
    const videoUrl = form.elements.videoUrl.value.trim();
    if (videoFile) {
      media = await storeMedia(videoFile);
      if (!media) { alert(t('mediaSaveError')); return; }
    } else if (videoUrl) {
      const valid = /^https?:\/\//.test(videoUrl) || /^data:/.test(videoUrl) || /^file:\/\//.test(videoUrl) || /^idb:\/\//.test(videoUrl) || isVideoUrl(videoUrl);
      if (!valid) { alert(t('mediaInvalid')); return; }
      media = videoUrl;
    }
    if (!media) {
      const audioFile = document.getElementById('lesson-audio-file').files[0];
      const audioUrl = form.elements.audioUrl.value.trim();
      if (audioFile) {
        media = await storeMedia(audioFile);
        if (!media) { alert(t('mediaSaveError')); return; }
      } else if (audioUrl) {
        const valid = /^https?:\/\//.test(audioUrl) || /^data:/.test(audioUrl) || /^file:\/\//.test(audioUrl) || /^idb:\/\//.test(audioUrl) || isAudioUrl(audioUrl);
        if (!valid) { alert(t('mediaInvalid')); return; }
        media = audioUrl;
      }
    }

    let captionText = form.elements.captions.value.trim();
    const captionFile = document.getElementById('lesson-captions-file').files[0];
    if (captionFile) {
      try { captionText = await readFileText(captionFile); }
      catch (e) { alert(t('captionParseError')); return; }
    }

    let phrases = [];
    if (captionText) {
      const captions = parseCaptions(captionText);
      if (!captions.length) { alert(t('captionParseError')); return; }
      phrases = captions.map(c => ({ fr: c.fr, ar: c.ar, en: c.en, start: c.start, end: c.end }));
    } else {
      phrases = parsePhrases(form.elements.phrases.value, form.elements.order.value);
    }
    if (!phrases.length) { alert(t('noPhrasesError')); return; }

    const lesson = { id: nextId(), type: 'lesson', title: ttl, phrases };
    if (media) lesson.media = media;
    if (captionText) lesson.captionText = captionText;

  function youtubeId(url) {
    const m = String(url).match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function isVideoUrl(url) {
    return /^data:video|\.(mp4|webm|mov|ogv|3gp|3gpp|avi|mkv|flv|m4v|mpeg|mpg)(\?|$)/i.test(url);
  }

  function isAudioUrl(url) {
    return /^data:audio|\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|weba|wma)(\?|$)/i.test(url);
  }

  async function playLesson(lesson) {
    const ready = await prepareTTS();
    if (!ready) { return; }
    stopSpeech();
    let i = 0;
    const runKey = 'lesson:' + lesson.id;
    state.loop = { key: runKey };
    (function next() {
      if (!state.loop || state.loop.key !== runKey) return;
      if (i >= lesson.phrases.length) { i = 0; }
      const p = lesson.phrases[i];
      const key = phraseKey(lesson.id, i);
      i++;
      const el = document.querySelector(`.phrase[data-key="${key}"]`);
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      speakOnce(p, state.langs, key, () => {
        if (!state.loop || state.loop.key !== runKey) return;
        setTimeout(next, 400);
      });
    })();
  }

  async function updateLesson() {
    const form = document.getElementById('edit-lesson-form');
    const ttl = parseTitle(form.elements.title.value);
    if (!ttl) { alert(t('fillTitleError')); return; }
    const id = +form.dataset.id;
    const found = findLesson(id);
    if (!found) return;
    const lesson = found.lesson;

    let newMedia = null;
    const videoFile = document.getElementById('lesson-video-file').files[0];
    const audioFile = document.getElementById('lesson-audio-file').files[0];
    const videoUrl = form.elements.videoUrl.value.trim();
    const audioUrl = form.elements.audioUrl.value.trim();
    if (videoFile || audioFile) {
      newMedia = await storeMedia(videoFile || audioFile);
      if (!newMedia) { alert(t('mediaSaveError')); return; }
    } else if (videoUrl && videoUrl !== lesson.media) {
      const valid = /^https?:\/\//.test(videoUrl) || /^data:/.test(videoUrl) || /^file:\/\//.test(videoUrl) || /^idb:\/\//.test(videoUrl) || isVideoUrl(videoUrl);
      if (!valid) { alert(t('mediaInvalid')); return; }
      newMedia = videoUrl;
    } else if (audioUrl && audioUrl !== lesson.media) {
      const valid = /^https?:\/\//.test(audioUrl) || /^data:/.test(audioUrl) || /^file:\/\//.test(audioUrl) || /^idb:\/\//.test(audioUrl) || isAudioUrl(audioUrl);
      if (!valid) { alert(t('mediaInvalid')); return; }
      newMedia = audioUrl;
    }
    const removeOld = form.dataset.removeMedia === '1' || (newMedia && newMedia !== lesson.media);
    if (removeOld && lesson.media) { await deleteMediaRef(lesson.media); delete lesson.media; }
    if (newMedia) lesson.media = newMedia;

    let captionText = form.elements.captions.value.trim();
    const captionFile = document.getElementById('lesson-captions-file').files[0];
    if (captionFile) {
      try { captionText = await readFileText(captionFile); }
      catch (e) { alert(t('captionParseError')); return; }
    }
    let phrases;
    const phrasesRaw = form.elements.phrases.value.trim();
    if (captionText && captionText !== (lesson.captionText || '') && !phrasesRaw) {
      const captions = parseCaptions(captionText);
      if (!captions.length) { alert(t('captionParseError')); return; }
      phrases = captions.map(c => ({ fr: c.fr, ar: c.ar, en: c.en, start: c.start, end: c.end }));
    } else {
      phrases = parsePhrases(phrasesRaw, 'auto');
      if (captionText) {
        const captions = parseCaptions(captionText);
        if (captions.length === phrases.length) phrases.forEach((p, i) => { p.start = captions[i].start; p.end = captions[i].end; });
      }
    }
    if (!phrases.length) { alert(t('noPhrasesError')); return; }
    if (captionText) lesson.captionText = captionText; else delete lesson.captionText;

    lesson.title = ttl;
    lesson.phrases = phrases;
    saveLessons();
    showToast(t('saved'));
    go({ name: 'lesson', lesson: id });
  }

  function noteSnapshot() {

  function noteRestore(img) {

    noteCtx.clearRect(0, 0, img.width, img.height);

  function undoNote() {

    noteRedo.push(noteCtx.getImageData(0, 0, canvas.width, canvas.height));

  function redoNote() {

  function setupNoteCanvas() {
    const canvas = document.getElementById('note-canvas');
    noteCtx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || 600;
    const cssHeight = canvas.clientHeight || 400;
    canvas.width = Math.max(1, cssWidth * dpr);
    canvas.height = Math.max(1, cssHeight * dpr);
    noteCtx.setTransform(1, 0, 0, 1, 0, 0);
    noteCtx.scale(dpr, dpr);
    noteCtx.lineCap = 'round';
    noteCtx.lineJoin = 'round';
  }

  function clearNote() {
    if (!noteCtx) return;
    noteSnapshot();
    const canvas = document.getElementById('note-canvas');
    noteCtx.clearRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
  }

  function getNotePos(e) {
    const canvas = document.getElementById('note-canvas');
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function noteStart(e) {
    if (!noteCtx) return;
    e.preventDefault();
    noteSnapshot();
    noteDrawing = true;
    const p = getNotePos(e);
    noteCtx.beginPath();
    noteCtx.moveTo(p.x, p.y);
    noteCtx.globalCompositeOperation = noteErasing ? 'destination-out' : 'source-over';
    noteCtx.globalAlpha = noteHighlight ? 0.35 : 1;
    noteCtx.lineCap = noteHighlight ? 'square' : 'round';
    noteCtx.strokeStyle = noteColor;
    noteCtx.lineWidth = noteErasing ? noteSize * 4 : (noteHighlight ? noteSize * 3 : noteSize);
  }

  function noteMove(e) {
    if (!noteDrawing || !noteCtx) return;
    e.preventDefault();
    const p = getNotePos(e);
    noteCtx.lineTo(p.x, p.y);
    noteCtx.stroke();
  }

  function noteEnd() {
    if (!noteCtx) return;
    noteDrawing = false;
    noteCtx.closePath();
  }

  function bindNoteCanvas() {
    const canvas = document.getElementById('note-canvas');
    canvas.addEventListener('mousedown', noteStart);
    canvas.addEventListener('mousemove', noteMove);
    window.addEventListener('mouseup', noteEnd);
    canvas.addEventListener('touchstart', noteStart, { passive: false });
    canvas.addEventListener('touchmove', noteMove, { passive: false });
    canvas.addEventListener('touchend', noteEnd);
  }

        const video = media && media.querySelector('video');
        if (video) seekVideoCue(video, videoNavBtn.classList.contains('video-next') ? 1 : -1);
        return;
      }

      const videoLoopBtn = e.target.closest('.video-loop-btn');
      if (videoLoopBtn) {
        e.stopPropagation();
        const media = videoLoopBtn.closest('.phrase-media');
        const video = media && media.querySelector('video');
        if (video) {
          video.loop = !video.loop;
          videoLoopBtn.classList.toggle('active', video.loop);
          videoLoopBtn.textContent = video.loop ? '🔂' : '🔁';
        }

      const exportBtn = e.target.closest('#btn-export');

      const infoBtn = e.target.closest('[data-info]');
      if (infoBtn) { e.stopPropagation(); showPhraseExamples(); return; }

      const menuBtn = e.target.closest('[data-menu]');
      if (menuBtn) { e.stopPropagation(); openActionSheet(+menuBtn.dataset.menu, menuBtn.dataset.type); return; }

      const routeBtn = e.target.closest('[data-route]');
      if (routeBtn) { go(JSON.parse(routeBtn.dataset.route)); return; }

      const phrase = e.target.closest('.phrase');
      if (!phrase) return;
      const key = phrase.dataset.key;

      const langLoopBtn = e.target.closest('.loop-lang');
      if (langLoopBtn) {
        e.stopPropagation();
        toggleLangLoop(langLoopBtn.dataset.lang, key);
        return;
      }

      const word = e.target.closest('.word');
      if (word) {
        e.stopPropagation();
        toggleWordLoop(word.dataset.word, word.dataset.lang, key);
        return;
      }

      const [lessonId, idx] = key.split('.').map(Number);
      const found = findLesson(lessonId);
      if (!found) return;
      const p = found.lesson.phrases[idx];

      const phraseLoopBtn = e.target.closest('.phrase-loop-btn');
      if (phraseLoopBtn) {
        e.stopPropagation();
        toggleLoop(p, key);
        return;
      }

      if (e.target.closest('.loop-btn')) {
        toggleLoop(p, key);
      } else if (e.target.closest('.tts-loop-btn')) {
        toggleTTSLoop(p, key);
      } else if (e.target.closest('.ai-btn')) {
        const query = `French phrase: "${p.fr}"
Arabic translation: "${p.ar}"
English translation: "${p.en}"
1) Translate each individual word (French → Arabic → English).
2) Explain the French grammar rule (verb conjugation, structure, or expression) used in this phrase.
3) Provide a short practical conversation in French, Arabic and English using this phrase so it can be memorized as a conversation.
Output in French, Arabic and English.`;
        window.open('https://www.google.com/search?q=' + encodeURIComponent(query) + '&udm=50&hl=' + state.uiLang, '_blank');
      } else if (e.target.closest('.image-btn')) {
        e.stopPropagation();
        openImageForPhrase(key);
      } else if (e.target.closest('.media-btn')) {
        openMedia(key);
