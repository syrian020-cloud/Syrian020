<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f1f">
<title>مشغّل SRT</title>
<link rel="manifest" href="manifest-srt.json">
<style>
  :root {
    --bg-primary: #0b0d1f;
    --bg-secondary: #13162b;
    --bg-tertiary: #1e213d;
    --text-primary: #f0f1ff;
    --text-secondary: #8c90b5;
    --accent: #7b79ff;
    --accent-hover: #5c5bdb;
    --success: #00e676;
    --gold: #ffc857;
    --danger: #ff6b6b;
    --border: rgba(255,255,255,0.08);
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --shadow-sm: 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header { position: sticky; top: 0; z-index: 60; background: rgba(11,13,31,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .header-inner { max-width: 960px; margin: 0 auto; padding: 0.7rem 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .logo { font-weight: 800; color: var(--accent); font-size: 1.05rem; white-space: nowrap; }
  .spacer { flex: 1; }
  .icon-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 12px; padding: 0.45rem 0.65rem; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
  main { max-width: 960px; margin: 0 auto; padding: 0.9rem; }

  .panel { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 0.9rem; box-shadow: var(--shadow-sm); }
  .panel h2 { margin: 0 0 0.7rem; font-size: 1.1rem; }
  .panel p { margin: 0 0 0.7rem; color: var(--text-secondary); font-size: 0.9rem; }

  .file-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.7rem; align-items: stretch; flex-direction: column; }
  .file-row label { color: var(--text-secondary); font-size: 0.9rem; }
  .file-row input[type="file"] { flex: 1; width: 100%; min-width: 0; color: var(--text-primary); font-size: 0.9rem; }
  .file-row .file-name { color: var(--success); font-size: 0.85rem; }
  .paste-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.7rem; align-items: flex-start; }
  .paste-row label { flex: 0 0 7rem; color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.4rem; }
  .file-row textarea, .paste-row textarea {
    flex: 1;
    min-width: 0;
    min-height: 120px;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.6rem;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
    unicode-bidi: plaintext;
  }

  .action-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.8rem; }
  button.primary { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 0.75rem 1.6rem; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(123,121,255,0.4); }
  button.primary:hover { background: var(--accent-hover); }
  button.secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem 1rem; font-size: 0.95rem; cursor: pointer; }
  button.secondary:hover { border-color: var(--accent); }

  .source-tabs { display: flex; gap: 0.4rem; margin: 0.8rem 0 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
  .source-tab { background: transparent; color: var(--text-secondary); border: none; padding: 0.45rem 0.8rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: 999px; }
  .source-tab:hover { color: var(--text-primary); }
  .source-tab.active { background: var(--bg-tertiary); color: var(--text-primary); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .hint { color: var(--text-secondary); font-size: 0.85rem; margin: 0.2rem 0 0.5rem; }

  .video-wrap { position: relative; background: #000; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 0.9rem; }
  video { width: 100%; display: block; }

  .bubble-wrap { display: flex; justify-content: center; padding: 0.5rem 0 1rem; }
  .subtitle-bubble {
    background: linear-gradient(135deg, rgba(123,121,255,0.18), rgba(0,230,118,0.08));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem 1.4rem;
    width: 100%;
    max-width: 720px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 0.8rem;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
    position: relative;
  }
  .bubble-loop {
    position: absolute;
    top: 0.7rem;
    inset-inline-end: 0.8rem;
    background: rgba(0,0,0,0.35);
    color: var(--gold);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    z-index: 5;
  }
  .bubble-loop:hover { background: rgba(0,0,0,0.55); border-color: var(--gold); }
  .bubble-loop.active { background: var(--success); color: #0b0d1f; border-color: var(--success); }
  .subtitle-bubble:empty::before { content: "اختر ملف فيديو وملف (ملفات) ترجمة ثم اضغط ابدأ"; color: var(--text-secondary); font-size: 0.95rem; text-align: center; }
  .lang-line {
    border-radius: var(--radius-sm);
    padding: 0.7rem 0.9rem;
    font-size: 1.15rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
    position: relative;
  }
  .lang-line .badge {
    position: absolute;
    top: -0.45rem;
    inset-inline-start: 0.6rem;
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 0.15rem 0.45rem;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .lang-line .loop {
    position: absolute;
    top: -0.45rem;
    inset-inline-end: 0.6rem;
    background: rgba(0,0,0,0.45);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    font-size: 0.8rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .lang-line .loop:hover { background: rgba(0,0,0,0.65); }
  .lang-line .loop.active { background: var(--success); color: #0b0d1f; }
  .lang-line.fr { background: linear-gradient(135deg, #ff9f43, #ff7f50); color: #1a1a1a; }
  .lang-line.ar { background: linear-gradient(135deg, #2dd4bf, #14b8a6); color: #1a1a1a; direction: rtl; }
  .lang-line.en { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: #1a1a1a; direction: ltr; }
  .lang-line .word { cursor: pointer; border-radius: 4px; padding: 0.05em 0.1em; transition: background 0.12s; }
  .lang-line .word:hover { background: rgba(0,0,0,0.15); }
  .lang-line .word.active { background: rgba(0,0,0,0.35); box-shadow: 0 0 0 2px var(--text-primary); }

  .controls { display: flex; flex-direction: column; gap: 0.7rem; align-items: center; margin-bottom: 0.9rem; }
  .time-row { display: flex; align-items: center; gap: 0.5rem; width: 100%; max-width: 720px; color: var(--text-secondary); font-size: 0.85rem; }
  .rate-row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; max-width: 720px; color: var(--text-secondary); font-size: 0.9rem; }
  #rate { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.7rem; font-size: 0.9rem; font-family: inherit; cursor: pointer; }
  #rate:focus { outline: none; border-color: var(--accent); }
  #progress { flex: 1; -webkit-appearance: none; height: 6px; background: var(--bg-tertiary); border-radius: 3px; outline: none; }
  #progress::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--accent); border-radius: 50%; cursor: pointer; }

  .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
  .ctrl-btn {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 52px;
    height: 52px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { border-color: var(--accent); }
  .ctrl-btn.active { background: var(--success); color: #0b0d1f; border-color: var(--success); }

  .lang-btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; }
  .lang-btn {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.45rem 0.9rem;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }
  .lang-btn:hover { border-color: var(--accent); }
  .lang-btn.active { background: var(--success); color: #0b0d1f; border-color: var(--success); }

  .status { text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem; }

  footer { text-align: center; padding: 1.5rem 1rem; color: var(--text-secondary); font-size: 0.8rem; }
  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.6rem 1.1rem; z-index: 100; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-weight: 600; direction: rtl; }
  .toast.show { opacity: 1; }

  .view { display: none; }
  .view.active { display: block; }

  .lesson-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.8rem 0.9rem;
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
  }
  .lesson-card .title { font-weight: 700; font-size: 1rem; }
  .lesson-card .date { color: var(--text-secondary); font-size: 0.75rem; }
  .lesson-actions { display: flex; gap: 0.4rem; }
  .empty-hint { color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 1rem 0; }

  .lesson-card { align-items: flex-start; }
  .lesson-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-inline-end: 0.8rem; background: var(--bg-secondary); flex: 0 0 auto; }
  .lesson-info { flex: 1; min-width: 0; }
  .lesson-card .title { word-break: break-word; }

  .player-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
  .player-header .lesson-title { color: var(--text-secondary); font-size: 0.9rem; }

  #btn-save-lesson { white-space: nowrap; }

  @media (max-width: 480px) {
    .file-row label, .paste-row label { flex: 0 0 100%; }
    .file-row input[type="file"] { flex: 1 0 100%; }
    .file-row textarea, .paste-row textarea { flex: 1 0 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo" data-t="logo">مشغّل SRT</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-lang" title="Language / Langue / اللغة">AR</button>
    <button class="icon-btn" id="btn-lessons" title="الدروس" data-t-title="lessonsTitle">📚</button>
    <button class="icon-btn" id="btn-setup" title="إعداد درس جديد" data-t-title="newLessonTitle">➕</button>
    <button class="icon-btn" id="btn-stop" title="إيقاف الصوت" data-t-title="stopAudio">🔇</button>
  </div>
</header>

<main>
  <section class="view active" id="lessons-view">
    <div class="panel">
      <h2 data-t="lessonsTitle">دروسي</h2>
      <div id="lessons-list">
        <p class="empty-hint" data-t="emptyHint">لا توجد دروس محفوظة. اضغط على “➕” لإعداد درس جديد.</p>
      </div>
      <button class="primary" id="btn-new-lesson" style="margin-top:0.8rem;" data-t="newLesson">+ درس جديد</button>
    </div>
  </section>

  <section class="view" id="setup-view">
    <div class="panel" id="setup-panel">
      <h2 data-t="setupTitle">إعداد درس جديد</h2>

      <div class="file-row">
        <label for="video-file" data-t="videoLabel">فيديو/صوت</label>
        <input type="file" id="video-file" accept="video/*,audio/*">
        <span class="file-name" id="video-name"></span>
      </div>
      <div class="file-row">
        <label for="lesson-image" data-t="imageLabel">صورة الدرس (اختياري)</label>
        <input type="file" id="lesson-image" accept="image/*">
        <span class="file-name" id="image-name"></span>
      </div>

      <div class="source-tabs">
        <button class="source-tab active" data-tab="single" type="button" data-t="tabSingle">ملف ترجمة واحد</button>
        <button class="source-tab" data-tab="separate" type="button" data-t="tabSeparate">ملفات منفصلة</button>
        <button class="source-tab" data-tab="paste" type="button" data-t="tabPaste">لصق نص</button>
      </div>

      <div class="tab-panel active" data-tab="single">
        <div class="file-row">
          <label for="srt-main" data-t="mainFileLabel">ملف الترجمة</label>
          <input type="file" id="srt-main" accept=".srt,.txt">
          <span class="file-name" id="name-main"></span>
        </div>
        <p class="hint" data-t="singleHint">اختر ملف SRT/TXT واحد يحتوي على الفرنسية والعربية والإنجليزية لكل عبارة.</p>
      </div>

      <div class="tab-panel" data-tab="separate">
        <div class="file-row">
          <label for="srt-fr" data-t="langFrench">الفرنسية</label>
          <input type="file" id="srt-fr" accept=".srt,.txt">
          <span class="file-name" id="name-fr"></span>
        </div>
        <div class="file-row">
          <label for="srt-ar" data-t="langArabic">العربية</label>
          <input type="file" id="srt-ar" accept=".srt,.txt">
          <span class="file-name" id="name-ar"></span>
        </div>
        <div class="file-row">
          <label for="srt-en" data-t="langEnglish">الإنجليزية</label>
          <input type="file" id="srt-en" accept=".srt,.txt">
          <span class="file-name" id="name-en"></span>
        </div>
      </div>

      <div class="tab-panel" data-tab="paste">
        <div class="paste-row">
          <label for="srt-paste" data-t="pasteLabel">النص المؤقت</label>
          <textarea id="srt-paste" placeholder="00:00 Je suis désolé.&#10;أنا آسف.&#10;I'm sorry."></textarea>
        </div>
      </div>

      <div class="action-row">
        <button class="primary" id="btn-start" data-t="startBtn">▶ معاينة / بدء</button>
        <button class="secondary" id="btn-save-lesson" data-t="saveBtn">💾 حفظ الدرس</button>
        <button class="secondary" id="btn-reset" data-t="resetBtn">إعادة ضبط</button>
      </div>
    </div>
  </section>

  <section class="view" id="player-view">
    <div class="player-header">
      <button class="icon-btn" id="btn-back-lessons" data-t="backToLessons">← الدروس</button>
      <span class="spacer"></span>
      <span class="lesson-title" id="lesson-title"></span>
    </div>
    <div class="video-wrap" id="video-wrap" style="display:none;">
      <video id="player" controls playsinline></video>
    </div>
    <div class="bubble-wrap">
      <div class="subtitle-bubble" id="bubble"></div>
    </div>
    <section class="controls" id="controls" style="display:none;">
      <div class="time-row">
        <span id="current-time">00:00</span>
        <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
        <span id="duration">00:00</span>
      </div>
      <div class="rate-row">
        <label for="rate" data-t="rateLabel">سرعة الفيديو</label>
        <select id="rate">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="ctrl-btn" id="btn-prev" title="السطر السابق (←)" data-t-title="prevTitle">⏮</button>
        <button class="ctrl-btn" id="btn-play" title="تشغيل/إيقاف (مسافة)" data-t-title="playTitle">⏯</button>
        <button class="ctrl-btn" id="btn-next" title="السطر التالي (→)" data-t-title="nextTitle">⏭</button>
        <button class="ctrl-btn" id="btn-full-loop" title="تكرار الفيديو كاملاً من البداية للنهاية" data-t-title="fullLoopTitle">🔁</button>
        <button class="ctrl-btn" id="btn-video-loop" title="تكرار عبارة الفيديو" data-t-title="videoLoopTitle">🔂</button>
        <button class="ctrl-btn" id="btn-loop-all" title="تكرار النطق بالثلاث لغات" data-t-title="loopAllTitle">🔄</button>
      </div>
      <div class="lang-btn-row" id="lang-btns"></div>
      <div class="status" id="status"></div>
    </section>
  </section>
</main>

<footer data-t="footer">مشغّل SRT مصاحب للفيديو — يدعم الفرنسية والعربية والإنجليزية</footer>
<div class="toast" id="toast"></div>
<input type="file" id="edit-image" accept="image/*" style="display:none">

<script>
(function(){
  'use strict';

  // --- DOM refs ---
  const $ = id => document.getElementById(id);
  const videoFile = $('video-file'), lessonImage = $('lesson-image'), editImage = $('edit-image'), srtMain = $('srt-main'), srtFr = $('srt-fr'), srtAr = $('srt-ar'), srtEn = $('srt-en'), srtPaste = $('srt-paste');
  const videoName = $('video-name'), imageName = $('image-name'), nameMain = $('name-main'), nameFr = $('name-fr'), nameAr = $('name-ar'), nameEn = $('name-en');
  const btnStart = $('btn-start'), btnReset = $('btn-reset'), btnStop = $('btn-stop');
  const videoWrap = $('video-wrap'), player = $('player'), bubble = $('bubble');
  const controls = $('controls'), progress = $('progress'), currentTimeEl = $('current-time'), durationEl = $('duration');
  const btnPrev = $('btn-prev'), btnPlay = $('btn-play'), btnNext = $('btn-next'), btnFullLoop = $('btn-full-loop'), btnVideoLoop = $('btn-video-loop'), btnLoopAll = $('btn-loop-all');
  const btnLessons = $('btn-lessons'), btnSetup = $('btn-setup'), btnNewLesson = $('btn-new-lesson'), btnSaveLesson = $('btn-save-lesson'), btnBackLessons = $('btn-back-lessons'), btnLang = $('btn-lang');
  const lessonsView = $('lessons-view'), setupView = $('setup-view'), playerView = $('player-view'), lessonsList = $('lessons-list'), lessonTitle = $('lesson-title');
  const langBtns = $('lang-btns'), statusEl = $('status'), toast = $('toast'), rateSelect = $('rate');

  // --- State ---
  const state = {
    cues: [], // { start, end, lines: [{lang, text}] }
    currentIndex: -1,
    isPlaying: false,
    loopAll: false,
    loopLang: null,
    ttsChain: null,
    loopToken: 0,
    videoLoop: false,
    loopStart: 0,
    loopEnd: 0,
    fullVideoLoop: false,
    pendingSeek: null,
    duration: 0,
    playbackRate: 1,
    videoUrl: null,
    posterUrl: null,
    thumbUrls: [],
    editingImageId: null,
    uiLang: localStorage.getItem('srt_ui_lang') || 'ar',
    wordLoopEl: null
  };

  const LANG_ORDER = ['fr','ar','en'];
  const LANG_LABELS = { fr: 'FR', ar: 'AR', en: 'EN' };
  const LANG_NAMES = { fr: 'Français', ar: 'العربية', en: 'English' };

  const UI_LANGS = ['ar','fr','en'];
  const UI = {
    ar: {
      appName: 'SRT Player',
      title: 'مشغّل SRT',
      logo: 'مشغّل SRT',
      lessonsTitle: 'دروسي',
      emptyHint: 'لا توجد دروس محفوظة. اضغط على “➕” لإعداد درس جديد.',
      newLesson: '+ درس جديد',
      newLessonTitle: 'إعداد درس جديد',
      setupTitle: 'إعداد درس جديد',
      videoLabel: 'فيديو/صوت',
      imageLabel: 'صورة الدرس (اختياري)',
      tabSingle: 'ملف ترجمة واحد',
      tabSeparate: 'ملفات منفصلة',
      tabPaste: 'لصق نص',
      mainFileLabel: 'ملف الترجمة',
      langFrench: 'الفرنسية',
      langArabic: 'العربية',

  function formatTime(sec) {
    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60);
    const s = Math.floor(sec%60);
    const ms = Math.round((sec%1)*1000).toString().padStart(3,'0');
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms}`;
  }
  function formatDuration(sec) {
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

    }).join('');
  }

  // --- Lessons DB ---
  const DB_NAME = 'SrtLessonsDB', DB_VERSION = 1, STORE = 'lessons';
  let _db = null;
  function openLessonsDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { resolve(null); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => resolve(req.result);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      };
    });
  }
  async function db() { if (!_db) _db = await openLessonsDB(); return _db; }
  function withStore(mode, fn) {
    return new Promise(async (resolve, reject) => {
      try {
        const d = await db();
        if (!d) { resolve([]); return; }
        const tx = d.transaction([STORE], mode);
        const store = tx.objectStore(STORE);
        const req = fn(store);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
  }
  function saveLessonToDB(lesson) { return withStore('readwrite', store => store.put(lesson)); }
  function getLessonsFromDB() { return withStore('readonly', store => store.getAll()); }
  function getLessonById(id) { return withStore('readonly', store => store.get(id)); }
  function deleteLessonFromDB(id) { return withStore('readwrite', store => store.delete(id)); }
  function readFileAsArrayBuffer(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsArrayBuffer(file);
    });
  }

  // --- Time parsing ---
  function parseTime(t) {
    t = t.trim().replace(',', '.');
    const parts = t.split(':');
    if (parts.length === 3) {
      const [h, m, s] = parts;
      const [sec, ms='0'] = s.split('.');
      return (parseInt(h,10)*3600 + parseInt(m,10)*60 + parseInt(sec,10)) + parseFloat('0.' + ms.padEnd(3,'0'));
    }
    if (parts.length === 2) {
      const [m, s] = parts;
      const [sec, ms='0'] = s.split('.');
      return (parseInt(m,10)*60 + parseInt(sec,10)) + parseFloat('0.' + ms.padEnd(3,'0'));
    }
    const [sec, ms='0'] = t.split('.');
    return parseInt(sec,10) + parseFloat('0.' + ms.padEnd(3,'0'));
  }

  function parseSrt(srt) {
    const cues = [];
    const blocks = srt.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
    for (const block of blocks) {
      const lines = block.trim().split('\n');
      if (lines.length < 2) continue;
      const timeLine = lines.find(l => l.includes('-->'));
      if (!timeLine) continue;
      const [start, end] = timeLine.split('-->').map(s => parseTime(s.trim()));
      const textLines = lines.slice(lines.indexOf(timeLine) + 1).filter(l => l.trim());
      if (!isNaN(start) && !isNaN(end) && textLines.length) {
        cues.push({ start, end, text: textLines.join('\n') });
      }
    }
    return cues;
  }

  function parseTimedText(text) {
    const cues = [];
    const rawLines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    const timedLines = [];
    let currentEntry = null;

    function parseLineTime(line) {
      let m = line.match(/^\[(?:(\d{1,2}):)?(?:(\d{1,2}):)?(\d{1,2})(?:[.,](\d{1,3}))?\]\s*(.*)$/);
      if (m) {
        const parts = [m[1], m[2], m[3]].filter(Boolean);
        const timeStr = parts.join(':') + (m[4] ? '.' + m[4] : '');
        return { start: parseTime(timeStr), text: m[5].trim() };
      }
      m = line.match(/^((?:\d{1,2}:)?(?:\d{1,2}:)?\d{1,2}(?:[.,]\d{1,3})?)\s*-->?\s*((?:\d{1,2}:)?(?:\d{1,2}:)?\d{1,2}(?:[.,]\d{1,3})?)\s*(.*)$/);
      if (m) return { start: parseTime(m[1]), end: parseTime(m[2]), text: m[3].trim() };
      m = line.match(/^(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?\s+(.+)$/);
      if (m) {
        const start = parseInt(m[1],10)*3600 + parseInt(m[2],10)*60 + parseInt(m[3],10) + (m[4] ? parseFloat('0.' + m[4].padEnd(3,'0')) : 0);
        return { start, text: m[5].trim() };
      }
      m = line.match(/^(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?\s+(.+)$/);
      if (m) {
        const start = parseInt(m[1],10)*60 + parseInt(m[2],10) + (m[3] ? parseFloat('0.' + m[3].padEnd(3,'0')) : 0);
        return { start, text: m[4].trim() };
      }
      return null;
    }

    for (const raw of rawLines) {
      const line = raw.trim();
      if (!line) continue;
      const parsed = parseLineTime(line);
      if (parsed) {
        if (currentEntry) timedLines.push(currentEntry);
        currentEntry = { start: parsed.start, end: parsed.end, text: parsed.text };
      } else if (currentEntry) {
        currentEntry.text += '\n' + line;
      }
    }
    if (currentEntry) timedLines.push(currentEntry);

    for (let i = 0; i < timedLines.length; i++) {
      const entry = timedLines[i];
      let end = entry.end;
      if (end === undefined || isNaN(end)) {
        const nextStart = timedLines[i+1] ? timedLines[i+1].start : null;
        end = (nextStart && nextStart > entry.start) ? nextStart : entry.start + 4;
      }
      cues.push({ start: entry.start, end, text: entry.text });
    }
    for (let i = 0; i < cues.length - 1; i++) {
      if (cues[i].end > cues[i+1].start) cues[i].end = cues[i+1].start;
      if (cues[i].end <= cues[i].start) cues[i].end = cues[i].start + 1.5;
    }
    return cues;
  }

  function isSrtFormat(text) {
    const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
    return blocks.some(b => /^\s*\d+\s*\n\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}\s*-->\s*\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}/.test(b.trim()));
  }

  function isFlagFormat(text) {
    return /^\p{Regional_Indicator}{2}/mu.test(text);

  const FLAG_LANG_MAP = {
    '🇫🇷':'fr','🇧🇪':'fr','🇨🇭':'fr','🇨🇦':'fr',
    '🇸🇦':'ar','🇪🇬':'ar','🇸🇾':'ar','🇩🇿':'ar','🇮🇶':'ar','🇯🇴':'ar','🇱🇧':'ar','🇱🇾':'ar','🇲🇦':'ar','🇴🇲':'ar','🇵🇸':'ar','🇶🇦':'ar','🇸🇩':'ar','🇹🇳':'ar','🇦🇪':'ar','🇾🇪':'ar','🇰🇼':'ar','🇧🇭':'ar',

  function parseFlagFormat(text) {
    const cues = [];
    const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
    for (const block of blocks) {
      const lines = block.trim().split('\n').filter(l => l.trim());
      if (lines.length < 2) continue;
      const start = parseTime(lines[0].trim());
      if (isNaN(start)) continue;
      const langLines = [];
      for (let i = 1; i < lines.length; i++) {
        const parsed = parseFlagLine(lines[i].trim());
        if (parsed) langLines.push(parsed);
      }
      if (langLines.length === 0) continue;
      cues.push({ start, end: null, lines: langLines });
    }
    for (let i = 0; i < cues.length; i++) {
      if (cues[i].end === null || isNaN(cues[i].end)) {
        const nextStart = cues[i+1] ? cues[i+1].start : null;
        cues[i].end = (nextStart && nextStart > cues[i].start) ? nextStart : cues[i].start + 4;
      }
    }
    for (let i = 0; i < cues.length - 1; i++) {
      if (cues[i].end > cues[i+1].start) cues[i].end = cues[i+1].start;
      if (cues[i].end <= cues[i].start) cues[i].end = cues[i].start + 1.5;
    }
    return cues;
  }

  function isBlockFormat(text) {
    const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
    return blocks.some(b => {
      const lines = b.trim().split('\n').filter(Boolean);

  function computeCueEnds(cues) {
    for (let i = 0; i < cues.length; i++) {
      if (cues[i].end === null || cues[i].end === undefined || isNaN(cues[i].end)) {
        const nextStart = cues[i+1] ? cues[i+1].start : null;
        cues[i].end = (nextStart && nextStart > cues[i].start) ? nextStart : cues[i].start + 4;
      }
    }
    for (let i = 0; i < cues.length - 1; i++) {
      if (cues[i].end > cues[i+1].start) cues[i].end = cues[i+1].start;
      if (cues[i].end <= cues[i].start) cues[i].end = cues[i].start + 1.5;
    }
  }

  function parseBlockFormat(text) {
    const cues = [];
    const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
    for (const block of blocks) {
      const lines = block.trim().split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length < 2) continue;
      const start = parseTime(lines[0]);
      if (isNaN(start)) continue;
      const cueText = lines.slice(1).join('\n');
      const langLines = getCueTexts({ text: cueText });
      if (langLines.length === 0) continue;
      cues.push({ start, end: null, lines: langLines });

    return cues;
  }

  function parseSubtitle(text) {
    if (isSrtFormat(text)) return parseSrt(text);
    if (isFlagFormat(text)) return parseFlagFormat(text);
    if (isBlockFormat(text)) return parseBlockFormat(text);
    return parseTimedText(text);
  }

  function getCueTexts(cue) {
    const lines = cue.text.split('\n').map(l => l.trim()).filter(Boolean);
    const arLines = lines.filter(l => /[\u0600-\u06FF]/.test(l));
    const nonArLines = lines.filter(l => !/[\u0600-\u06FF]/.test(l));
    const result = [];
    let nonArIdx = 0;
    for (const lang of LANG_ORDER) {
      if (lang === 'ar') {
        if (arLines.length) result.push({ lang, text: arLines.shift() });
      } else if (nonArIdx < nonArLines.length) {
        result.push({ lang, text: nonArLines[nonArIdx++] });
      }
    }
    arLines.forEach(text => result.push({ lang: 'ar', text }));
    nonArLines.slice(nonArIdx).forEach((text, i) => {
      const remaining = LANG_ORDER.filter(l => l !== 'ar' && !result.some(r => r.lang === l));
      result.push({ lang: remaining[i] || 'fr', text });
    });
    return result;
  }

  // --- Cue building ---
  function buildCues(frCues, arCues, enCues) {
    // If separate SRT files: union all start times and pick matching text per language.
    const allStarts = new Set();
    const add = cues => cues.forEach(c => { allStarts.add(c.start); });
    add(frCues); add(arCues); add(enCues);
    if (allStarts.size === 0 && frCues.length) {
      // Single file mode: already parsed as frCues; derive texts per cue
      return frCues.map(c => ({ start: c.start, end: c.end, lines: getCueTexts(c) }));
    }
    const times = Array.from(allStarts).sort((a,b) => a-b);
    const find = (cues, t) => cues.find(c => t >= c.start && t < c.end) || cues.find(c => Math.abs(c.start - t) < 0.05);
    return times.map(t => {
      const fr = find(frCues, t), ar = find(arCues, t), en = find(enCues, t);
      const lines = [];
      if (fr && fr.text.trim()) lines.push({ lang: 'fr', text: fr.text.trim() });
      if (ar && ar.text.trim()) lines.push({ lang: 'ar', text: ar.text.trim() });
      if (en && en.text.trim()) lines.push({ lang: 'en', text: en.text.trim() });
      const end = (fr && fr.end) || (ar && ar.end) || (en && en.end) || t + 2;
      return { start: t, end, lines };
    });
  }

  // --- TTS ---
  function isCapacitor() {
    return typeof window !== 'undefined' && window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  }
  function ttsStop() {
    if (state.ttsChain) { clearTimeout(state.ttsChain); state.ttsChain = null; }
    if (isCapacitor()) {
      const plugin = window.Capacitor.Plugins.TextToSpeech;
      if (plugin) plugin.stop().catch(()=>{});
    } else if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }
  function ttsSpeak({ text, lang, onend }) {
    const ttsLang = lang === 'ar' ? 'ar-SA' : (lang === 'fr' ? 'fr-FR' : 'en-US');
    if (isCapacitor()) {
      const plugin = window.Capacitor.Plugins.TextToSpeech;
      if (!plugin) { if (onend) onend(); return; }
      plugin.stop().catch(()=>{})
        .then(() => plugin.speak({ text, lang: ttsLang, rate: 1.0, pitch: 1.0, volume: 1.0, category: 'playback' }))
        .then(() => { if (onend) onend(); })
        .catch(() => { if (onend) onend(); });
    } else if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = ttsLang;
      u.onend = onend;
      u.onerror = () => { if (onend) onend(); };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } else if (onend) {
      onend();
    }
  }

  function getCurrentCue() {
    return state.cues[state.currentIndex];
  }

  function getCurrentLine(lang) {
    const cue = getCurrentCue();
    return cue ? (cue.lines.find(l => l.lang === lang) || cue.lines[0]) : null;
  }

  function startLoopLang(lang) {
    stopAllLoops();
    state.loopLang = lang;
    updateButtons();
    const myToken = state.loopToken;
    const doSpeak = () => {
      if (state.loopLang !== lang || state.loopToken !== myToken) return;
      const line = getCurrentLine(lang);
      if (!line || !line.text) { state.ttsChain = setTimeout(doSpeak, 500); return; }
      ttsSpeak({ text: line.text, lang: line.lang, onend: () => {
        if (state.loopLang !== lang || state.loopToken !== myToken) return;
        state.ttsChain = setTimeout(doSpeak, 600);
      }});
    };
    doSpeak();
  }

  function toggleLoopLang(lang) {
    if (state.loopLang === lang) { stopAllLoops(); return; }
    startLoopLang(lang);
  }

  function startLoopAll() {
    stopAllLoops();
    state.loopAll = true;
    updateButtons();
    const myToken = state.loopToken;
    const available = () => {
      const cue = getCurrentCue();
      return cue ? LANG_ORDER.map(l => cue.lines.find(x => x.lang === l)).filter(Boolean) : [];
    };
    const doCycle = (idx) => {
      if (!state.loopAll || state.loopToken !== myToken) return;
      const lines = available();
      if (!lines.length) { state.ttsChain = setTimeout(() => doCycle(0), 500); return; }
      const i = idx % lines.length;
      ttsSpeak({ text: lines[i].text, lang: lines[i].lang, onend: () => {
        if (!state.loopAll || state.loopToken !== myToken) return;
        state.ttsChain = setTimeout(() => doCycle(i+1), 800);
      }});
    };
    doCycle(0);
  }

  function toggleLoopAll() {
    if (state.loopAll) { stopAllLoops(); return; }
    startLoopAll();
  }

  function startWordLoop(word, lang, el) {
    if (!word || !lang) return;
    stopAllLoops();
    if (state.wordLoopEl) state.wordLoopEl.classList.remove('active');
    state.wordLoopEl = el;
    if (el) el.classList.add('active');
    const myToken = state.loopToken;
    const speak = () => {
      if (state.loopToken !== myToken) { if (state.wordLoopEl) state.wordLoopEl.classList.remove('active'); return; }
      ttsSpeak({ text: word, lang, onend: () => {
        if (state.loopToken !== myToken) { if (state.wordLoopEl) state.wordLoopEl.classList.remove('active'); return; }
        state.ttsChain = setTimeout(speak, 700);
      }});
    };
    speak();
  }

  function applyVideoLoop() { player.loop = state.fullVideoLoop; }

  function toggleFullVideoLoop() {
    if (!player.src && !videoFile.files[0]) { showToast(t('chooseVideoFirst')); return; }
    state.fullVideoLoop = !state.fullVideoLoop;
    applyVideoLoop();
    updateButtons();
  }

  function toggleVideoLoop() {
    const cue = getCurrentCue();
    if (!cue) { showToast(t('noCurrentCue')); return; }
    if (!player.src && !videoFile.files[0]) { showToast(t('chooseVideoFirst')); return; }
    if (state.videoLoop) { state.videoLoop = false; state.loopStart = 0; state.loopEnd = 0; updateButtons(); return; }
    state.videoLoop = true;
    state.loopStart = cue.start;
    state.loopEnd = cue.end;
    updateButtons();
    player.currentTime = cue.start;
    player.play().catch(()=>{});
  }

  function stopTTSLoops() {
    state.loopAll = false;
    state.loopLang = null;
    state.loopToken++;
    ttsStop();
    updateButtons();
  }
  function stopAllLoops() {
    stopTTSLoops();
    state.videoLoop = false;
    state.loopStart = 0;
    state.loopEnd = 0;
    if (state.wordLoopEl) { state.wordLoopEl.classList.remove('active'); state.wordLoopEl = null; }
    updateButtons();
  }

  // --- UI ---
  function updateButtons() {
    btnLoopAll.classList.toggle('active', state.loopAll);
    btnFullLoop.classList.toggle('active', state.fullVideoLoop);
    btnVideoLoop.classList.toggle('active', state.videoLoop);
    const bubbleLoop = document.querySelector('.bubble-loop');
    if (bubbleLoop) bubbleLoop.classList.toggle('active', state.videoLoop);
    Array.from(langBtns.children).forEach(btn => {
      const l = btn.dataset.lang;
      btn.classList.toggle('active', state.loopLang === l);
    });
    document.querySelectorAll('.lang-line .loop').forEach(btn => {
      const l = btn.dataset.lang;
      btn.classList.toggle('active', state.loopLang === l);
    });
  }

  function renderLangButtons() {
    const cue = getCurrentCue();
    const present = cue ? LANG_ORDER.filter(l => cue.lines.some(x => x.lang === l)) : LANG_ORDER;
    langBtns.innerHTML = present.map(l => `
      <button class="lang-btn" data-lang="${l}" title="${escapeHtml(t('speakTitle', {lang: LANG_NAMES[l]}))}">
        ${LANG_LABELS[l]} 🔊
      </button>
    `).join('');
    Array.from(langBtns.children).forEach(btn => {
      btn.addEventListener('click', () => toggleLoopLang(btn.dataset.lang));
    });
    updateButtons();
  }

  function renderBubble() {
    const cue = getCurrentCue();
    if (!cue) {
      bubble.innerHTML = '';
      return;
    }
    const loopBtn = `<button class="bubble-loop" title="${escapeHtml(t('videoLoopTitle'))}" aria-label="${escapeHtml(t('videoLoopTitle'))}">🔂</button>`;
    bubble.innerHTML = loopBtn + cue.lines.map(line => `
      <div class="lang-line ${line.lang}" dir="${line.lang === 'ar' ? 'rtl' : 'ltr'}">
        <span class="badge">${LANG_LABELS[line.lang]}</span>
        <button class="loop" data-lang="${line.lang}" title="${escapeHtml(t('speakTitle', {lang: LANG_NAMES[line.lang]}))}" aria-label="${escapeHtml(t('speakTitle', {lang: LANG_NAMES[line.lang]}))}">🔊</button>
        ${wrapWords(line.text, line.lang)}
      </div>
    `).join('');
    const bubbleLoop = bubble.querySelector('.bubble-loop');
    if (bubbleLoop) {
      bubbleLoop.addEventListener('click', e => { e.stopPropagation(); toggleVideoLoop(); });
    }
    bubble.querySelectorAll('.lang-line .loop').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); toggleLoopLang(btn.dataset.lang); });
    });
    bubble.querySelectorAll('.word').forEach(w => {
      w.addEventListener('click', e => { e.stopPropagation(); startWordLoop(w.textContent.trim(), w.dataset.lang, w); });
    });
    renderLangButtons();
  }

  function updateStatus() {
    const cue = getCurrentCue();
    if (!cue) { statusEl.textContent = ''; return; }
    statusEl.textContent = t('status', {current: state.currentIndex + 1, total: state.cues.length, start: formatDuration(cue.start), end: formatDuration(cue.end)});
  }

  function setCurrentByTime(t) {
    if (!state.cues.length) return -1;
    const idx = state.cues.findIndex(c => t >= c.start && t < c.end);
    if (idx >= 0 && idx !== state.currentIndex) {
      state.currentIndex = idx;
      renderBubble();
      updateStatus();
    }
    return state.currentIndex;
  }

  function goToCue(i) {
    if (!state.cues.length || i < 0 || i >= state.cues.length) return;
    if (state.wordLoopEl) { state.wordLoopEl.classList.remove('active'); state.wordLoopEl = null; state.loopToken++; ttsStop(); }
    state.currentIndex = i;
    const cue = state.cues[i];
    state.pendingSeek = cue.start;
    if (player.src) player.currentTime = cue.start;
    if (state.isPlaying) player.play().catch(()=>{});
    renderBubble();
    updateStatus();
    updateProgress();
    if (state.videoLoop) { state.loopStart = cue.start; state.loopEnd = cue.end; }
    if (state.loopAll) startLoopAll();
    else if (state.loopLang) startLoopLang(state.loopLang);
  }

  function prevCue() { if (state.currentIndex > 0) goToCue(state.currentIndex - 1); }
  function nextCue() { if (state.currentIndex < state.cues.length - 1) goToCue(state.currentIndex + 1); }
  function togglePlay() { if (player.paused) player.play(); else player.pause(); }

  function updateProgress() {
    if (!state.duration) return;
    progress.value = player.currentTime;
    currentTimeEl.textContent = formatDuration(player.currentTime);
  }

  function showView(viewName) {
    [lessonsView, setupView, playerView].forEach(v => v.classList.remove('active'));
    if (viewName === 'lessons') lessonsView.classList.add('active');
    else if (viewName === 'setup') setupView.classList.add('active');
    else if (viewName === 'player') playerView.classList.add('active');
    if (viewName !== 'player') stopAllLoops();
  }

  function attachPlayerEvents() {
    player.onloadedmetadata = () => {
      state.duration = player.duration || 0;
      player.playbackRate = state.playbackRate;
      applyVideoLoop();
      progress.max = state.duration;
      durationEl.textContent = formatDuration(state.duration);
      if (state.cues.length && state.duration) {
        const last = state.cues[state.cues.length - 1];
        if (last.end > state.duration) last.end = state.duration;
        for (let i = 0; i < state.cues.length - 1; i++) {
          if (state.cues[i].end > state.cues[i+1].start) state.cues[i].end = state.cues[i+1].start;
        }
      }
      if (state.pendingSeek !== null && player.src) {
        player.currentTime = state.pendingSeek;
        state.pendingSeek = null;
      }
    };
    player.ontimeupdate = () => {
      setCurrentByTime(player.currentTime);
      updateProgress();
      if (state.videoLoop && !player.paused && player.currentTime >= state.loopEnd - 0.05) {
        player.currentTime = state.loopStart;
      }
    };
    player.onplay = () => { state.isPlaying = true; btnPlay.textContent = '⏸'; };
    player.onpause = () => { state.isPlaying = false; btnPlay.textContent = '▶'; };
    player.onended = () => { state.isPlaying = false; btnPlay.textContent = '▶'; };
    progress.oninput = () => {
      player.currentTime = parseFloat(progress.value);
      setCurrentByTime(player.currentTime);
      updateProgress();
    };
  }

  async function loadCues() {
    if (!videoFile.files[0] && !srtMain.files[0] && !srtFr.files[0] && !srtAr.files[0] && !srtEn.files[0] && !srtPaste.value.trim()) {
      showToast(t('chooseFiles'));
      return false;
    }
    stopAllLoops();
    state.cues = [];
    state.currentIndex = -1;
    let frCues = [], arCues = [], enCues = [];
    try {
      if (srtMain.files[0]) {
        const text = await readFile(srtMain.files[0]);
        frCues = parseSubtitle(text);
      } else if (srtFr.files[0]) {
        const text = await readFile(srtFr.files[0]);
        frCues = parseSubtitle(text);
      } else if (srtPaste.value.trim()) {
        frCues = parseSubtitle(srtPaste.value.trim());
      }
      if (srtAr.files[0]) {
        const text = await readFile(srtAr.files[0]);
        arCues = parseSubtitle(text);
      }
      if (srtEn.files[0]) {
        const text = await readFile(srtEn.files[0]);
        enCues = parseSubtitle(text);
      }
    } catch (e) {
      showToast(t('readError'));
      return false;
    }
    const activeSource = frCues.length ? 'fr' : (arCues.length ? 'ar' : (enCues.length ? 'en' : null));
    const sourceCues = activeSource === 'fr' ? frCues : (activeSource === 'ar' ? arCues : enCues);
    const onlyOneSource = [frCues, arCues, enCues].filter(arr => arr.length).length === 1;
    if (activeSource && onlyOneSource) {
      if (sourceCues[0] && sourceCues[0].lines) {
        state.cues = sourceCues.map(c => ({ start: c.start, end: c.end, lines: c.lines }));
      } else {
        const hasAr = sourceCues.some(c => /[\u0600-\u06FF]/.test(c.text));
        const hasNonAr = sourceCues.some(c => c.text.split('\n').some(l => !/[\u0600-\u06FF]/.test(l) && l.trim()));
        if (hasAr && hasNonAr) {
          state.cues = sourceCues.map(c => ({ start: c.start, end: c.end, lines: getCueTexts(c) }));
        } else {
          state.cues = sourceCues.map(c => ({ start: c.start, end: c.end, lines: [{ lang: activeSource, text: c.text.replace(/\n+/g, ' ').trim() }] }));
        }
      }
    } else {
      state.cues = buildCues(frCues, arCues, enCues);
    }
    if (!state.cues.length && !videoFile.files[0]) {
      showToast(t('noCues'));
      return false;
    }
    controls.style.display = state.cues.length ? 'flex' : 'none';
    progress.max = 0;
    currentTimeEl.textContent = '00:00';
    durationEl.textContent = '00:00';
    if (state.videoUrl) {
      URL.revokeObjectURL(state.videoUrl);
      state.videoUrl = null;
    }
    if (videoFile.files[0]) {
      state.videoUrl = URL.createObjectURL(videoFile.files[0]);
      player.src = state.videoUrl;
      videoWrap.style.display = 'block';
    } else {
      player.src = '';
      videoWrap.style.display = 'none';
    }
    attachPlayerEvents();
    if (state.cues.length) goToCue(0);
    return true;
  }

  async function start() {
    const ok = await loadCues();
    if (!ok) return;
    showToast(t('loadedCues', {count: state.cues.length}));
    showView('player');
  }

  async function saveLesson() {
    const ok = await loadCues();
    if (!ok) return;
    if (!state.cues.length && !videoFile.files[0]) {
      showToast(t('noContent'));
      return;
    }
    const dateLocale = state.uiLang === 'ar' ? 'ar-EG' : state.uiLang === 'fr' ? 'fr-FR' : 'en-US';
    const defaultName = new Date().toLocaleDateString(dateLocale);
    const name = prompt(t('lessonNamePrompt'), t('lessonDefaultName', {date: defaultName})) || t('lessonDefaultName', {date: defaultName});
    let videoBlob = null, imageBlob = null;
    if (videoFile.files[0]) {
      try {
        const ab = await readFileAsArrayBuffer(videoFile.files[0]);
        videoBlob = new Blob([ab], { type: videoFile.files[0].type || 'video/mp4' });
      } catch (e) { showToast(t('readVideoError')); return; }
    }
    if (lessonImage.files[0]) {
      try {
        const ab = await readFileAsArrayBuffer(lessonImage.files[0]);
        imageBlob = new Blob([ab], { type: lessonImage.files[0].type || 'image/jpeg' });
      } catch (e) { showToast(t('readImageError')); }
    }
    const lesson = { id: Date.now().toString(36), name, createdAt: Date.now(), cues: state.cues, videoBlob, imageBlob };
    try {
      await saveLessonToDB(lesson);
      showToast(t('saveSuccess'));
      await renderLessons();
      showView('lessons');
    } catch (e) { showToast(t('saveError')); }
  }

  async function loadLesson(id) {
    stopAllLoops();
    const lesson = await getLessonById(id);
    if (!lesson) { showToast(t('notFound')); return; }
    if (state.videoUrl) { URL.revokeObjectURL(state.videoUrl); state.videoUrl = null; }
    if (state.posterUrl) { URL.revokeObjectURL(state.posterUrl); state.posterUrl = null; }
    state.cues = lesson.cues || [];
    state.currentIndex = -1;
    if (lesson.videoBlob) {
      state.videoUrl = URL.createObjectURL(lesson.videoBlob);
      player.src = state.videoUrl;
      videoWrap.style.display = 'block';
    } else {
      player.src = '';
      videoWrap.style.display = 'none';
    }
    if (lesson.imageBlob) {
      state.posterUrl = URL.createObjectURL(lesson.imageBlob);
      player.poster = state.posterUrl;
    } else {
      player.poster = '';
    }
    attachPlayerEvents();
    lessonTitle.textContent = lesson.name;
    showView('player');
    if (state.cues.length) goToCue(0);
  }

  async function renderLessons() {
    let lessons = [];
    try { lessons = await getLessonsFromDB(); } catch (e) {}
    state.thumbUrls.forEach(u => URL.revokeObjectURL(u));
    state.thumbUrls = [];
    if (!lessons || !lessons.length) {
      lessonsList.innerHTML = `<p class="empty-hint" data-t="emptyHint">${escapeHtml(t('emptyHint'))}</p>`;
      return;
    }
    const dateLocale = state.uiLang === 'ar' ? 'ar-EG' : state.uiLang === 'fr' ? 'fr-FR' : 'en-US';
    lessonsList.innerHTML = lessons.sort((a,b) => b.createdAt - a.createdAt).map(l => {
      let thumb = '';
      if (l.imageBlob) {
        const url = URL.createObjectURL(l.imageBlob);
        state.thumbUrls.push(url);
        thumb = `<img src="${url}" class="lesson-thumb" alt="">`;
      }
      return `
      <div class="lesson-card" data-id="${l.id}">
        ${thumb}
        <div class="lesson-info">
          <div class="title">${escapeHtml(l.name)}</div>
          <div class="date">${new Date(l.createdAt).toLocaleString(dateLocale)}</div>
        </div>
        <div class="lesson-actions">
          <button class="icon-btn" data-action="rename" data-id="${l.id}" title="${escapeHtml(t('rename'))}">✏️</button>
          <button class="icon-btn" data-action="image" data-id="${l.id}" title="${escapeHtml(t('changeImage'))}">🖼️</button>
          <button class="icon-btn" data-action="play" data-id="${l.id}" title="${escapeHtml(t('play'))}">▶</button>
          <button class="icon-btn" data-action="delete" data-id="${l.id}" title="${escapeHtml(t('delete'))}">🗑</button>
        </div>
      </div>
    `}).join('');
  }

  async function updateLesson(id, updates) {
    const lesson = await getLessonById(id);
    if (!lesson) return;
    Object.assign(lesson, updates);
    try { await saveLessonToDB(lesson); renderLessons(); showToast(t('updateSuccess')); } catch (e) { showToast(t('updateError')); }
  }

  // --- Event wiring ---
  function handleFiles() {
    videoName.textContent = videoFile.files[0] ? videoFile.files[0].name : '';
    imageName.textContent = lessonImage.files[0] ? lessonImage.files[0].name : '';
    nameMain.textContent = srtMain.files[0] ? srtMain.files[0].name : '';
    nameFr.textContent = srtFr.files[0] ? srtFr.files[0].name : '';
    nameAr.textContent = srtAr.files[0] ? srtAr.files[0].name : '';
    nameEn.textContent = srtEn.files[0] ? srtEn.files[0].name : '';
  }
  [videoFile, lessonImage, srtMain, srtFr, srtAr, srtEn].forEach(el => el.addEventListener('change', handleFiles));

  function readFile(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsText(file, 'UTF-8');
    });
  }

  // start() and loadCues() are defined above

  function reset() {
    if (!confirm(t('resetConfirm'))) return;
    stopAllLoops();
    player.pause();
    player.src = '';
    if (state.videoUrl) {
      URL.revokeObjectURL(state.videoUrl);
      state.videoUrl = null;
    }
    if (state.posterUrl) {
      URL.revokeObjectURL(state.posterUrl);
      state.posterUrl = null;
    }
    player.poster = '';
    videoWrap.style.display = 'none';
    controls.style.display = 'none';
    bubble.innerHTML = '';
    state.cues = [];
    state.currentIndex = -1;
    state.isPlaying = false;
    state.duration = 0;
    videoFile.value = ''; lessonImage.value = ''; srtMain.value = ''; srtFr.value = ''; srtAr.value = ''; srtEn.value = ''; srtPaste.value = '';
    handleFiles();
    progress.value = 0;
    currentTimeEl.textContent = '00:00'; durationEl.textContent = '00:00';
    showView('lessons');
  }

  btnSetup.addEventListener('click', () => showView('setup'));

  btnBackLessons.addEventListener('click', () => showView('lessons'));
  btnLang.addEventListener('click', () => {
    const idx = UI_LANGS.indexOf(state.uiLang);
    const next = UI_LANGS[(idx + 1) % UI_LANGS.length];

  lessonsList.addEventListener('click', async e => {
    const action = e.target.closest('[data-action]');
    if (!action) return;
    const id = action.dataset.id;
    if (action.dataset.action === 'play') { loadLesson(id); return; }
    if (action.dataset.action === 'delete') {
      if (confirm(t('deleteConfirm'))) {
        try { await deleteLessonFromDB(id); renderLessons(); showToast(t('deleteSuccess')); } catch (e) { showToast(t('deleteError')); }
      }
      return;
    }
    if (action.dataset.action === 'rename') {
      const lesson = await getLessonById(id);
      const newName = prompt(t('renamePromptNew'), lesson ? lesson.name : '') || '';
      if (newName.trim()) updateLesson(id, { name: newName.trim() });
      return;
    }
    if (action.dataset.action === 'image') {
      state.editingImageId = id;
      editImage.click();
      return;
    }
  });

  editImage.addEventListener('change', async () => {
    const id = state.editingImageId;
    state.editingImageId = null;
    const file = editImage.files[0];
    if (!id || !file) return;
    try {
      const ab = await readFileAsArrayBuffer(file);
      const imageBlob = new Blob([ab], { type: file.type || 'image/jpeg' });
      await updateLesson(id, { imageBlob });
    } catch (e) { showToast(t('readImageError')); }
    editImage.value = '';
  });

  document.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.code === 'ArrowLeft') { e.preventDefault(); prevCue(); }
    if (e.code === 'ArrowRight') { e.preventDefault(); nextCue(); }
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'Escape') { e.preventDefault(); stopAllLoops(); }
  });

  // Disable space scroll on range
  progress.addEventListener('keydown', e => { if (e.code === 'Space') e.preventDefault(); });

  // Tab switching for subtitle source
  document.querySelectorAll('.source-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      const panel = document.querySelector(`.tab-panel[data-tab="${tab.dataset.tab}"]`);
      if (panel) panel.classList.add('active');
    });
  });

  function initBackButton() {
    try {
      if (isCapacitor() && window.Capacitor.Plugins.App && window.Capacitor.Plugins.App.addListener) {
        window.Capacitor.Plugins.App.addListener('backButton', () => {
          if (playerView.classList.contains('active') || setupView.classList.contains('active')) {
            showView('lessons');
          } else if (confirm(t('exitConfirm'))) {
            window.Capacitor.Plugins.App.exitApp();
          }
        });
      }
    } catch (e) {}
  }

  initBackButton();
  setUILang(state.uiLang);
  showView('lessons');

})();
</script>
</body>
</html>
