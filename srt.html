<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f1f">
<title>caplayer</title>
<link rel="manifest" href="manifest-srt.json">
<style>
  :root {
    --bg-primary: #0b0d1f;
    --bg-secondary: #13162b;
    --bg-tertiary: #1e213d;
    --text-primary: #f0f1ff;
    --text-secondary: #8c90b5;
    --accent: #7b79ff;
    --accent-hover: #5c5bdb;
    --success: #00e676;
    --gold: #ffc857;
    --danger: #ff6b6b;
    --border: rgba(255,255,255,0.08);
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --shadow-sm: 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header { position: sticky; top: 0; z-index: 60; background: rgba(11,13,31,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .header-inner { max-width: 960px; margin: 0 auto; padding: 0.7rem 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .logo { font-weight: 800; color: var(--accent); font-size: 1.05rem; white-space: nowrap; }
  .spacer { flex: 1; }
  .icon-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 10px; min-width: 38px; height: 38px; padding: 0 0.45rem; font-size: 0.95rem; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; transition: all 0.12s; }
  main { max-width: 960px; margin: 0 auto; padding: 0.9rem; }

  .panel { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 0.9rem; box-shadow: var(--shadow-sm); }
  .panel h2 { margin: 0; font-size: 1.1rem; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.7rem; }
  .panel-actions { display: flex; gap: 0.35rem; }
  .panel p { margin: 0 0 0.7rem; color: var(--text-secondary); font-size: 0.9rem; }

  .file-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.7rem; align-items: stretch; flex-direction: column; }
  .file-row label { color: var(--text-secondary); font-size: 0.9rem; }
  .file-row input[type="file"] { flex: 1; width: 100%; min-width: 0; color: var(--text-primary); font-size: 0.9rem; }
  .file-row input[type="text"] { width: 100%; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.55rem 0.7rem; font-size: 0.95rem; font-family: inherit; }
  .file-row .file-name { color: var(--success); font-size: 0.85rem; }
  .paste-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.7rem; align-items: flex-start; }
  .paste-row label { flex: 0 0 7rem; color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.4rem; }
  .file-row textarea, .paste-row textarea {
    flex: 1;
    min-width: 0;
    min-height: 120px;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.6rem;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
    unicode-bidi: plaintext;
  }

  .action-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.8rem; }
  button.primary { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 0.75rem 1.6rem; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(123,121,255,0.4); }
  button.primary:hover { background: var(--accent-hover); }
  button.secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem 1rem; font-size: 0.95rem; cursor: pointer; }
  button.secondary:hover { border-color: var(--accent); }
  .fab {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #2b9df1, #7b79ff);
    color: #fff;
    font-size: 2.1rem;
    font-weight: 300;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px rgba(43,157,241,0.45);
    cursor: pointer;
    z-index: 80;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  html[dir="rtl"] .fab { right: auto; left: 1.5rem; }
  .fab:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(43,157,241,0.55); }
  .fab:active { transform: scale(0.92); }
  #lessons-view .panel { padding-bottom: 5rem; }

  .source-tabs { display: flex; gap: 0.4rem; margin: 0.8rem 0 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
  .source-tab { background: transparent; color: var(--text-secondary); border: none; padding: 0.45rem 0.8rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: 999px; }
  .source-tab:hover { color: var(--text-primary); }
  .source-tab.active { background: var(--bg-tertiary); color: var(--text-primary); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .hint { color: var(--text-secondary); font-size: 0.85rem; margin: 0.2rem 0 0.5rem; }

  .video-wrap { position: relative; background: #000; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 0.9rem; width: 100%; max-width: 720px; margin-inline: auto; }
  video { width: 100%; height: auto; min-height: 220px; display: block; object-fit: contain; position: relative; z-index: 0; }
  .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none; }
  .remove-image-btn { position: absolute; top: 0.5rem; inset-inline-end: 0.5rem; z-index: 20; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: none; display: none; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; }
  .remove-image-btn:hover { background: rgba(220,20,60,0.85); }

  .bubble-wrap { position: absolute; bottom: 0.5rem; left: 0.5rem; right: 0.5rem; z-index: 10; display: flex; justify-content: center; pointer-events: none; }
  .subtitle-bubble {
    background: rgba(10,10,20,0.78);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.45rem 0.6rem;
    width: 100%;
    max-width: 720px;
    min-height: auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 0.35rem;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
    position: relative;
    pointer-events: auto;
  }
  .subtitle-bubble:empty { display: none; }
  .subtitle-bubble { padding: 0.45rem 0.6rem; }
  .lang-line {
    border-radius: var(--radius-sm);
    padding: 0.45rem 0.55rem;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.2rem;
  }
  .lang-line-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    min-height: 22px;
  }
  .lang-line .lang-text {
    font-size: calc(1rem * var(--caption-scale, 1));
    font-weight: 600;
    text-align: center;
    line-height: 1.35;
  }
  .lang-line .badge {
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 0.15rem 0.45rem;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .lang-line .loop {
    background: rgba(0,0,0,0.45);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    font-size: 0.8rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .lang-line .loop:hover { background: rgba(0,0,0,0.65); }
  .lang-line .loop.active { background: var(--success); color: #0b0d1f; }
  .lang-line.fr { background: linear-gradient(135deg, #ff9f43, #ff7f50); color: #1a1a1a; }
  .lang-line.ar { background: linear-gradient(135deg, #2dd4bf, #14b8a6); color: #1a1a1a; direction: rtl; }
  .lang-line.en { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: #1a1a1a; direction: ltr; }
  .lang-line .word { cursor: pointer; border-radius: 4px; padding: 0.05em 0.1em; transition: background 0.12s; }
  .lang-line .word:hover { background: rgba(0,0,0,0.15); }
  .lang-line .word.active { background: rgba(0,0,0,0.35); box-shadow: 0 0 0 2px var(--text-primary); }

  .controls { display: flex; flex-direction: column; gap: 0.7rem; align-items: center; margin-bottom: 0.9rem; padding: 0 0.5rem; }
  .time-row { display: flex; align-items: center; gap: 0.5rem; width: 100%; max-width: 720px; color: var(--text-secondary); font-size: 0.85rem; }
  .rate-row, .filter-row {
    display: flex; align-items: center; flex-wrap: wrap;
    justify-content: space-between; gap: 0.45rem;
    width: 100%; max-width: 720px;
    padding: 0.45rem 0.65rem;
    background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-secondary); font-size: 0.9rem;
  }
  .ai-btn { background: linear-gradient(135deg, #4285f4, #34a853); color: #fff; border: none; }
  #rate, #filter-select {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 0.35rem 0.7rem; font-size: 0.9rem; font-family: inherit; cursor: pointer;
    min-width: 0; flex: 1 1 110px; max-width: 200px;
  }
  #rate:focus, #filter-select:focus { outline: none; border-color: var(--accent); }
  #progress { flex: 1; -webkit-appearance: none; height: 6px; background: var(--bg-tertiary); border-radius: 3px; outline: none; }
  #progress::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--accent); border-radius: 50%; cursor: pointer; }

  .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; padding: 0.4rem; }
  .ctrl-btn {
    background: linear-gradient(145deg, var(--bg-tertiary), #141629);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 46px;
    height: 46px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    cursor: pointer;
    transition: all 0.12s;
    box-shadow: var(--shadow-sm);
  }
  .ctrl-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
  .ctrl-btn:active { transform: scale(0.93); }
  .ctrl-btn.active { background: var(--success); color: #0b0d1f; border-color: var(--success); }

  .status { text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem; }

  footer { text-align: center; padding: 1.5rem 1rem; color: var(--text-secondary); font-size: 0.8rem; }
  .formats-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 90; display: flex; align-items: flex-end; justify-content: center; }
  .formats-sheet { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; width: 100%; max-width: 720px; max-height: 82vh; overflow-y: auto; padding: 0.9rem 0.9rem 1.4rem; box-shadow: var(--shadow); }
  .formats-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; position: sticky; top: -0.9rem; background: var(--bg-secondary); padding: 0.5rem 0; z-index: 1; }
  .formats-head h3 { margin: 0; font-size: 1rem; color: var(--text-primary); }
  .format-card { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem; margin-bottom: 0.55rem; }
  .format-card .format-name { font-weight: 700; font-size: 0.88rem; margin-bottom: 0.35rem; color: var(--text-primary); }
  .format-card pre { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.6rem; font-size: 0.78rem; white-space: pre-wrap; margin: 0 0 0.45rem; font-family: inherit; direction: ltr; text-align: left; unicode-bidi: plaintext; color: var(--text-primary); line-height: 1.45; }
  .format-actions { display: flex; gap: 0.4rem; justify-content: flex-end; }
  .format-actions button { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 0.35rem 0.7rem; font-size: 0.82rem; font-family: inherit; cursor: pointer; }
  .format-actions button:hover { border-color: var(--accent); }

  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.6rem 1.1rem; z-index: 100; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-weight: 600; direction: rtl; }
  .toast.show { opacity: 1; }

  .view { display: none; }
  .view.active { display: block; }

  .lesson-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem 0.85rem;
    margin-bottom: 0.6rem;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: flex-start;
    gap: 0.6rem;
    cursor: pointer;
    position: relative;
    transition: background 0.12s, border-color 0.12s;
  }
  .lesson-card:active { background: rgba(255,255,255,0.04); }
  .lesson-card.selected { border-color: var(--accent); background: rgba(139,92,246,0.10); }
  .lesson-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--text-secondary); flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8rem; color: transparent; }
  .lesson-card.selected .lesson-check { background: var(--accent); border-color: var(--accent); color: #fff; }
  #select-bar { display: flex; gap: 0.45rem; margin-bottom: 0.7rem; }
  .select-bar-btn { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 10px; padding: 0.5rem 0.3rem; font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: inherit; }
  .select-bar-btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .lesson-card .title { font-weight: 700; font-size: 1rem; word-break: normal; overflow-wrap: break-word; }
  .lesson-card .date { color: var(--text-secondary); font-size: 0.75rem; word-break: normal; overflow-wrap: break-word; }
  .empty-hint { color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 1rem 0; }

  .lesson-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-secondary); flex: 0 0 auto; }
  .lesson-info { flex: 1 1 0; min-width: 0; pointer-events: none; }
  .lesson-menu { position: relative; flex: 0 0 auto; margin-inline-start: auto; }
  .menu-toggle { padding: 0.45rem 0.55rem; font-size: 1.1rem; line-height: 1; }
  .menu-dropdown { display: none; position: absolute; top: calc(100% + 6px); inset-inline-end: 0; min-width: 170px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); z-index: 50; overflow: hidden; flex-direction: column; }
  .menu-dropdown.show { display: flex; }
  .menu-item { background: transparent; color: var(--text-primary); border: none; border-bottom: 1px solid var(--border); padding: 0.55rem 0.75rem; font-size: 0.9rem; font-family: inherit; text-align: start; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:hover { background: rgba(255,255,255,0.06); }
  .menu-item.danger { color: var(--danger); }
  .menu-icon { font-size: 1rem; }

  .player-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
  .player-header .lesson-title { color: var(--text-secondary); font-size: 0.9rem; }

  #btn-save-lesson { white-space: nowrap; }

  @media (max-width: 480px) {
    .file-row label, .paste-row label { flex: 0 0 100%; }
    .file-row input[type="file"] { flex: 1 0 100%; }
    .file-row textarea, .paste-row textarea { flex: 1 0 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo" data-t="logo">مشغّل SRT</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-lang" title="Language / Langue / اللغة">AR</button>
    <button class="icon-btn" id="btn-lessons" title="الدروس" data-t-title="lessonsTitle">📚</button>
    <button class="icon-btn" id="btn-setup" title="إعداد درس جديد" data-t-title="newLessonTitle">➕</button>
    <button class="icon-btn" id="btn-edge-set" title="إعدادات النطق" data-t-title="speechSettings">🗣️</button>
    <button class="icon-btn" id="btn-stop" title="إيقاف الصوت" data-t-title="stopAudio">🔇</button>
  </div>
</header>

<main>
  <section class="view active" id="lessons-view">
    <div class="panel">
      <div class="panel-header">
        <h2 data-t="lessonsTitle">دروسي</h2>
        <div class="panel-actions">
          <button class="icon-btn" id="btn-import" title="استيراد دروس JSON" data-t-title="importTitle">📥</button>
          <button class="icon-btn" id="btn-export-all" title="تصدير كل الدروس" data-t-title="exportAll">📤</button>
        </div>
      </div>
      <input type="file" id="import-file" accept="application/json" style="display:none">
      <div id="select-bar" style="display:none">
        <button id="btn-sel-all" class="select-bar-btn" type="button" data-t="selectAll">تحديد الكل</button>
        <button id="btn-sel-export" class="select-bar-btn primary" type="button" data-t="exportSel">تصدير المحدد</button>
        <button id="btn-sel-cancel" class="select-bar-btn" type="button" data-t="cancelSel">إلغاء</button>
      </div>
      <div id="lessons-list">
        <p class="empty-hint" data-t="emptyHint">لا توجد دروس محفوظة. اضغط على “➕” لإعداد درس جديد.</p>
      </div>
      <button class="fab" id="btn-new-lesson" title="إعداد درس جديد" data-t-title="newLessonTitle" aria-label="إعداد درس جديد">⊕</button>
    </div>
  </section>

  <section class="view" id="setup-view">
    <div class="panel" id="setup-panel">
      <h2 id="setup-title" data-t="setupTitle">إعداد درس جديد</h2>

      <div class="file-row">
        <label for="lesson-name" data-t="nameLabel">اسم الدرس</label>
        <input type="text" id="lesson-name" placeholder="اسم الدرس">
      </div>
      <div class="file-row">
        <label for="video-file" data-t="videoLabel">فيديو/صوت</label>
        <input type="file" id="video-file" accept="video/*,audio/*">
        <span class="file-name" id="video-name"></span>
      </div>
      <div class="file-row">
        <label for="lesson-image" data-t="imageLabel">صورة الدرس (اختياري)</label>
        <input type="file" id="lesson-image" accept="image/*">
        <span class="file-name" id="image-name"></span>
      </div>

      <div class="source-tabs">
        <button class="source-tab active" data-tab="single" type="button" data-t="tabSingle">ملف ترجمة واحد</button>
        <button class="source-tab" data-tab="separate" type="button" data-t="tabSeparate">ملفات منفصلة</button>
        <button class="source-tab" data-tab="paste" type="button" data-t="tabPaste">لصق نص</button>
        <span class="spacer"></span>
        <button class="icon-btn" id="btn-formats" type="button" title="نماذج الترجمة" data-t-title="formatsTitle">📋</button>
      </div>

      <div class="tab-panel active" data-tab="single">
        <div class="file-row">
          <label for="srt-main" data-t="mainFileLabel">ملف الترجمة</label>
          <input type="file" id="srt-main" accept=".srt,.txt">
          <span class="file-name" id="name-main"></span>
        </div>
        <p class="hint" data-t="singleHint">اختر ملف SRT/TXT واحد يحتوي على الفرنسية والعربية والإنجليزية لكل عبارة.</p>
      </div>

      <div class="tab-panel" data-tab="separate">
        <div class="file-row">
          <label for="srt-fr" data-t="langFrench">الفرنسية</label>
          <input type="file" id="srt-fr" accept=".srt,.txt">
          <span class="file-name" id="name-fr"></span>
        </div>
        <div class="file-row">
          <label for="srt-ar" data-t="langArabic">العربية</label>
          <input type="file" id="srt-ar" accept=".srt,.txt">
          <span class="file-name" id="name-ar"></span>
        </div>
        <div class="file-row">
          <label for="srt-en" data-t="langEnglish">الإنجليزية</label>
          <input type="file" id="srt-en" accept=".srt,.txt">
          <span class="file-name" id="name-en"></span>
        </div>
      </div>

      <div class="tab-panel" data-tab="paste">

  // --- Time parsing ---
  function parseTime(t) {
    t = t.trim().replace(',', '.');
    const parts = t.split(':');
    if (parts.length === 3) {
      const [h, m, s] = parts;
      const [sec, ms='0'] = s.split('.');
      return (parseInt(h,10)*3600 + parseInt(m,10)*60 + parseInt(sec,10)) + parseFloat('0.' + ms.padEnd(3,'0'));
    }
    if (parts.length === 2) {
      const [m, s] = parts;
      const [sec, ms='0'] = s.split('.');
      return (parseInt(m,10)*60 + parseInt(sec,10)) + parseFloat('0.' + ms.padEnd(3,'0'));
    }
    const [sec, ms='0'] = t.split('.');
    return parseInt(sec,10) + parseFloat('0.' + ms.padEnd(3,'0'));
  }

  function parseSrt(srt) {
    const cues = [];
    const blocks = srt.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
    for (const block of blocks) {
      const lines = block.trim().split('\n');
      if (lines.length < 2) continue;
      const timeLine = lines.find(l => l.includes('-->'));
      if (!timeLine) continue;
      const [start, end] = timeLine.split('-->').map(s => parseTime(s.trim()));
      const textLines = lines.slice(lines.indexOf(timeLine) + 1).filter(l => l.trim());
      if (!isNaN(start) && !isNaN(end) && textLines.length) {
        cues.push({ start, end, text: textLines.join('\n') });
      }
    }
    return cues;
  }

  function parseTimedText(text) {
    const cues = [];
    const rawLines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    const timedLines = [];
    let currentEntry = null;

    function parseLineTime(line) {
      let m = line.match(/^\[(?:(\d{1,2}):)?(?:(\d{1,2}):)?(\d{1,2})(?:[.,](\d{1,3}))?\]\s*(.*)$/);
      if (m) {
        const parts = [m[1], m[2], m[3]].filter(Boolean);
        const timeStr = parts.join(':') + (m[4] ? '.' + m[4] : '');
        return { start: parseTime(timeStr), text: m[5].trim() };
      }
      m = line.match(/^((?:\d{1,2}:)?(?:\d{1,2}:)?\d{1,2}(?:[.,]\d{1,3})?)\s*-->?\s*((?:\d{1,2}:)?(?:\d{1,2}:)?\d{1,2}(?:[.,]\d{1,3})?)\s*(.*)$/);
      if (m) return { start: parseTime(m[1]), end: parseTime(m[2]), text: m[3].trim() };
      m = line.match(/^(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?\s+(.+)$/);
      if (m) {
        const start = parseInt(m[1],10)*3600 + parseInt(m[2],10)*60 + parseInt(m[3],10) + (m[4] ? parseFloat('0.' + m[4].padEnd(3,'0')) : 0);
        return { start, text: m[5].trim() };
      }
      m = line.match(/^(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?\s+(.+)$/);
      if (m) {
        const start = parseInt(m[1],10)*60 + parseInt(m[2],10) + (m[3] ? parseFloat('0.' + m[3].padEnd(3,'0')) : 0);
        return { start, text: m[4].trim() };
      }
      return null;
    }

    for (const raw of rawLines) {
      const line = raw.trim();
      if (!line) continue;
      const parsed = parseLineTime(line);
      if (parsed) {
        if (currentEntry) timedLines.push(currentEntry);
        currentEntry = { start: parsed.start, end: parsed.end, text: parsed.text };
      } else if (currentEntry) {
        currentEntry.text += '\n' + line;
      }
    }
    if (currentEntry) timedLines.push(currentEntry);

    for (let i = 0; i < timedLines.length; i++) {
      const entry = timedLines[i];
      let end = entry.end;
      if (end === undefined || isNaN(end)) {
        const nextStart = timedLines[i+1] ? timedLines[i+1].start : null;
        end = (nextStart && nextStart > entry.start) ? nextStart : entry.start + 4;
      }
      cues.push({ start: entry.start, end, text: entry.text });
    }
    for (let i = 0; i < cues.length - 1; i++) {
      if (cues[i].end > cues[i+1].start) cues[i].end = cues[i+1].start;
      if (cues[i].end <= cues[i].start) cues[i].end = cues[i].start + 1.5;
    }
    return cues;
  }

  function isSrtFormat(text) {
    const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
    return blocks.some(b => /^\s*\d+\s*\n\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}\s*-->\s*\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}/.test(b.trim()));

  const FLAG_LANG_MAP = {

  function parseFlagLine(line) {

  function parseFlagFormat(text) {
    const cues = [];
    const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').map(l => l.trim()).filter(Boolean);
    let current = null;

      if (current && current.lines.length) cues.push(current);
      current = null;
    };
    for (const line of lines) {
      // A line may open a new cue with a bare timestamp (00:01) or an inline
      // timestamp + flag (00:01 🇫🇷 ...). Flag lines attach to the open cue.
      const tm = line.match(/^(?:\d{1,2}:)?\d{1,2}:\d{2}(?:[.,]\d{1,3})?\s*(.*)$/);
      if (tm) {

        if (!isNaN(start)) {
          flush();
          current = { start, end: null, lines: [] };
          const parsed = parseFlagLine(tm[1].trim());
          if (parsed) current.lines.push(parsed);
          continue;
        }
      }
      const parsed = parseFlagLine(line);
      if (parsed) {
        if (!current) current = { start: 0, end: null, lines: [] };
        current.lines.push(parsed);
      }
    }

    computeCueEnds(cues);
    return cues;
  }

  }

  function parseBlockFormat(text) {
    const cues = [];
    const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
    for (const block of blocks) {
      const lines = block.trim().split('\n').map(l => l.trim()).filter(Boolean);

  function parseSubtitle(text) {

  function getCueTexts(cue) {
    // Segments can come split by '|' on one line, prefixed by FR:/AR:/EN:,
    // or led by a flag emoji — normalize all of that into plain lang lines.
    const rawLines = cue.text.split('\n').map(l => l.trim()).filter(Boolean);
    const lines = [];
    const declared = [];
    for (const raw of rawLines) {
      for (const seg of raw.split('|').map(s => s.trim()).filter(Boolean)) {
        const pm = seg.match(/^(fr|ar|en)\s*[:：\-–]\s*(.+)$/i);
        if (pm) { declared.push({ lang: pm[1].toLowerCase(), text: pm[2].trim() }); continue; }
        const fm = seg.match(/^(\p{Regional_Indicator}{2})\s*(.+)$/u);
        if (fm) { declared.push({ lang: FLAG_LANG_MAP[fm[1]] || detectLangFromText(fm[2]), text: fm[2].trim() }); continue; }
        lines.push(seg);
      }
    }
    if (declared.length) {
      const result = declared.slice();
      const missing = LANG_ORDER.filter(l => !result.some(r => r.lang === l));
      const arExtra = lines.filter(l => /[\u0600-\u06FF]/.test(l));
      const nonArExtra = lines.filter(l => !/[\u0600-\u06FF]/.test(l));
      let ni = 0;
      for (const lang of missing) {
        const text = lang === 'ar' ? arExtra.shift() : nonArExtra[ni++];
        if (text) result.push({ lang, text });
      }
      [...arExtra, ...nonArExtra.slice(ni)].forEach((text, i) => {
        const remaining = missing.filter(l => !result.some(r => r.lang === l));
        result.push({ lang: remaining[i] || 'fr', text });
      });
      return result;
    }
    const arLines = lines.filter(l => /[\u0600-\u06FF]/.test(l));
    const nonArLines = lines.filter(l => !/[\u0600-\u06FF]/.test(l));
    // unchanged detection path below
    const result = [];
    let nonArIdx = 0;
    for (const lang of LANG_ORDER) {
      if (lang === 'ar') {
        if (arLines.length) result.push({ lang, text: arLines.shift() });
      } else if (nonArIdx < nonArLines.length) {
        result.push({ lang, text: nonArLines[nonArIdx++] });
      }

    arLines.forEach(text => result.push({ lang: 'ar', text }));
    nonArLines.slice(nonArIdx).forEach((text, i) => {
      const remaining = LANG_ORDER.filter(l => l !== 'ar' && !result.some(r => r.lang === l));

    return result;
  }

  // --- Cue building ---
  function buildCues(frCues, arCues, enCues) {
    // If separate SRT files: union all start times and pick matching text per language.
    const allStarts = new Set();
    const add = cues => cues.forEach(c => { allStarts.add(c.start); });
    add(frCues); add(arCues); add(enCues);
    if (allStarts.size === 0 && frCues.length) {
      // Single file mode: already parsed as frCues; derive texts per cue
      return frCues.map(c => ({ start: c.start, end: c.end, lines: getCueTexts(c) }));
    }
    const times = Array.from(allStarts).sort((a,b) => a-b);
    const find = (cues, t) => cues.find(c => t >= c.start && t < c.end) || cues.find(c => Math.abs(c.start - t) < 0.05);
    return times.map(t => {
      const fr = find(frCues, t), ar = find(arCues, t), en = find(enCues, t);
      const lines = [];
      if (fr && fr.text.trim()) lines.push({ lang: 'fr', text: fr.text.trim() });
      if (ar && ar.text.trim()) lines.push({ lang: 'ar', text: ar.text.trim() });
      if (en && en.text.trim()) lines.push({ lang: 'en', text: en.text.trim() });
      const end = (fr && fr.end) || (ar && ar.end) || (en && en.end) || t + 2;
      return { start: t, end, lines };
    });
  }

  // --- TTS ---
  function isCapacitor() {
    return typeof window !== 'undefined' && window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  }
  let ttsRun = 0;
  function ttsStop() {
    ttsRun++;
    if (state.ttsChain) { clearTimeout(state.ttsChain); state.ttsChain = null; }
    if (window.EdgeTTS) window.EdgeTTS.stop();
    if (isCapacitor()) {
      const plugin = window.Capacitor.Plugins.TextToSpeech;
      if (plugin) plugin.stop().catch(()=>{});
    } else if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }
  function cleanForSpeech(text) {
    // Speak words only: drop flag emojis, pictographs/symbols and lang tags.
    return (text || '')
      .replace(/\p{Regional_Indicator}{1,2}/gu, ' ')
      .replace(/\b(fr|ar|en)\s*[:：]/giu, ' ')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{1F1E6}-\u{1F1FF}]/gu, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function ttsSpeak({ text, lang, onend }) {
    text = cleanForSpeech(text);
    if (!text) { if (onend) setTimeout(onend, 50); return; }
    // TTS and video are mutually exclusive: speaking pauses the video.
    if (player && !player.paused) player.pause();
    const useEdge = window.EdgeTTS && window.EdgeTTS.supported() &&
      (!window.EdgeTTS.engine || window.EdgeTTS.engine() === 'edge');
    if (useEdge) {
      const run = ++ttsRun;
      window.EdgeTTS.play(text, lang)
        .then(() => { if (run === ttsRun && onend) onend(); })
        .catch(() => {
          if (run !== ttsRun) return;
          window.EdgeTTS.down = true;
          deviceSpeak({ text, lang, onend });
        });
      return;
    }
    deviceSpeak({ text, lang, onend });
  }
  function deviceSpeak({ text, lang, onend }) {
    const ttsLang = lang === 'ar' ? 'ar-SA' : (lang === 'fr' ? 'fr-FR' : 'en-US');
    if (isCapacitor()) {
      const plugin = window.Capacitor.Plugins.TextToSpeech;
      if (!plugin) { if (onend) onend(); return; }
      plugin.stop().catch(()=>{})
        .then(() => plugin.speak({ text, lang: ttsLang, rate: 1.0, pitch: 1.0, volume: 1.0, category: 'playback' }))
        .then(() => { if (onend) onend(); })
        .catch(() => { if (onend) onend(); });
    } else if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = ttsLang;
      u.onend = onend;
      u.onerror = () => { if (onend) onend(); };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } else if (onend) {
      onend();
    }
  }

  function getCurrentCue() {
    return state.cues[state.currentIndex];
  }

  function getCurrentLine(lang) {
    const cue = getCurrentCue();
    return cue ? (cue.lines.find(l => l.lang === lang) || cue.lines[0]) : null;
  }

  function openExternalUrl(url) {
    if (isCapacitor() && window.Capacitor.Plugins.Browser) {
      window.Capacitor.Plugins.Browser.open({url: url}).catch(() => { window.open(url, '_blank'); });
    } else {
      window.open(url, '_blank');
    }
  }

  function openGoogleImages(word) {
    const q = (word || '').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
    if (!q) return;
    const hl = state.uiLang === 'ar' ? 'ar' : state.uiLang === 'fr' ? 'fr' : 'en';
    openExternalUrl('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q) + '&hl=' + hl);
  }

  function openGoogleAiSearch() {
    const cue = getCurrentCue();
    const frLine = cue && cue.lines.find(l => l.lang === 'fr');
    if (!frLine || !frLine.text.trim()) { showToast(t('noFrenchCue')); return; }
    const arLine = cue.lines.find(l => l.lang === 'ar') || {};
    const enLine = cue.lines.find(l => l.lang === 'en') || {};
    const prompt = t('aiPrompt', {fr: frLine.text.trim(), ar: (arLine.text || '').trim(), en: (enLine.text || '').trim()});
    const hl = state.uiLang === 'ar' ? 'ar' : state.uiLang === 'fr' ? 'fr' : 'en';
    const url = 'https://www.google.com/search?q=' + encodeURIComponent(prompt) + '&udm=50&hl=' + encodeURIComponent(hl);
    if (isCapacitor() && window.Capacitor.Plugins.Browser) {
      window.Capacitor.Plugins.Browser.open({url: url}).catch(() => { window.open(url, '_blank'); });
    } else {
      window.open(url, '_blank');
    }
  }

  function startLoopLang(lang) {
    stopAllLoops();
    state.loopLang = lang;
    updateButtons();
    const myToken = state.loopToken;
    const doSpeak = () => {
      if (state.loopLang !== lang || state.loopToken !== myToken) return;
      const line = getCurrentLine(lang);
      if (!line || !line.text) { state.ttsChain = setTimeout(doSpeak, 500); return; }
      ttsSpeak({ text: line.text, lang: line.lang, onend: () => {
        if (state.loopLang !== lang || state.loopToken !== myToken) return;
        state.ttsChain = setTimeout(doSpeak, 600);
      }});
    };
    doSpeak();
  }

  function toggleLoopLang(lang) {
    if (state.loopLang === lang) { stopAllLoops(); return; }
    startLoopLang(lang);
  }

  function startLoopAll() {
    stopAllLoops();
    state.loopAll = true;
    updateButtons();
    const myToken = state.loopToken;
    const available = () => {
      const cue = getCurrentCue();
      return cue ? LANG_ORDER.map(l => cue.lines.find(x => x.lang === l)).filter(Boolean) : [];
    };
    const doCycle = (idx) => {
      if (!state.loopAll || state.loopToken !== myToken) return;
      const lines = available();
      if (!lines.length) { state.ttsChain = setTimeout(() => doCycle(0), 500); return; }
      const i = idx % lines.length;
      ttsSpeak({ text: lines[i].text, lang: lines[i].lang, onend: () => {
        if (!state.loopAll || state.loopToken !== myToken) return;
        state.ttsChain = setTimeout(() => doCycle(i+1), 800);
      }});
    };
    doCycle(0);
  }

  function toggleLoopAll() {
    if (state.loopAll) { stopAllLoops(); return; }
    startLoopAll();
  }

  function startWordLoop(word, lang, el) {
    if (!word || !lang) return;
    if (state.wordLoopEl === el) { stopAllLoops(); return; }
    stopAllLoops();
    if (state.wordLoopEl) state.wordLoopEl.classList.remove('active');
    state.wordLoopEl = el;
    if (el) el.classList.add('active');
    const myToken = state.loopToken;
    const speak = () => {
      if (state.loopToken !== myToken) { if (state.wordLoopEl) state.wordLoopEl.classList.remove('active'); return; }
      ttsSpeak({ text: word, lang, onend: () => {
        if (state.loopToken !== myToken) { if (state.wordLoopEl) state.wordLoopEl.classList.remove('active'); return; }
        state.ttsChain = setTimeout(speak, 700);
      }});
    };
    speak();
  }

  function applyVideoLoop() { player.loop = state.fullVideoLoop; }

  function toggleFullVideoLoop() {
    if (!player.src && !videoFile.files[0]) { showToast(t('chooseVideoFirst')); return; }
    state.fullVideoLoop = !state.fullVideoLoop;
    applyVideoLoop();
    updateButtons();
  }

  function toggleVideoLoop() {
    const cue = getCurrentCue();
    if (!cue) { showToast(t('noCurrentCue')); return; }
    if (!player.src && !videoFile.files[0]) { showToast(t('chooseVideoFirst')); return; }
    if (state.videoLoop) { state.videoLoop = false; state.loopStart = 0; state.loopEnd = 0; updateButtons(); return; }
    state.videoLoop = true;
    state.loopStart = cue.start;
    state.loopEnd = cue.end;
    updateButtons();
    player.currentTime = cue.start;
    player.play().catch(()=>{});
  }

  function stopTTSLoops() {
    state.loopAll = false;
    state.loopLang = null;
    state.loopToken++;
    ttsStop();
    updateButtons();
  }
  function stopAllLoops() {
    stopTTSLoops();
    state.videoLoop = false;
    state.loopStart = 0;
    state.loopEnd = 0;
    if (state.wordLoopEl) { state.wordLoopEl.classList.remove('active'); state.wordLoopEl = null; }
    updateButtons();
  }
  function toggleMute() {
    state.muted = !state.muted;
    player.muted = state.muted;
    if (state.muted) stopAllLoops();
    updateButtons();
  }

  // --- UI ---
  function updateButtons() {
    btnLoopAll.classList.toggle('active', state.loopAll);
    btnFullLoop.classList.toggle('active', state.fullVideoLoop);
    btnVideoLoop.classList.toggle('active', state.videoLoop);
    document.querySelectorAll('.lang-line .loop').forEach(btn => {
      const l = btn.dataset.lang;
      btn.classList.toggle('active', state.loopLang === l);
    });
    if (btnStop) {
      btnStop.textContent = state.muted ? '🔊' : '🔇';
      btnStop.title = t(state.muted ? 'unmuteAudio' : 'stopAudio');
    }
  }

  function renderBubble() {
    const cue = getCurrentCue();
    if (!cue) {
      bubble.innerHTML = '';
      return;
    }
    bubble.style.setProperty('--caption-scale', state.captionScale);
    bubble.innerHTML = cue.lines.map(line => `
      <div class="lang-line ${line.lang}" dir="${line.lang === 'ar' ? 'rtl' : 'ltr'}">
        <div class="lang-line-header">
          <span class="badge">${LANG_FLAGS[line.lang] || ''} ${LANG_LABELS[line.lang]}</span>
          <button class="loop" data-lang="${line.lang}" title="${escapeHtml(t('speakTitle', {lang: LANG_NAMES[line.lang]}))}" aria-label="${escapeHtml(t('speakTitle', {lang: LANG_NAMES[line.lang]}))}">🔊</button>
        </div>
        <div class="lang-text">${wrapWords(line.text, line.lang)}</div>
      </div>
    `).join('');
    bubble.querySelectorAll('.lang-line .loop').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); toggleLoopLang(btn.dataset.lang); });
    });
    bubble.querySelectorAll('.word').forEach(w => {
      let tapTimer = null;
      w.addEventListener('click', e => {
        e.stopPropagation();
        if (tapTimer) {
          clearTimeout(tapTimer); tapTimer = null;
          openGoogleImages(w.textContent);
          return;
        }
        tapTimer = setTimeout(() => {
          tapTimer = null;
          startWordLoop(w.textContent.trim(), w.dataset.lang, w);
        }, 300);
      });
    });
  }

  function updateStatus() {
    const cue = getCurrentCue();
    if (!cue) { statusEl.textContent = ''; return; }
    statusEl.textContent = t('status', {current: state.currentIndex + 1, total: state.cues.length, start: formatDuration(cue.start), end: formatDuration(cue.end)});
  }

  function setCurrentByTime(t) {
    if (!state.cues.length) return -1;
    const idx = state.cues.findIndex(c => t >= c.start && t < c.end);
    if (idx >= 0 && idx !== state.currentIndex) {
      state.currentIndex = idx;
      renderBubble();
      updateStatus();
    }
    return state.currentIndex;
  }

  function goToCue(i) {
    if (!state.cues.length || i < 0 || i >= state.cues.length) return;
    if (state.wordLoopEl) { state.wordLoopEl.classList.remove('active'); state.wordLoopEl = null; state.loopToken++; ttsStop(); }
    state.currentIndex = i;
    const cue = state.cues[i];
    state.pendingSeek = cue.start;
    if (player.src) player.currentTime = cue.start;
    if (state.isPlaying) player.play().catch(()=>{});
    renderBubble();
    updateStatus();
    updateProgress();
    if (state.videoLoop) { state.loopStart = cue.start; state.loopEnd = cue.end; }
    if (state.loopAll) startLoopAll();
    else if (state.loopLang) startLoopLang(state.loopLang);
  }

  function prevCue() { if (state.currentIndex > 0) goToCue(state.currentIndex - 1); }
  function nextCue() { if (state.currentIndex < state.cues.length - 1) goToCue(state.currentIndex + 1); }
  function togglePlay() { if (player.paused) player.play(); else player.pause(); }

  function updateProgress() {
    if (!state.duration) return;
    progress.value = player.currentTime;
    currentTimeEl.textContent = formatDuration(player.currentTime);
  }

  function showView(viewName) {
    [lessonsView, setupView, playerView].forEach(v => v.classList.remove('active'));
    if (viewName === 'lessons') lessonsView.classList.add('active');
    else if (viewName === 'setup') setupView.classList.add('active');
    else if (viewName === 'player') playerView.classList.add('active');
    if (viewName !== 'player') stopAllLoops();
  }

  function attachPlayerEvents() {
    player.onloadedmetadata = () => {
      state.duration = player.duration || 0;
      player.playbackRate = state.playbackRate;
      applyFilter(state.filter);
      applyVideoLoop();
      progress.max = state.duration;
      durationEl.textContent = formatDuration(state.duration);
      videoWrap.style.aspectRatio = '';
      if (state.cues.length && state.duration) {
        const last = state.cues[state.cues.length - 1];
        if (last.end > state.duration) last.end = state.duration;
        for (let i = 0; i < state.cues.length - 1; i++) {
          if (state.cues[i].end > state.cues[i+1].start) state.cues[i].end = state.cues[i+1].start;
        }
      }
      if (state.pendingSeek !== null && player.src) {
        player.currentTime = state.pendingSeek;
        state.pendingSeek = null;
      }
    };
    player.ontimeupdate = () => {
      setCurrentByTime(player.currentTime);
      updateProgress();
      if (state.videoLoop && !player.paused && player.currentTime >= state.loopEnd - 0.05) {
        player.currentTime = state.loopStart;
      }
    };
    player.onplay = () => { state.isPlaying = true; btnPlay.textContent = '⏸'; stopTTSLoops(); };
    player.onpause = () => { state.isPlaying = false; btnPlay.textContent = '▶'; };
    player.onended = () => { state.isPlaying = false; btnPlay.textContent = '▶'; };
    progress.oninput = () => {
      player.currentTime = parseFloat(progress.value);
      setCurrentByTime(player.currentTime);
      updateProgress();
    };
  }

  async function loadCues() {
    if (!videoFile.files[0] && !srtMain.files[0] && !srtFr.files[0] && !srtAr.files[0] && !srtEn.files[0] && !srtPaste.value.trim()) {
      showToast(t('chooseFiles'));
      return false;
    }
    stopAllLoops();
    state.cues = [];
    state.currentIndex = -1;
    let frCues = [], arCues = [], enCues = [];
    try {
      if (srtMain.files[0]) {
        const text = await readFile(srtMain.files[0]);
        frCues = parseSubtitle(text);
      } else if (srtFr.files[0]) {
        const text = await readFile(srtFr.files[0]);
        frCues = parseSubtitle(text);
      } else if (srtPaste.value.trim()) {
        frCues = parseSubtitle(srtPaste.value.trim());
      }
      if (srtAr.files[0]) {
        const text = await readFile(srtAr.files[0]);
        arCues = parseSubtitle(text);
      }
      if (srtEn.files[0]) {
        const text = await readFile(srtEn.files[0]);
        enCues = parseSubtitle(text);
      }
    } catch (e) {
      showToast(t('readError'));
      return false;
    }
    const activeSource = frCues.length ? 'fr' : (arCues.length ? 'ar' : (enCues.length ? 'en' : null));
    const sourceCues = activeSource === 'fr' ? frCues : (activeSource === 'ar' ? arCues : enCues);
    const onlyOneSource = [frCues, arCues, enCues].filter(arr => arr.length).length === 1;
    if (activeSource && onlyOneSource) {
      if (sourceCues[0] && sourceCues[0].lines) {
        state.cues = sourceCues.map(c => ({ start: c.start, end: c.end, lines: c.lines }));
      } else {
        const hasAr = sourceCues.some(c => /[\u0600-\u06FF]/.test(c.text));
        const hasNonAr = sourceCues.some(c => c.text.split('\n').some(l => !/[\u0600-\u06FF]/.test(l) && l.trim()));
        if (hasAr && hasNonAr) {
          state.cues = sourceCues.map(c => ({ start: c.start, end: c.end, lines: getCueTexts(c) }));
        } else {
          state.cues = sourceCues.map(c => ({ start: c.start, end: c.end, lines: [{ lang: activeSource, text: c.text.replace(/\n+/g, ' ').trim() }] }));
        }
      }
    } else {
      state.cues = buildCues(frCues, arCues, enCues);
    }
    const editVideoBlob = state.editingLesson ? state.editingLesson.videoBlob : null;
    const editImageBlob = state.editingLesson ? state.editingLesson.imageBlob : null;
    if (!state.cues.length && !videoFile.files[0] && !editVideoBlob) {
      showToast(t('noCues'));
      return false;
    }
    controls.style.display = (state.cues.length || videoFile.files[0] || editVideoBlob) ? 'flex' : 'none';
    progress.max = 0;
    currentTimeEl.textContent = '00:00';
    durationEl.textContent = '00:00';
    if (state.videoUrl) {
      URL.revokeObjectURL(state.videoUrl);
      state.videoUrl = null;
    }
    if (state.posterUrl) {
      URL.revokeObjectURL(state.posterUrl);
      state.posterUrl = null;
    }
    const newVideoFile = videoFile.files[0];
    const newImageFile = lessonImage.files[0];
    const videoSource = newVideoFile || editVideoBlob;
    const imageSource = newImageFile || editImageBlob;
    const hasVideo = !!videoSource;
    const hasImage = !!imageSource;
    if (hasVideo) {
      state.videoUrl = URL.createObjectURL(videoSource);
      player.src = state.videoUrl;
      player.muted = state.muted;
    } else {
      player.src = '';
    }
    if (hasImage) {
      state.posterUrl = URL.createObjectURL(imageSource);
      player.poster = state.posterUrl;
    } else {
      player.poster = '';
    }
    setVideoBackground(hasImage ? state.posterUrl : null);
    videoWrap.style.display = (hasVideo || hasImage) ? 'block' : 'none';
    if (bubbleWrap) bubbleWrap.style.bottom = '';
    attachPlayerEvents();
    if (state.cues.length) goToCue(0);
    return true;
  }

  async function collectLesson(silent) {
    const editVideoBlob = state.editingLesson ? state.editingLesson.videoBlob : null;
    const editImageBlob = state.editingLesson ? state.editingLesson.imageBlob : null;
    if (!state.cues.length && !videoFile.files[0] && !editVideoBlob) {
      if (!silent) showToast(t('noContent'));
      return null;
    }
    const dateLocale = state.uiLang === 'ar' ? 'ar-EG' : state.uiLang === 'fr' ? 'fr-FR' : 'en-US';
    const defaultName = new Date().toLocaleDateString(dateLocale);
    let name = lessonName.value.trim();
    if (!name) name = silent ? t('lessonDefaultName', {date: defaultName}) : (prompt(t('lessonNamePrompt'), t('lessonDefaultName', {date: defaultName})) || t('lessonDefaultName', {date: defaultName}));
    let videoBlob = null, imageBlob = null;
    if (videoFile.files[0]) {
      try {
        const ab = await readFileAsArrayBuffer(videoFile.files[0]);
        videoBlob = new Blob([ab], { type: videoFile.files[0].type || 'video/mp4' });
      } catch (e) { if (!silent) showToast(t('readVideoError')); return null; }
    } else if (editVideoBlob) {
      videoBlob = editVideoBlob;
    }
    if (lessonImage.files[0]) {
      try {
        const ab = await readFileAsArrayBuffer(lessonImage.files[0]);
        imageBlob = new Blob([ab], { type: lessonImage.files[0].type || 'image/jpeg' });
      } catch (e) { if (!silent) showToast(t('readImageError')); }
    } else if (editImageBlob) {
      imageBlob = editImageBlob;
    }
    if (state.editingLessonId && state.editingLesson) {
      return { ...state.editingLesson, name, cues: state.cues, videoBlob, imageBlob };
    }
    return { id: Date.now().toString(36), name, createdAt: Date.now(), cues: state.cues, videoBlob, imageBlob };
  }

  async function start() {
    const ok = await loadCues();
    if (!ok) return;
    // Auto-save the lesson so it stays in the lessons list after going back.
    const lesson = await collectLesson(true);
    if (lesson) {
      try {
        await saveLessonToDB(lesson);
        state.editingLessonId = lesson.id;
        state.editingLesson = lesson;
        state.currentLessonId = lesson.id;
        lessonTitle.textContent = lesson.name;
        renderLessons();
      } catch (e) {}
    }
    showToast(t('loadedCues', {count: state.cues.length}));
    showView('player');
  }

  async function saveLesson() {
    const ok = await loadCues();
    if (!ok) return;
    const lesson = await collectLesson(false);
    if (!lesson) return;
    state.currentLessonId = lesson.id;
    state.editingLessonId = lesson.id;
    state.editingLesson = lesson;
    try {
      await saveLessonToDB(lesson);
      showToast(t('saveSuccess'));
      await renderLessons();
      showView('lessons');
    } catch (e) { showToast(t('saveError')); }
  }

  async function loadLesson(id) {
    stopAllLoops();
    const lesson = await getLessonById(id);
    if (!lesson) { showToast(t('notFound')); return; }
    state.currentLessonId = lesson.id;
    if (state.videoUrl) { URL.revokeObjectURL(state.videoUrl); state.videoUrl = null; }
    if (state.posterUrl) { URL.revokeObjectURL(state.posterUrl); state.posterUrl = null; }
    state.cues = lesson.cues || [];
    state.currentIndex = -1;
    const hasVideo = !!lesson.videoBlob;
    const hasImage = !!lesson.imageBlob;
    if (hasVideo) {
      state.videoUrl = URL.createObjectURL(lesson.videoBlob);
      player.src = state.videoUrl;
      player.muted = state.muted;
    } else {
      player.src = '';
    }
    if (hasImage) {
      state.posterUrl = URL.createObjectURL(lesson.imageBlob);
      player.poster = state.posterUrl;
    } else {
      player.poster = '';
    }
    setVideoBackground(hasImage ? state.posterUrl : null);
    videoWrap.style.display = (hasVideo || hasImage) ? 'block' : 'none';

  function cuesToSrt(cues) {
    return cues.map((c, i) => {
      const fr = c.lines && c.lines.find(l => l.lang === 'fr');
      const ar = c.lines && c.lines.find(l => l.lang === 'ar');
      const en = c.lines && c.lines.find(l => l.lang === 'en');
      const textLines = [fr && fr.text, ar && ar.text, en && en.text].filter(Boolean);
      const start = c.start || 0;
      const end = c.end || (start + 2);
      return `${i+1}\n${formatTime(start)} --> ${formatTime(end)}\n${textLines.join('\n')}`;
    }).join('\n\n');
  }

  // --- Import / Export ---
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      if (!blob) { resolve(null); return; }
      const r = new FileReader();
      r.onload = () => {
        const dataUrl = r.result;
        const base64 = dataUrl.split(',')[1];
        resolve(base64);
      };
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }
  function base64ToBlob(base64, type) {
    if (!base64) return null;
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: type || 'application/octet-stream' });
  }
  function sanitizeFilename(name) {
    return String(name).replace(/[^\p{L}\p{N}\s_-]/gu, '_').replace(/\s+/g, '_') || 'lesson';
  }
  async function serializeLesson(lesson) {
    const obj = { name: lesson.name, createdAt: lesson.createdAt, cues: lesson.cues };
    if (lesson.videoBlob) {
      obj.videoBase64 = await blobToBase64(lesson.videoBlob);
      obj.videoType = lesson.videoBlob.type || 'video/mp4';
    }
    if (lesson.imageBlob) {
      obj.imageBase64 = await blobToBase64(lesson.imageBlob);
      obj.imageType = lesson.imageBlob.type || 'image/jpeg';
    }
    return obj;
  }
  function deserializeLesson(obj) {
    const lesson = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: obj.name || 'Lesson', createdAt: obj.createdAt || Date.now(), cues: Array.isArray(obj.cues) ? obj.cues : [] };
    if (obj.videoBase64) lesson.videoBlob = base64ToBlob(obj.videoBase64, obj.videoType);
    if (obj.imageBase64) lesson.imageBlob = base64ToBlob(obj.imageBase64, obj.imageType);
    return lesson;
  }
  function downloadFile(blob, filename) {
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }
  async function shareFile(content, filename, title, type = 'text/plain') {
    const errs = [];
    const push = (e) => { const m = (e && e.message) ? e.message : String(e); if (m) errs.push(m); };
    if (isCapacitor() && window.Capacitor.Plugins.Share) {
      const share = window.Capacitor.Plugins.Share;
      // 1) share the file itself (WhatsApp / Drive / Telegram get a real file)
      try {
        const fs = window.Capacitor.Plugins.Filesystem;
        if (!fs) throw new Error('Filesystem plugin missing');
        const result = await fs.writeFile({ path: filename, data: content, directory: 'CACHE', encoding: 'utf8' });
        let uri = result && result.uri;
        if (!uri) {
          const uriRes = await fs.getUri({ path: filename, directory: 'CACHE' });
          uri = uriRes && uriRes.uri;
        }
        if (!uri) throw new Error('no file uri');
        await share.share({ url: uri, title: title || filename, dialogTitle: title || filename });
        return 'share';
      } catch (e) { push(e); }
      // 2) still open the native sheet with the content as text
      try {
        await share.share({ title: title || filename, text: content, dialogTitle: title || filename });
        return 'share-text';
      } catch (e) { push(e); }
    }
    if (navigator.share) {
      const blob = new Blob([content], { type });
      const file = new File([blob], filename, { type });
      try {
        await navigator.share({ files: [file], title: title || filename });
        return 'share';
      } catch (e) { push(e); }
      try {
        await navigator.share({ title: title || filename, text: content });
        return 'share-text';
      } catch (e) { push(e); }
    }
    try { downloadFile(new Blob([content], { type }), filename); } catch (e) { push(e); }
    return 'download:' + errs.join(' | ');
  }
  function formatSRTTime(seconds) {
    const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
    const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    const ms = Math.round((seconds % 1) * 1000).toString().padStart(3, '0');
    return `${h}:${m}:${s},${ms}`;
  }
  function cuesToSRT(cues) {
    return cues.map((cue, i) => {
      const lines = (cue.lines || []).map(l => l.text).join('\n');
      return `${i + 1}\n${formatSRTTime(cue.start)} --> ${formatSRTTime(cue.end)}\n${lines}`;
    }).join('\n\n');
  }
  async function exportLesson(id) {
    const lesson = await getLessonById(id);
    if (!lesson) return;
    try {

      const filename = `${sanitizeFilename(lesson.name)}.json`;
      const r = await shareFile(json, filename, lesson.name, 'application/json');
      showToast(r.indexOf('share') === 0 ? t('exportSuccess', {name: lesson.name}) : t('exportError') + ' — ' + r);
    } catch (e) { showToast(t('exportError') + ' — ' + (e.message || e)); }

  async function importLessonsFromFile(file) {
    let text;
    try { text = await readFile(file); } catch (e) { showToast(t('importError')); return; }
    let data;
    try { data = JSON.parse(text); } catch (e) { showToast(t('importInvalid')); return; }
    let list = Array.isArray(data) ? data : [data];
    let count = 0;
    for (const obj of list) {
      if (!obj || !Array.isArray(obj.cues)) continue;
      try {
        const lesson = deserializeLesson(obj);
        await saveLessonToDB(lesson);
        count++;
      } catch (e) {}
    }
    showToast(t('importSuccess', {count: count}));
    await renderLessons();
  }

  function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  function renderFormatsList() {
    if (!formatsList) return;
    formatsList.innerHTML = FORMAT_SAMPLES.map((f, i) => `
      <div class="format-card">
        <div class="format-name">${escapeHtml(f.name)}</div>
        <pre>${escapeHtml(f.sample)}</pre>
        <div class="format-actions">
          <button type="button" data-fmt-copy="${i}">📋 ${escapeHtml(t('copyBtn'))}</button>
        </div>
      </div>`).join('');
    formatsList.querySelectorAll('[data-fmt-copy]').forEach(b => {
      b.addEventListener('click', () => {
        copyTextToClipboard(FORMAT_SAMPLES[+b.dataset.fmtCopy].sample).then(() => showToast(t('copied')));
      });
    });
  }
  function openFormats() { renderFormatsList(); if (formatsBackdrop) formatsBackdrop.style.display = 'flex'; }
  function closeFormats() { if (formatsBackdrop) formatsBackdrop.style.display = 'none'; }
  if (btnFormats) btnFormats.addEventListener('click', openFormats);
  if (btnFormatsClose) btnFormatsClose.addEventListener('click', closeFormats);
  if (formatsBackdrop) formatsBackdrop.addEventListener('click', e => { if (e.target === formatsBackdrop) closeFormats(); });

  function initBackButton() {
    try {
      if (isCapacitor() && window.Capacitor.Plugins.App && window.Capacitor.Plugins.App.addListener) {
        window.Capacitor.Plugins.App.addListener('backButton', () => {
          if (playerView.classList.contains('active') || setupView.classList.contains('active')) {
            showView('lessons');
          } else if (confirm(t('exitConfirm'))) {
            window.Capacitor.Plugins.App.exitApp();
          }
        });
      }
    } catch (e) {}
  }

  initBackButton();
  makeBubbleDraggable();
  setUILang(state.uiLang);
  showView('lessons');

})();
</script>
</body>
</html>
