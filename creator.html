<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d1f">
<title>Lang</title>
<link rel="manifest" href="manifest-creator.json">
<style>
  :root {
    --bg-primary: #0b0d1f;
    --bg-secondary: rgba(19,22,43,0.86);
    --bg-tertiary: #1e213d;
    --text-primary: #f7f8ff;
    --text-secondary: #9ba0c9;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent-teal: #00d4aa;
    --danger: #ff6b81;
    --success: #00d4aa;
    --gold: #ffc857;
    --border: rgba(255,255,255,0.10);
    --radius: 22px;
    --radius-sm: 999px;
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
    --shadow-sm: 0 6px 20px rgba(0,0,0,0.25);
  }
  [data-theme="light"] {
    --bg-primary: #f4f6fb;
    --bg-secondary: rgba(255,255,255,0.92);
    --bg-tertiary: #eef0f7;
    --text-primary: #181a2e;
    --text-secondary: #5e627d;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 12px 32px rgba(0,0,0,0.10);
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, rgba(139,92,246,0.18), transparent), radial-gradient(1200px 600px at 110% 10%, rgba(0,212,170,0.14), transparent), var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    padding-bottom: 3rem;
  }
  header { position: sticky; top: 0; z-index: 60; background: rgba(11,13,31,0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); }
  [data-theme="light"] header { background: rgba(255,255,255,0.72); }
  .header-inner { max-width: 960px; margin: 0 auto; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .logo { font-weight: 900; font-size: 1.15rem; white-space: nowrap; letter-spacing: -0.03em; background: linear-gradient(90deg, var(--accent), var(--accent-teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .spacer { flex: 1; }
  .icon-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 14px; padding: 0.45rem 0.65rem; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 600; transition: transform .12s, border-color .15s, background .15s, box-shadow .15s; }
  .icon-btn:hover { border-color: var(--accent); background: var(--bg-secondary); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(139,92,246,0.18); }
  .icon-btn.active { background: linear-gradient(135deg, var(--success), #0ac2a1); color: #0b0d1f; border-color: transparent; }
  .lang-switch { display: flex; gap: 0.3rem; }
  .lang-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.6rem; font-size: 0.78rem; font-weight: 700; cursor: pointer; min-width: 2.2rem; transition: transform .12s, background .15s; }
  .lang-btn:hover { border-color: var(--accent); }
  .lang-btn.active { background: linear-gradient(135deg, var(--accent), #6d28d9); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(139,92,246,0.3); }
  main { max-width: 960px; margin: 0 auto; padding: 1rem; }

  .hero { background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(0,212,170,0.12)); border: 1px solid var(--border); border-radius: 24px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; position: relative; overflow: hidden; box-shadow: var(--shadow-sm); }
  .hero::before { content: ''; position: absolute; top:0; left:0; right:0; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-teal)); }
  .hero h1 { margin: 0 0 0.4rem; font-size: 1.45rem; font-weight: 900; letter-spacing: -0.02em; }
  .hero p { margin: 0; color: var(--text-secondary); font-size: 0.95rem; }

  .btn { background: linear-gradient(135deg, var(--accent), #6d28d9); color: #fff; border: none; border-radius: 999px; padding: 0.7rem 1.1rem; font-size: 0.95rem; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(139,92,246,0.25); transition: transform .12s, filter .15s, box-shadow .15s; }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(139,92,246,0.35); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); box-shadow: none; }
  .btn.ghost:hover { border-color: var(--accent); background: var(--bg-secondary); }
  .btn.danger { background: linear-gradient(135deg, #ff6b81, #f43f5e); }
  .btn.success { background: linear-gradient(135deg, var(--success), #0ac2a1); color: #0b0d1f; box-shadow: 0 6px 16px rgba(0,212,170,0.25); }
  .btn-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.9rem; }

  .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 22px; padding: 1.1rem; margin-bottom: 1rem; box-shadow: var(--shadow-sm); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform .12s, box-shadow .15s, border-color .15s; }
  .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.18); border-color: rgba(139,92,246,0.25); }
  .card-title { font-weight: 800; font-size: 1.08rem; margin-bottom: 0.3rem; }
  .card-sub { color: var(--text-secondary); font-size: 0.85rem; }

  .lesson-card { display: flex; align-items: center; gap: 0.9rem; cursor: pointer; }
  .lesson-card:hover { border-color: var(--accent); transform: translateY(-2px) scale(1.005); }
  .lesson-card .num { min-width: 2.6rem; height: 2.6rem; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-teal)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 4px 12px rgba(139,92,246,0.25); }
  .lesson-card .body { flex: 1; min-width: 0; }

  .input, .textarea {
    width: 100%; background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 0.75rem 1rem; font-size: 1rem; font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .input:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,0.18); }
  .textarea { min-height: 3.4rem; resize: vertical; }
  .field-label { display: block; color: var(--text-secondary); font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; margin: 0.7rem 0 0.3rem; }
  .field-label-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.7rem; }
  .field-label-row .field-label { margin: 0; }
  .row-actions { display: flex; gap: 0.35rem; }
  .row-actions .icon-btn { padding: 0.22rem 0.4rem; font-size: 0.8rem; line-height: 1; border-radius: 10px; }

  .phrase-card { margin-bottom: 1rem; position: relative; }
  .phrase-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
  .phrase-num { color: var(--accent); font-size: 0.85rem; font-weight: 900; }
  .phrase-actions { margin-left: auto; display: flex; gap: 0.4rem; }
  .phrase-actions .icon-btn { padding: 0.35rem 0.5rem; font-size: 0.85rem; border-radius: 10px; }

  .media-box { background: var(--bg-tertiary); border: 2px dashed var(--border); border-radius: 18px; padding: 1rem; text-align: center; margin: 0.75rem 0; transition: border-color .15s, background .15s; }
  .media-box.has-media { border-style: solid; border-color: var(--success); padding: 0; overflow: hidden; background: #000; }
  .media-preview { width: 100%; max-height: 360px; object-fit: contain; display: block; }
  .media-preview video { width: 100%; max-height: 360px; }
  .media-placeholder { color: var(--text-secondary); font-size: 0.9rem; padding: 1rem; }
  .media-btns { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.6rem; }

  ::placeholder { color: var(--text-secondary); opacity: 0.65; }
  .empty { color: var(--text-secondary); text-align: center; padding: 2.5rem 1rem; }
  .hint { background: linear-gradient(135deg, rgba(139,92,246,0.10), rgba(0,212,170,0.08)); border: 1px dashed rgba(139,92,246,0.35); border-radius: 18px; padding: 0.9rem 1.1rem; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem; }
  .toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.7rem 1.2rem; box-shadow: var(--shadow); z-index: 100; font-size: 0.92rem; font-weight: 600; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .hidden { display: none !important; }

  .playing { border-color: var(--success); box-shadow: 0 0 0 3px rgba(0,212,170,0.22); }

  @media (max-width: 480px) {
    .header-inner { padding: 0.65rem; }
    .hero h1 { font-size: 1.15rem; }
    main { padding: 0.75rem; }
    .btn { padding: 0.65rem 0.9rem; }
    .card { padding: 0.9rem; border-radius: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo" data-t="appName">Motsy Creator</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-export" data-t-title="export" title="Export">⬆️</button>
    <button class="icon-btn" id="btn-import" data-t-title="import" title="Import">⬇️</button>
    <input type="file" id="import-file" accept="application/json" class="hidden">
    <div class="lang-switch">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ar">AR</button>
      <button class="lang-btn" data-lang="fr">FR</button>
    </div>
    <button class="icon-btn" id="btn-theme" data-t-title="themeMode" title="Dark / light">🌙</button>
  </div>
</header>

<main id="app"></main>

<script>
(function () {
  'use strict';

  var DB_NAME = 'MotsyCreatorDB', DB_VERSION = 1;
  var db = null;
  var dbReady = openDB();

  var state = {
    view: 'lessons', // 'lessons' | 'lesson'
    lessons: [],
    currentLessonId: null,
    uiLang: localStorage.getItem('creator_ui_lang') || 'ar',
    theme: localStorage.getItem('creator_theme') || 'dark',
    loopKey: null,
    mediaUrls: {}, // mediaId -> objectUrl
    saveTimer: null
  };

  var UI = {
    appName: { ar: 'Lang', en: 'Lang', fr: 'Lang' },
    title: { ar: 'Lang', en: 'Lang', fr: 'Lang' },
    subtitle: { ar: 'أنشئ دروساً بجمل فرنسية مترجمة، مع صور أو فيديو، وأزرار نطق.', en: 'Create lessons with translated French phrases, images or video, and speak/loop buttons.', fr: 'Créez des leçons avec des phrases françaises traduites, images ou vidéos, et boutons de lecture.' },
    lesson: { ar: 'درس', en: 'Lesson', fr: 'Leçon' },
    addLesson: { ar: '+ درس جديد', en: '+ New lesson', fr: '+ Nouvelle leçon' },
    noLessons: { ar: 'لا توجد دروس بعد. ابدأ بإضافة درس جديد.', en: 'No lessons yet. Add a new lesson to start.', fr: 'Aucune leçon pour le moment. Ajoutez une nouvelle leçon.' },
    phrases: { ar: 'عبارات', en: 'phrases', fr: 'phrases' },
    addPhrase: { ar: '+ إضافة عبارة', en: '+ Add phrase', fr: '+ Ajouter une phrase' },
    playAll: { ar: '▶ تشغيل الكل', en: '▶ Play all', fr: '▶ Tout lire' },
    stopAll: { ar: '⏹ إيقاف', en: '⏹ Stop', fr: '⏹ Arrêter' },
    back: { ar: '‹ رجوع', en: '‹ Back', fr: '‹ Retour' },
    phraseFr: { ar: 'الجملة الفرنسية', en: 'French sentence', fr: 'Phrase française' },
    phraseAr: { ar: 'الترجمة العربية', en: 'Arabic translation', fr: 'Traduction arabe' },
    phraseEn: { ar: 'الترجمة الإنجليزية', en: 'English translation', fr: 'Traduction anglaise' },
    attachMedia: { ar: '📎 صورة / فيديو', en: '📎 Image / video', fr: '📎 Image / vidéo' },
    removeMedia: { ar: '❌ إزالة الوسائط', en: '❌ Remove media', fr: '❌ Supprimer le média' },
    speak: { ar: '🔊 نطق', en: '🔊 Speak', fr: '🔊 Écouter' },
    loop: { ar: '🔁 تكرار', en: '🔁 Loop', fr: '🔁 Répéter' },
    stop: { ar: '⏹ إيقاف', en: '⏹ Stop', fr: '⏹ Arrêter' },
    delete: { ar: '🗑', en: '🗑', fr: '🗑' },
    moveUp: { ar: '⬆', en: '⬆', fr: '⬆' },
    moveDown: { ar: '⬇', en: '⬇', fr: '⬇' },
    noMedia: { ar: 'لا توجد وسائط مرفقة', en: 'No media attached', fr: 'Aucun média joint' },
    saved: { ar: 'تم الحفظ', en: 'Saved', fr: 'Enregistré' },
    export: { ar: 'تصدير', en: 'Export', fr: 'Exporter' },
    import: { ar: 'استيراد', en: 'Import', fr: 'Importer' },
    themeMode: { ar: 'الوضع الليلي/النهاري', en: 'Dark / light mode', fr: 'Mode sombre / clair' },
    mediaHint: { ar: 'اضغط لاختيار صورة أو فيديو من الهاتف', en: 'Tap to choose an image or video from your phone', fr: 'Appuyez pour choisir une image ou une vidéo depuis votre téléphone' },
    exampleLabel: { ar: 'نموذج', en: 'Example', fr: 'Exemple' },
    exitConfirm: { ar: 'هل تريد الخروج من التطبيق؟', en: 'Do you want to exit the app?', fr: 'Voulez-vous quitter l\'application ?' },
    deleteConfirm: { ar: 'هل تريد حذف هذا الدرس؟', en: 'Delete this lesson?', fr: 'Supprimer cette leçon ?' },
    deletePhraseConfirm: { ar: 'هل تريد حذف هذه العبارة؟', en: 'Delete this phrase?', fr: 'Supprimer cette phrase ?' },
    deleteMediaConfirm: { ar: 'هل تريد إزالة الوسائط المرفقة؟', en: 'Remove attached media?', fr: 'Supprimer le média joint ?' },
    bulkAddLabel: { ar: 'إضافة عبارات متعددة (فرنسي | عربي | إنجليزي)', en: 'Add multiple phrases (French | Arabic | English)', fr: 'Ajouter plusieurs phrases (français | arabe | anglais)' },
    bulkAddButton: { ar: '+ إضافة', en: '+ Add', fr: '+ Ajouter' },
    noBulkPhrases: { ar: 'لا توجد عبارات صالحة. استخدم الشكل: فرنسي | عربي | إنجليزي', en: 'No valid phrases. Use format: French | Arabic | English', fr: 'Aucune phrase valide. Format : français | arabe | anglais' }
  };

  function t(key) {
    var v = UI[key];
    return (v && v[state.uiLang]) || (v && v.en) || key;
  }

  /* ---------------- IndexedDB ---------------- */

  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = function () { reject(req.error); };
      req.onsuccess = function () { db = req.result; resolve(db); };
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('lessons')) d.createObjectStore('lessons', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' });
      };
    });
  }

  function txStore(store, mode) {
    return db.transaction([store], mode).objectStore(store);
  }

  function dbPut(store, obj) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readwrite').put(obj);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbGet(store, id) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readonly').get(id);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbDel(store, id) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readwrite').delete(id);
      req.onsuccess = function () { resolve(); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbGetAll(store) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readonly').getAll();
      req.onsuccess = function () { resolve(req.result || []); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function uuid() {
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }

  /* ---------------- State & persistence ---------------- */

  function loadLessons() {
    return dbGetAll('lessons').then(function (list) {
      state.lessons = list || [];
    });
  }

  function getLesson(id) {
    return state.lessons.filter(function (l) { return l.id === id; })[0];
  }

  function queueSave() {
    if (state.saveTimer) clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(saveCurrentLesson, 400);
  }

  function saveCurrentLesson() {
    var lesson = getLesson(state.currentLessonId);
    if (!lesson) return;
    dbPut('lessons', lesson).catch(function (e) { console.error('save failed', e); });
  }

  function addLesson() {
    var lesson = {
      id: uuid(),
      title: { ar: '', fr: '', en: '' },
      phrases: []
    };
    state.lessons.push(lesson);
    dbPut('lessons', lesson).then(function () {
      openLesson(lesson.id);
    });
  }

  function deleteLesson(id) {
    var lesson = getLesson(id);
    if (!lesson) return;
    if (lesson.phrases) {
      lesson.phrases.forEach(function (p) { if (p.mediaId) deleteMedia(p.mediaId); });
    }
    state.lessons = state.lessons.filter(function (l) { return l.id !== id; });
    dbDel('lessons', id).then(render);
  }

  function addPhrase(lesson) {
    lesson.phrases.push({ id: uuid(), fr: '', ar: '', en: '' });
    saveCurrentLesson();
    renderLessonEditor();
  }

  function addBulkPhrases(lesson) {
    var el = document.getElementById('bulk-input');
    if (!el) return;
    var lines = (el.value || '').split('\n');
    var added = 0;
    lines.forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var parts = line.split('|');
      if (parts.length < 3) return;
      lesson.phrases.push({
        id: uuid(),
        fr: (parts[0] || '').trim(),
        ar: (parts[1] || '').trim(),
        en: (parts[2] || '').trim()
      });
      added++;
    });
    if (added) {
      saveCurrentLesson();
      renderLessonEditor();
    } else {
      toast(t('noBulkPhrases') || 'No valid phrases');
    }
  }

  function deletePhrase(lesson, phraseId) {
    var p = lesson.phrases.filter(function (x) { return x.id === phraseId; })[0];
    if (p && p.mediaId) deleteMedia(p.mediaId);
    lesson.phrases = lesson.phrases.filter(function (x) { return x.id !== phraseId; });
    saveCurrentLesson();
    renderLessonEditor();
  }

  function movePhrase(lesson, phraseId, dir) {
    var idx = lesson.phrases.findIndex(function (x) { return x.id === phraseId; });
    if (idx === -1) return;
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= lesson.phrases.length) return;
    var tmp = lesson.phrases[idx];
    lesson.phrases[idx] = lesson.phrases[newIdx];
    lesson.phrases[newIdx] = tmp;
    saveCurrentLesson();
    renderLessonEditor();
  }

  function saveMedia(mediaId, file) {
    return dbPut('media', { id: mediaId, blob: file, type: file.type });
  }

  function deleteMedia(mediaId) {
    if (state.mediaUrls[mediaId]) { URL.revokeObjectURL(state.mediaUrls[mediaId]); delete state.mediaUrls[mediaId]; }
    return dbDel('media', mediaId);
  }

  function getMediaUrl(mediaId) {
    if (state.mediaUrls[mediaId]) return Promise.resolve(state.mediaUrls[mediaId]);
    return dbGet('media', mediaId).then(function (m) {
      if (!m) return null;
      var url = URL.createObjectURL(m.blob);
      state.mediaUrls[mediaId] = url;
      return url;
    });
  }

  function dataURLToBlob(dataURL) {
    var parts = dataURL.split(',');
    var base64 = parts[1];
    var mime = parts[0].match(/:(.*?);/)[1];
    var bin = atob(base64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  /* ---------------- UI helpers ---------------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2000);
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme === 'light' ? 'light' : 'dark');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', state.theme === 'light' ? '#f4f6fb' : '#0b0d1f');
    localStorage.setItem('creator_theme', state.theme);
  }

  function setUILang(lang) {
    state.uiLang = lang;
    localStorage.setItem('creator_ui_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === lang); });
    applyTranslations();
    render();
  }

  function applyTranslations() {
    document.title = t('appName');
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var key = el.dataset.t;
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = t(key);
      else el.textContent = t(key);
    });
    document.querySelectorAll('[data-t-title]').forEach(function (el) { el.title = t(el.dataset.tTitle); });
  }

  function setView(name, lessonId) {
    state.view = name;
    state.currentLessonId = lessonId || null;
    render();
  }

  function openLesson(id) {
    state.view = 'lesson';
    state.currentLessonId = id;
    render();
  }

  /* ---------------- Rendering ---------------- */

  function render() {
    if (state.view === 'lesson') renderLessonEditor();
    else renderLessonList();
  }

  function renderLessonList() {
    var app = document.getElementById('app');
    var html = '<div class="hero"><h1 data-t="appName"></h1><p data-t="subtitle"></p></div>' +
      '<div class="btn-row"><button class="btn" id="add-lesson" data-t="addLesson"></button></div>';
    if (!state.lessons.length) {
      html += '<div class="empty" data-t="noLessons"></div>';
    } else {
      html += state.lessons.map(function (l, i) {
        var first = l.phrases && l.phrases[0];
        var title = esc(l.title[state.uiLang] || l.title.en || l.title.fr || l.title.ar ||
          (first && (first[state.uiLang] || first.fr || first.ar || first.en)) ||
          t('lesson') + ' ' + (i + 1));
        return '<div class="card lesson-card" data-lesson="' + l.id + '">' +
          '<div class="num">' + (i + 1) + '</div>' +
          '<div class="body"><div class="card-title">' + title + '</div>' +
          '<div class="card-sub">' + l.phrases.length + ' ' + t('phrases') + '</div></div>' +
          '<button class="icon-btn delete-lesson" data-lesson="' + l.id + '" data-t-title="delete">' + t('delete') + '</button>' +
          '</div>';
      }).join('');
    }
    app.innerHTML = html;
    bindListEvents();
    applyTranslations();
  }

  function bindListEvents() {
    document.getElementById('add-lesson').onclick = addLesson;
    document.querySelectorAll('.lesson-card').forEach(function (c) {
      c.onclick = function (e) {
        if (e.target.closest('.delete-lesson')) return;
        openLesson(c.dataset.lesson);
      };
    });
    document.querySelectorAll('.delete-lesson').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        if (confirm(t('deleteConfirm'))) deleteLesson(b.dataset.lesson);
      };
    });
  }

  function renderLessonEditor() {
    var app = document.getElementById('app');
    var lesson = getLesson(state.currentLessonId);
    if (!lesson) { setView('lessons'); return; }
    var lessonIndex = state.lessons.findIndex(function (l) { return l.id === lesson.id; }) + 1;
    app.innerHTML = '<div class="hero"><h1 data-t="appName"></h1><p>' + esc(t('lesson') + ' ' + lessonIndex + ' · ' + lesson.phrases.length + ' ' + t('phrases')) + '</p></div>';

    var controls = document.createElement('div');
    controls.className = 'btn-row';
    controls.innerHTML =
      '<button class="btn success" id="btn-play-all" data-t="playAll"></button>' +
      '<button class="btn ghost" id="btn-stop-all" data-t="stopAll"></button>';
    app.appendChild(controls);

    var hint = document.createElement('div');
    hint.className = 'hint';
    hint.innerHTML = '<div class="field-label" data-t="exampleLabel"></div>' +
      '<div dir="ltr" style="margin-top:0.35rem; font-size:1.05rem;">' +
        '<bdi>Bonjour</bdi> | <bdi>مرحبا</bdi> | <bdi>Hello</bdi>' +
      '</div>';
    app.appendChild(hint);

    var bulk = document.createElement('div');
    bulk.className = 'card';
    bulk.innerHTML =
      '<div class="field-label" data-t="bulkAddLabel"></div>' +
      '<textarea class="textarea" id="bulk-input" dir="auto" rows="3" placeholder="Bonjour | مرحبا | Hello">' +
      '</textarea>' +
      '<div class="btn-row" style="margin-top:0.6rem">' +
        '<button class="btn" id="btn-bulk-add" data-t="bulkAddButton"></button>' +
      '</div>';
    app.appendChild(bulk);

    var phrasesDiv = document.createElement('div');
    phrasesDiv.id = 'phrases-list';
    lesson.phrases.forEach(function (p, idx) {
      phrasesDiv.appendChild(createPhraseCard(lesson, p, idx));
    });
    app.appendChild(phrasesDiv);

    var addFooter = document.createElement('div');
    addFooter.className = 'btn-row';
    addFooter.innerHTML = '<button class="btn" id="btn-add-phrase" data-t="addPhrase"></button>';
    app.appendChild(addFooter);

    bindEditorEvents(lesson);
    renderMediaPreviews();
    applyTranslations();
  }

  function lineControls(lang) {
    return '<span class="row-actions">' +
      '<button class="icon-btn speak-line" data-lang="' + lang + '" data-t-title="speak" title="' + t('speak') + '">🔊</button>' +
      '<button class="icon-btn loop-line" data-lang="' + lang + '" data-t-title="loop" title="' + t('loop') + '">🔁</button>' +
    '</span>';
  }

  function createPhraseCard(lesson, p, idx) {
    var card = document.createElement('div');
    card.className = 'card phrase-card';
    card.dataset.phraseId = p.id;
    card.innerHTML =
      '<div class="phrase-header">' +
        '<span class="phrase-num">#' + (idx + 1) + '</span>' +
        '<div class="phrase-actions">' +
          '<button class="icon-btn move-up" data-t-title="moveUp">' + t('moveUp') + '</button>' +
          '<button class="icon-btn move-down" data-t-title="moveDown">' + t('moveDown') + '</button>' +
          '<button class="icon-btn delete-phrase" data-t-title="delete">' + t('delete') + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="field-label-row"><span class="field-label" data-t="phraseFr"></span>' + lineControls('fr') + '</div>' +
      '<textarea class="textarea" dir="ltr" data-field="fr" placeholder="Bonjour">' + esc(p.fr || '') + '</textarea>' +
      '<div class="field-label-row"><span class="field-label" data-t="phraseAr"></span>' + lineControls('ar') + '</div>' +
      '<textarea class="textarea" data-field="ar" placeholder="مرحبا">' + esc(p.ar || '') + '</textarea>' +
      '<div class="field-label-row"><span class="field-label" data-t="phraseEn"></span>' + lineControls('en') + '</div>' +
      '<textarea class="textarea" dir="ltr" data-field="en" placeholder="Hello">' + esc(p.en || '') + '</textarea>' +
      '<div class="media-box" id="media-box-' + p.id + '">' +
        '<div class="media-placeholder" data-t="noMedia"></div>' +
        '<div class="media-btns">' +
          '<button class="btn ghost attach-media" data-t="attachMedia"></button>' +
          '<button class="btn danger remove-media hidden" data-t="removeMedia"></button>' +
        '</div>' +
      '</div>' +
      '<input type="file" class="file-input hidden" id="file-' + p.id + '" accept="image/*,video/*">';
    return card;
  }

  function bindEditorEvents(lesson) {
    document.getElementById('btn-add-phrase').onclick = function () { addPhrase(lesson); };
    document.getElementById('btn-bulk-add').onclick = function () { addBulkPhrases(lesson); };
    document.getElementById('btn-play-all').onclick = function () { playLesson(lesson); };
    document.getElementById('btn-stop-all').onclick = stopSpeech;

    var app = document.getElementById('app');
    app.oninput = function (e) {
      var target = e.target;
      if (target.dataset.field) {
        var phrase = lesson.phrases.filter(function (x) { return x.id === target.closest('.phrase-card').dataset.phraseId; })[0];
        if (phrase) { phrase[target.dataset.field] = target.value; queueSave(); }
      }
    };

    app.onclick = function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var card = btn.closest('.phrase-card');
      if (!card) return;
      var phraseId = card.dataset.phraseId;
      var phrase = lesson.phrases.filter(function (x) { return x.id === phraseId; })[0];
      if (!phrase) return;

      var lineLang = btn.dataset.lang;
      if (btn.classList.contains('speak-line')) {
        speakLine(phrase, lineLang, phraseId);
      } else if (btn.classList.contains('loop-line')) {
        toggleLoop(phrase, phraseId + ':' + lineLang, [lineLang]);
      } else if (btn.classList.contains('move-up')) {
        movePhrase(lesson, phraseId, -1);
      } else if (btn.classList.contains('move-down')) {
        movePhrase(lesson, phraseId, 1);
      } else if (btn.classList.contains('delete-phrase')) {
        if (confirm(t('deletePhraseConfirm'))) deletePhrase(lesson, phraseId);
      } else if (btn.classList.contains('attach-media')) {
        document.getElementById('file-' + phraseId).click();
      } else if (btn.classList.contains('remove-media')) {
        if (confirm(t('deleteMediaConfirm'))) {
          if (phrase.mediaId) { deleteMedia(phrase.mediaId); phrase.mediaId = null; phrase.mediaType = null; }
          saveCurrentLesson();
          renderMediaForPhrase(phrase);
        }
      }
    };

    app.onchange = function (e) {
      var target = e.target;
      if (target.classList.contains('file-input') && target.files && target.files[0]) {
        var card = target.closest('.phrase-card');
        var phrase = lesson.phrases.filter(function (x) { return x.id === card.dataset.phraseId; })[0];
        var file = target.files[0];
        var mediaId = uuid();
        if (phrase.mediaId) deleteMedia(phrase.mediaId);
        saveMedia(mediaId, file).then(function () {
          phrase.mediaId = mediaId;
          phrase.mediaType = file.type;
          saveCurrentLesson();
          renderMediaForPhrase(phrase);
        });
        target.value = '';
      }
    };
  }

  function renderMediaPreviews() {
    var lesson = getLesson(state.currentLessonId);
    if (!lesson) return;
    lesson.phrases.forEach(renderMediaForPhrase);
  }

  function renderMediaForPhrase(phrase) {
    var box = document.getElementById('media-box-' + phrase.id);
    if (!box) return;
    var placeholder = box.querySelector('.media-placeholder');
    var attach = box.querySelector('.attach-media');
    var remove = box.querySelector('.remove-media');
    var existing = box.querySelector('.media-preview');
    if (existing) existing.remove();

    if (!phrase.mediaId) {
      placeholder.classList.remove('hidden');
      remove.classList.add('hidden');
      box.classList.remove('has-media');
      return;
    }
    placeholder.classList.add('hidden');
    remove.classList.remove('hidden');
    box.classList.add('has-media');

    getMediaUrl(phrase.mediaId).then(function (url) {
      if (!url) return;
      var el;
      if (phrase.mediaType && phrase.mediaType.indexOf('video/') === 0) {
        el = document.createElement('video');
        el.controls = true;
        el.playsInline = true;
      } else {
        el = document.createElement('img');
      }
      el.className = 'media-preview';
      el.src = url;
      box.insertBefore(el, box.firstChild);
    });
  }

  /* ---------------- Speech ---------------- */

  var VOICE_LANG = { fr: 'fr-FR', ar: 'ar-SA', en: 'en-US' };
  var speechRun = 0;

  function nativeTTS() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) return window.Capacitor.Plugins.TextToSpeech;
    if (window.Capacitor && window.Capacitor.registerPlugin) {
      window.Capacitor.Plugins = window.Capacitor.Plugins || {};
      window.Capacitor.Plugins.TextToSpeech = window.Capacitor.registerPlugin('TextToSpeech');
      return window.Capacitor.Plugins.TextToSpeech;
    }
    return null;
  }

  function nativeSpeak(text, lang) {
    var tts = nativeTTS();
    if (!tts) return Promise.reject('no tts');
    return tts.speak({ text: text, lang: VOICE_LANG[lang] || 'en-US', rate: 1, queueStrategy: 1 });
  }

  function nativeStop() {
    var tts = nativeTTS(); if (!tts) return Promise.resolve(); return tts.stop();
  }

  function pickVoice(lang) {
    if (!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var code = VOICE_LANG[lang];
    var exact = voices.filter(function (v) { return v.lang && v.lang.replace(/_/g, '-') === code; })[0];
    if (exact) return exact;
    var prefix = code.split('-')[0];
    return voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; })[0] || null;
  }

  function utter(text, lang) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE_LANG[lang];
    u.rate = lang === 'fr' ? 0.95 : 1;
    var v = pickVoice(lang);
    if (v) u.voice = v;
    return u;
  }

  function handleBackButton() {
    if (state.view === 'lesson') { stopSpeech(); setView('lessons'); return; }
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      if (confirm(t('exitConfirm'))) window.Capacitor.Plugins.App.exitApp();
    }
  }

  function stopSpeech() {
    state.loopKey = null;
    speechRun++;
    if (nativeTTS()) nativeStop();
    else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.phrase-card').forEach(function (el) { el.classList.remove('playing'); });
    refreshLoopButtons();
  }

  function speakOnce(phrase, langs, key, onDone) {
    var seq = langs.filter(function (l) { return phrase[l]; });
    var i = 0;
    var run = ++speechRun;
    highlightPhrase(key, true);
    if (nativeTTS()) {
      nativeStop();
      (function next() {
        if (run !== speechRun) return;
        if (i >= seq.length) { highlightPhrase(key, false); if (onDone) onDone(); return; }
        var lang = seq[i++];
        nativeSpeak(phrase[lang], lang).then(function () {
          if (run !== speechRun) return;
          setTimeout(next, 300);
        }).catch(function () {
          if (run !== speechRun) return;
          setTimeout(next, 300);
        });
      })();
      return;
    }
    if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
    window.speechSynthesis.cancel();
    (function next() {
      if (run !== speechRun) return;
      if (i >= seq.length) { highlightPhrase(key, false); if (onDone) onDone(); return; }
      var lang = seq[i++];
      var u = utter(phrase[lang], lang);
      u.onend = function () { if (run !== speechRun) return; setTimeout(next, 300); };
      u.onerror = function () { if (run !== speechRun) return; setTimeout(next, 300); };
      window.speechSynthesis.speak(u);
    })();
  }

  function speakLine(phrase, lang, key) {
    if (!phrase[lang]) return;
    stopSpeech();
    speakOnce(phrase, [lang], key || phrase.id);
  }

  function toggleLoop(phrase, key, langs) {
    if (state.loopKey === key) { stopSpeech(); return; }
    state.loopKey = key;
    refreshLoopButtons();
    (function cycle() {
      if (state.loopKey !== key) return;
      speakOnce(phrase, langs || ['fr', 'ar', 'en'], key, function () {
        if (state.loopKey !== key) return;
        setTimeout(cycle, 700);
      });
    })();
  }

  function playLesson(lesson) {
    stopSpeech();
    var i = 0;
    var runKey = 'lesson:' + lesson.id;
    state.loopKey = runKey;
    refreshLoopButtons();
    (function next() {
      if (state.loopKey !== runKey) return;
      if (i >= lesson.phrases.length) { stopSpeech(); return; }
      var p = lesson.phrases[i];
      i++;
      var card = document.querySelector('.phrase-card[data-phrase-id="' + p.id + '"]');
      if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
      speakOnce(p, ['fr', 'ar', 'en'], p.id, function () {
        if (state.loopKey !== runKey) return;
        setTimeout(next, 400);
      });
    })();
  }

  function highlightPhrase(key, on) {
    var phraseId = String(key).split(':')[0];
    var card = document.querySelector('.phrase-card[data-phrase-id="' + phraseId + '"]');
    if (card) card.classList.toggle('playing', on);
  }

  function refreshLoopButtons() {
    document.querySelectorAll('.loop-btn, .loop-line').forEach(function (btn) {
      var card = btn.closest('.phrase-card');
      if (!card) return;
      var key = card.dataset.phraseId;
      if (btn.dataset.lang) key += ':' + btn.dataset.lang;
      var on = state.loopKey === key;
      if (btn.classList.contains('loop-line')) {
        btn.textContent = on ? '⏹' : '🔁';
      } else {
        btn.textContent = on ? t('stop') : t('loop');
      }
      btn.classList.toggle('active', !!on);
    });
  }

  /* ---------------- Import / Export ---------------- */

  function exportData() {
    var out = { lessons: [] };
    var pending = 0;
    function finish() {
      var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'motsy-lessons.json';
      a.click();
      URL.revokeObjectURL(url);
    }
    state.lessons.forEach(function (lesson) {
      var l = JSON.parse(JSON.stringify(lesson));
      out.lessons.push(l);
      if (l.phrases) {
        l.phrases.forEach(function (p) {
          if (p.mediaId) {
            pending++;
            dbGet('media', p.mediaId).then(function (m) {
              if (m) {
                var reader = new FileReader();
                reader.onloadend = function () {
                  p.mediaBase64 = reader.result;
                  p.mediaType = m.type;
                  pending--;
                  if (pending === 0) finish();
                };
                reader.readAsDataURL(m.blob);
              } else {
                pending--;
                if (pending === 0) finish();
              }
            });
          }
        });
      }
    });
    if (pending === 0) finish();
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.lessons)) { throw new Error('invalid'); }
        state.lessons = [];
        var pending = 0;
        data.lessons.forEach(function (l) {
          l.id = uuid();
          if (l.phrases) {
            l.phrases.forEach(function (p) {
              p.id = uuid();
              if (p.mediaBase64) {
                pending++;
                var mediaId = uuid();
                var blob = dataURLToBlob(p.mediaBase64);
                p.mediaId = mediaId;
                p.mediaType = p.mediaType || blob.type;
                saveMedia(mediaId, blob).then(function () {
                  pending--;
                  if (pending === 0) importSave();
                });
                delete p.mediaBase64;
              }
            });
          }
          state.lessons.push(l);
          dbPut('lessons', l);
        });
        if (pending === 0) importSave();
      } catch (e) {
        toast('Import failed');
      }
    };
    reader.readAsText(file);
  }

  function importSave() {
    toast(t('saved'));
    renderLessonList();
  }

  /* ---------------- Init ---------------- */

  function init() {
    applyTheme();
    setUILang(state.uiLang);

    document.getElementById('btn-theme').onclick = function () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
    };

    document.querySelectorAll('.lang-btn').forEach(function (b) {
      b.onclick = function () { setUILang(b.dataset.lang); };
    });

    document.getElementById('btn-export').onclick = exportData;
    var importInput = document.getElementById('import-file');
    document.getElementById('btn-import').onclick = function () { importInput.click(); };
    importInput.onchange = function () { if (importInput.files && importInput.files[0]) importData(importInput.files[0]); importInput.value = ''; };

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = function () {};
      window.speechSynthesis.getVoices();
    }

    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      window.Capacitor.Plugins.App.addListener('backButton', handleBackButton);
    }

    window.onbeforeunload = function () {
      return t('exitConfirm');
    };
  }

  dbReady.then(function () {
    return loadLessons();
  }).then(function () {
    init();
    render();
  }).catch(function (e) {
    console.error('init error', e);
    document.getElementById('app').innerHTML = '<div class="empty">Failed to load database.</div>';
  });

})();
</script>
