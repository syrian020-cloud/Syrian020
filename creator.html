  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ---------------- IndexedDB ---------------- */

  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = function () { reject(req.error); };
      req.onsuccess = function () { db = req.result; resolve(db); };
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('lessons')) d.createObjectStore('lessons', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('folders')) d.createObjectStore('folders', { keyPath: 'id' });
      };
    });
  }

  function txStore(store, mode) {
    return db.transaction([store], mode).objectStore(store);
  }

  function dbPut(store, obj) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readwrite').put(obj);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbGet(store, id) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readonly').get(id);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbDel(store, id) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readwrite').delete(id);
      req.onsuccess = function () { resolve(); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbGetAll(store) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readonly').getAll();
      req.onsuccess = function () { resolve(req.result || []); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function uuid() {
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }

  /* ---------------- State & persistence ---------------- */

  function loadLessons() {
    return dbGetAll('lessons').then(function (list) {
      state.lessons = list || [];
    });
  }

  function loadFolders() {
    return dbGetAll('folders').then(function (list) {
      state.folders = list || [];
    });
  }

  function getLesson(id) {
    return state.lessons.filter(function (l) { return l.id === id; })[0];
  }

  function getFolder(id) {
    return state.folders.filter(function (f) { return f.id === id; })[0];
  }

  function saveExpandedFolders() {
    localStorage.setItem('creator_expanded_folders', JSON.stringify(state.expandedFolders));
  }

  function addFolder() {
    var name = prompt(t('folderNamePrompt') || 'Folder name');
    if (!name) return;
    name = name.trim();
    if (!name) return;
    var folder = { id: uuid(), name: { ar: name, fr: name, en: name }, createdAt: Date.now() };
    state.folders.push(folder);
    state.expandedFolders[folder.id] = true;
    saveExpandedFolders();
    dbPut('folders', folder).then(render);
  }

  function renameFolder(id) {
    var folder = getFolder(id);
    if (!folder) return;
    var current = folder.name[state.uiLang] || folder.name.en || folder.name.fr || folder.name.ar || '';
    var name = prompt(t('renameFolder') || 'Rename folder', current);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    folder.name = { ar: name, fr: name, en: name };
    dbPut('folders', folder).then(render);
  }

  function deleteFolder(id) {
    var folder = getFolder(id);
    if (!folder) return;
    if (!confirm(t('deleteFolderConfirm') || 'Delete folder?')) return;
    state.lessons.forEach(function (l) { if (l.folderId === id) { l.folderId = null; dbPut('lessons', l); } });
    state.folders = state.folders.filter(function (f) { return f.id !== id; });
    delete state.expandedFolders[id];
    saveExpandedFolders();
    dbDel('folders', id).then(render);
  }

  function setLessonFolder(lessonId, folderId) {
    var lesson = getLesson(lessonId);
    if (!lesson) return;
    lesson.folderId = folderId || null;
    if (folderId) state.expandedFolders[folderId] = true;
    saveExpandedFolders();
    dbPut('lessons', lesson).then(render);
  }

  function queueSave() {
    if (state.saveTimer) clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(saveCurrentLesson, 400);
  }

  function saveCurrentLesson() {
    var lesson = getLesson(state.currentLessonId);
    if (!lesson) return;
    dbPut('lessons', lesson).catch(function (e) { console.error('save failed', e); });
  }

  function addLesson() {
    var lesson = {
      id: uuid(),
      title: { ar: '', fr: '', en: '' },
      phrases: []
    };
    state.lessons.push(lesson);
    dbPut('lessons', lesson).then(function () {
      openLesson(lesson.id);
    });
  }

  function deleteLesson(id) {
    var lesson = getLesson(id);
    if (!lesson) return;
    if (lesson.phrases) {
      lesson.phrases.forEach(function (p) { if (p.mediaId) deleteMedia(p.mediaId); });
    }
    if (lesson.coverMediaId) deleteMedia(lesson.coverMediaId);
    if (lesson.videoMediaId) deleteMedia(lesson.videoMediaId);
    state.lessons = state.lessons.filter(function (l) { return l.id !== id; });
    dbDel('lessons', id).then(render);
  }

  function editLessonName(id) {
    var lesson = getLesson(id);
    if (!lesson) return;
    var first = lesson.phrases && lesson.phrases[0];
    var current = lesson.title[state.uiLang] || lesson.title.en || lesson.title.fr || lesson.title.ar ||
      (first && (first[state.uiLang] || first.fr || first.ar || first.en)) || '';
    var name = prompt(t('editLesson'), current);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    lesson.title = { ar: name, fr: name, en: name };
    dbPut('lessons', lesson).then(render);
  }

  function attachCoverImage(id, file) {
    var lesson = getLesson(id);
    if (!lesson || !file) return;
    var mediaId = uuid();
    if (lesson.coverMediaId) deleteMedia(lesson.coverMediaId);
    saveMedia(mediaId, file).then(function () {
      lesson.coverMediaId = mediaId;
      dbPut('lessons', lesson).then(render);
    });
  }

  function attachFolderCover(id, file) {
    var folder = getFolder(id);
    if (!folder || !file) return;
    var mediaId = uuid();
    if (folder.coverMediaId) deleteMedia(folder.coverMediaId);
    saveMedia(mediaId, file).then(function () {
      folder.coverMediaId = mediaId;
      dbPut('folders', folder).then(render);
    });
  }

  function addPhrase(lesson) {
    lesson.phrases.push({ id: uuid(), fr: '', ar: '', en: '', editing: true });
    saveCurrentLesson();
    renderLessonEditor();
  }

  function addBulkPhrases(lesson, inputId) {
    var el = document.getElementById(inputId || 'bulk-input');
    if (!el) return;
    var text = el.value || '';
    var timedEntries = [];
    if (text.indexOf('-->') !== -1) timedEntries = timedEntries.concat(parseSRT(text));
    timedEntries = timedEntries.concat(parseTimedText(text));
    var normalEntries = [];
    text.split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) return;
      if (/^[\d:.،,]+\s/.test(line)) return;
      var parts = line.split('|');
      if (parts.length < 3) return;
      normalEntries.push({ fr: parts[0].trim(), ar: parts[1].trim(), en: parts[2].trim() });
    });
    timedEntries.forEach(function (e) { if (typeof e.end !== 'number' || isNaN(e.end)) e.end = e.start + 4; });
    var entries = timedEntries.concat(normalEntries);
    if (!entries.length) {
      toast(t('noBulkPhrases') || 'No valid phrases');
      return;
    }
    entries.forEach(function (p) {
      lesson.phrases.push({ id: uuid(), fr: p.fr || '', ar: p.ar || '', en: p.en || '', start: p.start, end: p.end, editing: false });
    });
    if (timedEntries.length) {
      lesson.transcript = (lesson.transcript || []).concat(timedEntries);
    }
    saveCurrentLesson();
    renderLessonEditor();
    el.value = '';
  }

  function deletePhrase(lesson, phraseId) {
    var p = lesson.phrases.filter(function (x) { return x.id === phraseId; })[0];
    if (p && p.mediaId) deleteMedia(p.mediaId);
    lesson.phrases = lesson.phrases.filter(function (x) { return x.id !== phraseId; });
    saveCurrentLesson();
    renderLessonEditor();
  }

  function movePhrase(lesson, phraseId, dir) {
    var idx = lesson.phrases.findIndex(function (x) { return x.id === phraseId; });
    if (idx === -1) return;
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= lesson.phrases.length) return;
    var tmp = lesson.phrases[idx];
    lesson.phrases[idx] = lesson.phrases[newIdx];
    lesson.phrases[newIdx] = tmp;
    saveCurrentLesson();
    renderLessonEditor();
  }

  function saveMedia(mediaId, file) {
    return dbPut('media', { id: mediaId, blob: file, type: file.type });
  }

  function deleteMedia(mediaId) {
    if (state.mediaUrls[mediaId]) { URL.revokeObjectURL(state.mediaUrls[mediaId]); delete state.mediaUrls[mediaId]; }
    return dbDel('media', mediaId);
  }

  function getMediaUrl(mediaId) {
    if (state.mediaUrls[mediaId]) return Promise.resolve(state.mediaUrls[mediaId]);
    return dbGet('media', mediaId).then(function (m) {
      if (!m) return null;
      var url = URL.createObjectURL(m.blob);
      state.mediaUrls[mediaId] = url;
      return url;
    });
  }

  function dataURLToBlob(dataURL) {
    var parts = dataURL.split(',');
    var base64 = parts[1];
    var mime = parts[0].match(/:(.*?);/)[1];
    var bin = atob(base64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  function fullyDecode(v) {
    if (v == null) return v;
    for (var i = 0; i < 5; i++) {
      if (v.indexOf('%') === -1) break;
      try {
        var d = decodeURIComponent(v);
        if (d === v) break;
        v = d;
      } catch (e) { break; }
    }
    return v;
  }

  function getParam(url, name) {
    try {
      var u = new URL(url);
      return u.searchParams.get(name);
    } catch (e) { return null; }
  }

  function resolveMediaUrl(input) {
    return new Promise(function (resolve, reject) {
      var direct = getParam(input, 'imgurl');
      if (direct) { resolve(fullyDecode(direct)); return; }
      var needsResolve = /^(https?:\/\/)?(share\.google\/|g\.co\/|www\.google\.com\/imgres|www\.google\.com\/share\.google)/i.test(input);
      if (!needsResolve) { resolve(input); return; }

      var http = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
      function webFollow(u) {
        return fetch(u, { redirect: 'follow' }).then(function (r) { return r.url; });
      }
      function nativeFollow(u) {
        return http.get({ url: u, responseType: 'text' }).then(function (r) { return r.url || u; });
      }
      var follow = http ? nativeFollow : webFollow;
      follow(input)
        .then(function (finalUrl) {
          var img = finalUrl && getParam(finalUrl, 'imgurl');
          resolve(img ? fullyDecode(img) : input);
        })
        .catch(function (err) { reject(err); });
    });
  }

  function fetchMediaBlob(url) {
    return new Promise(function (resolve, reject) {
      var http = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
      if (http) {
        http.get({ url: url, responseType: 'blob' })
          .then(function (res) {
            var ct = (res.headers && (res.headers['content-type'] || res.headers['Content-Type'])) || 'application/octet-stream';
            if (typeof res.data === 'string') {
              resolve(dataURLToBlob('data:' + ct + ';base64,' + res.data));
            } else if (res.data instanceof Blob) {
              resolve(res.data);
            } else if (res.data && res.data.byteLength !== undefined) {
              resolve(new Blob([res.data], { type: ct }));
            } else {
              reject(new Error('Unexpected response'));
            }
          })
          .catch(reject);
        return;
      }
      function tryFetch(u) {
        return fetch(u).then(function (r) { if (!r.ok) throw new Error('fetch failed'); return r.blob(); });
      }
      tryFetch(url)
        .then(resolve)
        .catch(function () {
          tryFetch('https://corsproxy.io/?' + encodeURIComponent(url))
            .then(resolve)
            .catch(reject);
        });
    });
  }

  function downloadMediaForPhrase(phrase, url) {
    resolveMediaUrl(url)
      .then(fetchMediaBlob)
      .then(function (blob) {
        var mediaId = uuid();
        if (phrase.mediaId) deleteMedia(phrase.mediaId);
        return saveMedia(mediaId, blob).then(function () {
          phrase.mediaId = mediaId;
          phrase.mediaType = blob.type;
          saveCurrentLesson();
          renderMediaForPhrase(phrase);
          toast(t('saved'));
        });
      })
      .catch(function (e) {
        console.error('Media download failed', e);
        toast(t('mediaDownloadFailed'));
      });
  }

  function formatTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    var ms = Math.floor((s % 1) * 1000);
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec + '.' + (ms < 100 ? '0' : '') + (ms < 10 ? '0' : '') + ms;
  }

  function setVideoRate(rate) {
    var r = rate || 1;
    document.querySelectorAll('video').forEach(function (v) { v.playbackRate = r; });
  }

  function subtitleBgOptions(lesson) {
    var current = state.appBg || 0;
    var html = '';
    for (var i = 0; i < 10; i++) {
      html += '<option value="' + i + '"' + (current === i ? ' selected' : '') + '>' + esc(t('bg' + i)) + '</option>';
    }
    return html;
  }

  function subtitleFontOptions(lesson) {
    var current = state.appFont || 0;
    var html = '';
    for (var i = 0; i < 9; i++) {
      html += '<option value="' + i + '"' + (current === i ? ' selected' : '') + '>' + esc(t('font' + i)) + '</option>';
    }
    return html;
  }

  function applyAppTheme() {
    var app = document.getElementById('app');
    if (app) {
      for (var i = 0; i < 10; i++) app.classList.remove('theme-' + i);
    }
    for (var j = 0; j < 11; j++) document.body.classList.remove('app-font-' + j);
    document.body.classList.add('app-font-' + (state.appFont || 0));
    var overlay = document.getElementById('video-subtitle');
    if (overlay) {
      for (var k = 0; k < 10; k++) overlay.classList.remove('bg-' + k);
      for (var f = 0; f < 11; f++) overlay.classList.remove('font-' + f);
      overlay.classList.add('bg-' + (state.appBg || 0), 'font-' + (state.appFont || 0));
    }
  }

  function parseTimeToSeconds(str) {
    if (typeof str !== 'string' || !str.trim()) return null;
    str = str.trim().replace(',', '.').replace('،', '.');
    var parts = str.split(':').map(Number);
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    if (parts.length === 1) return parts[0];
    return null;
  }

  function parseTimedText(text) {
    var lines = (text || '').split(/\r?\n/);
    var entries = [];
    lines.forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var m = line.match(/^([\d:.،,]+)\s+(.+)$/);
      if (!m) return;
      var start = parseTimeToSeconds(m[1]);
      if (start === null || isNaN(start)) return;
      var parts = m[2].split('|').map(function (s) { return s.trim(); });
      var fr = parts[0] || '';
      var ar = parts[1] || '';
      var en = parts[2] || '';
      entries.push({ id: uuid(), start: start, end: start + 2, fr: fr, ar: ar, en: en });
    });
    for (var i = 0; i < entries.length - 1; i++) {
      entries[i].end = Math.min(entries[i + 1].start - 0.05, entries[i].start + 4);
    }
    return entries;
  }

  function parseSRT(text) {
    var blocks = (text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
    var entries = [];
    blocks.forEach(function (block) {
      var lines = block.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      if (lines.length < 2) return;
      var timeLine = '';
      var textStart = 1;
      for (var i = 0; i < lines.length; i++) {
        if (lines[i].indexOf('-->') !== -1) { timeLine = lines[i]; textStart = i + 1; break; }
      }
      if (!timeLine) return;
      var match = timeLine.match(/([\d:.،,]+)\s*-->\s*([\d:.،,]+)/);
      if (!match) return;
      var start = parseTimeToSeconds(match[1]);
      var end = parseTimeToSeconds(match[2]);
      if (start === null || end === null) return;
      var body = lines.slice(textStart).join(' ');
      var parts = body.split('|').map(function (s) { return s.trim(); });
      var fr = parts[0] || '';
      var ar = parts[1] || '';
      var en = parts[2] || '';
      entries.push({ id: uuid(), start: start, end: end, fr: fr, ar: ar, en: en });
    });
    return entries;
  }

  function parseSubtitles(text) {
    if (!text || !text.trim()) return [];
    if (text.indexOf('-->') !== -1) return parseSRT(text);
    return parseTimedText(text);
  }

  function openDraw(phrase) {
    closeDraw();
    var overlay = document.createElement('div');
    overlay.className = 'draw-overlay';
    overlay.id = 'draw-overlay';
    overlay.innerHTML =
      '<div class="draw-header">' +
        '<button class="icon-btn" id="draw-close" data-t-title="back">' + icon('back') + '</button>' +
        '<h2>' + esc(t('drawPhrase')) + '</h2>' +
        '<div class="draw-tools">' +
          '<button class="icon-btn active" id="draw-pen" data-t-title="pen">' + icon('edit') + '</button>' +
          '<button class="icon-btn" id="draw-eraser" data-t-title="eraser">' + icon('close') + '</button>' +
          '<input type="color" id="draw-color" value="#0f172a" data-t-title="pen">' +
          '<input type="range" id="draw-size" min="1" max="30" value="4" data-t-title="brushSize">' +
          '<button class="icon-btn" id="draw-clear" data-t-title="clear">' + icon('trash') + '</button>' +
          '<button class="icon-btn" id="draw-save" data-t-title="saveDrawing">' + icon('export') + '</button>' +
        '</div>' +
      '</div>' +
      (phrase
        ? '<div class="draw-reference"><div class="draw-reference-row">' +
            '<div class="draw-ref">' + esc(phrase.fr || '') + '</div>' +
            '<div class="draw-ref ar">' + esc(phrase.ar || '') + '</div>' +
            '<div class="draw-ref">' + esc(phrase.en || '') + '</div>' +
          '</div></div>'
        : '') +
      '<div class="draw-canvas-wrap"><canvas class="draw-canvas" id="draw-canvas"></canvas></div>';
    document.body.appendChild(overlay);
    applyTranslations();

    var canvas = document.getElementById('draw-canvas');
    var wrap = canvas.parentNode;
    var ctx = canvas.getContext('2d');
    var drawing = false;
    var isEraser = false;

    function fitCanvas() {
      var rect = wrap.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Number(document.getElementById('draw-size').value);
      ctx.strokeStyle = document.getElementById('draw-color').value;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    fitCanvas();

    function getPos(e) {
      var rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startDraw(e) {
      e.preventDefault();
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      var p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    function moveDraw(e) {
      if (!drawing) return;
      e.preventDefault();
      var p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    function endDraw(e) {
      if (!drawing) return;
      drawing = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (ex) {}
      ctx.beginPath();
    }

    canvas.addEventListener('pointerdown', startDraw);
    canvas.addEventListener('pointermove', moveDraw);
    canvas.addEventListener('pointerup', endDraw);
    canvas.addEventListener('pointerleave', endDraw);

    function updateTool() {
      var penBtn = document.getElementById('draw-pen');
      var eraserBtn = document.getElementById('draw-eraser');
      if (penBtn) penBtn.classList.toggle('active', !isEraser);
      if (eraserBtn) eraserBtn.classList.toggle('active', isEraser);
      ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
    }

    document.getElementById('draw-pen').onclick = function () { isEraser = false; updateTool(); };
    document.getElementById('draw-eraser').onclick = function () { isEraser = true; updateTool(); };

    var colorInput = document.getElementById('draw-color');
    colorInput.oninput = function () {
      isEraser = false;
      ctx.strokeStyle = colorInput.value;
      updateTool();
    };

    var sizeInput = document.getElementById('draw-size');
    sizeInput.oninput = function () { ctx.lineWidth = Number(sizeInput.value); };

    document.getElementById('draw-clear').onclick = function () {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      updateTool();
    };

    document.getElementById('draw-save').onclick = function () {
      var temp = document.createElement('canvas');
      temp.width = canvas.width;
      temp.height = canvas.height;
      var tctx = temp.getContext('2d');
      tctx.fillStyle = '#fff';
      tctx.fillRect(0, 0, temp.width, temp.height);
      tctx.drawImage(canvas, 0, 0);
      var dataURL = temp.toDataURL('image/png');
      var blob = dataURLToBlob(dataURL);
      var filename = 'vocapic-drawing-' + Date.now() + '.png';
      downloadFile(blob, filename);
      toast(t('saved'));
    };

    document.getElementById('draw-close').onclick = closeDraw;

    window.addEventListener('resize', function () {
      var image = ctx.getImageData(0, 0, canvas.width, canvas.height);
      fitCanvas();
      ctx.putImageData(image, 0, 0);
    }, { once: true });
  }

  /* ---------------- UI helpers ---------------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function stripPunct(w) {
    return w.replace(/^[^a-zA-Z0-9\u0600-\u06FF]+|[^a-zA-Z0-9\u0600-\u06FF]+$/g, '');
  }

  function wordSpans(text, lang, phraseId) {
    var s = String(text || '').trim();
    if (!s) return '<span class="word-placeholder" data-lang="' + lang + '">—</span>';
    return s.split(/\s+/).map(function (w, i) {
      var clean = stripPunct(w);
      var key = phraseId + ':' + lang + ':' + clean;
      return clean
        ? '<span class="word" data-lang="' + lang + '" data-word="' + esc(clean) + '" data-loop-key="' + esc(key) + '">' + esc(w) + '</span>'
        : '<span>' + esc(w) + '</span>';
    }).join(' ');
  }

  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2000);
  }

  function applyTranslations() {
    document.title = t('appName');
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var key = el.dataset.t;
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = t(key);
      else el.textContent = t(key);
    });
    document.querySelectorAll('[data-t-title]').forEach(function (el) { el.title = t(el.dataset.tTitle); });

  function setView(name, lessonId) {
    state.view = name;
    state.currentLessonId = lessonId || null;
    if (name !== 'folder') state.currentFolderId = null;
    render();
  }

  function openLesson(id) {
    state.view = 'lesson';
    state.currentLessonId = id;
    render();
  }

  function openFolder(id) {
    state.view = 'folder';
    state.currentFolderId = id;
    render();
  }

  /* ---------------- Rendering ---------------- */

  function render() {
    if (state.view === 'lesson') renderLessonEditor();
    else if (state.view === 'folder') renderFolder();
    else renderLessonList();
    applyAppTheme();

  function renderLessonCard(l, i) {
    var first = l.phrases && l.phrases[0];
    var title = esc(l.title[state.uiLang] || l.title.en || l.title.fr || l.title.ar ||
      (first && (first[state.uiLang] || first.fr || first.ar || first.en)) ||
      t('lesson') + ' ' + (i + 1));

    return '<div class="card lesson-card" data-lesson="' + l.id + '">' +
      '<div class="lesson-cover"' + coverAttr + '>' + icon('lesson') + '</div>' +
      '<div class="body"><div class="card-title">' + title + '</div>' +
      '<div class="card-sub">' + l.phrases.length + ' ' + t('phrases') + '</div></div>' +
      '<div class="lesson-menu">' +
        '<button class="icon-btn menu-btn" data-t-title="more">' + icon('more') + '</button>' +

          '<button class="dropdown-item move-folder" data-t="moveToFolder">' + icon('folder') + ' <span data-t="moveToFolder"></span></button>' +

  function folderMoveOptions(lessonId) {
    var lesson = getLesson(lessonId);

    state.folders.forEach(function (f) {
      opts += '<button class="dropdown-item move-to-folder" data-folder="' + f.id + '">' + (current === f.id ? '✓ ' : '') + esc(f.name[state.uiLang] || f.name.en || f.name.fr || f.name.ar) + '</button>';
    });
    return opts;
  }

  function renderFolderCard(f) {
    var count = state.lessons.filter(function (l) { return l.folderId === f.id; }).length;
    var coverAttr = f.coverMediaId ? ' data-cover="' + f.coverMediaId + '"' : '';
    return '<div class="card folder" data-folder="' + f.id + '">' +
      '<div class="folder-cover"' + coverAttr + '>' + icon('folder') + '</div>' +
      '<div class="body"><div class="card-title">' + esc(f.name[state.uiLang] || f.name.en || f.name.fr || f.name.ar) + '</div>' +

        '<button class="icon-btn folder-menu-btn" data-t-title="more">' + icon('more') + '</button>' +
        '<div class="dropdown hidden">' +
          '<button class="dropdown-item rename-folder">' + iconText('renameFolder', 'edit') + '</button>' +
          '<button class="dropdown-item attach-folder-cover">' + iconText('attachCover', 'image') + '</button>' +
          '<button class="dropdown-item delete-folder danger">' + iconText('deleteFolder', 'trash') + '</button>' +

  function renderLessonList() {
    var app = document.getElementById('app');
    var html = '<div class="hero"><h1 data-t="appName"></h1><p data-t="subtitle"></p></div>' +
      '<div class="btn-row">' +
        '<button class="btn" id="add-lesson">' + iconText('addLesson', 'plus') + '</button>' +
        '<button class="btn ghost" id="add-folder">' + iconText('addFolder', 'folder') + '</button>' +
      '</div>';

    if (!state.lessons.length && !state.folders.length) {
      html += '<div class="empty" data-t="noLessons"></div>';
    } else {
      html += state.folders.map(renderFolderCard).join('');
      var ungrouped = state.lessons.filter(function (l) { return !l.folderId; });
      if (ungrouped.length) {
        html += '<div class="section-label" data-t="noFolder"></div>' + ungrouped.map(function (l, i) { return renderLessonCard(l, i); }).join('');
      }
      html += '<input type="file" id="cover-input" accept="image/*" class="hidden">';
    }
    app.innerHTML = html;
    renderLessonCovers();
    renderFolderCovers();
    bindListEvents();
    applyTranslations();
  }

  function renderFolder() {
    var app = document.getElementById('app');
    var folder = getFolder(state.currentFolderId);
    if (!folder) { setView('lessons'); return; }
    var folderLessons = state.lessons.filter(function (l) { return l.folderId === folder.id; });
    var coverAttr = folder.coverMediaId ? ' data-cover="' + folder.coverMediaId + '"' : '';
    var html = '<div class="hero"><h1 data-t="appName"></h1><p>' + esc(folder.name[state.uiLang] || folder.name.en || folder.name.fr || folder.name.ar) + ' · ' + folderLessons.length + ' ' + t('lesson') + '</p></div>' +
      '<div class="btn-row">' +
        '<button class="btn ghost" id="btn-back-folder">' + iconText('back', 'back') + '</button>' +
        '<button class="btn" id="add-lesson-folder">' + iconText('addLesson', 'plus') + '</button>' +
        '<div class="lesson-menu" style="margin-inline-start:auto">' +
          '<button class="icon-btn menu-btn" data-t-title="more">' + icon('more') + '</button>' +
          '<div class="dropdown hidden">' +
            '<button class="dropdown-item rename-folder" data-folder="' + folder.id + '">' + iconText('renameFolder', 'edit') + '</button>' +
            '<button class="dropdown-item attach-folder-cover" data-folder="' + folder.id + '">' + iconText('attachCover', 'image') + '</button>' +
            '<button class="dropdown-item delete-folder danger" data-folder="' + folder.id + '">' + iconText('deleteFolder', 'trash') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

      html += '<div class="empty" data-t="noLessons"></div>';

  function renderFolderCovers() {

        if (url) el.innerHTML = '<img src="' + url + '" alt="">';
      });

  function renderLessonCovers() {
    document.querySelectorAll('.lesson-cover[data-cover]').forEach(function (el) {
      var mediaId = el.dataset.cover;
      getMediaUrl(mediaId).then(function (url) {
        if (url) el.innerHTML = '<img src="' + url + '" alt="">';
      });

  function closeAllDropdowns() {
    document.querySelectorAll('.dropdown').forEach(function (d) { d.classList.add('hidden'); });
    document.querySelectorAll('.lesson-card.menu-open, .folder.menu-open').forEach(function (c) { c.classList.remove('menu-open'); });
  }

  function bindListEvents() {
    var addLessonBtn = document.getElementById('add-lesson');
    if (addLessonBtn) addLessonBtn.onclick = addLesson;
    var addFolderBtn = document.getElementById('add-folder');
    if (addFolderBtn) addFolderBtn.onclick = addFolder;

    document.querySelectorAll('.lesson-card').forEach(function (c) {
      c.onclick = function (e) {
        if (e.target.closest('.lesson-menu')) return;
        openLesson(c.dataset.lesson);
      };
    });
    document.querySelectorAll('.menu-btn').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var dropdown = b.closest('.lesson-menu').querySelector('.dropdown');
        var wasHidden = dropdown.classList.contains('hidden');
        var card = b.closest('.lesson-card') || b.closest('.folder');
        closeAllDropdowns();
        if (wasHidden) {
          dropdown.classList.remove('hidden');
          if (card) card.classList.add('menu-open');
        }
      };
    });
    document.querySelectorAll('.edit-lesson').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        editLessonName(b.closest('.lesson-card').dataset.lesson);
        closeAllDropdowns();
      };
    });
    document.querySelectorAll('.attach-cover').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var input = document.getElementById('cover-input');
        if (input) {
          input.dataset.lesson = b.closest('.lesson-card').dataset.lesson;
          input.click();
        }
        closeAllDropdowns();
      };
    });
    document.querySelectorAll('.delete-lesson').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        if (confirm(t('deleteConfirm'))) deleteLesson(b.closest('.lesson-card').dataset.lesson);
        closeAllDropdowns();
      };
    });
    document.querySelectorAll('.move-folder').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var lessonId = b.closest('.lesson-card').dataset.lesson;
        var dropdown = b.closest('.dropdown');
        dropdown.innerHTML = folderMoveOptions(lessonId);
        dropdown.classList.remove('hidden');
        applyTranslations();
        bindMoveToFolder();
      };
    });

    document.querySelectorAll('.folder').forEach(function (folderEl) {
      folderEl.onclick = function (e) {
        if (e.target.closest('.lesson-menu') || e.target.closest('button')) return;
        openFolder(folderEl.dataset.folder);
      };
    });
    document.querySelectorAll('.folder-menu-btn').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var dropdown = b.closest('.lesson-menu').querySelector('.dropdown');
        var wasHidden = dropdown.classList.contains('hidden');
        var card = b.closest('.folder');
        closeAllDropdowns();
        if (wasHidden) {
          dropdown.classList.remove('hidden');
          if (card) card.classList.add('menu-open');
        }
      };
    });
    document.querySelectorAll('.rename-folder').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var fid = b.dataset.folder || b.closest('.folder').dataset.folder;
        renameFolder(fid);
        closeAllDropdowns();
      };
    });
    document.querySelectorAll('.delete-folder').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var fid = b.dataset.folder || b.closest('.folder').dataset.folder;
        deleteFolder(fid);
        closeAllDropdowns();
      };
    });
    document.querySelectorAll('.attach-folder-cover').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var input = document.getElementById('cover-input');
        if (input) {
          input.dataset.folder = b.dataset.folder || b.closest('.folder').dataset.folder;
          input.click();
        }
        closeAllDropdowns();
      };
    });

    var coverInput = document.getElementById('cover-input');
    if (coverInput) {
      coverInput.onchange = function (e) {
        if (e.target.files && e.target.files[0]) {
          if (e.target.dataset.lesson) attachCoverImage(e.target.dataset.lesson, e.target.files[0]);
          if (e.target.dataset.folder) attachFolderCover(e.target.dataset.folder, e.target.files[0]);
          e.target.value = '';
          delete e.target.dataset.lesson;
          delete e.target.dataset.folder;
        }
      };
    }
    if (!window.__dropdownCloser) {
      window.__dropdownCloser = true;
      document.addEventListener('click', closeAllDropdowns);
    }
  }

  function bindFolderViewEvents(folder) {
    var backBtn = document.getElementById('btn-back-folder');
    if (backBtn) backBtn.onclick = function () { setView('lessons'); };
    var addLessonFolderBtn = document.getElementById('add-lesson-folder');
    if (addLessonFolderBtn) addLessonFolderBtn.onclick = function () {
      var lesson = { id: uuid(), title: { ar: '', fr: '', en: '' }, phrases: [], folderId: folder.id };
      state.lessons.push(lesson);
      dbPut('lessons', lesson).then(function () { openLesson(lesson.id); });
    };
  }

  function bindMoveToFolder() {
    document.querySelectorAll('.move-to-folder').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var lessonId = b.closest('.lesson-card').dataset.lesson;
        var folderId = b.dataset.folder || null;
        setLessonFolder(lessonId, folderId);
      };
    });

  function bulkCardHTML(inputId, btnId) {

    app.onclick = function (e) {
      var wordEl = e.target.closest('.word');
      if (wordEl) {

        var phraseId = card.dataset.phraseId;

        var word = wordEl.dataset.word;
        if (!word) return;
        toggleWordLoop(word, lang, phraseId + ':' + lang + ':' + word);

      var lineEl = e.target.closest('.phrase-line');
      if (lineEl && !e.target.closest('button')) {
        var lineCard = lineEl.closest('.phrase-card');
        if (lineCard) {
          var linePhraseId = lineCard.dataset.phraseId;
          var linePhrase = lesson.phrases.filter(function (x) { return x.id === linePhraseId; })[0];
          var lineLang = lineEl.dataset.lang;
          if (linePhrase && lineLang) speakLine(linePhrase, lineLang, linePhraseId);

      if (!btn) return;
      if (btn.classList.contains('clear-bulk')) {
        var bulkCard = btn.closest('.card');
        var bulkInput = bulkCard ? bulkCard.querySelector('textarea') : null;
        if (bulkInput) bulkInput.value = '';
        return;
      }
      var card = btn.closest('.phrase-card');
      if (!card) return;
      var phraseId = card.dataset.phraseId;
      var phrase = lesson.phrases.filter(function (x) { return x.id === phraseId; })[0];
      if (!phrase) return;

      var lineLang = btn.dataset.lang;
      var box = document.getElementById('media-box-' + phraseId);
      if (btn.classList.contains('speak-btn')) {
        stopSpeech();
        speakOnce(phrase, ['fr', 'ar', 'en'], phraseId);
      } else if (btn.classList.contains('loop-btn')) {
        toggleLoop(phrase, phraseId);
      } else if (btn.classList.contains('speak-line')) {
        speakLine(phrase, lineLang, phraseId);
      } else if (btn.classList.contains('loop-line')) {
        var phraseCopy = Object.assign({}, phrase);
        var editorLine = btn.closest('.editor-line');
        var editorTA = editorLine ? editorLine.querySelector('textarea[data-field="' + lineLang + '"]') : null;
        if (editorTA) phraseCopy[lineLang] = editorTA.value;
        toggleLoop(phraseCopy, phraseId + ':' + lineLang, [lineLang]);
      } else if (btn.classList.contains('search-line')) {
        var editorLine2 = btn.closest('.editor-line');
        var editorTA2 = editorLine2 ? editorLine2.querySelector('textarea[data-field="' + lineLang + '"]') : null;
        var query = (editorTA2 ? editorTA2.value : phrase[lineLang] || '').trim();
        if (query) openSearch(query, lineLang);
      } else if (btn.classList.contains('loop-media')) {
        phrase.videoLoop = !phrase.videoLoop;
        var video = box ? box.querySelector('video.media-preview') : null;
        if (video) video.loop = phrase.videoLoop;
        btn.classList.toggle('active', phrase.videoLoop);
        saveCurrentLesson();
      } else if (btn.classList.contains('edit-phrase')) {
        phrase.editing = !phrase.editing;
        if (phrase.editing) stopSpeech();
        saveCurrentLesson();
        var idx = lesson.phrases.indexOf(phrase);
        var newCard = createPhraseCard(lesson, phrase, idx);
        card.parentNode.replaceChild(newCard, card);
        renderMediaForPhrase(phrase);
        applyTranslations();
      } else if (btn.classList.contains('move-up')) {
        movePhrase(lesson, phraseId, -1);
      } else if (btn.classList.contains('move-down')) {
        movePhrase(lesson, phraseId, 1);
      } else if (btn.classList.contains('delete-phrase')) {
        if (confirm(t('deletePhraseConfirm'))) deletePhrase(lesson, phraseId);
      } else if (btn.classList.contains('toggle-media')) {
        if (box) box.classList.toggle('hidden');
      } else if (btn.classList.contains('draw-phrase')) {
        openDraw(phrase);
      } else if (btn.classList.contains('video-loop')) {
        var video = document.getElementById('lesson-video');
        if (state.videoLoopSegment && state.videoLoopSegment.id === phrase.id) {
          state.videoLoopSegment = null;
          if (video) video.pause();
          document.querySelectorAll('.video-loop').forEach(function (b) { b.classList.remove('active'); });
        } else if (video && typeof phrase.start === 'number') {
          state.videoLoopSegment = { start: phrase.start, end: phrase.end, id: phrase.id };
          document.querySelectorAll('.video-loop').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          video.currentTime = phrase.start;
          video.play();
        }
      } else if (btn.classList.contains('attach-media')) {
        document.getElementById('file-' + phraseId).click();
      } else if (btn.classList.contains('remove-media')) {
        if (confirm(t('deleteMediaConfirm'))) {
          if (phrase.mediaId) { deleteMedia(phrase.mediaId); phrase.mediaId = null; phrase.mediaType = null; }
          saveCurrentLesson();
          renderMediaForPhrase(phrase);
        }
      } else if (btn.classList.contains('download-media')) {
        var urlInput = document.getElementById('media-url-' + phraseId);
        if (urlInput && urlInput.value.trim()) downloadMediaForPhrase(phrase, urlInput.value.trim());
      } else if (btn.classList.contains('clear-media-url')) {
        var mediaUrlInput = document.getElementById('media-url-' + phraseId);
        if (mediaUrlInput) mediaUrlInput.value = '';
      }

    app.onchange = function (e) {

      if (target.classList.contains('file-input') && target.files && target.files[0]) {
        var card = target.closest('.phrase-card');

        var file = target.files[0];
        var mediaId = uuid();
        if (phrase.mediaId) deleteMedia(phrase.mediaId);
        saveMedia(mediaId, file).then(function () {
          phrase.mediaId = mediaId;
          phrase.mediaType = file.type;
          saveCurrentLesson();
          renderMediaForPhrase(phrase);
        });
        target.value = '';
      }

    bindVideoDialog(lesson);

            ar: entry.ar,

  function renderMediaPreviews() {
    var lesson = getLesson(state.currentLessonId);
    if (!lesson) return;
    lesson.phrases.forEach(renderMediaForPhrase);
  }

  function renderMediaForPhrase(phrase) {
    var box = document.getElementById('media-box-' + phrase.id);
    if (!box) return;
    var placeholder = box.querySelector('.media-placeholder');
    var attach = box.querySelector('.attach-media');
    var remove = box.querySelector('.remove-media');
    var loop = box.querySelector('.loop-media');
    var existing = box.querySelector('.media-preview');
    if (existing) existing.remove();

    if (!phrase.mediaId) {
      placeholder.classList.remove('hidden');
      remove.classList.add('hidden');
      if (loop) loop.classList.add('hidden');
      box.classList.remove('has-media');
      return;
    }
    placeholder.classList.add('hidden');
    remove.classList.remove('hidden');
    box.classList.add('has-media');
    box.classList.remove('hidden');

    getMediaUrl(phrase.mediaId).then(function (url) {
      if (!url) return;
      var isVideo = phrase.mediaType && phrase.mediaType.indexOf('video/') === 0;
      if (isVideo) {
        if (loop) loop.classList.remove('hidden');
      } else {
        if (loop) loop.classList.add('hidden');
      }
      var el;
      if (isVideo) {
        el = document.createElement('video');
        el.controls = true;
        el.playsInline = true;
        el.loop = !!phrase.videoLoop;
        el.playbackRate = state.rate || 1;
      } else {
        el = document.createElement('img');
      }
      el.className = 'media-preview';
      el.src = url;
      box.insertBefore(el, box.firstChild);
      if (loop) loop.classList.toggle('active', isVideo && !!phrase.videoLoop);
    });
  }

  /* ---------------- Speech ---------------- */

  var VOICE_LANG = { fr: 'fr-FR', ar: 'ar-SA', en: 'en-US' };
  var speechRun = 0;

  function nativeTTS() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) return window.Capacitor.Plugins.TextToSpeech;
    if (window.Capacitor && window.Capacitor.registerPlugin) {
      window.Capacitor.Plugins = window.Capacitor.Plugins || {};
      window.Capacitor.Plugins.TextToSpeech = window.Capacitor.registerPlugin('TextToSpeech');
      return window.Capacitor.Plugins.TextToSpeech;
    }
    return null;
  }

  function nativeSpeak(text, lang) {
    var tts = nativeTTS();
    if (!tts) return Promise.reject('no tts');
    return tts.speak({ text: text, lang: VOICE_LANG[lang] || 'en-US', rate: state.rate || 1, queueStrategy: 1 });
  }

  function nativeStop() {
    var tts = nativeTTS(); if (!tts) return Promise.resolve(); return tts.stop();
  }

  function pickVoice(lang) {
    if (!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var code = VOICE_LANG[lang];
    var exact = voices.filter(function (v) { return v.lang && v.lang.replace(/_/g, '-') === code; })[0];
    if (exact) return exact;
    var prefix = code.split('-')[0];
    return voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; })[0] || null;
  }

  function utter(text, lang) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE_LANG[lang];
    u.rate = (state.rate || 1) * (lang === 'fr' ? 0.95 : 1);
    var v = pickVoice(lang);
    if (v) u.voice = v;
    return u;
  }

  function handleBackButton() {
    stopSpeech();
    if (state.view === 'lesson') {
      var lesson = getLesson(state.currentLessonId);
      if (lesson && lesson.folderId) { openFolder(lesson.folderId); return; }
      setView('lessons'); return;
    }
    if (state.view === 'folder') { setView('lessons'); return; }
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      if (confirm(t('exitConfirm'))) window.Capacitor.Plugins.App.exitApp();
    }
  }

  function stopSpeech() {
    state.loopKey = null;
    speechRun++;
    if (nativeTTS()) nativeStop();
    else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.phrase-card').forEach(function (el) { el.classList.remove('playing'); el.style.removeProperty('--glow'); });
    document.querySelectorAll('.speaking-line').forEach(function (el) { el.classList.remove('speaking-line'); });
    refreshLoopButtons();
    refreshStudyControls();
  }

  function stopAllMedia() {
    state.videoLoopLine = null;
    state.videoLoopSegment = null;
    stopSpeech();
    document.querySelectorAll('video').forEach(function (v) { v.pause(); v.currentTime = 0; });
    document.querySelectorAll('audio').forEach(function (a) { a.pause(); a.currentTime = 0; });
    document.querySelectorAll('.transcript-loop, .video-loop').forEach(function (b) { b.classList.remove('active'); });
  }

  function speakOnce(phrase, langs, key, onDone) {
    var seq = langs.filter(function (l) { return phrase[l]; });
    var i = 0;
    var run = ++speechRun;
    highlightPhrase(key, true);
    if (nativeTTS()) {
      nativeStop();
      (function next() {
        if (run !== speechRun) return;
        if (i >= seq.length) { if (state.loopKey !== key) highlightPhrase(key, false); if (onDone) onDone(); return; }
        var lang = seq[i++];
        highlightPhrase(key, true, lang);
        nativeSpeak(phrase[lang], lang).then(function () {
          if (run !== speechRun) return;
          setTimeout(next, 300);
        }).catch(function () {
          if (run !== speechRun) return;
          setTimeout(next, 300);
        });
      })();
      return;
    }
    if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
    window.speechSynthesis.cancel();
    (function next() {
      if (run !== speechRun) return;
      if (i >= seq.length) { if (state.loopKey !== key) highlightPhrase(key, false); if (onDone) onDone(); return; }
      var lang = seq[i++];
      highlightPhrase(key, true, lang);
      var u = utter(phrase[lang], lang);
      u.onend = function () { if (run !== speechRun) return; setTimeout(next, 300); };
      u.onerror = function () { if (run !== speechRun) return; setTimeout(next, 300); };
      window.speechSynthesis.speak(u);
    })();
  }

  function speakLine(phrase, lang, key) {
    if (!phrase[lang]) return;
    stopSpeech();
    speakOnce(phrase, [lang], (key || phrase.id) + ':' + lang);
  }

  function toggleLoop(phrase, key, langs) {
    if (state.loopKey === key) { stopSpeech(); return; }
    state.loopKey = key;
    refreshLoopButtons();
    refreshStudyControls();
    (function cycle() {
      if (state.loopKey !== key) return;
      speakOnce(phrase, langs || ['fr', 'ar', 'en'], key, function () {
        if (state.loopKey !== key) return;
        setTimeout(cycle, 700);
      });
    })();
  }

  function toggleWordLoop(word, lang, key) {
    if (state.loopKey === key) { stopSpeech(); return; }
    var fake = {}; fake[lang] = word;
    toggleLoop(fake, key, [lang]);
  }

  function getLessonLoopLangs() {
    return state.lessonLoopMode === 'fr' ? ['fr'] : ['fr', 'ar', 'en'];
  }

  function playLesson(lesson) {
    var runKey = 'lesson:' + lesson.id;
    if (state.loopKey === runKey) { stopSpeech(); return; }
    stopSpeech();
    state.loopKey = runKey;
    refreshLoopButtons();
    var i = 0;
    (function next() {
      if (state.loopKey !== runKey) return;
      if (i >= lesson.phrases.length) {
        i = 0;
        setTimeout(next, 1200);
        return;
      }
      var p = lesson.phrases[i];
      i++;
      var card = document.querySelector('.phrase-card[data-phrase-id="' + p.id + '"]');
      if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
      speakOnce(p, getLessonLoopLangs(), p.id, function () {
        if (state.loopKey !== runKey) return;
        setTimeout(next, 400);
      });
    })();
  }

  function highlightPhrase(key, on, lang) {
    var glow = 'rgba(13,148,136,0.55)';
    var phraseId = String(key).split(':')[0];
    var card = document.querySelector('.phrase-card[data-phrase-id="' + phraseId + '"]');
    if (card) {
      card.classList.toggle('playing', on);
      if (on && lang) card.style.setProperty('--glow', glow);
      else if (!on) card.style.removeProperty('--glow');
      if (lang || !on) {
        card.querySelectorAll('.textarea').forEach(function (ta) { ta.classList.remove('speaking-line'); });
        card.querySelectorAll('.phrase-line').forEach(function (d) { d.classList.remove('speaking-line'); });
        card.querySelectorAll('.word').forEach(function (w) { w.classList.remove('speaking-line'); });
      }
      if (lang) {
        var wordKey = String(key);
        var words = card.querySelectorAll('.word');
        var matched = false;
        words.forEach(function (w) {
          if (w.dataset.loopKey === wordKey) { w.classList.toggle('speaking-line', on); matched = true; }
        });
        if (!matched) {
          var ta = card.querySelector('.textarea[data-field="' + lang + '"]');
          if (ta) ta.classList.toggle('speaking-line', on);
          var line = card.querySelector('.phrase-line[data-lang="' + lang + '"]');
          if (line) line.classList.toggle('speaking-line', on);
        }
      }
    }
  }

  function refreshLoopButtons() {
    document.querySelectorAll('.loop-btn, .loop-line').forEach(function (btn) {
      var card = btn.closest('.phrase-card');
      if (!card) return;
      var key = card.dataset.phraseId;
      if (btn.dataset.lang) key += ':' + btn.dataset.lang;
      var on = state.loopKey === key;
      btn.innerHTML = icon(on ? 'stop' : 'loop');
      btn.classList.toggle('active', !!on);
    });
  }

  /* ---------------- Import / Export ---------------- */

  function downloadFile(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 200);
  }

  function shareOrDownload(jsonString, filename) {
    var blob = new Blob([jsonString], { type: 'application/json' });
    var file = new File([blob], filename, { type: 'application/json' });

    if (window.Capacitor && window.Capacitor.Plugins) {
      var FS = window.Capacitor.Plugins.Filesystem;
      var ShareP = window.Capacitor.Plugins.Share;
      if (FS && ShareP) {
        FS.writeFile({ path: filename, data: jsonString, directory: 'CACHE', encoding: 'utf8' })
          .then(function () { return FS.getUri({ path: filename, directory: 'CACHE' }); })
          .then(function (res) {
            return ShareP.share({ files: [res.uri], title: filename, text: filename, dialogTitle: t('export') });
          })
          .catch(function () { downloadFile(blob, filename); });
        return;
      }
    }

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: filename, text: filename })
        .catch(function (err) {
          if (err && err.name !== 'AbortError') { downloadFile(blob, filename); toast(t('shareFailed')); }
        });
      return;
    }
    downloadFile(blob, filename);
  }

  function exportLessons(lessons, filename) {
    var clone = JSON.parse(JSON.stringify(lessons));
    var jobs = [];
    clone.forEach(function (l) {
      (l.phrases || []).forEach(function (p) {
        if (p.mediaId) {
          jobs.push(dbGet('media', p.mediaId).then(function (m) {
            if (!m || !m.blob) return;
            return new Promise(function (resolve) {
              var reader = new FileReader();
              reader.onloadend = function () {
                p.mediaBase64 = reader.result;
                p.mediaType = m.type;
                resolve();
              };
              reader.onerror = function () { resolve(); };
              reader.readAsDataURL(m.blob);
            });
          }).catch(function () {}));
        }
      });
    });
    Promise.all(jobs).then(function () {
      var jsonString = JSON.stringify({ lessons: clone }, null, 2);
      shareOrDownload(jsonString, filename);
    });
  }

  function exportData() {
    exportLessons(state.lessons, 'lang-lessons.json');
  }

  function exportLesson(lesson) {
    var first = lesson.phrases && lesson.phrases[0];
    var name = (first && (first.fr || first.ar || first.en || 'lesson')) || 'lesson';
    name = name.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_').slice(0, 30) || 'lesson';
    exportLessons([lesson], 'lang-lesson-' + name + '.json');
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.lessons)) { throw new Error('invalid'); }
        state.lessons = [];
        var pending = 0;
        data.lessons.forEach(function (l) {
          l.id = uuid();
          if (l.phrases) {
            l.phrases.forEach(function (p) {
              p.id = uuid();
              if (p.mediaBase64) {
                pending++;
                var mediaId = uuid();
                var blob = dataURLToBlob(p.mediaBase64);
                p.mediaId = mediaId;
                p.mediaType = p.mediaType || blob.type;
                saveMedia(mediaId, blob).then(function () {
                  pending--;
                  if (pending === 0) importSave();
                });
                delete p.mediaBase64;
              }
            });
          }
          state.lessons.push(l);
          dbPut('lessons', l);
        });
        if (pending === 0) importSave();
      } catch (e) {
        toast('Import failed');
      }
    };
    reader.readAsText(file);
  }

  function importSave() {
    toast(t('saved'));
    renderLessonList();
  }

  /* ---------------- Init ---------------- */

  function init() {
    applyTheme();
    applyFontSize();
    applyAppTheme();
    setUILang(state.uiLang);

    document.getElementById('btn-theme').onclick = function () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
    };

    document.getElementById('btn-lang').onclick = function (e) {
      e.stopPropagation();
      var dropdown = document.getElementById('lang-dropdown');
      var wasHidden = dropdown.classList.contains('hidden');
      closeAllDropdowns();
      if (wasHidden) dropdown.classList.remove('hidden');
    };
    document.querySelectorAll('#lang-dropdown .dropdown-item').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        setUILang(b.dataset.lang);
        closeAllDropdowns();
      };
    });

    document.getElementById('btn-export').onclick = exportData;
    var stopBtn = document.getElementById('btn-stop-all');
    if (stopBtn) stopBtn.onclick = stopAllMedia;
    var importInput = document.getElementById('import-file');
    document.getElementById('btn-import').onclick = function () { importInput.click(); };
    importInput.onchange = function () { if (importInput.files && importInput.files[0]) importData(importInput.files[0]); importInput.value = ''; };

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = function () {};
      window.speechSynthesis.getVoices();
    }

    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      window.Capacitor.Plugins.App.addListener('backButton', handleBackButton);
    }

    window.onbeforeunload = function () {
      return t('exitConfirm');
    };
  }

  dbReady.then(function () {
    return Promise.all([loadLessons(), loadFolders()]);
  }).then(function () {
    init();
    render();
  }).catch(function (e) {
    console.error('init error', e);
    document.getElementById('app').innerHTML = '<div class="empty">Failed to load database.</div>';
  });

})();
</script>
</body>
</html>
