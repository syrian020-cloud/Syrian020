<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f8fafc">
<title>VocaPic</title>
<link rel="manifest" href="manifest-creator.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #0d9488;
    --accent-hover: #0f766e;
    --accent-gold: #f97316;
    --danger: #f87171;
    --success: #34d399;
    --gold: #f97316;
    --border: rgba(255,255,255,0.10);
    --fr-color: var(--text-primary);
    --ar-color: var(--text-primary);
    --en-color: var(--text-primary);
    --radius: 24px;
    --radius-sm: 999px;
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
    --shadow-sm: 0 6px 20px rgba(0,0,0,0.25);
    --glow: rgba(13,148,136,0.55);
  }
  [data-theme="light"] {
    --bg-primary: #f8fafc;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f1f5f9;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --accent: #0d9488;
    --accent-hover: #0f766e;
    --accent-gold: #f97316;
    --danger: #ef4444;
    --success: #10b981;
    --gold: #f97316;
    --border: rgba(15,23,42,0.09);
    --fr-color: var(--text-primary);
    --ar-color: var(--text-primary);
    --en-color: var(--text-primary);
    --shadow: 0 10px 30px rgba(15,23,42,0.08);
    --shadow-sm: 0 4px 12px rgba(15,23,42,0.05);
    --glow: rgba(13,148,136,0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    padding-bottom: 3rem;
  }
  header { position: sticky; top: 0; z-index: 60; background: rgba(15,23,42,0.9); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); }
  [data-theme="light"] header { background: rgba(255,255,255,0.86); }
  .header-inner { max-width: 960px; margin: 0 auto; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .logo { font-weight: 900; font-size: 1.15rem; white-space: nowrap; letter-spacing: -0.03em; background: linear-gradient(90deg, #0d9488, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .spacer { flex: 1; }
  .icon-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 14px; padding: 0.45rem 0.65rem; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 600; transition: transform .12s, border-color .15s, background .15s, box-shadow .15s; }
  .icon-btn:hover { border-color: var(--accent); background: var(--bg-secondary); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(20,184,166,0.22); }
  .icon-btn.active { background: linear-gradient(135deg, #f97316, #fb923c); color: #0f172a; border-color: transparent; }
  .icon-btn.danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border-color: transparent; }

  .icon { width: 1.1em; height: 1.1em; fill: currentColor; vertical-align: middle; display: inline-block; }
  .btn-icon { display: inline-flex; align-items: center; }
  .icon-play, .icon-volume { fill: var(--accent); filter: drop-shadow(0 0 3px rgba(13,148,136,0.45)); }
  .icon-stop { fill: var(--danger); filter: drop-shadow(0 0 3px rgba(244,63,94,0.4)); }
  .icon-loop { fill: var(--gold); filter: drop-shadow(0 0 3px rgba(249,115,22,0.4)); }
  .icon-trash, .icon-close { fill: var(--danger); }
  .icon-image { fill: var(--accent); }
  .icon-folder { fill: var(--gold); }
  .icon-lesson { fill: var(--accent); filter: drop-shadow(0 0 3px rgba(13,148,136,0.35)); }
  .icon-chevron, .icon-up, .icon-down, .icon-more { fill: var(--text-secondary); }

  .icon-btn.danger .icon { fill: #fff !important; filter: none !important; }
  .lang-menu { position: relative; }
  #btn-lang { min-width: 2.6rem; justify-content: center; }
  .dropdown-item.active { background: linear-gradient(135deg, #f97316, #fb923c); color: #0f172a; }
  main { max-width: 960px; margin: 0 auto; padding: 1rem; }

  .hero { background: linear-gradient(135deg, rgba(20,184,166,0.15), rgba(249,115,22,0.08)); border: 1px solid rgba(20,184,166,0.22); border-radius: 24px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; position: relative; overflow: hidden; box-shadow: 0 8px 24px rgba(20,184,166,0.10); }

  .hero p { margin: 0; color: var(--text-secondary); font-size: 0.95rem; }

  .btn { background: linear-gradient(135deg, #f97316, #fb923c); color: #0f172a; border: none; border-radius: 999px; padding: 0.7rem 1.1rem; font-size: 0.95rem; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(249,115,22,0.25); transition: transform .12s, filter .15s, box-shadow .15s; display: inline-flex; align-items: center; gap: 0.4rem; }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(249,115,22,0.35); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); box-shadow: none; }
  .btn.ghost:hover { border-color: var(--accent); background: var(--bg-secondary); color: var(--text-primary); }
  .btn.danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
  .btn.success { background: linear-gradient(135deg, #f97316, #fb923c); color: #0f172a; box-shadow: 0 6px 16px rgba(249,115,22,0.25); }
  .btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-bottom: 0.9rem; }
  .rate-control { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.8rem; font-size: 0.85rem; color: var(--text-secondary); }
  .rate-label { font-weight: 700; white-space: nowrap; }
  .rate-value { min-width: 2.2rem; font-weight: 800; color: var(--text-primary); text-align: center; }
  .rate-control input[type="range"] { width: 8rem; accent-color: var(--accent); cursor: pointer; }

  .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 28px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow-sm); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform .12s, box-shadow .15s, border-color .15s; }
  .card:hover { box-shadow: 0 8px 24px rgba(20,184,166,0.15); border-color: rgba(20,184,166,0.25); }
  .card-title { font-weight: 800; font-size: 1.08rem; margin-bottom: 0.3rem; }
  .card-sub { color: var(--text-secondary); font-size: 0.85rem; }

  .lesson-card { display: flex; flex-direction: row; align-items: center; gap: 0.9rem; cursor: pointer; position: relative; z-index: 1; overflow: visible; padding: 0.95rem 1.2rem; background: linear-gradient(135deg, rgba(20,184,166,0.08), rgba(249,115,22,0.02)); border: 1px solid rgba(20,184,166,0.14); border-left: 5px solid var(--accent); border-radius: 24px; box-shadow: 0 4px 14px rgba(20,184,166,0.06); }
  html[dir="rtl"] .lesson-card { flex-direction: row-reverse; }
  .lesson-card:hover { z-index: 10; border-color: rgba(20,184,166,0.35); border-left-color: var(--accent-hover); transform: translateY(-2px) scale(1.005); box-shadow: 0 8px 24px rgba(20,184,166,0.14); }
  .lesson-card.menu-open { z-index: 50; }
  .lesson-card .card-title { color: var(--text-primary); }
  .lesson-cover { width: 3.6rem; height: 3.6rem; min-width: 3.6rem; border-radius: 16px; background: linear-gradient(135deg, rgba(20,184,166,0.12), rgba(249,115,22,0.06)); border: 1px solid rgba(20,184,166,0.22); display: flex; align-items: center; justify-content: center; color: var(--accent); overflow: hidden; }
  .lesson-cover img { width: 100%; height: 100%; object-fit: cover; }
  .lesson-cover .icon { width: 1.6rem; height: 1.6rem; opacity: 0.85; }
  #add-lesson { background: linear-gradient(135deg, #f97316, #fb923c); box-shadow: 0 6px 18px rgba(249,115,22,0.3); }
  #add-lesson:hover { box-shadow: 0 8px 24px rgba(249,115,22,0.4); }
  .empty { background: linear-gradient(135deg, rgba(20,184,166,0.06), rgba(249,115,22,0.02)); border: 1px dashed rgba(20,184,166,0.35); border-radius: 18px; }
  .lesson-card .body, .folder .body { flex: 1; min-width: 0; }

  .lesson-menu { position: relative; }
  .dropdown { position: absolute; top: 120%; left: auto; right: 0; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; padding: 0.4rem; min-width: 11rem; box-shadow: var(--shadow); z-index: 10; display: flex; flex-direction: column; gap: 0.2rem; }
  html[dir="rtl"] .dropdown { right: auto; left: 0; }
  html[dir="rtl"] .lesson-card .dropdown,
  html[dir="rtl"] .folder .dropdown { right: 0; left: auto; }
  .dropdown-item { background: transparent; color: var(--text-primary); border: none; border-radius: 10px; padding: 0.55rem 0.7rem; font-size: 0.92rem; font-weight: 600; text-align: start; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
  .dropdown-item:hover { background: var(--bg-tertiary); }
  .dropdown-item.danger { color: var(--danger); }
  .dropdown-item .icon { width: 1.1rem; height: 1.1rem; }

  .input, .textarea {
    width: 100%; background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 0.75rem 1rem; font-size: 1rem; font-weight: 500; font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .input:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.12); background: var(--bg-secondary); }
  .textarea { min-height: 3rem; resize: vertical; }
  .phrase-editors { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; }
  .phrase-card:not(.editing) .phrase-editors { display: none; }
  .phrase-card.editing .phrase-body { display: none; }
  .textarea[data-field="fr"] { font-size: 1.15rem; font-weight: 700; }
  .textarea[data-field="ar"] { font-family: 'Noto Sans Arabic', 'Tajawal', 'Segoe UI', Tahoma, system-ui, sans-serif; font-size: 1.1rem; font-weight: 600; text-align: right; direction: rtl; }
  .textarea[data-field="en"] { font-size: 1rem; font-weight: 500; }

  .phrase-body { display: flex; flex-direction: column; gap: 0; padding: 0.2rem 0; }
  .phrase-line { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; padding: 0.4rem 0; color: var(--text-primary); border-bottom: 1px solid var(--border); cursor: pointer; }
  .phrase-line:last-child { border-bottom: none; }
  .phrase-line-text { flex: 1; min-width: 0; line-height: 1.4; }
  .phrase-line[data-lang="fr"] { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .phrase-line[data-lang="fr"] .phrase-line-text { text-align: center; }
  .phrase-line[data-lang="ar"] { font-size: 1.05rem; font-weight: 500; color: var(--text-secondary); direction: rtl; }
  .phrase-line[data-lang="ar"] .phrase-line-text { text-align: right; }
  .phrase-line[data-lang="en"] { font-size: 0.95rem; font-weight: 400; color: var(--text-secondary); font-style: italic; }
  .phrase-line[data-lang="en"] .phrase-line-text { text-align: left; }
  .phrase-line .icon-btn { padding: 0.25rem; font-size: 0.8rem; border-radius: 10px; opacity: 0.75; align-self: center; }
  .phrase-line:hover .icon-btn { opacity: 1; }
  .phrase-line.speaking-line { color: #fff !important; background: linear-gradient(135deg, #042f2e, #115e59); border-radius: 14px; padding-left: 0.7rem; padding-right: 0.7rem; box-shadow: 0 0 12px var(--glow); font-weight: 700; }
  .phrase-line.speaking-line .phrase-line-text { color: #fff !important; }
  .word { display: inline-block; padding: 0.1rem 0.2rem; margin: 0.05rem; border-radius: 6px; transition: background .15s, color .15s, box-shadow .15s; cursor: pointer; }
  .word:hover { background: rgba(13,148,136,0.12); }
  .word.speaking-line { color: #fff !important; background: linear-gradient(135deg, #042f2e, #115e59); border-radius: 10px; box-shadow: 0 0 8px var(--glow); font-weight: 700; }
  .word-placeholder { color: var(--text-secondary); font-size: 0.9rem; font-style: italic; }
  .field-label { display: block; color: var(--text-secondary); font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; margin: 0.8rem 0 0.35rem; }
  .field-label-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-top: 0.75rem; }
  .field-label-row .field-label { margin: 0; }
  .row-actions { display: flex; gap: 0.45rem; }
  .row-actions .icon-btn { padding: 0.4rem 0.55rem; font-size: 0.9rem; line-height: 1; border-radius: 12px; }

  .phrase-card { margin-bottom: 1.1rem; position: relative; background: var(--bg-secondary); border: 1px solid var(--border); border-inline-start: 5px solid var(--accent); border-top: 4px solid transparent; border-radius: 28px; box-shadow: var(--shadow-sm); transition: transform .12s, box-shadow .15s, border-color .15s; }
  .phrase-card:hover { box-shadow: 0 8px 24px rgba(20,184,166,0.12); border-color: rgba(20,184,166,0.25); }
  .phrase-card::before { content: ''; position: absolute; top: 0; left: 28px; right: 28px; height: 4px; border-radius: 0 0 4px 4px; background: linear-gradient(90deg, var(--accent), var(--gold)); opacity: 0.55; }
  .phrase-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.85rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border); }
  .phrase-num { color: var(--accent); font-size: 0.9rem; font-weight: 900; }
  .phrase-actions { margin-left: auto; display: flex; gap: 0.45rem; }
  .phrase-actions .icon-btn { padding: 0.45rem 0.6rem; font-size: 0.92rem; border-radius: 12px; }

  .media-box { background: var(--bg-tertiary); border: 2px dashed var(--border); border-radius: 20px; padding: 1rem; text-align: center; margin: 0.85rem 0; transition: border-color .15s, background .15s; }
  .media-box.has-media { border-style: solid; border-color: var(--success); padding: 0; overflow: hidden; background: #000; }
  .media-preview { width: 100%; max-height: 360px; object-fit: contain; display: block; }
  .media-preview video { width: 100%; max-height: 360px; }
  .media-placeholder { color: var(--text-secondary); font-size: 0.9rem; padding: 1rem; }
  .media-btns { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; margin-top: 0.7rem; }
  .media-btns .icon-btn { padding: 0.55rem; font-size: 1.05rem; border-radius: 14px; }
  .media-btns .icon-btn .icon { width: 1.3em; height: 1.3em; }
  .media-box.has-media .media-btns { padding: 0.6rem; background: linear-gradient(180deg, transparent, var(--bg-secondary)); }
  .url-input-row { display: flex; gap: 0.45rem; margin-top: 0.8rem; align-items: stretch; }
  .url-input-row .input { flex: 1; font-size: 0.92rem; padding: 0.6rem 0.9rem; }
  .url-input-row .icon-btn { display: inline-flex; align-items: center; justify-content: center; padding: 0 0.55rem; border-radius: 12px; }
  .url-input-row .btn { padding: 0.55rem 0.85rem; font-size: 0.85rem; border-radius: 12px; }
  .clear-bulk { padding: 0.35rem 0.5rem; font-size: 0.85rem; }

  ::placeholder { color: var(--text-secondary); opacity: 0.65; }
  .empty { color: var(--text-secondary); text-align: center; padding: 2.5rem 1rem; }
  .hint { background: linear-gradient(135deg, rgba(249,115,22,0.08), rgba(249,115,22,0.02)); border: 1px dashed rgba(249,115,22,0.35); border-radius: 18px; padding: 0.9rem 1.1rem; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem; }
  .toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.7rem 1.2rem; box-shadow: var(--shadow); z-index: 100; font-size: 0.92rem; font-weight: 600; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .hidden { display: none !important; }

  .playing { border-color: rgba(20,184,166,0.70); box-shadow: 0 0 0 4px rgba(20,184,166,0.18), 0 0 28px var(--glow), 0 12px 30px rgba(20,184,166,0.15); }
  .playing .textarea { color: #fff !important; background: linear-gradient(135deg, #042f2e, #115e59); border-radius: 18px; transition: color .2s, background .2s; }
  .textarea.speaking-line { color: #fff !important; background: linear-gradient(135deg, #042f2e, #115e59); border-radius: 18px; font-weight: 700; }

  .folder { display: flex; flex-direction: row; align-items: center; gap: 0.9rem; cursor: pointer; position: relative; z-index: 1; overflow: visible; padding: 0.95rem 1.2rem; background: linear-gradient(135deg, rgba(249,115,22,0.08), rgba(20,184,166,0.02)); border: 1px solid rgba(249,115,22,0.14); border-left: 5px solid var(--gold); border-radius: 24px; box-shadow: 0 4px 14px rgba(249,115,22,0.06); transition: transform .12s, box-shadow .15s, border-color .15s; }
  html[dir="rtl"] .folder { flex-direction: row-reverse; }
  .folder:hover { z-index: 10; border-color: rgba(249,115,22,0.35); border-left-color: var(--gold); transform: translateY(-2px) scale(1.005); box-shadow: 0 8px 24px rgba(249,115,22,0.14); }
  .folder.menu-open { z-index: 50; }
  .folder .card-title { color: var(--text-primary); }
  .folder-cover { width: 3.6rem; height: 3.6rem; min-width: 3.6rem; border-radius: 16px; background: linear-gradient(135deg, rgba(249,115,22,0.18), rgba(20,184,166,0.06)); border: 1px solid rgba(249,115,22,0.22); display: flex; align-items: center; justify-content: center; color: var(--gold); overflow: hidden; }
  .folder-cover img { width: 100%; height: 100%; object-fit: cover; }
  .folder-cover .icon { width: 1.6rem; height: 1.6rem; opacity: 0.85; }
  .section-label { color: var(--text-secondary); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin: 0.6rem 0.3rem 0.8rem; }

  @media (max-width: 480px) {
    .header-inner { padding: 0.65rem; }
    .hero h1 { font-size: 1.15rem; }
    main { padding: 0.75rem; }
    .btn { padding: 0.65rem 0.9rem; }
    .card { padding: 0.9rem; border-radius: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo" data-t="appName">VocaPic</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-export" data-t-title="export" title="Share"><svg class="icon icon-share" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M15.75 4.5a3 3 0 1 1 .825 2.066l-8.421 4.679a3.002 3.002 0 0 1 0 1.51l8.421 4.679a3 3 0 1 1-.729 1.31l-8.421-4.678a3 3 0 1 1 0-4.132l8.421-4.679a3 3 0 0 1-.096-.755Z"/></svg></button>
    <button class="icon-btn" id="btn-stop-all" data-t-title="stop" title="Stop"><svg class="icon icon-stop" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4.5 7.5a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3v-9Z"/></svg></button>
    <button class="icon-btn" id="btn-import" data-t-title="import" title="Import"><svg class="icon icon-import" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M11.47 2.47a.75.75 0 0 1 1.06 0l4.5 4.5a.75.75 0 0 1-1.06 1.06l-3.22-3.22V16.5a.75.75 0 0 1-1.5 0V4.81L8.03 8.03a.75.75 0 0 1-1.06-1.06l4.5-4.5ZM3 15.75a.75.75 0 0 1 .75.75v2.25a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5V16.5a.75.75 0 0 1 1.5 0v2.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V16.5a.75.75 0 0 1 .75-.75Z"/></svg></button>

  function iconText(key, iconName) {
    return '<span class="btn-icon">' + icon(iconName) + '</span><span data-t="' + key + '">' + esc(t(key)) + '</span>';
  }

  function btnIcon(name) {
    return icon(name);
  }

  /* ---------------- IndexedDB ---------------- */

  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = function () { reject(req.error); };
      req.onsuccess = function () { db = req.result; resolve(db); };
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('lessons')) d.createObjectStore('lessons', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('folders')) d.createObjectStore('folders', { keyPath: 'id' });
      };
    });
  }

  function txStore(store, mode) {
    return db.transaction([store], mode).objectStore(store);
  }

  function dbPut(store, obj) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readwrite').put(obj);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbGet(store, id) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readonly').get(id);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbDel(store, id) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readwrite').delete(id);
      req.onsuccess = function () { resolve(); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbGetAll(store) {
    return new Promise(function (resolve, reject) {
      var req = txStore(store, 'readonly').getAll();
      req.onsuccess = function () { resolve(req.result || []); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function uuid() {
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }

  /* ---------------- State & persistence ---------------- */

  function loadLessons() {
    return dbGetAll('lessons').then(function (list) {
      state.lessons = list || [];
    });
  }

  function loadFolders() {
    return dbGetAll('folders').then(function (list) {
      state.folders = list || [];
    });
  }

  function getLesson(id) {
    return state.lessons.filter(function (l) { return l.id === id; })[0];
  }

  function getFolder(id) {
    return state.folders.filter(function (f) { return f.id === id; })[0];
  }

  function saveExpandedFolders() {
    localStorage.setItem('creator_expanded_folders', JSON.stringify(state.expandedFolders));
  }

  function addFolder() {
    var name = prompt(t('folderNamePrompt') || 'Folder name');
    if (!name) return;
    name = name.trim();
    if (!name) return;
    var folder = { id: uuid(), name: { ar: name, fr: name, en: name }, createdAt: Date.now() };
    state.folders.push(folder);
    state.expandedFolders[folder.id] = true;
    saveExpandedFolders();
    dbPut('folders', folder).then(render);
  }

  function renameFolder(id) {
    var folder = getFolder(id);
    if (!folder) return;
    var current = folder.name[state.uiLang] || folder.name.en || folder.name.fr || folder.name.ar || '';
    var name = prompt(t('renameFolder') || 'Rename folder', current);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    folder.name = { ar: name, fr: name, en: name };
    dbPut('folders', folder).then(render);
  }

  function deleteFolder(id) {
    var folder = getFolder(id);
    if (!folder) return;
    if (!confirm(t('deleteFolderConfirm') || 'Delete folder?')) return;
    state.lessons.forEach(function (l) { if (l.folderId === id) { l.folderId = null; dbPut('lessons', l); } });
    state.folders = state.folders.filter(function (f) { return f.id !== id; });
    delete state.expandedFolders[id];
    saveExpandedFolders();
    dbDel('folders', id).then(render);
  }

  function setLessonFolder(lessonId, folderId) {
    var lesson = getLesson(lessonId);
    if (!lesson) return;
    lesson.folderId = folderId || null;
    if (folderId) state.expandedFolders[folderId] = true;
    saveExpandedFolders();
    dbPut('lessons', lesson).then(render);
  }

  function queueSave() {
    if (state.saveTimer) clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(saveCurrentLesson, 400);
  }

  function saveCurrentLesson() {
    var lesson = getLesson(state.currentLessonId);
    if (!lesson) return;
    dbPut('lessons', lesson).catch(function (e) { console.error('save failed', e); });
  }

  function addLesson() {
    var lesson = {
      id: uuid(),
      title: { ar: '', fr: '', en: '' },
      phrases: []
    };
    state.lessons.push(lesson);
    dbPut('lessons', lesson).then(function () {
      openLesson(lesson.id);
    });
  }

  function deleteLesson(id) {
    var lesson = getLesson(id);
    if (!lesson) return;
    if (lesson.phrases) {
      lesson.phrases.forEach(function (p) { if (p.mediaId) deleteMedia(p.mediaId); });
    }
    if (lesson.coverMediaId) deleteMedia(lesson.coverMediaId);
    state.lessons = state.lessons.filter(function (l) { return l.id !== id; });
    dbDel('lessons', id).then(render);
  }

  function editLessonName(id) {
    var lesson = getLesson(id);
    if (!lesson) return;
    var first = lesson.phrases && lesson.phrases[0];
    var current = lesson.title[state.uiLang] || lesson.title.en || lesson.title.fr || lesson.title.ar ||
      (first && (first[state.uiLang] || first.fr || first.ar || first.en)) || '';
    var name = prompt(t('editLesson'), current);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    lesson.title = { ar: name, fr: name, en: name };
    dbPut('lessons', lesson).then(render);
  }

  function attachCoverImage(id, file) {
    var lesson = getLesson(id);
    if (!lesson || !file) return;
    var mediaId = uuid();
    if (lesson.coverMediaId) deleteMedia(lesson.coverMediaId);
    saveMedia(mediaId, file).then(function () {
      lesson.coverMediaId = mediaId;
      dbPut('lessons', lesson).then(render);
    });
  }

  function attachFolderCover(id, file) {
    var folder = getFolder(id);
    if (!folder || !file) return;
    var mediaId = uuid();
    if (folder.coverMediaId) deleteMedia(folder.coverMediaId);
    saveMedia(mediaId, file).then(function () {
      folder.coverMediaId = mediaId;
      dbPut('folders', folder).then(render);
    });
  }

  function addPhrase(lesson) {
    lesson.phrases.push({ id: uuid(), fr: '', ar: '', en: '', editing: true });
    saveCurrentLesson();
    renderLessonEditor();
  }

  function addBulkPhrases(lesson) {
    var el = document.getElementById('bulk-input');
    if (!el) return;
    var lines = (el.value || '').split('\n');
    var added = 0;
    lines.forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var parts = line.split('|');
      if (parts.length < 3) return;
      lesson.phrases.push({
        id: uuid(),
        fr: (parts[0] || '').trim(),
        ar: (parts[1] || '').trim(),
        en: (parts[2] || '').trim(),
        editing: false
      });
      added++;
    });
    if (added) {
      saveCurrentLesson();
      renderLessonEditor();
    } else {
      toast(t('noBulkPhrases') || 'No valid phrases');
    }
  }

  function deletePhrase(lesson, phraseId) {
    var p = lesson.phrases.filter(function (x) { return x.id === phraseId; })[0];
    if (p && p.mediaId) deleteMedia(p.mediaId);
    lesson.phrases = lesson.phrases.filter(function (x) { return x.id !== phraseId; });
    saveCurrentLesson();
    renderLessonEditor();
  }

  function movePhrase(lesson, phraseId, dir) {
    var idx = lesson.phrases.findIndex(function (x) { return x.id === phraseId; });
    if (idx === -1) return;
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= lesson.phrases.length) return;
    var tmp = lesson.phrases[idx];
    lesson.phrases[idx] = lesson.phrases[newIdx];
    lesson.phrases[newIdx] = tmp;
    saveCurrentLesson();
    renderLessonEditor();
  }

  function saveMedia(mediaId, file) {
    return dbPut('media', { id: mediaId, blob: file, type: file.type });
  }

  function deleteMedia(mediaId) {
    if (state.mediaUrls[mediaId]) { URL.revokeObjectURL(state.mediaUrls[mediaId]); delete state.mediaUrls[mediaId]; }
    return dbDel('media', mediaId);
  }

  function getMediaUrl(mediaId) {
    if (state.mediaUrls[mediaId]) return Promise.resolve(state.mediaUrls[mediaId]);
    return dbGet('media', mediaId).then(function (m) {
      if (!m) return null;
      var url = URL.createObjectURL(m.blob);
      state.mediaUrls[mediaId] = url;
      return url;
    });
  }

  function dataURLToBlob(dataURL) {
    var parts = dataURL.split(',');
    var base64 = parts[1];
    var mime = parts[0].match(/:(.*?);/)[1];
    var bin = atob(base64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  function fullyDecode(v) {
    if (v == null) return v;
    for (var i = 0; i < 5; i++) {
      if (v.indexOf('%') === -1) break;
      try {
        var d = decodeURIComponent(v);
        if (d === v) break;
        v = d;
      } catch (e) { break; }
    }
    return v;
  }

  function getParam(url, name) {
    try {
      var u = new URL(url);
      return u.searchParams.get(name);
    } catch (e) { return null; }
  }

        .then(function (finalUrl) {
          var img = finalUrl && getParam(finalUrl, 'imgurl');
          resolve(img ? fullyDecode(img) : input);
        })
        .catch(function (err) { reject(err); });
    });
  }

  function fetchMediaBlob(url) {
    return new Promise(function (resolve, reject) {
      var http = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
      if (http) {
        http.get({ url: url, responseType: 'blob' })
          .then(function (res) {
            var ct = (res.headers && (res.headers['content-type'] || res.headers['Content-Type'])) || 'application/octet-stream';

            } else if (res.data instanceof Blob) {

            } else if (res.data && res.data.byteLength !== undefined) {

        .catch(function () {

            .catch(reject);
        });
    });

  function downloadMediaForPhrase(phrase, url) {
    resolveMediaUrl(url)
      .then(fetchMediaBlob)
      .then(function (blob) {
        var mediaId = uuid();
        if (phrase.mediaId) deleteMedia(phrase.mediaId);
        return saveMedia(mediaId, blob).then(function () {
          phrase.mediaId = mediaId;
          phrase.mediaType = blob.type;
          saveCurrentLesson();
          renderMediaForPhrase(phrase);
          toast(t('saved'));
        });
      })
      .catch(function (e) {
        console.error('Media download failed', e);
        toast(t('mediaDownloadFailed'));
      });
  }

  function nativeAppLauncher() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppLauncher) return window.Capacitor.Plugins.AppLauncher;
    if (window.Capacitor && window.Capacitor.registerPlugin) {
      window.Capacitor.Plugins = window.Capacitor.Plugins || {};
      window.Capacitor.Plugins.AppLauncher = window.Capacitor.registerPlugin('AppLauncher');
      return window.Capacitor.Plugins.AppLauncher;
    }
    return null;
  }

  function openSearch(text, lang) {
    if (!text) return;
    var q = 'Explain the phrase ' + text + ' in French and Arabic and English. Add common French example phrases that use the phrase or word "' + text + '" with translation to Arabic and English';
    var url = 'https://www.google.com/search?udm=50&q=' + encodeURIComponent(q) + '&hl=' + (lang || 'en');
    var launcher = nativeAppLauncher();
    if (launcher && launcher.openUrl) {
      launcher.openUrl({ url: url }).catch(function () { window.open(url, '_blank'); });
    } else {
      window.open(url, '_blank');
    }
  }

  /* ---------------- UI helpers ---------------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function stripPunct(w) {
    return w.replace(/^[^a-zA-Z0-9\u0600-\u06FF]+|[^a-zA-Z0-9\u0600-\u06FF]+$/g, '');
  }

  function wordSpans(text, lang, phraseId) {
    var s = String(text || '').trim();
    if (!s) return '<span class="word-placeholder" data-lang="' + lang + '">—</span>';
    return s.split(/\s+/).map(function (w, i) {
      var clean = stripPunct(w);
      var key = phraseId + ':' + lang + ':' + clean;
      return clean
        ? '<span class="word" data-lang="' + lang + '" data-word="' + esc(clean) + '" data-loop-key="' + esc(key) + '">' + esc(w) + '</span>'
        : '<span>' + esc(w) + '</span>';
    }).join(' ');
  }

  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2000);
  }

    state.currentLessonId = lessonId || null;
    if (name !== 'folder') state.currentFolderId = null;
    render();
  }

  function openLesson(id) {
    state.view = 'lesson';
    state.currentLessonId = id;
    render();
  }

  function openFolder(id) {
    state.view = 'folder';
    state.currentFolderId = id;
    render();
  }

  function render() {
    if (state.view === 'lesson') renderLessonEditor();
    else if (state.view === 'folder') renderFolder();
    else renderLessonList();

  function renderLessonCard(l, i) {
    var first = l.phrases && l.phrases[0];
    var title = esc(l.title[state.uiLang] || l.title.en || l.title.fr || l.title.ar ||
      (first && (first[state.uiLang] || first.fr || first.ar || first.en)) ||
      t('lesson') + ' ' + (i + 1));
    var coverAttr = l.coverMediaId ? ' data-cover="' + l.coverMediaId + '"' : '';
    return '<div class="card lesson-card" data-lesson="' + l.id + '">' +
      '<div class="lesson-cover"' + coverAttr + '>' + icon('lesson') + '</div>' +
      '<div class="body"><div class="card-title">' + title + '</div>' +

  function bindEditorEvents(lesson) {
    var backBtn = document.getElementById('btn-back');
    if (backBtn) backBtn.onclick = function () { stopSpeech(); if (lesson && lesson.folderId) openFolder(lesson.folderId); else setView('lessons'); };
    document.getElementById('btn-add-phrase').onclick = function () { addPhrase(lesson); };
    document.getElementById('btn-bulk-add').onclick = function () { addBulkPhrases(lesson); };
    document.getElementById('btn-play-all').onclick = function () { playLesson(lesson); };
    document.getElementById('btn-stop-lesson').onclick = stopAllMedia;

    var rateSlider = document.getElementById('rate-slider');
    var rateValue = document.getElementById('rate-value');
    if (rateSlider) {
      rateSlider.oninput = function () {
        state.rate = Number(rateSlider.value);
        localStorage.setItem('creator_rate', state.rate);
        if (rateValue) rateValue.textContent = state.rate.toFixed(1) + 'x';
      };
    }

    var playMode = document.getElementById('play-mode');
    if (playMode) {
      playMode.onchange = function () {
        state.lessonLoopMode = playMode.value;
        localStorage.setItem('creator_loop_mode', state.lessonLoopMode);
      };
    }

    var app = document.getElementById('app');
    app.oninput = function (e) {
      var target = e.target;
      if (target.dataset.field) {
        var phrase = lesson.phrases.filter(function (x) { return x.id === target.closest('.phrase-card').dataset.phraseId; })[0];
        if (phrase) { phrase[target.dataset.field] = target.value; queueSave(); }
      }
    };

    app.onclick = function (e) {
      var wordEl = e.target.closest('.word');
      if (wordEl) {
        var card = wordEl.closest('.phrase-card');
        if (!card) return;
        var phraseId = card.dataset.phraseId;
        var lang = wordEl.dataset.lang;
        var word = wordEl.dataset.word;
        if (!word) return;
        toggleWordLoop(word, lang, phraseId + ':' + lang + ':' + word);
        return;
      }

      var lineEl = e.target.closest('.phrase-line');
      if (lineEl && !e.target.closest('button')) {
        var lineCard = lineEl.closest('.phrase-card');
        if (lineCard) {
          var linePhraseId = lineCard.dataset.phraseId;
          var linePhrase = lesson.phrases.filter(function (x) { return x.id === linePhraseId; })[0];
          var lineLang = lineEl.dataset.lang;
          if (linePhrase && lineLang) speakLine(linePhrase, lineLang, linePhraseId);
        }
        return;
      }

      var btn = e.target.closest('button');
      if (!btn) return;
      if (btn.classList.contains('clear-bulk')) {
        var bulkInput = document.getElementById('bulk-input');
        if (bulkInput) bulkInput.value = '';
        return;
      }
      var card = btn.closest('.phrase-card');
      if (!card) return;
      var phraseId = card.dataset.phraseId;
      var phrase = lesson.phrases.filter(function (x) { return x.id === phraseId; })[0];
      if (!phrase) return;

      var lineLang = btn.dataset.lang;
      var box = document.getElementById('media-box-' + phraseId);
      if (btn.classList.contains('speak-btn')) {
        stopSpeech();
        speakOnce(phrase, ['fr', 'ar', 'en'], phraseId);
      } else if (btn.classList.contains('loop-btn')) {
        toggleLoop(phrase, phraseId);
      } else if (btn.classList.contains('speak-line')) {
        speakLine(phrase, lineLang, phraseId);
      } else if (btn.classList.contains('loop-line')) {
        toggleLoop(phrase, phraseId + ':' + lineLang, [lineLang]);
      } else if (btn.classList.contains('search-line')) {
        var query = (phrase[lineLang] || '').trim();
        if (query) openSearch(query, lineLang);
      } else if (btn.classList.contains('loop-media')) {
        phrase.videoLoop = !phrase.videoLoop;
        var video = box ? box.querySelector('video.media-preview') : null;
        if (video) video.loop = phrase.videoLoop;
        btn.classList.toggle('active', phrase.videoLoop);
        saveCurrentLesson();
      } else if (btn.classList.contains('edit-phrase')) {
        phrase.editing = !phrase.editing;
        if (phrase.editing) stopSpeech();
        saveCurrentLesson();
        var idx = lesson.phrases.indexOf(phrase);
        var newCard = createPhraseCard(lesson, phrase, idx);
        card.parentNode.replaceChild(newCard, card);
        renderMediaForPhrase(phrase);
        applyTranslations();
      } else if (btn.classList.contains('move-up')) {
        movePhrase(lesson, phraseId, -1);
      } else if (btn.classList.contains('move-down')) {
        movePhrase(lesson, phraseId, 1);
      } else if (btn.classList.contains('delete-phrase')) {
        if (confirm(t('deletePhraseConfirm'))) deletePhrase(lesson, phraseId);
      } else if (btn.classList.contains('toggle-media')) {
        if (box) box.classList.toggle('hidden');
      } else if (btn.classList.contains('attach-media')) {
        document.getElementById('file-' + phraseId).click();
      } else if (btn.classList.contains('remove-media')) {
        if (confirm(t('deleteMediaConfirm'))) {
          if (phrase.mediaId) { deleteMedia(phrase.mediaId); phrase.mediaId = null; phrase.mediaType = null; }
          saveCurrentLesson();
          renderMediaForPhrase(phrase);
        }
      } else if (btn.classList.contains('download-media')) {
        var urlInput = document.getElementById('media-url-' + phraseId);
        if (urlInput && urlInput.value.trim()) downloadMediaForPhrase(phrase, urlInput.value.trim());
      } else if (btn.classList.contains('clear-media-url')) {
        var mediaUrlInput = document.getElementById('media-url-' + phraseId);
        if (mediaUrlInput) mediaUrlInput.value = '';
      }
    };

    app.onchange = function (e) {
      var target = e.target;
      if (target.classList.contains('file-input') && target.files && target.files[0]) {
        var card = target.closest('.phrase-card');
        var phrase = lesson.phrases.filter(function (x) { return x.id === card.dataset.phraseId; })[0];
        var file = target.files[0];
        var mediaId = uuid();
        if (phrase.mediaId) deleteMedia(phrase.mediaId);
        saveMedia(mediaId, file).then(function () {
          phrase.mediaId = mediaId;
          phrase.mediaType = file.type;
          saveCurrentLesson();
          renderMediaForPhrase(phrase);
        });
        target.value = '';
      }
    };
  }

  function renderMediaPreviews() {
    var lesson = getLesson(state.currentLessonId);
    if (!lesson) return;
    lesson.phrases.forEach(renderMediaForPhrase);
  }

  function renderMediaForPhrase(phrase) {
    var box = document.getElementById('media-box-' + phrase.id);
    if (!box) return;
    var placeholder = box.querySelector('.media-placeholder');
    var attach = box.querySelector('.attach-media');
    var remove = box.querySelector('.remove-media');
    var loop = box.querySelector('.loop-media');
    var existing = box.querySelector('.media-preview');
    if (existing) existing.remove();

    if (!phrase.mediaId) {
      placeholder.classList.remove('hidden');
      remove.classList.add('hidden');
      if (loop) loop.classList.add('hidden');
      box.classList.remove('has-media');
      return;
    }
    placeholder.classList.add('hidden');
    remove.classList.remove('hidden');
    box.classList.add('has-media');
    box.classList.remove('hidden');

    getMediaUrl(phrase.mediaId).then(function (url) {
      if (!url) return;
      var isVideo = phrase.mediaType && phrase.mediaType.indexOf('video/') === 0;
      if (isVideo) {
        if (loop) loop.classList.remove('hidden');
      } else {
        if (loop) loop.classList.add('hidden');
      }
      var el;
      if (isVideo) {
        el = document.createElement('video');
        el.controls = true;
        el.playsInline = true;
        el.loop = !!phrase.videoLoop;
      } else {
        el = document.createElement('img');
      }
      el.className = 'media-preview';
      el.src = url;
      box.insertBefore(el, box.firstChild);
      if (loop) loop.classList.toggle('active', isVideo && !!phrase.videoLoop);
    });
  }

  /* ---------------- Speech ---------------- */

  var VOICE_LANG = { fr: 'fr-FR', ar: 'ar-SA', en: 'en-US' };
  var speechRun = 0;

  function nativeTTS() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) return window.Capacitor.Plugins.TextToSpeech;
    if (window.Capacitor && window.Capacitor.registerPlugin) {
      window.Capacitor.Plugins = window.Capacitor.Plugins || {};
      window.Capacitor.Plugins.TextToSpeech = window.Capacitor.registerPlugin('TextToSpeech');
      return window.Capacitor.Plugins.TextToSpeech;
    }
    return null;
  }

  function nativeSpeak(text, lang) {
    var tts = nativeTTS();
    if (!tts) return Promise.reject('no tts');
    return tts.speak({ text: text, lang: VOICE_LANG[lang] || 'en-US', rate: state.rate || 1, queueStrategy: 1 });
  }

  function nativeStop() {
    var tts = nativeTTS(); if (!tts) return Promise.resolve(); return tts.stop();
  }

  function pickVoice(lang) {
    if (!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var code = VOICE_LANG[lang];
    var exact = voices.filter(function (v) { return v.lang && v.lang.replace(/_/g, '-') === code; })[0];
    if (exact) return exact;
    var prefix = code.split('-')[0];
    return voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; })[0] || null;
  }

  function utter(text, lang) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE_LANG[lang];
    u.rate = (state.rate || 1) * (lang === 'fr' ? 0.95 : 1);
    var v = pickVoice(lang);
    if (v) u.voice = v;
    return u;
  }

  function handleBackButton() {
    stopSpeech();
    if (state.view === 'lesson') {
      var lesson = getLesson(state.currentLessonId);
      if (lesson && lesson.folderId) { openFolder(lesson.folderId); return; }
      setView('lessons'); return;
    }
    if (state.view === 'folder') { setView('lessons'); return; }
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      if (confirm(t('exitConfirm'))) window.Capacitor.Plugins.App.exitApp();
    }
  }

  function stopSpeech() {
    state.loopKey = null;
    speechRun++;
    if (nativeTTS()) nativeStop();
    else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.phrase-card').forEach(function (el) { el.classList.remove('playing'); el.style.removeProperty('--glow'); });
    document.querySelectorAll('.speaking-line').forEach(function (el) { el.classList.remove('speaking-line'); });
    refreshLoopButtons();
  }

  function stopAllMedia() {
    stopSpeech();
    document.querySelectorAll('video').forEach(function (v) { v.pause(); v.currentTime = 0; });
    document.querySelectorAll('audio').forEach(function (a) { a.pause(); a.currentTime = 0; });
  }

  function speakOnce(phrase, langs, key, onDone) {
    var seq = langs.filter(function (l) { return phrase[l]; });
    var i = 0;
    var run = ++speechRun;
    highlightPhrase(key, true);
    if (nativeTTS()) {
      nativeStop();
      (function next() {
        if (run !== speechRun) return;
        if (i >= seq.length) { if (state.loopKey !== key) highlightPhrase(key, false); if (onDone) onDone(); return; }
        var lang = seq[i++];
        highlightPhrase(key, true, lang);
        nativeSpeak(phrase[lang], lang).then(function () {
          if (run !== speechRun) return;
          setTimeout(next, 300);
        }).catch(function () {
          if (run !== speechRun) return;
          setTimeout(next, 300);
        });
      })();
      return;
    }
    if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
    window.speechSynthesis.cancel();
    (function next() {
      if (run !== speechRun) return;
      if (i >= seq.length) { if (state.loopKey !== key) highlightPhrase(key, false); if (onDone) onDone(); return; }
      var lang = seq[i++];
      highlightPhrase(key, true, lang);
      var u = utter(phrase[lang], lang);
      u.onend = function () { if (run !== speechRun) return; setTimeout(next, 300); };
      u.onerror = function () { if (run !== speechRun) return; setTimeout(next, 300); };
      window.speechSynthesis.speak(u);
    })();
  }

  function speakLine(phrase, lang, key) {
    if (!phrase[lang]) return;
    stopSpeech();
    speakOnce(phrase, [lang], (key || phrase.id) + ':' + lang);
  }

  function toggleLoop(phrase, key, langs) {
    if (state.loopKey === key) { stopSpeech(); return; }
    state.loopKey = key;
    refreshLoopButtons();
    (function cycle() {
      if (state.loopKey !== key) return;
      speakOnce(phrase, langs || ['fr', 'ar', 'en'], key, function () {
        if (state.loopKey !== key) return;
        setTimeout(cycle, 700);
      });
    })();
  }

  function toggleWordLoop(word, lang, key) {
    if (state.loopKey === key) { stopSpeech(); return; }
    var fake = {}; fake[lang] = word;
    toggleLoop(fake, key, [lang]);
  }

  function getLessonLoopLangs() {
    return state.lessonLoopMode === 'fr' ? ['fr'] : ['fr', 'ar', 'en'];
  }

  function playLesson(lesson) {
    var runKey = 'lesson:' + lesson.id;
    if (state.loopKey === runKey) { stopSpeech(); return; }
    stopSpeech();
    state.loopKey = runKey;
    refreshLoopButtons();
    var i = 0;
    (function next() {
      if (state.loopKey !== runKey) return;
      if (i >= lesson.phrases.length) {
        i = 0;
        setTimeout(next, 1200);
        return;
      }
      var p = lesson.phrases[i];
      i++;
      var card = document.querySelector('.phrase-card[data-phrase-id="' + p.id + '"]');
      if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
      speakOnce(p, getLessonLoopLangs(), p.id, function () {
        if (state.loopKey !== runKey) return;
        setTimeout(next, 400);
      });
    })();
  }

  function highlightPhrase(key, on, lang) {
    var glow = 'rgba(13,148,136,0.55)';
    var phraseId = String(key).split(':')[0];
    var card = document.querySelector('.phrase-card[data-phrase-id="' + phraseId + '"]');
    if (card) {
      card.classList.toggle('playing', on);
      if (on && lang) card.style.setProperty('--glow', glow);
      else if (!on) card.style.removeProperty('--glow');
      if (lang || !on) {
        card.querySelectorAll('.textarea').forEach(function (ta) { ta.classList.remove('speaking-line'); });
        card.querySelectorAll('.phrase-line').forEach(function (d) { d.classList.remove('speaking-line'); });
        card.querySelectorAll('.word').forEach(function (w) { w.classList.remove('speaking-line'); });
      }
      if (lang) {
        var wordKey = String(key);
        var words = card.querySelectorAll('.word');
        var matched = false;
        words.forEach(function (w) {
          if (w.dataset.loopKey === wordKey) { w.classList.toggle('speaking-line', on); matched = true; }
        });
        if (!matched) {
          var ta = card.querySelector('.textarea[data-field="' + lang + '"]');
          if (ta) ta.classList.toggle('speaking-line', on);
          var line = card.querySelector('.phrase-line[data-lang="' + lang + '"]');
          if (line) line.classList.toggle('speaking-line', on);
        }
      }
    }
  }

  function refreshLoopButtons() {
    document.querySelectorAll('.loop-btn').forEach(function (btn) {
      var card = btn.closest('.phrase-card');
      if (!card) return;
      var key = card.dataset.phraseId;
      if (btn.dataset.lang) key += ':' + btn.dataset.lang;
      var on = state.loopKey === key;
      btn.innerHTML = icon(on ? 'stop' : 'loop');
      btn.classList.toggle('active', !!on);
    });
  }

  /* ---------------- Import / Export ---------------- */

  function downloadFile(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 200);
  }

  function shareOrDownload(jsonString, filename) {
    var blob = new Blob([jsonString], { type: 'application/json' });
    var file = new File([blob], filename, { type: 'application/json' });

    if (window.Capacitor && window.Capacitor.Plugins) {
      var FS = window.Capacitor.Plugins.Filesystem;
      var ShareP = window.Capacitor.Plugins.Share;
      if (FS && ShareP) {
        FS.writeFile({ path: filename, data: jsonString, directory: 'CACHE', encoding: 'utf8' })
          .then(function () { return FS.getUri({ path: filename, directory: 'CACHE' }); })
          .then(function (res) {
            return ShareP.share({ files: [res.uri], title: filename, text: filename, dialogTitle: t('export') });
          })
          .catch(function () { downloadFile(blob, filename); });
        return;
      }
    }

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: filename, text: filename })
        .catch(function (err) {
          if (err && err.name !== 'AbortError') { downloadFile(blob, filename); toast(t('shareFailed')); }
        });
      return;
    }
    downloadFile(blob, filename);
  }

  function exportLessons(lessons, filename) {
    var clone = JSON.parse(JSON.stringify(lessons));
    var jobs = [];
    clone.forEach(function (l) {
      (l.phrases || []).forEach(function (p) {
        if (p.mediaId) {
          jobs.push(dbGet('media', p.mediaId).then(function (m) {
            if (!m || !m.blob) return;
            return new Promise(function (resolve) {
              var reader = new FileReader();
              reader.onloadend = function () {
                p.mediaBase64 = reader.result;
                p.mediaType = m.type;
                resolve();
              };
              reader.onerror = function () { resolve(); };
              reader.readAsDataURL(m.blob);
            });
          }).catch(function () {}));
        }
      });
    });
    Promise.all(jobs).then(function () {
      var jsonString = JSON.stringify({ lessons: clone }, null, 2);
      shareOrDownload(jsonString, filename);
    });
  }

  function exportData() {
    exportLessons(state.lessons, 'lang-lessons.json');
  }

  function exportLesson(lesson) {
    var first = lesson.phrases && lesson.phrases[0];
    var name = (first && (first.fr || first.ar || first.en || 'lesson')) || 'lesson';
    name = name.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_').slice(0, 30) || 'lesson';
    exportLessons([lesson], 'lang-lesson-' + name + '.json');
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.lessons)) { throw new Error('invalid'); }
        state.lessons = [];
        var pending = 0;
        data.lessons.forEach(function (l) {
          l.id = uuid();
          if (l.phrases) {
            l.phrases.forEach(function (p) {
              p.id = uuid();
              if (p.mediaBase64) {
                pending++;
                var mediaId = uuid();
                var blob = dataURLToBlob(p.mediaBase64);
                p.mediaId = mediaId;
                p.mediaType = p.mediaType || blob.type;
                saveMedia(mediaId, blob).then(function () {
                  pending--;
                  if (pending === 0) importSave();
                });
                delete p.mediaBase64;
              }
            });
          }
          state.lessons.push(l);
          dbPut('lessons', l);
        });
        if (pending === 0) importSave();
      } catch (e) {
        toast('Import failed');
      }
    };
    reader.readAsText(file);
  }

  function importSave() {
    toast(t('saved'));
    renderLessonList();
  }

  /* ---------------- Init ---------------- */

  function init() {
    applyTheme();
    setUILang(state.uiLang);

    document.getElementById('btn-theme').onclick = function () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
    };

    document.getElementById('btn-lang').onclick = function (e) {
      e.stopPropagation();
      var dropdown = document.getElementById('lang-dropdown');
      var wasHidden = dropdown.classList.contains('hidden');
      closeAllDropdowns();
      if (wasHidden) dropdown.classList.remove('hidden');
    };
    document.querySelectorAll('#lang-dropdown .dropdown-item').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        setUILang(b.dataset.lang);
        closeAllDropdowns();
      };
    });

    document.getElementById('btn-export').onclick = exportData;
    var stopBtn = document.getElementById('btn-stop-all');
    if (stopBtn) stopBtn.onclick = stopAllMedia;
    var importInput = document.getElementById('import-file');
    document.getElementById('btn-import').onclick = function () { importInput.click(); };
    importInput.onchange = function () { if (importInput.files && importInput.files[0]) importData(importInput.files[0]); importInput.value = ''; };

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = function () {};
      window.speechSynthesis.getVoices();
    }

    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      window.Capacitor.Plugins.App.addListener('backButton', handleBackButton);
    }

    window.onbeforeunload = function () {
      return t('exitConfirm');
    };
  }

  dbReady.then(function () {
    return Promise.all([loadLessons(), loadFolders()]);
  }).then(function () {
    init();
    render();
  }).catch(function (e) {
    console.error('init error', e);
    document.getElementById('app').innerHTML = '<div class="empty">Failed to load database.</div>';
  });

})();
</script>
</body>
