<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d1f">
<title>Motsy</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg-primary: #0b0d1f;
    --bg-secondary: #13162b;
    --bg-tertiary: #1e213d;
    --text-primary: #f0f1ff;
    --text-secondary: #8c90b5;
    --accent: #7b79ff;
    --accent-hover: #5c5bdb;
    --danger: #ff6b81;
    --success: #00e676;
    --gold: #ffc857;
    --border: rgba(255,255,255,0.08);
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --shadow-sm: 0 4px 14px rgba(0,0,0,0.25);
  }
  [data-theme="light"] {
    --bg-primary: #f4f6fb;
    --bg-secondary: #ffffff;
    --bg-tertiary: #eef0f7;
    --text-primary: #181a2e;
    --text-secondary: #5e627d;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
    --shadow-sm: 0 3px 10px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.55;
    padding-bottom: 3rem;
    -webkit-font-smoothing: antialiased;
  }
  header { position: sticky; top: 0; z-index: 60; background: rgba(11,13,31,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  [data-theme="light"] header { background: rgba(255,255,255,0.85); }
  .header-inner { max-width: 960px; margin: 0 auto; padding: 0.7rem 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .logo { font-weight: 800; color: var(--accent); font-size: 1.05rem; white-space: nowrap; display: flex; align-items: center; gap: 0.35rem; letter-spacing: -0.02em; }
  .spacer { flex: 1; }
  .icon-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 12px; padding: 0.45rem 0.65rem; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 600; transition: transform .1s, border-color .15s, background .15s; }
  .icon-btn:hover { border-color: var(--accent); background: var(--bg-secondary); }
  .icon-btn.active { background: var(--success); color: #0b0d1f; border-color: var(--success); }
  main { max-width: 960px; margin: 0 auto; padding: 0.9rem; }

  .hero { background: linear-gradient(135deg, rgba(123,121,255,0.18), rgba(0,230,118,0.08)); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.25rem; margin-bottom: 0.9rem; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top:0; left:0; right:0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--success)); opacity: .7; }
  .hero h1 { margin: 0 0 0.35rem; font-size: 1.22rem; position: relative; }
  .hero p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; position: relative; }

  .toolbar { display: grid; grid-template-columns: 1fr auto auto auto; gap: 0.5rem; align-items: stretch; margin-bottom: 0.85rem; }
  #search { width: 100%; min-width: 0; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.75rem 1rem; font-size: 0.98rem; font-family: inherit; box-shadow: var(--shadow-sm); }
  #search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(123,121,255,0.18); }
  select.ctl { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.65rem 0.55rem; font-size: 0.88rem; font-family: inherit; min-width: 3.2rem; box-shadow: var(--shadow-sm); }
  select.ctl:focus { border-color: var(--accent); outline: none; }

  .filters { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.1rem; }
  .filter-section { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.55rem 0.6rem; }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }
  .filter-label { color: var(--text-secondary); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 0.15rem; white-space: nowrap; font-weight: 700; margin-bottom: 0.2rem; }
  .letters-row { display: flex; flex-wrap: wrap; gap: 0.35rem; direction: ltr; }
  .letters-row .filter-chip { min-width: 2.7rem; padding: 0.35rem 0.2rem; text-align: center; font-weight: 700; border-radius: 10px; font-size: 0.78rem; display: inline-flex; align-items: center; justify-content: center; }
  .contexts-strip { display: flex; flex-wrap: nowrap; gap: 0.4rem; overflow-x: auto; padding: 0.2rem 1px; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
  .contexts-strip::-webkit-scrollbar { display: none; }
  .filter-chip { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.65rem; font-size: 0.82rem; cursor: pointer; user-select: none; transition: all 0.15s; white-space: nowrap; box-shadow: var(--shadow-sm); }
  .filter-chip:hover { border-color: var(--accent); color: var(--text-primary); transform: translateY(-1px); }
  .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 14px rgba(123,121,255,0.25); }
  .filter-chip.empty { opacity: 0.5; }

  .stats { color: var(--text-secondary); font-size: 0.88rem; margin: 0 0 0.9rem; display: flex; align-items: center; gap: 0.35rem; }
  .stats strong { color: var(--accent); font-weight: 800; }

  .vocab-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.05rem; margin-bottom: 0.85rem; position: relative; overflow: hidden; transition: transform .12s, box-shadow .15s; box-shadow: var(--shadow-sm); }
  .vocab-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .vocab-card::before { content: ''; position: absolute; top:0; left:0; right:0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--success)); opacity: 0.75; }
  .vocab-card.playing { border-color: var(--success); box-shadow: 0 0 0 2px rgba(0,230,118,0.18); }
  .vocab-head { display: flex; align-items: flex-start; gap: 0.65rem; }
  .vocab-main { flex: 1; min-width: 0; }
  .fr-line { direction: ltr; text-align: left; font-size: 1.35rem; font-weight: 800; color: var(--accent); word-wrap: break-word; letter-spacing: -0.02em; }
  .ar-line { direction: rtl; text-align: right; font-size: 1.1rem; color: var(--text-primary); margin-top: 0.2rem; font-weight: 600; }
  .en-line { direction: ltr; text-align: left; font-size: 0.92rem; color: var(--text-secondary); margin-top: 0.1rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem; align-items: center; }
  .level-pill { background: rgba(0,230,118,0.14); color: var(--success); border: 1px solid rgba(0,230,118,0.3); border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.72rem; font-weight: 700; }
  .ctx-pill { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.72rem; }
  .pos-pill { background: rgba(123,121,255,0.12); color: var(--accent); border: 1px solid rgba(123,121,255,0.3); border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.72rem; }
  .usage { color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem; padding: 0.35rem 0.55rem; border-right: 3px solid var(--accent); background: rgba(123,121,255,0.06); border-radius: 0 10px 10px 0; }

  .example { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem 0.9rem; margin-top: 0.65rem; position: relative; overflow: hidden; }
  .example { padding-top: 1.25rem; }
  .example.playing { border-color: var(--success); box-shadow: 0 0 0 2px rgba(0,230,118,0.18); }
  .loop-ex-btn { position: absolute; top: 0.45rem; right: 0.45rem; background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; width: 1.9rem; height: 1.9rem; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; cursor: pointer; padding: 0; transition: all .12s; }
  .loop-ex-btn:hover { border-color: var(--accent); background: var(--bg-secondary); }
  .loop-ex-btn.active { background: var(--success); border-color: var(--success); color: #0b0d1f; }
  .example::before { content: ''; position: absolute; top:0; left:0; width: 3px; height: 100%; background: linear-gradient(180deg, var(--accent), var(--success)); opacity: 0.7; }
  .line-wrap { position: relative; direction: ltr; }
  .line-loop-btn { position: absolute; top: 50%; right: 0.3rem; transform: translateY(-50%); background: transparent; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; width: 1.65rem; height: 1.65rem; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; padding: 0; opacity: 0.85; transition: all .12s; }
  .line-loop-btn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; background: rgba(123,121,255,0.08); }
  .line-loop-btn.active { background: var(--success); border-color: var(--success); color: #0b0d1f; opacity: 1; }
  .fr-line, .en-line, .ex-fr, .ex-en { padding-inline-end: 2.2rem; }
  .ex-fr { direction: ltr; text-align: left; color: var(--text-primary); font-weight: 600; font-size: 0.96rem; }
  .ex-ar { direction: rtl; text-align: right; color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.2rem; }
  .ex-en { direction: ltr; text-align: left; color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.12rem; }
  .word-loop { cursor: pointer; border-radius: 3px; transition: color .1s, background .1s; }
  .word-loop:hover { color: var(--accent); background: rgba(123,121,255,0.08); }

  .card-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.45rem; margin-top: 0.85rem; }
  .card-actions button, .card-actions a { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 10px; padding: 0.5rem 0.2rem; font-size: 0.82rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem; font-weight: 600; transition: all .12s; }
  .card-actions button:hover, .card-actions a:hover { border-color: var(--accent); background: rgba(123,121,255,0.08); color: var(--text-primary); transform: translateY(-1px); }
  .card-actions button.active { background: var(--success); color: #0b0d1f; border-color: var(--success); }

  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); }
  .load-more-btn { display: block; width: 100%; margin: 1.2rem 0; padding: 0.85rem; background: var(--bg-secondary); color: var(--accent); border: 1px dashed var(--accent); border-radius: var(--radius); cursor: pointer; font-size: 0.95rem; font-weight: 700; transition: all .15s; }
  .load-more-btn:hover { background: var(--bg-tertiary); border-style: solid; }
  footer { text-align: center; padding: 1.5rem 1rem; color: var(--text-secondary); font-size: 0.8rem; }
  footer a { color: var(--accent); text-decoration: none; }

  .top-actions { display: flex; gap: 0.4rem; align-items: center; }
  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.6rem 1.1rem; box-shadow: var(--shadow); z-index: 100; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-weight: 600; }
  .toast.show { opacity: 1; }

  @media (max-width: 640px) {
    .toolbar { grid-template-columns: 1fr 1fr; }
    #search { grid-column: 1 / -1; border-radius: var(--radius-sm); }
    .fr-line { font-size: 1.2rem; }
    .ar-line { font-size: 1rem; }
    .card-actions button, .card-actions a { font-size: 0.75rem; padding: 0.45rem 0.1rem; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo"><span data-t="appName">Motsy</span></span>
    <span class="spacer"></span>
    <div class="top-actions">
      <button class="icon-btn" id="btn-lang" title="Language / اللغة">AR</button>
      <button class="icon-btn" id="btn-theme" title="Dark / light mode">🌙</button>
      <button class="icon-btn" id="btn-stop" title="Stop audio / إيقاف الصوت">🔇</button>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h1 data-t="title">Motsy — مفردات وأفعال للحياة اليومية في فرنسا</h1>
    <p data-t="subtitle">كلمات وأفعال وعبارات مترجمة للعربية والإنجليزية مع المستوى والسياق. اضغط 🔊 للنطق أو 🔁 للتكرار.</p>
  </div>

  <div class="toolbar">
    <input id="search" type="search" data-t="searchPlaceholder" placeholder="ابحث بالفرنسية أو العربية أو الإنجليزية...">
    <select class="ctl" id="rate" data-t="rateTitle" title="سرعة النطق">
      <option value="0.6">0.6×</option>
      <option value="0.8">0.8×</option>
      <option value="1" selected>1×</option>
      <option value="1.2">1.2×</option>
    </select>
    <select class="ctl" id="loopmode" data-t="loopModeTitle" title="محتوى التكرار">
      <option value="fr,ar,en" selected>🔁 فرنسي + عربي + إنجليزي</option>
      <option value="fr,ar">🔁 فرنسي + عربي</option>
      <option value="fr">🔁 فرنسي فقط</option>
    </select>
    <select class="ctl" id="sort" data-t="sortTitle" title="الترتيب">
      <option value="" data-t="sortDefault">الترتيب الافتراضي</option>
      <option value="az" data-t="sortAZ">أبجدي A → Z</option>
      <option value="za" data-t="sortZA">أبجدي Z → A</option>
    </select>
  </div>

  <div class="filters" id="filters"></div>
  <div class="stats" id="stats"></div>
  <div id="list"></div>
</main>

<footer>
  <a href="french.html" data-t="backToFrench">← العودة إلى دروس الفرنسية</a> · <span data-t="footerText">Motsy</span>
</footer>

<div class="toast" id="toast"></div>

<script src="data/vocab.js"></script>
<script src="data/vocab-batch-02.js"></script>

  };

  function t(key){ return UI[state.uiLang][key] || UI.en[key] || UI.ar[key] || key; }
  function ctxLabel(key){ var c = CTX_LABELS[key]; return c ? c[state.uiLang] || c.en : key; }
  function posLabel(key){ var p = POS_LABELS[key]; return p ? p[state.uiLang] || p.en : key; }
  function posLabelsText(key){ var p = POS_LABELS[key]; return p ? (p.ar + ' ' + p.en + ' ' + p.fr) : key; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function wrapWords(text, lang){
    if(!text) return '';
    return String(text).replace(/([A-Za-z0-9_\u00C0-\u024F\u0621-\u064A\u0750-\u077F]+(?:'[A-Za-z0-9_\u00C0-\u024F\u0621-\u064A\u0750-\u077F]+)?)/g, function(m){
      return '<span class="word-loop" data-lang="' + esc(lang) + '" data-text="' + esc(m) + '">' + esc(m) + '</span>';
    });
  }
  function firstLetter(fr){
    var s = String(fr || '').replace(/^[^A-Za-z\u00C0-\u024F]+/,'');
    s = s.replace(/^(Se |s'|S'|Le |La |Les |L'|Être |Etre |être )/i,'');
    if(!s) return '#';
    var base = s.charAt(0).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
    if(/[A-Z]/.test(base)) return base;
    return '#';
  }

  function init(){
    document.documentElement.dataset.theme = state.theme;
    document.documentElement.lang = state.uiLang;
    document.documentElement.dir = state.uiLang === 'ar' ? 'rtl' : 'ltr';
    rateSelect.value = state.rate;
    loopSelect.value = state.langs.join(',');
    sortSelect.value = state.sort;
    buildFilters();
    applyTranslations();
    render();
    bindEvents();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  function applyTranslations(){
    document.querySelectorAll('[data-t]').forEach(function(el){
      var key = el.dataset.t;
      if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = t(key);
      else if(el.tagName === 'SELECT') el.title = t(key);
      else el.textContent = t(key);
    });
    var LOOP_KEYS = { 'fr,ar,en': 'loopFrenchArabicEnglish', 'fr,ar': 'loopFrenchArabic', 'fr': 'loopFrenchOnly' };
    [].forEach.call(loopSelect.options, function(opt){ opt.textContent = t(LOOP_KEYS[opt.value]); });
  }

  function setUILang(lang){
    state.uiLang = lang;
    localStorage.setItem('vocab_ui_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('btn-lang').textContent = lang.toUpperCase();
    buildFilters();
    applyTranslations();
    render();
  }

  function buildFilters(){
    var levels = ['A1','A2','B1','B2'];
    var ctxs = {};
    VOCAB.forEach(function(v){ (v.contexts||[]).forEach(function(c){ ctxs[c] = (ctxs[c]||0)+1; }); });
    var sortedCtxs = Object.keys(ctxs).sort(function(a,b){ return ctxs[b]-ctxs[a] || a.localeCompare(b); });
    var poss = ['verb','adjective','noun','phrase','other'];
    var posCounts = {};
    VOCAB.forEach(function(v){ var p = v.pos || 'other'; posCounts[p] = (posCounts[p]||0)+1; });

    var letterCounts = {};
    VOCAB.forEach(function(v){ letterCounts[firstLetter(v.fr)] = (letterCounts[firstLetter(v.fr)]||0)+1; });
    var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    var html = '';

    // Letter chips: A-Z + all
    html += '<div class="filter-section"><div class="filter-label">' + esc(t('letters')) + '</div><div class="letters-row">';
    html += chipHtml('letter', '', t('all') + ' (' + VOCAB.length + ')', state.letters.length === 0, true);
    letters.forEach(function(l){ html += chipHtml('letter', l, l + ' (' + (letterCounts[l]||0) + ')', state.letters.indexOf(l) !== -1, true); });
    html += '</div></div>';

    // Context strip (horizontally scrollable)
    html += '<div class="filter-section"><div class="filter-label">' + esc(t('context')) + '</div><div class="contexts-strip">';
    sortedCtxs.forEach(function(c){ html += chipHtml('context', c, ctxLabel(c) + ' (' + ctxs[c] + ')', state.contexts.indexOf(c) !== -1); });
    html += '</div></div>';

    // Levels and POS
    html += '<div class="filter-section"><div class="filter-row">';
    html += '<span class="filter-label">' + esc(t('level')) + ':</span>';
    levels.forEach(function(l){ html += chipHtml('level', l, l, state.levels.indexOf(l) !== -1); });
    html += '<span style="width:0.4rem"></span>';
    html += '<span class="filter-label">' + esc(t('pos')) + ':</span>';
    poss.forEach(function(p){ if((posCounts[p]||0) > 0){ html += chipHtml('pos', p, posLabel(p) + ' (' + posCounts[p] + ')', state.pos.indexOf(p) !== -1); } });
    html += '</div></div>';

    filters.innerHTML = html;
  }

  function chipHtml(type, key, label, active, isLetter){
    var cls = 'filter-chip' + (active?' active':'') + (isLetter?' letter':'');
    return '<button class="' + cls + '" data-type="' + type + '" data-key="' + esc(key) + '">' + esc(label) + '</button>';
  }

  function filtered(){
    var q = state.q.trim().toLowerCase();
    var posMatchKey = q ? POS_BY_LABEL[q] : null;
    var items = VOCAB.filter(function(v){
      if(state.levels.length && state.levels.indexOf(v.level) === -1) return false;
      if(state.contexts.length && !v.contexts.some(function(c){ return state.contexts.indexOf(c) !== -1; })) return false;
      if(state.pos.length && state.pos.indexOf(v.pos || 'other') === -1) return false;
      if(state.letters.length && state.letters.indexOf(firstLetter(v.fr)) === -1) return false;
      if(!q) return true;
      if(posMatchKey) return v.pos === posMatchKey;
      var exArr = Array.isArray(v.ex) ? v.ex : (v.ex ? [v.ex] : []);
      var exText = exArr.map(function(e){ return (e.fr||'') + ' ' + (e.ar||'') + ' ' + (e.en||''); }).join(' ');
      var hay = (v.fr + ' ' + (v.ar||'') + ' ' + (v.en||'') + ' ' + (v.usage||'') + ' ' + (v.contexts||[]).join(' ') + ' ' + exText).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    if(state.sort === 'az') items.sort(function(a,b){ return a.fr.localeCompare(b.fr, 'fr'); });
    else if(state.sort === 'za') items.sort(function(a,b){ return b.fr.localeCompare(a.fr, 'fr'); });
    return items;
  }

  function aiQuery(v){
    var prompts = {
      ar: 'تصحيح العبارة الفرنسية "' + v.fr + '" وتحليلها كلمة كلمة مع ترجمة الكلمات والجملة إلى العربية والإنجليزية والفرنسية وإعطاء أمثلة شائعة في الحياة اليومية في فرنسا',
      en: 'Correct and analyze the French phrase "' + v.fr + '" word by word, translate the words and the phrase into Arabic, English, and French, and give common examples used in daily life in France',
      fr: 'Corriger et analyser la phrase française "' + v.fr + '" mot par mot, traduire les mots et la phrase en arabe, anglais et français, et donner des exemples courants de la vie quotidienne en France'
    };
    return prompts[state.uiLang] || prompts.en;
  }

  function render(){
    var items = filtered();
    stats.textContent = items.length + ' ' + t('results') + (state.q ? ' · "' + esc(state.q) + '"' : '');
    if(!items.length){ list.innerHTML = '<div class="empty">' + t('noResults') + '</div>'; return; }

    var end = Math.min(items.length, state.page * state.pageSize);
    var html = items.slice(0, end).map(function(v, idx){
      var key = 'v' + idx;
      var exArr = Array.isArray(v.ex) ? v.ex : (v.ex ? [v.ex] : []);
      var ex = exArr.map(function(e, ei){ return '<div class="example" data-ex="' + ei + '"><button class="loop-ex-btn" data-ex="' + ei + '" title="' + esc(t('loop')) + '">🔁</button><div class="line-wrap"><div class="ex-fr" dir="ltr">' + wrapWords(e.fr, 'fr') + '</div><button class="line-loop-btn" data-lang="fr" data-ex="' + ei + '" title="' + esc(t('loop')) + '">🔁</button></div><div class="ex-ar" dir="rtl">' + wrapWords(e.ar, 'ar') + '</div>' + (e.en ? '<div class="line-wrap"><div class="ex-en" dir="ltr">' + wrapWords(e.en, 'en') + '</div><button class="line-loop-btn" data-lang="en" data-ex="' + ei + '" title="' + esc(t('loop')) + '">🔁</button></div>' : '') + '</div>'; }).join('');
      var usage = v.usage ? '<div class="usage" dir="rtl">' + esc(v.usage) + '</div>' : '';
      return '<div class="vocab-card" data-key="' + esc(key) + '" data-idx="' + idx + '">' +
        '<div class="vocab-head">' +
          '<div class="vocab-main">' +
            '<div class="line-wrap"><div class="fr-line" dir="ltr">' + wrapWords(v.fr, 'fr') + '</div><button class="line-loop-btn" data-lang="fr" data-line="word" title="' + esc(t('loop')) + '">🔁</button></div>' +
            '<div class="ar-line" dir="rtl">' + wrapWords(v.ar, 'ar') + '</div>' +
            (v.en ? '<div class="line-wrap"><div class="en-line" dir="ltr">' + wrapWords(v.en, 'en') + '</div><button class="line-loop-btn" data-lang="en" data-line="word" title="' + esc(t('loop')) + '">🔁</button></div>' : '') +
            '<div class="meta">' +
              '<span class="level-pill">' + esc(v.level) + '</span>' +
              (v.pos ? '<span class="pos-pill">' + esc(posLabel(v.pos)) + '</span>' : '') +
              (v.contexts||[]).map(function(c){ return '<span class="ctx-pill">' + esc(ctxLabel(c)) + '</span>'; }).join('') +
            '</div>' +
            usage +
            ex +
          '</div>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="speak-btn" data-idx="' + idx + '">🔊 ' + t('speak') + '</button>' +
          '<button class="loop-btn" data-idx="' + idx + '">🔁 ' + t('loop') + '</button>' +
          '<a class="google-btn" href="https://www.google.com/search?udm=2&amp;q=' + encodeURIComponent(v.fr) + '" target="_blank" rel="noopener">🖼️ ' + t('searchImages') + '</a>' +
          '<a class="ai-btn" href="https://www.google.com/search?udm=50&amp;q=' + encodeURIComponent(aiQuery(v)) + '" target="_blank" rel="noopener">🔍 ' + t('searchAI') + '</a>' +
        '</div>' +
      '</div>';
    }).join('');
    if(end < items.length){
      html += '<button class="load-more-btn" id="load-more" data-t="loadMore">' + esc(t('loadMore')) + ' (' + (items.length - end) + ')</button>';
    }
    list.innerHTML = html;
  }

  function itemByIdx(idx){ return filtered()[idx]; }

  function nativeTTS(){
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) return window.Capacitor.Plugins.TextToSpeech;
    if(window.Capacitor && window.Capacitor.registerPlugin){
      window.Capacitor.Plugins = window.Capacitor.Plugins || {};
      window.Capacitor.Plugins.TextToSpeech = window.Capacitor.registerPlugin('TextToSpeech');
      return window.Capacitor.Plugins.TextToSpeech;
    }
    return null;
  }

  function pickVoice(lang){
    if(!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var code = VOICE_LANG[lang];
    var exact = voices.filter(function(v){ return v.lang && v.lang.replace('_','-') === code; })[0];
    if(exact) return exact;
    var prefix = code.split('-')[0];
    return voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; })[0] || null;
  }

  function nativeStop(){ var tts = nativeTTS(); if(!tts) return Promise.resolve(); return tts.stop(); }
  function nativeSpeak(text, lang){
    var tts = nativeTTS(); if(!tts) return Promise.reject('no tts');
    return tts.speak({ text: text, lang: VOICE_LANG[lang] || 'en-US', rate: state.rate, queueStrategy: 1 });
  }

  function utter(text, lang){
    var u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE_LANG[lang];
    u.rate = lang === 'fr' ? state.rate * 0.95 : state.rate;
    var v = pickVoice(lang);
    if(v) u.voice = v;
    return u;
  }

  function stopSpeech(){
    state.loop = null;
    speechRun++;
    if(nativeTTS()) nativeStop();
    else if('speechSynthesis' in window) window.speechSynthesis.cancel();
    highlight();
    document.getElementById('btn-stop').classList.remove('active');
  }

  function highlight(){
    var loop = state.loop;
    document.querySelectorAll('.vocab-card').forEach(function(el){ el.classList.toggle('playing', loop && loop.key === el.dataset.key && loop.lang == null && loop.ex == null); });
    document.querySelectorAll('.example').forEach(function(el){ el.classList.toggle('playing', loop && loop.key === el.closest('.vocab-card').dataset.key && loop.ex === parseInt(el.dataset.ex, 10) && loop.lang == null); });
    document.querySelectorAll('.loop-btn').forEach(function(btn){
      var on = loop && loop.key === btn.closest('.vocab-card').dataset.key && loop.lang == null && loop.ex == null;
      btn.classList.toggle('active', !!on);
      btn.textContent = (on ? '⏸ ' : '🔁 ') + t('loop');
    });
    document.querySelectorAll('.loop-ex-btn').forEach(function(btn){
      var ex = parseInt(btn.dataset.ex, 10);
      var on = loop && loop.key === btn.closest('.vocab-card').dataset.key && loop.lang == null && loop.ex === ex;
      btn.classList.toggle('active', !!on);
      btn.textContent = on ? '⏸' : '🔁';
    });
    document.querySelectorAll('.line-loop-btn').forEach(function(btn){
      var on = loop && loop.key === btn.closest('.vocab-card').dataset.key && loop.lang === btn.dataset.lang;
      if(on){
        if(btn.dataset.line === 'word') on = loop.ex == null;
        else if(btn.dataset.ex) on = loop.ex === parseInt(btn.dataset.ex, 10);
        else on = false;
      }
      btn.classList.toggle('active', !!on);
    });
  }

  function playSeq(seq, key, exIndex, lang, onDone){
    var i = 0;
    var run = ++speechRun;
    function step(){
      state.loop = { key: key, ex: exIndex, lang: lang };
      highlight();
      document.getElementById('btn-stop').classList.add('active');
    }
    function finish(){
      if(onDone) onDone();
      else { state.loop = null; highlight(); document.getElementById('btn-stop').classList.remove('active'); }
    }
    function cycleGuard(){
      if(!state.loop || state.loop.key !== key || state.loop.lang !== lang) return false;
      if(lang != null) return true;
      if(exIndex == null) return state.loop.ex == null;
      return state.loop.ex === exIndex;
    }
    if(nativeTTS()){
      nativeStop();
      (function next(){
        if(run !== speechRun) return;
        if(i >= seq.length){ finish(); return; }
        var s = seq[i++];
        step();
        nativeSpeak(s.text, s.lang).then(function(){ if(run===speechRun && cycleGuard()) setTimeout(next, 200); }).catch(function(){ if(run===speechRun && cycleGuard()) setTimeout(next, 200); });
      })();
      return;
    }
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    (function next(){
      if(run !== speechRun) return;
      if(i >= seq.length){ finish(); return; }
      var s = seq[i++];
      step();
      var u = utter(s.text, s.lang);
      u.onend = function(){ if(run===speechRun && cycleGuard()) setTimeout(next, 200); };
      u.onerror = function(){ if(run===speechRun && cycleGuard()) setTimeout(next, 200); };
      window.speechSynthesis.speak(u);
    })();
  }

  function lineText(entry, lang, line, exIndex){
    if(line === 'word') return entry[lang] || '';
    var exArr = Array.isArray(entry.ex) ? entry.ex : (entry.ex ? [entry.ex] : []);
    var e = exArr[exIndex];
    return e ? (e[lang] || '') : '';
  }

  function speakEntry(entry, langs, key, onDone){
    var seq = [];
    langs.forEach(function(l){ if(entry[l]) seq.push({ lang: l, text: entry[l] }); });
    var exArr = Array.isArray(entry.ex) ? entry.ex : (entry.ex ? [entry.ex] : []);
    exArr.forEach(function(e){
      langs.forEach(function(l){ if(e[l]) seq.push({ lang: l, text: e[l] }); });
    });
    playSeq(seq, key, null, null, onDone);
  }

  function speakExample(entry, exIndex, langs, key, onDone){
    var exArr = Array.isArray(entry.ex) ? entry.ex : (entry.ex ? [entry.ex] : []);
    var e = exArr[exIndex];
    if(!e){ if(onDone) onDone(); return; }
    var seq = [];
    langs.forEach(function(l){ if(e[l]) seq.push({ lang: l, text: e[l] }); });
    playSeq(seq, key, exIndex, null, onDone);
  }

  function toggleLoop(entry, key){
    if(state.loop && state.loop.key === key && state.loop.lang == null && state.loop.ex == null){ stopSpeech(); return; }
    stopSpeech();
    state.loop = { key: key, ex: null, lang: null };
    (function cycle(){
      if(!state.loop || state.loop.key !== key || state.loop.lang != null || state.loop.ex != null) return;
      speakEntry(entry, state.langs, key, function(){
        if(!state.loop || state.loop.key !== key || state.loop.lang != null || state.loop.ex != null) return;
        setTimeout(cycle, 700);
      });
    })();
  }

  function toggleExampleLoop(entry, exIndex, key){
    if(state.loop && state.loop.key === key && state.loop.lang == null && state.loop.ex === exIndex){ stopSpeech(); return; }
    stopSpeech();
    state.loop = { key: key, ex: exIndex, lang: null };
    (function cycle(){
      if(!state.loop || state.loop.key !== key || state.loop.lang != null || state.loop.ex !== exIndex) return;
      speakExample(entry, exIndex, state.langs, key, function(){
        if(!state.loop || state.loop.key !== key || state.loop.lang != null || state.loop.ex !== exIndex) return;
        setTimeout(cycle, 700);
      });
    })();
  }

  function speakWord(text, lang, onDone){
    var run = ++speechRun;
    function finish(){ if(onDone) onDone(); }
    document.getElementById('btn-stop').classList.add('active');
    if(nativeTTS()){
      nativeStop().then(function(){
        if(run !== speechRun) return;
        nativeSpeak(text, lang).then(function(){ if(run===speechRun) finish(); }).catch(function(){ if(run===speechRun) finish(); });
      }).catch(function(){ if(run===speechRun) finish(); });
      return;
    }
    if(!('speechSynthesis' in window)){ finish(); return; }
    window.speechSynthesis.cancel();
    var u = utter(text, lang);
    u.onend = function(){ if(run===speechRun) finish(); };
    u.onerror = function(){ if(run===speechRun) finish(); };
    window.speechSynthesis.speak(u);
  }

  function toggleWordLoop(text, lang, key){
    if(state.loop && state.loop.key === key && state.loop.lang === lang && state.loop.word === text){ stopSpeech(); return; }
    stopSpeech();
    state.loop = { key: key, word: text, lang: lang };
    (function cycle(){
      if(!state.loop || state.loop.key !== key || state.loop.lang !== lang || state.loop.word !== text) return;
      speakWord(text, lang, function(){
        if(!state.loop || state.loop.key !== key || state.loop.lang !== lang || state.loop.word !== text) return;
        setTimeout(cycle, 700);
      });
    })();
  }

  function toggleLineLoop(entry, lang, line, exIndex, key){
    var same = state.loop && state.loop.key === key && state.loop.lang === lang;
    if(same){
      if(line === 'word') same = state.loop.ex == null;
      else if(exIndex != null) same = state.loop.ex === exIndex;
      else same = false;
    }
    if(same){ stopSpeech(); return; }
    var text = lineText(entry, lang, line, exIndex);
    if(!text) return;
    stopSpeech();
    state.loop = { key: key, ex: line === 'word' ? null : exIndex, lang: lang };
    (function cycle(){
      var guard = state.loop && state.loop.key === key && state.loop.lang === lang;
      if(guard){
        if(line === 'word') guard = state.loop.ex == null;
        else guard = state.loop.ex === exIndex;
      }
      if(!guard) return;
      playSeq([{ lang: lang, text: text }], key, line === 'word' ? null : exIndex, lang, function(){
        guard = state.loop && state.loop.key === key && state.loop.lang === lang;
        if(guard){
          if(line === 'word') guard = state.loop.ex == null;
          else guard = state.loop.ex === exIndex;
        }
        if(!guard) return;
        setTimeout(cycle, 700);
      });
    })();
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }

  function bindEvents(){
    search.addEventListener('input', function(){ state.q = search.value; state.page = 1; render(); });
    rateSelect.addEventListener('change', function(){ state.rate = parseFloat(rateSelect.value); localStorage.setItem('vocab_rate', state.rate); });
    loopSelect.addEventListener('change', function(){ state.langs = loopSelect.value.split(','); localStorage.setItem('vocab_langs', loopSelect.value); });
    sortSelect.addEventListener('change', function(){ state.sort = sortSelect.value; localStorage.setItem('vocab_sort', state.sort); state.page = 1; render(); });

    document.getElementById('btn-stop').addEventListener('click', stopSpeech);
    document.getElementById('btn-theme').addEventListener('click', function(){
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = state.theme;
      localStorage.setItem('vocab_theme', state.theme);
    });
    document.getElementById('btn-lang').addEventListener('click', function(){
      var next = state.uiLang === 'ar' ? 'en' : state.uiLang === 'en' ? 'fr' : 'ar';
      setUILang(next);
    });

    filters.addEventListener('click', function(e){
      var chip = e.target.closest('.filter-chip'); if(!chip) return;
      var type = chip.dataset.type, key = chip.dataset.key;
      if(type === 'letter'){
        if(key === ''){ state.letters = []; }
        else if(state.letters.length === 1 && state.letters[0] === key){ state.letters = []; }
        else { state.letters = [key]; }
        localStorage.setItem('vocab_letters', JSON.stringify(state.letters));
        buildFilters();
        state.page = 1;
        render();
        return;
      }
      var arr = type === 'level' ? state.levels : type === 'context' ? state.contexts : state.pos;
      var i = arr.indexOf(key);
      if(i === -1) arr.push(key); else arr.splice(i, 1);
      buildFilters();
      state.page = 1;
      render();
    });

    list.addEventListener('click', function(e){
      if(e.target.closest('#load-more')){ state.page++; render(); return; }
      var card = e.target.closest('.vocab-card'); if(!card) return;
      var idx = parseInt(card.dataset.idx, 10);
      var entry = itemByIdx(idx);
      if(!entry) return;

      if(e.target.closest('.speak-btn')){ stopSpeech(); speakEntry(entry, state.langs, null); return; }
      if(e.target.closest('.loop-btn')){ toggleLoop(entry, card.dataset.key); return; }
      var exBtn = e.target.closest('.loop-ex-btn');
      if(exBtn){ toggleExampleLoop(entry, parseInt(exBtn.dataset.ex, 10), card.dataset.key); return; }
      var lineBtn = e.target.closest('.line-loop-btn');
      if(lineBtn){
        var ex = lineBtn.dataset.ex ? parseInt(lineBtn.dataset.ex, 10) : null;
        toggleLineLoop(entry, lineBtn.dataset.lang, ex == null ? 'word' : 'ex', ex, card.dataset.key);
        return;
      }
      var wordEl = e.target.closest('.word-loop');
      if(wordEl){ toggleWordLoop(wordEl.dataset.text, wordEl.dataset.lang, card.dataset.key); return; }
      /* image and AI search are <a> links; no extra click handling needed */
    });

    window.addEventListener('beforeunload', stopSpeech);
  }

  init();
})();
</script>
</body>
</html>
