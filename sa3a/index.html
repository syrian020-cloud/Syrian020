<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ساعتي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--radius:18px}
[data-theme=dark]{--bg:#0b1020;--bg2:#141b33;--card:#1a2340;--card2:#222c4f;--txt:#eef1ff;--dim:#8b93b8;--acc:#4f8cff;--acc2:#7c5cff;--ok:#2fd180;--danger:#ff5d6c;--line:#2a355e;--shadow:0 6px 24px rgba(0,0,0,.45)}
[data-theme=light]{--bg:#eef1fa;--bg2:#ffffff;--card:#ffffff;--card2:#f2f4fc;--txt:#141a33;--dim:#5d6480;--acc:#2f6fe0;--acc2:#6a4de0;--ok:#12a45e;--danger:#e0364a;--line:#dde2f2;--shadow:0 6px 18px rgba(30,40,90,.12)}
[data-theme=syria]{--bg:#06130c;--bg2:#0b2014;--card:#102a1b;--card2:#173826;--txt:#f2fff7;--dim:#9db8a8;--acc:#e8493f;--acc2:#35b46a;--ok:#2fd180;--danger:#ff5d6c;--line:#1f4530;--shadow:0 6px 24px rgba(0,0,0,.5)}
#clockWrap{position:relative}
#flagDeco{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80vw,54vh);aspect-ratio:1;border-radius:50%;z-index:-1;pointer-events:none;filter:brightness(.55) saturate(1.1)}
[data-theme=syria] #flagDeco{display:block}
[data-theme=syria] #analog .face{fill:rgba(0,0,0,.3);stroke:#050505}
[data-theme=syria] #analog .hand,[data-theme=syria] #analog .num,[data-theme=syria] #analog .tick{filter:drop-shadow(0 0 2.5px rgba(0,0,0,.95))}
[data-theme=syria] #analog .hand{stroke:#fff}
[data-theme=syria] #analog .hand.s{stroke:#ffd23e}
[data-theme=syria] #analog .dot{fill:#ffd23e}
[data-theme=syria] #analog .num{fill:#fff;stroke:#000;stroke-width:.8px;paint-order:stroke}
[data-theme=syria] #analog .digIn{fill:#fff;stroke:#000;stroke-width:.6px;paint-order:stroke}
[data-theme=syria] #analog .tick.big{stroke:#fff}
[data-theme=syria] #digital .dtime{color:#fff;text-shadow:0 0 4px #000,0 0 14px #000,0 2px 3px #000}
[data-theme=syria] #digital .dtime .sec{color:#ffe1b0;text-shadow:0 0 4px #000,0 0 10px #000}
[data-theme=syria] #digital .ddate,[data-theme=syria] #digital #nextAl{color:#fff;text-shadow:0 0 4px #000,0 0 10px #000,0 1px 2px #000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Cairo',system-ui,sans-serif;transition:background .3s,color .3s}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
header .logo{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px}
header .spacer{flex:1}
.hbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:6px 12px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;white-space:nowrap}
.hbtn:active{transform:scale(.95)}
main{flex:1;overflow:auto;position:relative}
.tabsec{display:none;height:100%;flex-direction:column}
.tabsec.on{display:flex}
/* ---- clock ---- */
#sec-clock{align-items:center;justify-content:flex-start;padding:16px 16px 8px;overflow-y:auto}
#sec-clock>*{flex:0 0 auto}
#sec-clock>#clockWrap{margin-top:auto}
#sec-clock>#timeRead{margin-bottom:auto}
#analog{width:min(80vw,46vh);height:min(80vw,46vh);display:none}
#analog.on{display:block}
#digital{display:none;text-align:center}
#digital.on{display:block}
#digital .dtime{font-family:'Orbitron',monospace;font-size:clamp(3rem,17vw,7rem);font-weight:700;letter-spacing:.05em;line-height:1;text-shadow:0 0 30px rgba(79,140,255,.35)}
#digital .dtime .sec{font-size:.35em;color:var(--dim);font-weight:500}
#digital .ddate{margin-top:14px;font-size:1.15rem;color:var(--dim);font-weight:600}
#analog .face{fill:var(--card);stroke:var(--line);stroke-width:2}
#analog .tick{stroke:var(--dim);stroke-width:1.5}
#analog .tick.big{stroke:var(--txt);stroke-width:3}
#analog .num{fill:var(--txt);font-size:26px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
#analog .hand{stroke:var(--txt);stroke-linecap:round}
#analog .hand.h{stroke-width:7}
#analog .hand.m{stroke-width:5}
#analog .hand.s{stroke:var(--acc);stroke-width:2.5}
#analog .dot{fill:var(--acc)}
#analog .digIn{fill:var(--dim);font-size:15px;font-weight:600;text-anchor:middle}
/* ---- alarms ---- */
#sec-alarms{padding:12px 14px 90px;gap:10px}
.alitem{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.alitem .tm{font-family:'Orbitron',monospace;font-size:1.7rem;font-weight:700}
.alitem.off .tm{color:var(--dim)}
.alitem .meta{flex:1;min-width:0}
.alitem .lb{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alitem .sub{color:var(--dim);font-size:.8rem;font-weight:600}
.switch{position:relative;width:48px;height:27px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:27px;cursor:pointer;transition:.25s}
.switch .sl:before{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:var(--dim);top:3px;inset-inline-start:4px;transition:.25s}
.switch input:checked+.sl{background:var(--ok);border-color:var(--ok)}
.switch input:checked+.sl:before{transform:translateX(-20px);background:#fff}
[dir=ltr] .switch input:checked+.sl:before{transform:translateX(20px)}
.mini-btn{background:none;border:none;color:var(--dim);font-size:1.15rem;cursor:pointer;padding:6px}
.empty{color:var(--dim);text-align:center;margin-top:60px;font-size:1.05rem}
.fab{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px) + 14px);inset-inline-end:18px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;font-size:1.8rem;cursor:pointer;box-shadow:0 6px 20px rgba(79,140,255,.45);z-index:6;line-height:1}
/* ---- calendar ---- */
#sec-cal{padding:12px 12px 20px;position:relative}
#calToday{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
#calToday .dtx{flex:1;text-align:center}
#calSpeak,#calMonB{background:none;border:none;font-size:1.2rem;cursor:pointer;padding:2px 6px;color:var(--acc)}
#calSpeak.on,#calMonB.on{color:var(--acc);outline:2px solid var(--acc);border-radius:8px}
#calCap{position:absolute;top:64px;left:12px;right:12px;z-index:5;font-size:.85rem;font-weight:700;line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;color:var(--acc);box-shadow:0 6px 18px rgba(0,0,0,.28);display:none}
#calCap.on{display:block}
.yrnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
.yrnav .yr{font-size:1.4rem;font-weight:800;font-family:'Orbitron',monospace;min-width:90px;text-align:center}
.yrnav button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;width:40px;height:36px;font-size:1.1rem;cursor:pointer}
#yrgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer}
.mini .mn{font-weight:800;font-size:.85rem;text-align:center;margin-bottom:5px;color:var(--txt)}
.mini .wd,.mini .gd{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini .wd div{text-align:center;font-size:.6rem;color:var(--txt);opacity:.75;font-weight:700}
.mini .gd div{text-align:center;font-size:.78rem;padding:4px 0;border-radius:6px;color:var(--txt);cursor:pointer;-webkit-tap-highlight-color:rgba(79,140,255,.35)}
.mini .gd div:active{background:rgba(79,140,255,.3)}
.mini .gd div.tdy{background:var(--acc);color:#fff;font-weight:800;border-radius:50%;outline:2px solid #fff;outline-offset:-2px;box-shadow:0 0 6px rgba(0,0,0,.35)}
.mini .gd div.alrm{color:var(--ok);font-weight:800}
#monthView{display:none}
#monthView.on{display:block}
#monthView .mnav{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#monthView .mnav .ttl{flex:1;text-align:center;font-weight:800;font-size:1.15rem}
#bigcal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
#bigcal .wd,#bigcal .gd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#bigcal .wd div{text-align:center;font-size:.75rem;color:var(--dim);font-weight:800;padding:4px 0}
#bigcal .gd div{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:rgba(79,140,255,.35)}
#bigcal .gd div:active{background:rgba(79,140,255,.3)}
#bigcal .gd div.tdy{background:var(--acc);color:#fff;font-weight:800;outline:3px solid #fff;outline-offset:-3px;box-shadow:0 0 10px rgba(0,0,0,.3)}
#bigcal .gd div.alrm span.dot{width:5px;height:5px;border-radius:50%;background:var(--ok);margin-top:2px}
/* ---- timer ---- */
.modesw{display:flex;gap:8px;justify-content:center;padding:12px 0}
.modesw button{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:9px 26px;font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
.modesw button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tinputs{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px 0 14px}
.tinputs input{width:80px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:14px 8px;text-align:center;font-family:'Orbitron',monospace;font-size:2rem;font-weight:700}
.tinputs span{font-size:2rem;color:var(--dim);font-weight:800}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.presets button{background:var(--card2);border:1px solid var(--line);color:var(--acc);border-radius:20px;padding:7px 15px;font-family:inherit;font-weight:700;cursor:pointer}
#laps .lrow{display:flex;justify-content:space-between;padding:8px 18px;border-bottom:1px solid var(--line);font-family:'Orbitron',monospace;color:var(--dim)}
#laps .lrow b{color:var(--txt)}
#permBanner{background:#3a2030;border:1px solid var(--danger);border-radius:14px;padding:12px;margin-bottom:10px;font-size:.9rem;font-weight:600;color:#ffb3bb}
#permBanner .pb{margin-top:8px;background:var(--danger);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-family:inherit;font-weight:800;cursor:pointer}
#nextAl{margin-top:14px;color:var(--ok);font-weight:700;font-size:1rem;min-height:1.4em}
#speakBtn{margin-top:18px;width:62px;height:62px;border-radius:50%;border:2px solid var(--acc);background:var(--card);font-size:1.6rem;cursor:pointer;box-shadow:0 0 18px rgba(79,140,255,.25)}
#speakBtn:active{background:var(--acc);transform:scale(.94)}
#speakCap{margin-top:12px;font-size:1.05rem;color:var(--txt);font-weight:600;text-align:center;max-width:90%;min-height:1.3em;line-height:1.5;opacity:0;transition:opacity .3s}
#speakCap.on{opacity:1}
#timeRead{margin-top:14px;width:min(94%,430px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.92rem;text-align:left}
#timeRead .tr-t{font-weight:700;text-align:center;margin-bottom:4px}
#timeRead .tr-lg{font-weight:700;margin:8px 0 2px;opacity:.9}
#timeRead .tr-r{display:flex;align-items:center;gap:8px;margin:2px 0;line-height:1.5}
#timeRead .tr-r button{background:none;border:none;color:var(--acc);font-size:1.05rem;cursor:pointer;padding:2px;flex:none}
#learnFold,#timePhFold{margin-top:10px;width:min(94%,430px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1rem;font-weight:800;cursor:pointer;text-align:center;color:var(--acc)}
#learnOv,#timePhOv{position:fixed;inset:0;z-index:410;background:var(--bg);display:none;flex-direction:column}
#learnOv.on,#timePhOv.on{display:flex}
#learnOv .loHead,#timePhOv .loHead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid var(--line);font-weight:800;font-size:1.05rem}
#learnOv .loBody,#timePhOv .loBody{flex:1;overflow-y:auto;padding:10px 12px 24px}
.lr-notes{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.88rem;line-height:1.8;margin-bottom:12px}
.lr-notes b{color:var(--acc)}
.lr-sec{font-weight:800;color:var(--acc);margin:14px 0 6px;font-size:.95rem}
.lr-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.lr-rh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lr-t{font-family:'Orbitron',monospace;font-weight:700;color:var(--acc);font-size:1rem}
.lr-rh button{margin-inline-start:auto;background:none;border:1px solid var(--line);border-radius:10px;color:var(--acc);font-size:.95rem;cursor:pointer;padding:2px 8px}
.lr-rh button.speaking{color:var(--ok);border-color:var(--ok);animation:pulse 1.2s infinite}
.lr-lg{display:flex;align-items:baseline;gap:6px;margin:3px 0;line-height:1.55;font-size:.9rem}
.lr-lg .fl{flex:0 0 1.2rem}
.lr-lg .rd{flex:1}
.lr-lg .rd div{display:flex;align-items:center;gap:6px}
.lr-lg .rd span{flex:1}
.lr-lg button{background:none;border:none;color:var(--acc);font-size:.9rem;cursor:pointer;padding:1px 4px;flex:none}

/* ---- weather ---- */
#wxShade{align-items:stretch;background:var(--bg)}
#wxSheet,#wxPhSheet{height:100%;max-height:none;width:100%;max-width:none;border-radius:0;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;overflow:hidden}
#wxPhBody{flex:1;overflow-y:auto;padding-bottom:20px}
#wxPhCap{display:none;font-size:.85rem;font-weight:700;line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;color:var(--acc);margin-bottom:8px}
#wxPhCap.on{display:block}
.wxPhCat{font-weight:800;font-size:1rem;color:var(--acc);margin:14px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.wxPhSub{font-weight:700;font-size:.9rem;color:var(--dim);margin:8px 0 2px;padding-inline-start:6px}
.wxDict{position:absolute;top:10px;inset-inline-start:10px;background:rgba(255,255,255,.18);border:none;border-radius:10px;font-size:1.1rem;cursor:pointer;color:#fff;padding:5px 8px;z-index:2}
.wxHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wxHead .lb{flex:1;font-weight:800;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wxHead button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 11px;font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer}
.wxHead button.on{border-color:var(--acc);color:var(--acc)}
#wxBody{flex:1;overflow-y:auto}
.wxNow{position:relative;background:linear-gradient(150deg,var(--acc),var(--acc2));color:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:var(--shadow)}
.wxNow .wc{font-size:1.9rem;line-height:1}
#wxCap{margin-top:10px;font-size:.85rem;font-weight:700;line-height:1.5;background:rgba(0,0,0,.28);border-radius:12px;padding:8px 10px;text-align:start;white-space:pre-wrap;display:none}
#wxCap.on{display:block}
.wxNow .wt{font-size:2.6rem;font-weight:800;margin-top:4px}
.wxNow .wd2{font-size:1rem;font-weight:700;opacity:.92;margin-top:2px}
.wxNow .wsub{font-size:.8rem;opacity:.85;margin-top:6px}
.wxRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.wxCell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.wxs{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--acc);padding:2px 4px}
.wxi{font-size:.7rem;opacity:.95;color:#fff;vertical-align:middle}
.wxs.wxon{outline:2px solid var(--acc);border-radius:8px}
.wxCell .wxs{position:absolute;top:2px;inset-inline-end:2px;font-size:.85rem;opacity:.85}
.wxCapB{font-size:.85rem;font-weight:700;line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;color:var(--acc);margin:6px 0 10px}
.wxCell .i{font-size:1.3rem}
.wxCell .v{font-weight:800;font-size:.9rem;margin-top:3px}
.wxCell .k{font-size:.62rem;color:var(--dim);font-weight:700;margin-top:2px}
.wxDay{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.wxDay .dn{width:64px;font-weight:800;font-size:.85rem}
.wxDay .di{font-size:1.5rem}
.wxDay .dd{flex:1;font-size:.72rem;color:var(--dim);font-weight:600}
.wxDay .tp{font-weight:800;font-size:.9rem;white-space:nowrap}
.wxDay .tp .lo{color:var(--dim);font-weight:600}
.wxHr{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.wxHr::-webkit-scrollbar{display:none}
.wxHp{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.wxHp .t{font-size:.7rem;font-weight:800;color:var(--acc)}
.wxHp .i{font-size:1.15rem;margin-top:3px}
.wxHp .v{font-size:.8rem;font-weight:800;margin-top:2px}
.wxTtl{font-weight:800;font-size:.95rem;margin:12px 0 6px}
/* ---- prettier mini calendar ---- */
.mini{overflow:hidden;position:relative}
.mini .mn{margin:-8px -8px 6px;padding:8px 4px;font-weight:800;font-size:.95rem;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.mini .wd div{opacity:.65}
.mini .gd div.hday{color:var(--danger);font-weight:800}
#bigcal .gd div.hday{color:var(--danger);font-weight:800}
#bigcal .gd div.hday.tdy{color:#fff}
#holyList{margin-top:10px}
#holyList .hd{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:.82rem;font-weight:700}
#holyList .hd .d{color:var(--danger);font-weight:800;white-space:nowrap}
#holyList .hd .hdai{background:linear-gradient(120deg,#4285f4,#9b72cb);color:#fff;text-decoration:none;border-radius:8px;padding:4px 9px;font-size:.72rem;font-weight:800;white-space:nowrap}

/* ---- dock & lessons ---- */
#dock{display:flex;gap:10px;width:100%;max-width:520px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.dcard{flex:0 0 auto;width:76px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;cursor:pointer}
.dcard .di{font-size:1.7rem}
.dcard .dn{font-size:.72rem;font-weight:700;color:var(--dim);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lessonShade{align-items:stretch;background:var(--bg)}
#lessonSheet{height:100%;max-height:none;width:100%;max-width:none;border-radius:0;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;overflow:hidden}
.lsHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lsHead .lb{flex:1;font-weight:800;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsHead button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 11px;font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer}
#lsGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;align-content:start}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px 8px;text-align:center;cursor:pointer;position:relative}
.lcard .li{font-size:2rem}
.lcard .ln{font-size:.78rem;font-weight:700;margin-top:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word;line-height:1.35;min-height:3.1em}
.lcard .lfimg{width:54px;height:54px;object-fit:cover;border-radius:12px;display:block;margin:0 auto;border:1px solid var(--line)}
.lcard .opt{position:absolute;top:2px;inset-inline-end:4px;background:none;border:none;color:var(--dim);font-size:1.05rem;cursor:pointer;padding:2px 6px}
#lsAct{display:none;gap:6px;flex:0 0 auto;padding-top:8px;border-top:1px solid var(--line)}
#lsAct button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 2px;font-family:inherit;font-size:.62rem;font-weight:800;cursor:pointer;white-space:nowrap}
#lsAct button .i{font-size:1.15rem}
#lsImg{flex:1;overflow-y:auto;text-align:start}
#lsImg .limg{text-align:center;margin-bottom:10px}
#lsImg .limg img{max-width:100%;max-height:34vh;border-radius:16px;border:1px solid var(--line)}
.phc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;position:relative}
.phc .pt{color:var(--acc);font-size:.75rem;font-weight:800;direction:ltr;text-align:start}
.phc .ps{font-size:1.05rem;font-weight:700;color:var(--txt);direction:auto}
.phc .pp{color:var(--dim);font-size:.85rem;margin-top:2px;direction:auto}
.phc .pa{color:var(--ok);font-size:.95rem;margin-top:4px;direction:auto}
.phc .pe{color:var(--dim);font-size:.85rem;margin-top:2px;direction:auto}
.phc .opt{position:absolute;top:4px;inset-inline-end:6px;background:none;border:none;color:var(--dim);font-size:1.05rem;cursor:pointer;padding:2px 6px}
#tplList{overflow-y:auto;max-height:32vh;margin-bottom:8px;flex:0 0 auto}
.tplhead{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px}
.tplname{font-size:.8rem;font-weight:800;color:var(--txt)}
.mini{background:var(--acc);border:none;color:#fff;border-radius:8px;padding:5px 12px;font-family:inherit;font-size:.75rem;font-weight:800;cursor:pointer}
.tplbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.78rem;color:var(--dim);white-space:pre-wrap;max-height:110px;overflow:auto;margin-bottom:4px;direction:auto;text-align:start}
.lmed{width:100%;max-height:40vh;border-radius:14px;background:#000;margin-bottom:6px}
audio.lmed{max-height:none}
.phc .pt{cursor:pointer}
.phc{cursor:pointer}
.phc:active{opacity:.85}
#cueBox{margin:10px 0 8px;padding:6px 2px;text-align:center;font-size:19px;min-height:1em}
#cueBox .qs{font-weight:800;color:var(--txt)}
#cueBox .qp{color:var(--dim);font-size:.75em;margin-top:2px}
#cueBox .qa{color:var(--ok);margin-top:5px;font-weight:700}
#cueBox .qe{color:var(--dim);margin-top:4px}
#cueBox .qt{color:var(--acc);font-size:.7em;font-weight:800;margin-bottom:4px}
.ctlGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.ctlGrid button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 2px;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit}
.ctlGrid button.on{border-color:var(--acc);color:var(--acc)}
.phrow{display:flex;gap:.5rem;align-items:flex-start;margin-top:.4rem;border-radius:12px;padding:.3rem .55rem}
.phflag{flex:none;font-size:1.3rem;line-height:1;background:none;border:none;cursor:pointer;padding:2px;font-family:inherit}
.phflag:active{transform:scale(.88)}
.phflag.speaking{outline:3px solid var(--acc);border-radius:10px}
.phrow .pht{flex:1;min-width:0;font-weight:700;line-height:1.4;overflow-wrap:anywhere;text-align:start}
.pht.wlg-ar{font-family:'Noto Kufi Arabic','Noto Naskh Arabic',Tahoma,sans-serif}
.pht.wlg-fr{font-family:Georgia,'Times New Roman',serif}
.pht.wlg-en{font-family:'Segoe UI',Roboto,sans-serif}
.pht .w{cursor:pointer;border-radius:6px;padding:0 1px}
.pht .w.speaking{background:var(--acc);color:#fff}
.phrow.lg-fr,.qb.lg-fr{background:var(--cap-fr-bg,transparent);color:var(--cap-fr-fg,var(--txt));border:1.5px solid var(--cap-fr-bd,transparent);font-family:var(--cap-fr-font,inherit);font-style:var(--cap-fr-style,normal)}
.phrow.lg-ar,.qb.lg-ar{background:var(--cap-ar-bg,transparent);color:var(--cap-ar-fg,var(--txt));border:1.5px solid var(--cap-ar-bd,transparent);font-family:var(--cap-ar-font,inherit);font-style:var(--cap-ar-style,normal)}
.phrow.lg-en,.qb.lg-en{background:var(--cap-en-bg,transparent);color:var(--cap-en-fg,var(--txt));border:1.5px solid var(--cap-en-bd,transparent);font-family:var(--cap-en-font,inherit);font-style:var(--cap-en-style,normal)}
.phrow.lg-x,.qb.lg-x{background:var(--cap-x-bg,transparent);color:var(--cap-x-fg,var(--txt));border:1.5px solid var(--cap-x-bd,transparent);font-family:var(--cap-x-font,inherit);font-style:var(--cap-x-style,normal)}
#cueBox .qb{border-radius:10px;padding:2px 8px;margin:3px auto;width:fit-content;max-width:100%}
#cueBox .cflag{cursor:pointer;margin-inline-end:6px;display:inline-block}
#cueBox .cflag.speaking{outline:2px solid var(--acc);border-radius:50%}
.lmed.fit-cover{object-fit:cover}
.lmed.fit-fill{object-fit:fill}
.lmed.fit-tall{max-height:62vh}
.vcrop{position:relative}
.vcrop.crop-on{overflow:hidden;border-radius:12px}
.vcrop.crop-on .lmed{object-fit:cover;object-position:top}
.phnote{color:var(--dim);font-size:.85rem;margin-top:4px;direction:auto}
.phim{margin-top:8px;text-align:center}
.phim .phim-w{position:relative;display:inline-block;max-width:100%}
.phim img{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.phim .opt{background:rgba(0,0,0,.55)!important;color:#fff!important;border-radius:50%;width:26px;height:26px;top:4px!important;inset-inline-end:4px!important}
.phbar{display:flex;gap:.35rem;align-items:center;background:var(--cap-bar,#fff1a8);border:1.5px solid #d9be5a;border-radius:14px;padding:.3rem .4rem;direction:ltr;justify-content:space-evenly;margin-top:.55rem}
.phnum{font-size:.95rem;font-weight:800;color:#1d1d1d;font-variant-numeric:tabular-nums;background:linear-gradient(#fffdf0,#ffedb0);border:2px solid #b98f1e;border-radius:12px;padding:.06rem .45rem;box-shadow:0 2px 0 #b98f1e;cursor:pointer;font-family:inherit}
.phnum.speaking{color:#b33939;border-color:#b33939}
.phic{flex:none;width:2rem;height:2rem;border-radius:50%;border:2px solid rgba(0,0,0,.18);font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 4px rgba(0,0,0,.15);font-family:inherit}
.phic:active{transform:scale(.88)}
.phic.ic-note{background:#fbbf24}
.phic.ic-ai{background:#7dd3fc}
.phic.ic-clip{background:#c4b5fd}
.phic.ic-img{background:#a7f3d0}
.phic.ic-rec{background:linear-gradient(145deg,#fda4af,#f43f5e);color:#fff;font-size:.9rem}
.phic.ic-say{background:#6ee7b7}
.phic.speaking{outline:3px solid var(--acc)}
/* ---- games (prolang quiz/listen/read-repeat) ---- */
.gameRow{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.gameRow button{flex:1;max-width:130px;background:var(--card);border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:8px 4px;font-family:inherit;font-size:.78rem;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.gameRow button .gi{font-size:1.3rem}
.btn{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:.7rem 1rem;color:var(--txt);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff}
.btn:disabled{opacity:.4}
.hidden{display:none}
.qz-ov{position:fixed;inset:0;z-index:420;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:.9rem .75rem;box-sizing:border-box}
.qz-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.qz-prog{font-weight:800;font-size:1.05rem}
.qz-flags{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.55rem;direction:ltr;margin-bottom:.5rem}
.qz-flag{text-align:center;font-size:1.4rem}
.qz-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.65rem .55rem;align-content:start;flex:1;direction:ltr}
.qz-card{border:2px solid var(--line);border-radius:18px;padding:.85rem .7rem;background:var(--card);color:var(--txt);cursor:pointer;font-size:1rem;line-height:1.5;text-align:center;user-select:none;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s}
.qz-card:active{transform:scale(.97)}
.qz-card.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc);transform:scale(1.02)}
.qz-card.speaking{outline:3px solid #f59e0b;outline-offset:1px}
.qz-card.done{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:#fff;pointer-events:none}
.qz-card.wrong{animation:qzShake .45s;border-color:#e0245e;background:#e0245e;color:#fff}
@keyframes qzShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qz-langs{display:flex;flex-direction:column;gap:.9rem;max-width:340px;margin:auto;width:100%}
.qz-langs .btn{width:100%;min-height:3.2rem;font-size:1.1rem}
.qz-end{margin:auto;text-align:center}
.qz-pct{font-size:4.2rem;font-weight:800;line-height:1}
.lz-stage{display:flex;flex-direction:column;align-items:center;gap:.8rem;width:100%;max-width:480px;margin:0 auto}
.lz-hero{position:relative;width:100%;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.15);background:linear-gradient(135deg,#14b8a6,#0ea5e9);transition:height .2s}
.lz-hero.s1{height:96px}.lz-hero.s2{height:150px}.lz-hero.s3{height:210px}.lz-hero.v{height:250px}
.lz-hero>img{display:block;width:100%;height:100%;object-fit:cover}
.lz-hero-tools{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:6px}
.lz-hero-btn{min-width:34px;height:34px;padding:0 8px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(10,12,30,.55);color:#fff;font-size:.9rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.lz-hero-btn.del{background:rgba(225,29,72,.85);border-color:transparent}
.lz-loop{width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 14px rgba(20,184,166,.4)}
.lz-loop.speaking{animation:lzPulse 1s infinite}
@keyframes lzPulse{0%,100%{box-shadow:0 0 0 0 rgba(20,184,166,.55)}50%{box-shadow:0 0 0 9px rgba(20,184,166,0)}}
.lz-opts{display:flex;flex-direction:column;gap:.6rem;width:100%}
.lz-tile{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:.7rem .6rem;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center;color:var(--txt);line-height:1.4;transition:all .15s}
.lz-tile.ok{border-color:#22c55e;background:rgba(34,197,94,.13)}
.lz-tile.bad{border-color:#ef4444;background:rgba(239,68,68,.1);animation:qzShake .45s}
.rr-wrap{display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:1rem .5rem;flex:1;justify-content:center;width:100%;max-width:520px;margin:0 auto}
.rr-text{font-size:1.65rem;font-weight:800;text-align:center;line-height:1.45;overflow-wrap:anywhere}
.rr-tr{opacity:.75;font-size:1.05rem;text-align:center;overflow-wrap:anywhere}
.rr-ctrl{display:flex;align-items:center;gap:.9rem}
.rr-ctrl .btn{flex:none;padding:.7rem .9rem}
.rr-count{font-size:1.5rem;font-weight:900;min-width:4.2rem;text-align:center}
.rr-plus{width:4.4rem;height:4.4rem;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:2.1rem;font-weight:900;font-family:inherit;box-shadow:0 4px 14px rgba(20,184,166,.4)}
.rr-plus.dim{opacity:.35}
.rr-sub{min-height:1.5rem;opacity:.85;text-align:center}
.rr-skip{text-decoration:underline;cursor:pointer;color:var(--acc)}
.rr-wrap>.btn{flex:none;width:auto;min-width:12rem}
.rr-w{cursor:pointer}
.rr-w.speaking{color:var(--acc);text-decoration:underline}
.rr-score{font-size:1.6rem;font-weight:800;text-align:center;margin:.4rem 0 .2rem}
.lz-nav{display:flex;gap:.6rem;align-items:center}
.lz-nav button{min-width:52px;height:44px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.lz-nav button.on{border-color:var(--acc);background:rgba(20,184,166,.15);color:var(--acc)}
.lz-verdict{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:.6rem .8rem;text-align:center;background:var(--card);overflow-y:auto}
.lz-face{font-size:2rem;line-height:1}
.lz-v-fr{font-weight:800;font-size:1.05rem;color:var(--txt)}
.lz-verdict.ok .lz-v-fr{color:#16a34a}
.lz-verdict.bad .lz-v-fr{color:#ef4444}
.lz-v-tr{font-size:.9rem;font-weight:700;color:var(--dim)}
.lz-v-line{display:flex;align-items:center;justify-content:center;gap:.4rem;max-width:100%}
.lz-v-loop{flex:none;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.lz-v-loop.speaking{animation:lzPulse 1s infinite}

#noteModal{position:fixed;inset:0;z-index:60;background:#0e1330;display:none;flex-direction:column}
#noteModal.show{display:flex}
.note-topbar{display:flex;align-items:center;gap:.35rem;padding:.5rem .6rem;background:#131a3d;flex-wrap:wrap}
.note-icon{border:1px solid #2a3568;background:#1a2450;color:#fff;border-radius:10px;min-width:2rem;height:2rem;font-size:1rem;display:flex;align-items:center;justify-content:center}
.note-icon.active{background:#7c5cff;border-color:#7c5cff}
.note-icon.danger{background:#a33}
.note-title{font-weight:700;color:#fff;font-size:.95rem}
.note-palette{display:none;flex-wrap:wrap;gap:.45rem;padding:.5rem .6rem;background:#10173a}
.note-palette.show{display:flex}
.note-tool{width:1.5rem;height:1.5rem;border-radius:8px;border:2px solid transparent;padding:0}
.note-tool.active{border-color:#fff;transform:scale(1.15)}
#notePhraseBar{display:flex;flex-wrap:wrap;gap:.4rem;padding:.4rem .6rem;background:#0e1330}
.note-phrase-card{position:relative;flex:1 1 46%;min-width:9rem;background:#f4ecd8;color:#1c1c1c;border-radius:10px;padding:.5rem .7rem .9rem;font-size:.95rem}
.note-phrase-card.ar{direction:rtl}
.note-loop{position:absolute;bottom:.3rem;inset-inline-end:.3rem;border:none;background:#1e2a4a;color:#fff;width:1.7rem;height:1.7rem;border-radius:9px;font-size:.8rem;padding:0}
.note-canvas-wrap{flex:1;min-height:0;position:relative;background:#fff}
.note-canvas-wrap.lined{background-color:#fffdf5;background-image:linear-gradient(to right,transparent 0,transparent 2.6rem,#f4a3a3 2.6rem,#f4a3a3 calc(2.6rem + 2px),transparent calc(2.6rem + 2px)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.2rem - 1px),#9fc5e8 calc(2.2rem - 1px),#9fc5e8 2.2rem)}
html[dir=rtl] .note-canvas-wrap.lined{background-image:linear-gradient(to left,transparent 0,transparent 2.6rem,#f4a3a3 2.6rem,#f4a3a3 calc(2.6rem + 2px),transparent calc(2.6rem + 2px)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.2rem - 1px),#9fc5e8 calc(2.2rem - 1px),#9fc5e8 2.2rem)}
#noteCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.phn-note{margin-top:.5rem}
.phn-note textarea{width:100%;min-height:56px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:6px 8px;font-family:inherit;font-size:.9rem}
.phn-note .b{margin-top:4px;padding:6px 14px;font-size:.8rem}
#tplText{width:100%;flex:1;min-height:28vh;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:10px;font-family:inherit;font-size:.85rem;resize:none;direction:auto}
.phfld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px;font-family:inherit;font-size:1rem;margin-bottom:8px}
#lsEmpty{color:var(--dim);text-align:center;margin-top:40px;font-weight:600}
/* ---- bottom nav ---- */
nav{display:flex;background:var(--bg2);border-top:1px solid var(--line);flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:.8rem;font-weight:700;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ico{font-size:1.35rem}
nav button.on{color:var(--acc)}
/* ---- sheets / modals ---- */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;align-items:flex-end;justify-content:center}
.shade.on{display:flex}
.sheet{background:var(--bg2);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 14px;font-size:1.15rem}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.85rem;font-weight:700;color:var(--dim);margin-bottom:6px}
.fld input[type=text],.fld input[type=time]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px;font-family:inherit;font-size:1.05rem}
.fld input[type=time]{font-family:'Orbitron',monospace;font-size:1.5rem;text-align:center;font-weight:700}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips .dc{flex:1;min-width:38px;text-align:center;padding:8px 2px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.78rem;font-weight:700;cursor:pointer;color:var(--dim)}
.daychips .dc.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sndrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.sndrow.on{border-color:var(--acc);background:var(--card2)}
.sndrow .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--dim);flex:0 0 auto}
.sndrow.on .r{border-color:var(--acc);background:var(--acc)}
.sndrow .nm{flex:1;font-weight:700;font-size:.95rem}
.sndrow .pv{background:none;border:none;color:var(--acc);font-size:1.2rem;cursor:pointer;padding:4px}
.rowbtns{display:flex;gap:10px;margin-top:16px}
.rowbtns .b{flex:1;padding:13px;border-radius:14px;border:none;font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer}
.b.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.b.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)!important}
.b.danger{background:var(--danger);color:#fff}
.mitem{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:700}
.mitem:last-child{border-bottom:none}
.mitem .ico{font-size:1.2rem;width:28px;text-align:center}
/* ---- ringing overlay ---- */
#ringShade{z-index:50;align-items:center}
#cfShade{z-index:800;align-items:center}
#ringCard{background:var(--bg2);border-radius:26px;padding:34px 26px;width:min(90vw,420px);text-align:center;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,140,255,.5)}50%{box-shadow:0 0 0 22px rgba(79,140,255,0)}}
#ringCard .rtc{font-family:'Orbitron',monospace;font-size:3.6rem;font-weight:700;line-height:1.1}
#ringCard .rlb{margin:10px 0 24px;font-size:1.2rem;font-weight:700;color:var(--dim)}
#ringCard .ico{font-size:3rem;animation:ring .8s infinite alternate}
@keyframes ring{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
/* toast */
#toast{position:fixed;bottom:calc(64px + 16px);left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 20px;border-radius:14px;font-weight:700;display:none;z-index:60;box-shadow:var(--shadow)}
</style>
</head>
<body>
<header>
  <div class="logo">⏰ <span id="hTitle">ساعتي</span></div>
  <div class="spacer"></div>
  <button class="hbtn" id="styleBtn" title="Clock style">🕐</button>
  <button class="hbtn" id="themeBtn" title="Theme">🌙</button>
  <button class="hbtn" id="muteBtn" title="Mute all">🔇</button>
  <button class="hbtn" id="langBtn">🌐 EN</button>
  <button class="hbtn" id="menuBtn">⋮</button>
</header>
<main>
  <section class="tabsec on" id="sec-clock">
    <div id="dock"></div>
    <div id="clockWrap"><img id="flagDeco" src="flag.png" alt=""><svg id="analog" viewBox="0 0 300 300"></svg>
    <div id="digital"><div class="dtime"><span id="dh">00</span><span class="sec" id="ds">:00</span></div><div class="ddate" id="ddate"></div><div id="nextAl"></div></div></div>
    <button id="speakBtn">🔊</button>
    <div id="timeRead"></div>
    <div id="learnFold"></div>
    <div id="timePhFold"></div>
  </section>
  <section class="tabsec" id="sec-alarms">
    <div id="permBanner" style="display:none"></div>
    <div id="alarmList"></div>
    <button class="fab" id="addAlarm">+</button>
  </section>
  <section class="tabsec" id="sec-timer">
    <div class="modesw"><button class="on" id="modeTimer"></button><button id="modeStop"></button></div>
    <div id="timerPane">
      <div id="tPick">
        <div class="tinputs"><input type="number" id="inH" min="0" max="99" value="0"><span>:</span><input type="number" id="inM" min="0" max="59" value="5"><span>:</span><input type="number" id="inS" min="0" max="59" value="0"></div>
        <div class="presets">
          <button data-s="60">1m</button><button data-s="300">5m</button><button data-s="600">10m</button>
          <button data-s="900">15m</button><button data-s="1800">30m</button><button data-s="3600">60m</button>
        </div>
      </div>
      <div id="tRun" style="display:none;text-align:center">
        <svg width="250" height="250" viewBox="0 0 250 250"><circle cx="125" cy="125" r="110" fill="none" stroke="var(--card2)" stroke-width="10"/><circle id="tArc" cx="125" cy="125" r="110" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 125 125)"/></svg>
        <div id="tLeft" style="font-family:'Orbitron',monospace;font-size:3rem;font-weight:700;margin-top:-170px;position:relative"></div>
      </div>
      <div class="rowbtns" style="margin-top:22px">
        <button class="b ghost" id="tReset" style="display:none"></button>
        <button class="b primary" id="tGo"></button>
      </div>
    </div>
    <div id="stopPane" style="display:none;text-align:center">
      <div id="swTime" style="font-family:'Orbitron',monospace;font-size:3.4rem;font-weight:700;margin:30px 0 20px">00:00<span style="font-size:.4em;color:var(--dim)">.00</span></div>
      <div class="rowbtns"><button class="b ghost" id="swLap"></button><button class="b primary" id="swGo"></button></div>
      <div id="laps" style="margin-top:16px"></div>
    </div>
  </section>
  <section class="tabsec" id="sec-cal">
    <div id="calToday"><button id="calSpeak">🔊</button><span class="dtx"></span><button id="calMonB">📅🔊</button></div>
    <div id="calCap"></div>
    <div id="yearView">
      <div class="yrnav"><button id="yrPrev">‹</button><div class="yr" id="yrNum"></div><button id="yrNext">›</button></div>
      <div id="yrgrid"></div>
    </div>
    <div id="monthView">
      <div class="mnav"><button class="hbtn" id="backYear">‹ <span id="tBack"></span></button><div class="ttl" id="mTitle"></div><span style="width:60px"></span></div>
      <div id="bigcal"></div><div id="holyList"></div>
    </div>
  </section>
</main>
<nav>
  <button class="on" data-tab="clock"><span class="ico">🕐</span><span class="t"></span></button>
  <button data-tab="alarms"><span class="ico">⏰</span><span class="t"></span></button>
  <button data-tab="timer"><span class="ico">⏱️</span><span class="t"></span></button>
  <button data-tab="cal"><span class="ico">📅</span><span class="t"></span></button>
</nav>

<!-- alarm editor -->
<div class="shade" id="editShade"><div class="sheet">
  <h3 id="edTitle"></h3>
  <div class="fld"><label id="lTime"></label><input type="time" id="edTime" value="07:30"></div>
  <div class="fld"><label id="lLabel"></label><input type="text" id="edLabel" maxlength="60"></div>
  <div class="fld"><label id="lRepeat"></label><div class="daychips" id="edDays"></div><div style="margin-top:6px;font-size:.78rem;color:var(--dim)" id="onceHint"></div></div>
  <div class="fld"><label id="lSound"></label><div id="edSounds"></div></div>
  <div class="fld" style="display:flex;align-items:center;justify-content:space-between"><label id="lVib" style="margin:0"></label>
    <label class="switch"><input type="checkbox" id="edVib" checked><span class="sl"></span></label></div>
  <div class="rowbtns"><button class="b danger" id="edDel" style="display:none"></button><button class="b ghost" id="edCancel"></button><button class="b primary" id="edSave"></button></div>
</div></div>

<!-- menu -->
<div class="shade" id="menuShade"><div class="sheet">
  <h3 id="mTitle2"></h3>
  <div id="menuItems"></div>
</div></div>

<!-- confirm -->
<div class="shade" id="cfShade"><div class="sheet" style="text-align:center">
  <h3 id="cfText" style="margin:18px 0"></h3>
  <div class="rowbtns"><button class="b ghost" id="cfNo"></button><button class="b danger" id="cfYes"></button></div>
</div></div>

<!-- weather -->
<div class="shade" id="wxShade"><div class="sheet" id="wxSheet">
  <div class="wxHead"><button id="wxBack">‹</button><div class="lb" id="wxLoc">…</div>
    <button id="wxSpeak" title="speak">🔊</button><button id="wxCity" title="city">🔍</button><button id="wxRef" title="refresh">↻</button></div>
  <div id="wxBody"></div>
</div></div>
<!-- weather phrases folder -->
<div class="shade" id="wxPhShade"><div class="sheet" id="wxPhSheet">
  <div class="wxHead"><button id="wxPhBack">‹</button><div class="lb" id="wxPhTtl"></div></div>
  <div id="wxPhCap"></div>
  <div id="wxPhBody"></div>
</div></div>
<!-- lessons browser -->
<div id="learnOv"><div class="loHead"><button class="hbtn" id="learnX">✕</button><span id="learnTitle"></span></div><div class="loBody" id="learnBody"></div></div>
<div id="timePhOv"><div class="loHead"><button class="hbtn" id="timePhX">✕</button><span id="timePhTitle"></span></div><div class="loBody" id="timePhBody"></div></div>
<div class="shade" id="lessonShade"><div class="sheet" id="lessonSheet">
  <div class="lsHead"><button id="lsBack">‹</button><div class="lb" id="lsPath"></div>
    <button id="lsAddF" title="folder">📁+</button><button id="lsAddL" title="lesson">📄+</button></div>
  <div id="lsGrid"></div>
  <div id="lsImg" style="display:none"></div>
  <div id="lsAct"><button id="lsLine"></button><button id="lsTpl"></button><button id="lsMedAdd"></button><button id="lsImgAdd"></button><button id="lsCopy"></button><button id="lsPlay"></button></div>

<!-- item options -->
<div class="shade" id="lsOptShade"><div class="sheet">
  <h3 id="lsOptName"></h3>
  <div class="rowbtns"><button class="b ghost" id="lsOptRename"></button><button class="b danger" id="lsOptDel"></button></div>
  <div class="rowbtns"><button class="b ghost" id="lsOptImg"></button><button class="b danger" id="lsOptImgDel"></button></div>
  <div class="rowbtns"><button class="b ghost" id="lsOptCancel" style="flex:1"></button></div>
</div></div>
<!-- phrase add -->
<div class="shade" id="phShade"><div class="sheet" style="text-align:center">
  <h3 id="phTitle"></h3>
  <input type="text" id="phT" class="phfld" dir="ltr" style="text-align:center">
  <input type="text" id="phOrig" class="phfld" dir="auto">
  <input type="text" id="phPron" class="phfld" dir="auto">
  <input type="text" id="phAr" class="phfld" dir="auto">
  <input type="text" id="phEn" class="phfld" dir="auto">
  <div class="rowbtns"><button class="b ghost" id="phNo"></button><button class="b primary" id="phYes"></button></div>
</div></div>
<!-- template paste -->
<div class="shade" id="tplShade"><div class="sheet" style="height:92vh;display:flex;flex-direction:column;max-width:640px">
  <h3 id="tplTitle" style="margin-bottom:8px"></h3>
  <input type="text" id="tplName" class="phfld" style="display:none;flex:0 0 auto" dir="auto">
  <div id="tplList"></div>
  <textarea id="tplText" dir="auto"></textarea>
  <div class="rowbtns" style="flex:0 0 auto;margin-top:10px"><button class="b ghost" id="tplNo"></button><button class="b primary" id="tplYes"></button></div>

<!-- text ask -->
<div id="noteModal">
  <div class="note-topbar">
    <button type="button" class="note-icon" id="noteClose">←</button>
    <span class="note-title">📓</span><span style="flex:1"></span>
    <button type="button" class="note-icon" id="notePaper">📓</button>

    <button type="button" class="note-tool" data-color="#43a047" style="background:#43a047"></button>
    <button type="button" class="note-tool" data-color="#00acc1" style="background:#00acc1"></button>
    <button type="button" class="note-tool" data-color="#1e88e5" style="background:#1e88e5"></button>
    <button type="button" class="note-tool" data-color="#3949ab" style="background:#3949ab"></button>
    <button type="button" class="note-tool" data-color="#8e24aa" style="background:#8e24aa"></button>
    <button type="button" class="note-tool" data-color="#d81b60" style="background:#d81b60"></button>
    <button type="button" class="note-tool" data-color="#6d4c41" style="background:#6d4c41"></button>
    <button type="button" class="note-tool" data-color="#9e9e9e" style="background:#9e9e9e"></button>
  </div>
  <div id="notePhraseBar"></div>
  <div id="noteWrap" class="note-canvas-wrap plain"><canvas id="noteCanvas"></canvas></div>
</div>

</div></div>

/* =============== custom sound store (IndexedDB) =============== */
const idb={_d:null,
 open(){return this._d||(this._d=new Promise((res,rej)=>{const q=indexedDB.open('sa3a-db',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))},
 async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const x=d.transaction('s','readwrite').objectStore('s').put(v,k);x.onsuccess=res;x.onerror=()=>rej(x.error)})},
 async get(k){const d=await this.open();return new Promise((res,rej)=>{const x=d.transaction('s').objectStore('s').get(k);x.onsuccess=()=>res(x.result);x.onerror=()=>rej(x.error)})}
};
let customBlob=null;
async function loadCustomBlob(){try{const r=await idb.get('custom');if(r&&r.blob)customBlob=r.blob;}catch(e){}}
idb.del=async function(k){const d=await this.open();return new Promise((res,rej)=>{const x=d.transaction('s','readwrite').objectStore('s').delete(k);x.onsuccess=res;x.onerror=()=>rej(x.error)})};

}
function renderLessons(){
 $('lsBack').style.visibility=lsStack.length?'visible':'hidden';
 $('lsPath').textContent=t('lsTitle')+(lsStack.length?' / '+lsStack.map(n=>n.n).join(' / '):'');
 $('lsAddF').style.display='';$('lsAddL').style.display='';$('lsAct').style.display='none';
 $('lsImg').style.display='none';$('lsGrid').style.display='';
 const g=$('lsGrid');g.innerHTML='';
 const items=LSROOT();
 if(!items.length){g.innerHTML='<div id="lsEmpty" style="grid-column:1/-1">'+esc(t('emptyLs'))+'</div>';return}
 for(const n of items){
  const c=document.createElement('div');c.className='lcard';
  c.innerHTML='<div class="li">'+(n.t==='f'?'📁':'📖')+'</div><div class="ln">'+esc(n.n)+'</div><button class="opt">⋮</button>';
  const liEl=c.querySelector('.li');
  idb.get('limg_'+n.id).then(r=>{if(r&&r.blob){const im=new Image();im.src=URL.createObjectURL(r.blob);im.className='lfimg';liEl.textContent='';liEl.appendChild(im)}}).catch(()=>{});
  c.onclick=()=>{if(n.t==='f'){lsStack.push(n);renderLessons()}else showLesson(n)};
  c.querySelector('.opt').onclick=e=>{e.stopPropagation();openItemOpt(n)};
  g.appendChild(c);
 }
}

function rrClearSave(n){try{localStorage.removeItem(rrKey(n))}catch(e){}}

 ov.innerHTML='<div class="qz-top"><button class="mini" id="rr-exit">✕</button>'+

  '<div id="rr-body" style="display:flex;flex:1;flex-direction:column;overflow:auto"></div>';
 document.body.appendChild(ov);
 $('rr-exit').onclick=closeRR;
 $('rr-note').onclick=function(){const p=window.__gNoteP;openNote('gnote_'+(p&&p.id||'scratch'),p||null,this)};
 const body=$('rr-body');
 function useNode(nd){
 const items=gItems(nd);
 if(!items.length){toast(t('quizNoPhrases'));return}
 const langs=rrLangsOf(items,nd);
 function start(lang,mode,idx,cnt){rr={l:nd,items,lang,mode,i:idx,count:cnt||0,listenTok:0};rrSave();rrShow()}
 function modePick(lang){
  body.innerHTML='<div class="qz-langs"><h3 style="text-align:center;margin:0">'+esc(t('rrModeT'))+'</h3>'+
   '<button class="btn primary" id="rr-mL">'+esc(t('rrModeL'))+'</button>'+
   '<button class="btn" id="rr-mR">'+esc(t('rrModeR'))+'</button></div>';
  $('rr-mL').onclick=()=>start(lang,'l',0,0);
  $('rr-mR').onclick=()=>start(lang,'r',0,0)}
 function pickers(){
  const saved=rrSavedGet(nd);
  if(saved&&saved.i>0&&saved.i<items.length&&langs.indexOf(saved.l)>=0){
   body.innerHTML='<div class="qz-langs"><h3 style="text-align:center;margin:0">'+esc(t('rrTitle'))+'</h3>'+
    '<button class="btn primary" id="rr-resume">'+esc(t('rrResume'))+' ('+saved.i+'/'+items.length+')</button>'+
    '<button class="btn" id="rr-restart">'+esc(t('rrNew'))+'</button></div>';
   $('rr-resume').onclick=()=>start(saved.l,saved.m||'l',saved.i,saved.c||0);
   $('rr-restart').onclick=()=>{rrClearSave(nd);pickers()};return}
  body.innerHTML='<div class="qz-langs"><h3 style="text-align:center;margin:0">'+esc(t('rrPickLang'))+'</h3>'+
   langs.map(g=>{const c=items.filter(m=>m[g]).length;
    return '<button class="btn" data-lang="'+g+'">'+gFlag(g)+' '+g.toUpperCase()+' — '+c+'</button>'}).join('')+'</div>';
  body.querySelectorAll('button[data-lang]').forEach(b=>{b.onclick=()=>modePick(b.dataset.lang)})}
 pickers()}
 if(direct)useNode(n);else gameSrcPick(body,useNode)}
function rrShow(){
 const body=$('rr-body');
 if(!rr||!body)return;
 rrStopVoice();
 if(rr.i>=rr.items.length){rrEnd();return}
 const m=rr.items[rr.i],text=m[rr.lang]||'';
 window.__gNoteP=m;
 const trans=Object.keys(m).filter(k=>k!==rr.lang&&m[k])
  .map(k=>'<div class="rr-tr" dir="'+rrDir(k)+'">'+esc(gFlag(k)+' '+m[k])+'</div>').join('');
 const wordsHtml=(text||'').split(/\s+/).filter(Boolean).map(w=>'<span class="rr-w">'+esc(w)+'</span>').join(' ');
 $('rr-prog').textContent=(rr.i+1)+'/'+rr.items.length+' · '+t('rrTitle');
 body.innerHTML='<div class="rr-wrap">'+
  '<div class="rr-text" dir="'+rrDir(rr.lang)+'">'+wordsHtml+'</div>'+trans+
  '<div class="rr-ctrl">'+
   '<button class="btn" id="rr-hear" title="'+esc(t('rrHear'))+'">🔊</button>'+
   '<div class="rr-count" id="rr-count">'+rr.count+'/5</div>'+
   '<button class="rr-plus" id="rr-plus">+</button>'+
  '</div>'+
  '<div class="rr-sub" id="rr-sub"></div>'+
  '<button class="btn" id="rr-slow" title="'+esc(t('rrSlow'))+'">🐢</button>'+
  '<button class="btn primary hidden" id="rr-next">⏭ '+esc(t('gNext'))+'</button>'+
  '</div>';
 const plus=$('rr-plus'),hear=$('rr-hear'),nextB=$('rr-next'),sub=$('rr-sub'),cnt=$('rr-count');
 hear.onclick=()=>gspeak(text,rr.lang,hear);
 nextB.onclick=()=>rrAdvance();
 if(rr.count>=5){sub.textContent=t('rrWell');nextB.classList.remove('hidden')}
 else if(rr.mode==='l'){plus.disabled=true;plus.classList.add('dim');rrListen5(text,plus,sub)}
 plus.onclick=()=>{if(!rr||rr.count>=5)return;
  rr.count++;cnt.textContent=rr.count+'/5';rrSave();

   setTimeout(()=>{if(rr&&rr.count>=5)rrAdvance()},1400)}};
 body.querySelectorAll('.rr-w').forEach(ws=>{ws.onclick=()=>gspeak(ws.textContent,rr.lang,ws)});
 $('rr-slow').onclick=function(){gspeakSlow(text,rr.lang,this)}}
function rrListen5(text,plus,sub){
 const tok=++rr.listenTok;let k=0;
 const unlock=()=>{plus.disabled=false;plus.classList.remove('dim');sub.textContent=t('rrYourTurn')};
 (function one(){
  if(!rr||tok!==rr.listenTok)return;
  if(k>=5){unlock();return}
  k++;
  sub.innerHTML=esc(t('rrListenN'))+' '+k+'/5 · <span class="rr-skip" id="rr-skip">'+esc(t('rrSkip'))+'</span>';
  const sk=$('rr-skip');
  if(sk)sk.onclick=()=>{if(!rr)return;rr.listenTok++;if(window.EdgeTTS)EdgeTTS.stop();unlock()};
  gspeakOnce(text,rr.lang).then(()=>{if(rr&&tok===rr.listenTok)setTimeout(one,350)})})()}
function rrAdvance(){if(!rr)return;rr.i++;rr.count=0;rrSave();rrShow()}
function rrEnd(){
 const body=$('rr-body');
 if(!rr||!body)return;
 rrStopVoice();rrClearSave(rr.l);
 body.innerHTML='<div class="qz-langs"><h3 style="text-align:center;margin:0">'+esc(t('quizScore'))+'</h3>'+

function curCueOf(el,n){const c=cuesOf(n);let ci=-1;for(let i=0;i<c.length;i++)if(tSec(c[i].t)<=el.currentTime)ci=i;return{c,ci}}
function showCue(p){const b=$('cueBox');if(!b)return;b.innerHTML='';if(!p)return;
 if(p.t){const q=document.createElement('div');q.className='qt';q.textContent='⏱ '+p.t;b.appendChild(q)}
 const cls=['qs','qp','qa','qe'];
 phRowsOf(p).forEach((r,i)=>{const d=document.createElement('div');d.className='qb '+cls[i]+' lg-'+capCls(r.lg);
  const f=document.createElement('span');f.className='cflag';f.textContent=r.flag;
  f.onclick=e=>{e.stopPropagation();loopSpeak([r],f)};
  d.appendChild(f);d.appendChild(wordsSpan(r.txt,r.lg));b.appendChild(d)})}
const fmtT=sec=>{sec=Math.max(0,Math.floor(sec||0));return pad(Math.floor(sec/60))+':'+pad(sec%60)};
function lessonText(n){return (n.ph||[]).map(p=>{let ln=p.t?p.t+' ':'';if(LANGFLAG[p.lg])ln+=LANGFLAG[p.lg]+' ';ln+=p.s;if(p.p)ln+=' | '+p.p;if(p.a)ln+=' 🇸🇾 '+p.a;if(p.e)ln+=' 🇺🇸 '+p.e;return ln}).join('\n')}
let speakingAll=false;
async function speakAll(n){
 if(speakingAll)return;speakingAll=true;
 for(const p of n.ph||[]){const txt=p.s||p.a||p.e;if(!txt)continue;
  const lg=p.lg||guessLang(txt);
  if(isCap()&&CAP.Plugins.Tts){CAP.Plugins.Tts.speak({text:txt,lang:lg}).catch(()=>{});
   await new Promise(r=>setTimeout(r,Math.min(8000,700+txt.length*95)))}
  else if(window.speechSynthesis){await new Promise(r=>{const u=new SpeechSynthesisUtterance(txt);u.lang=lg;u.onend=r;u.onerror=r;speechSynthesis.speak(u)})}
 }
 speakingAll=false;
}
function renderPhrases(n){
 const pl=$('phList');if(!pl)return;pl.innerHTML='';
 if(!n.ph||!n.ph.length){pl.innerHTML='<div id="lsEmpty">'+esc(t('phEmpty'))+'</div>';return}
 const md=$('lsMedia');
 n.ph.forEach((p,i)=>{
  const c=document.createElement('div');c.className='phc';
  const body=document.createElement('div');c.appendChild(body);
  const rows=phRowsOf(p);
  rows.forEach(r=>{
   const row=document.createElement('div');row.className='phrow lg-'+capCls(r.lg);
   const fb=document.createElement('button');fb.className='phflag';fb.textContent=r.flag;
   fb.onclick=e=>{e.stopPropagation();loopSpeak([r],fb)};
   row.appendChild(fb);row.appendChild(wordsSpan(r.txt,r.lg));
   if(r.t){const tc=document.createElement('button');tc.className='phnum';tc.style.cssText='font-size:.72rem;padding:0 .35rem;align-self:center;flex:none';
    tc.textContent=r.t.split('→')[0].trim();
    tc.onclick=e=>{e.stopPropagation();if(!segLoop(tc,r.t))loopSpeak([r],tc)};
    row.appendChild(tc)}
   body.appendChild(row);
  });
  if(p.note){const nd=document.createElement('div');nd.className='phnote';nd.textContent='📝 '+p.note;body.appendChild(nd)}
  const pk='lpimg_'+n.id+'_'+i;
  const im=document.createElement('div');im.className='phim';body.appendChild(im);
  idb.get(pk).then(r=>{if(r&&r.blob){const w=document.createElement('span');w.className='phim-w';
   w.innerHTML='<img src="'+URL.createObjectURL(r.blob)+'">';
   const dx=document.createElement('button');dx.className='opt';dx.textContent='×';
   dx.onclick=async e=>{e.stopPropagation();if(await confirmBox(t('delImg'))){try{await idb.del(pk)}catch(e){}renderPhrases(n)}};
   w.appendChild(dx);im.appendChild(w)}}).catch(()=>{});
  const bar=document.createElement('div');bar.className='phbar';
  const mkI=(cls,txt,fn)=>{const b=document.createElement('button');b.className='phic '+cls;b.textContent=txt;
   b.onclick=e=>{e.stopPropagation();fn(b)};bar.appendChild(b);return b};
  const segLoop=(btn,tt)=>{if(!(md&&md.src&&(tt||p.t)))return false;
   if(btn.classList.contains('speaking')){btn.classList.remove('speaking');md._seg=null;md.pause();return true}
   document.querySelectorAll('.phnum.speaking,.phic.speaking').forEach(x=>x.classList.remove('speaking'));
   stopSay();
   const start=tSec(tt||p.t),nx=nextCue(n,p);
   const ends=Object.keys(p.tt||{}).map(k=>tSec(p.tt[k])).concat(nx?[tSec(nx.t)]:[]).filter(x=>x>start).sort((a,b)=>a-b);
   md._once=null;md._seg={start,end:ends[0]||(md.duration||1e9)};
   md.currentTime=md._seg.start;md.play().catch(()=>{});
   md.onended=()=>{md._seg=null;btn.classList.remove('speaking');
    if(md._loop){const c=cuesOf(md._n||n);const j=md._loopCi>=0?md._loopCi:0;md.currentTime=c[j]?tSec(c[j].t):0;md.play().catch(()=>{})}};
   btn.classList.add('speaking');return true};
  if(p.t){const tp=document.createElement('button');tp.className='phnum';tp.textContent=p.t.split('→')[0].trim();
   tp.onclick=e=>{e.stopPropagation();if(!segLoop(tp,p.t))loopSpeak(rows,tp)};
   bar.appendChild(tp)}
  mkI('ic-note',(p._nd||p.note)?'📔':'📓',b=>openNote('lnot_'+n.id+'_'+i,p,b));
  mkI('ic-ai','✨',()=>{const q=aiSearchQuery(phMapS(p),p.lg);if(q)openExt('https://www.google.com/search?q='+encodeURIComponent(q)+'&udm=50&hl='+st.lang)});
  mkI('ic-clip','🔍',()=>{const q=firstMapText(phMapS(p));openExt('https://www.google.com/search?q='+encodeURIComponent(q+' clipart')+'&udm=2&hl='+st.lang)});
  mkI('ic-say','🔁',b=>loopSpeak(rows,b));
  mkI('ic-img','🖼️',async()=>{const blob=await pickResizedImg();if(!blob)return;
   try{await idb.set(pk,{blob});renderPhrases(n)}catch(e){toast('!')}});
  body.appendChild(bar);
  const dx=document.createElement('button');dx.className='opt';dx.textContent='×';
  dx.onclick=async e=>{e.stopPropagation();if(await confirmBox(t('delPhQ'))){n.ph.splice(i,1);try{await idb.del(pk)}catch(e){}save();renderPhrases(n)}};
  c.appendChild(dx);
  c.onclick=e=>{if(e.target.closest('.phbar')||e.target.closest('.phn-note')||e.target.closest('.phim'))return;
   if(md&&p.t){document.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking'));stopSay();md.currentTime=tSec(p.t);md.play().catch(()=>{});return}
   if(rows[0])loopSpeak([rows[0]],c)};
  pl.appendChild(c);
 });
}

  const mx=900,s=Math.min(1,mx/Math.max(img.width,img.height));

 }catch(err){toast('!')}

function segKV(seg){
 let s=seg.trim(),k=null,lg=null;
 let m=s.match(/^([\u{1F1E6}-\u{1F1FF}]{2}|🔊|🔤|🗣️|⏱️)\s*(.*)$/u);
 if(m){s=m[2].trim();lg=FLAGLANG[m[1]]||null;
  if(['🇸🇾','🇵🇸','🇱🇧','🇯🇴','🇪🇬','🇮🇶','🇸🇦','🇦🇪','🇲🇦','🇩🇿','🇹🇳','🇰🇼','🇶🇦','🇧🇭','🇴🇲','🇾🇪','🇸🇩','🇱🇾'].includes(m[1])){k='a';lg='ar'}
  else if(['🇺🇸','🇬🇧','🇦🇺','🇨🇦','🇮🇪'].includes(m[1])){k='e';lg='en'}
  else if('🔊🔤🗣️'.includes(m[1])){k='p';lg=null}
  else k='s';}
 else{m=s.match(/^([A-Za-z]{2})\s*[:：]\s*(.*)$/);if(m){const c=m[1].toUpperCase();s=m[2];k=c==='AR'?'a':c==='EN'?'e':'s';lg=c.toLowerCase()}}
 s=s.replace(/^(?:الأصلية|الأصلي|النص|النطق(?: اللاتيني)?|تقريب(?: النطق)?(?: بالعربية)?|المعنى(?: بالعربي(?:ة)?)?|بالعربي|بالإنجليزية|English|Meaning|الإنجليزية|الانجليزية|اللفظ)\s*[:：]\s*/u,'');
 if(!k&&s.length<60){if(/المعنى|بالعربي/.test(seg))k='a';else if(/English|الإنجليزية|الانجليزية/.test(seg))k='e';else if(/النطق|اللفظ|تقريب/.test(seg))k='p'}
 return{k,txt:s,lg};
}
const guessLang=s=>/[\u0600-\u06FF]/.test(s)?'ar':/[\u0400-\u04FF]/.test(s)?'ru':/[\u4e00-\u9fff]/.test(s)?'zh':/[\u3040-\u30ff]/.test(s)?'ja':'fr';

}
function parseLessons(text){
 const parts=[];let title='',buf=[];
 const push=()=>{const ph=parsePhrases(buf.join('\n'));if(ph.length||title)parts.push({title,ph});buf=[];title=''};
 for(const raw of text.split(/\r?\n/)){
  const line=raw.trim();
  const head=line.match(/^#{1,6}\s*\d*\.?\s*(.+)$/);
  if(head||line==='==='||line==='—'){push();title=head?head[1].trim():'';continue}
  buf.push(raw);
 }
 push();return parts;
}
function parsePhrases(text){
 const out=[];let cur=null;
 const flush=()=>{if(cur&&(cur.s||cur.p||cur.a||cur.e||cur.t))out.push(cur);cur=null};
 const need=()=>{if(!cur)cur={t:'',s:'',p:'',a:'',e:''}};
 const asg=(k,x)=>{if(!x)return;need();if(cur[k]&&cur[k].split(' · ').includes(x))return;cur[k]=cur[k]?cur[k]+' · '+x:x};
 const flagSplit=ln=>ln.split(/(?=[\u{1F1E6}-\u{1F1FF}]{2}|🔊|🔤|🗣️)/u).map(x=>x.trim().replace(/[|·]+\s*$/,'').trim()).filter(Boolean);
 const posAsg=parts=>{let pi=0;parts.forEach(sg=>{const x=segKV(sg);if(x.k){asg(x.k,x.txt);if(x.k==='s'&&x.lg){need();cur.lg=cur.lg||x.lg}}else{asg(['s','a','e','p'][Math.min(pi,3)],x.txt);pi++}})};
 for(const raw of text.split(/\r?\n/)){
  let ln=raw.trim();
  if(!ln){flush();continue}
  if(ln.startsWith('###')){flush();out.push({note:ln.replace(/^#+\s*/,'').replace(/\\(.)/g,'$1')});continue}
  if(/^[-=─—_]{3,}$/.test(ln)){flush();continue}
  if(/^\d+$/.test(ln))continue;
  const tm=ln.match(/^\[?((?:\d{1,2}:)?\d{1,2}:\d{2}(?:[.,]\d{1,3})?)\]?\s*(?:-+>\s*((?:\d{1,2}:)?\d{1,2}:\d{2}(?:[.,]\d{1,3})?))?\s*(.*)$/);
  if(tm&&/^\d/.test(ln)){
   flush();need();cur.t=tm[1]+(tm[2]?' → '+tm[2]:'');
   if(tm[3])posAsg(tm[3].includes('|')?tm[3].split('|'):flagSplit(tm[3]))
   continue;
  }
  ln=ln.replace(/\\([.()])/g,'$1').replace(/^\*\s*/,'').replace(/^\d+[.)]\s*(?=\D)/,'');
  if(!ln)continue;
  const ehd=ln.match(/^(\p{So}|\p{Sk})/u);
  if(ehd&&!/^[\u{1F1E6}-\u{1F1FF}]{2}/u.test(ln)&&!['🔊','🔤','🗣','⏱','📔','📝'].includes(ehd[1])&&/[\u0600-\u06FF]/.test(ln)){flush();out.push({note:ln});continue}
  const mix=p=>p.some(x=>/[\u0600-\u06FF]/.test(x))&&p.some(x=>/[A-Za-z\u00C0-\u024F\u0400-\u04FF\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af\u0590-\u05ff\u0370-\u03ff]/.test(x));
  const ps=flagSplit(ln);
  let sp=null;
  if(ps.length>1)sp=ps;
  else if(ln.includes('|')){sp=ln.split('|').map(x=>x.trim()).filter(Boolean);
   if(!sp.length||sp.every(c=>/^[-:\s]+$/.test(c))){sp=null;continue}}
  if(sp&&sp.every(c=>{const x=segKV(c);return /^([A-Za-z]{2,8}|ال[أ-ي]{2,10})$/i.test(x.txt.replace(/\s/g,''))}))continue
  if(!sp){
   for(const r of [/\s*→\s*/,/\s+=\s+/]){const p=ln.split(r).map(x=>x.trim()).filter(Boolean);if(p.length>=3){sp=p;break}}
   if(!sp)for(const r of [/\s*[:：]\s*/,/\s+-\s+/,/[،,]\s*/]){const p=ln.split(r).map(x=>x.trim()).filter(Boolean);if(p.length>=3&&mix(p)){sp=p;break}}
   if(!sp&&!/^[🔊🔤🗣⏱]/u.test(ln)){const m=ln.match(/^([^\u0600-\u06FF]+?)\s+([\u0600-\u06FF][\u0600-\u06FF\s،؛.!؟?'()،]*)\s+([^\u0600-\u06FF]+)$/);
    if(m&&m[1].length>1&&m[3].length>1)sp=[m[1],m[2],m[3]]}
  }
  if(sp){if(!cur||cur.s||cur.p||cur.a||cur.e)flush();posAsg(sp);continue}
  const x=segKV(ps[0]);
  if(x.k){asg(x.k,x.txt);if(x.k==='s'&&x.lg){need();cur.lg=cur.lg||x.lg}}
  else asg(cur&&cur.s&&!cur.a?'a':cur&&cur.s&&cur.a?'e':/[\u0600-\u06FF]/.test(x.txt)?'a':'s',x.txt);
 }
 flush();
 const merged=[];
 for(const p of out){
  if(p.note){merged.push(p);continue}
  const keys=['s','p','a','e'].filter(k=>p[k]);
  const prev=merged[merged.length-1];
  if(keys.length===1&&prev&&!prev.note){
   const pk=['s','p','a','e'].filter(k=>prev[k]);
   if((pk.length===1||prev._merged)&&!prev[keys[0]]){
    prev.tt=prev.tt||{};
    if(prev.t&&pk.length===1&&!prev.tt[pk[0]])prev.tt[pk[0]]=prev.t;
    prev[keys[0]]=p[keys[0]];if(p.lg&&!prev.lg)prev.lg=p.lg;
    if(p.t)prev.tt[keys[0]]=p.t;
    if(!prev.t&&p.t)prev.t=p.t;
    prev._merged=1;continue
   }
  }
  merged.push(p)
 }
 return merged;
}

var noteKey=null,noteCtx=null,noteDrawing=false,noteErasing=false,noteHighlight=false,noteColor='#111827',noteSize=3,noteUndo=[],noteRedo=[],notePhrase=null,noteCard=null;
function noteSnapshot(){if(!noteCtx)return;const c=$('noteCanvas');noteUndo.push(noteCtx.getImageData(0,0,c.width,c.height));if(noteUndo.length>30)noteUndo.shift();noteRedo=[];updNoteHist()}
function noteRestore(img){noteCtx.save();noteCtx.setTransform(1,0,0,1,0,0);noteCtx.globalCompositeOperation='source-over';noteCtx.globalAlpha=1;noteCtx.clearRect(0,0,img.width,img.height);noteCtx.putImageData(img,0,0);noteCtx.restore()}
function updNoteHist(){$('noteUndo').disabled=!noteUndo.length;$('noteRedo').disabled=!noteRedo.length}
function undoNote(){if(!noteCtx||!noteUndo.length)return;const c=$('noteCanvas');noteRedo.push(noteCtx.getImageData(0,0,c.width,c.height));noteRestore(noteUndo.pop());updNoteHist()}
function redoNote(){if(!noteCtx||!noteRedo.length)return;const c=$('noteCanvas');noteUndo.push(noteCtx.getImageData(0,0,c.width,c.height));noteRestore(noteRedo.pop());updNoteHist()}
function setNoteSize(n){noteSize=Math.min(16,Math.max(1,n));$('noteSize').value=noteSize}
function setupNoteCanvas(){const c=$('noteCanvas');noteCtx=c.getContext('2d');const dpr=window.devicePixelRatio||1;const w=c.clientWidth||600,hh=c.clientHeight||400;c.width=Math.max(1,w*dpr);c.height=Math.max(1,hh*dpr);noteCtx.setTransform(1,0,0,1,0,0);noteCtx.scale(dpr,dpr);noteCtx.lineCap='round';noteCtx.lineJoin='round'}
function openNote(key,phrase,btn){noteKey=key;notePhrase=phrase;noteCard=btn;$('noteModal').classList.add('show');const bar=$('notePhraseBar');bar.innerHTML='';
 if(phrase){phRowsOf(phrase).forEach(r=>{if(!r.txt)return;const card=document.createElement('div');card.className='note-phrase-card';if(r.lg==='ar')card.dir='rtl';
  const sp=document.createElement('span');sp.textContent=r.txt;card.appendChild(sp);
  const lo=document.createElement('button');lo.className='note-loop';lo.textContent='🔁';lo.onclick=e=>{e.stopPropagation();loopSpeak([r],lo)};card.appendChild(lo);bar.appendChild(card)})}
 const c=$('noteCanvas');noteUndo=[];noteRedo=[];updNoteHist();
 setTimeout(()=>{setupNoteCanvas();const dpr=window.devicePixelRatio||1;const w=c.width/dpr,hh=c.height/dpr;noteCtx.clearRect(0,0,w,hh);
  idb.get(key).then(r=>{if(r&&r.blob){const img=new Image();img.onload=()=>noteCtx.drawImage(img,0,0,w,hh);img.src=URL.createObjectURL(r.blob)}}).catch(()=>{})},50);
 setNoteTool('pen');$('noteSize').value=noteSize;
 document.querySelectorAll('.note-tool').forEach(b=>b.classList.toggle('active',b.dataset.color===noteColor));
 $('noteSwatchDot').style.background=noteColor;$('notePalette').classList.remove('show');applyNotePaper()}
function applyNotePaper(){const w=$('noteWrap');const lined=localStorage.getItem('sa3a_note_paper')==='lined';w.classList.toggle('lined',lined);w.classList.toggle('plain',!lined);const pb=$('notePaper');pb.textContent=lined?'📄':'📓';pb.classList.toggle('active',lined)}
function setNoteTool(tool){noteErasing=tool==='erase';noteHighlight=tool==='hl';$('notePen').classList.toggle('active',tool==='pen');$('noteHl').classList.toggle('active',tool==='hl');$('noteErase').classList.toggle('active',tool==='erase')}
function closeNote(){$('noteModal').classList.remove('show');noteKey=null;noteCtx=null}
function saveNote(){if(!noteKey||!noteCtx)return;const c=$('noteCanvas');c.toBlob(async b=>{try{await idb.set(noteKey,{blob:b});if(notePhrase){notePhrase._nd=true;save()}if(noteCard)noteCard.textContent='📔'}catch(e){}closeNote();toast('✓ '+t('save'))},'image/png')}
function clearNote(){if(!noteCtx)return;noteSnapshot();const c=$('noteCanvas'),dpr=window.devicePixelRatio||1;noteCtx.clearRect(0,0,c.width/dpr,c.height/dpr)}
function getNotePos(e){const c=$('noteCanvas'),rc=c.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-rc.left,y=(e.touches?e.touches[0].clientY:e.clientY)-rc.top;return{x,y}}
function noteStart(e){if(!noteCtx)return;e.preventDefault();noteSnapshot();noteDrawing=true;const p=getNotePos(e);noteCtx.beginPath();noteCtx.moveTo(p.x,p.y);noteCtx.globalCompositeOperation=noteErasing?'destination-out':'source-over';noteCtx.globalAlpha=noteHighlight?0.35:1;noteCtx.lineCap=noteHighlight?'square':'round';noteCtx.strokeStyle=noteColor;noteCtx.lineWidth=noteErasing?noteSize*4:(noteHighlight?noteSize*3:noteSize)}
function noteMove(e){if(!noteDrawing||!noteCtx)return;e.preventDefault();const p=getNotePos(e);noteCtx.lineTo(p.x,p.y);noteCtx.stroke()}
function noteEnd(){if(!noteCtx)return;noteDrawing=false;noteCtx.closePath()}

 c.addEventListener('touchstart',noteStart,{passive:false});c.addEventListener('touchmove',noteMove,{passive:false});c.addEventListener('touchend',noteEnd);

const WXPH_TITLE={fr:'📁 Phrases météo',ar:'📁 عبارات الطقس',en:'📁 Weather phrases'};
function wxPhFill(s,j){
 const d0=j&&j.daily,c=j&&j.current;
 const v={t:c?Math.round(c.temperature_2m):'-',f:c?Math.round(c.apparent_temperature):'-',h:c?c.relative_humidity_2m:'-',w:c?Math.round(c.wind_speed_10m):'-',
  city:(wxLoc&&wxLoc.name||'').split('،')[0].split(',')[0]||'-',
  dir:DIRS[st.lang]?DIRS[st.lang][Math.round(((c&&c.wind_direction_10m)||0)/45)%8]:'-',
  rise:d0&&d0.sunrise?new Date(d0.sunrise[0]).toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'}):'-',
  set:d0&&d0.sunset?new Date(d0.sunset[0]).toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'}):'-',

let tIv=null,swIv=null,swT0=0,swAcc=0,swLapN=0;
function tTotal(){
 if(st.timer.end)return st.timer._total||0;
 return (+$('inH').value||0)*3600+(+$('inM').value||0)*60+(+$('inS').value||0)}
function fmtLeft(ms){const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
 return (h?pad(h)+':':'')+pad(m)+':'+pad(s%60)}
function renderTimer(){
 const r=st.timer.running&&st.timer.end>Date.now();
 $('tPick').style.display=r?'none':'';
 $('tRun').style.display=r?'block':'none';
 $('tReset').style.display=st.timer.end?'':'none';
 $('tReset').textContent=t('reset');
 $('tGo').textContent=r?t('pause'):(st.timer.end&&!st.timer.running?t('resume'):t('start'));
 if(r){const left=st.timer.end-Date.now();
  $('tLeft').textContent=fmtLeft(left);
  const c=2*Math.PI*110,fr=left/(st.timer._total||1);
  $('tArc').setAttribute('stroke-dasharray',`${c*fr} ${c}`);
 }}
async function scheduleTimerNotif(){
 const p=LN();if(!p)return;
 try{await ensureChannel({sound:'beep'});
  await p.schedule({notifications:[{id:7777,title:'⏱️ '+t('tabTimer'),body:t('timerDone'),channelId:'sa3a_beep',sound:'sa3a_beep',schedule:{at:new Date(st.timer.end),allowWhileIdle:true}}]});
 }catch(e){}}
$('tGo').onclick=async()=>{
 if(st.timer.running){
  st.timer.running=false;st.timer.left=Math.max(0,st.timer.end-Date.now());st.timer._total=st.timer.left;save();
  clearInterval(tIv);const p=LN();try{p&&await p.cancel({notifications:[{id:7777}]})}catch(e){}
 }else if(st.timer.end&&!st.timer.running&&st.timer.left){
  st.timer.end=Date.now()+st.timer.left;st.timer.running=true;save();await scheduleTimerNotif();
 }else{
  const tot=tTotal();if(tot<=0)return;
  st.timer={end:Date.now()+tot*1000,left:0,running:true,_total:tot*1000};save();await scheduleTimerNotif();
 }
 if(st.timer.running){clearInterval(tIv);tIv=setInterval(renderTimer,250)}
 renderTimer();};
$('tReset').onclick=async()=>{st.timer={end:0,left:0,running:false};save();clearInterval(tIv);

function blobB64(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.onerror=()=>r('');fr.readAsDataURL(b)})}
function b64Blob(b64,ty){try{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:ty||''})}catch(e){return new Blob([])}}
async function idbDump(){const d=await idb.open();return new Promise((res,rej)=>{const tx=d.transaction('s'),s=tx.objectStore('s');
 const ks=s.getAllKeys(),vs=s.getAll();tx.oncomplete=()=>{const o={};ks.result.forEach((k,i)=>o[k]=vs.result[i]);res(o)};tx.onerror=()=>rej(tx.error)})}

 const all={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(sa3a|tempo)/.test(k))all[k]=localStorage.getItem(k)}
 await streamJson('sa3a-backup.json',async w=>{
  await w('{"v":2,"ls":'+JSON.stringify(all)+',"idb":{');

 });

async function streamJson(fname,body){
 const FS=CAP.Plugins&&CAP.Plugins.Filesystem;
 if(isCap()&&FS){
  try{
   toast('💾…');
   let first=true,uri=null;
   const w=async s=>{for(let i=0;i<s.length;i+=200000){const c=s.slice(i,i+200000);
    if(first){const r=await FS.writeFile({path:fname,data:c,directory:'CACHE',encoding:'utf8'});uri=r.uri;first=false}
    else await FS.appendFile({path:fname,data:c,directory:'CACHE',encoding:'utf8'})}};
   await body(w);
   let docUri='';try{await FS.copy({from:uri,to:fname,toDirectory:'DOCUMENTS'});docUri=' → Documents'}catch(e2){}
   if(CAP.Plugins.Share){await CAP.Plugins.Share.share({title:'Sa3a',url:uri,dialogTitle:fname}).catch(()=>{})}
   toast('✓ '+fname+docUri);
   return;
  }catch(e){toast('!');return}
 }
 const acc=[];await body(async s=>acc.push(s));const data=acc.join('');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fname;a.click()
}
async function streamMedia(w,only){
 const d=await idb.open();
 const ks=await new Promise((res,rej)=>{const q=d.transaction('s').objectStore('s').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
 let comma=false;
 for(const k of ks){
  const kk=String(k);
  if(only&&!only.test(kk))continue;
  const r=await idb.get(k);
  if(!r||!r.blob)continue;
  await w((comma?',':'')+JSON.stringify(kk)+':{"t":'+JSON.stringify(r.blob.type||'')+',"k":'+JSON.stringify(r.kind||'')+',"n":'+JSON.stringify(r.name||'')+',"d":"');
  for(let off=0;off<r.blob.size;off+=3000000){
   const s=r.blob.slice(off,Math.min(off+3000000,r.blob.size));
   await w(await blobB64(s))}
  await w('"}');comma=true}
}

  }
  const arr=Array.isArray(j)?j:j.alarms;
  if(!Array.isArray(arr))throw 0;
  for(const a of arr){if(typeof a.hh==='number'&&typeof a.mm==='number'){a.id=a.id||Date.now()+Math.random();a.on=a.on!==false;a.days=a.days||[];a.sound=a.sound||'default';st.alarms.push(a)}}

$('lesImpPick').onchange=async e=>{

 try{const j=JSON.parse(await f.text());

  save();renderLessons();toast('✓ '+t('imported')+' ('+added+')');
 }catch(err){toast(t('badFile'))}
};

async function consumeRing(){

  const id=r&&r.alarmId;

  if(id<0){ // tempo appointment: hand off to its ring screen
   const b=-id-1,ap=tempoAppts().find(x=>tempoNidBase(x.id)===b);
   try{await AS().stopNativeRing()}catch(e){}

 }catch(e){}
}
