<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2a0a2e">
<meta name="description" content="دروس الثقافة الجنسية بالفرنسية مع ترجمة عربية وإنجليزية">
<title>Sexual Health — Français / العربية / English</title>
<link rel="manifest" href="manifest-sexed.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg-primary: #1a0b1e;
    --bg-secondary: #24122b;
    --bg-tertiary: #321b3b;
    --text-primary: #f8f0fa;
    --text-secondary: #c9b8cf;
    --accent: #e879c8;
    --accent-2: #8b5cf6;
    --accent-hover: #f0a8d8;
    --danger: #ff6b7a;
    --success: #34d399;
    --gold: #fbbf24;
    --border: #4a2d55;
    --radius: 16px;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --max-width: 880px;
  }
  [data-theme="light"] {
    --bg-primary: #fdf6fb;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f4e9f5;
    --text-primary: #2d0f35;
    --text-secondary: #6b4e73;
    --accent: #b8459e;
    --accent-2: #7c3aed;
    --accent-hover: #d16bb6;
    --border: #e9d5ee;
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(139,92,246,0.18), transparent 60%), var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.65;
    transition: background 0.25s, color 0.25s;
    padding-bottom: 2rem;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(135deg, rgba(232,121,200,0.18), rgba(139,92,246,0.18)), var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: var(--max-width); margin: 0 auto; padding: 0.7rem 1rem;
    display: flex; align-items: center; gap: 0.65rem;
  }
  .logo {
    font-weight: 800; font-size: 1.05rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; display: flex; align-items: center; gap: 0.4rem;
  }
  .logo-icon { font-size: 1.15rem; filter: drop-shadow(0 0 6px rgba(232,121,200,0.4)); }
  .spacer { flex: 1; }
  .icon-btn {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 50%;
    width: 2.4rem; height: 2.4rem; font-size: 1.05rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.12s, border-color 0.2s, background 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .icon-btn.active { background: var(--accent); color: #1a0b1e; border-color: var(--accent); }
  .lang-switch { display: flex; gap: 0.3rem; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem; }
  .lang-btn {
    background: transparent; color: var(--text-secondary); border: none;
    border-radius: 999px; padding: 0.35rem 0.65rem; font-size: 0.78rem; font-weight: 700;
    cursor: pointer; min-width: 2.2rem; transition: background 0.2s, color 0.2s;
  }
  .lang-btn:hover { color: var(--text-primary); }
  .lang-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  main { max-width: var(--max-width); margin: 0 auto; padding: 1rem; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.1rem;
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.7rem; box-shadow: var(--shadow);
  }
  #search {
    flex: 1; min-width: 220px;
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 0.65rem 1rem; font-size: 1rem;
  }
  #search::placeholder { color: var(--text-secondary); }
  .ctl {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.55rem 0.6rem; font-size: 0.88rem;
  }
  .breadcrumb {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.9rem;
  }
  .breadcrumb button {
    background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 0.9rem;
  }
  .card {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 0.75rem;
    cursor: pointer; display: flex; align-items: center; gap: 0.9rem;
    transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .num {
    min-width: 2.6rem; height: 2.6rem; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.95rem; flex-shrink: 0; box-shadow: 0 0 12px rgba(232,121,200,0.25);
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-weight: 700; font-size: 1.05rem; }
  .card-sub { color: var(--text-secondary); font-size: 0.86rem; }
  .chev { color: var(--text-secondary); font-size: 1.1rem; }
  .hero {
    background: linear-gradient(135deg, rgba(232,121,200,0.12), rgba(139,92,246,0.12));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.2rem; margin-bottom: 1.1rem; text-align: center;
  }
  .hero h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
  .hero p { margin: 0; color: var(--text-secondary); font-size: 0.95rem; }
  .phrase {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.9rem 1rem; margin-bottom: 0.75rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .phrase.playing { border-color: var(--success); box-shadow: 0 0 0 1px var(--success), 0 0 14px rgba(52,211,153,0.18); }
  .phrase-top { display: flex; gap: 0.7rem; align-items: flex-start; }
  .lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.35rem; }
  .line { padding: 0.25rem 0.45rem; border-radius: 8px; transition: background 0.2s; }
  .line.active { background: rgba(52,211,153,0.12); }
  .fr {
    direction: ltr; text-align: left; font-size: 1.13rem; font-weight: 700;
    color: var(--accent); word-wrap: break-word;
  }
  .ar { direction: rtl; text-align: right; font-size: 1.02rem; }
  .en { direction: ltr; text-align: left; color: var(--text-secondary); font-size: 0.95rem; }
  .btns { display: flex; flex-wrap: wrap; gap: 0.35rem; flex-shrink: 0; max-width: 8.5rem; justify-content: flex-end; }
  [dir="ltr"] .btns { justify-content: flex-start; }
  .btns button {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 10px;
    width: 2.35rem; height: 2.35rem; font-size: 1rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
  }
  .btns button:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btns button.active { background: var(--success); color: #081c15; border-color: var(--success); }
  .btns button.fav-on { color: var(--gold); border-color: var(--gold); }
  .btns .image-btn:hover { border-color: var(--accent); color: var(--accent); }
  .no-lessons { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); }
  .no-lessons .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .no-lessons .card-title { color: var(--text-primary); margin-bottom: 0.3rem; }
  .lesson-head { margin-bottom: 1rem; }
  .lesson-head h2 { margin: 0 0 0.2rem; font-size: 1.25rem; }
  .lesson-head .sub { color: var(--text-secondary); font-size: 0.95rem; }
  .lesson-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.8rem 0; align-items: center; }
  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none;
    border-radius: 999px; padding: 0.6rem 1.1rem; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; transition: filter 0.2s, transform 0.1s;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn.ghost { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
  .pill {
    display: inline-block; background: var(--bg-tertiary); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.15rem 0.65rem; font-size: 0.78rem; color: var(--text-secondary);
  }
  .empty { color: var(--text-secondary); text-align: center; padding: 2.5rem 1rem; }
  footer { text-align: center; color: var(--text-secondary); font-size: 0.78rem; padding: 1.5rem 1rem; }
  footer a { color: var(--accent); }

  .add-card .num { background: var(--success); color: #081c15; }
  .form-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  .form-group { margin-bottom: 0.9rem; }
  .form-group label { display: block; font-size: 0.9rem; margin-bottom: 0.35rem; color: var(--text-secondary); }
  .form-group input, .form-group textarea {
    width: 100%; background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 0.65rem;
    font-size: 1rem; font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 180px; }
  .form-group .hint { font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.3rem; }
  .form-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .delete-btn {
    background: var(--bg-tertiary); color: var(--danger); border: 1px solid var(--danger);
    border-radius: 8px; width: 2.4rem; height: 2.4rem; cursor: pointer; font-size: 1rem;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    margin-inline-start: auto;
  }
  .delete-btn:hover { background: var(--danger); color: #fff; }
  @media (max-width: 520px) {
    .header-inner { padding: 0.6rem 0.75rem; }
    .logo { font-size: 0.95rem; }
    .btns { max-width: none; width: 100%; justify-content: flex-start; margin-top: 0.5rem; }
    .phrase-top { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo"><span class="logo-icon">🌸</span> <span data-t="appName">Sexual Health</span></span>
    <span class="spacer"></span>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ar">AR</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="fr">FR</button>
    </div>
    <button class="icon-btn" id="btn-fav" data-t-title="favourites" title="Favourites">⭐</button>
    <button class="icon-btn" id="btn-theme" data-t-title="themeMode" title="Dark / light mode">🌙</button>
    <button class="icon-btn" id="btn-stop" data-t-title="stopAudio" title="Stop audio">⏹</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" data-t="searchPlaceholder" placeholder="ابحث بالعربية أو الفرنسية أو الإنجليزية…">
    <select class="ctl" id="rate" data-t-title="rateTitle" title="Speech rate">
      <option value="0.6">0.6×</option>
      <option value="0.8">0.8×</option>
      <option value="1" selected>1×</option>
      <option value="1.2">1.2×</option>
    </select>
    <select class="ctl" id="loopmode" data-t-title="loopModeTitle" title="Loop content">
      <option value="fr,ar,en" data-t="loopFrenchArabicEnglish" selected>🔁 FR + AR + EN</option>
      <option value="fr,ar" data-t="loopFrenchArabic">🔁 FR + AR</option>
      <option value="fr" data-t="loopFrenchOnly">🔁 FR only</option>
    </select>
  </div>
  <div id="view"></div>
</main>

<footer>
  <span data-t="footerText">Sexual health education · </span>
  <a href="index.html" data-t="footerLink">My other apps</a>
</footer>

<script>
(function () {
  'use strict';

  function loadLessons() {
    try { return JSON.parse(localStorage.getItem('sexed_lessons') || '[]'); } catch (e) { return []; }
  }
  function saveLessons() { localStorage.setItem('sexed_lessons', JSON.stringify(LESSONS)); }
  function cleanPhrasePart(s) {
    let r = String(s).trim();
    const trim = '*–—-';
    while (r && trim.includes(r[0])) r = r.slice(1).trim();
    while (r && trim.includes(r[r.length - 1])) r = r.slice(0, -1).trim();
    return r;
  }
  function parsePhrases(text) {
    const phrases = [];
    text.split('\n').forEach(raw => {
      const line = raw.trim();
      if (!line) return;
      let parts = line.split('|').map(s => s.trim());
      if (parts.length < 3) parts = line.split(/→|->|=>/).map(s => s.trim());
      if (parts.length < 3) return;
      const fr = cleanPhrasePart(parts[0]), ar = cleanPhrasePart(parts[1]), en = cleanPhrasePart(parts[2]);
      if (fr && ar && en) phrases.push({ fr, ar, en });
    });
    return phrases;
  }

  let LESSONS = loadLessons();

  const UI = {
    appName: { ar: 'الصحة الجنسية', en: 'Sexual Health', fr: 'Santé sexuelle' },
    appTitle: { ar: 'الصحة الجنسية — فرنسي / عربي / إنجليزي', en: 'Sexual Health — French / Arabic / English', fr: 'Santé sexuelle — Français / Arabe / Anglais' },
    searchPlaceholder: { ar: 'ابحث بالعربية أو الفرنسية أو الإنجليزية…', en: 'Search in Arabic, French, or English…', fr: 'Rechercher en arabe, français ou anglais…' },
    rateTitle: { ar: 'سرعة النطق', en: 'Speech rate', fr: 'Vitesse de la voix' },
    loopModeTitle: { ar: 'محتوى التكرار', en: 'Loop content', fr: 'Contenu de la répétition' },
    loopFrenchArabicEnglish: { ar: '🔁 فرنسي + عربي + إنجليزي', en: '🔁 French + Arabic + English', fr: '🔁 Français + Arabe + Anglais' },
    loopFrenchArabic: { ar: '🔁 فرنسي + عربي', en: '🔁 French + Arabic', fr: '🔁 Français + Arabe' },
    loopFrenchOnly: { ar: '🔁 فرنسي فقط', en: '🔁 French only', fr: '🔁 Français seulement' },
    favourites: { ar: 'المحفوظات', en: 'Favourites', fr: 'Favoris' },
    themeMode: { ar: 'الوضع الليلي/النهاري', en: 'Dark / light mode', fr: 'Mode sombre / clair' },
    stopAudio: { ar: 'إيقاف الصوت', en: 'Stop audio', fr: 'Arrêter le son' },
    lessonsLabel: { ar: 'الدروس', en: 'Lessons', fr: 'Leçons' },
    phrases: { ar: 'عبارة', en: 'phrases', fr: 'phrases' },
    speakOnce: { ar: 'نطق مرة واحدة', en: 'Speak once', fr: 'Parler une fois' },
    loopTitle: { ar: 'تكرار: فرنسي ← عربي ← إنجليزي', en: 'Repeat: French ← Arabic ← English', fr: 'Répéter : Français ← Arabe ← Anglais' },
    imageTitle: { ar: 'بحث الصور في Google', en: 'Search images on Google', fr: 'Rechercher des images sur Google' },
    favTitle: { ar: 'حفظ', en: 'Save', fr: 'Enregistrer' },
    playAll: { ar: '▶ تشغيل كل الدرس', en: '▶ Play whole lesson', fr: '▶ Lire toute la leçon' },
    stopAll: { ar: '⏹ إيقاف', en: '⏹ Stop', fr: '⏹ Arrêter' },
    loading: { ar: '…جاري التحميل', en: '…Loading', fr: '…Chargement' },
    savedPhrasesTitle: { ar: '⭐ العبارات المحفوظة', en: '⭐ Saved phrases', fr: '⭐ Phrases enregistrées' },
    noSavedPhrases: { ar: 'لا توجد عبارات محفوظة بعد.', en: 'No saved phrases yet.', fr: 'Aucune phrase enregistrée.' },
    searchResults: { ar: 'نتائج البحث', en: 'Search results', fr: 'Résultats de recherche' },
    noResults: { ar: 'لا نتائج', en: 'No results', fr: 'Aucun résultat' },
    noLessonsYetTitle: { ar: 'لا توجد دروس بعد', en: 'No lessons yet', fr: 'Aucune leçon pour le moment' },
    noLessonsYetSub: { ar: 'أرسل الدروس الجديدة لإضافتها هنا', en: 'Send your new lessons to add them here', fr: 'Envoyez vos nouvelles leçons pour les ajouter ici' },
    addLesson: { ar: 'إضافة درس', en: 'Add lesson', fr: 'Ajouter une leçon' },
    addLessonSub: { ar: 'أنشئ مجلداً جديداً للعبارات', en: 'Create a new phrase folder', fr: 'Créer un nouveau dossier de phrases' },
    titleFr: { ar: 'العنوان بالفرنسية', en: 'Title in French', fr: 'Titre en français' },
    titleAr: { ar: 'العنوان بالعربية', en: 'Title in Arabic', fr: 'Titre en arabe' },
    titleEn: { ar: 'العنوان بالإنجليزية', en: 'Title in English', fr: 'Titre en anglais' },
    phrasesLabel: { ar: 'العبارات', en: 'Phrases', fr: 'Phrases' },
    phrasesHint: { ar: 'كل سطر: فرنسي | عربي | إنجليزي', en: 'One line: French | Arabic | English', fr: 'Une ligne : Français | Arabe | Anglais' },
    saveLesson: { ar: 'حفظ الدرس', en: 'Save lesson', fr: 'Enregistrer la leçon' },
    cancel: { ar: 'إلغاء', en: 'Cancel', fr: 'Annuler' },
    deleteLesson: { ar: 'حذف الدرس', en: 'Delete lesson', fr: 'Supprimer la leçon' },
    deleteConfirm: { ar: 'هل تريد حذف هذا الدرس؟', en: 'Delete this lesson?', fr: 'Supprimer cette leçon ?' },
    noPhrasesError: { ar: 'لم يتم التعرف على أي عبارة. تأكد من التنسيق: فرنسي | عربي | إنجليزي', en: 'No phrases recognized. Use format: French | Arabic | English', fr: 'Aucune phrase reconnue. Format : Français | Arabe | Anglais' },
    fillTitleError: { ar: 'أدخل العنوان بكل لغة', en: 'Please fill the title in all languages', fr: 'Veuillez remplir le titre dans toutes les langues' },
    lessonLabel: { ar: 'الدرس', en: 'Lesson', fr: 'Leçon' },
    footerText: { ar: 'تطبيق تثقيف صحي · ', en: 'Health education app · ', fr: 'Application d\'éducation sexuelle · ' },
    footerLink: { ar: 'تطبيقاتي الأخرى', en: 'My other apps', fr: 'Mes autres applications' },
    heroTitle: { ar: 'تعلم الفرنسية للصحة الجنسية', en: 'Learn French for sexual health', fr: 'Apprenez le français pour la santé sexuelle' },
    heroSub: { ar: 'عبارات موثوقة بالفرنسية مع ترجمة عربية وإنجليزية', en: 'Reliable French phrases with Arabic and English translations', fr: 'Des phrases fiables en français avec traductions arabe et anglaise' }
  };

  const VOICE_LANG = { fr: 'fr-FR', ar: 'ar-SA', en: 'en-US' };

  const view = document.getElementById('view');
  const searchInput = document.getElementById('search');

  const state = {
    route: { name: 'home' },
    loop: null,
    favs: JSON.parse(localStorage.getItem('sexed_favs') || '[]'),
    rate: 1,
    langs: ['fr', 'ar', 'en'],
    uiLang: localStorage.getItem('sexed_ui_lang') || 'ar',
    theme: localStorage.getItem('sexed_theme') || 'dark'
  };

  let speechRun = 0;

  function t(key) {
    const v = UI[key];
    return (v && v[state.uiLang]) || (v && v.en) || (v && v.ar) || key;
  }
  function title(obj) {
    return (obj && obj[state.uiLang]) || (obj && obj.en) || (obj && obj.ar) || (obj && obj.fr) || '';
  }
  function subtitle(obj) {
    if (!obj) return '';
    if (state.uiLang === 'ar') return esc(obj.fr) + ' · ' + esc(obj.en);
    if (state.uiLang === 'en') return esc(obj.fr) + ' · ' + esc(obj.ar);
    return esc(obj.ar) + ' · ' + esc(obj.en);
  }
  function chevron() { return document.documentElement.dir === 'rtl' ? '‹' : '›'; }

  function applyTranslations() {
    document.title = t('appTitle');
    document.querySelectorAll('[data-t]').forEach(el => {
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = t(el.dataset.t);
      else el.textContent = t(el.dataset.t);
    });
    document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
    const loopmode = document.getElementById('loopmode');
    if (loopmode) {
      Array.from(loopmode.options).forEach(opt => { opt.textContent = t(opt.dataset.t); });
    }
  }

  function setUILang(lang) {
    state.uiLang = lang;
    localStorage.setItem('sexed_ui_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    applyTranslations();
    go(state.route, false);
  }

  function setTheme(theme) {
    state.theme = theme;
    localStorage.setItem('sexed_theme', theme);
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : '');
    const btn = document.getElementById('btn-theme');
    if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
  }

  function toggleTheme() { setTheme(state.theme === 'light' ? 'dark' : 'light'); }

  function nativeTTS() {
    if (!window.Capacitor) return null;
    if (window.Capacitor.getPlatform && window.Capacitor.getPlatform() !== 'android') return null;
    return window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech;
  }

  function nativeSpeak(text, lang) {
    const tts = nativeTTS();
    if (!tts) return Promise.reject('no tts');
    return tts.speak({ text: text, lang: VOICE_LANG[lang] || 'en-US', rate: state.rate || 1, queueStrategy: 1 });
  }
  function nativeStop() { const tts = nativeTTS(); if (!tts) return Promise.resolve(); return tts.stop(); }

  function speakSupported() { return !!nativeTTS(); }

  function stopSpeech() {
    state.loop = null;
    speechRun++;
    if (nativeTTS()) nativeStop();
    highlight(null);
    refreshButtons();
  }

  function speakOnce(phrase, langs, key, onDone) {
    if (!nativeTTS()) { highlight(null); return; }
    const seq = langs.filter(l => phrase[l]);
    let i = 0;
    const run = ++speechRun;
    nativeStop();
    (function next() {
      if (run !== speechRun) return;
      if (i >= seq.length) { highlight(null); if (onDone) onDone(); return; }
      const lang = seq[i++];
      highlight(key, lang);
      nativeSpeak(phrase[lang], lang).then(() => { if (run === speechRun) setTimeout(next, 250); }).catch(() => { if (run === speechRun) setTimeout(next, 250); });
    })();
  }

  function toggleLoop(phrase, key) {
    if (state.loop && state.loop.key === key) { stopSpeech(); return; }
    state.loop = { key: key };
    refreshButtons();
    (function cycle() {
      if (!state.loop || state.loop.key !== key) return;
      speakOnce(phrase, state.langs, key, () => {
        if (!state.loop || state.loop.key !== key) return;
        setTimeout(cycle, 600);
      });
    })();
  }

  function highlight(key, lang) {
    document.querySelectorAll('.phrase').forEach(el => {
      const on = key && el.dataset.key === key;
      el.classList.toggle('playing', !!on);
      el.querySelectorAll('.line').forEach(line => {
        line.classList.toggle('active', !!on && (!lang || line.dataset.lang === lang));
      });
    });
  }

  function refreshButtons() {
    document.querySelectorAll('.phrase').forEach(el => {
      const btn = el.querySelector('.loop-btn');
      if (!btn) return;
      const on = state.loop && state.loop.key === el.dataset.key;
      btn.classList.toggle('active', !!on);
      btn.textContent = on ? '⏸' : '🔁';
    });
  }

  function isFav(key) { return state.favs.includes(key); }
  function toggleFav(key) {
    const i = state.favs.indexOf(key);
    if (i === -1) state.favs.push(key); else state.favs.splice(i, 1);
    localStorage.setItem('sexed_favs', JSON.stringify(state.favs));
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function phraseKey(lessonId, idx) { return lessonId + '.' + idx; }

  function saveLessons() { localStorage.setItem('sexed_lessons', JSON.stringify(LESSONS)); }

  function addLesson() {
    const form = document.getElementById('add-form');
    const title = {
      fr: cleanPhrasePart(form.elements.titleFr.value),
      ar: cleanPhrasePart(form.elements.titleAr.value),
      en: cleanPhrasePart(form.elements.titleEn.value)
    };
    if (!title.fr || !title.ar || !title.en) { alert(t('fillTitleError')); return; }
    const phrases = parsePhrases(form.elements.phrases.value);
    if (!phrases.length) { alert(t('noPhrasesError')); return; }
    const id = LESSONS.length ? Math.max(...LESSONS.map(l => l.id)) + 1 : 1;
    LESSONS.push({ id, custom: true, title, phrases });
    saveLessons();
    go({ name: 'home' });
  }

  function deleteLesson(id) {
    if (!confirm(t('deleteConfirm'))) return;
    LESSONS = LESSONS.filter(l => l.id !== id);
    saveLessons();
    go({ name: 'home' }, false);
  }

  function renderAdd() {
    const html = `<div class="breadcrumb"><button data-route='${JSON.stringify({ name: 'home' })}'>${t('lessonsLabel')}</button><span>›</span><span>${t('addLesson')}</span></div>
      <div class="lesson-head"><h2>${t('addLesson')}</h2></div>
      <form id="add-form" class="form-card">
        <div class="form-group"><label data-t="titleFr">${t('titleFr')}</label><input name="titleFr" required placeholder="Ex: Les organes génitaux"></div>
        <div class="form-group"><label data-t="titleAr">${t('titleAr')}</label><input name="titleAr" required placeholder="مثال: الأعضاء التناسلية" dir="rtl"></div>
        <div class="form-group"><label data-t="titleEn">${t('titleEn')}</label><input name="titleEn" required placeholder="Ex: Genital organs"></div>
        <div class="form-group"><label data-t="phrasesLabel">${t('phrasesLabel')}</label><textarea name="phrases" rows="10" placeholder="vagin | المهبل | vagina" required></textarea><div class="hint" data-t="phrasesHint">${t('phrasesHint')}</div></div>
        <div class="form-actions">
          <button type="submit" class="btn">${t('saveLesson')}</button>
          <button type="button" class="btn ghost" data-route='${JSON.stringify({ name: 'home' })}'>${t('cancel')}</button>
        </div>
      </form>`;
    view.innerHTML = html;
    applyTranslations();
  }

  function phraseHTML(p, key) {
    return `<div class="phrase" data-key="${key}">
      <div class="phrase-top">
        <div class="lines">
          <div class="line fr" data-lang="fr" dir="ltr">${esc(p.fr)}</div>
          <div class="line ar" data-lang="ar" dir="rtl">${esc(p.ar)}</div>
          <div class="line en" data-lang="en" dir="ltr">${esc(p.en)}</div>
        </div>
        <div class="btns">
          <button class="speak-btn" title="${t('speakOnce')}">🔊</button>
          <button class="loop-btn" title="${t('loopTitle')}">🔁</button>
          <button class="image-btn" title="${t('imageTitle')}">🖼️</button>
          <button class="fav-btn ${isFav(key) ? 'fav-on' : ''}" title="${t('favTitle')}">${isFav(key) ? '★' : '☆'}</button>
        </div>
      </div>
    </div>`;
  }

  function renderHome() {
    const placeholder = !LESSONS.length ? `<div class="no-lessons"><div class="icon">📝</div><div class="card-title">${t('noLessonsYetTitle')}</div><div class="sub">${t('noLessonsYetSub')}</div></div>` : '';
    const addCard = `<div class="card add-card" data-route='${JSON.stringify({ name: 'add' })}'>
      <div class="num">+</div>
      <div class="card-body">
        <div class="card-title">${t('addLesson')}</div>
        <div class="card-sub">${t('addLessonSub')}</div>
      </div>
      <div class="chev">${chevron()}</div>
    </div>`;
    const html = `<div class="hero"><h1 data-t="heroTitle">${t('heroTitle')}</h1><p data-t="heroSub">${t('heroSub')}</p></div>
      <div class="breadcrumb"><span>${t('lessonsLabel')}</span></div>` + addCard + placeholder +
      LESSONS.map(l => `<div class="card lesson-card" data-lesson="${l.id}">
        <div class="num">${l.id}</div>
        <div class="card-body">
          <div class="card-title">${esc(title(l.title))}</div>
          <div class="card-sub" dir="ltr">${subtitle(l.title)}</div>
          <div class="card-sub">${l.phrases.length} ${t('phrases')}</div>
        </div>
        <button class="delete-btn" data-lesson="${l.id}" title="${t('deleteLesson')}">🗑️</button>
        <div class="chev">${chevron()}</div>
      </div>`).join('');
    view.innerHTML = html;
  }

  function renderLesson(lessonId) {
    const lesson = LESSONS.find(l => l.id === lessonId);
    if (!lesson) { go({ name: 'home' }); return; }
    const html = `<div class="breadcrumb">
        <button data-route='${JSON.stringify({ name: 'home' })}'>${t('lessonsLabel')}</button>
        <span>›</span><span>${esc(title(lesson.title))}</span>
      </div>
      <div class="lesson-head"><h2>${t('lessonLabel')} ${lesson.id}: ${esc(title(lesson.title))}</h2>
        <div class="sub" dir="ltr">${subtitle(lesson.title)}</div>
      </div>
      <div class="lesson-actions">
        <button class="btn" id="play-all">${t('playAll')}</button>
        <button class="btn ghost" id="stop-all">${t('stopAll')}</button>
        <span class="pill">${lesson.phrases.length} ${t('phrases')}</span>
      </div>` +
      lesson.phrases.map((p, i) => phraseHTML(p, phraseKey(lesson.id, i))).join('');
    view.innerHTML = html;
    document.getElementById('play-all').onclick = () => playLesson(lesson);
    document.getElementById('stop-all').onclick = stopSpeech;
  }

  function playLesson(lesson) {
    stopSpeech();
    let i = 0;
    const runKey = 'lesson:' + lesson.id;
    state.loop = { key: runKey };
    (function next() {
      if (!state.loop || state.loop.key !== runKey) return;
      if (i >= lesson.phrases.length) { stopSpeech(); return; }
      const p = lesson.phrases[i];
      const key = phraseKey(lesson.id, i);
      i++;
      const el = document.querySelector(`.phrase[data-key="${key}"]`);
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      speakOnce(p, state.langs, key, () => {
        if (!state.loop || state.loop.key !== runKey) return;
        setTimeout(next, 400);
      });
    })();
  }

  function renderFavs() {
    const items = [];
    LESSONS.forEach(l => {
      l.phrases.forEach((p, i) => {
        const key = phraseKey(l.id, i);
        if (state.favs.includes(key)) items.push({ p, key, lesson: l });
      });
    });
    const html = `<div class="breadcrumb"><button data-route='${JSON.stringify({ name: 'home' })}'>${t('lessonsLabel')}</button><span>›</span><span>${t('favourites')}</span></div>
      <div class="lesson-head"><h2>${t('savedPhrasesTitle')}</h2></div>` +
      (items.length ? items.map(it => `<div class="pill">${esc(title(it.lesson.title))}</div>${phraseHTML(it.p, it.key)}`).join('') : `<div class="empty">${t('noSavedPhrases')}</div>`);
    view.innerHTML = html;
  }

  function renderSearch(q) {
    const needle = q.trim().toLowerCase();
    const results = [];
    LESSONS.forEach(l => {
      l.phrases.forEach((p, i) => {
        const hay = (p.fr + ' ' + p.ar + ' ' + p.en).toLowerCase();
        if (hay.includes(needle)) results.push({ p, key: phraseKey(l.id, i), lesson: l });
      });
    });
    const html = `<div class="breadcrumb"><button data-route='${JSON.stringify({ name: 'home' })}'>${t('lessonsLabel')}</button><span>›</span><span>${t('searchResults')}: ${esc(q)}</span></div>
      <div class="lesson-head"><h2>${t('searchResults')}: ${esc(q)}</h2><div class="sub">${results.length} ${t('phrases')}</div></div>` +
      (results.length ? results.map(r => phraseHTML(r.p, r.key)).join('') : `<div class="empty">${t('noResults')}</div>`);
    view.innerHTML = html;
  }

  function bindViewEvents() {
    view.addEventListener('click', e => {
      const del = e.target.closest('.delete-btn');
      if (del) { e.stopPropagation(); deleteLesson(+del.dataset.lesson); return; }

      const card = e.target.closest('.lesson-card');
      if (card) { go({ name: 'lesson', lesson: +card.dataset.lesson }); return; }

      const routeBtn = e.target.closest('[data-route]');
      if (routeBtn) { go(JSON.parse(routeBtn.dataset.route)); return; }

      const phrase = e.target.closest('.phrase');
      if (!phrase) return;
      const key = phrase.dataset.key;
      const [lessonId, idx] = key.split('.').map(Number);
      const lesson = LESSONS.find(l => l.id === lessonId);
      const p = lesson.phrases[idx];

      if (e.target.closest('.speak-btn')) {
        stopSpeech();
        speakOnce(p, state.langs, key);
      } else if (e.target.closest('.loop-btn')) {
        toggleLoop(p, key);
      } else if (e.target.closest('.image-btn')) {
        window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(p.fr), '_blank');
      } else if (e.target.closest('.fav-btn')) {
        toggleFav(key);
        const favBtn = phrase.querySelector('.fav-btn');
        const on = isFav(key);
        favBtn.classList.toggle('fav-on', on);
        favBtn.textContent = on ? '★' : '☆';
      }
    });
  }

  function go(route, push = true) {
    stopSpeech();
    state.route = route;
    if (push) {
      const hash = route.name === 'home' ? '#/' : route.name === 'lesson' ? `#/lesson/${route.lesson}` : route.name === 'favs' ? '#/favs' : route.name === 'add' ? '#/add' : '#/';
      if (location.hash !== hash) location.hash = hash;
    }
    if (route.name === 'home') renderHome();
    else if (route.name === 'lesson') renderLesson(route.lesson);
    else if (route.name === 'favs') renderFavs();
    else if (route.name === 'search') renderSearch(route.q);
    else if (route.name === 'add') renderAdd();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function parseHash() {
    const h = location.hash || '#/';
    if (h === '#/favs') return { name: 'favs' };
    if (h === '#/add') return { name: 'add' };
    const m = h.match(/#\/lesson\/(\d+)/);
    if (m) return { name: 'lesson', lesson: +m[1] };
    return { name: 'home' };
  }

  function init() {
    document.getElementById('btn-theme').onclick = toggleTheme;
    document.getElementById('btn-stop').onclick = stopSpeech;
    document.getElementById('btn-fav').onclick = () => go({ name: 'favs' });
    document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => setUILang(b.dataset.lang));
    document.getElementById('rate').onchange = e => { state.rate = +e.target.value; stopSpeech(); };
    document.getElementById('loopmode').onchange = e => { state.langs = e.target.value.split(','); stopSpeech(); };
    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim();
      if (q) go({ name: 'search', q: q }, false);
      else go({ name: 'home' }, false);
    });
    window.addEventListener('hashchange', () => { go(parseHash(), false); });
    view.addEventListener('submit', e => { if (e.target.id === 'add-form') { e.preventDefault(); addLesson(); } });
    bindViewEvents();
    setTheme(state.theme);
    setUILang(state.uiLang);
    go(parseHash(), false);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
