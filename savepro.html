<style>

  body.light {

    radial-gradient(620px 300px at 85% -4%, rgba(99,102,241,.10), transparent 62%),

    border-bottom: 1px solid var(--line); padding: .6rem .9rem; }

  .topbar { display: flex; align-items: center; gap: .5rem; max-width: 860px; margin: 0 auto;

  .logo { display: flex; align-items: center; gap: .5rem; font-weight: 900; font-size: 1.1rem;
    flex: none; min-width: 0; letter-spacing: .2px; }
  .logo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

    background-clip: text; -webkit-text-fill-color: transparent; }
  body.light .logo span { background: linear-gradient(90deg, #4f46e5, #7c3aed);
    -webkit-background-clip: text; background-clip: text; }
  .logo img { width: 32px; height: 32px; border-radius: 10px; flex: none;

  .searchbox { flex: 1; display: flex; align-items: center; gap: .4rem;

  .site-icon img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
  .site-name { font-weight: 800; font-size: .82rem; line-height: 1.25; text-align: center;

  .mrow { display: flex; align-items: center; gap: .7rem; width: 100%; background: rgba(139,92,246,.07);

    background-image: radial-gradient(520px 330px at 50% 16%, rgba(139,92,246,.22), transparent 65%); }

    box-shadow: 0 10px 30px rgba(124,58,237,.35); }

  #lock .pinrow { display: flex; gap: .5rem; }
  #lock .pinrow input { flex: 1; min-width: 0; background: var(--field);
    border: 1px solid var(--line); border-radius: 14px; padding: .8rem; color: var(--txt);
    font-size: 1.25rem; text-align: center; letter-spacing: .55em; font-family: inherit;
    outline: none; transition: border-color .15s ease; }
  #lock .pinrow input:focus { border-color: var(--accent); }
  #lock .pinrow button { flex: none; border: none; border-radius: 14px; padding: 0 1.15rem;
    font-size: 1.15rem; color: #fff; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  #lock .pinrow button:active { transform: scale(.94); }
  #lock .lmsg { min-height: 1.2rem; margin-top: .7rem; font-size: .8rem; color: var(--danger); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="logo"><img src="./icon-savepro-192.png" alt="" onerror="this.style.display='none'"><span data-i="appname">savePro</span></div>
    <div class="searchbox">

<main>

<div id="toast"></div>
<div id="overlayRoot"></div>

</div>

<script src="./js/inappbrowser.js"></script>
<script>
(function () {
'use strict';

  },
  en: {

    addSite: 'Add site', editSite: 'Edit site',
    fName: 'Name', fUrl: 'Site URL', fIcon: 'Icon image URL (optional)',
    fUser: 'Username', fPass: 'Password', pickImg: 'Gallery',
    fAddr: 'Address', mapGo: 'Map', openNoAddr: 'Add the address first via ⋮',
    save: 'Save', del: 'Delete', copy: 'Copy', copied: 'Copied ✓', show: 'Show', hide: 'Hide',
    open: 'Open site', openNoUrl: 'Add the site URL first via ⋮',
    exitTitle: 'Exit the app?', yes: 'Yes, exit', no: 'Cancel',
    delTitle: 'Delete this site?', delYes: 'Yes, delete',
    exported: 'Data exported', imported: 'Data imported', errUrl: 'Name + URL or address required',
    userCopied: 'Username copied', passCopied: 'Password copied',
    lockTitle: 'Passcode', lockSub: 'Enter 4 digits to continue',
    lockSet: 'Set passcode (4 digits)', lockChange: 'Change passcode', lockDel: 'Remove passcode',
    lockEnter: 'Current passcode', lockNew: 'New passcode (4 digits)', lockConfirm: 'Confirm passcode',
    lockWrong: 'Wrong passcode', lockNoMatch: 'Passcodes do not match', lockNeedPin: 'Passcode must be 4 digits',
    pinSaved: 'Passcode saved', unlocked: 'Passcode removed'
  }
};
function T() { return I18N[uiLang()] || I18N.ar; }
function uiLang() { return localStorage.getItem('savepro_lang') || 'ar'; }
function setUiLang(l) {
  try { localStorage.setItem('savepro_lang', l); } catch (e) {}
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  applyI18n(); renderGrid();
}
function applyI18n() {
  var t = T();
  document.title = t.appname;
  document.querySelectorAll('[data-i]').forEach(function (el) {
    var k = el.getAttribute('data-i'); if (t[k]) el.textContent = t[k];
  });
  document.querySelectorAll('[data-i-ph]').forEach(function (el) {
    var k = el.getAttribute('data-i-ph'); if (t[k]) el.placeholder = t[k];
  });
  document.getElementById('themeBtn').textContent = isDark() ? '🌙' : '☀';
}

/* ================= data ================= */
var inCap = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
var sites = [];
try { sites = JSON.parse(localStorage.getItem('savepro_sites') || '[]'); } catch (e) { sites = []; }
if (!Array.isArray(sites)) sites = [];

// Built-in starter shortcuts removed — drop them on first run of this version,
// but keep any seed entry the user already customized (credentials/icon/address)
var SEED_IDS = { google: 1, youtube: 1, gmail: 1, facebook: 1, instagram: 1, x: 1, whatsapp: 1, github: 1 };
if (!localStorage.getItem('savepro_seed_v2')) {
  sites = sites.filter(function (s) {
    if (!SEED_IDS[s.id]) return true;
    return !!(s.user || s.pass || s.icon || s.addr);
  });
  saveSites();
  try { localStorage.setItem('savepro_seed_v2', '1'); } catch (e) {}
}
function saveSites() { try { localStorage.setItem('savepro_sites', JSON.stringify(sites)); } catch (e) {} }

function isDark() { return localStorage.getItem('savepro_theme') !== 'light'; }
function applyTheme() { document.body.classList.toggle('light', !isDark()); }
function toggleTheme() {
  try { localStorage.setItem('savepro_theme', isDark() ? 'light' : 'dark'); } catch (e) {}
  applyTheme(); applyI18n();
}

/* ================= helpers ================= */
function el(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.remove('show'); }, 2200);
}
function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
}
function iconUrlFor(s) {
  if (s.icon) return s.icon;
  var h = hostOf(s.url);
  return h ? 'https://www.google.com/s2/favicons?domain=' + h + '&sz=128' : '';
}
function openExternal(url) {
  var B = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Browser;
  if (B && B.open) { B.open({ url: url }); return; }
  window.open(url, '_blank');
}
function copyText(txt, msg) {
  function done() { toast(msg || T().copied); }
  var CB = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Clipboard;
  if (CB && CB.write) { CB.write({ string: txt }).then(done, done); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, done); return;
  }
  var ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove(); done();
}

/* ================= grid ================= */
var q = '';
document.getElementById('search').addEventListener('input', function () {
  q = (this.value || '').toLowerCase().trim(); renderGrid();
});
function renderGrid() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  sites.forEach(function (s) {
    if (q && (s.name + ' ' + (s.url || '') + ' ' + (s.user || '') + ' ' + (s.addr || '')).toLowerCase().indexOf(q) < 0) return;
    var card = el('div', 'site');
    var ic = el('div', 'site-icon', s.name ? s.name[0].toUpperCase() : '?');
    var iu = iconUrlFor(s);
    if (iu) {
      var img = new Image();
      img.src = iu; img.alt = '';
      img.onerror = function () { img.remove(); };
      ic.innerHTML = ''; ic.appendChild(img);
    }
    card.appendChild(ic);
    card.appendChild(el('div', 'site-name', s.name || hostOf(s.url) || '—'));
    if (s.user || s.pass) card.appendChild(el('span', 'has-cred', '🔑'));
    if (s.addr) {
      var mb = el('button', 'site-map', '🗺');
      mb.onclick = function (e) { e.stopPropagation(); openMap(s.addr, s.name); };
      card.appendChild(mb);
    }
    var dots = el('button', 'site-dots', '⋮');
    dots.onclick = function (e) { e.stopPropagation(); openEditor(s); };
    card.appendChild(dots);
    card.onclick = function () { openSite(s); };
    g.appendChild(card);
  });
  var add = el('button', 'site add-card', '➕');
  add.onclick = function () { openEditor(null); };
  g.appendChild(add);
}

/* ================= open / edit ================= */
// In-app WebView: pages open inside savePro, no external browser needed
function openInApp(url, title) {
  var IAB = window.capacitorInAppBrowser && window.capacitorInAppBrowser.InAppBrowser;
  if (inCap && IAB && IAB.openWebView) {
    IAB.openWebView({ url: url, title: title || url })
      .catch(function () { openExternal(url); });
    return;
  }
  openExternal(url);
}
function openMap(addr, title) {
  var a = (addr || '').trim();
  if (!a) { toast(T().openNoAddr); return; }
  var web = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a);
  // geo: URI launches the Google Maps app directly; fall back to the web map
  var AL = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.AppLauncher;
  if (inCap && AL && AL.openUrl) {
    AL.openUrl({ url: 'geo:0,0?q=' + encodeURIComponent(a) })
      .then(function (r) { if (r && r.completed === false) openExternal(web); })
      .catch(function () { openExternal(web); });
    return;
  }
  openExternal(web);
}
function openSite(s) {
  var url = s.url ? (/^https?:\/\//i.test(s.url) ? s.url : 'https://' + s.url) : '';
  if (url) {
    // Keep credentials one tap away: copy the username so it can be pasted at the site
    if (s.user) copyText(s.user, T().userCopied);
    openInApp(url, s.name || url);
    return;
  }
  if (s.addr) { openMap(s.addr, s.name); return; }
  toast(T().openNoUrl);
}

var ovRoot = document.getElementById('overlayRoot');
function closeOv() { ovRoot.innerHTML = ''; }
function sheet() {
  var ov = el('div', 'overlay');
  var sh = el('div', 'sheet');
  ov.appendChild(sh);
  ov.onclick = function (e) { if (e.target === ov) closeOv(); };
  ovRoot.innerHTML = ''; ovRoot.appendChild(ov);
  return sh;
}

// Pick an icon image from the device gallery -> square 128px data URL
function pickIconImage(inp) {
  var fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*';
  fi.onchange = function () {
    var f = fi.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var S = 128;
        var c = document.createElement('canvas');
        c.width = c.height = S;
        var g = c.getContext('2d');
        var m = Math.min(img.width, img.height);
        g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
        try { inp.value = c.toDataURL('image/png'); } catch (e) { inp.value = rd.result; }
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  fi.click();
}

function fieldRow(label, value, opts) {
  opts = opts || {};
  var wrap = el('div');
  wrap.appendChild(el('div', 'flabel', label));
  var row = el('div', 'frow');
  var f = el('div', 'field');
  var inp = document.createElement('input');
  inp.value = value || '';
  inp.dir = opts.ltr ? 'ltr' : 'auto';
  if (opts.ltr) inp.style.textAlign = 'left';
  if (opts.type) inp.type = opts.type;
  if (opts.readonly) inp.readOnly = true;
  inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
  if (opts.attrs) Object.keys(opts.attrs).forEach(function (k) { inp.setAttribute(k, opts.attrs[k]); });
  f.appendChild(inp);
  row.appendChild(f);
  (opts.buttons || []).forEach(function (b) {
    var btn = el('button', 'mini', b.label);
    btn.onclick = function () { b.fn(inp, btn); };
    row.appendChild(btn);
  });
  wrap.appendChild(row);
  wrap.input = inp;
  return wrap;
}

function openEditor(s) {
  var t = T();
  var isNew = !s;
  s = s || { id: 's' + Date.now(), name: '', url: '', icon: '', user: '', pass: '', addr: '' };
  var sh = sheet();
  var h = el('h3');
  h.appendChild(el('span', null, (isNew ? '➕ ' : '✏️ ') + (isNew ? t.addSite : t.editSite)));
  var x = el('button', null, '✕'); x.onclick = closeOv; h.appendChild(x);
  sh.appendChild(h);

  var rName = fieldRow(t.fName, s.name);
  var rUrl  = fieldRow(t.fUrl, s.url, { ltr: true });
  var rIcon = fieldRow(t.fIcon, s.icon, { ltr: true, buttons: [
    { label: '📷 ' + t.pickImg, fn: function (inp) { pickIconImage(inp); } }
  ]});
  var rUser = fieldRow(t.fUser, s.user, { ltr: true, buttons: [
    { label: '📋 ' + t.copy, fn: function (inp) { if (inp.value) copyText(inp.value, t.userCopied); } }
  ]});
  var rPass = fieldRow(t.fPass, s.pass, { ltr: true, type: 'password', buttons: [
    { label: '👁', fn: function (inp) { inp.type = inp.type === 'password' ? 'text' : 'password'; } },
    { label: '📋 ' + t.copy, fn: function (inp) { if (inp.value) copyText(inp.value, t.passCopied); } }
  ]});
  var rAddr = fieldRow(t.fAddr, s.addr, { buttons: [
    { label: '🗺 ' + t.mapGo, fn: function (inp) { openMap(inp.value, rName.input.value); } }
  ]});
  [rName, rUrl, rIcon, rUser, rPass, rAddr].forEach(function (r) { sh.appendChild(r); });

  var act = el('div', 'actions');
  if (!isNew) {
    var del = el('button', 'btn danger', '🗑 ' + t.del);
    del.onclick = function () { confirmDelete(s); };
    act.appendChild(del);
  }
  var save = el('button', 'btn primary', '💾 ' + t.save);
  save.onclick = function () {
    var name = rName.input.value.trim();
    var url = rUrl.input.value.trim();
    var addr = rAddr.input.value.trim();
    if (!name || (!url && !addr)) { toast(t.errUrl); return; }
    s.name = name; s.url = url;
    s.icon = rIcon.input.value.trim();
    s.user = rUser.input.value.trim();
    s.pass = rPass.input.value;
    s.addr = addr;
    if (isNew) sites.unshift(s);
    saveSites(); renderGrid(); closeOv();
  };
  act.appendChild(save);
  sh.appendChild(act);
}

function confirmDialog(text, yesLabel, onYes) {
  var t = T();
  var ov = el('div', 'overlay');
  var d = el('div', 'dlg');
  d.appendChild(el('p', null, text));
  var r = el('div', 'row');
  var no = el('button', null, t.no); no.onclick = closeOv;
  var yes = el('button', 'yes', yesLabel);
  yes.onclick = function () { closeOv(); onYes(); };
  r.appendChild(no); r.appendChild(yes);
  d.appendChild(r); ov.appendChild(d);
  ov.onclick = function (e) { if (e.target === ov) closeOv(); };
  ovRoot.innerHTML = ''; ovRoot.appendChild(ov);
}
function confirmDelete(s) {
  confirmDialog(T().delTitle, T().delYes, function () {
    sites = sites.filter(function (x) { return x !== s && x.id !== s.id; });
    saveSites(); renderGrid();
  });
}

/* ================= menu ================= */
function openMenu() {
  var t = T();
  var sh = sheet();
  var h = el('h3');
  h.appendChild(el('span', null, t.menu));
  var x = el('button', null, '✕'); x.onclick = closeOv; h.appendChild(x);
  sh.appendChild(h);

  var lt = el('div', 'flabel', t.langTitle);
  sh.appendChild(lt);
  var langs = el('div', 'langs');
  [['ar', '🇸🇾 عربي'], ['fr', '🇫🇷 Français'], ['en', '🇺🇸 English']].forEach(function (o) {
    var b = el('button', 'langb' + (uiLang() === o[0] ? ' on' : ''), o[1]);
    b.onclick = function () { setUiLang(o[0]); openMenu(); };
    langs.appendChild(b);
  });
  sh.appendChild(langs);

  function row(icon, label, fn) {
    var b = el('button', 'mrow');
    b.appendChild(el('span', 'mi', icon));
    b.appendChild(el('span', null, label));
    b.onclick = fn;
    sh.appendChild(b);
  }
  row(isDark() ? '☀' : '🌙', isDark() ? t.themeLight : t.themeDark, function () { toggleTheme(); openMenu(); });
  if (hasPin()) {
    row('🔑', t.lockChange, function () { closeOv(); pinSetup(); });
    row('🚫', t.lockDel, function () { closeOv(); pinRemove(); });
  } else {
    row('🔒', t.lockSet, function () { closeOv(); pinSetup(); });
  }
  row('⬇', t.exportData, function () { closeOv(); exportData(); });
  row('⬆', t.importData, function () { closeOv(); importData(); });
}

/* ================= passcode ================= */
function pinHash(p) {
  var h = 5381, s = 'sp:' + p + ':v1';
  for (var i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(36);
}
function hasPin() { return !!localStorage.getItem('savepro_pin'); }
function showLock() {
  if (!hasPin()) return;
  document.getElementById('lock').classList.remove('hidden');
  var inp = document.getElementById('lockPin');
  inp.value = '';
  document.getElementById('lockMsg').textContent = '';
  setTimeout(function () { try { inp.focus(); } catch (e) {} }, 250);
}
function tryUnlock() {
  var inp = document.getElementById('lockPin');
  if (pinHash(inp.value) === localStorage.getItem('savepro_pin')) {
    document.getElementById('lock').classList.add('hidden');
  } else {
    document.getElementById('lockMsg').textContent = T().lockWrong;
    inp.value = ''; try { inp.focus(); } catch (e) {}
  }
}
function pinField(label) {
  return fieldRow(label, '', { ltr: true, type: 'password',
    attrs: { inputmode: 'numeric', maxlength: '4', pattern: '[0-9]*' } });
}
function pinSheet(title, rows, btnTxt, fn) {
  var sh = sheet();
  var h = el('h3');
  h.appendChild(el('span', null, title));
  var x = el('button', null, '✕'); x.onclick = closeOv; h.appendChild(x);
  sh.appendChild(h);
  rows.forEach(function (r) { sh.appendChild(r); });
  var act = el('div', 'actions');
  var b = el('button', 'btn primary', btnTxt);
  b.onclick = fn; act.appendChild(b); sh.appendChild(act);
  setTimeout(function () { try { rows[0].input.focus(); } catch (e) {} }, 250);
}
function pinVerify(cb) {
  var t = T();
  var r = pinField(t.lockEnter);
  pinSheet('🔒 ' + t.lockEnter, [r], '✓', function () {
    if (pinHash(r.input.value) === localStorage.getItem('savepro_pin')) { closeOv(); cb(); }
    else { toast(t.lockWrong); r.input.value = ''; }
  });
}
function pinSetup() {
  var t = T();
  function next() {
    var r1 = pinField(t.lockNew), r2 = pinField(t.lockConfirm);
    pinSheet('🔐 ' + (hasPin() ? t.lockChange : t.lockSet), [r1, r2], '💾 ' + t.save, function () {
      var v1 = r1.input.value.trim(), v2 = r2.input.value.trim();
      if (!/^\d{4}$/.test(v1)) { toast(t.lockNeedPin); return; }
      if (v1 !== v2) { toast(t.lockNoMatch); return; }
      try { localStorage.setItem('savepro_pin', pinHash(v1)); } catch (e) {}
      closeOv(); toast(t.pinSaved);
    });
  }
  if (hasPin()) pinVerify(next); else next();
}
function pinRemove() {
  pinVerify(function () {
    try { localStorage.removeItem('savepro_pin'); } catch (e) {}
    toast(T().unlocked);
  });
}

/* ================= export / import ================= */
// Same flow as gramvip: write to CACHE as base64, then open the native share sheet
async function exportData() {
  var t = T();
  var out = { app: 'savepro', version: 1, exportedAt: new Date().toISOString(), sites: sites };
  var blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  var name = 'savepro-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  var FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
  var SH = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Share;
  if (inCap && FS && SH) {
    try {
      var text = await new Promise(function (res) {
        var rd = new FileReader(); rd.onload = function () { res(rd.result); }; rd.readAsDataURL(blob);
      });
      var w = await FS.writeFile({ path: name, data: text.split(',')[1], directory: 'CACHE', recursive: true });
      await SH.share({ title: name, url: w.uri });
      toast(t.exported);
      return;
    } catch (e) { console.error(e); }
  }
  var u = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  toast(t.exported);
}
function importData() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var j = JSON.parse(rd.result);
        var list = j.sites || j;
        if (!Array.isArray(list)) throw new Error('bad');
        var seen = {};
        sites.forEach(function (s) { seen[s.id] = 1; });
        list.forEach(function (s) {
          if (!s || (!s.url && !s.addr)) return;
          if (!s.id) s.id = 's' + Date.now() + Math.random().toString(36).slice(2, 6);
          if (seen[s.id]) s.id = s.id + '_i';
          seen[s.id] = 1;
          sites.push({ id: s.id, name: s.name || hostOf(s.url), url: s.url,
            icon: s.icon || '', user: s.user || '', pass: s.pass || '', addr: s.addr || '' });
        });
        saveSites(); renderGrid(); toast(T().imported);
      } catch (e) { toast('import ✗'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ================= exit confirm ================= */
function confirmExit() {
  var t = T();
  confirmDialog(t.exitTitle, t.yes, function () {
    var A = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
    if (A && A.exitApp) A.exitApp(); else window.close();
  });
}

/* ================= wire up ================= */
document.getElementById('themeBtn').onclick = toggleTheme;
document.getElementById('menuBtn').onclick = openMenu;

var lockInp = document.getElementById('lockPin');
document.getElementById('lockGo').onclick = tryUnlock;
lockInp.addEventListener('input', function () { if (this.value.length >= 4) tryUnlock(); });
lockInp.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });

var CapApp = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
if (CapApp && CapApp.addListener) {
  CapApp.addListener('backButton', function () {
    if (!document.getElementById('lock').classList.contains('hidden')) {
      if (CapApp.exitApp) CapApp.exitApp();
      return;
    }
    if (ovRoot.firstChild) { closeOv(); return; }
    confirmExit();
  });
  CapApp.addListener('appStateChange', function (st) {
    if (st && st.isActive && hasPin()) showLock();
  });
}

applyTheme();
applyI18n();
renderGrid();
if (hasPin()) showLock();

// Service worker: PWA only, never inside Capacitor
if (!inCap && 'serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw-savepro.js').catch(function () {});
  });
}
})();
</script>
