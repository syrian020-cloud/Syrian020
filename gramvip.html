            ensureGrp().phrases.push(fp2);
          } else if (HDR_NUM.test(fsegs[0].text)) {
            ftri.lines[0].text = ftri.lines[0].text.replace(HDR_NUM, '');
            if (ftri.fr) ftri.fr = ftri.fr.replace(HDR_NUM, '');
            newSec(ftri);
          } else if (!lesson.sections.length && !hasTriText(lesson.title)) {
            // a flagged trilingual line before any section beats a guessed prose title
            lesson.title = ftri;
          } else {
            newGrp(ftri);
          }
          continue;
        }
        var txt = deLabel(stripFlag(line));
        var fm2 = line.trim().match(ANY_FLAG_RE);
        var leadFlag = fm2 ? fm2[0] : '🏳️';
        if (HDR_NUM.test(txt)) {
          // '🇫🇷 1. …' single-flag numbered lines open a group
          flushPhrase();
          var gt = { fr: '', ar: '', en: '', lines: [{ lang: fl, flag: LANG_FLAG[fl] || leadFlag, text: txt.replace(HDR_NUM, '') }] };
          if (fl === 'fr') gt.fr = txt.replace(HDR_NUM, '');
          else if (fl === 'ar') gt.ar = txt.replace(HDR_NUM, '');
          else if (fl === 'en') gt.en = txt.replace(HDR_NUM, '');
          newGrp(gt);
        } else {
          if (bb && curPhrase) flushPhrase();
          var np = pushFlagLine(curPhrase, fl, LANG_FLAG[fl] || leadFlag, txt);
          if (np._new) { flushPhrase(); delete np._new; }
          curPhrase = np;
          if (tStart != null && curPhrase.start == null) { curPhrase.start = tStart; if (tEnd != null) curPhrase.end = tEnd; }
        }
        continue;
      }
      // non-flag line
      if (/^[-—–*_=\s]{3,}$/.test(line)) continue; // decorative dividers
      if (/^[\u{1F524}🗣🔊]/u.test(line)) {
        // pronunciation/latin guide line — stays inside the current phrase, unspeakable
        var mt = deLabel(line.replace(/^[\u{1F524}🗣🔊]\uFE0F?\s*/u, ''));
        var mmark = line.match(/^[\u{1F524}🗣🔊]\uFE0F?/u);
        if (curPhrase && mt) { curPhrase.lines.push({ lang: '', flag: '', text: (mmark ? mmark[0] + ' ' : '') + mt }); }
        else if (mt) { ensureGrp().notes.push(line); }
        continue;
      }
      if (line.indexOf('\t') >= 0 || /[|→=]/.test(line) || line.indexOf(' - ') >= 0) {
        var tp = splitParts(line);
        if (tp.length >= 2) {
          flushPhrase();
          var tpp = partsToTri(tp);
          if (tStart != null) { tpp.start = tStart; if (tEnd != null) tpp.end = tEnd; }
          ensureGrp().phrases.push(tpp); continue;
        }
      }
      if (isHeaderLine(line)) {
        var numbered = HDR_NUM.test(line);
        var hparts = splitParts(line.replace(HDR_NUM, ''));
        var hTri = partsToTri(hparts.length ? hparts : [line]);
        // numbered headers open a section; unnumbered ones group inside it
        if (numbered || !cur) newSec(hTri);
        else newGrp(hTri);
      } else {
        flushPhrase();
        ensureGrp().notes.push(line);
      }
    }
    flushPhrase();
    // drop empty groups and sections
    lesson.sections.forEach(function (s) {
      s.groups = (s.groups || []).filter(function (g) { return g.phrases.length || g.notes.length; });
    });
    lesson.sections = lesson.sections.filter(function (s) { return s.groups.length; });
    return lesson;
  }

  function secGroups(s) {
    if (s.groups) return s.groups;
    // legacy shape {phrases, notes} from older saved lessons
    return [{ title: null, phrases: s.phrases || [], notes: s.notes || [] }];
  }
  function secPhrases(s) {
    return secGroups(s).reduce(function (a, g) { return a.concat(g.phrases); }, []);
  }

  /* ==================== TTS ==================== */
  var nativeTTS = (typeof window.Capacitor !== 'undefined' && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech);
  var speakSeq = 0;

  function stopSpeaking() {
    speakSeq++;
    if (window.EdgeTTS) EdgeTTS.stop();
    if (nativeTTS && window.Capacitor.Plugins.TextToSpeech.stop) {
      try { window.Capacitor.Plugins.TextToSpeech.stop(); } catch (e) {}
    }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    document.querySelectorAll('.speaking').forEach(function (b) { b.classList.remove('speaking'); });
    document.querySelectorAll('.looping').forEach(function (b) { b.classList.remove('looping'); });
    document.querySelectorAll('.phrase.playing').forEach(function (b) { b.classList.remove('playing'); });
  }

  function cleanSpoken(s) {
    return s.replace(/[\u{2190}-\u{21FF}\u{27F0}-\u{27FF}\u{2900}-\u{297F}\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '')
      .replace(/\s{2,}/g, ' ').trim();
  }

  function speakOnce(text, el, lang) {
    if (el.classList.contains('looping')) { stopSpeaking(); return; }
    stopSpeaking();
    pauseMedia();
    el.classList.add('looping');
    var seq = speakSeq;
    var done = function () { if (seq === speakSeq) el.classList.remove('looping'); };
    text = cleanSpoken(text);
    if (!text) { done(); return; }
    speakAuto(text, lang || 'fr', 1, done);
  }

  function speakLoop(text, el, lang) {
    if (el.classList.contains('looping')) { stopSpeaking(); return; }
    stopSpeaking();
    pauseMedia();
    el.classList.add('looping');
    var seq = speakSeq;
    var done = function () { if (seq === speakSeq) el.classList.remove('looping'); };
    text = cleanSpoken(text);
    if (!text) { done(); return; }
    speakAuto(text, lang || 'fr', 0, done);
  }

  // ProLang-style Google AI query: every phrase line labelled in English,
  // then a 3-step task (word-by-word, grammar rule, practice conversation)
  var LANG_EN = { fr:'French', ar:'Arabic', en:'English', de:'German', es:'Spanish', it:'Italian', zh:'Chinese', ja:'Japanese', ko:'Korean', th:'Thai', vi:'Vietnamese', hi:'Hindi', el:'Greek', ka:'Georgian', hy:'Armenian', he:'Hebrew', ru:'Russian', tr:'Turkish', pt:'Portuguese', nl:'Dutch', pl:'Polish', uk:'Ukrainian', sv:'Swedish', fa:'Persian', ur:'Urdu', bn:'Bengali', id:'Indonesian', ms:'Malay', tl:'Filipino', ro:'Romanian', hu:'Hungarian', cs:'Czech', bg:'Bulgarian', hr:'Croatian', sr:'Serbian', da:'Danish', nb:'Norwegian', fi:'Finnish', mn:'Mongolian', sw:'Swahili', zu:'Zulu', yo:'Yoruba', am:'Amharic', is:'Icelandic', sq:'Albanian', lt:'Lithuanian', lv:'Latvian', et:'Estonian' };
  function langEn(l) { return LANG_EN[l] || l; }
  function aiSearchQuery(ls) {
    var m = {}; ls.forEach(function (x) { if (x.lang && x.text) m[x.lang] = x.text; });
    var ks = Object.keys(m); if (!ks.length) return '';
    var ml = ls[0] && m[ls[0].lang] ? ls[0].lang : ks[0];
    var mlName = langEn(ml);
    var others = ks.filter(function (k) { return k !== ml; });
    var names = [mlName].concat(others.map(langEn));
    // single-line query: multi-line prompt text trips Google's "harmful request?" screen
    var parts = [mlName + ' phrase: "' + m[ml] + '"'];
    others.forEach(function (k) { parts.push(langEn(k) + ' translation: "' + m[k] + '"'); });
    var nat = names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0];
    parts.push('1) Translate each individual word (' + names.join(' → ') + ').');
    parts.push('2) Explain the ' + mlName + ' grammar rule (verb conjugation, structure, or expression) used in this phrase.');
    parts.push('3) Provide a short practical conversation in ' + nat + ' using this phrase so it can be memorized as a conversation.');
    parts.push('Output in ' + nat + '.');
    return parts.join(' ');
  }
  function openAiSearch(p) {
    var prompt = aiSearchQuery(pLines(p));
    if (!prompt) return;
    var hl = state.lang === 'ar' ? 'ar' : (state.lang === 'fr' ? 'fr' : 'en');
    var url = 'https://www.google.com/search?q=' + encodeURIComponent(prompt) + '&udm=50&hl=' + hl;
    var BR = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
    if (BR && BR.open) { BR.open({ url: url }); return; }
    window.open(url, '_blank');
  }

  function searchImages(text) {
    var url = 'https://www.google.com/search?q=' + encodeURIComponent(text + ' clipart') + '&udm=2&hl=' + (state.lang === 'ar' ? 'ar' : (state.lang === 'fr' ? 'fr' : 'en'));
    var BR = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
    if (BR && BR.open) { BR.open({ url: url }); return; }
    window.open(url, '_blank');
  }

  function speakWeb(text, lang, times, done) {
    if (!window.speechSynthesis) { done(); return; }
    var n = 0;
    var seq = speakSeq;
    function once() {
      if ((times > 0 && n >= times) || seq !== speakSeq) { done(); return; }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = TTS_LANG[lang] || lang || 'fr-FR';
      u.rate = (lang === 'fr' ? 0.92 : 0.95) * (state.speed || 1);
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(u.lang.slice(0, 2).toLowerCase()) === 0) { u.voice = voices[i]; break; }
      }
      u.onend = function () { n++; once(); };
      u.onerror = function () { done(); };
      window.speechSynthesis.speak(u);
    }
    once();
  }

  function speakNative(text, lang, times, done) {
    var n = 0;
    var seq = speakSeq;
    function once() {
      if ((times > 0 && n >= times) || seq !== speakSeq) { done(); return; }
      window.Capacitor.Plugins.TextToSpeech.speak({
        text: text,
        lang: TTS_LANG[lang] || lang || 'fr-FR',
        rate: (lang === 'fr' ? 0.92 : 0.95) * (state.speed || 1),
        pitch: 1.0,
        volume: 1.0,
        category: 'ambient'
      }).then(function () { n++; once(); })
        .catch(function () { done(); });
    }
    once();
  }

  function speakSequence(items, btn, phraseEls) {
    if (!items || !items.length) return;
    if (btn.classList.contains('speaking')) { stopSpeaking(); return; }
    stopSpeaking();
    btn.classList.add('speaking');
    var seq = speakSeq;
    var done = function () { if (seq === speakSeq) btn.classList.remove('speaking'); };
    var idx = 0, li = 0, round = 0;
    function play() {
      if (seq !== speakSeq) { done(); return; }
      if (idx >= items.length) {
        round++;
        var rounds = state.loop === 0 ? Infinity : Math.max(1, state.loop);
        if (round >= rounds) { done(); return; }
        idx = 0; li = 0;
      }
      var speakList = pLines(items[idx]).filter(function (x) {
        return state.playlang === 'all' || x.lang === state.playlang;
      });
      var cur = speakList[li] || { lang: 'fr', text: '' };
      var text = cleanSpoken(cur.text || '');
      var spLang = cur.lang;
      if (li === 0 && phraseEls && phraseEls.length) {
        for (var pi = 0; pi < phraseEls.length; pi++) phraseEls[pi].classList.toggle('playing', pi === idx);
        if (phraseEls[idx]) phraseEls[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      var step = function () { li++; if (li >= speakList.length) { li = 0; idx++; } play(); };
      if (!text || !HAS_VOICE[spLang]) { step(); return; }
      speakAuto(text, spLang, 1, step);
    }
    play();
  }

  function speak(text, lang, btn) {
    if (btn.classList.contains('speaking')) { stopSpeaking(); return; }
    stopSpeaking();
    pauseMedia();
    btn.classList.add('speaking');
    text = cleanSpoken(text);
    if (!text) { btn.classList.remove('speaking'); return; }
    var seq = speakSeq;
    var done = function () { if (seq === speakSeq) btn.classList.remove('speaking'); };
    speakAuto(text, lang, state.loop, done);
  }

  function speakEdge(text, lang, times, done, fail) {
    var seq = speakSeq;
    EdgeTTS.audio(text, lang).then(function (a) {
      if (seq !== speakSeq) { done(); return; }
      var n = 0;
      (function once() {
        if ((times > 0 && n >= times) || seq !== speakSeq) { done(); return; }
        EdgeTTS.playUrl(a.url).then(function () { n++; once(); }).catch(function (e) {
          if (seq !== speakSeq) { done(); return; }
          EdgeTTS.down = true;
          fail(e);
        });
      })();
    }).catch(function (e) { fail(e); });
  }

  function speakFallback(text, lang, times, done) {

  }

  var edgeErrShown = false;
  function sayText(s) {

  }
  function speakAuto(text, lang, times, done) {
    text = sayText(text);

        if (seq0 !== speakSeq) return;
        if (!edgeErrShown) { edgeErrShown = true; toast('⚠️ ' + String((err && err.message) || err || 'edge tts')); }
        speakFallback(text, lang, times, done);
      });
    } else {
      speakFallback(text, lang, times, done);
    }
  }

  /* ==================== rendering ==================== */
  function folderById(id) { return folders.filter(function (f) { return f.id === id; })[0]; }
  function lessonById(id) { return lessons.filter(function (l) { return l.id === id; })[0]; }
  function lessonsIn(folderId) { return lessons.filter(function (l) { return l.folderId === folderId; }); }
  function lessonPhraseCount(l) { return l.sections.reduce(function (n, s) { return n + secPhrases(s).length; }, 0); }
  function allPhrases() {
    var n = 0;

    return n;
  }
  function dedupeSlashes(s) {
    var seen = {}, out = [];
    String(s).split(' / ').forEach(function (p) {

    });

  }
  function lessonTitle(l) { return dedupeSlashes(tri(l.title)) || t('unnamed'); }
  function lessonSub(l) {

    var main = lessonTitle(l);

      return s && s !== main && main.indexOf(s) < 0 && s.indexOf(main) < 0;

  function applyLang() {

  function applyTheme() {

  function wordsHtml(s) {

  }
  var plIconMode = (typeof localStorage !== 'undefined' && localStorage.getItem('plIconMode')) || 'loop';
  function plBtnGlyph(lang, flag) { return plIconMode === 'flag' ? (flag || LANG_FLAG[lang] || '🏳️') : '⟳'; }
  function togglePlIconMode() {

  function renderFolder() {

  /* ==================== timed media (video/audio + synced phrases) ==================== */
  var mediaEl = null, mediaUrl = null, timedEls = [];
  function pauseMedia() { if (mediaEl) { try { mediaEl.pause(); } catch (e) {} } }
  function pickLessonMedia(l) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'video/*,audio/*';
    inp.onchange = async function (e) {
      var file = e.target.files[0]; if (!file) return;
      var kind = /^video\//.test(file.type) ? 'video' : 'audio';
      l.media = { kind: kind, name: file.name };
      await idbPut('lessons', l);
      await idbPut('media', { id: l.id, blob: file, kind: kind, name: file.name });
      toast('✓ ' + t('mediaAdded'));
      renderLesson();
    };
    inp.click();
  }
  async function loadLessonMedia(l) {
    var box = document.getElementById('mediaBox');
    if (!box) return;
    pauseMedia(); mediaEl = null; curCueEl = null; segLoop.on = false; segLoop.el = null;
    if (mediaUrl) { URL.revokeObjectURL(mediaUrl); mediaUrl = null; }
    timedEls = Array.prototype.slice.call(document.querySelectorAll('.phrase[data-ts]'));
    if (!l.media) { box.innerHTML = ''; return; }
    var rec = null;
    try { rec = await new Promise(function (res) { var r = idb.transaction('media').objectStore('media').get(l.id); r.onsuccess = function () { res(r.result); }; r.onerror = function () { res(null); }; }); } catch (e) {}
    if (!rec || !rec.blob) {
      box.innerHTML = '<div class="media-box"><div class="mb-miss">' + esc(t('mediaMiss') + ' — ' + (l.media.name || '')) + '</div>' +
        '<div class="mb-tools"><button class="mb-x" title="' + esc(t('remove')) + '">×</button></div></div>';
      box.querySelector('.mb-x').onclick = function () { removeLessonMedia(l); };
      return;
    }
    mediaUrl = URL.createObjectURL(rec.blob);
    var isV = (l.media.kind || rec.kind) === 'video';
    box.innerHTML = '<div class="media-box">' +
      (isV ? '<video controls playsinline src="' + mediaUrl + '"></video>' : '<audio controls src="' + mediaUrl + '"></audio>') +
      '<div class="mb-cap" id="mbCap"></div></div>';
    mediaEl = box.querySelector(isV ? 'video' : 'audio');
    mediaEl.addEventListener('timeupdate', syncCues);
    mediaEl.addEventListener('play', function () { stopSpeaking(); });
    mediaEl.addEventListener('ended', segLoopReset);
    timedEls.forEach(function (el) {
      el.classList.add('cueable');
      el.addEventListener('click', cueSeek);
    });
  }
  function cueSeek(ev) {
    if (!mediaEl) return;
    // taps meant for TTS/buttons must not seek+play the video (which would kill the TTS)
    if (ev.target && ev.target.closest && ev.target.closest('button, .w, .ph-img, .cap-card, a')) return;
    var el = ev.currentTarget;
    mediaEl.currentTime = parseFloat(el.dataset.ts) || 0;
    mediaEl.play();
  }
  // segment loop: repeat a phrase's video/audio cue until toggled off
  var segLoop = { on: false, start: 0, end: Infinity };
  function cueEnd(el) {
    if (!el) return Infinity;
    var e = parseFloat(el.dataset.te || 'NaN');
    if (!isNaN(e)) return e;
    var ix = timedEls.indexOf(el);
    return (ix >= 0 && timedEls[ix + 1]) ? parseFloat(timedEls[ix + 1].dataset.ts) : (mediaEl && mediaEl.duration || Infinity);
  }
  function setSegLoop(el, btn) {
    if (!mediaEl || !el) { toast('🎬 ' + t('media')); return; }
    stopSpeaking();
    var s = parseFloat(el.dataset.ts) || 0;
    if (segLoop.on && segLoop.el === el) { segLoop.on = false; markSegBtns(); return; } // toggle off
    segLoop.on = true; segLoop.el = el; segLoop.start = s; segLoop.end = cueEnd(el);
    mediaEl.currentTime = s;
    mediaEl.play();
    markSegBtns();
  }
  function segLoopReset() { if (segLoop.on) { segLoop.on = false; markSegBtns(); } }
  function markSegBtns() {
    document.querySelectorAll('.ph-medloop').forEach(function (b) {
      b.classList.toggle('segloop', segLoop.on && b.closest('[data-ts]') === segLoop.el);
    });
    var rb = document.querySelector('[data-cap="replay"]');
    if (rb) rb.classList.toggle('segloop', segLoop.on);
  }
  var curCueEl = null;
  function renderCueCap(el) {
    var cap = document.getElementById('mbCap');
    if (!cap || el === curCueEl) return;
    curCueEl = el;
    if (!el) { cap.innerHTML = ''; return; }
    // Zeelang-style caption card: one white row per language + orange loop button
    var rows = '';
    el.querySelectorAll('.pl').forEach(function (pl) {
      var lang = pl.dataset.lang || '';
      var txt = (pl.querySelector('.txt') || {}).textContent || '';
      var fb = pl.querySelector('.flag-btn');
      var flag = fb ? (fb.dataset.flag || '') : '';
      rows += '<div class="cap-pl"><span class="cap-txt" data-lang="' + esc(lang) + '">' +
        esc(txt).split(' ').filter(Boolean).map(function (w) { return '<span class="w">' + w + '</span>'; }).join(' ') +
        '</span>' + (HAS_VOICE[lang]
          ? '<button class="cap-loop' + (plIconMode === 'flag' ? ' flagmode' : '') + '" data-lang="' + esc(lang) + '" data-flag="' + esc(flag) + '">' + plBtnGlyph(lang, flag) + '</button>'
          : '<span class="cap-loop flag-ico' + (plIconMode === 'flag' ? ' flagmode' : '') + '">' + esc(flag || LANG_FLAG[lang] || '🏳️') + '</span>') + '</div>';
    });
    cap.innerHTML = '<div class="cap-card">' + rows + '</div>' +
      '<div class="cap-ctrl">' +
      '<button data-cap="stop" title="⏹">⏹</button><button data-cap="back" title="⏪">⏪</button>' +
      '<button data-cap="replay" title="🔁">🔁</button><button data-cap="fwd" title="⏩">⏩</button></div>';
    wireCaption(cap, el);
  }
  function wireCaption(cap, el) {
    cap.querySelectorAll('.cap-loop').forEach(function (b) {
      b.onclick = function (ev) {
        ev.stopPropagation();
        if (b.classList.contains('speaking')) { stopSpeaking(); b.classList.remove('speaking'); return; }
        cap.querySelectorAll('.cap-loop').forEach(function (x) { x.classList.remove('speaking'); });
        stopSpeaking();
        pauseMedia();
        b.classList.add('speaking');
        speakAuto(cleanSpoken(b.parentElement.querySelector('.cap-txt').textContent), b.dataset.lang, 0, function () { b.classList.remove('speaking'); });
      };
    });
    cap.querySelectorAll('.cap-txt .w').forEach(function (w) {
      var tm = null;
      w.onclick = function (ev) {
        ev.stopPropagation();
        var lang = (w.closest('.cap-txt') || {}).dataset ? w.closest('.cap-txt').dataset.lang : '';
        if (tm) { clearTimeout(tm); tm = null; searchImages(w.textContent); return; }   // double-tap → image search
        tm = setTimeout(function () { tm = null; speakLoop(w.textContent, w, lang || 'fr'); }, 270); // tap → word loop
      };
    });
    cap.querySelectorAll('[data-cap]').forEach(function (b) {
      b.onclick = function (ev) {
        ev.stopPropagation();
        if (!mediaEl) return;
        var act = b.dataset.cap, now = mediaEl.currentTime;
        var s = el && el.dataset.ts ? parseFloat(el.dataset.ts) : 0;
        var ix = timedEls.indexOf(el);
        if (act === 'stop') { segLoop.on = false; markSegBtns(); mediaEl.pause(); }
        else if (act === 'replay') { setSegLoop(el, b); }
        else if (act === 'back' || act === 'fwd') {
          var tgt = (act === 'back')
            ? ((now - s > 1.5 || ix <= 0) ? el : timedEls[ix - 1])
            : (ix >= 0 && timedEls[ix + 1] ? timedEls[ix + 1] : null);
          if (tgt) {
            mediaEl.currentTime = parseFloat(tgt.dataset.ts) || 0;
            if (segLoop.on) { segLoop.el = tgt; segLoop.start = parseFloat(tgt.dataset.ts) || 0; segLoop.end = cueEnd(tgt); markSegBtns(); }
            else mediaEl.play();
          } else if (act === 'back') mediaEl.currentTime = s;
        }
      };
    });
  }
  function syncCues() {
    if (!mediaEl || !timedEls.length) return;
    var now = mediaEl.currentTime, active = null;
    timedEls.forEach(function (el) {
      var s = parseFloat(el.dataset.ts), e = parseFloat(el.dataset.te || 'NaN');
      if (isNaN(e)) {
        // cue runs until the next timed phrase starts (scan all timed phrases in order)
        var ix = timedEls.indexOf(el);
        e = (ix >= 0 && timedEls[ix + 1]) ? parseFloat(timedEls[ix + 1].dataset.ts) : Infinity;
      }
      var on = now >= s && now < e;
      el.classList.toggle('cue-on', on);
      if (on) active = el;
    });
    if (segLoop.on && mediaEl.currentTime >= segLoop.end - 0.05) mediaEl.currentTime = segLoop.start;
    renderCueCap(active);
  }
  async function removeLessonMedia(l) {
    delete l.media;
    await idbPut('lessons', l);
    await idbDel('media', l.id);
    pauseMedia(); mediaEl = null; segLoop.on = false; segLoop.el = null;
    toast('✓ ' + t('deleted'));
    renderLesson();
  }

  function findPhrase(btn) {
    var phraseEl = btn.closest('.phrase');
    var lines = [];
    phraseEl.querySelectorAll('.pl').forEach(function (pl) {
      var lang = pl.dataset.lang || 'fr';
      lines.push({ lang: lang, flag: LANG_FLAG[lang] || '🏳️', text: pl.querySelector('.txt').textContent });
    });
    return { lines: lines };
  }
  function findPhraseObj(btn) {
    var el = btn.closest('.phrase');
    if (!el || !el.dataset.l) return null;
    var l = lessonById(el.dataset.l);
    if (!l) return null;
    var sec = l.sections[parseInt(el.dataset.s, 10)];
    if (!sec) return null;
    var g = secGroups(sec)[parseInt(el.dataset.g, 10)];
    if (!g) return null;
    var p = g.phrases[parseInt(el.dataset.p, 10)];
    return p ? { lesson: l, phrase: p, el: el } : null;
  }
  function delPhraseImg(f) {

  var phImgBtn = null;
  function wireFlagButtons(wrap) {
    wrap.querySelectorAll('.pl .flag-btn[data-lang]').forEach(function (b) {

  function renderSearch() {
    var head = document.getElementById('viewHead');
    var wrap = document.getElementById('content');
    var q = state.query.trim().toLowerCase();
    head.innerHTML = '';
    var visible = 0, rendered = 0, capped = false;
    var html = '';
    lessons.forEach(function (l) {
      var f = folderById(l.folderId);
      var lessonHit = allText(l.title).toLowerCase().indexOf(q) >= 0;
      var lessonHtml = '';
      l.sections.forEach(function (sec, si) {
        var secHit = allText(sec.title).toLowerCase().indexOf(q) >= 0;
        var items = [];
        secGroups(sec).forEach(function (g, gi) { g.phrases.forEach(function (p, pi) { items.push({ p: p, g: gi, i: pi }); }); });
        var shown = items.filter(function (it) {
          return lessonHit || secHit || allText(it.p).toLowerCase().indexOf(q) >= 0;
        });
        visible += shown.length;
        if (!shown.length) return;
        if (rendered >= 250) { capped = true; return; }
        if (rendered + shown.length > 250) { shown = shown.slice(0, 250 - rendered); capped = true; }
        rendered += shown.length;
        lessonHtml += '<div class="section open"><div class="section-head"><span class="sec-icon">📖</span>' +
          '<span class="sec-title">' + esc(tri(sec.title) || t('sections')) + speakFlags(sec.title) + '</span>' +
          '<span class="sec-count">' + shown.length + ' ' + t('phrasesCount') + '</span></div>' +
          '<div class="section-body">' + shown.map(function (it) { return phraseHtml(it.p, { l: l.id, s: si, g: it.g, p: it.i }); }).join('') + '</div></div>';
      });
      if (lessonHtml) {
        html += '<div class="centre-group">' + (f ? iconHtml(f.icon || '📁') + ' ' + esc(f.name) : '') + ' › ' +
          '<span class="link" data-lesson="' + l.id + '">' + esc(lessonTitle(l)) + '</span></div>' + lessonHtml;
      }
    });
    wrap.innerHTML = html;
    document.getElementById('empty').style.display = (visible === 0) ? '' : 'none';
    if (capped) wrap.innerHTML += '<div class="centre-group">…</div>';
    wrap.querySelectorAll('.section-head').forEach(function (h) {
      h.onclick = function () { h.parentElement.classList.toggle('open'); };
    });
    wrap.querySelectorAll('[data-lesson]').forEach(function (lnk) {
      lnk.onclick = function () {
        var l = lessonById(lnk.dataset.lesson);
        if (!l) return;
        state.view = 'lesson'; state.lessonId = l.id; state.folderId = l.folderId;
        state.query = ''; document.getElementById('search').value = '';
        pushNav();
        renderAll();
      };
    });
    wireFlagButtons(wrap);
    wireSpeakButtons(wrap);
  }

  function renderAll() {
    applyLang();
    var q = state.query.trim();

    document.getElementById('home').style.display = (state.view === 'home' && !searching) ? '' : 'none';
    document.getElementById('content').innerHTML = '';
    document.getElementById('viewHead').innerHTML = '';
    document.getElementById('empty').style.display = 'none';
    if (searching) { renderSearch(); renderStats(); return; }
    if (state.view === 'home') {
      document.getElementById('viewHead').innerHTML = '';

        document.getElementById('empty').innerHTML = '<div class="big">📁</div>' + esc(t('emptyFolders'));

  var navDepth = 0;
  function pushNav() {
    navDepth++;
    try { history.pushState({ d: navDepth }, ''); } catch (e) {}
  }
  function navBack() {
    if (navDepth > 0) { try { history.back(); } catch (e) {} return; }
    if (state.view === 'lesson') { state.view = 'folder'; state.lessonId = null; renderAll(); }
    else if (state.view === 'folder') { state.view = 'home'; state.folderId = null; renderAll(); }
    else { state.view = 'home'; state.folderId = null; state.lessonId = null; renderAll(); }
  }

  async function saveFolder() {

  /* ==================== export / import ==================== */
  function blobToB64(blob) {
    return new Promise(function (res, rej) {
      var rd = new FileReader(); rd.onload = function () { res(String(rd.result).split(',')[1] || ''); }; rd.onerror = rej; rd.readAsDataURL(blob);
    });
  }
  function b64ToBlob(b64, type) {
    var bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
    for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: type || 'application/octet-stream' });
  }
  async function exportData() {
    var out = { app: 'gramvip', version: 1, exportedAt: new Date().toISOString(), folders: folders, lessons: lessons, media: [] };
    try {
      var mrecs = await idbAll('media');
      for (var mr of mrecs) {
        if (!mr || !mr.blob) continue;
        out.media.push({ id: mr.id, kind: mr.kind, name: mr.name, type: mr.blob.type || '', data: await blobToB64(mr.blob) });
      }
    } catch (e) {}
    var blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
    var name = 'gramvip-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    var FS = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem;
    var SH = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
    if (FS && SH) {
      try {
        var text = await new Promise(function (res) {
          var rd = new FileReader(); rd.onload = function () { res(rd.result); }; rd.readAsDataURL(blob);
        });
        var w = await FS.writeFile({ path: name, data: text.split(',')[1], directory: 'CACHE', recursive: true });
        await SH.share({ title: name, url: w.uri });
        return;
      } catch (e) { console.error(e); }
    }
    var u = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = u; a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  }
  function importData() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async function (e) {
      var f = e.target.files[0]; if (!f) return;
      try {
        var d = JSON.parse(await f.text());
        var farr = d.folders || [], larr = d.lessons || [];
        if (!Array.isArray(farr) && !Array.isArray(larr)) throw 0;
        var haveF = {}, haveL = {};
        folders.forEach(function (x) { haveF[x.id] = 1; });
        lessons.forEach(function (x) { haveL[x.id] = 1; });
        var added = 0;
        for (var fo of farr) {
          if (!fo || typeof fo !== 'object') continue;
          if (!fo.id) fo.id = uid();
          if (haveF[fo.id]) continue;
          haveF[fo.id] = 1;
          folders.push(fo); await idbPut('folders', fo); added++;
        }
        for (var le of larr) {
          if (!le || typeof le !== 'object') continue;
          if (!le.id) le.id = uid();
          if (haveL[le.id]) continue;
          haveL[le.id] = 1;
          lessons.push(le); await idbPut('lessons', le); added++;
        }
        var marr = d.media || [];
        for (var me of marr) {
          if (!me || !me.id || !me.data) continue;
          try { await idbPut('media', { id: me.id, kind: me.kind, name: me.name, blob: b64ToBlob(me.data, me.type) }); } catch (e) {}
        }
        toast('✓ ' + t('imported') + ' (' + added + ')');
        renderAll();
      } catch (err) { toast('⚠️ ' + t('importBad')); }
    };

  var nb = { tool: 'pencil', color: '#111111', scale: 1, hist: [], drawing: false, lx: 0, ly: 0 };

  function nbCanvas() { return document.getElementById('nbCanvas'); }
  function nbCtx() { return nbCanvas().getContext('2d'); }
  function nbSaveHist() {
    var c = nbCanvas();
    nb.hist.push(nbCtx().getImageData(0, 0, c.width, c.height));
    if (nb.hist.length > 15) nb.hist.shift();
    nbPersist();
  }
  var nbPhr = [];
  var nbLang = 'fr';
  var nbRef = null;
  function nbFlushSave() {
    if (!nbRef) return;
    var c = nbCanvas();
    if (!c.width) return;
    var sc = Math.min(1, 900 / Math.max(c.width, c.height));
    var out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(c.width * sc));
    out.height = Math.max(1, Math.round(c.height * sc));
    var oc = out.getContext('2d');
    oc.drawImage(c, 0, 0, out.width, out.height);
    nbRef.phrase.nb = out.toDataURL('image/png');
    idbPut('lessons', nbRef.lesson);
  }
  function nbPersist() {

  function nbSetLang(l) {

  /* ==================== matching quiz ==================== */
  var qz = { lesson: null, lang: 'ar', pairs: [], sel: null, solved: 0, wrong: 0, ac: null };
  function qzTone(ok) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!qz.ac) qz.ac = new AC();
      var ac = qz.ac;
      if (ac.state === 'suspended') ac.resume();
      var freqs = ok ? [523.25, 659.25, 783.99] : [220, 174.61];
      freqs.forEach(function (fr, i) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = ok ? 'sine' : 'square';
        o.frequency.value = fr;
        g.gain.setValueAtTime(0.0001, ac.currentTime + i * 0.09);
        g.gain.exponentialRampToValueAtTime(0.22, ac.currentTime + i * 0.09 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * 0.09 + 0.22);
        o.connect(g); g.connect(ac.destination);
        o.start(ac.currentTime + i * 0.09);
        o.stop(ac.currentTime + i * 0.09 + 0.25);
      });
    } catch (e) {}
  }
  function qzShuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function closeQuiz() {

    stopSpeaking();

  /* ProLang-style pair picker for both games: every question→answer direction
     between voiced lesson languages, with the usable-phrase count on each row. */
  function gameLangPick(l, cb) {
    var langs = lessonLangs(l).filter(function (x) { return HAS_VOICE[x]; });
    var maps = [];
    l.sections.forEach(function (s) { secPhrases(s).forEach(function (p) {
      var m = {}; pLines(p).forEach(function (ln) { if (ln.lang && ln.text) m[ln.lang] = ln.text; });
      maps.push(m);
    }); });
    var pairs = [];
    langs.forEach(function (q) {
      langs.forEach(function (a) {
        if (a === q) return;
        var n = maps.filter(function (m) { return m[q] && m[a]; }).length;
        if (n) pairs.push({ q: q, a: a, n: n });
      });
    });
    if (!pairs.length) {
      document.getElementById('qzBody').innerHTML = '<div class="qz-result"><div class="qz-sub">' + esc(t('quizEmpty')) + '</div></div>';
      return;
    }
    document.getElementById('qzBody').innerHTML =
      '<div class="qz-langs"><h3>' + esc(t('quizPick').replace('{lang}', '').replace(/\s*لـ\s*:\s*|\s*:\s*$/, '')) + '</h3>' +
      pairs.map(function (p) {
        return '<button class="btn" data-qq="' + p.q + '" data-qa="' + p.a + '">' +
          (LANG_FLAG[p.q] || '🏳️') + ' ' + p.q.toUpperCase() + ' – ' +
          (LANG_FLAG[p.a] || '🏳️') + ' ' + p.a.toUpperCase() + ' — ' + p.n + '</button>';
      }).join('') + '</div>';
    document.getElementById('qzBody').querySelectorAll('[data-qq]').forEach(function (b) {
      b.onclick = function () { cb(b.dataset.qq, b.dataset.qa); };
    });
  }
  function openQuiz(l) {
    qz.lesson = l;
    document.querySelector('#ovQuiz .qz-title').innerHTML = '🧩 <span>' + esc(t('quiz')) + '</span>';
    document.getElementById('ovQuiz').classList.add('open');
    document.getElementById('qzProgress').textContent = '';
    gameLangPick(l, function (q, a) { qz.langA = q; qz.lang = a; qzStart(); });
  }
  function qzStart() {
    var l = qz.lesson;
    var pool = [];
    l.sections.forEach(function (s) { secPhrases(s).forEach(function (p) { if (lineText(p, qz.langA).trim() && lineText(p, qz.lang).trim()) pool.push(p); }); });
    if (!pool.length) {
      document.getElementById('qzBody').innerHTML = '<div class="qz-result"><div class="qz-sub">' + esc(t('quizEmpty')) + '</div></div>';
      return;
    }
    qzShuffle(pool);
    qz.pairs = pool.slice(0, 8);
    qz.sel = null; qz.solved = 0; qz.wrong = 0;
    var left = qzShuffle(qz.pairs.map(function (p, i) { return { p: p, i: i }; }));
    var right = qzShuffle(qz.pairs.map(function (p, i) { return { p: p, i: i }; }));
    var rows = Math.max(left.length, right.length);
    var html = '<div class="qz-grid">' +
      '<div class="qz-colhead">' + (LANG_FLAG[qz.langA] || '🏳️') + '</div><div class="qz-colhead">' + (LANG_FLAG[qz.lang] || '🏳️') + '</div>';
    for (var r = 0; r < rows; r++) {
      html += left[r] ? '<div class="qz-tile" data-side="fr" data-i="' + left[r].i + '">' + esc(lineText(left[r].p, qz.langA)) + '</div>' : '<div></div>';
      html += right[r] ? '<div class="qz-tile" data-side="tg" data-i="' + right[r].i + '">' + esc(lineText(right[r].p, qz.lang)) + '</div>' : '<div></div>';

    var v = !(window.EdgeTTS && EdgeTTS.enabled());
    if (window.EdgeTTS) EdgeTTS.setEnabled(v);
    if (!v) stopSpeaking();
    toast(v ? '🔊 ' + t('edgeOn') : t('edgeOff'));
  }

  document.getElementById('menuBtn').onclick = function (e) {
    e.stopPropagation();
    renderTopMenu();
    document.getElementById('topMenu').classList.toggle('hidden');
  };
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.menuwrap')) document.getElementById('topMenu').classList.add('hidden');
    if (!e.target.closest('.card-menu') && !e.target.closest('.card-menu-btn')) closeMenus();
  });

  document.getElementById('folderCancel').onclick = function () { document.getElementById('ovFolder').classList.add('hidden'); };
  document.getElementById('folderSave').onclick = saveFolder;
  document.getElementById('lessonCancel').onclick = function () { document.getElementById('ovLesson').classList.add('hidden'); };
  document.getElementById('lessonSave').onclick = saveLesson;
  document.getElementById('lessonMediaPick').onclick = pickSheetMedia;
  document.getElementById('fabBtn').onclick = function () {
    if (state.view === 'home') { openFolderSheet(null); return; }
    if (state.view === 'folder') { var ff = folderById(state.folderId); if (ff) openLessonSheet(ff, null); }
  };
  document.getElementById('moveCancel').onclick = function () { document.getElementById('ovMove').classList.add('hidden'); };
  document.getElementById('lessonText').addEventListener('input', updateParseStats);
  function copyTplText(tp, done) {
    done = done || function () { toast('📋 ' + t('copied')); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tp.text).then(done).catch(function () { fallbackCopy(); });
    } else fallbackCopy();
    function fallbackCopy() {
      var ta = document.createElement('textarea');
      ta.value = tp.text;
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }
  function openTpl() {
    var list = document.getElementById('tplList');
    list.innerHTML = '';
    TPL_GROUPS.forEach(function (g) {
      var gh = document.createElement('div');
      gh.className = 'tplgrp-name';
      gh.textContent = t(g.key) || g.key;
      list.appendChild(gh);
      g.items.forEach(function (tp) {
        var card = document.createElement('div');
        card.className = 'tplcard';
        var head = document.createElement('div');
        head.className = 'tplcard-h';
        var nm = document.createElement('span');
        nm.textContent = tp.name[state.lang] || tp.name.ar || tp.name;
        head.appendChild(nm);
        var cp = document.createElement('button');
        cp.className = 'tplcard-copy';
        cp.textContent = '📋 ' + t('copy');
        cp.onclick = function () {
          copyTplText(tp, function () { cp.textContent = '✓'; setTimeout(function () { cp.textContent = '📋 ' + t('copy'); }, 1200); toast('📋 ' + t('copied')); });
        };
        head.appendChild(cp);
        card.appendChild(head);
        var body = document.createElement('div');
        body.className = 'tplcard-txt';
        body.textContent = tp.text;
        card.appendChild(body);
        list.appendChild(card);
      });
    });
    document.getElementById('ovTemplate').classList.remove('hidden');
  }
  document.getElementById('copyTplBtn').onclick = openTpl;
  document.getElementById('tplCancel').onclick = function () { document.getElementById('ovTemplate').classList.add('hidden'); };
  document.getElementById('pasteBtn').onclick = async function () {
    try {
      var txt = await navigator.clipboard.readText();
      if (txt) {
        var ta = document.getElementById('lessonText');
        ta.value = ta.value ? ta.value + '\n\n' + txt : txt;
        updateParseStats();
        toast('📥 ' + t('pasted'));
      }
    } catch (e) { toast('⚠️'); }
  };

  ['ovFolder', 'ovLesson', 'ovMove', 'ovTemplate'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (e) {
      if (e.target.id === id) document.getElementById(id).classList.add('hidden');
    });
  });

  var searchT = null;
  document.getElementById('search').oninput = function (e) {
    state.query = e.target.value;
    clearTimeout(searchT);
    searchT = setTimeout(renderAll, 300);
  };

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  window.addEventListener('popstate', function () {
    if (navDepth > 0) navDepth--;
    if (state.view === 'lesson') { state.view = 'folder'; state.lessonId = null; renderAll(); }
    else if (state.view === 'folder') { state.view = 'home'; state.folderId = null; renderAll(); }
    else if (state.query) { state.query = ''; document.getElementById('search').value = ''; renderAll(); }
  });

  /* ---------- Android back ---------- */
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.addListener('backButton', function () {
      if (document.getElementById('ovQuiz').classList.contains('open')) { closeQuiz(); return; }
      if (!document.getElementById('ovConfirm').classList.contains('hidden')) { document.getElementById('ovConfirm').classList.add('hidden'); return; }
      if (!document.getElementById('ovFolder').classList.contains('hidden')) { document.getElementById('ovFolder').classList.add('hidden'); return; }
      if (!document.getElementById('ovLesson').classList.contains('hidden')) { document.getElementById('ovLesson').classList.add('hidden'); return; }
      if (!document.getElementById('ovMove').classList.contains('hidden')) { document.getElementById('ovMove').classList.add('hidden'); return; }
      if (state.query) { state.query = ''; document.getElementById('search').value = ''; renderAll(); return; }
      if (state.view === 'lesson') { state.view = 'folder'; state.lessonId = null; renderAll(); return; }
      if (state.view === 'folder') { state.view = 'home'; state.folderId = null; renderAll(); return; }
      confirmBox(t('exitTitle'), '', function () {
        try { window.Capacitor.Plugins.App.exitApp(); } catch (e) {}
      });
    });
  }

  /* ==================== init ==================== */
  applyTheme();
  renderTopMenu();
  idbOpen().then(function () {
    return Promise.all([idbAll('folders'), idbAll('lessons')]);
  }).then(function (res) {
    folders = (res[0] || []).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    lessons = (res[1] || []).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    renderAll();
  }).catch(function () { renderAll(); });

  // SW only on the web (PWA): the APK bundles its assets locally, and a
  // root-scope worker here would shadow the other apps' caches offline.
  if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.Plugins)) {
    try { navigator.serviceWorker.register('sw-gramvip.js'); } catch (e) {}
  }
})();
</script>
</body>
</html>
