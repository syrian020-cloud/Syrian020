<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title id="app-title">دروسي المرئية</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-primary: #1a1a1a;
      --bg-secondary: #252525;
      --bg-tertiary: #333333;
      --text-primary: #e8e6e3;
      --text-secondary: #b8b5b0;
      --accent: #4a9eff;
      --accent-hover: #3a8eef;
      --danger: #ff6b6b;
      --success: #6bcb77;
      --border: #3d3d3d;
      --font-size: 16px;
      --font-large: 18px;
      --radius: 10px;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    [data-theme="light"] {
      --bg-primary: #f5f2eb;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e8e5de;
      --text-primary: #2c2c2c;
      --text-secondary: #5c5c5c;
      --border: #d4d0c8;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: var(--font-size);
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }

    [dir="rtl"] body { text-align: right; }
    [dir="ltr"] body { text-align: left; }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 0.5rem 1rem;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .logo { font-size: 1.1rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
    nav { display: flex; gap: 0.3rem; }
    nav button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.5rem 0.8rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    nav button.active, nav button:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .header-controls { display: flex; align-items: center; gap: 0.4rem; }
    .btn-icon {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-icon:hover { background: var(--accent); color: white; }

    /* Main */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 5rem 1rem 2rem;
    }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    h1, h2, h3 { margin: 0 0 1rem; color: var(--text-primary); }
    p { margin: 0 0 1rem; color: var(--text-secondary); }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
    }

    button, .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0.7rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover, .btn:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #e05555; }
    .btn-success { background: var(--success); color: #1a1a1a; }
    .btn-success:hover { background: #5cb866; }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-primary); }

    .file-label {
      display: block;
      background: var(--bg-tertiary);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: all 0.2s;
    }
    .file-label:hover { border-color: var(--accent); background: rgba(74,158,255,0.08); }
    input[type="file"] { display: none; }

    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.8rem;
      font-size: 1rem;
      margin-bottom: 1rem;
      font-family: inherit;
    }
    textarea { min-height: 140px; resize: vertical; }
    label { display: block; margin-bottom: 0.4rem; color: var(--text-secondary); font-size: 0.95rem; }

    .form-group { margin-bottom: 1rem; }
    .form-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }

    video {
      width: 100%;
      max-height: 60vh;
      border-radius: var(--radius);
      background: #000;
      display: block;
    }

    .lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .lesson-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .lesson-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .lesson-card h3 { margin: 0 0 0.4rem; font-size: 1rem; }
    .lesson-card small { color: var(--text-secondary); }
    .lesson-card .actions {
      position: absolute;
      top: 0.6rem;
    }
    [dir="rtl"] .lesson-card .actions { left: 0.6rem; }
    [dir="ltr"] .lesson-card .actions { right: 0.6rem; }
    .lesson-card .actions button {
      padding: 0.3rem 0.5rem;
      font-size: 0.8rem;
      margin-inline-start: 0.3rem;
    }

    .empty-state { text-align: center; padding: 3rem 1rem; }
    .empty-state svg { width: 80px; height: 80px; margin-bottom: 1rem; opacity: 0.4; }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .tab {
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 0.6rem 1rem;
      border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: transparent; }

    .subtitle-help { font-size: 0.85rem; color: var(--text-secondary); margin-top: -0.5rem; margin-bottom: 1rem; }
    .video-wrap { position: relative; }
    .video-subtitle-overlay {
      position: absolute;
      bottom: 12%;
      left: 5%;
      right: 5%;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    .video-subtitle-overlay span {
      display: inline-block;
      background: rgba(0,0,0,0.78);
      color: #fff;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: calc(var(--font-size) + 3px);
      font-weight: 500;
      line-height: 1.4;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    [data-theme="light"] .video-subtitle-overlay span { background: rgba(255,255,255,0.85); color: #222; }

    .subtitle-display {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.8rem;
      margin-top: 0.6rem;
      min-height: 3rem;
      text-align: center;
      color: var(--text-primary);
      font-size: calc(var(--font-size) + 2px);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .subtitle-display .cue-text { flex: 1; }
    .subtitle-display .cue-loop {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .subtitle-display .cue-loop:hover { background: var(--accent-hover); }
    .subtitle-display .cue-loop.active { background: var(--success); color: #1a1a1a; }

    .cue-list {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem;
      margin-top: 0.6rem;
      max-height: 260px;
      overflow-y: auto;
    }
    .cue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.55rem 0.6rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      font-size: calc(var(--font-size) - 1px);
    }
    .cue-item:last-child { border-bottom: none; }
    .cue-item:hover { background: var(--bg-tertiary); }
    .cue-item.active { background: rgba(74,158,255,0.12); border-inline-start: 3px solid var(--accent); }
    .cue-time { color: var(--text-secondary); font-size: 0.8rem; white-space: nowrap; }
    .cue-text { flex: 1; text-align: start; line-height: 1.4; }
    .cue-item .cue-loop {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cue-item .cue-loop:hover { background: var(--accent); color: #fff; }
    .cue-item .cue-loop.active { background: var(--success); color: #1a1a1a; border-color: var(--success); }

    .settings-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .settings-row label { margin: 0; flex: 1; }
    .range-wrap { display: flex; align-items: center; gap: 0.5rem; }

    .toast {
      position: fixed;
      bottom: 1rem;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 0.8rem 1.2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transform: translateY(120%);
      transition: transform 0.3s;
      z-index: 2000;
    }
    [dir="rtl"] .toast { left: 1rem; right: auto; }
    [dir="ltr"] .toast { right: 1rem; left: auto; }
    .toast.show { transform: translateY(0); }

    .hidden { display: none !important; }
    .muted { color: var(--text-secondary); font-size: 0.9rem; }

    @media (max-width: 500px) {
      .header-inner { flex-wrap: wrap; }
      nav { order: 3; width: 100%; justify-content: center; }
      main { padding-top: 6.5rem; }
      .logo { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo" id="app-name">Dross</div>
      <nav>
        <button id="nav-lessons" data-page="lessons" class="active" data-i18n="lessons">الدروس</button>
        <button id="nav-editor" data-page="editor" data-i18n="editor">محرر</button>
        <button id="nav-settings" data-page="settings" data-i18n="settings">الإعدادات</button>
      </nav>
      <div class="header-controls">
        <button class="btn-icon" id="btn-lang" title="Language">AR</button>
        <button class="btn-icon" id="btn-theme" title="Toggle theme">🌙</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Lessons Page -->
    <section id="page-lessons" class="page active">
      <div class="card">
        <h2 data-i18n="myLessons">دروسي</h2>
        <p data-i18n="lessonsDesc">اختر درسًا لعرضه، أو ابدأ بإضافة درس جديد.</p>
        <button id="btn-new-lesson" data-i18n="newLesson">درس جديد</button>
      </div>
      <div id="lessons-list" class="lesson-grid"></div>
      <div id="lessons-empty" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M10 12l4 3V9l-4 3z"/></svg>
        <p data-i18n="noLessons">لا يوجد دروس بعد. اضغط "درس جديد" للبدء.</p>
      </div>
    </section>

    <!-- Editor Page -->
    <section id="page-editor" class="page">
      <div class="card">
        <h2 data-i18n="newLesson">درس جديد</h2>
        <div class="form-group">
          <label for="lesson-title" data-i18n="lessonTitle">عنوان الدرس</label>
          <input type="text" id="lesson-title" data-i18n-placeholder="lessonTitlePlaceholder" placeholder="مثال: درس اللغة الفرنسية 1">
        </div>

        <div class="form-group">
          <label for="video-file" data-i18n="videoFile">ملف الفيديو</label>
          <label for="video-file" class="file-label" id="video-label">
            <span data-i18n="chooseVideo">اختر فيديو من الهاتف</span>
          </label>
          <input type="file" id="video-file" accept="video/*">
          <div id="video-name" class="muted"></div>
        </div>

        <div class="tabs">
          <button class="tab active" data-subtab="srt" data-i18n="uploadSrt">رفع SRT</button>
          <button class="tab" data-subtab="text" data-i18n="timedText">نص موقوت</button>
        </div>

        <div id="subtab-srt" class="subtab-content">
          <div class="form-group">
            <label for="srt-file" data-i18n="srtFile">ملف الترجمة (.srt)</label>
            <label for="srt-file" class="file-label" id="srt-label">
              <span data-i18n="chooseSrt">اختر ملف SRT</span>
            </label>
            <input type="file" id="srt-file" accept=".srt,.txt">
            <div id="srt-name" class="muted"></div>
          </div>
        </div>

        <div id="subtab-text" class="subtab-content hidden">
          <div class="form-group">
            <label for="timed-text" data-i18n="timedTextLabel">أدخل النص مع التوقيت الزمني</label>
            <p class="subtitle-help" data-i18n="timedTextHelp">اكتب كل جملة في سطر بصيغة: [00:01:05.200] النص هنا. أو استخدم صيغة SRT الكاملة.</p>
            <textarea id="timed-text" data-i18n-placeholder="timedTextPlaceholder" placeholder="[00:00:01.000] مرحباً بك&#10;[00:00:04.000] هذا درس جديد"></textarea>
          </div>
        </div>

        <div class="video-wrap hidden" id="preview-wrap">
          <video id="lesson-video" controls crossorigin="anonymous"></video>
          <div class="video-subtitle-overlay hidden" id="subtitle-overlay"><span></span></div>
        </div>
        <div class="subtitle-display hidden" id="subtitle-display"></div>
        <div class="cue-list hidden" id="cue-list"></div>

        <div class="form-actions">
          <button id="btn-preview" data-i18n="preview">معاينة</button>
          <button id="btn-save-lesson" class="btn-success" data-i18n="saveLesson">حفظ الدرس</button>
          <button id="btn-cancel-edit" class="btn-secondary" data-i18n="cancel">إلغاء</button>
        </div>
      </div>
    </section>

    <!-- Settings Page -->
    <section id="page-settings" class="page">
      <div class="card">
        <h2 data-i18n="settings">الإعدادات</h2>

        <div class="settings-row">
          <label data-i18n="language">اللغة</label>
          <select id="settings-language">
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="settings-row">
          <label data-i18n="theme">الوضع</label>
          <select id="settings-theme">
            <option value="dark" data-i18n="dark">داكن (مريح للعين)</option>
            <option value="light" data-i18n="light">فاتح</option>
          </select>
        </div>

        <div class="settings-row">
          <label data-i18n="fontSize">حجم الخط</label>
          <div class="range-wrap">
            <input type="range" id="settings-font-size" min="12" max="24" value="16">
            <span id="font-size-value">16px</span>
          </div>
        </div>

        <div class="settings-row">
          <label data-i18n="storage">مساحة التخزين</label>
          <button id="btn-clear-data" class="btn-danger" data-i18n="clearData">مسح جميع الدروس</button>
        </div>

        <div class="settings-row">
          <label data-i18n="offline">تشغيل بدون إنترنت</label>
          <button id="btn-install" class="btn-secondary" data-i18n="installApp">تثبيت التطبيق</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

    };

    const state = {
      lang: localStorage.getItem('vs_lang') || 'ar',
      theme: localStorage.getItem('vs_theme') || 'dark',
      fontSize: parseInt(localStorage.getItem('vs_font_size') || '16', 10),
      db: null,
      currentLesson: null,
      videoFile: null,
      subtitleText: '',
      subtitleType: 'srt',
      editingId: null,
      currentCues: [],
      loopCue: null
    };

    const DB_NAME = 'videoSubtitleDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'lessons';

    // --- DB ---
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e);
      });
    }

    async function saveLessonToDB(lesson) {
      const tx = state.db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      return new Promise((resolve, reject) => {
        const req = store.put(lesson);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getLessonsFromDB() {
      const tx = state.db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      return new Promise((resolve, reject) => {
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteLessonFromDB(id) {
      const tx = state.db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      return new Promise((resolve, reject) => {
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function getLessonById(id) {
      const tx = state.db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      return new Promise((resolve, reject) => {
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // --- I18n ---
    function setLang(lang) {
      state.lang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      localStorage.setItem('vs_lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if (i18n[lang][key]) el.placeholder = i18n[lang][key];
      });
      document.getElementById('btn-lang').textContent = lang.toUpperCase();
      document.getElementById('app-name').textContent = lang === 'ar' ? 'دروسي المرئية' : (lang === 'fr' ? 'Mes Vidéos' : 'Video Lessons');
      document.title = lang === 'ar' ? 'دروسي المرئية' : (lang === 'fr' ? 'Mes Vidéos' : 'Video Lessons');
      document.getElementById('settings-language').value = lang;
    }

    function t(key) { return i18n[state.lang][key] || key; }

    // --- Theme / Font ---
    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('vs_theme', theme);
      document.getElementById('btn-theme').textContent = theme === 'dark' ? '☀️' : '🌙';
      document.getElementById('settings-theme').value = theme;
    }

    function setFontSize(size) {
      state.fontSize = size;
      document.documentElement.style.setProperty('--font-size', size + 'px');
      document.documentElement.style.setProperty('--font-large', (size + 2) + 'px');
      localStorage.setItem('vs_font_size', size);
      document.getElementById('settings-font-size').value = size;
      document.getElementById('font-size-value').textContent = size + 'px';
    }

    // --- Utilities ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function parseTime(t) {
      t = t.trim().replace(',', '.');
      const parts = t.split(':');
      if (parts.length === 3) {
        const [h, m, s] = parts;
        const [sec, ms = '0'] = s.split('.');
        return (parseInt(h,10)*3600 + parseInt(m,10)*60 + parseInt(sec,10)) + parseFloat('0.' + ms.padEnd(3,'0'));
      }
      if (parts.length === 2) {
        const [m, s] = parts;
        const [sec, ms = '0'] = s.split('.');
        return (parseInt(m,10)*60 + parseInt(sec,10)) + parseFloat('0.' + ms.padEnd(3,'0'));
      }
      const [sec, ms = '0'] = t.split('.');
      return parseInt(sec,10) + parseFloat('0.' + ms.padEnd(3,'0'));
    }

    function formatTime(sec) {
      const h = Math.floor(sec/3600);
      const m = Math.floor((sec%3600)/60);
      const s = Math.floor(sec%60);
      const ms = Math.round((sec%1)*1000).toString().padStart(3,'0');
      return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms}`;
    }

    // --- Subtitle conversion ---
    function srtToVtt(srt) {
      const cues = parseSrt(srt);
      if (!cues.length) return '';
      let vtt = 'WEBVTT\n\n';
      cues.forEach((cue, i) => {
        vtt += `${i+1}\n${formatTime(cue.start).replace(',', '.')} --> ${formatTime(cue.end).replace(',', '.')}\n${cue.text}\n\n`;
      });
      return vtt;
    }

    function parseSrt(srt) {
      const cues = [];
      const blocks = srt.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\s*\n/);
      for (const block of blocks) {
        const lines = block.trim().split('\n');
        if (lines.length < 2) continue;
        const timeLine = lines.find(l => l.includes('-->'));
        if (!timeLine) continue;
        const [start, end] = timeLine.split('-->').map(s => parseTime(s.trim()));
        const textLines = lines.slice(lines.indexOf(timeLine) + 1).filter(l => l.trim());
        if (!isNaN(start) && !isNaN(end) && textLines.length) {
          cues.push({ start, end, text: textLines.join('\n') });
        }
      }
      return cues;
    }

    function parseTimedText(text) {
      const cues = [];
      const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      let pendingEnd = null;
      let prevStart = null;

      for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;

        // Format: [00:00:01.000] Text here
        let m = line.match(/^\[(?:(\d{1,2}):)?(?:(\d{1,2}):)?(\d{1,2})(?:[.,](\d{1,3}))?\]\s*(.*)$/);
        if (m) {
          const timeStr = (m[1] || '') + (m[2] || '') + m[3] + (m[4] ? '.' + m[4] : '');
          const start = parseTime(timeStr);
          const txt = m[5].trim();
          if (pendingEnd && prevStart !== null) {
            cues[cues.length - 1].end = start;
          }
          cues.push({ start, end: start + 4, text: txt });
          pendingEnd = cues[cues.length - 1];
          prevStart = start;
          continue;
        }

        // Format: 00:00:01.000 --> 00:00:04.000 Text
        m = line.match(/^((?:\d{1,2}:)?(?:\d{1,2}:)?\d{1,2}(?:[.,]\d{1,3})?)\s*-->?\s*((?:\d{1,2}:)?(?:\d{1,2}:)?\d{1,2}(?:[.,]\d{1,3})?)\s*(.*)$/);
        if (m) {
          const start = parseTime(m[1]);
          const end = parseTime(m[2]);
          const txt = m[3].trim();
          cues.push({ start, end, text: txt });
          continue;
        }

        // SRT-like full block may span multiple lines; if we are inside a cue, append text
        if (cues.length) {
          cues[cues.length - 1].text += '\n' + line;
        }
      }

      // Adjust last cues end to next start where default 4s may be too long
      for (let i = 0; i < cues.length - 1; i++) {
        if (cues[i].end > cues[i+1].start) {
          cues[i].end = cues[i+1].start;
        }
      }
      return cues;
    }

    function cuesToVtt(cues) {
      let vtt = 'WEBVTT\n\n';
      cues.forEach((cue, i) => {
        vtt += `${i+1}\n${formatTime(cue.start).replace(',', '.')} --> ${formatTime(cue.end).replace(',', '.')}\n${cue.text}\n\n`;
      });
      return vtt;
    }

    function anySubtitleToVtt(text, type) {
      if (type === 'srt') return srtToVtt(text);
      const cues = parseTimedText(text);
      return cuesToVtt(cues);
    }

    // --- Navigation ---
    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      document.getElementById('nav-' + page).classList.add('active');
      if (page === 'lessons') renderLessons();
    }

    // --- Lessons rendering ---
    async function renderLessons() {
      const list = document.getElementById('lessons-list');
      const empty = document.getElementById('lessons-empty');
      const lessons = await getLessonsFromDB();
      list.innerHTML = '';
      if (!lessons.length) {
        empty.classList.remove('hidden');
        list.classList.add('hidden');
        return;
      }
      empty.classList.add('hidden');
      list.classList.remove('hidden');

      lessons.forEach(lesson => {
        const card = document.createElement('div');
        card.className = 'lesson-card';
        const date = new Date(lesson.createdAt).toLocaleDateString(state.lang === 'ar' ? 'ar-EG' : (state.lang === 'fr' ? 'fr-FR' : 'en-US'));
        card.innerHTML = `
          <h3>${escapeHtml(lesson.title || t('lesson'))}</h3>
          <small>${date} · ${formatDuration(lesson.duration || 0)}</small>
          <div class="actions">
            <button class="btn-play" data-id="${lesson.id}">${t('play')}</button>
            <button class="btn-edit btn-secondary" data-id="${lesson.id}">${t('edit')}</button>
            <button class="btn-delete btn-danger" data-id="${lesson.id}">${t('delete')}</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function formatDuration(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec/60);
      const s = Math.floor(sec%60);
      return `${m}:${s.toString().padStart(2,'0')}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // --- Editor logic ---
    function resetEditor() {
      state.videoFile = null;
      state.subtitleText = '';
      state.subtitleType = 'srt';
      state.editingId = null;
      state.currentCues = [];
      document.getElementById('lesson-title').value = '';
      document.getElementById('video-file').value = '';
      document.getElementById('srt-file').value = '';
      document.getElementById('timed-text').value = '';
      document.getElementById('video-name').textContent = '';
      document.getElementById('srt-name').textContent = '';
      document.getElementById('preview-wrap').classList.add('hidden');
      document.getElementById('subtitle-overlay').classList.add('hidden');
      document.getElementById('subtitle-display').classList.add('hidden');
      document.getElementById('cue-list').classList.add('hidden');
      const video = document.getElementById('lesson-video');
      video.removeEventListener('timeupdate', updateSubtitleOverlay);
      video.pause();
      video.src = '';
      video.removeAttribute('src');
      const track = video.querySelector('track');
      if (track) track.remove();
      selectSubtab('srt');
    }

    function selectSubtab(tab) {
      state.subtitleType = tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.subtab-content').forEach(s => s.classList.add('hidden'));
      document.querySelector(`.tab[data-subtab="${tab}"]`).classList.add('active');
      document.getElementById('subtab-' + tab).classList.remove('hidden');
    }

    async function previewLesson() {
      const title = document.getElementById('lesson-title').value.trim();
      if (!title) { showToast(t('enterTitle')); return; }
      if (!state.videoFile) { showToast(t('chooseVideoFile')); return; }

      const text = state.subtitleType === 'srt' ? state.subtitleText : document.getElementById('timed-text').value;
      if (!text.trim()) { showToast(t('addSubtitle')); return; }

      const vtt = anySubtitleToVtt(text, state.subtitleType);
      if (!vtt) { showToast(t('invalidTime')); return; }

      const cues = state.subtitleType === 'srt' ? parseSrt(text) : parseTimedText(text);
      state.currentCues = cues;
      state.loopCue = null;

      const video = document.getElementById('lesson-video');
      detachSubtitleListeners(video);
      video.src = URL.createObjectURL(state.videoFile);
      const track = document.createElement('track');
      track.kind = 'subtitles';
      track.label = 'Subtitles';
      track.srclang = state.lang;
      track.src = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
      track.default = true;
      const old = video.querySelector('track');
      if (old) old.remove();
      video.appendChild(track);
      document.getElementById('preview-wrap').classList.remove('hidden');
      document.getElementById('subtitle-overlay').classList.remove('hidden');
      document.getElementById('subtitle-display').classList.remove('hidden');
      document.getElementById('cue-list').classList.remove('hidden');
      attachSubtitleListeners(video);
      video.load();
      updateSubtitleOverlay();
      renderCueList();
      showToast(t('preview'));
    }

    function updateSubtitleOverlay() {
      const video = document.getElementById('lesson-video');
      const overlay = document.getElementById('subtitle-overlay');
      const display = document.getElementById('subtitle-display');
      const currentTime = video.currentTime;
      const cue = state.currentCues.find(c => currentTime >= c.start && currentTime < c.end);

      if (state.loopCue && currentTime >= state.loopCue.end) {
        video.currentTime = state.loopCue.start;
        return;
      }

      if (cue) {
        const html = cue.text.replace(/\n/g, '<br>');
        overlay.querySelector('span').innerHTML = html;
        overlay.classList.remove('hidden');
        const isLoop = state.loopCue && state.loopCue.start === cue.start && state.loopCue.end === cue.end;
        display.innerHTML = `
          <span class="cue-text">${html}</span>
          <button class="cue-loop ${isLoop ? 'active' : ''}" title="${t('repeat')}" onclick="toggleLoopCue(${cue.start}, ${cue.end})">${isLoop ? '🔁' : '🔂'}</button>
        `;
      } else {
        overlay.classList.add('hidden');
        display.innerHTML = '';
      }
      highlightActiveCue(cue);
    }

    function renderCueList() {
      const list = document.getElementById('cue-list');
      if (!state.currentCues.length) { list.innerHTML = ''; return; }
      list.innerHTML = state.currentCues.map((cue, i) => {
        const isLoop = state.loopCue && state.loopCue.start === cue.start && state.loopCue.end === cue.end;
        return `
          <div class="cue-item" data-index="${i}" data-start="${cue.start}" data-end="${cue.end}">
            <div class="cue-text">${escapeHtml(cue.text).replace(/\n/g, '<br>')}</div>
            <div class="cue-time">${formatDuration(cue.start)} - ${formatDuration(cue.end)}</div>
            <button class="cue-loop ${isLoop ? 'active' : ''}" data-index="${i}" title="${t('repeat')}">${isLoop ? '🔁' : '🔂'}</button>
          </div>
        `;
      }).join('');
      list.addEventListener('click', handleCueListClick);
    }

    function handleCueListClick(e) {
      const item = e.target.closest('.cue-item');
      const loopBtn = e.target.closest('.cue-loop');
      if (!item) return;
      const start = parseFloat(item.dataset.start);
      const end = parseFloat(item.dataset.end);
      if (loopBtn) {
        toggleLoopCue(start, end);
      } else {
        const video = document.getElementById('lesson-video');
        video.currentTime = start;
        if (video.paused) video.play();
      }
    }

    function highlightActiveCue(activeCue) {
      const video = document.getElementById('lesson-video');
      const currentTime = video ? video.currentTime : 0;
      const cue = activeCue || state.currentCues.find(c => currentTime >= c.start && currentTime < c.end);
      const list = document.getElementById('cue-list');
      if (!list) return;
      list.querySelectorAll('.cue-item').forEach((el, i) => {
        const c = state.currentCues[i];
        if (!c) return;
        el.classList.toggle('active', cue && cue.start === c.start && cue.end === c.end);
        const btn = el.querySelector('.cue-loop');
        if (btn) {
          const isLoop = state.loopCue && state.loopCue.start === c.start && state.loopCue.end === c.end;
          btn.classList.toggle('active', isLoop);
          btn.textContent = isLoop ? '🔁' : '🔂';
        }
      });
    }

    function attachSubtitleListeners(video) {
      video.addEventListener('timeupdate', updateSubtitleOverlay);
      video.addEventListener('seeked', updateSubtitleOverlay);
      video.addEventListener('play', updateSubtitleOverlay);
      video.addEventListener('pause', updateSubtitleOverlay);
    }

    function detachSubtitleListeners(video) {
      video.removeEventListener('timeupdate', updateSubtitleOverlay);
      video.removeEventListener('seeked', updateSubtitleOverlay);
      video.removeEventListener('play', updateSubtitleOverlay);
      video.removeEventListener('pause', updateSubtitleOverlay);
    }

    window.toggleLoopCue = function(start, end) {
      const video = document.getElementById('lesson-video');
      if (state.loopCue && state.loopCue.start === start && state.loopCue.end === end) {
        state.loopCue = null;
      } else {
        state.loopCue = { start, end };
        video.currentTime = start;
        if (video.paused) video.play();
      }
      updateSubtitleOverlay();
    };

    async function saveLesson() {
      const title = document.getElementById('lesson-title').value.trim();
      if (!title) { showToast(t('enterTitle')); return; }
      if (!state.videoFile) { showToast(t('chooseVideoFile')); return; }

      const text = state.subtitleType === 'srt' ? state.subtitleText : document.getElementById('timed-text').value;
      if (!text.trim()) { showToast(t('addSubtitle')); return; }

      const vtt = anySubtitleToVtt(text, state.subtitleType);
      if (!vtt) { showToast(t('invalidTime')); return; }

      const video = document.getElementById('lesson-video');
      const duration = video.duration || 0;

      const lesson = {
        id: state.editingId || Date.now(),
        title,
        lang: state.lang,
        videoName: state.videoFile.name,
        videoType: state.videoFile.type,
        videoFile: state.videoFile,
        subtitleType: state.subtitleType,
        subtitleText: text,
        vttBlob: new Blob([vtt], { type: 'text/vtt' }),
        duration,
        createdAt: Date.now()
      };

      await saveLessonToDB(lesson);
      showToast(t('saved'));
      resetEditor();
      showPage('lessons');
    }

    async function loadLessonForPlay(id) {
      const lesson = await getLessonById(id);
      if (!lesson) return;
      resetEditor();
      state.currentLesson = lesson;
      document.getElementById('lesson-title').value = lesson.title;
      state.videoFile = lesson.videoFile;
      document.getElementById('video-name').textContent = lesson.videoName;
      state.subtitleType = lesson.subtitleType || 'srt';
      selectSubtab(state.subtitleType);
      if (state.subtitleType === 'srt') {
        state.subtitleText = lesson.subtitleText;
        document.getElementById('srt-name').textContent = 'subtitles.' + (state.subtitleType === 'srt' ? 'srt' : 'txt');
      } else {
        document.getElementById('timed-text').value = lesson.subtitleText;
      }

      state.currentCues = state.subtitleType === 'srt' ? parseSrt(lesson.subtitleText) : parseTimedText(lesson.subtitleText);
      state.loopCue = null;

      const video = document.getElementById('lesson-video');
      detachSubtitleListeners(video);
      video.src = URL.createObjectURL(lesson.videoFile);
      const track = document.createElement('track');
      track.kind = 'subtitles';
      track.label = 'Subtitles';
      track.srclang = lesson.lang || 'ar';
      track.src = URL.createObjectURL(lesson.vttBlob);
      track.default = true;
      const old = video.querySelector('track');
      if (old) old.remove();
      video.appendChild(track);
      document.getElementById('preview-wrap').classList.remove('hidden');
      document.getElementById('subtitle-overlay').classList.remove('hidden');
      document.getElementById('subtitle-display').classList.remove('hidden');
      document.getElementById('cue-list').classList.remove('hidden');
      attachSubtitleListeners(video);
      video.load();
      updateSubtitleOverlay();
      renderCueList();
      showPage('editor');
    }

    async function loadLessonForEdit(id) {
      await loadLessonForPlay(id);
      state.editingId = id;
    }

    // --- Event listeners ---
    document.addEventListener('DOMContentLoaded', async () => {
      state.db = await openDB();
      setLang(state.lang);
      setTheme(state.theme);
      setFontSize(state.fontSize);

      // Header nav
      document.querySelectorAll('nav button, .lesson-card').forEach(btn => {
        if (btn.dataset.page) btn.addEventListener('click', () => showPage(btn.dataset.page));
      });

      // New lesson
      document.getElementById('btn-new-lesson').addEventListener('click', () => {
        resetEditor();
        showPage('editor');
      });

      // File inputs
      document.getElementById('video-file').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (f) { state.videoFile = f; document.getElementById('video-name').textContent = f.name; }
      });
      document.getElementById('srt-file').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        document.getElementById('srt-name').textContent = f.name;
        const reader = new FileReader();
        reader.onload = (ev) => { state.subtitleText = ev.target.result; };
        reader.readAsText(f);
      });

      // Subtabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => selectSubtab(tab.dataset.subtab));
      });

      // Actions
      document.getElementById('btn-preview').addEventListener('click', previewLesson);
      document.getElementById('btn-save-lesson').addEventListener('click', saveLesson);
      document.getElementById('btn-cancel-edit').addEventListener('click', () => { resetEditor(); showPage('lessons'); });

      // Lesson list interactions (delegation)
      document.getElementById('lessons-list').addEventListener('click', async (e) => {
        const target = e.target.closest('[data-id]');
        if (!target) return;
        const id = parseInt(target.dataset.id, 10);
        if (!id) return;
        if (e.target.closest('.btn-delete')) {
          if (confirm(t('confirmDelete'))) {
            await deleteLessonFromDB(id);
            showToast(t('deleted'));
            renderLessons();
          }
        } else if (e.target.closest('.btn-edit')) {
          await loadLessonForEdit(id);
        } else {
          await loadLessonForPlay(id);
        }
      });

      // Settings
      document.getElementById('settings-language').addEventListener('change', (e) => setLang(e.target.value));
      document.getElementById('settings-theme').addEventListener('change', (e) => setTheme(e.target.value));
      document.getElementById('settings-font-size').addEventListener('input', (e) => setFontSize(parseInt(e.target.value, 10)));

      document.getElementById('btn-clear-data').addEventListener('click', async () => {
        const lessons = await getLessonsFromDB();
        for (const l of lessons) await deleteLessonFromDB(l.id);
        showToast(t('deleted'));
        renderLessons();
      });

      document.getElementById('btn-lang').addEventListener('click', () => {
        const langs = ['ar', 'fr', 'en'];
        const next = langs[(langs.indexOf(state.lang) + 1) % langs.length];
        setLang(next);
        renderLessons();
      });

      document.getElementById('btn-theme').addEventListener('click', () => {
        setTheme(state.theme === 'dark' ? 'light' : 'dark');
      });

      document.getElementById('btn-install').addEventListener('click', async () => {
        if (window.deferredPrompt) {
          window.deferredPrompt.prompt();
          await window.deferredPrompt.userChoice;
          window.deferredPrompt = null;
          showToast(t('installed'));
        } else {
          showToast(t('notInstallable'));
        }
      });

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
      });

      // Service worker registration
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }

      renderLessons();
    });
  </script>
</body>
</html>
