    function handleCueListClick(e) {
      const item = e.target.closest('.cue-item');
      const loopBtn = e.target.closest('.cue-loop');
      if (!item) return;
      const start = parseFloat(item.dataset.start);
      const end = parseFloat(item.dataset.end);
      if (loopBtn) {
        toggleLoopCue(start, end);
      } else {
        const video = document.getElementById('lesson-video');
        video.currentTime = start;
        if (video.paused) video.play();
      }
    }

    function handleSentenceClick(e) {
      const card = e.target.closest('.sentence-card');
      if (!card) return;
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
      const idx = parseInt(card.dataset.index, 10);
      jumpToCue(idx);
    }

    function jumpToCue(i) {
      const cue = state.currentCues[i];
      if (!cue) return;
      const video = document.getElementById('lesson-video');
      video.currentTime = cue.start;
      if (video.paused) video.play();
    }

    function updateCueText(i, value) {
      const cue = state.currentCues[i];
      if (!cue) return;
      cue.text = value;
      // Sync subtitle source with edited cues so video overlay, downloads, and save use the same text
      state.subtitleText = cuesToSrt(state.currentCues);
      state.subtitleType = 'srt';
      const vtt = cuesToVtt(state.currentCues);
      const track = document.querySelector('#lesson-video track');
      if (track) track.src = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
      updateSubtitleOverlay();
      renderSentences();
      updateDownloadLinks();
    }

    function showCueWords(i) {
      const cue = state.currentCues[i];
      if (!cue) return;
      const section = document.getElementById('words-section');
      const list = document.getElementById('words-list');
      if (!section || !list) return;
      const words = getCueWords(cue);
      list.innerHTML = words.map((w, idx) => `
        <div class="word-card">
          <span class="word-text">${escapeHtml(w)}</span>
          <div class="word-actions">
            <button onclick="speakWord(${i}, ${idx}, 'fr')" title="${t('listen')}">🔊</button>
            <button id="word-loop-${i}-${idx}-fr" class="loop-word" data-i="${i}" data-idx="${idx}" data-lang="fr" onclick="toggleWordLoop(${i}, ${idx}, 'fr')" title="${t('repeatWord')}">🔂</button>
          </div>
        </div>
      `).join('');
      section.classList.remove('hidden');
      section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closeWordsSection() {
      stopWordLoop();
      const section = document.getElementById('words-section');
      if (section) section.classList.add('hidden');
    }

    function getWordLang(word) {
      if (/[\u0600-\u06FF]/.test(word)) return 'ar';
      if (/[\u00C0-\u024F]/.test(word)) return 'fr';
      return state.lang || 'en';
    }

    function getTTSLang(word) {
      const base = getWordLang(word);
      if (base === 'ar') return 'ar-SA';
      if (base === 'fr') return 'fr-FR';
      return 'en-US';
    }

    function isCapacitor() {
      return typeof window !== 'undefined' && window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
    }

    function ttsStop() {
      if (isCapacitor()) {
        const plugin = window.Capacitor.Plugins.TextToSpeech;
        if (plugin) plugin.stop().catch(() => {});
      } else if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function ttsSpeak({ text, lang, onend }) {
      const ttsLang = lang || getTTSLang(text);
      if (isCapacitor()) {
        const plugin = window.Capacitor.Plugins.TextToSpeech;
        if (!plugin) return;
        plugin.stop().catch(() => {})
          .then(() => plugin.speak({ text, lang: ttsLang, rate: 1.0, pitch: 1.0, volume: 1.0, category: 'playback' }))
          .then(() => { if (onend) onend(); })
          .catch(() => { if (onend) onend(); });
      } else if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = ttsLang;
        if (onend) u.onend = onend;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      }
    }

    function ttsLangForCode(lang) {
      if (lang === 'fr') return 'fr-FR';
      if (lang === 'ar') return 'ar-SA';
      return 'en-US';
    }

    function speakWord(i, idx, lang) {
      const cue = state.currentCues[i];
      if (!cue) return;
      stopWordLoop();
      const words = getCueWordsByLang(cue, lang || 'fr');
      const word = words[idx];
      if (!word) return;
      ttsSpeak({ text: word, lang: ttsLangForCode(lang || 'fr') });
    }

    function toggleWordLoop(i, idx, lang) {
      if (state.loopWord && state.loopWord.i === i && state.loopWord.idx === idx && state.loopWord.lang === lang) {
        stopWordLoop();
        return;
      }
      stopWordLoop();
      state.loopWord = { i, idx, lang: lang || 'fr' };
      const cue = state.currentCues[i];
      const words = getCueWordsByLang(cue, lang || 'fr');
      const word = words[idx];
      if (!word) return;
      const ttsLang = ttsLangForCode(lang || 'fr');
      const speakLoop = () => {
        if (!state.loopWord || state.loopWord.i !== i || state.loopWord.idx !== idx || state.loopWord.lang !== lang) return;
        ttsSpeak({ text: word, lang: ttsLang, onend: () => setTimeout(speakLoop, 300) });
      };
      speakLoop();
      updateWordLoopButtons();
    }

    function stopWordLoop() {
      state.loopWord = null;
      ttsStop();
      updateWordLoopButtons();
    }

    function updateWordLoopButtons() {
      document.querySelectorAll('.word-loop').forEach(btn => {
        const i = parseInt(btn.dataset.i, 10);
        const idx = parseInt(btn.dataset.idx, 10);
        const lang = btn.dataset.lang || 'fr';
        if (isNaN(i) || isNaN(idx)) return;
        const isLoop = state.loopWord && state.loopWord.i === i && state.loopWord.idx === idx && state.loopWord.lang === lang;
        btn.classList.toggle('active', isLoop);
        btn.textContent = isLoop ? '🔁' : '🔂';
        const chip = btn.closest('.word-chip');
        if (chip) chip.classList.toggle('active', isLoop);
      });
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function shareOrDownload({ filename, blob, data, contentType, encoding }) {
      try {
        if (isCapacitor() && window.Capacitor.Plugins.Filesystem && window.Capacitor.Plugins.Share) {
          const writeData = data !== undefined ? data : await blobToBase64(blob);
          const opts = { path: filename, data: writeData, directory: 'CACHE' };
          if (encoding) opts.encoding = encoding;
          const { uri } = await window.Capacitor.Plugins.Filesystem.writeFile(opts);
          await window.Capacitor.Plugins.Share.share({
            title: filename,
            files: [uri],
            dialogTitle: filename
          });
          return;
        }
      } catch (e) { console.error('share failed', e); }
      const outBlob = blob || new Blob([data || ''], { type: contentType || 'application/octet-stream' });
      const url = URL.createObjectURL(outBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    window.downloadMedia = async function(type) {
      let filename, blob, contentType;
      if (type === 'video') {
        const mediaFile = state.videoFile || state.audioFile;
        if (!mediaFile) { showToast(t('chooseVideoFile')); return; }
        filename = mediaFile.name || (mediaFile.type && mediaFile.type.includes('audio') ? 'lesson.m4a' : 'lesson.mp4');
        blob = mediaFile;
        contentType = mediaFile.type || 'video/mp4';
      } else if (type === 'srt') {
        if (!state.currentCues.length) { showToast(t('addSubtitle')); return; }
        filename = (state.currentLesson && state.currentLesson.title ? state.currentLesson.title : 'lesson') + '.srt';
        blob = new Blob([cuesToSrt(state.currentCues)], { type: 'text/plain' });
        contentType = 'text/plain';
      } else if (type === 'vtt') {
        if (!state.currentCues.length) { showToast(t('addSubtitle')); return; }
        filename = (state.currentLesson && state.currentLesson.title ? state.currentLesson.title : 'lesson') + '.vtt';
        blob = new Blob([cuesToVtt(state.currentCues)], { type: 'text/vtt' });
        contentType = 'text/vtt';
      } else if (type === 'txt') {
        if (!state.currentCues.length) { showToast(t('addSubtitle')); return; }
        filename = (state.currentLesson && state.currentLesson.title ? state.currentLesson.title : 'lesson') + '.txt';
        const txt = state.currentCues.map(c => `${formatDuration(c.start)} - ${formatDuration(c.end)}\n${c.text}`).join('\n\n');
        blob = new Blob([txt], { type: 'text/plain' });
        contentType = 'text/plain';
      } else { return; }
      await shareOrDownload({ filename, blob, contentType });
    };

    function updateDownloadLinks() {
      const srtBtn = document.getElementById('btn-download-srt');
      if (srtBtn) srtBtn.textContent = '\u200E📥 SRT\u200E';
      const vttBtn = document.getElementById('btn-download-vtt');
      if (vttBtn) vttBtn.textContent = '\u200E📥 VTT\u200E';
      const txtBtn = document.getElementById('btn-download-txt');
      if (txtBtn) txtBtn.textContent = '\u200E📄 TXT\u200E';
    }

    function cuesToSrt(cues) {
      return cues.map((cue, i) => {
        const start = formatTimeSrt(cue.start);
        const end = formatTimeSrt(cue.end);
        return `${i+1}\n${start} --> ${end}\n${cue.text}\n`;
      }).join('\n');
    }

    function formatTimeSrt(sec) {
      const h = Math.floor(sec/3600);
      const m = Math.floor((sec%3600)/60);
      const s = Math.floor(sec%60);
      const ms = Math.round((sec%1)*1000).toString().padStart(3,'0');
      return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')},${ms}`;
    }

    function highlightActiveCue(activeCue) {
      const video = document.getElementById('lesson-video');
      const currentTime = video ? video.currentTime : 0;
      const cue = activeCue || state.currentCues.find(c => currentTime >= c.start && currentTime < c.end);
      const list = document.getElementById('cue-list');
      if (list) {
        list.querySelectorAll('.cue-item').forEach((el, i) => {
          const c = state.currentCues[i];
          if (!c) return;
          el.classList.toggle('active', cue && cue.start === c.start && cue.end === c.end);
          const btn = el.querySelector('.cue-loop');
          if (btn) {
            const isLoop = state.loopCue && state.loopCue.start === c.start && state.loopCue.end === c.end;
            btn.classList.toggle('active', isLoop);
            btn.textContent = isLoop ? '🔁' : '🔂';
          }
        });
      }
    }

    function attachSubtitleListeners(video) {
      video.addEventListener('timeupdate', updateSubtitleOverlay);
      video.addEventListener('seeked', updateSubtitleOverlay);
      video.addEventListener('play', updateSubtitleOverlay);
      video.addEventListener('pause', updateSubtitleOverlay);
      video.addEventListener('ended', handleVideoEnded);
      try { Array.from(video.textTracks).forEach(t => t.mode = 'hidden'); } catch (e) {}
    }

    function detachSubtitleListeners(video) {
      video.removeEventListener('timeupdate', updateSubtitleOverlay);
      video.removeEventListener('seeked', updateSubtitleOverlay);
      video.removeEventListener('play', updateSubtitleOverlay);
      video.removeEventListener('pause', updateSubtitleOverlay);
      video.removeEventListener('ended', handleVideoEnded);
    }

    function handleVideoEnded() {
      const video = document.getElementById('lesson-video');
      if (!video) return;
      if (state.videoLoop) {
        video.currentTime = 0;
        video.play();
      } else if (state.loopCue) {
        video.currentTime = state.loopCue.start;
        video.play();
      }
    }

    window.toggleLoopCue = function(start, end) {
      const video = document.getElementById('lesson-video');
      if (state.loopCue && state.loopCue.start === start && state.loopCue.end === end) {
        state.loopCue = null;
      } else {
        state.loopCue = { start, end };
        video.currentTime = start;
        if (video.paused) video.play();
      }
      updateSubtitleOverlay();
      updateCueListLoopStates();
      updateSentenceLoopStates();
    };

    window.toggleCurrentLoop = function() {
      const video = document.getElementById('lesson-video');
      const cue = state.currentCues.find(c => video.currentTime >= c.start && video.currentTime < c.end);
      if (!cue) return;
      toggleLoopCue(cue.start, cue.end);
    };

    window.setPlaybackSpeed = function(rate) {
      const video = document.getElementById('lesson-video');
      video.playbackRate = rate;
      document.querySelectorAll('.speed-buttons button').forEach(b => {
        b.classList.toggle('active', Math.abs(parseFloat(b.dataset.speed) - rate) < 0.01);
      });
    };

    window.replayCurrentCue = function() {
      const video = document.getElementById('lesson-video');
      const cue = state.currentCues.find(c => video.currentTime >= c.start && video.currentTime < c.end);
      if (cue) {
        video.currentTime = cue.start;
      } else if (state.loopCue) {
        video.currentTime = state.loopCue.start;
      } else {
        video.currentTime = 0;
      }
      if (video.paused) video.play();
    };

    window.toggleVideoLoop = function() {
      state.videoLoop = !state.videoLoop;
      const btn = document.getElementById('video-loop');
      if (btn) btn.classList.toggle('active', state.videoLoop);
    };

    window.toggleCaptions = function() {
      state.captionsVisible = !state.captionsVisible;
      const display = document.getElementById('subtitle-display');
      const btn = document.getElementById('btn-toggle-captions');
      if (display) display.classList.toggle('hidden', !state.captionsVisible);
      if (btn) btn.classList.toggle('active', state.captionsVisible);
      if (btn) btn.textContent = state.captionsVisible ? 'CC' : 'CC';
    };

    window.changeCaptionSize = function(delta) {
      state.captionScale = Math.max(0.5, Math.min(2.0, state.captionScale + delta));
      localStorage.setItem('vs_caption_scale', state.captionScale);
      const display = document.getElementById('subtitle-display');
      if (display) display.style.setProperty('--caption-scale', state.captionScale);
    };

    function syncCaptionControls() {
      const display = document.getElementById('subtitle-display');
      const btn = document.getElementById('btn-toggle-captions');
      if (display) {
        display.classList.toggle('hidden', !state.captionsVisible);
        display.style.setProperty('--caption-scale', state.captionScale);
      }
      if (btn) btn.classList.toggle('active', state.captionsVisible);
    }

    async function saveLesson() {
      const title = document.getElementById('lesson-title').value.trim();
      if (!title) { showToast(t('enterTitle')); return; }
      if (!state.videoFile && !state.audioFile) { showToast(t('chooseVideoFile')); return; }
      const mediaFile = state.videoFile || state.audioFile;

      const text = state.subtitleType === 'srt' ? state.subtitleText : document.getElementById('timed-text').value;
      if (!text.trim()) { showToast(t('addSubtitle')); return; }

      const vtt = anySubtitleToVtt(text, state.subtitleType);
      if (!vtt) { showToast(t('invalidTime')); return; }

      const video = document.getElementById('lesson-video');
      const duration = video.duration || 0;

      const isEdit = state.editingId && state.currentLesson && state.currentLesson.id === state.editingId;
      const existing = isEdit ? state.currentLesson : null;
      const lesson = {
        id: state.editingId || Date.now(),
        title,
        lang: state.lang,
        videoName: mediaFile.name,
        videoType: mediaFile.type,
        videoFile: mediaFile,
        subtitleType: state.subtitleType,
        subtitleText: text,
        vttBlob: new Blob([vtt], { type: 'text/vtt' }),
        duration,
        coverImage: existing && existing.coverImage ? existing.coverImage : null,
        createdAt: existing && existing.createdAt ? existing.createdAt : Date.now()
      };

      await saveLessonToDB(lesson);
      showToast(t('saved'));
      await deleteDraft();
      resetEditor();
      showPage('lessons');
    }

    async function loadLessonForPlay(id) {
      const lesson = await getLessonById(id);
      if (!lesson) return;
      resetEditor();
      state.currentLesson = lesson;
      document.getElementById('lesson-title').value = lesson.title;
      state.videoFile = lesson.videoFile;
      document.getElementById('video-name').textContent = lesson.videoName;
      state.subtitleType = lesson.subtitleType || 'srt';
      selectSubtab(state.subtitleType);
      if (state.subtitleType === 'srt') {
        state.subtitleText = lesson.subtitleText;
        document.getElementById('srt-name').textContent = 'subtitles.' + (state.subtitleType === 'srt' ? 'srt' : 'txt');
      } else {
        document.getElementById('timed-text').value = lesson.subtitleText;
      }

      const detectedType = isSrtFormat(lesson.subtitleText) ? 'srt' : lesson.subtitleType;
      state.currentCues = detectedType === 'srt' ? parseSrt(lesson.subtitleText) : parseTimedText(lesson.subtitleText);
      state.loopCue = null;

      const video = document.getElementById('lesson-video');
      detachSubtitleListeners(video);
      video.src = URL.createObjectURL(lesson.videoFile);
      const track = document.createElement('track');
      track.kind = 'subtitles';
      track.label = 'Subtitles';
      track.srclang = lesson.lang || 'ar';
      track.src = URL.createObjectURL(lesson.vttBlob);
      const old = video.querySelector('track');
      if (old) old.remove();
      video.appendChild(track);
      track.mode = 'hidden';
      document.getElementById('preview-wrap').classList.remove('hidden');

      document.getElementById('subtitle-display').classList.remove('hidden');
      syncCaptionControls();
      document.getElementById('subtitle-toolbar').classList.remove('hidden');
      document.getElementById('playback-controls').classList.remove('hidden');
      document.getElementById('download-links').classList.remove('hidden');
      document.getElementById('sentences-section').classList.remove('hidden');
      document.getElementById('cue-list').classList.remove('hidden');
      attachSubtitleListeners(video);
      video.load();
      updateSubtitleOverlay();
      renderCueList();
      renderSentences();
      renderLessonWords();
      updateDownloadLinks();
      setPlayerMode(true, lesson.title);
      await saveDraft();
      showPage('lesson');
      history.pushState({ page: 'lesson', lessonId: id }, '');
    }

    async function loadLessonForEdit(id) {
      await loadLessonForPlay(id);
      state.editingId = id;
      setPlayerMode(false);
      showPage('editor');
      await saveDraft();
      history.pushState({ page: 'editor', lessonId: id }, '');
    }

    // --- Event listeners ---
    document.addEventListener('DOMContentLoaded', async () => {
      state.db = await openDB();
      setLang(state.lang);
      setTheme(state.theme);
      setFontSize(state.fontSize);
      setCardStyle(state.cardStyle);
      setLangOrder(state.langOrder);

      // Header nav
      document.querySelectorAll('nav button, .lesson-card').forEach(btn => {
        if (btn.dataset.page) btn.addEventListener('click', () => {
          if (btn.dataset.page === 'editor' && (state.playerMode || state.editingId)) {
            resetEditor();
          }
          showPage(btn.dataset.page);
        });
      });

      // Phone back button / browser back navigation
      window.addEventListener('popstate', (e) => {
        const activePage = document.querySelector('.page.active');
        const activeId = activePage ? activePage.id : '';
        if (activeId === 'page-lesson' || (activeId === 'page-editor' && state.currentLesson)) {
          showPage('lessons');
        }
      });

      // Load draft workspace
      await loadDraft();

      // File inputs
      document.getElementById('video-file').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (f) { state.videoFile = f; state.audioFile = null; document.getElementById('video-name').textContent = f.name; document.getElementById('audio-name').textContent = ''; document.getElementById('audio-file').value = ''; scheduleSaveDraft(); }
      });
      document.getElementById('audio-file').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (f) { state.audioFile = f; state.videoFile = null; document.getElementById('audio-name').textContent = f.name; document.getElementById('video-name').textContent = ''; document.getElementById('video-file').value = ''; scheduleSaveDraft(); }
      });
      document.getElementById('srt-file').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        document.getElementById('srt-name').textContent = f.name;
        const reader = new FileReader();
        reader.onload = (ev) => { state.subtitleText = ev.target.result; scheduleSaveDraft(); };
        reader.readAsText(f);
      });
      document.getElementById('lesson-title').addEventListener('input', scheduleSaveDraft);
      document.getElementById('timed-text').addEventListener('input', scheduleSaveDraft);

      // Subtabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => { selectSubtab(tab.dataset.subtab); scheduleSaveDraft(); });
      });

      // Actions
      document.getElementById('btn-preview').addEventListener('click', previewLesson);
      document.getElementById('btn-save-lesson').addEventListener('click', saveLesson);
      document.getElementById('btn-cancel-edit').addEventListener('click', () => showPage('lessons'));
      document.getElementById('btn-back').addEventListener('click', () => showPage('lessons'));

      // Lesson list interactions (delegation)
      document.getElementById('lessons-list').addEventListener('click', async (e) => {
        const card = e.target.closest('.lesson-card');
        if (!card) return;
        const menu = card.querySelector('.lesson-menu');
        const id = menu ? parseInt(menu.dataset.id, 10) : null;
        if (e.target.closest('.btn-menu') || e.target.closest('[data-action="menu"]')) {
          e.stopPropagation();
          if (id) openLessonActions(id);
          return;
        }
        if (id) await loadLessonForPlay(id);
      });

      document.getElementById('lesson-actions').addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const id = state.actionLessonId;
        closeLessonActions();
        if (!id) return;
        if (action === 'play') await loadLessonForPlay(id);
        else if (action === 'edit') await loadLessonForEdit(id);
        else if (action === 'image') setLessonImage(id);
        else if (action === 'delete') {
          if (confirm(t('confirmDelete'))) {
            await deleteLessonFromDB(id);
            showToast(t('deleted'));
            renderLessons();
          }
        }
      });

      // Settings
      document.getElementById('settings-language').addEventListener('change', (e) => setLang(e.target.value));
      document.getElementById('settings-theme').addEventListener('change', (e) => setTheme(e.target.value));
      document.getElementById('settings-font-size').addEventListener('input', (e) => setFontSize(parseInt(e.target.value, 10)));
      document.getElementById('settings-card-style').addEventListener('change', (e) => setCardStyle(e.target.value));
      document.getElementById('settings-lang-order').addEventListener('change', (e) => setLangOrder(e.target.value.split(',')));

      document.getElementById('btn-clear-data').addEventListener('click', async () => {
        if (!confirm(t('confirmClearAll'))) return;
        const lessons = await getLessonsFromDB();
        for (const l of lessons) if (l.id !== DRAFT_ID) await deleteLessonFromDB(l.id);
        showToast(t('deleted'));
        renderLessons();
      });

      document.getElementById('btn-export').addEventListener('click', exportLessons);
      document.getElementById('btn-import').addEventListener('click', () => document.getElementById('backup-import-file').click());
      document.getElementById('backup-import-file').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (f) importLessons(f);
      });

      document.getElementById('lesson-image-file').addEventListener('change', async (e) => {
        const f = e.target.files[0];
        const id = state.imageLessonId;
        state.imageLessonId = null;
        if (!f || !id) return;
        const lesson = await getLessonById(id);
        if (!lesson) return;
        lesson.coverImage = f;
        await saveLessonToDB(lesson);
        showToast(t('saved'));
        renderLessons();
      });

      document.getElementById('btn-lang').addEventListener('click', () => {
        const langs = ['ar', 'fr', 'en'];
        const next = langs[(langs.indexOf(state.lang) + 1) % langs.length];
        setLang(next);
        renderLessons();
      });

      document.getElementById('btn-theme').addEventListener('click', () => {
        const themes = ['dark', 'light', 'ocean', 'forest', 'berry', 'sunset', 'midnight'];
        const next = themes[(themes.indexOf(state.theme) + 1) % themes.length];
        setTheme(next);
      });

      document.getElementById('btn-mute').addEventListener('click', () => {
        ttsStop();
        const video = document.getElementById('lesson-video');
        if (video) video.pause();
      });

      // Service worker registration
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }

      renderLessons();
    });
  </script>
</body>
</html>
