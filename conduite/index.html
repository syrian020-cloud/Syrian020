<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d3b2e">
<title>picLib — إطارات الصور</title>
<link rel="manifest" href="manifest.json">
<style>
@font-face { font-family: 'Cairo'; src: url('fonts/cairo.ttf'); font-weight: 100 900; }
@font-face { font-family: 'Amiri'; src: url('fonts/amiri.ttf'); }
@font-face { font-family: 'Tajawal'; src: url('fonts/tajawal.ttf'); font-weight: 700; }
@font-face { font-family: 'Lateef'; src: url('fonts/lateef.ttf'); }
@font-face { font-family: 'Scheherazade'; src: url('fonts/scheherazade.ttf'); }
@font-face { font-family: 'Ruqaa'; src: url('fonts/ruqaa.ttf'); }
@font-face { font-family: 'Geeza'; src: url('fonts/geeza-pro.ttf'); }
@font-face { font-family: 'Simplified'; src: url('fonts/simplified-arabic.ttf'); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
:root {
  --acc: var(--acc);
  --acc2: #14614a;
  --acc-dark: #0d3b2e;
  --acc-deep: var(--acc-deep);
  --panel: var(--panel);
  --line: var(--line);
  --mut: var(--mut);
}
body {
  font-family: 'Cairo', 'Tajawal', sans-serif;
  background: #07100d;
  color: #f0f4f1;
  user-select: none;
}
#app { display: flex; flex-direction: column; height: 100%; }
header {
  background: linear-gradient(135deg, var(--acc-dark), var(--acc2));
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,.4);
  z-index: 5;
}
header .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; }
header .logo img { width: 30px; height: 30px; border-radius: 8px; }
header .spacer { flex: 1; }
.iconbtn {
  background: rgba(255,255,255,.12); border: none; color: #fff;
  width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.iconbtn:active { transform: scale(.92); }
.steps {
  display: flex; direction: rtl; background: var(--acc-dark);
  padding: 8px 10px 12px; gap: 4px;
}
.step { flex: 1; text-align: center; font-size: 12.5px; color: var(--mut); position: relative; padding-top: 4px; }
.step .n {
  display: inline-flex; width: 22px; height: 22px; border-radius: 50%;
  background: var(--line); color: #cfe5d9; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; margin-inline-start: 4px;
}
.step.active { color: #fff; font-weight: 700; }
.step.active .n { background: var(--acc); color: var(--acc-deep); }
.step.done .n { background: var(--acc); color: var(--acc-deep); }
.step::after {
  content: ''; position: absolute; bottom: -6px; right: 0; left: 0; height: 2.5px;
  background: var(--line); border-radius: 2px;
}
.step.active::after, .step.done::after { background: var(--acc); }
main { flex: 1; overflow-y: auto; padding: 14px; }
h1.title { font-size: 21px; margin: 4px 0 2px; font-weight: 800; }
p.sub { color: var(--mut); font-size: 13.5px; margin: 0 0 14px; }
.frames-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 20px; }
.frame-card {
  background: var(--panel); border-radius: 16px; overflow: hidden; cursor: pointer;
  border: 2px solid transparent; transition: border-color .15s, transform .1s;
}
.frame-card:active { transform: scale(.97); }
.frame-card.selected { border-color: var(--acc); }
.frame-card canvas { width: 100%; display: block; aspect-ratio: 1; }
.frame-card .fname { padding: 8px 10px; font-size: 13.5px; font-weight: 700; text-align: center; }
.dropzone {
  border: 2.5px dashed color-mix(in srgb, var(--acc) 40%, transparent); border-radius: 20px; margin-top: 8px;
  min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; cursor: pointer; padding: 30px 16px; text-align: center;
}
.dropzone .cam { width: 76px; height: 76px; border-radius: 50%; background: var(--acc-dark);
  display: flex; align-items: center; justify-content: center; font-size: 34px; }
.dropzone h2 { margin: 0; font-size: 18px; }
.dropzone p { margin: 0; color: var(--mut); font-size: 13px; line-height: 1.7; }
.selected-frame-bar {
  display: flex; align-items: center; gap: 10px; background: var(--panel);
  border-radius: 14px; padding: 10px; margin-bottom: 12px;
}
.selected-frame-bar canvas { width: 56px; height: 56px; border-radius: 10px; }
.selected-frame-bar .lbl { font-size: 11.5px; color: var(--mut); }
.selected-frame-bar .nm { font-weight: 700; font-size: 14.5px; }
.selected-frame-bar .chg { margin-inline-start: auto; color: var(--acc); font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px; }
.editor-wrap { display: flex; flex-direction: column; height: 100%; }
#preview-holder {
  position: relative; border-radius: 18px; overflow: hidden; background: var(--panel);
  margin-bottom: 10px; touch-action: none; flex-shrink: 0; aspect-ratio: 1;
}
#preview { width: 100%; display: block; touch-action: none; }
.hint { text-align: center; color: var(--mut); font-size: 12.5px; margin: 2px 0 8px; }
.zoomrow { display: flex; align-items: center; gap: 12px; padding: 0 8px; margin-bottom: 10px; }
.zoomrow input[type=range] { flex: 1; accent-color: var(--acc); height: 34px; }
.zoomrow .zbtn { font-size: 22px; color: #fff; background: none; border: none; cursor: pointer; padding: 4px 8px; }
.toolrow { display: flex; gap: 8px; margin-bottom: 10px; }
.tool {
  flex: 1; background: var(--panel); border: none; color: #fff; border-radius: 12px;
  padding: 10px 4px; font-size: 12.5px; font-family: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.tool .ti { font-size: 17px; }
.tool:active { transform: scale(.96); }
.txteditor { background: var(--panel); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
.txteditor input[type=text] {
  width: 100%; background: #07100d; border: 1px solid var(--line); color: #fff;
  border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; margin-bottom: 8px;
}
.txtrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.txtrow select, .txtrow input[type=color] {
  background: #07100d; border: 1px solid var(--line); color: #fff; border-radius: 10px;
  padding: 8px; font-family: inherit; font-size: 13px;
}
.txtrow input[type=color] { width: 44px; height: 38px; padding: 2px; }
.txtrow input[type=range] { flex: 1; min-width: 80px; accent-color: var(--acc); }
.posbtns { display: flex; gap: 6px; margin-top: 8px; }
.posbtn {
  flex: 1; background: #07100d; border: 1px solid var(--line); color: #cfe5d9;
  border-radius: 8px; padding: 6px 2px; font-size: 11.5px; cursor: pointer; font-family: inherit;
}
.posbtn.on { background: var(--acc); color: var(--acc-deep); border-color: var(--acc); font-weight: 700; }
.shapebtn {
  flex: 1; background: #07100d; border: 1px solid var(--line); color: #cfe5d9;
  border-radius: 8px; padding: 6px 2px; font-size: 11.5px; cursor: pointer; font-family: inherit;
}
.shapebtn.on { background: var(--acc); color: var(--acc-deep); border-color: var(--acc); font-weight: 700; }
.savebtn {
  width: 100%; background: linear-gradient(135deg, var(--acc), var(--acc2)); border: none; color: var(--acc-deep);
  font-size: 18px; font-weight: 800; font-family: inherit; padding: 15px; border-radius: 14px;
  cursor: pointer; margin-top: auto; margin-bottom: 8px;
}
.savebtn:active { transform: scale(.98); }
.sharebtn {
  width: 100%; background: var(--panel); border: 1px solid var(--acc); color: var(--acc);
  font-size: 15px; font-weight: 700; font-family: inherit; padding: 12px; border-radius: 14px;
  cursor: pointer; margin-bottom: 14px;
}
.hidden { display: none !important; }
.note { display: flex; gap: 8px; align-items: flex-start; color: var(--mut); font-size: 12px; line-height: 1.7; margin: 6px 2px 14px; }
.backrow { display: flex; gap: 8px; margin-bottom: 10px; }
.backbtn {
  background: var(--panel); border: 1px solid var(--line); color: #cfe5d9; border-radius: 12px;
  padding: 8px 16px; font-size: 13px; font-family: inherit; cursor: pointer;
}
.toast {
  position: fixed; bottom: 90px; right: 50%; transform: translateX(50%);
  background: var(--acc); color: var(--acc-deep); font-weight: 700; padding: 10px 22px;
  border-radius: 24px; font-size: 14px; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,.4);
  animation: fadein .2s;
}
@keyframes fadein { from { opacity: 0; transform: translateX(50%) translateY(8px); } }
</style>

function setStep(n) {
  state.step = n;
  document.querySelectorAll('.step').forEach(el => {
    const s = +el.dataset.s;
    el.classList.toggle('active', s === n);
    el.classList.toggle('done', s < n);
  });
  document.getElementById('backBtn').classList.toggle('hidden', n === 1);
  render();
}

document.getElementById('backBtn').onclick = () => { if (state.step > 1) setStep(state.step - 1); };

function effectiveFrame(f) {
  if (!f || !f.custom) return f;
  const c = state.custom;
  return Object.assign({}, f, {
    title: c.title, sub: c.sub, sub2: '',
    bg: [c.bg1, c.bg2],
    ring: [c.ring1, c.ring2, c.ring3],
    font: c.font, titleColor: c.titleColor,
    flag: c.flag !== 'none',
    customW: c.ringW || 2.9,
    customImg: c.flag === 'image' ? state.customImgEl : null,
    flagDef: FLAGS[c.flag] || null,
  });
}

function shapePath(ctx, cx, cy, R, shape) {
  if (shape === 'square') {
    const s = R * 1.72;
    ctx.rect(cx - s/2, cy - s/2, s, s);
  } else if (shape === 'rounded') {
    const s = R * 1.72, r = s * 0.18;
    const x = cx - s/2, y = cy - s/2;
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + s, y, x + s, y + s, r);
    ctx.arcTo(x + s, y + s, x, y + s, r);
    ctx.arcTo(x, y + s, x, y, r);
    ctx.arcTo(x, y, x + s, y, r);
    ctx.closePath();
  } else if (shape === 'hexagon') {
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 3;
      const x = cx + Math.cos(a) * R * 1.02, y = cy + Math.sin(a) * R * 1.02;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  } else if (shape === 'heart') {
    const s = R / 52;
    ctx.moveTo(cx, cy + 42 * s);
    ctx.bezierCurveTo(cx - 70 * s, cy - 12 * s, cx - 38 * s, cy - 62 * s, cx, cy - 22 * s);
    ctx.bezierCurveTo(cx + 38 * s, cy - 62 * s, cx + 70 * s, cy - 12 * s, cx, cy + 42 * s);
    ctx.closePath();
  } else if (shape === 'diamond') {
    const s = R * 1.18;
    ctx.moveTo(cx, cy - s);
    ctx.lineTo(cx + s, cy);
    ctx.lineTo(cx, cy + s);
    ctx.lineTo(cx - s, cy);
    ctx.closePath();
  } else if (shape === 'octagon') {
    for (let i = 0; i < 8; i++) {
      const a = -Math.PI / 2 + Math.PI / 8 + i * Math.PI / 4;
      const x = cx + Math.cos(a) * R * 1.02, y = cy + Math.sin(a) * R * 1.02;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  } else if (shape === 'star') {
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 === 0 ? R * 1.05 : R * 0.52;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  } else if (shape === 'triangle') {
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 3;
      const x = cx + Math.cos(a) * R * 1.1, y = cy + Math.sin(a) * R * 1.1;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  } else {
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
  }
}

function patternBg(ctx, S, f) {
  const g = ctx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, f.bg[0]); g.addColorStop(1, f.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = S * 0.004;
  const st = S / 7;
  for (let x = -S; x < S * 2; x += st) {
    for (let y = -S; y < S * 2; y += st) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(Math.PI / 4);
      ctx.strokeRect(-st/2.6, -st/2.6, st/1.3, st/1.3);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawPhotoInCircle(ctx, S, R, cx, cy) {
  if (!state.img) {
    ctx.save();
    ctx.beginPath(); shapePath(ctx, cx, cy, R, state.shape); ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    if (sampleImg.complete && sampleImg.naturalWidth) {
      const sc = Math.max((R * 2) / sampleImg.naturalWidth, (R * 2) / sampleImg.naturalHeight);
      ctx.globalAlpha = 0.55;
      ctx.drawImage(sampleImg, cx - sampleImg.naturalWidth * sc / 2, cy - sampleImg.naturalHeight * sc / 2, sampleImg.naturalWidth * sc, sampleImg.naturalHeight * sc);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = `${R * 0.5}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🖼️', cx, cy);
    }
    ctx.restore();
    return;
  }
  const img = state.img;
  ctx.save();
  ctx.beginPath(); shapePath(ctx, cx, cy, R, state.shape); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  const base = Math.max((R * 2) / img.width, (R * 2) / img.height);
  const sc = base * state.zoom;
  ctx.translate(cx + state.tx * S / 1000, cy + state.ty * S / 1000);
  ctx.rotate(state.rot);
  ctx.scale(state.flipX ? -sc : sc, sc);
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
}

function strokeShapeRing(ctx, cx, cy, R, shape, inflate, lw, color) {
  ctx.save();
  ctx.lineWidth = lw;
  ctx.strokeStyle = color;
  ctx.beginPath();
  shapePath(ctx, cx, cy, R + inflate, shape);
  ctx.stroke();
  ctx.restore();
}

function drawRing(ctx, S, R, cx, cy, f) {
  const lw = S * 0.023;
  ctx.save();
  const sh = state.shape;
  if (f.flag) {
    const outer = lw * (f.customW || 2.9);
    ctx.save();
    ctx.beginPath();
    shapePath(ctx, cx, cy, R + outer, sh);
    shapePath(ctx, cx, cy, R, sh);
    ctx.clip('evenodd');
    const fd = f.flagDef || FLAGS.syria;
    const top = cy - R - outer, bandH = (R + outer) * 2;
    const left = cx - R - outer - 2, bandW = (R + outer) * 2 + 4;
    if (f.customImg) {
      const iw = f.customImg.naturalWidth || f.customImg.width, ih = f.customImg.naturalHeight || f.customImg.height;
      const scale = Math.max(bandW / iw, bandH / ih);
      const dw = iw * scale, dh = ih * scale;
      ctx.drawImage(f.customImg, left + (bandW - dw) / 2, top - 2 + (bandH + 4 - dh) / 2, dw, dh);
    } else if (fd.vertical) {
      fd.stripes.forEach((col, i) => {
        ctx.fillStyle = col;
        ctx.fillRect(left + bandW * i / 3, top - 2, bandW / 3 + 1, bandH + 4);
      });
    }
    ctx.restore();
    if (!f.customImg && !fd.vertical) {
      const wts = fd.weights || fd.stripes.map(() => 1);
      const wsum = wts.reduce((a, b) => a + b, 0);
      let acc = 0;
      fd.stripes.forEach((col, i) => {
        const band = outer * wts[i] / wsum;
        strokeShapeRing(ctx, cx, cy, R, sh, outer - acc - band / 2, band, col);
        acc += band;
      });
    }
    ctx.save();
    const stS = lw * 0.5;
    const drawStarBand = fd.stars > 0;
    const halfW = state.shape === 'circle' ? R
      : state.shape === 'rounded' || state.shape === 'square' ? R * 0.86
      : state.shape === 'hexagon' || state.shape === 'octagon' ? R * 0.9
      : state.shape === 'diamond' ? R * 0.95
      : state.shape === 'star' ? R * 0.78
      : state.shape === 'triangle' ? R * 0.85
      : R * 0.72;
    const bandMid = halfW + outer * 0.5;
    if (drawStarBand) [[-1, 0], [1, 0]].forEach(([dir]) => {
      const sx = cx + dir * bandMid;
      [-1, 0, 1].forEach(dy => drawStar(ctx, sx, cy + dy * lw * 1.55, stS, fd.starColor || '#ce1126'));
    });
    if (fd.emblem) {
      const emS = outer * 0.5;
      ctx.font = `${emS}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const wts2 = fd.weights || fd.stripes.map(() => 1);
      const wsum2 = wts2.reduce((a, b) => a + b, 0);
      const midOff = outer - outer * wts2[0] / wsum2 - outer * (wts2[1] || 0) / wsum2 / 2;
      const emR = halfW + midOff;
      [[cx, cy - emR], [cx, cy + emR], [cx - emR, cy], [cx + emR, cy]].forEach(([ex, ey]) => {
        ctx.fillText(fd.emblem, ex, ey);
      });
    }
    if (fd.bandText) {
      ctx.fillStyle = fd.bandTextColor || '#007a3d';
      ctx.font = `bold ${outer / 3 * 0.88}px Cairo, Tajawal, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      [[cx, cy - bandMid], [cx, cy + bandMid]].forEach(([tx0, ty0]) => {
        ctx.save();
        ctx.translate(tx0, ty0);
        ctx.fillText(fd.bandText, 0, 0);
        ctx.restore();
      });
    }
    ctx.restore();
    const edgeOut = (!f.customImg && fd.stripes.length) ? fd.stripes[0] : f.ring[2];
    const edgeIn = (!f.customImg && fd.stripes.length) ? fd.stripes[fd.stripes.length - 1] : f.ring[2];
    strokeShapeRing(ctx, cx, cy, R, sh, outer + lw * 0.15, lw * 0.3, edgeOut);
    strokeShapeRing(ctx, cx, cy, R, sh, -lw * 0.15, lw * 0.3, edgeIn);
  } else {
    strokeShapeRing(ctx, cx, cy, R, sh, lw * 1.1, lw * 1.6, f.ring[2]);
    strokeShapeRing(ctx, cx, cy, R, sh, lw * 0.55, lw, f.ring[0]);
    strokeShapeRing(ctx, cx, cy, R, sh, lw * 0.05, lw * 0.75, f.ring[1]);
  }
  if (f.stars) {
    ctx.fillStyle = f.accent;
    if (f.flag) { ctx.restore(); return; }
    const starR = R + lw * 0.55;
    [Math.PI * 1.5, Math.PI * 0.15, Math.PI * 0.85].forEach(a => {
      const x = cx + Math.cos(a) * starR;
      const y = cy + Math.sin(a) * starR;
      drawStar(ctx, x, y, lw * 0.85, f.accent);
    });
  }
  ctx.restore();
}

function drawStar(ctx, x, y, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * 4 * Math.PI / 5;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawDecor(ctx, S, R, cx, cy, f) {
  if (!f.decor || !f.decor.length) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const rr = R + S * 0.045;
  f.decor.forEach((d, i) => {
    const a = Math.PI * 0.5 + (i - (f.decor.length - 1) / 2) * 0.5;
    ctx.font = `${S * 0.055}px serif`;
    ctx.fillText(d, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr + S * 0.03);
  });
  ctx.restore();
}

function arText(ctx, text, x, y, size, font, color, weight) {
  ctx.save();
  ctx.font = `${weight || 800} ${size}px "${font}", serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = size * 0.15; ctx.shadowOffsetY = size * 0.04;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawFrameText(ctx, S, R, cx, cy, f) {
  if (!f.title) return;
  const fs = S * 0.062;
  const y = cy + R * 0.52;
  arText(ctx, f.title, cx, y, fs, f.font, f.titleColor);
  if (f.sub) {
    ctx.save();
    ctx.font = `700 ${S * 0.032}px "Cairo", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('\u200e' + f.sub + '\u200e', cx, y + fs * 0.95);
    ctx.restore();
  }
  if (f.sub2) {
    ctx.save();
    ctx.font = `700 ${S * 0.034}px "Cairo", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(f.sub2, cx, y + fs * 1.7);
    ctx.restore();
  }
}

function drawCustomText(ctx, S, R, cx, cy) {
  if (!state.customText.trim()) return;
  const size = state.textSize * S / 1080;
  let y;
  if (state.textPos === 'bottom') y = cy + R + S * 0.085;
  else if (state.textPos === 'top') y = cy - R - S * 0.06;
  else y = cy + R * 0.80;
  arText(ctx, state.customText, cx, y, size, state.textFont, state.textColor);
}

function renderScene(ctx, S, f0) {
  const f = effectiveFrame(f0);
  patternBg(ctx, S, f);
  const cx = S / 2, cy = S / 2, R = S * (f0.custom ? (state.custom.photoR || 0.34) : 0.34);
  drawPhotoInCircle(ctx, S, R, cx, cy);
  drawRing(ctx, S, R, cx, cy, f);
  drawDecor(ctx, S, R, cx, cy, f);
  drawFrameText(ctx, S, R, cx, cy, f);
  drawCustomText(ctx, S, R, cx, cy);
}

function frameThumb(f, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size || 240;
  const ctx = c.getContext('2d');
  const imgBak = state.img;
  const noPhoto = !imgBak;
  renderScene(ctx, c.width, f);
  return c;
}

/* ---------- Editor logic ---------- */

let previewCtx, previewCanvas;

function redraw() {
  if (!previewCanvas) return;
  renderScene(previewCtx, previewCanvas.width, state.frame);
}

function setupEditor() {
  previewCanvas = document.getElementById('preview');
  previewCtx = previewCanvas.getContext('2d');
  const holder = document.getElementById('preview-holder');
  redraw();

  let dragging = false, lastX = 0, lastY = 0;
  let pinchD = 0, pinchZ = 1;
  const pts = new Map();

  previewCanvas.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { dragging = true; lastX = e.clientX; lastY = e.clientY; }
    if (pts.size === 2) {
      const p = [...pts.values()];
      pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      pinchZ = state.zoom;
      dragging = false;
    }
    previewCanvas.setPointerCapture(e.pointerId);
  });
  previewCanvas.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const p = [...pts.values()];
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      state.zoom = Math.min(4, Math.max(1, pinchZ * d / (pinchD || 1)));
      document.getElementById('zoom').value = state.zoom;
      redraw();
      return;
    }
    if (!dragging) return;
    const scale = 1000 / previewCanvas.clientWidth;
    state.tx += (e.clientX - lastX) * scale / 1.5;
    state.ty += (e.clientY - lastY) * scale / 1.5;
    lastX = e.clientX; lastY = e.clientY;
    redraw();
  });
  const up = e => { pts.delete(e.pointerId); if (!pts.size) dragging = false; };
  previewCanvas.addEventListener('pointerup', up);
  previewCanvas.addEventListener('pointercancel', up);

  document.getElementById('zoom').oninput = e => { state.zoom = +e.target.value; redraw(); };
  document.getElementById('zin').onclick = () => { state.zoom = Math.min(4, state.zoom + 0.2); document.getElementById('zoom').value = state.zoom; redraw(); };
  document.getElementById('zout').onclick = () => { state.zoom = Math.max(1, state.zoom - 0.2); document.getElementById('zoom').value = state.zoom; redraw(); };
  document.getElementById('rotBtn').onclick = () => { state.rot += Math.PI / 2; redraw(); };
  document.getElementById('flipBtn').onclick = () => { state.flipX = !state.flipX; redraw(); };
  document.getElementById('resetBtn').onclick = () => {
    state.zoom = 1; state.tx = 0; state.ty = 0; state.rot = 0; state.flipX = false;
    document.getElementById('zoom').value = 1; redraw();
  };
  document.getElementById('otherBtn').onclick = () => document.getElementById('fileInput').click();

  if (state.frame.custom) {
    const cf = state.custom;
    const flagSel = document.getElementById('cfFlag');
    if (flagSel && flagSel.options.length < 10) {
      Object.keys(FLAG_NAMES).forEach(k => {
        if (k === 'syria') return;
        const o = document.createElement('option');
        o.value = k; o.textContent = FLAG_NAMES[k];
        flagSel.appendChild(o);
      });
    }
    const vals = { cfTitle:'title', cfSub:'sub', cfFlag:'flag', cfFont:'font', cfTitleColor:'titleColor', cfBg1:'bg1', cfBg2:'bg2', cfRing1:'ring1', cfRing2:'ring2' };
    const nums = { cfRingW:'ringW', cfPhotoR:'photoR' };
    Object.keys(nums).forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = cf[nums[id]];
      const h = () => { cf[nums[id]] = parseFloat(el.value); redraw(); };
      el.oninput = h; el.onchange = h;
    });
    Object.keys(vals).forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = cf[vals[id]];
      const h = () => { cf[vals[id]] = el.value; redraw(); };
      el.oninput = h; el.onchange = h;
    });
    const pickBtn = document.getElementById('cfFlagPick');
    const pickFile = document.getElementById('cfFlagFile');
    if (pickBtn && pickFile) {
      pickBtn.onclick = () => pickFile.click();
      pickFile.onchange = () => {
        const fl = pickFile.files && pickFile.files[0];
        if (!fl) return;
        const rd = new FileReader();
        rd.onload = () => {
          const im = new Image();
          im.onload = () => { state.customImgEl = im; cf.flag = 'image'; const sel = document.getElementById('cfFlag'); if (sel) sel.value = 'image'; redraw(); };
          im.src = rd.result;
        };
        rd.readAsDataURL(fl);
      };
    }
  }

  document.querySelectorAll('.shapebtn').forEach(b => {
    b.onclick = () => {
      state.shape = b.dataset.sh;
      document.querySelectorAll('.shapebtn').forEach(x => x.classList.toggle('on', x === b));
      redraw();
    };
  });

  document.getElementById('customText').oninput = e => { state.customText = e.target.value; redraw(); };
  document.getElementById('textFont').onchange = e => { state.textFont = e.target.value; redraw(); };
  document.getElementById('textColor').oninput = e => { state.textColor = e.target.value; redraw(); };
  document.getElementById('textSize').oninput = e => { state.textSize = +e.target.value; redraw(); };
  document.querySelectorAll('.posbtn[data-p]').forEach(b => {
    b.onclick = () => {
      state.textPos = b.dataset.p;
      document.querySelectorAll('.posbtn[data-p]').forEach(x => x.classList.toggle('on', x === b));
      redraw();
    };
  });

  document.getElementById('saveBtn').onclick = () => exportImage(false);
  document.getElementById('shareBtn').onclick = () => exportImage(true);
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

async function exportImage(share) {
  const c = document.createElement('canvas');
  c.width = c.height = 1080;
  const ctx = c.getContext('2d');
  renderScene(ctx, 1080, state.frame);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const fname = `picLib-${state.frame.id}-${Date.now()}.png`;

  try {
    const cap = window.Capacitor;
    if (cap && cap.Plugins && cap.Plugins.Filesystem) {
      const { Filesystem, Share } = cap.Plugins;
      const reader = await new Promise(r => {
        const fr = new FileReader();
        fr.onload = () => r(fr.result.split(',')[1]);
        fr.readAsDataURL(blob);
      });
      const res = await Filesystem.writeFile({ path: fname, data: reader, directory: 'CACHE' });
      if (share && Share && Share.share) {
        await Share.share({ title: 'picLib', files: [res.uri] });
        toast('تم فتح المشاركة ✓');
        return;
      }
      const Media = cap.Plugins.Media;
      if (!share && Media && Media.savePhoto) {
        if (!window._piclibAlbum) {
          try {
            await Media.savePhoto({ path: res.uri, albumIdentifier: '/storage/emulated/0/Pictures/picLib', fileName: 'probe' });
            window._piclibAlbum = '/storage/emulated/0/Pictures/picLib';
          } catch (e) {
            window._piclibAlbum = '/storage/emulated/0/Pictures';
          }
        }
        const saved = await Media.savePhoto({ path: res.uri, albumIdentifier: window._piclibAlbum, fileName: fname.replace('.png','') });
        toast('تم الحفظ في المعرض ✓');
        return;
      }
      if (Share && Share.share) {
        await Share.share({ title: 'picLib', files: [res.uri], dialogTitle: 'حفظ الصورة' });
        toast('احفظ الصورة من قائمة المشاركة ✓');
        return;
      }
      return;
    }
  } catch (e) { console.warn(e); }

  try {
    if (share && navigator.canShare && navigator.canShare({ files: [new File([blob], fname, { type: 'image/png' })] })) {
      await navigator.share({ files: [new File([blob], fname, { type: 'image/png' })] });
      return;
    }
  } catch (e) { console.warn(e); }

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  toast(share ? 'تم تنزيل الصورة ✓' : 'تم حفظ الصورة ✓');
}

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {

});

const THEMES = {
  green:  { acc:'#2fbf8f', acc2:'#14614a', dark:'#0d3b2e', deep:'#04241a', line:'#1c4d3c', mut:'#9db8ac' },
  blue:   { acc:'#38a5f8', acc2:'#155a99', dark:'#0d2a4a', deep:'#04182c', line:'#1c3f63', mut:'#9db4c8' },
  purple: { acc:'#a579f5', acc2:'#5b3a99', dark:'#2a1650', deep:'#160a2c', line:'#3f2a63', mut:'#b8a9d4' },
  red:    { acc:'#f5625e', acc2:'#992b28', dark:'#4a0d0d', deep:'#2c0404', line:'#631c1c', mut:'#d4a9a9' },
  gold:   { acc:'#e8c55a', acc2:'#8a6d1d', dark:'#3a2c08', deep:'#241a04', line:'#574614', mut:'#c8b891' },
};
function applyTheme(name) {
  const th = THEMES[name] || THEMES.green;
  const r = document.documentElement.style;
  r.setProperty('--acc', th.acc);
  r.setProperty('--acc2', th.acc2);
  r.setProperty('--acc-dark', th.dark);
  r.setProperty('--acc-deep', th.deep);
  r.setProperty('--line', th.line);
  r.setProperty('--mut', th.mut);
  localStorage.setItem('piclib_theme', name);
}

applyTheme(localStorage.getItem('piclib_theme') || 'green');


function currentLang() { return localStorage.getItem('piclib_lang') || 'ar'; }
function translateDom() {
  const lang = currentLang();
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  if (lang === 'ar') { restoreOriginalTexts(); return; }
  const dict = I18N[lang] || {};
  document.querySelectorAll('body *').forEach(el => {
    el.childNodes.forEach(n => {
      if (n.nodeType !== 3) return;
      const key = n.textContent.trim();
      if (!key) return;
      if (!el.dataset) return;
      const origKey = 'i18norig' + (n === el.firstChild ? '0' : 'x');
      if (dict[key]) {
        if (!n._orig) n._orig = key;
        n.textContent = n.textContent.replace(key, dict[key]);
      }
    });
    if (el.placeholder && dict[el.placeholder.trim()]) {
      if (!el._phorig) el._phorig = el.placeholder;
      el.placeholder = dict[el._phorig] || el.placeholder;
    }
    if (el.tagName === 'OPTION' && dict[el.textContent.trim()]) {
      if (!el._oporig) el._oporig = el.textContent;
      el.textContent = dict[el._oporig.trim()] || el.textContent;
    }
  });
}
function restoreOriginalTexts() {
  document.querySelectorAll('[placeholder]').forEach(el => { if (el._phorig) el.placeholder = el._phorig; });
}


new MutationObserver(() => { translateDom(); }).observe(document.getElementById('app') || document.body, { childList: true, subtree: true });
window.addEventListener('DOMContentLoaded', () => setTimeout(translateDom, 300));
setTimeout(translateDom, 800);

/* ---------- boot ---------- */

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state.step === 3) redraw(); });
setStep(1);
