<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d3b2e">
<title>picLib — إطارات الصور</title>
<link rel="manifest" href="manifest.json">
<style>
@font-face { font-family: 'Cairo'; src: url('fonts/cairo.ttf'); font-weight: 100 900; }
@font-face { font-family: 'Amiri'; src: url('fonts/amiri.ttf'); }
@font-face { font-family: 'Tajawal'; src: url('fonts/tajawal.ttf'); font-weight: 700; }
@font-face { font-family: 'Lateef'; src: url('fonts/lateef.ttf'); }
@font-face { font-family: 'Scheherazade'; src: url('fonts/scheherazade.ttf'); }
@font-face { font-family: 'Ruqaa'; src: url('fonts/ruqaa.ttf'); }
@font-face { font-family: 'Geeza'; src: url('fonts/geeza-pro.ttf'); }
@font-face { font-family: 'Simplified'; src: url('fonts/simplified-arabic.ttf'); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  font-family: 'Cairo', 'Tajawal', sans-serif;
  background: #07100d;
  color: #f0f4f1;
  user-select: none;
}
#app { display: flex; flex-direction: column; height: 100%; }
header {
  background: linear-gradient(135deg, #0d3b2e, #14614a);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,.4);
  z-index: 5;
}
header .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; }
header .logo img { width: 30px; height: 30px; border-radius: 8px; }
header .spacer { flex: 1; }
.iconbtn {
  background: rgba(255,255,255,.12); border: none; color: #fff;
  width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.iconbtn:active { transform: scale(.92); }
.steps {
  display: flex; direction: rtl; background: #0d3b2e;
  padding: 8px 10px 12px; gap: 4px;
}
.step { flex: 1; text-align: center; font-size: 12.5px; color: #9db8ac; position: relative; padding-top: 4px; }
.step .n {
  display: inline-flex; width: 22px; height: 22px; border-radius: 50%;
  background: #1c4d3c; color: #cfe5d9; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; margin-inline-start: 4px;
}
.step.active { color: #fff; font-weight: 700; }
.step.active .n { background: #2fbf8f; color: #04241a; }
.step.done .n { background: #2fbf8f; color: #04241a; }
.step::after {
  content: ''; position: absolute; bottom: -6px; right: 0; left: 0; height: 2.5px;
  background: #1c4d3c; border-radius: 2px;
}
.step.active::after, .step.done::after { background: #2fbf8f; }
main { flex: 1; overflow-y: auto; padding: 14px; }
h1.title { font-size: 21px; margin: 4px 0 2px; font-weight: 800; }
p.sub { color: #9db8ac; font-size: 13.5px; margin: 0 0 14px; }
.frames-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 20px; }
.frame-card {
  background: #101c17; border-radius: 16px; overflow: hidden; cursor: pointer;
  border: 2px solid transparent; transition: border-color .15s, transform .1s;
}
.frame-card:active { transform: scale(.97); }
.frame-card.selected { border-color: #2fbf8f; }
.frame-card canvas { width: 100%; display: block; aspect-ratio: 1; }
.frame-card .fname { padding: 8px 10px; font-size: 13.5px; font-weight: 700; text-align: center; }
.dropzone {
  border: 2.5px dashed #2fbf8f66; border-radius: 20px; margin-top: 8px;
  min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; cursor: pointer; padding: 30px 16px; text-align: center;
}
.dropzone .cam { width: 76px; height: 76px; border-radius: 50%; background: #123c2f;
  display: flex; align-items: center; justify-content: center; font-size: 34px; }
.dropzone h2 { margin: 0; font-size: 18px; }
.dropzone p { margin: 0; color: #9db8ac; font-size: 13px; line-height: 1.7; }
.selected-frame-bar {
  display: flex; align-items: center; gap: 10px; background: #101c17;
  border-radius: 14px; padding: 10px; margin-bottom: 12px;
}
.selected-frame-bar canvas { width: 56px; height: 56px; border-radius: 10px; }
.selected-frame-bar .lbl { font-size: 11.5px; color: #9db8ac; }
.selected-frame-bar .nm { font-weight: 700; font-size: 14.5px; }
.selected-frame-bar .chg { margin-inline-start: auto; color: #2fbf8f; font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px; }
.editor-wrap { display: flex; flex-direction: column; height: 100%; }
#preview-holder {
  position: relative; border-radius: 18px; overflow: hidden; background: #101c17;
  margin-bottom: 10px; touch-action: none; flex-shrink: 0; aspect-ratio: 1;
}
#preview { width: 100%; display: block; touch-action: none; }
.hint { text-align: center; color: #9db8ac; font-size: 12.5px; margin: 2px 0 8px; }
.zoomrow { display: flex; align-items: center; gap: 12px; padding: 0 8px; margin-bottom: 10px; }
.zoomrow input[type=range] { flex: 1; accent-color: #2fbf8f; height: 34px; }
.zoomrow .zbtn { font-size: 22px; color: #fff; background: none; border: none; cursor: pointer; padding: 4px 8px; }
.toolrow { display: flex; gap: 8px; margin-bottom: 10px; }
.tool {
  flex: 1; background: #101c17; border: none; color: #fff; border-radius: 12px;
  padding: 10px 4px; font-size: 12.5px; font-family: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.tool .ti { font-size: 17px; }
.tool:active { transform: scale(.96); }
.txteditor { background: #101c17; border-radius: 14px; padding: 10px; margin-bottom: 10px; }
.txteditor input[type=text] {
  width: 100%; background: #07100d; border: 1px solid #1c4d3c; color: #fff;
  border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; margin-bottom: 8px;
}
.txtrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.txtrow select, .txtrow input[type=color] {
  background: #07100d; border: 1px solid #1c4d3c; color: #fff; border-radius: 10px;
  padding: 8px; font-family: inherit; font-size: 13px;
}
.txtrow input[type=color] { width: 44px; height: 38px; padding: 2px; }
.txtrow input[type=range] { flex: 1; min-width: 80px; accent-color: #2fbf8f; }
.posbtns { display: flex; gap: 6px; margin-top: 8px; }
.posbtn {
  flex: 1; background: #07100d; border: 1px solid #1c4d3c; color: #cfe5d9;
  border-radius: 8px; padding: 6px 2px; font-size: 11.5px; cursor: pointer; font-family: inherit;
}
.posbtn.on { background: #2fbf8f; color: #04241a; border-color: #2fbf8f; font-weight: 700; }
.savebtn {
  width: 100%; background: linear-gradient(135deg, #2fbf8f, #1d8f68); border: none; color: #04241a;
  font-size: 18px; font-weight: 800; font-family: inherit; padding: 15px; border-radius: 14px;
  cursor: pointer; margin-top: auto; margin-bottom: 8px;
}
.savebtn:active { transform: scale(.98); }
.sharebtn {
  width: 100%; background: #101c17; border: 1px solid #2fbf8f; color: #2fbf8f;
  font-size: 15px; font-weight: 700; font-family: inherit; padding: 12px; border-radius: 14px;
  cursor: pointer; margin-bottom: 14px;
}
.hidden { display: none !important; }
.note { display: flex; gap: 8px; align-items: flex-start; color: #9db8ac; font-size: 12px; line-height: 1.7; margin: 6px 2px 14px; }
.backrow { display: flex; gap: 8px; margin-bottom: 10px; }
.backbtn {
  background: #101c17; border: 1px solid #1c4d3c; color: #cfe5d9; border-radius: 12px;
  padding: 8px 16px; font-size: 13px; font-family: inherit; cursor: pointer;
}
.toast {
  position: fixed; bottom: 90px; right: 50%; transform: translateX(50%);
  background: #2fbf8f; color: #04241a; font-weight: 700; padding: 10px 22px;
  border-radius: 24px; font-size: 14px; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,.4);
  animation: fadein .2s;
}
@keyframes fadein { from { opacity: 0; transform: translateX(50%) translateY(8px); } }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn hidden" id="backBtn">→</button>
    <div class="logo"><img src="icon-192.png" alt=""> picLib</div>
    <div class="spacer"></div>
    <button class="iconbtn" id="darkBtn" title="الوضع الليلي">🌙</button>
  </header>
  <div class="steps">
    <div class="step" data-s="1"><span class="n">1</span> اختر الإطار</div>
    <div class="step" data-s="2"><span class="n">2</span> اختر صورتك</div>
    <div class="step" data-s="3"><span class="n">3</span> اضبط واحفظ</div>
  </div>
  <main id="main"></main>
</div>
<input type="file" id="fileInput" accept="image/*" class="hidden">
<script>
const FRAMES = [
  { id:'liberation', name:'عيد التحرير السوري', title:'اليوم الوطني السوري', sub:'8 Dec · Syrian National Day', sub2:'عيد التحرير',
    bg:['#0d3b2e','#1a7a54'], ring:['#ffffff','#0a5c3f','#111111'], accent:'#d3382c', stars:true, decor:['⭐'], font:'Cairo', titleColor:'#ffffff' },
  { id:'independence', name:'عيد الجلاء', title:'عيد الجلاء السوري', sub:'17 نيسان · Syrian Independence Day', sub2:'',
    bg:['#0d3b2e','#123f31'], ring:['#ffffff','#ce1126','#111111'], accent:'#d3382c', stars:true, decor:['⭐'], font:'Cairo', titleColor:'#ffffff' },
  { id:'ramadan', name:'رمضان كريم', title:'رمضان كريم', sub:'Ramadan Kareem', sub2:'',
    bg:['#1c1038','#3c2566'], ring:['#f5e6c8','#c9a227','#2a1650'], accent:'#e8c55a', stars:false, decor:['🌙','🏮'], font:'Amiri', titleColor:'#f5e6c8' },
  { id:'fitr', name:'عيد الفطر', title:'عيد فطر سعيد', sub:'Eid al-Fitr Mubarak', sub2:'',
    bg:['#083d3a','#0e6b62'], ring:['#fff8e7','#c9a227','#0a4a44'], accent:'#e8c55a', stars:false, decor:['🌙','✨'], font:'Amiri', titleColor:'#fff8e7' },
  { id:'adha', name:'عيد الأضحى', title:'عيد أضحى مبارك', sub:'Eid al-Adha Mubarak', sub2:'',
    bg:['#3a2415','#6b4423'], ring:['#fdf3e0','#c9a227','#4a2f18'], accent:'#e8c55a', stars:false, decor:['🕌','✨'], font:'Amiri', titleColor:'#fdf3e0' },
  { id:'newyear', name:'رأس السنة', title:'سنة جديدة سعيدة', sub:'Happy New Year', sub2:'',
    bg:['#0a1030','#1c2a6b'], ring:['#ffffff','#e8c55a','#0a1030'], accent:'#e8c55a', stars:false, decor:['🎆','✨'], font:'Tajawal', titleColor:'#ffffff' },
  { id:'birthday', name:'عيد ميلاد', title:'عيد ميلاد سعيد', sub:'Happy Birthday', sub2:'',
    bg:['#3d0a24','#7a1a4a'], ring:['#ffffff','#ff5e8a','#5c1038'], accent:'#ffd166', stars:false, decor:['🎈','🎂'], font:'Tajawal', titleColor:'#ffffff' },
  { id:'graduation', name:'تخرج', title:'مبروك التخرج', sub:'Congratulations Graduate', sub2:'',
    bg:['#101a3d','#24366e'], ring:['#ffffff','#c9a227','#101a3d'], accent:'#e8c55a', stars:false, decor:['🎓','✨'], font:'Cairo', titleColor:'#ffffff' },
  { id:'wedding', name:'زواج', title:'مبروك الزواج', sub:'Congratulations', sub2:'',
    bg:['#3d1220','#7a2a44'], ring:['#fff5ee','#d4a0a0','#5c1c30'], accent:'#f0c0c0', stars:false, decor:['💍','🤍'], font:'Ruqaa', titleColor:'#fff5ee' },
  { id:'elegant', name:'إطار أنيق', title:'', sub:'', sub2:'',
    bg:['#141414','#2e2e2e'], ring:['#f5f5f5','#c9a227','#141414'], accent:'#c9a227', stars:false, decor:['✨'], font:'Cairo', titleColor:'#ffffff' },
];

const FONTS = [
  { id:'Cairo', label:'القاهرة — Cairo' },
  { id:'Amiri', label:'أميري — Amiri' },
  { id:'Tajawal', label:'تجوال — Tajawal' },
  { id:'Lateef', label:'لطيف — Lateef' },
  { id:'Scheherazade', label:'شهرزاد — Scheherazade' },
  { id:'Ruqaa', label:'رقعة — Ruqaa' },
  { id:'Geeza', label:'جيزة — Geeza' },
  { id:'Simplified', label:'مبسط — Simplified' },
];

const main = document.getElementById('main');
const state = {
  step: 1,
  frame: null,
  img: null,
  zoom: 1, tx: 0, ty: 0, rot: 0, flipX: false,
  customText: '', textFont: 'Cairo', textColor: '#ffffff', textSize: 52, textPos: 'bottom',
  editing: false,
};

function setStep(n) {
  state.step = n;
  document.querySelectorAll('.step').forEach(el => {
    const s = +el.dataset.s;
    el.classList.toggle('active', s === n);
    el.classList.toggle('done', s < n);
  });
  document.getElementById('backBtn').classList.toggle('hidden', n === 1);
  render();
}

document.getElementById('backBtn').onclick = () => { if (state.step > 1) setStep(state.step - 1); };

function patternBg(ctx, S, f) {
  const g = ctx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, f.bg[0]); g.addColorStop(1, f.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = S * 0.004;
  const st = S / 7;
  for (let x = -S; x < S * 2; x += st) {
    for (let y = -S; y < S * 2; y += st) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(Math.PI / 4);
      ctx.strokeRect(-st/2.6, -st/2.6, st/1.3, st/1.3);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawPhotoInCircle(ctx, S, R, cx, cy) {
  if (!state.img) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    if (sampleImg.complete && sampleImg.naturalWidth) {
      const sc = Math.max((R * 2) / sampleImg.naturalWidth, (R * 2) / sampleImg.naturalHeight);
      ctx.globalAlpha = 0.55;
      ctx.drawImage(sampleImg, cx - sampleImg.naturalWidth * sc / 2, cy - sampleImg.naturalHeight * sc / 2, sampleImg.naturalWidth * sc, sampleImg.naturalHeight * sc);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = `${R * 0.5}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🖼️', cx, cy);
    }
    ctx.restore();
    return;
  }
  const img = state.img;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  const base = Math.max((R * 2) / img.width, (R * 2) / img.height);
  const sc = base * state.zoom;
  ctx.translate(cx + state.tx * S / 1000, cy + state.ty * S / 1000);
  ctx.rotate(state.rot);
  ctx.scale(state.flipX ? -sc : sc, sc);
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
}

function drawRing(ctx, S, R, cx, cy, f) {
  const lw = S * 0.023;
  ctx.save();
  ctx.lineWidth = lw * 1.6;
  ctx.strokeStyle = f.ring[2];
  ctx.beginPath(); ctx.arc(cx, cy, R + lw * 1.1, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = lw;
  ctx.strokeStyle = f.ring[0];
  ctx.beginPath(); ctx.arc(cx, cy, R + lw * 0.55, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = lw * 0.75;
  ctx.strokeStyle = f.ring[1];
  ctx.beginPath(); ctx.arc(cx, cy, R + lw * 0.05, 0, Math.PI * 2); ctx.stroke();
  if (f.stars) {
    ctx.fillStyle = f.accent;
    [Math.PI * 1.5, Math.PI * 0.15, Math.PI * 0.85].forEach(a => {
      const x = cx + Math.cos(a) * (R + lw * 0.55);
      const y = cy + Math.sin(a) * (R + lw * 0.55);
      drawStar(ctx, x, y, lw * 0.85, f.accent);
    });
  }
  ctx.restore();
}

function drawStar(ctx, x, y, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * 4 * Math.PI / 5;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawDecor(ctx, S, R, cx, cy, f) {
  if (!f.decor || !f.decor.length) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const rr = R + S * 0.045;
  f.decor.forEach((d, i) => {
    const a = Math.PI * 0.5 + (i - (f.decor.length - 1) / 2) * 0.5;
    ctx.font = `${S * 0.055}px serif`;
    ctx.fillText(d, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr + S * 0.03);
  });
  ctx.restore();
}

function arText(ctx, text, x, y, size, font, color, weight) {
  ctx.save();
  ctx.font = `${weight || 800} ${size}px "${font}", serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = size * 0.15; ctx.shadowOffsetY = size * 0.04;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawFrameText(ctx, S, R, cx, cy, f) {
  if (!f.title) return;
  const fs = S * 0.062;
  const y = cy + R * 0.52;
  arText(ctx, f.title, cx, y, fs, f.font, f.titleColor);
  if (f.sub) {
    ctx.save();
    ctx.font = `700 ${S * 0.032}px "Cairo", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('\u200e' + f.sub + '\u200e', cx, y + fs * 0.95);
    ctx.restore();
  }
  if (f.sub2) {
    ctx.save();
    ctx.font = `700 ${S * 0.034}px "Cairo", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(f.sub2, cx, y + fs * 1.7);
    ctx.restore();
  }
}

function drawCustomText(ctx, S, R, cx, cy) {
  if (!state.customText.trim()) return;
  const size = state.textSize * S / 1080;
  let y;
  if (state.textPos === 'bottom') y = cy + R + S * 0.085;
  else if (state.textPos === 'top') y = cy - R - S * 0.06;
  else y = cy + R * 0.80;
  arText(ctx, state.customText, cx, y, size, state.textFont, state.textColor);
}

function renderScene(ctx, S, f) {
  patternBg(ctx, S, f);
  const cx = S / 2, cy = S / 2, R = S * 0.34;
  drawPhotoInCircle(ctx, S, R, cx, cy);
  drawRing(ctx, S, R, cx, cy, f);
  drawDecor(ctx, S, R, cx, cy, f);
  drawFrameText(ctx, S, R, cx, cy, f);
  drawCustomText(ctx, S, R, cx, cy);
}

function frameThumb(f, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size || 240;
  const ctx = c.getContext('2d');
  const imgBak = state.img;
  const noPhoto = !imgBak;
  renderScene(ctx, c.width, f);
  return c;
}

/* ---------- Views ---------- */

function viewFrames() {
  main.innerHTML = `
    <h1 class="title">اختر الإطار</h1>
    <p class="sub">إطارات لمناسبات مختلفة — التحرير، الأعياد، رأس السنة، ميلاد، تخرج وزواج.</p>
    <div class="frames-grid" id="grid"></div>`;
  const grid = document.getElementById('grid');
  FRAMES.forEach(f => {
    const card = document.createElement('div');
    card.className = 'frame-card' + (state.frame && state.frame.id === f.id ? ' selected' : '');
    const th = frameThumb(f, 300);
    card.appendChild(th);
    const nm = document.createElement('div');
    nm.className = 'fname'; nm.textContent = f.name;
    card.appendChild(nm);
    card.onclick = () => { state.frame = f; setStep(2); };
    grid.appendChild(card);
  });
}

function viewPhoto() {
  main.innerHTML = `
    <div class="selected-frame-bar">
      <div id="sfthumb"></div>
      <div><div class="lbl">الإطار المختار</div><div class="nm">${state.frame.name}</div></div>
      <div class="chg" id="chgFrame">تغيير</div>
    </div>
    <h1 class="title">اختر صورتك</h1>
    <p class="sub">يفضل صورة واضحة يظهر فيها وجهك.</p>
    <div class="dropzone" id="dz">
      <div class="cam">📷</div>
      <h2>اختر صورة من جهازك</h2>
      <p>اضغط هنا لاختيار صورة من المعرض</p>
    </div>
    <button class="sharebtn" id="trySample" style="margin-top:12px">✨ جرّب بصورة المثال</button>
    <div class="note">🛡️ صورتك تبقى على جهازك فقط — لا يتم رفع أي صورة لأي مكان.</div>`;
  document.getElementById('sfthumb').appendChild(frameThumb(state.frame, 112));
  document.getElementById('chgFrame').onclick = () => setStep(1);
  document.getElementById('dz').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('trySample').onclick = () => {
    state.img = sampleImg;
    state.zoom = 1; state.tx = 0; state.ty = 0; state.rot = 0; state.flipX = false;
    setStep(3);
  };
}

function viewEditor() {
  main.innerHTML = `
    <div class="editor-wrap">
      <div id="preview-holder"><canvas id="preview" width="720" height="720"></canvas></div>
      <div class="hint">اسحب لتحريك الصورة، وقرّب بإصبعين أو بالشريط</div>
      <div class="zoomrow">
        <button class="zbtn" id="zout">−</button>
        <input type="range" id="zoom" min="1" max="4" step="0.01" value="${state.zoom}">
        <button class="zbtn" id="zin">+</button>
      </div>
      <div class="toolrow">
        <button class="tool" id="rotBtn"><span class="ti">↻</span>تدوير</button>
        <button class="tool" id="flipBtn"><span class="ti">⇋</span>قلب</button>
        <button class="tool" id="resetBtn"><span class="ti">⟲</span>إعادة ضبط</button>
        <button class="tool" id="otherBtn"><span class="ti">🖼️</span>صورة أخرى</button>
      </div>
      <div class="txteditor">
        <input type="text" id="customText" placeholder="✍️ أضف نصاً على الصورة (اختياري)…" value="${state.customText.replace(/"/g, '&quot;')}">
        <div class="txtrow">
          <select id="textFont">${FONTS.map(f => `<option value="${f.id}" ${f.id === state.textFont ? 'selected' : ''}>${f.label}</option>`).join('')}</select>
          <input type="color" id="textColor" value="${state.textColor}">
          <input type="range" id="textSize" min="24" max="130" value="${state.textSize}">
        </div>
        <div class="posbtns">
          <button class="posbtn ${state.textPos === 'top' ? 'on' : ''}" data-p="top">فوق الإطار</button>
          <button class="posbtn ${state.textPos === 'inside' ? 'on' : ''}" data-p="inside">داخل الصورة</button>
          <button class="posbtn ${state.textPos === 'bottom' ? 'on' : ''}" data-p="bottom">تحت الإطار</button>
        </div>
      </div>
      <button class="savebtn" id="saveBtn">حفظ الصورة 💾</button>
      <button class="sharebtn" id="shareBtn">مشاركة 📤</button>
    </div>`;
  setupEditor();
}

function render() {
  if (state.step === 1) viewFrames();
  else if (state.step === 2) viewPhoto();
  else viewEditor();
}

/* ---------- Editor logic ---------- */

let previewCtx, previewCanvas;

function redraw() {
  if (!previewCanvas) return;
  renderScene(previewCtx, previewCanvas.width, state.frame);
}

function setupEditor() {
  previewCanvas = document.getElementById('preview');
  previewCtx = previewCanvas.getContext('2d');
  const holder = document.getElementById('preview-holder');
  redraw();

  let dragging = false, lastX = 0, lastY = 0;
  let pinchD = 0, pinchZ = 1;
  const pts = new Map();

  previewCanvas.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { dragging = true; lastX = e.clientX; lastY = e.clientY; }
    if (pts.size === 2) {
      const p = [...pts.values()];
      pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      pinchZ = state.zoom;
      dragging = false;
    }
    previewCanvas.setPointerCapture(e.pointerId);
  });
  previewCanvas.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const p = [...pts.values()];
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      state.zoom = Math.min(4, Math.max(1, pinchZ * d / (pinchD || 1)));
      document.getElementById('zoom').value = state.zoom;
      redraw();
      return;
    }
    if (!dragging) return;
    const scale = 1000 / previewCanvas.clientWidth;
    state.tx += (e.clientX - lastX) * scale / 1.5;
    state.ty += (e.clientY - lastY) * scale / 1.5;
    lastX = e.clientX; lastY = e.clientY;
    redraw();
  });
  const up = e => { pts.delete(e.pointerId); if (!pts.size) dragging = false; };
  previewCanvas.addEventListener('pointerup', up);
  previewCanvas.addEventListener('pointercancel', up);

  document.getElementById('zoom').oninput = e => { state.zoom = +e.target.value; redraw(); };
  document.getElementById('zin').onclick = () => { state.zoom = Math.min(4, state.zoom + 0.2); document.getElementById('zoom').value = state.zoom; redraw(); };
  document.getElementById('zout').onclick = () => { state.zoom = Math.max(1, state.zoom - 0.2); document.getElementById('zoom').value = state.zoom; redraw(); };
  document.getElementById('rotBtn').onclick = () => { state.rot += Math.PI / 2; redraw(); };
  document.getElementById('flipBtn').onclick = () => { state.flipX = !state.flipX; redraw(); };
  document.getElementById('resetBtn').onclick = () => {
    state.zoom = 1; state.tx = 0; state.ty = 0; state.rot = 0; state.flipX = false;
    document.getElementById('zoom').value = 1; redraw();
  };
  document.getElementById('otherBtn').onclick = () => document.getElementById('fileInput').click();

  document.getElementById('customText').oninput = e => { state.customText = e.target.value; redraw(); };
  document.getElementById('textFont').onchange = e => { state.textFont = e.target.value; redraw(); };
  document.getElementById('textColor').oninput = e => { state.textColor = e.target.value; redraw(); };
  document.getElementById('textSize').oninput = e => { state.textSize = +e.target.value; redraw(); };
  document.querySelectorAll('.posbtn').forEach(b => {
    b.onclick = () => {
      state.textPos = b.dataset.p;
      document.querySelectorAll('.posbtn').forEach(x => x.classList.toggle('on', x === b));
      redraw();
    };
  });

  document.getElementById('saveBtn').onclick = () => exportImage(false);
  document.getElementById('shareBtn').onclick = () => exportImage(true);
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

async function exportImage(share) {
  const c = document.createElement('canvas');
  c.width = c.height = 1080;
  const ctx = c.getContext('2d');
  renderScene(ctx, 1080, state.frame);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const fname = `picLib-${state.frame.id}-${Date.now()}.png`;

  try {
    const cap = window.Capacitor;
    if (cap && cap.Plugins && cap.Plugins.Filesystem) {
      const { Filesystem, Share } = cap.Plugins;
      const reader = await new Promise(r => {
        const fr = new FileReader();
        fr.onload = () => r(fr.result.split(',')[1]);
        fr.readAsDataURL(blob);
      });
      const res = await Filesystem.writeFile({ path: fname, data: reader, directory: 'CACHE' });
      if (share && Share && Share.share) {
        await Share.share({ title: 'picLib', files: [res.uri] });
        toast('تم فتح المشاركة ✓');
      } else if (Share && Share.share) {
        await Share.share({ title: 'picLib', files: [res.uri], dialogTitle: 'حفظ الصورة' });
        toast('احفظ الصورة من قائمة المشاركة ✓');
      }
      return;
    }
  } catch (e) { console.warn(e); }

  try {
    if (share && navigator.canShare && navigator.canShare({ files: [new File([blob], fname, { type: 'image/png' })] })) {
      await navigator.share({ files: [new File([blob], fname, { type: 'image/png' })] });
      return;
    }
  } catch (e) { console.warn(e); }

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  toast(share ? 'تم تنزيل الصورة ✓' : 'تم حفظ الصورة ✓');
}

/* ---------- Photo loading ---------- */

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      state.img = img;
      state.zoom = 1; state.tx = 0; state.ty = 0; state.rot = 0; state.flipX = false;
      setStep(3);
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
  e.target.value = '';
});

const sampleImg = new Image();
sampleImg.src = 'sample-photo.jpg';
sampleImg.onload = () => { if (state.step === 1) render(); };

if (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App) {
  Capacitor.Plugins.App.addListener('backButton', () => {
    if (state.step > 1) setStep(state.step - 1);
    else Capacitor.Plugins.App.minimizeApp();
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.step > 1) setStep(state.step - 1);
});

/* ---------- boot ---------- */

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state.step === 3) redraw(); });
setStep(1);
</script>
