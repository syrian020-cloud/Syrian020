<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f1f">
<title>Vidmap — عبارات المراكز الإدارية</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
  :root {
    --bg-primary: #070b18;
    --bg-secondary: rgba(255,255,255,0.055);
    --bg-tertiary: rgba(255,255,255,0.09);
    --card: rgba(19,24,46,0.72);
    --card-2: rgba(255,255,255,0.045);

    --text-secondary: #9d9cc0;
    --accent: #a78bfa;
    --accent-solid: #8b5cf6;
    --accent-2: #fb7185;
    --accent-hover: #7c3aed;
    --success: #22d3ee;
    --tag-fr: #8b5cf6;
    --tag-ar: #f43f5e;
    --tag-en: #22d3ee;
    --border: rgba(255,255,255,0.10);
    --radius: 26px;
    --radius-sm: 18px;
    --shadow: 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm: 0 10px 30px rgba(0,0,0,0.28);
    --glow: 0 0 28px rgba(139,92,246,0.25);
  }
  [data-theme="light"] {
    --bg-primary: #f2f1fb;
    --bg-secondary: rgba(255,255,255,0.85);
    --bg-tertiary: rgba(0,0,0,0.04);
    --card: rgba(255,255,255,0.78);
    --card-2: rgba(255,255,255,0.6);
    --text-primary: #1b1533;
    --text-secondary: #6b7280;
    --border: rgba(76,29,149,0.11);
    --shadow: 0 18px 50px rgba(80,50,160,0.13);

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans Arabic", "Noto Sans", sans-serif;
    letter-spacing: -0.01em;
    font-weight: 450;
    background-color: var(--bg-primary);
    background-image:

      radial-gradient(ellipse 55% 40% at 8% 15%, rgba(34,211,238,0.10), transparent 60%),

  }
  header { position: sticky; top: 0; z-index: 1100; background: rgba(7,11,24,0.72); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); border-bottom: 1px solid var(--border); }
  [data-theme="light"] header { background: rgba(255,255,255,0.72); }
  .header-inner { max-width: 1040px; margin: 0 auto; padding: 0.85rem 1.2rem; display: flex; align-items: center; gap: 0.6rem; }
  .logo { font-weight: 900; font-size: 1.32rem; white-space: nowrap; display: flex; align-items: center; gap: 0.4rem; letter-spacing: -0.03em; background: linear-gradient(135deg, #c4b5fd, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .spacer { flex: 1; }
  .icon-btn { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 14px; padding: 0.5rem 0.72rem; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 700; transition: transform .14s, border-color .15s, background .15s, box-shadow .15s; box-shadow: var(--shadow-sm); font-family: inherit; }
  .icon-btn:hover { border-color: var(--accent); background: var(--bg-tertiary); transform: translateY(-1px); box-shadow: var(--glow); }
  .icon-btn.on { background: linear-gradient(135deg, var(--accent-solid), var(--accent-hover)); color: #fff; border-color: transparent; }
  main { max-width: 1040px; margin: 0 auto; padding: 1.1rem; }

  .hero { background: linear-gradient(140deg, rgba(139,92,246,0.18), rgba(19,24,46,0.6) 45%, rgba(244,63,94,0.10)); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.9rem 1.5rem; margin-bottom: 1.1rem; position: relative; overflow: hidden; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow-sm); }
  [data-theme="light"] .hero { background: linear-gradient(140deg, rgba(139,92,246,0.14), rgba(255,255,255,0.7) 45%, rgba(34,211,238,0.08)); }
  .hero::before { content: ''; position: absolute; top:0; left:0; right:0; height: 3px; background: linear-gradient(90deg, var(--accent-solid), var(--accent-2), var(--success)); }
  .hero::after { content: ''; position: absolute; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%); top: -110px; inset-inline-end: -60px; filter: blur(10px); pointer-events: none; }
  .hero h1 { margin: 0 0 0.5rem; font-size: 1.5rem; position: relative; font-weight: 850; letter-spacing: -0.025em; }
  .hero p { margin: 0; color: var(--text-secondary); font-size: 0.97rem; position: relative; max-width: 720px; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 1.1rem; position: sticky; top: 60px; z-index: 900; background: var(--bg-primary); padding: 0.45rem 0; }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap input { width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 0.75rem 1rem 0.75rem 2.7rem; color: var(--text-primary); font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s, transform .15s; }
  [dir="ltr"] .search-wrap input, html[dir="ltr"] .search-wrap input { padding: 0.75rem 2.7rem 0.75rem 1rem; }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: var(--glow); transform: translateY(-1px); }
  .search-wrap .search-ic { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 0.95rem; opacity: 0.6; pointer-events: none; }
  .loop-group { display: inline-flex; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .loop-group button { background: transparent; border: none; color: var(--text-secondary); font-weight: 800; font-size: 0.85rem; padding: 0.62rem 0.78rem; cursor: pointer; font-family: inherit; transition: all .14s; }
  .loop-group button:hover { color: var(--text-primary); }
  .loop-group button.on { background: linear-gradient(135deg, var(--accent-solid), var(--accent-hover)); color: #fff; box-shadow: inset 0 0 14px rgba(255,255,255,0.14); }
  .stop-btn { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; color: var(--text-primary); font-weight: 800; font-size: 0.82rem; padding: 0.6rem 0.85rem; cursor: pointer; font-family: inherit; transition: all .14s; }
  .stop-btn:hover { border-color: var(--accent-2); color: var(--accent-2); transform: translateY(-1px); }

  .centre-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; max-height: 108px; overflow-y: auto; scrollbar-width: thin; }
  .centre-chip { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 0.5rem 1rem; font-size: 0.84rem; font-weight: 700; color: var(--text-secondary); cursor: pointer; transition: all .16s; font-family: inherit; }
  .centre-chip:hover { border-color: var(--accent); color: var(--text-primary); transform: translateY(-2px); box-shadow: var(--glow); }
  .centre-chip.on { background: linear-gradient(135deg, var(--accent-solid), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 6px 22px rgba(139,92,246,0.42); }

  .centre-head { margin-bottom: 1rem; padding: 0 0.2rem; }
  .centre-head h2 { margin: 0 0 0.25rem; font-size: 1.3rem; font-weight: 850; display: flex; align-items: center; gap: 0.55rem; letter-spacing: -0.02em; }
  .centre-head p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; }

  .centre-group { display: flex; align-items: center; gap: 0.5rem; font-weight: 850; font-size: 0.95rem; color: var(--accent); margin: 1.2rem 0 0.7rem; }
  .centre-group:first-child { margin-top: 0.2rem; }

  .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 0.85rem; overflow: hidden; box-shadow: var(--shadow-sm); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: border-color .2s, box-shadow .2s; }
  .section:hover { border-color: rgba(139,92,246,0.3); }
  .section-head { display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem 1.05rem; cursor: pointer; user-select: none; }
  .section-head .sec-icon { font-size: 1.2rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(34,211,238,0.14)); border: 1px solid var(--border); border-radius: 13px; flex-shrink: 0; }
  .section-head .sec-title { font-weight: 800; font-size: 0.99rem; flex: 1; min-width: 0; }
  .section-head .sec-count { color: var(--text-secondary); font-size: 0.74rem; font-weight: 700; white-space: nowrap; }
  .section-head .chev { transition: transform .25s; color: var(--text-secondary); font-size: 0.8rem; }
  .section.open .section-head .chev { transform: rotate(180deg); }
  .section.open { border-color: rgba(139,92,246,0.35); box-shadow: var(--glow); }
  .section-body { display: none; padding: 0 0.85rem 0.9rem; }
  .section.open .section-body { display: block; animation: fadeUp .28s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .phrase { background: var(--card-2); border: 1px solid var(--border); border-inline-start: 3px solid rgba(139,92,246,0.5); border-radius: 15px; padding: 0.75rem 0.9rem; margin-bottom: 0.55rem; display: flex; align-items: center; gap: 0.8rem; transition: transform .14s, border-color .14s, background .14s; }
  .phrase:hover { transform: translateX(-3px); border-color: rgba(139,92,246,0.4); background: var(--bg-tertiary); }
  [dir="ltr"] .phrase:hover { transform: translateX(3px); }
  .phrase:last-child { margin-bottom: 0; }
  .phrase.playing { border-color: var(--accent-solid); background: rgba(139,92,246,0.16); box-shadow: 0 0 0 2px rgba(139,92,246,0.4); }
  .phrase-lines { flex: 1; min-width: 0; }
  .pl .txt .w { cursor: pointer; border-radius: 5px; padding: 0 1px; transition: background .12s; }
  .pl .txt .w.looping { background: rgba(139,92,246,.32); color: var(--accent); }
  .pl { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.13rem 0; }
  .pl .tag { flex: none; font-size: 0.6rem; font-weight: 900; width: 1.5rem; height: 1.05rem; line-height: 1.05rem; text-align: center; border-radius: 5px; align-self: center; }
  .pl.fr .tag { background: rgba(139,92,246,0.22); color: #c4b5fd; }
  .pl.ar .tag { background: rgba(244,63,94,0.18); color: #fda4af; }
  .pl.en .tag { background: rgba(34,211,238,0.16); color: #67e8f9; }
  [data-theme="light"] .pl.fr .tag { color: #6d28d9; }
  [data-theme="light"] .pl.ar .tag { color: #be123c; }
  [data-theme="light"] .pl.en .tag { color: #0e7490; }
  .pl .txt { font-size: 0.9rem; }
  .pl.fr .txt { font-weight: 800; font-size: 0.97rem; color: var(--text-primary); }
  .pl.ar .txt { font-weight: 700; }
  .pl.en .txt { color: var(--text-secondary); font-size: 0.85rem; }
  .flags { display: flex; flex-direction: column; gap: 0.32rem; flex: none; }
  .flag-btn, .sec-play { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-secondary); font-size: 1.15rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; line-height: 1; }
  .flag-btn:hover, .sec-play:hover { border-color: var(--accent); transform: translateY(-1px) scale(1.04); box-shadow: var(--glow); }
  .sec-play { width: 36px; height: 36px; font-size: 0.95rem; flex-shrink: 0; border-radius: 12px; }
  .flag-btn.speaking, .sec-play.speaking { background: linear-gradient(135deg, var(--accent-solid), var(--accent-hover)); border-color: transparent; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.55);} 50% { box-shadow: 0 0 0 9px rgba(139,92,246,0);} }

  .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.85rem; }
  .home-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1.3rem 0.9rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; cursor: pointer; text-align: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow-sm); transition: transform .16s, border-color .16s, box-shadow .16s; font-family: inherit; color: inherit; }
  .home-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--glow); }
  .home-card .hc-icon { width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; border-radius: 18px; background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(34,211,238,0.15)); border: 1px solid var(--border); }
  .home-card .hc-name { font-weight: 800; font-size: 0.93rem; line-height: 1.35; }
  .home-card .hc-meta { color: var(--text-secondary); font-size: 0.72rem; font-weight: 700; }
  .back-btn { margin-bottom: 0.6rem; }
  @media (max-width: 520px) { .home-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 0.6rem; } .home-card { padding: 0.9rem 0.5rem 0.8rem; } .home-card .hc-icon { width: 48px; height: 48px; font-size: 1.5rem; } .home-card .hc-name { font-size: 0.8rem; } }

  .empty { text-align: center; color: var(--text-secondary); padding: 3rem 1rem; }
  footer { text-align: center; color: var(--text-secondary); font-size: 0.8rem; padding: 1.5rem 1rem; }
  footer a { color: var(--accent); text-decoration: none; font-weight: 700; }

  .toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: #18122b; color: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 0.55rem 1.1rem; font-size: 0.85rem; font-weight: 700; box-shadow: var(--shadow); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }

  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.35); border-radius: 99px; }

  @media (max-width: 520px) {
    .flag-btn { width: 38px; height: 38px; font-size: 1rem; }
    .hero { padding: 1.4rem 1.1rem; }
    .hero h1 { font-size: 1.2rem; }
    .toolbar { position: static; }
    .section-head .sec-count { display: none; }
  }
</style></style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo">🏛️ <span data-t="appName">Vidmap</span></span>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" title="Theme">🌙</button>
    <button class="icon-btn lang-btn" data-lang="ar">AR</button>
    <button class="icon-btn lang-btn" data-lang="en">EN</button>
    <button class="icon-btn lang-btn" data-lang="fr">FR</button>
  </div>
</header>
<main>
  <div class="hero">
    <h1 data-t="heroTitle">عبارات المراكز الإدارية في فرنسا</h1>
    <p data-t="heroDesc">حوارات وعبارات جاهزة لكل مركز إداري — اضغط على العلم لسماع العبارة بأي لغة.</p>
    <div class="stats">
      <span class="stat-pill">🏛️ <b id="statCentres">0</b> <span data-t="centres">مراكز</span></span>
      <span class="stat-pill">📚 <b id="statSections">0</b> <span data-t="sections">أقسام</span></span>
      <span class="stat-pill">💬 <b id="statPhrases">0</b> <span data-t="phrases">عبارة</span></span>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-ic">🔍</span>
      <input id="search" type="search" data-t-ph="searchPh" placeholder="ابحث في العبارات…">
    </div>
    <div class="loop-group" id="loopGroup">
      <button data-loop="1">×1</button>
      <button data-loop="3" class="on">×3</button>
      <button data-loop="5">×5</button>
      <button data-loop="0">∞</button>
    </div>
    <div class="loop-group" id="playLangGroup" title="لغة تشغيل القسم">
      <button data-playlang="fr">🇫🇷</button>
      <button data-playlang="ar">🇸🇾</button>
      <button data-playlang="en">🇺🇸</button>
      <button data-playlang="all" class="on">🌍</button>
    </div>
    <button class="stop-btn" id="stopBtn">🔇 <span data-t="stop">إيقاف</span></button>
  </div>

  <div class="centre-chips" id="centreChips"></div>
  <div id="home" class="home-grid"></div>
  <div class="centre-head" id="centreHead"></div>
  <div id="sections"></div>
  <div class="empty" id="empty" style="display:none" data-t="noResults">لا توجد نتائج</div>
</main>
<footer>
  <a href="french.html" data-t="backToFrench">← العودة إلى دروس الفرنسية</a> · <a href="vocab.html">Vocabulary / مفردات</a> · <span>Vidmap</span>
</footer>
<div class="toast" id="toast"></div>

<script src="data/centres.js"></script>
<script>
(function () {
  'use strict';

  var UI = {
    ar: {
      appName: 'Vidmap',
      heroTitle: 'عبارات المراكز الإدارية في فرنسا',
      heroDesc: 'حوارات وعبارات جاهزة لكل مركز إداري — اضغط على العلم لسماع العبارة بأي لغة.',
      centres: 'مراكز', sections: 'أقسام', phrases: 'عبارة',
      wordsFr: 'كلمة فرنسية', searchPh: 'ابحث في العبارات…', noResults: 'لا توجد نتائج', stop: 'إيقاف', home: 'الرئيسية',
      backToFrench: '← العودة إلى دروس الفرنسية'
    },
    en: {
      appName: 'Vidmap',
      heroTitle: 'Phrases for administrative centres in France',
      heroDesc: 'Ready-made dialogues for every administrative centre — tap a flag to hear the phrase in that language.',
      centres: 'centres', sections: 'sections', phrases: 'phrases',
      wordsFr: 'French words', searchPh: 'Search phrases…', noResults: 'No results', stop: 'Stop', home: 'Home',
      backToFrench: '← Back to French lessons'
    },
    fr: {
      appName: 'Vidmap',
      heroTitle: 'Phrases pour les centres administratifs en France',
      heroDesc: 'Dialogues prêts pour chaque centre administratif — touchez un drapeau pour entendre la phrase.',
      centres: 'centres', sections: 'sections', phrases: 'phrases',
      wordsFr: 'mots français', searchPh: 'Rechercher une phrase…', noResults: 'Aucun résultat', stop: 'Arrêter', home: 'Accueil',
      backToFrench: '← Retour aux cours de français'
    }
  };

  var LANG_LABEL = { fr: 'FR', ar: 'ع', en: 'EN' };
  var TTS_LANG = { fr: 'fr-FR', ar: 'ar-SA', en: 'en-US' };

  var state = {
    lang: localStorage.getItem('centres_lang') || 'ar',
    theme: localStorage.getItem('centres_theme') || 'dark',
    loop: parseInt(localStorage.getItem('centres_loop') || '3', 10),
    playlang: localStorage.getItem('centres_playlang') || 'all',
    centre: null,
    query: ''
  };

  function t(k) { return (UI[state.lang] && UI[state.lang][k]) || UI.ar[k] || k; }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function tside(obj) { return obj[state.lang] || obj.ar; }

  function applyLang() {
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-t-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-t-ph')); });
    document.documentElement.lang = state.lang;
    document.documentElement.dir = (state.lang === 'ar') ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function (b) {
      b.style.background = (b.dataset.lang === state.lang) ? 'linear-gradient(135deg,var(--accent),var(--accent-hover))' : '';
      b.style.color = (b.dataset.lang === state.lang) ? '#fff' : '';
    });
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme === 'light' ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = state.theme === 'light' ? '☀️' : '🌙';
  }

  /* ---------- TTS: Capacitor native on Android, speechSynthesis on web ---------- */
  var nativeTTS = (typeof window.Capacitor !== 'undefined' && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech);
  var speakSeq = 0;

  function stopSpeaking() {
    speakSeq++;
    if (nativeTTS && window.Capacitor.Plugins.TextToSpeech.stop) {
      try { window.Capacitor.Plugins.TextToSpeech.stop(); } catch (e) {}
    }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    document.querySelectorAll('.speaking').forEach(function (b) { b.classList.remove('speaking'); });
    document.querySelectorAll('.looping').forEach(function (b) { b.classList.remove('looping'); });
    document.querySelectorAll('.phrase.playing').forEach(function (b) { b.classList.remove('playing'); });
  }

  var cleanSpoken = function (t) {
    return t.replace(/^((?:أنا|أنت|إنت|أنتي|هو|هي|نحنا|هم|محمد|الموظف|المسؤول|الزبون|البائع|المدير)\s*عم\s*(?:نطق|يحكي|أحكي|احكي|نحكي|تحكي|يقول|أقول|اقول|تقول|نقول|قول|يتكلم|أتكلم|اتكلم|تتكلم|نتكلم)|عم\s*(?:نطق|يحكي|أحكي|احكي|نحكي|تحكي|يقول|أقول|اقول|تقول|نقول|قول|يتكلم|أتكلم|اتكلم|تتكلم|نتكلم)|Client|Vendeur|Customer|Seller|Missions|Duties|Moi|Manager|Responsable|Agent|Manipulateur|Technicien|Staff|Mohammad|الزبون|البائع|المهام|المسؤول|المدير|أنا|محمد|الموظف)\s*[:：]\s*/i, '')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '')
      .replace(/\s{2,}/g, ' ').trim();
  };

  function speakLoop(text, el, lang) {
    if (el.classList.contains('looping')) { stopSpeaking(); return; }
    stopSpeaking();
    el.classList.add('looping');
    var seq = speakSeq;
    var done = function () { if (seq === speakSeq) el.classList.remove('looping'); };
    text = cleanSpoken(text);
    if (!text) { done(); return; }
    if (nativeTTS) speakNative(text, lang || 'fr', 0, done);
    else speakWeb(text, lang || 'fr', 0, done);
  }

  function searchImages(text) {
    var url = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(text);
    window.open(url, '_blank');
  }

  function speakWeb(text, lang, times, done) {
    if (!window.speechSynthesis) { done(); return; }
    var n = 0;
    var seq = speakSeq;
    function once() {
      if ((times > 0 && n >= times) || seq !== speakSeq) { done(); return; }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = TTS_LANG[lang] || 'fr-FR';
      u.rate = lang === 'fr' ? 0.92 : 0.95;
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(TTS_LANG[lang].slice(0, 2).toLowerCase()) === 0) { u.voice = voices[i]; break; }
      }
      u.onend = function () { n++; once(); };
      u.onerror = function () { done(); };
      window.speechSynthesis.speak(u);
    }
    once();
  }

  function speakNative(text, lang, times, done) {
    var n = 0;
    var seq = speakSeq;
    function once() {
      if ((times > 0 && n >= times) || seq !== speakSeq) { done(); return; }
      window.Capacitor.Plugins.TextToSpeech.speak({
        text: text,
        lang: TTS_LANG[lang] || 'fr-FR',
        rate: lang === 'fr' ? 0.92 : 0.95,
        pitch: 1.0,
        volume: 1.0,
        category: 'ambient'
      }).then(function () { n++; once(); })
        .catch(function () { done(); });
    }
    once();
  }

  function speakSequence(items, btn) {
    if (btn.classList.contains('speaking')) { stopSpeaking(); return; }
    stopSpeaking();
    btn.classList.add('speaking');
    var seq = speakSeq;
    var done = function () { if (seq === speakSeq) btn.classList.remove('speaking'); };
    var idx = 0, li = 0, round = 0;
    var strip = cleanSpoken;
    var secEl = btn.closest('.section');
    if (secEl) secEl.classList.add('open');
    var phraseEls = secEl ? secEl.querySelectorAll('.section-body > .phrase') : [];
    function play() {
      if (seq !== speakSeq) { done(); return; }
      if (idx >= items.length) {
        round++;
        var rounds = state.loop === 0 ? Infinity : Math.max(1, state.loop);
        if (round >= rounds) { done(); return; }
        idx = 0; li = 0;
      }
      var langs = state.playlang === 'all' ? ['fr', 'ar', 'en'] : [state.playlang];
      var text = strip(items[idx][langs[li]]);
      if (li === 0 && phraseEls.length) {
        for (var pi = 0; pi < phraseEls.length; pi++) phraseEls[pi].classList.toggle('playing', pi === idx);
        if (phraseEls[idx]) phraseEls[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      var step = function () { li++; if (li >= langs.length) { li = 0; idx++; } play(); };
      if (nativeTTS) speakNative(text, langs[li], 1, step);
      else speakWeb(text, langs[li], 1, step);
    }
    play();
  }

  function speak(text, lang, btn) {
    if (btn.classList.contains('speaking')) { stopSpeaking(); return; }
    stopSpeaking();
    btn.classList.add('speaking');
    text = cleanSpoken(text);
    if (!text) { btn.classList.remove('speaking'); return; }
    var seq = speakSeq;
    var done = function () { if (seq === speakSeq) btn.classList.remove('speaking'); };
    if (nativeTTS) speakNative(text, lang, state.loop, done);
    else speakWeb(text, lang, state.loop, done);
  }

  /* ---------- rendering ---------- */
  function centreById(id) {
    return window.CENTRES_DATA.filter(function (c) { return c.id === id; })[0];
  }

  function renderChips() {
    var wrap = document.getElementById('centreChips');
    wrap.innerHTML = window.CENTRES_DATA.map(function (c) {
      return '<button class="centre-chip' + (c.id === state.centre ? ' on' : '') + '" data-id="' + c.id + '">' + c.icon + ' ' + esc(tside(c.name).split('—')[0].trim()) + '</button>';
    }).join('');
    wrap.querySelectorAll('.centre-chip').forEach(function (b) {
      b.onclick = function () { state.centre = b.dataset.id; stopSpeaking(); renderAll(); };
    });
  }

  function wordsHtml(s) {
    return esc(s).split(' ').map(function (w) { return '<span class="w">' + w + '</span>'; }).join(' ');
  }

  function phraseHtml(p) {
    return '<div class="phrase">' +
      '<div class="phrase-lines">' +
      '<div class="pl fr"><span class="tag">FR</span><span class="txt">' + wordsHtml(p.fr) + '</span></div>' +
      '<div class="pl ar"><span class="tag">ع</span><span class="txt">' + wordsHtml(p.ar) + '</span></div>' +
      '<div class="pl en"><span class="tag">EN</span><span class="txt">' + wordsHtml(p.en) + '</span></div>' +
      '</div>' +
      '<div class="flags">' +
      '<button class="flag-btn" data-lang="fr" title="FR">🇫🇷</button>' +
      '<button class="flag-btn" data-lang="ar" title="AR">🇸🇾</button>' +
      '<button class="flag-btn" data-lang="en" title="EN">🇺🇸</button>' +
      '</div></div>';
  }

  function renderHome() {
    var wrap = document.getElementById('home');
    wrap.innerHTML = window.CENTRES_DATA.map(function (c) {
      var nPh = c.sections.reduce(function (n, s) { return n + s.phrases.length; }, 0);
      return '<button class="home-card" data-id="' + c.id + '">' +
        '<span class="hc-icon">' + c.icon + '</span>' +
        '<span class="hc-name">' + esc(tside(c.name)) + '</span>' +
        '<span class="hc-meta">' + c.sections.length + ' ' + t('sections') + ' · ' + nPh + ' ' + t('phrases') + '</span></button>';
    }).join('');
    wrap.querySelectorAll('.home-card').forEach(function (b) {
      b.onclick = function () {
        state.centre = b.dataset.id;
        try { history.pushState({ centre: b.dataset.id }, ''); } catch (e) {}
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    });
  }

  function renderSections() {
    var c = centreById(state.centre);
    var wrap = document.getElementById('sections');
    var head = document.getElementById('centreHead');
    var q = state.query.trim().toLowerCase();
    if (!c && !q) { wrap.innerHTML = ''; head.innerHTML = ''; return; }

    head.innerHTML = c
      ? '<button class="icon-btn back-btn" id="backBtn">🏠 ' + t('home') + '</button><h2>' + c.icon + ' ' + esc(tside(c.name)) + '</h2><p>' + esc(tside(c.desc)) + '</p>'
      : '';
    var bb = document.getElementById('backBtn');
    if (bb) bb.onclick = function () { state.centre = null; state.query = ''; document.getElementById('search').value = ''; try { history.back(); } catch (e) {} renderAll(); };

    var visible = 0;
    var rendered = 0, capped = false;
    var playData = [];
    var list = q ? window.CENTRES_DATA : [c];
    wrap.innerHTML = list.map(function (cc) {
      var html = '';
      var centreHit = q && (cc.name.ar + ' ' + cc.name.en + ' ' + cc.name.fr + ' ' + cc.desc.ar + ' ' + cc.desc.en + ' ' + cc.desc.fr).toLowerCase().indexOf(q) >= 0;
      cc.sections.forEach(function (sec, si) {
        var secHit = q && (sec.title.ar + ' ' + sec.title.en + ' ' + sec.title.fr).toLowerCase().indexOf(q) >= 0;
        var phrases = sec.phrases.filter(function (p) {
          if (!q) return true;
          return centreHit || secHit || (p.fr + ' ' + p.ar + ' ' + p.en).toLowerCase().indexOf(q) >= 0;
        });
        visible += phrases.length;
        if (q && !phrases.length) return;
        if (q && rendered >= 250) { capped = true; return; }
        if (q && rendered + phrases.length > 250) { phrases = phrases.slice(0, 250 - rendered); capped = true; }
        rendered += phrases.length;
        var wordsFr = phrases.reduce(function (n, p) { return n + p.fr.trim().split(/\s+/).length; }, 0);
        playData.push(phrases.map(function (p) { return { fr: p.fr, ar: p.ar, en: p.en }; }));
        html += '<div class="section' + (q ? ' open' : '') + '">' +
          '<div class="section-head" data-sec="' + si + '"><button class="sec-play" data-play="' + (playData.length - 1) + '" title="Play all">▶️</button><span class="sec-icon">' + sec.icon + '</span>' +
          '<span class="sec-title">' + esc(tside(sec.title)) + '</span>' +
          '<span class="sec-count">' + phrases.length + ' ' + t('phrases') + ' · ' + wordsFr + ' ' + t('wordsFr') + '</span><span class="chev">▼</span></div>' +
          '<div class="section-body">' + phrases.map(phraseHtml).join('') + '</div></div>';
      });
      if (q && !html) return '';
      return (q ? '<div class="centre-group">' + cc.icon + ' ' + esc(tside(cc.name)) + '</div>' : '') + html;
    }).join('');

    document.getElementById('empty').style.display = (visible === 0) ? '' : 'none';
    if (q && capped) wrap.innerHTML += '<div class="centre-group">… ' + (visible - rendered) + ' ' + t('phrases') + '</div>';

    wrap.querySelectorAll('.section-head').forEach(function (h) {
      h.onclick = function () { h.parentElement.classList.toggle('open'); };
    });
    wrap.querySelectorAll('.sec-play').forEach(function (b) {
      b.onclick = function (ev) {
        ev.stopPropagation();
        speakSequence(playData[parseInt(b.dataset.play, 10)], b);
      };
    });
    wrap.querySelectorAll('.flags .flag-btn').forEach(function (b) {
      var p = findPhrase(b);
      b.onclick = function () { speak(p[b.dataset.lang], b.dataset.lang, b); };
    });
  }

  var wHoldT = null, wTaps = 0, wTapT = null, wHeld = false;
  function wordAt(e) {
    var w = e.target && e.target.closest ? e.target.closest('.w') : null;
    if (!w || !/[\p{L}\p{N}]/u.test(w.textContent)) return null;
    return w;
  }
  document.getElementById('sections').addEventListener('pointerdown', function (e) {
    var w = wordAt(e); if (!w) return;
    var pl = w.closest('.pl');
    var lang = pl.classList.contains('ar') ? 'ar' : (pl.classList.contains('en') ? 'en' : 'fr');
    wHeld = false;
    clearTimeout(wHoldT);
    wHoldT = setTimeout(function () { wHeld = true; speakLoop(w.textContent, w, lang); }, 520);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
    document.getElementById('sections').addEventListener(ev, function () { clearTimeout(wHoldT); });
  });
  document.getElementById('sections').addEventListener('click', function (e) {
    var w = wordAt(e); if (!w) return;
    if (wHeld) { wHeld = false; return; }
    wTaps++;
    if (wTaps === 1) { wTapT = setTimeout(function () { wTaps = 0; }, 380); }
    else { clearTimeout(wTapT); wTaps = 0; searchImages(w.textContent); }
  });

  function findPhrase(btn) {
    var phraseEl = btn.closest('.phrase');
    var lines = phraseEl.querySelectorAll('.pl');
    return {
      fr: lines[0].querySelector('.txt').textContent,
      ar: lines[1].querySelector('.txt').textContent,
      en: lines[2].querySelector('.txt').textContent
    };
  }

  function renderStats() {
    var centres = window.CENTRES_DATA.length;
    var sections = 0, phrases = 0;
    window.CENTRES_DATA.forEach(function (c) {
      sections += c.sections.length;
      c.sections.forEach(function (s) { phrases += s.phrases.length; });
    });
    document.getElementById('statCentres').textContent = centres;
    document.getElementById('statSections').textContent = sections;
    document.getElementById('statPhrases').textContent = phrases;
  }

  function renderAll() {
    applyLang();
    var q = state.query.trim();
    var inDetail = !!state.centre || !!q;
    document.getElementById('home').style.display = inDetail ? 'none' : '';
    document.getElementById('centreChips').style.display = 'none';
    if (!inDetail) renderHome();
    renderSections();
    renderStats();
  }

  window.addEventListener('popstate', function () {
    if (state.centre || state.query) {
      state.centre = null; state.query = '';
      var s = document.getElementById('search'); if (s) s.value = '';
      renderAll();
    }
  });

  /* ---------- wiring ---------- */
  document.querySelectorAll('.lang-btn').forEach(function (b) {
    b.onclick = function () { state.lang = b.dataset.lang; localStorage.setItem('centres_lang', state.lang); renderAll(); };
  });
  document.getElementById('themeBtn').onclick = function () {
    state.theme = (state.theme === 'light') ? 'dark' : 'light';
    localStorage.setItem('centres_theme', state.theme);
    applyTheme();
  };
  document.getElementById('playLangGroup').querySelectorAll('button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.playlang === state.playlang);
    b.onclick = function () {
      state.playlang = b.dataset.playlang;
      localStorage.setItem('centres_playlang', state.playlang);
      document.getElementById('playLangGroup').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    };
  });

  document.getElementById('loopGroup').querySelectorAll('button').forEach(function (b) {
    b.classList.toggle('on', parseInt(b.dataset.loop, 10) === state.loop);
    b.onclick = function () {
      state.loop = parseInt(b.dataset.loop, 10);
      localStorage.setItem('centres_loop', String(state.loop));
      document.getElementById('loopGroup').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    };
  });
  document.getElementById('stopBtn').onclick = stopSpeaking;
  var searchT = null;
  document.getElementById('search').oninput = function (e) {
    state.query = e.target.value;
    clearTimeout(searchT);
    searchT = setTimeout(renderAll, 300);
  };

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  applyTheme();
  renderAll();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
