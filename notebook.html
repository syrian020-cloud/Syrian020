  /* ---------- Import / Export ---------- */

  function saveVideoFile(file, callback) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var dataUrl = ev.target.result;
      if (file.size > 30 * 1024 * 1024) { callback(null, { message: t('videoTooLarge') }); return; }
      callback(dataUrl);
    };
    reader.onerror = function (err) { callback(null, err); };
    reader.readAsDataURL(file);
  }

  function exportNotebook() {
    var json = JSON.stringify(state.data, null, 2);
    var filename = 'notebook_' + new Date().toISOString().slice(0, 10) + '.json';
    var fs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem;
    var share = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
    if (share && share.canShare && fs) {
      share.canShare().then(function (can) {
        if (can.value) {
          return fs.writeFile({ path: 'notebook/share/' + filename, data: json, directory: 'CACHE', encoding: 'utf8', recursive: true })
            .then(function (res) { return share.share({ title: 'Vivid', files: [res.uri], dialogTitle: 'تصدير الأقسام' }); })
            .then(function () { alert(t('exportDoneFile') + '\n' + filename); });
        }
        return saveExportToDocuments(fs, json, filename);
      }).catch(function (err) { saveExportToDocuments(fs, json, filename); });
      return;
    }
    if (fs) { saveExportToDocuments(fs, json, filename); return; }
    fallbackExport(json, filename);
  }
  function saveExportToDocuments(fs, json, filename) {
    fs.writeFile({ path: 'notebook/' + filename, data: json, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true })
      .then(function () { alert(t('exportDoneFile') + '\n' + filename); })
      .catch(function (err) { alert(t('exportErrorFile') + (err && err.message ? ': ' + err.message : '')); });
  }
  function fallbackExport(json, filename) {
    downloadExport(json, filename);
    alert(t('exportDoneFile') + '\n' + filename);
  }
  function downloadExport(json, filename) {
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 3000);
  }

  // --- Drawing notebook ---
  function renderNotebookOverlay() {
    var wrap = document.getElementById('notebook-canvas-wrap');
    var phraseEl = document.getElementById('notebook-phrase-bg');
    var linesEl = document.getElementById('notebook-lines');
    if (!wrap || !phraseEl) return;
    var p = null;
    if (state.notebookSecId && state.notebookLesId && state.notebookIndex !== null) {
      var les = findLesson(state.notebookSecId, state.notebookLesId);
      p = les && les.phrases[state.notebookIndex];
    }
    phraseEl.innerHTML = p
      ? '<div class="fr">' + esc(p.fr || '') + '</div>' +
        '<div class="ar">' + esc(p.ar || '') + '</div>' +
        '<div class="en">' + esc(p.en || '') + '</div>'
      : '';
    phraseEl.style.setProperty('--notebook-scale', state.notebookScale);
    if (linesEl) linesEl.classList.toggle('hidden', !state.notebookGrid);
    phraseEl.classList.toggle('hidden', !state.notebookTextVisible);
    var txtBtn = document.getElementById('nb-toggle-text');
    if (txtBtn) {
      txtBtn.classList.toggle('active', state.notebookTextVisible);
      txtBtn.innerHTML = icon(state.notebookTextVisible ? 'eye' : 'eye-off');
    }
    document.querySelectorAll('#notebook-header-tools .nb-tool[data-tool]').forEach(function (b) { b.classList.toggle('active', b.dataset.tool === state.notebookTool); });
    document.querySelectorAll('#notebook-colors button').forEach(function (b) { b.classList.toggle('active', b.dataset.color === state.notebookColor); });
    document.querySelectorAll('#notebook-sizes button').forEach(function (b) { b.classList.toggle('active', parseFloat(b.dataset.size) === state.notebookScale); });
    updateNotebookSpeakIcon();
  }

  function saveNotebookHistory() {
    var canvas = document.getElementById('notebook-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    state.notebookHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (state.notebookHistory.length > 12) state.notebookHistory.shift();
  }

  function openNotebook(secId, lesId, idx) {
    stopSpeech();
    state.notebookSecId = secId;
    state.notebookLesId = lesId;
    state.notebookIndex = idx;
    state.notebookHistory = [];
    renderNotebookOverlay();
    document.getElementById('notebook-overlay').classList.remove('hidden');
    initNotebookCanvas();
    clearNotebookCanvas();
    requestAnimationFrame(saveNotebookHistory);
  }
  window.openNotebook = openNotebook;

  function closeNotebook() {
    stopSpeech();
    document.getElementById('notebook-overlay').classList.add('hidden');
    state.notebookSecId = null; state.notebookLesId = null; state.notebookIndex = null;
  }
  window.closeNotebook = closeNotebook;

  function toggleNotebookPalette() {
    state.notebookPalette = !state.notebookPalette;
    document.getElementById('notebook-palette').classList.toggle('hidden', !state.notebookPalette);
  }
  window.toggleNotebookPalette = toggleNotebookPalette;

  function toggleNotebookText() {
    state.notebookTextVisible = !state.notebookTextVisible;
    renderNotebookOverlay();
  }
  window.toggleNotebookText = toggleNotebookText;

  function setNotebookTool(tool) {
    state.notebookTool = tool;
    localStorage.setItem('nb_nb_tool', tool);
    renderNotebookOverlay();
  }
  window.setNotebookTool = setNotebookTool;

  function setNotebookColor(color) {
    state.notebookColor = color;
    state.notebookSelectedColor = color;
    localStorage.setItem('nb_nb_color', color);
    renderNotebookOverlay();
  }
  window.setNotebookColor = setNotebookColor;

  function setNotebookSize(size) {
    state.notebookScale = size;
    localStorage.setItem('nb_nb_scale', size);
    renderNotebookOverlay();
    state.notebookHistory = [];
    initNotebookCanvas();
    requestAnimationFrame(saveNotebookHistory);
  }
  window.setNotebookSize = setNotebookSize;

  function getCanvasPoint(e) {
    var canvas = document.getElementById('notebook-canvas');
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startNotebookDraw(e) {
    state.notebookDrawing = true;
    var p = getCanvasPoint(e);
    state.notebookLastX = p.x; state.notebookLastY = p.y;
    var canvas = document.getElementById('notebook-canvas');
    var ctx = canvas.getContext('2d');
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (state.notebookTool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = state.notebookColor;
    }
    var factor = { pencil: 1, brush: 2.5, eraser: 5 }[state.notebookTool] || 1;
    ctx.lineWidth = Math.max(2, 3 * state.notebookScale * factor);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    e.preventDefault();
  }

  function moveNotebookDraw(e) {
    if (!state.notebookDrawing) return;
    var p = getCanvasPoint(e);
    var canvas = document.getElementById('notebook-canvas');
    var ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(state.notebookLastX, state.notebookLastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    state.notebookLastX = p.x; state.notebookLastY = p.y;
    e.preventDefault();
  }

  function stopNotebookDraw(e) {
    if (!state.notebookDrawing) return;
    state.notebookDrawing = false;
    saveNotebookHistory();
    if (e && e.cancelable) e.preventDefault();
  }

  function clearNotebookCanvas() {
    var canvas = document.getElementById('notebook-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    saveNotebookHistory();
  }
  window.clearNotebookCanvas = clearNotebookCanvas;

  function undoNotebookCanvas() {
    var canvas = document.getElementById('notebook-canvas');
    if (!canvas || state.notebookHistory.length < 2) return;
    state.notebookHistory.pop();
    var data = state.notebookHistory[state.notebookHistory.length - 1];
    var ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'source-over';
    ctx.putImageData(data, 0, 0);
  }
  window.undoNotebookCanvas = undoNotebookCanvas;

  function toggleNotebookGrid() {
    state.notebookGrid = !state.notebookGrid;
    var linesEl = document.getElementById('notebook-lines');
    if (linesEl) linesEl.classList.toggle('hidden', !state.notebookGrid);
  }
  window.toggleNotebookGrid = toggleNotebookGrid;

  function initNotebookCanvas() {
    var canvas = document.getElementById('notebook-canvas');
    if (!canvas) return;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }

  function notebookLoopKey() {
    return state.notebookSecId && state.notebookLesId && state.notebookIndex !== null
      ? 'nb:' + state.notebookSecId + ':' + state.notebookLesId + ':' + state.notebookIndex
      : null;
  }
  function updateNotebookSpeakIcon() {
    var btn = document.getElementById('nb-speak');
    if (!btn) return;
    var key = notebookLoopKey();
    var on = state.loop && state.loop.key === key;
    btn.classList.toggle('active', on);
    btn.innerHTML = icon(on ? 'pause' : 'loop');
  }
  function notebookSpeakCurrent() {
    if (state.notebookSecId && state.notebookLesId && state.notebookIndex !== null) {
      var les = findLesson(state.notebookSecId, state.notebookLesId);
      var p = les && les.phrases[state.notebookIndex];
      if (p) {
        var key = notebookLoopKey();
        if (state.loop && state.loop.key === key) { stopSpeech(); return; }
        stopSpeech();
        state.loop = { key: key, word: false };
        updateNotebookSpeakIcon();
        (function cycle() {
          if (!state.loop || state.loop.key !== key) return;
          var seq = state.langs.filter(function (l) { return p[l]; }).map(function (l) { return { text: p[l], lang: l, langClass: l }; });
          if (!seq.length) return;
          speakSequence(seq, key, function () {
            if (!state.loop || state.loop.key !== key) return;
            setTimeout(cycle, 700);
          });
        })();
      }
    }
  }
  window.notebookSpeakCurrent = notebookSpeakCurrent;

  function openBrowser(url) {
    var Browser = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
    if (Browser && Browser.open) {
      Browser.open({ url: url });
    } else if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App && window.Capacitor.Plugins.App.openUrl) {
      window.Capacitor.Plugins.App.openUrl({ url: url });
    } else {
      window.open(url, '_blank');
    }
  }
  function openGoogleAiMode(secId, lesId, p, idx) {
    if (!p) return;
    var fr = p.fr || '';
    var ar = p.ar || '';
    var en = p.en || '';
    var prompt;
    if (state.uiLang === 'ar') {
      prompt = 'ترجم العبارة أو الكلمة الفرنسية "' + fr + '" إلى العربية والإنجليزية.\nالترجمة العربية: "' + ar + '"\nالترجمة الإنجليزية: "' + en + '"\nقدّم معنى كاملاً وعدة جمل شائعة بالفرنسية والعربية والإنجليزية تُستخدم في الحياة اليومية، مع نصائح نطق وقواعد.';
    } else if (state.uiLang === 'fr') {
      prompt = 'Traduis la phrase ou le mot français "' + fr + '" en arabe et en anglais.\nArabe: "' + ar + '"\nAnglais: "' + en + '"\nDonne le sens complet, plusieurs exemples courants en français, arabe et anglais de la vie quotidienne, ainsi que des conseils de prononciation et des notes de grammaire.';
    } else {
      prompt = 'Translate the French phrase or word "' + fr + '" into Arabic and English.\nArabic: "' + ar + '"\nEnglish: "' + en + '"\nProvide full meaning, several common examples in French, Arabic, and English from daily life, plus pronunciation tips and grammar notes.';
    }
    var hl = state.uiLang === 'ar' ? 'ar' : (state.uiLang === 'fr' ? 'fr' : 'en');
    var url = 'https://www.google.com/search?udm=50&hl=' + hl + '&q=' + encodeURIComponent(prompt);
    openBrowser(url);
  }
  window.openGoogleAiMode = openGoogleAiMode;
  function openGoogleClipart(p) {
    if (!p) return;
    var q = p.fr || p.en || p.ar || '';
    var url = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q + ' clipart');
    openBrowser(url);
  }
  window.openGoogleClipart = openGoogleClipart;

  document.getElementById('btn-export').addEventListener('click', exportNotebook);

  document.getElementById('btn-import-trigger').addEventListener('click', function () { document.getElementById('import-file').click(); });
  document.getElementById('import-file').addEventListener('change', function (e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var obj = JSON.parse(ev.target.result);
        if (obj && Array.isArray(obj.sections)) { state.data = obj; saveData(); render(); alert(t('importDone')); }
        else { alert(t('importError')); }
      } catch (err) { alert(t('importError')); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  document.getElementById('video-poster-input').addEventListener('change', function (e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var sec = findSection(state.route.section), les = findLesson(state.route.section, state.route.lesson);
      if (sec && les) { les.poster = ev.target.result; les.showCover = true; saveData(); render(); }
      e.target.value = '';
    };
    reader.readAsDataURL(file);
  });

  window.addEventListener('hashchange', function () { go(routeFromHash(), false); });

  var AppPlugin = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) || null;
  if (AppPlugin) {
    AppPlugin.addListener('backButton', function () {
      if (state.route.name === 'lesson') go({ name: 'lessons', section: state.route.section });
      else if (state.route.name === 'lessons') go({ name: 'sections' });
      else if (state.route.name === 'saved') go({ name: 'sections' });
      else if (confirm(t('exitConfirm'))) AppPlugin.exitApp();
    });
  }

  // Notebook overlay controls
  (function () {
    function on(id, ev, fn) {
      var el = document.getElementById(id);
      if (el) el.addEventListener(ev, fn);
    }
    on('nb-close', 'click', closeNotebook);
    on('nb-pencil', 'click', function () { setNotebookTool('pencil'); });
    on('nb-brush', 'click', function () { setNotebookTool('brush'); });
    on('nb-eraser', 'click', function () { setNotebookTool('eraser'); });
    on('nb-undo', 'click', undoNotebookCanvas);
    on('nb-grid', 'click', toggleNotebookGrid);
    on('nb-clear', 'click', clearNotebookCanvas);
    on('nb-palette-toggle', 'click', toggleNotebookPalette);
    on('nb-toggle-text', 'click', toggleNotebookText);
    on('nb-speak', 'click', notebookSpeakCurrent);
    document.querySelectorAll('#notebook-colors button').forEach(function (b) {
      b.addEventListener('click', function () { setNotebookColor(b.dataset.color); });
    });
    document.querySelectorAll('#notebook-sizes button').forEach(function (b) {
      b.addEventListener('click', function () { setNotebookSize(parseFloat(b.dataset.size)); });
    });
    var nbCanvas = document.getElementById('notebook-canvas');
    if (nbCanvas) {
      nbCanvas.addEventListener('mousedown', startNotebookDraw);
      nbCanvas.addEventListener('mousemove', moveNotebookDraw);
      nbCanvas.addEventListener('mouseup', stopNotebookDraw);
      nbCanvas.addEventListener('mouseleave', stopNotebookDraw);
      nbCanvas.addEventListener('touchstart', startNotebookDraw, { passive: false });
      nbCanvas.addEventListener('touchmove', moveNotebookDraw, { passive: false });
      nbCanvas.addEventListener('touchend', stopNotebookDraw);
      nbCanvas.addEventListener('touchcancel', stopNotebookDraw);
    }
    window.addEventListener('resize', function () {
      if (state.notebookIndex !== null && !document.getElementById('notebook-overlay').classList.contains('hidden')) {
        initNotebookCanvas();
      }
    });
  })();

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  if (speakSupported()) window.speechSynthesis.getVoices();

  setTheme(state.theme);
  setUILang(state.uiLang);
  state.route = routeFromHash();
  initData();
})();
</script>
</body>
</html>
