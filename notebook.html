<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f1f">
<title>دفتر الدراسة — Study Notebook</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg-primary: #0a0e1f;
    --bg-secondary: #11162e;
    --bg-tertiary: #1c2247;
    --bg-input: #161d3b;
    --text-primary: #f5f7ff;
    --text-secondary: #94a3c8;
    --accent: #7c6cff;
    --accent-hover: #6b5ce6;
    --accent-2: #26d0e7;
    --danger: #ff5c7e;
    --success: #2fe6a8;
    --gold: #ffd166;
    --border: #283259;
    --radius: 18px;
    --radius-sm: 10px;
    --shadow: 0 18px 40px rgba(0,0,0,0.4);
    --shadow-sm: 0 6px 18px rgba(0,0,0,0.2);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
  }
  [data-theme="light"] {
    --bg-primary: #f2f4ff;
    --bg-secondary: #ffffff;
    --bg-tertiary: #ede9fe;
    --bg-input: #f6f5ff;
    --text-primary: #151b3d;
    --text-secondary: #5e6586;
    --accent: #6d5de8;
    --accent-hover: #5c4dd3;
    --accent-2: #0fa3b8;
    --border: #d8d5ef;
    --shadow: 0 14px 34px rgba(109,93,232,0.14);
    --shadow-sm: 0 6px 18px rgba(109,93,232,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: radial-gradient(1200px 600px at 20% -10%, rgba(124,108,255,0.12), transparent),
                radial-gradient(1000px 500px at 100% 0%, rgba(38,208,231,0.08), transparent),
                var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.7;
    padding-bottom: 4rem;
    min-height: 100vh;
  }
  [data-theme="light"] body {
    background: radial-gradient(1200px 600px at 20% -10%, rgba(124,108,255,0.10), transparent),
                radial-gradient(1000px 500px at 100% 0%, rgba(38,208,231,0.08), transparent),
                var(--bg-primary);
  }
  .icon { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: middle; }
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,14,31,0.82);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  [data-theme="light"] header { background: rgba(255,255,255,0.82); }
  .header-inner {
    max-width: 960px; margin: 0 auto; padding: 0.75rem 1rem;
    display: flex; align-items: center; gap: 0.6rem;
  }
  .logo { font-weight: 800; color: var(--accent); font-size: 1.15rem; display: flex; align-items: center; gap: 0.45rem; }
  .logo-icon { width: 1.35em; height: 1.35em; color: var(--accent-2); }
  .spacer { flex: 1; }
  .icon-btn {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.5rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.1s, border-color 0.2s, background 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); background: var(--bg-input); }
  .lang-switch { display: flex; gap: 0.35rem; }
  .lang-btn {
    background: transparent; color: var(--text-secondary);
    border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 0.35rem 0.6rem; font-size: 0.75rem; font-weight: 800; cursor: pointer;
  }
  .lang-btn:hover { color: var(--text-primary); }
  .lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { max-width: 960px; margin: 0 auto; padding: 1rem; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem;
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 1.1rem;
    box-shadow: var(--shadow-sm);
  }
  .btn {
    background: linear-gradient(135deg, var(--accent), #a18bfa); color: #fff; border: none;
    border-radius: var(--radius-sm); padding: 0.6rem 1rem;
    font-size: 0.9rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 18px rgba(124,108,255,0.32);
    transition: transform 0.1s, box-shadow 0.2s, filter 0.2s;
    display: inline-flex; align-items: center; gap: 0.5rem;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(124,108,255,0.38); }
  .btn .icon { width: 1.35em; height: 1.35em; stroke-width: 2; }
  .btn.ghost .icon { color: var(--accent); }
  .btn.ghost { background: var(--bg-tertiary); color: var(--text-primary); box-shadow: none; border: 1px solid var(--border); }
  .btn.ghost:hover { border-color: var(--accent); background: var(--bg-input); }
  .btn.danger { background: linear-gradient(135deg, var(--danger), #ff8fa3); box-shadow: 0 6px 18px rgba(255,92,126,0.28); }
  .btn.success { background: linear-gradient(135deg, var(--success), #5af0b8); box-shadow: 0 6px 18px rgba(47,230,168,0.28); }
  .toolbar .spacer { flex: 1; min-width: 0.5rem; }
  .ctl-group { display: flex; align-items: center; gap: 0.4rem; }
  .ctl-group label { font-size: 0.78rem; color: var(--text-secondary); }
  select.ctl, input.ctl {
    background: var(--bg-input); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.45rem 0.5rem; font-size: 0.85rem;
  }
  input[type="range"].ctl { width: 90px; }
  .rate-value { font-size: 0.8rem; color: var(--accent-2); min-width: 2.2rem; font-weight: 700; }
  .breadcrumb {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1rem;
  }
  .breadcrumb button {
    background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 0.95rem;
  }
  .card {
    background: linear-gradient(145deg, var(--bg-secondary), var(--bg-tertiary)); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 0.9rem;
    display: flex; align-items: center; gap: 1rem; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.18s, border-color 0.2s, box-shadow 0.2s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top:0; left:0; right:0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); opacity: 0; transition: opacity 0.2s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow); }
  .card:hover::before { opacity: 1; }
  .card-img {
    width: 80px; height: 80px; border-radius: 14px; object-fit: cover;
    background: var(--bg-input); border: 1px solid var(--border); flex-shrink: 0;
  }
  .card-img.placeholder {
    display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
  }
  .card-img.placeholder .icon { width: 2.2rem; height: 2.2rem; opacity: 0.75; }
  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 1.22rem; font-weight: 800; color: var(--text-primary);
    margin-bottom: 0.25rem; line-height: 1.45;
  }
  .card-title .fr { color: var(--accent); }
  .card-title .ar { color: var(--accent-2); }
  .card-title .en { color: var(--text-secondary); font-size: 0.95em; }
  .card-sub { color: var(--text-secondary); font-size: 0.86rem; }
  .card-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
  .menu-btn { padding: 0.45rem; display: inline-flex; align-items: center; justify-content: center; color: var(--text-secondary); }
  .menu-btn:hover { color: var(--accent); }
  .menu-list { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.2rem 0; }
  .menu-item { width: 100%; text-align: start; background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem 1rem; font-size: 1rem; cursor: pointer; }
  .menu-item:hover { background: var(--accent); color: #fff; }
  .menu-item.danger { color: var(--danger); }
  .menu-item.danger:hover { background: var(--danger); color: #fff; }
  .section-count {
    display: inline-block; background: var(--accent); color: #fff;
    border-radius: 999px; padding: 0.15rem 0.55rem; font-size: 0.72rem; font-weight: 700;
  }
  .empty {
    text-align: center; color: var(--text-secondary); padding: 3.5rem 1rem; font-size: 1.05rem;
  }
  .empty-icon { display: block; width: 4rem; height: 4rem; margin: 0 auto 0.75rem; opacity: 0.6; color: var(--accent); }
  .hint {
    background: linear-gradient(90deg, rgba(124,108,255,0.12), rgba(38,208,231,0.12));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.9rem 1.1rem; color: var(--text-secondary); font-size: 0.92rem; margin-bottom: 1rem;
  }
  /* Phrase / word rows */
  .phrase {
    background: linear-gradient(145deg, var(--bg-secondary), var(--bg-tertiary)); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 0.9rem;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
  }
  .phrase.playing { border-color: var(--success); box-shadow: 0 0 0 2px rgba(47,230,168,0.22); }
  .phrase-top { display: flex; gap: 0.9rem; align-items: flex-start; }
  .lines { flex: 1; min-width: 0; }
  .line {
    padding: 0.45rem 0.6rem; margin-bottom: 0.4rem; border-radius: 10px;
    font-size: 1.1rem; line-height: 1.8; cursor: pointer;
    transition: background 0.15s;
  }
  .line:hover { background: var(--bg-input); }
  .line.active { background: rgba(47,230,168,0.15); }
  .line .word {
    display: inline-block; padding: 0 0.15rem; border-radius: 4px;
    transition: background 0.1s, color 0.1s;
  }
  .line .word:hover { background: var(--accent); color: #fff; }
  .fr { direction: ltr; text-align: left; font-weight: 700; color: var(--accent); }
  .ar { direction: rtl; text-align: right; color: var(--accent-2); }
  .en { direction: ltr; text-align: left; color: var(--text-secondary); }
  .btns { display: flex; flex-direction: column; gap: 0.45rem; flex-shrink: 0; }
  .btns button {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 12px;
    width: 2.5rem; height: 2.4rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .btns button .icon { width: 1.25rem; height: 1.25rem; }
  .btns button:hover { border-color: var(--accent); background: var(--bg-input); transform: translateY(-1px); }
  .btns button.active { background: var(--success); color: #0f1a16; border-color: var(--success); }
  .lesson-head { margin-bottom: 1rem; }
  .lesson-head h2 { margin: 0 0 0.3rem; font-size: 1.35rem; }
  .lesson-head .sub { color: var(--text-secondary); font-size: 0.95rem; }
  .lesson-img {
    width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius);
    margin-bottom: 1rem; border: 1px solid var(--border); background: var(--bg-tertiary);
  }
  /* Dialog / forms */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; padding: 1rem;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: linear-gradient(145deg, var(--bg-secondary), var(--bg-tertiary)); border: 1px solid var(--border);
    border-radius: 20px; width: 100%; max-width: 540px;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow);
  }
  .modal-header { padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { margin: 0; font-size: 1.15rem; }
  .modal-body { padding: 1.3rem; }
  .form-group { margin-bottom: 1.1rem; }
  .form-group label { display: block; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 0.35rem; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; background: var(--bg-input); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.6rem 0.85rem; font-size: 1rem; font-family: var(--font);
  }
  .form-group textarea { min-height: 90px; resize: vertical; }
  .form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .lang-field .label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.2rem; }
  .image-preview { max-width: 120px; max-height: 120px; border-radius: 12px; border: 1px solid var(--border); margin-top: 0.5rem; object-fit: cover; }
  .phrase-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.6rem; align-items: center; }
  .phrase-row input { width: 100%; }
  .phrase-row button { background: var(--danger); color: #fff; border: none; border-radius: var(--radius-sm); width: 2.2rem; height: 2.2rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .modal-footer { padding: 1rem 1.3rem; border-top: 1px solid var(--border); display: flex; gap: 0.6rem; justify-content: flex-end; }
  footer { text-align: center; color: var(--text-secondary); font-size: 0.82rem; padding: 2rem 1rem; }
  footer a { color: var(--accent); margin: 0 0.25rem; }
  @media (max-width: 640px) {
    .form-row, .phrase-row { grid-template-columns: 1fr; }
    .card { flex-wrap: wrap; }
    .card-img { width: 64px; height: 64px; }
    .card-actions { width: 100%; justify-content: flex-end; margin-top: 0.5rem; }
    .toolbar { gap: 0.5rem; }
    .btns { flex-direction: row; }
  }

  /* Notebook drawing overlay */
  .hidden { display: none !important; }
  .notebook-overlay {
    position: fixed; inset: 0; z-index: 4000;
    background: #fff; color: #111;
    display: flex; flex-direction: column;
    padding: 0.6rem;
    transition: opacity 0.15s;
  }
  .notebook-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.4rem 0.6rem; margin: 0.2rem 0.4rem;
    background: rgba(255,255,255,0.95); border: 1px solid #eee; border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    font-weight: 700; color: #555; font-size: 1rem;
  }
  .notebook-header > button:first-child { background: #fff; border: 1px solid #eee; border-radius: 10px; width: 38px; height: 38px; font-size: 1.3rem; color: #666; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .notebook-header-tools { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
  .notebook-header .nb-tool { width: 40px; height: 40px; background: #fff; border: 1px solid #eee; border-radius: 10px; color: #666; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.1s, background 0.1s, border-color 0.1s; }
  .notebook-header .nb-tool .icon { width: 1.2rem; height: 1.2rem; }
  .notebook-header .nb-tool.active { background: #e3f2fd; border-color: #90caf9; color: #1565c0; transform: scale(1.08); }
  .notebook-palette {
    display: flex; flex-direction: column; gap: 0.6rem;
    padding: 0.5rem 0.8rem; align-items: center;
    background: rgba(248,249,250,0.95); border: 1px solid #eee; border-radius: 16px;
    margin: 0 0.4rem; box-shadow: 0 4px 14px rgba(0,0,0,0.05);
  }
  .notebook-palette.hidden { display: none; }
  .notebook-colors, .notebook-size-preview { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
  .notebook-colors button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .notebook-colors button.active { border-color: #333; transform: scale(1.12); }
  .notebook-size-preview button { width: 40px; height: 32px; border: 2px solid transparent; background: transparent; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0.25rem; }
  .notebook-size-preview button span { display: block; width: 26px; background: #333; border-radius: 2px; transition: height 0.1s; }
  .notebook-size-preview button[data-size="0.85"] span { height: 2px; }
  .notebook-size-preview button[data-size="1"] span { height: 3px; }
  .notebook-size-preview button[data-size="1.25"] span { height: 5px; }
  .notebook-size-preview button[data-size="1.5"] span { height: 7px; }
  .notebook-size-preview button[data-size="2"] span { height: 11px; }
  .notebook-size-preview button.active { border-color: #333; background: #f5f5f5; }
  .notebook-canvas {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 0.6rem; position: relative; overflow: hidden;
  }
  .notebook-lines {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0 31px, #e0f0ff 31px 32px);
    opacity: 1;
  }
  .notebook-lines.hidden { opacity: 0; }
  .notebook-phrase-bg {
    position: relative; z-index: 1;
    font-size: calc(1.6rem * var(--notebook-scale, 1.25));
    font-weight: 700; text-align: center; line-height: 1.7;
    color: #e0e0e0; max-width: 100%; word-wrap: break-word;
    user-select: none; pointer-events: none;
    padding: 0 1rem;
  }
  .notebook-phrase-bg .fr { color: #8b5cf6; }
  .notebook-phrase-bg .ar { color: #06b6d4; }
  .notebook-phrase-bg .en { color: #9ca3af; }
  .notebook-draw-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    touch-action: none; cursor: crosshair; z-index: 2;
  }
  [data-theme="dark"] .notebook-overlay { background: #1a1a2e; color: #eee; }
  [data-theme="dark"] .notebook-header { background: rgba(30,30,46,0.95); border-color: #333; color: #eee; }
  [data-theme="dark"] .notebook-header > button:first-child { background: #23233a; border-color: #333; color: #eee; }
  [data-theme="dark"] .notebook-header .nb-tool { background: #23233a; border-color: #333; color: #eee; }
  [data-theme="dark"] .notebook-header .nb-tool.active { background: #2a3a4a; border-color: #5c9bd6; color: #8ccfff; }
  [data-theme="dark"] .notebook-palette { background: rgba(30,30,46,0.95); border-color: #333; }
</style>
</head>

      return obj[l] ? '<span class="' + l + '">' + esc(obj[l]) + '</span>' : '';
    }).filter(function (s) { return s; });
    if (parts.length) return parts.join(' <span class="sep">·</span> ');
    if (obj.mixed) return '<span>' + esc(obj.mixed) + '</span>';
    return '';
  }

  function parseTitleLine(line) {
    line = String(line || '').trim();
    var parts = line.split(/\s*[—–-]\s*/);
    if (parts.length > 1) {
      return { mixed: line, fr: (parts[0] || '').trim(), ar: (parts[1] || '').trim(), en: (parts[2] || '').trim() };
    }
    var idx = line.search(/\p{Script=Arabic}/u);
    if (idx > 0) return { mixed: line, fr: line.slice(0, idx).trim(), ar: line.slice(idx).trim(), en: '' };
    if (idx === 0) return { mixed: line, fr: '', ar: line.trim(), en: '' };
    return { mixed: line, fr: line, ar: '', en: '' };
  }

  function parseLessonText(raw) {
    var lines = String(raw || '').split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l.length; });
    function isTimestamp(line) { return /^\d{1,2}:\d{2}(?:\.\d+)?$/.test(line); }
    var defaultTitle = { mixed: 'Lesson — درس', fr: 'Lesson', ar: 'درس', en: '' };

    // Timed transcript: 00:00 FR-line AR-line EN-line ...
    if (lines.length > 1 && isTimestamp(lines[0])) {
      var order = ['fr', 'ar', 'en'];
      var phrases = [];
      for (var i = 0; i < lines.length; ) {
        if (isTimestamp(lines[i])) {
          var p = {};
          i++;
          var k = 0;
          while (i < lines.length && !isTimestamp(lines[i]) && k < order.length) {
            p[order[k]] = lines[i];
            i++; k++;
          }
          if (p.fr || p.ar || p.en) phrases.push(p);
        } else {
          i++;
        }
      }
      return { title: defaultTitle, phrases: phrases };
    }

    function isTitleLine(line) {
      return /[—–-]/.test(line) || (/\p{Script=Latin}/u.test(line) && /\p{Script=Arabic}/u.test(line));
    }
    var start = lines.findIndex(isTitleLine);
    if (start === -1) start = 0;
    var title = parseTitleLine(lines[start] || '');
    var order = ['fr', 'ar', 'en'];
    function looksLike(line, lang) {
      if (lang === 'ar') return /\p{Script=Arabic}/u.test(line);
      return /\p{Script=Latin}/u.test(line);
    }
    var phrases = [];
    var p = {};
    var j = 0;
    for (var i = start + 1; i < lines.length; i++) {
      var l = lines[i];
      var expected = order[j];
      if (looksLike(l, expected)) {
        p[expected] = l;
        j++;
        if (j === order.length) { phrases.push(p); p = {}; j = 0; }
      }
    }
    if (!title.mixed && !title.fr && !title.ar && !title.en) title = defaultTitle;
    return { title: title, phrases: phrases };
  }

  function lessonTextRepr(les) {
    var order = ['fr', 'ar', 'en'];
    var lines = [];
    if (les.title && les.title.mixed) lines.push(les.title.mixed);
    else if (les.title) lines.push(order.map(function (l) { return les.title[l] || ''; }).filter(function (s) { return s; }).join(' — '));
    else lines.push('');
    les.phrases.forEach(function (p) {
      order.forEach(function (l) { lines.push(p[l] || ''); });
    });
    return lines.join('\n');
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function generateId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

  function loadData() {
    var raw = localStorage.getItem('notebook_data');
    if (raw) {
      try { return JSON.parse(raw); } catch (e) {}
    }
    return { sections: [] };
  }

  function saveData() {
    localStorage.setItem('notebook_data', JSON.stringify(state.data));
  }

  function findSection(id) { return state.data.sections.find(function (s) { return s.id === id; }); }
  function findLesson(secId, lesId) {
    var sec = findSection(secId); return sec ? sec.lessons.find(function (l) { return l.id === lesId; }) : null;
  }

  function setTheme(th) {
    state.theme = th;
    document.documentElement.dataset.theme = th;
    localStorage.setItem('nb_theme', th);
    document.getElementById('btn-theme').innerHTML = icon(th === 'dark' ? 'moon' : 'sun');
    if (th === 'dark' && /^#111111/.test(state.notebookColor)) state.notebookColor = '#eeeeee';
    else if (th === 'light' && /^#(eeeeee|fff)/i.test(state.notebookColor)) state.notebookColor = '#111111';
    if (th === 'dark' && /^#111111/.test(state.notebookSelectedColor)) state.notebookSelectedColor = '#eeeeee';
    else if (th === 'light' && /^#(eeeeee|fff)/i.test(state.notebookSelectedColor)) state.notebookSelectedColor = '#111111';
  }

  function setUILang(lang) {
    state.uiLang = lang;
    localStorage.setItem('nb_ui_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === lang); });
    applyTranslations();
    render();
  }

  function applyTranslations() {
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var key = el.dataset.t;
      var text = t(key);
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = text;
      else if (el.tagName === 'OPTION') el.textContent = text;
      else if (el.dataset.icon) el.innerHTML = icon(el.dataset.icon) + '<span>' + text + '</span>';
      else el.textContent = text;
    });
    document.querySelectorAll('[data-t-title]').forEach(function (el) { el.title = t(el.dataset.tTitle); });
    document.title = t('appName') + ' — Study Notebook';
  }

  /* ---------- TTS ---------- */

  function nativeTTS() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) return window.Capacitor.Plugins.TextToSpeech;
    if (window.Capacitor && window.Capacitor.registerPlugin) {
      window.Capacitor.Plugins = window.Capacitor.Plugins || {};
      window.Capacitor.Plugins.TextToSpeech = window.Capacitor.registerPlugin('TextToSpeech');
      return window.Capacitor.Plugins.TextToSpeech;
    }
    return null;
  }
  function nativeSpeak(text, lang) {
    var tts = nativeTTS(); if (!tts) return Promise.reject('no tts');
    return tts.speak({ text: text, lang: VOICE_LANG[lang] || 'en-US', rate: state.rate || 1, queueStrategy: 1 });
  }
  function nativeStop() { var tts = nativeTTS(); if (!tts) return Promise.resolve(); return tts.stop(); }

  function speakSupported() { return !!nativeTTS() || 'speechSynthesis' in window; }

  function pickVoice(lang) {
    if (!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var code = VOICE_LANG[lang];
    var exact = voices.find(function (v) { return v.lang && v.lang.replace('_', '-') === code; });
    if (exact) return exact;
    var prefix = code.split('-')[0];
    return voices.find(function (v) { return v.lang && v.lang.toLowerCase().startsWith(prefix); }) || null;
  }

  function utter(text, lang) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE_LANG[lang];
    u.rate = state.rate;
    var v = pickVoice(lang); if (v) u.voice = v;
    return u;
  }

  function stopSpeech() {
    state.loop = null;
    state.speechRun++;
    if (nativeTTS()) nativeStop();
    else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.phrase').forEach(function (el) { el.classList.remove('playing'); });
    document.querySelectorAll('.line').forEach(function (el) { el.classList.remove('active'); });
    document.querySelectorAll('.loop-btn').forEach(function (b) { b.classList.remove('active'); b.innerHTML = icon('loop'); });
  }

  function speakOnce(text, lang, key, langClass, onDone) {
    speakSequence([{ text: text, lang: lang, langClass: langClass }], key, onDone);
  }

  function speakSequence(texts, key, onDone) {
    var run = ++state.speechRun;
    var i = 0;
    if (!speakSupported()) { if (onDone) onDone(); return; }

    if (nativeTTS()) {
      nativeStop();
      (function next() {
        if (run !== state.speechRun) return;
        if (i >= texts.length) { highlight(null, null); if (onDone) onDone(); return; }
        var item = texts[i++];
        highlight(key, item.langClass);
        nativeSpeak(item.text, item.lang).then(function () {
          if (run !== state.speechRun) return;
          setTimeout(next, 250);
        }).catch(function () {
          if (run !== state.speechRun) return;
          setTimeout(next, 250);
        });
      })();
      return;
    }

    if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
    window.speechSynthesis.cancel();
    (function next() {
      if (run !== state.speechRun) return;
      if (i >= texts.length) { highlight(null, null); if (onDone) onDone(); return; }
      var item = texts[i++];
      highlight(key, item.langClass);
      var u = utter(item.text, item.lang);
      u.onend = function () { if (run !== state.speechRun) return; setTimeout(next, 250); };
      u.onerror = function () { if (run !== state.speechRun) return; setTimeout(next, 250); };
      window.speechSynthesis.speak(u);
    })();
  }

  function togglePhraseLoop(phrase, key) {
    if (state.loop && state.loop.key === key) { stopSpeech(); return; }
    state.loop = { key: key, word: false };
    refreshLoopButtons();
    (function cycle() {
      if (!state.loop || state.loop.key !== key) return;
      var seq = state.langs.filter(function (l) { return phrase[l]; }).map(function (l) {
        return { text: phrase[l], lang: l, langClass: l };
      });
      if (!seq.length) return;
      speakSequence(seq, key, function () {
        if (!state.loop || state.loop.key !== key) return;
        setTimeout(cycle, 700);
      });
    })();
  }

  function toggleWordLoop(text, lang, phraseKey, langClass) {
    var loopKey = phraseKey + ':word:' + lang;
    if (state.loop && state.loop.key === loopKey && state.loop.word) { stopSpeech(); return; }
    stopSpeech();
    state.loop = { key: loopKey, word: true };
    refreshLoopButtons();
    (function cycle() {
      if (!state.loop || state.loop.key !== loopKey) return;
      speakOnce(text, lang, phraseKey, langClass, function () {
        if (!state.loop || state.loop.key !== loopKey) return;
        setTimeout(cycle, 600);
      });
    })();
  }

  function highlight(key, langClass) {
    document.querySelectorAll('.phrase').forEach(function (el) {
      var on = key && el.dataset.key === key;
      el.classList.toggle('playing', !!on);
      el.querySelectorAll('.line').forEach(function (line) {
        line.classList.toggle('active', !!on && line.classList.contains(langClass));
      });
    });
  }

  function refreshLoopButtons() {
    document.querySelectorAll('.phrase').forEach(function (el) {
      var btn = el.querySelector('.loop-btn'); if (!btn) return;
      var on = state.loop && state.loop.key === el.dataset.key && !state.loop.word;
      btn.classList.toggle('active', on);
      btn.innerHTML = icon(on ? 'pause' : 'loop');
    });
  }

  /* ---------- Word click ---------- */

  function clickableWords(text, lang) {
    return String(text).split(/(\s+)/).map(function (part) {
      if (/^\s+$/.test(part)) return esc(part);
      if (/^[\p{P}\p{S}]+$/u.test(part)) return '<span class="word">' + esc(part) + '</span>';
      return '<span class="word" data-word-lang="' + lang + '">' + esc(part) + '</span>';
    }).join('');
  }

  /* ---------- Rendering ---------- */

  function cardImg(src, iconName) {
    if (src) return '<img src="' + esc(src) + '" class="card-img" alt="">';
    return '<div class="card-img placeholder">' + icon(iconName, 'card-icon') + '</div>';
  }

  function renderCrumbs(items) {
    return '<div class="breadcrumb">' + items.map(function (it, i) {
      var sep = i ? '<span>›</span>' : '';
      if (it.route) return sep + '<button data-route="' + esc(JSON.stringify(it.route)) + '">' + esc(it.label) + '</button>';
      return sep + '<span>' + esc(it.label) + '</span>';
    }).join('') + '</div>';
  }

  function findSavedLessons() {
    var all = [];
    state.data.sections.forEach(function (sec) {
      sec.lessons.forEach(function (les) { if (les.saved) all.push({ sec: sec, les: les }); });
    });
    return all;
  }

  function renderSections() {
    var secs = state.data.sections;
    var html = '<div class="hint">' + t('noSections') + '</div>';
    if (!secs.length) { view.innerHTML = html; return; }
    html = renderCrumbs([{ label: t('sectionsLabel') }]);
    html += secs.map(function (sec) {
      var countText = sec.lessons.length + ' ' + (sec.lessons.length === 1 ? t('sectionCount') : t('sectionCountPlural'));
      return '<div class="card" data-section="' + esc(sec.id) + '">' +
        cardImg(sec.image, 'folder') +
        '<div class="card-body">' +
          '<div class="card-title">' + titleHTML(sec.title) + '</div>' +
          '<div class="card-sub"><span class="section-count">' + countText + '</span></div>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="btn ghost menu-btn" data-section="' + esc(sec.id) + '">' + icon('more') + '</button>' +
        '</div>' +
      '</div>';
    }).join('');
    view.innerHTML = html;
  }

  function renderLessons(secId) {
    var sec = findSection(secId);
    if (!sec) { go({ name: 'sections' }); return; }
    var html = renderCrumbs([
      { label: t('sectionsLabel'), route: { name: 'sections' } },
      { label: titleObj(sec.title) }
    ]);
    html += '<div class="lesson-head"><h2>' + esc(titleObj(sec.title)) + '</h2>' +
      '<div class="sub">' + t('sectionTitle') + '</div></div>';
    html += '<div class="toolbar" style="margin-bottom:1rem"><button class="btn" id="btn-add-lesson">' + icon('plus') + '<span>' + t('addLesson') + '</span></button></div>';
    if (!sec.lessons.length) {
      html += '<div class="empty">' + icon('file', 'empty-icon') + '<div>' + t('noLessons') + '</div></div>';
      view.innerHTML = html; return;
    }
    html += sec.lessons.map(function (les) {
      return '<div class="card" data-section="' + esc(sec.id) + '" data-lesson="' + esc(les.id) + '">' +
        cardImg(les.image, 'file') +
        '<div class="card-body">' +
          '<div class="card-title">' + titleHTML(les.title) + '</div>' +
          '<div class="card-sub">' + (les.phrases.length || 0) + ' ' + ((les.phrases.length === 1) ? t('phraseCount') : t('phraseCountPlural')) + '</div>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="btn ghost menu-btn" data-section="' + esc(sec.id) + '" data-lesson="' + esc(les.id) + '">' + icon('more') + '</button>' +
        '</div>' +
      '</div>';
    }).join('');
    view.innerHTML = html;
  }

  function renderLesson(secId, lesId) {
    var sec = findSection(secId), les = findLesson(secId, lesId);
    if (!sec || !les) { go({ name: 'sections' }); return; }
    var html = renderCrumbs([
      { label: t('sectionsLabel'), route: { name: 'sections' } },
      { label: titleObj(sec.title), route: { name: 'lessons', section: secId } },
      { label: titleObj(les.title) }
    ]);
    html += '<div class="lesson-head"><h2>' + esc(titleObj(les.title)) + '</h2>' +
      '<div class="sub">' + t('lessonTitle') + '</div></div>';
    if (les.image) html += '<img src="' + esc(les.image) + '" class="lesson-img" alt="">';
    html += '<div class="toolbar" style="margin-bottom:1rem">' +
      '<button class="btn" id="btn-add-phrase">' + icon('plus') + '<span>' + t('addPhrase') + '</span></button>' +
      '<button class="btn ghost" id="play-all">' + icon('play') + '<span>' + t('playAll') + '</span></button>' +
      '<button class="btn ghost" id="stop-all">' + icon('stop') + '<span>' + t('stopAll') + '</span></button>' +
      '</div>';
    if (!les.phrases.length) {
      html += '<div class="empty">' + icon('pencil', 'empty-icon') + '<div>' + t('noPhrases') + '</div></div>';
      view.innerHTML = html; return;
    }
    html += les.phrases.map(function (p, i) {
      return phraseHTML(p, secId + ':' + lesId + ':' + i, i);
    }).join('');
    view.innerHTML = html;
  }

  function phraseHTML(p, key, idx) {
    return '<div class="phrase" data-key="' + esc(key) + '">' +
      '<div class="phrase-top">' +
        '<div class="lines">' +
          '<div class="line fr" data-lang="fr" data-key="' + esc(key) + '">' + clickableWords(p.fr || '', 'fr') + '</div>' +
          '<div class="line ar" data-lang="ar" data-key="' + esc(key) + '">' + clickableWords(p.ar || '', 'ar') + '</div>' +
          '<div class="line en" data-lang="en" data-key="' + esc(key) + '">' + clickableWords(p.en || '', 'en') + '</div>' +
        '</div>' +
        '<div class="btns">' +
          '<button class="ai-search-btn" title="' + t('aiSearch') + '">' + icon('ai') + '</button>' +
          '<button class="loop-btn" title="' + t('loopPhrase') + '">' + icon('loop') + '</button>' +
          '<button class="notebook-btn" title="' + t('notebook') + '">' + icon('palette') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderSaved() {
    var saved = findSavedLessons();
    var html = renderCrumbs([
      { label: t('sectionsLabel'), route: { name: 'sections' } },
      { label: t('savedLessons') }
    ]);
    html += '<div class="lesson-head"><h2>' + esc(t('savedLessons')) + '</h2></div>';
    if (!saved.length) { html += '<div class="empty">' + icon('file', 'empty-icon') + '<div>' + t('noSaved') + '</div></div>'; view.innerHTML = html; return; }
    html += saved.map(function (it) {
      return '<div class="card" data-section="' + esc(it.sec.id) + '" data-lesson="' + esc(it.les.id) + '">' +
        cardImg(it.les.image, 'file') +
        '<div class="card-body">' +
          '<div class="card-title">' + titleHTML(it.les.title) + '</div>' +
          '<div class="card-sub">' + titleObj(it.sec.title) + '</div>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="btn ghost menu-btn" data-section="' + esc(it.sec.id) + '" data-lesson="' + esc(it.les.id) + '">' + icon('more') + '</button>' +
        '</div>' +
      '</div>';
    }).join('');
    view.innerHTML = html;
  }

  function render() {
    if (state.route.name === 'sections') renderSections();
    else if (state.route.name === 'lessons') renderLessons(state.route.section);
    else if (state.route.name === 'lesson') renderLesson(state.route.section, state.route.lesson);
    else if (state.route.name === 'saved') renderSaved();
    window.scrollTo(0, 0);
  }

  function go(route, push) {
    stopSpeech();
    state.route = route;
    if (push !== false) {
      var hash = '#/';
      if (route.name === 'lessons') hash = '#/section/' + route.section;
      else if (route.name === 'lesson') hash = '#/section/' + route.section + '/lesson/' + route.lesson;
      else if (route.name === 'saved') hash = '#/saved';
      if (location.hash !== hash) location.hash = hash;
    }
    render();
  }

  function routeFromHash() {
    var h = location.hash.replace(/^#\/?/, '');
    var m;
    if ((m = h.match(/^section\/([^/]+)\/lesson\/([^/]+)$/))) return { name: 'lesson', section: m[1], lesson: m[2] };
    if ((m = h.match(/^section\/([^/]+)$/))) return { name: 'lessons', section: m[1] };
    if (h === 'saved') return { name: 'saved' };
    return { name: 'sections' };
  }

  /* ---------- Modals & forms ---------- */

  var modal = document.getElementById('modal');
  var modalTitle = document.getElementById('modal-title');
  var modalBody = document.getElementById('modal-body');
  var modalFooter = document.getElementById('modal-footer');

  function openModal(title, bodyHTML, footerHTML) {
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHTML;
    modalFooter.innerHTML = footerHTML || '';
    modal.classList.add('open');
  }
  function closeModal() { modal.classList.remove('open'); modalBody.innerHTML = ''; modalFooter.innerHTML = ''; }

  function langInputs(name, value) {
    value = value || {};
    return '<div class="form-row">' +
      '<div class="lang-field"><div class="label">' + t('french') + '</div><input name="' + name + '_fr" value="' + esc(value.fr || '') + '" placeholder="Français" dir="ltr"></div>' +
      '<div class="lang-field"><div class="label">' + t('arabic') + '</div><input name="' + name + '_ar" value="' + esc(value.ar || '') + '" placeholder="العربية" dir="rtl"></div>' +
      '<div class="lang-field"><div class="label">' + t('english') + '</div><input name="' + name + '_en" value="' + esc(value.en || '') + '" placeholder="English" dir="ltr"></div>' +
    '</div>';
  }

  function imageField(name, current) {
    return '<div class="form-group">' +
      '<label>' + t('imageLabel') + '</label>' +
      '<input type="file" name="' + name + '_file" accept="image/*">' +
      '<input type="text" name="' + name + '_url" value="' + esc(current || '') + '" placeholder="' + t('imageUrl') + '">' +
      (current ? '<img src="' + esc(current) + '" class="image-preview">' : '') +
    '</div>';
  }

  function readImageFile(input, cb) {
    if (!input.files || !input.files[0]) { cb(''); return; }
    var reader = new FileReader();
    reader.onload = function (e) { cb(e.target.result); };
    reader.readAsDataURL(input.files[0]);
  }

  function getFormTitle(form, name) {
    return { fr: form[name + '_fr'].value.trim(), ar: form[name + '_ar'].value.trim(), en: form[name + '_en'].value.trim() };
  }

  function getFormImage(form, name) {
    var url = form[name + '_url'].value.trim();
    if (url) return url;
    return null; // handled async
  }

  function editSectionModal(sec) {
    var isNew = !sec;
    var id = sec ? sec.id : generateId();
    var title = isNew ? t('newSection') : t('editSection');
    var currentTitle = sec && sec.title ? (sec.title.mixed || titleObj(sec.title)) : '';
    var firstLessonField = isNew ? '<div class="form-group"><label>' + t('lessonTitle') + '</label>' +
      '<input name="lesson_title_mixed" placeholder="Français — العربية"></div>' +
      '<div class="form-group"><label>' + t('lessonText') + '</label>' +
      '<textarea name="section_lesson_text" rows="6" placeholder="' + esc(t('lessonPasteHint')) + '"></textarea></div>' : '';
    var body = '<form id="section-form">' +
      '<div class="form-group"><label>' + t('sectionTitle') + '</label>' +
      '<input name="title_mixed" value="' + esc(currentTitle) + '" placeholder="Français — العربية"></div>' +
      imageField('image', sec ? sec.image : '') +
      firstLessonField +

  /* ---------- Events ---------- */

  document.addEventListener('click', function (e) {
    if (e.target.closest('#modal-cancel') || e.target.closest('#modal-close')) { closeModal(); return; }

    if (e.target.closest('#btn-sections')) { go({ name: 'sections' }); return; }

    var menuBtn = e.target.closest('.menu-btn');
    if (menuBtn) {
      e.stopPropagation();
      if (menuBtn.dataset.lesson) openLessonMenu(menuBtn.dataset.section, menuBtn.dataset.lesson);
      else openSectionMenu(menuBtn.dataset.section);
      return;
    }

    var routeBtn = e.target.closest('[data-route]');
    if (routeBtn) { go(JSON.parse(routeBtn.dataset.route)); return; }

    var secCard = e.target.closest('[data-section]:not([data-lesson])');
    if (secCard && !e.target.closest('.card-actions')) {
      go({ name: 'lessons', section: secCard.dataset.section });
      return;
    }
    var lesCard = e.target.closest('[data-lesson]');
    if (lesCard && !e.target.closest('.card-actions')) {
      go({ name: 'lesson', section: lesCard.dataset.section, lesson: lesCard.dataset.lesson });
      return;
    }

    var phraseEl = e.target.closest('.phrase');
    if (phraseEl) {
      var key = phraseEl.dataset.key;
      var parts = key.split(':');
      var sec = findSection(parts[0]), les = findLesson(parts[0], parts[1]), p = les.phrases[+parts[2]];
      if (e.target.closest('.ai-search-btn')) {
        openGoogleAiMode(parts[0], parts[1], p, +parts[2]);
        return;
      }
      if (e.target.closest('.loop-btn')) { togglePhraseLoop(p, key); return; }
      if (e.target.closest('.notebook-btn')) {
        openNotebook(parts[0], parts[1], +parts[2]);
        return;
      }
      if (e.target.closest('.edit-phrase-btn')) { editPhraseModal(parts[0], parts[1], p, +parts[2]); return; }
      var word = e.target.closest('.word');
      if (word) {
        var lang = word.dataset.wordLang || word.closest('.line').dataset.lang;
        toggleWordLoop(word.textContent.trim(), lang, key, lang);
        return;
      }
    }

    if (e.target.closest('#btn-add-section')) { editSectionModal(null); return; }
    if (e.target.closest('#btn-add-lesson')) { editLessonModal(state.route.section, null); return; }
    if (e.target.closest('#btn-add-phrase')) { editPhraseModal(state.route.section, state.route.lesson, null, -1); return; }
    if (e.target.closest('#play-all')) { playAllPhrases(); return; }
    if (e.target.closest('#stop-all')) { stopSpeech(); return; }
  });

  function playAllPhrases() {
    var sec = findSection(state.route.section), les = findLesson(state.route.section, state.route.lesson);
    if (!sec || !les || !les.phrases.length) return;
    stopSpeech();
    var i = 0;
    var keyBase = state.route.section + ':' + state.route.lesson;
    state.loop = { key: keyBase + ':all', word: false };
    (function next() {
      if (!state.loop || state.loop.key !== keyBase + ':all') return;
      if (i >= les.phrases.length) { i = 0; setTimeout(next, 1200); return; }
      var p = les.phrases[i];
      var key = keyBase + ':' + i;
      var el = document.querySelector('.phrase[data-key="' + key + '"]');
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      var seq = state.langs.filter(function (l) { return p[l]; }).map(function (l) { return { text: p[l], lang: l, langClass: l }; });
      i++;
      speakSequence(seq, key, function () {
        if (!state.loop || state.loop.key !== keyBase + ':all') return;
        setTimeout(next, 500);
      });
    })();
  }

  /* ---------- Import / Export ---------- */

  function exportNotebook() {
    var json = JSON.stringify(state.data, null, 2);
    var filename = 'notebook_' + new Date().toISOString().slice(0, 10) + '.json';
    var fs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem;
    var share = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
    if (share && share.canShare && fs) {
      share.canShare().then(function (can) {
        if (can.value) {
          return fs.writeFile({ path: 'notebook/share/' + filename, data: json, directory: 'CACHE', encoding: 'utf8', recursive: true })
            .then(function (res) { return share.share({ title: 'Study Notebook', files: [res.uri], dialogTitle: 'تصدير الأقسام' }); })
            .then(function () { alert(t('exportDoneFile') + '\n' + filename); });
        }
        return saveExportToDocuments(fs, json, filename);
      }).catch(function (err) { saveExportToDocuments(fs, json, filename); });
      return;
    }
    if (fs) { saveExportToDocuments(fs, json, filename); return; }
    fallbackExport(json, filename);
  }
  function saveExportToDocuments(fs, json, filename) {
    fs.writeFile({ path: 'notebook/' + filename, data: json, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true })
      .then(function () { alert(t('exportDoneFile') + '\n' + filename); })
      .catch(function (err) { alert(t('exportErrorFile') + (err && err.message ? ': ' + err.message : '')); });
  }
  function fallbackExport(json, filename) {
    downloadExport(json, filename);
    alert(t('exportDoneFile') + '\n' + filename);
  }
  function downloadExport(json, filename) {
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 3000);
  }

  // --- Drawing notebook ---
  function renderNotebookOverlay() {
    var wrap = document.getElementById('notebook-canvas-wrap');
    var phraseEl = document.getElementById('notebook-phrase-bg');
    var linesEl = document.getElementById('notebook-lines');
    if (!wrap || !phraseEl) return;
    var p = null;
    if (state.notebookSecId && state.notebookLesId && state.notebookIndex !== null) {
      var les = findLesson(state.notebookSecId, state.notebookLesId);
      p = les && les.phrases[state.notebookIndex];
    }
    phraseEl.innerHTML = p
      ? '<div class="fr">' + esc(p.fr || '') + '</div>' +
        '<div class="ar">' + esc(p.ar || '') + '</div>' +
        '<div class="en">' + esc(p.en || '') + '</div>'
      : '';
    phraseEl.style.setProperty('--notebook-scale', state.notebookScale);
    if (linesEl) linesEl.classList.toggle('hidden', !state.notebookGrid);
    phraseEl.classList.toggle('hidden', !state.notebookTextVisible);
    var txtBtn = document.getElementById('nb-toggle-text');
    if (txtBtn) {
      txtBtn.classList.toggle('active', state.notebookTextVisible);
      txtBtn.innerHTML = icon(state.notebookTextVisible ? 'eye' : 'eye-off');
    }
    document.querySelectorAll('#notebook-header-tools .nb-tool[data-tool]').forEach(function (b) { b.classList.toggle('active', b.dataset.tool === state.notebookTool); });
    document.querySelectorAll('#notebook-colors button').forEach(function (b) { b.classList.toggle('active', b.dataset.color === state.notebookColor); });
    document.querySelectorAll('#notebook-sizes button').forEach(function (b) { b.classList.toggle('active', parseFloat(b.dataset.size) === state.notebookScale); });
  }

  function saveNotebookHistory() {
    var canvas = document.getElementById('notebook-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    state.notebookHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (state.notebookHistory.length > 12) state.notebookHistory.shift();
  }

  function openNotebook(secId, lesId, idx) {
    stopSpeech();
    state.notebookSecId = secId;
    state.notebookLesId = lesId;
    state.notebookIndex = idx;
    state.notebookHistory = [];
    renderNotebookOverlay();
    document.getElementById('notebook-overlay').classList.remove('hidden');

    clearNotebookCanvas();
    requestAnimationFrame(saveNotebookHistory);

  function getCanvasPoint(e) {
    var canvas = document.getElementById('notebook-canvas');
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startNotebookDraw(e) {
    state.notebookDrawing = true;
    var p = getCanvasPoint(e);
    state.notebookLastX = p.x; state.notebookLastY = p.y;
    var canvas = document.getElementById('notebook-canvas');
    var ctx = canvas.getContext('2d');
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (state.notebookTool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = state.notebookColor;
    }
    var factor = { pencil: 1, brush: 2.5, eraser: 5 }[state.notebookTool] || 1;
    ctx.lineWidth = Math.max(2, 3 * state.notebookScale * factor);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    e.preventDefault();
  }

  function moveNotebookDraw(e) {
    if (!state.notebookDrawing) return;
    var p = getCanvasPoint(e);
    var canvas = document.getElementById('notebook-canvas');
    var ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(state.notebookLastX, state.notebookLastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    state.notebookLastX = p.x; state.notebookLastY = p.y;
    e.preventDefault();
  }

  function stopNotebookDraw(e) {
    if (!state.notebookDrawing) return;
    state.notebookDrawing = false;
    saveNotebookHistory();
    if (e && e.cancelable) e.preventDefault();
  }

  function clearNotebookCanvas() {
    var canvas = document.getElementById('notebook-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    saveNotebookHistory();
  }
  window.clearNotebookCanvas = clearNotebookCanvas;

  function undoNotebookCanvas() {
    var canvas = document.getElementById('notebook-canvas');
    if (!canvas || state.notebookHistory.length < 2) return;
    state.notebookHistory.pop();
    var data = state.notebookHistory[state.notebookHistory.length - 1];
    var ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'source-over';
    ctx.putImageData(data, 0, 0);

  function openGoogleAiMode(secId, lesId, p, idx) {
    if (!p) return;
    var fr = p.fr || '';
    var ar = p.ar || '';
    var en = p.en || '';
    var prompt;
    if (state.uiLang === 'ar') {
      prompt = 'صحّح وأعطِ تحليلاً للعبارة الفرنسية "' + fr + '" كلمة كلمة مع الترجمة إلى العربية والفرنسية والإنجليزية.\nالترجمة العربية: "' + ar + '"\nالترجمة الإنجليزية: "' + en + '"\nقدّم معنى كاملاً وأمثلة شائعة تُستخدم في الحياة اليومية في فرنسا ونصائح نطق وقواعد.';
    } else if (state.uiLang === 'fr') {
      prompt = 'Corrige et analyse la phrase française "' + fr + '" mot à mot avec la traduction en arabe, en français et en anglais.\nArabe: "' + ar + '"\nAnglais: "' + en + '"\nDonne le sens complet, des exemples courants de la vie quotidienne en France, des conseils de prononciation et des notes de grammaire.';
    } else {
      prompt = 'Correct and analyze the French phrase "' + fr + '" word by word with translations into Arabic, French, and English.\nArabic: "' + ar + '"\nEnglish: "' + en + '"\nProvide full meaning, common examples used in daily life in France, pronunciation tips, and grammar notes.';
    }
    var hl = state.uiLang === 'ar' ? 'ar' : (state.uiLang === 'fr' ? 'fr' : 'en');
    var url = 'https://www.google.com/search?udm=50&hl=' + hl + '&q=' + encodeURIComponent(prompt);
    var Browser = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
    if (Browser && Browser.open) {
      Browser.open({ url: url });
    } else if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App && window.Capacitor.Plugins.App.openUrl) {
      window.Capacitor.Plugins.App.openUrl({ url: url });
    } else {
      window.open(url, '_blank');
    }
  }
  window.openGoogleAiMode = openGoogleAiMode;

    reader.readAsText(file);
  });

  window.addEventListener('hashchange', function () { go(routeFromHash(), false); });

  var AppPlugin = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) || null;
  if (AppPlugin) {
    AppPlugin.addListener('backButton', function () {
      if (state.route.name === 'lesson') go({ name: 'lessons', section: state.route.section });
      else if (state.route.name === 'lessons') go({ name: 'sections' });
      else if (state.route.name === 'saved') go({ name: 'sections' });
      else if (confirm(t('exitConfirm'))) AppPlugin.exitApp();
    });
  }

  // Notebook overlay controls
  (function () {
    function on(id, ev, fn) {
      var el = document.getElementById(id);
      if (el) el.addEventListener(ev, fn);
    }
    on('nb-close', 'click', closeNotebook);
    on('nb-pencil', 'click', function () { setNotebookTool('pencil'); });
    on('nb-brush', 'click', function () { setNotebookTool('brush'); });
    on('nb-eraser', 'click', function () { setNotebookTool('eraser'); });
    on('nb-undo', 'click', undoNotebookCanvas);
    on('nb-grid', 'click', toggleNotebookGrid);
    on('nb-clear', 'click', clearNotebookCanvas);
    on('nb-palette-toggle', 'click', toggleNotebookPalette);
    on('nb-toggle-text', 'click', toggleNotebookText);
    on('nb-speak', 'click', notebookSpeakCurrent);
    document.querySelectorAll('#notebook-colors button').forEach(function (b) {
      b.addEventListener('click', function () { setNotebookColor(b.dataset.color); });
    });
    document.querySelectorAll('#notebook-sizes button').forEach(function (b) {
      b.addEventListener('click', function () { setNotebookSize(parseFloat(b.dataset.size)); });
    });
    var nbCanvas = document.getElementById('notebook-canvas');
    if (nbCanvas) {
      nbCanvas.addEventListener('mousedown', startNotebookDraw);
      nbCanvas.addEventListener('mousemove', moveNotebookDraw);
      nbCanvas.addEventListener('mouseup', stopNotebookDraw);
      nbCanvas.addEventListener('mouseleave', stopNotebookDraw);
      nbCanvas.addEventListener('touchstart', startNotebookDraw, { passive: false });
      nbCanvas.addEventListener('touchmove', moveNotebookDraw, { passive: false });
      nbCanvas.addEventListener('touchend', stopNotebookDraw);
      nbCanvas.addEventListener('touchcancel', stopNotebookDraw);
    }
    window.addEventListener('resize', function () {
      if (state.notebookIndex !== null && !document.getElementById('notebook-overlay').classList.contains('hidden')) {
        initNotebookCanvas();
      }
    });
  })();

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  if (speakSupported()) window.speechSynthesis.getVoices();

  setTheme(state.theme);
  setUILang(state.uiLang);
  state.route = routeFromHash();
  render();
})();
</script>
</body>
</html>
