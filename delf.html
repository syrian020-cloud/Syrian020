<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DELF B1 — دبلوم اللغة الفرنسية</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg-primary: #0a0e1e;
    --bg-secondary: #141830;
    --bg-tertiary: #1d2142;
    --text-primary: #f2f3ff;
    --text-secondary: #9aa0c7;
    --accent: #7c3aed;
    --accent2: #db2777;
    --accent-hover: #6d28d9;
    --success: #00e676;
    --gold: #ffc857;
    --danger: #ff6b6b;
    --info: #4cc9f0;
    --border: rgba(255,255,255,0.09);
    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 12px 32px rgba(0,0,0,0.4);
    --shadow-sm: 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 500px at 80% -10%, rgba(124,58,237,0.24), transparent 60%),
                radial-gradient(900px 400px at -10% 30%, rgba(230,57,80,0.10), transparent 55%),
                var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header { position: sticky; top: 0; z-index: 60; background: rgba(10,14,30,0.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
  .header-inner { max-width: 960px; margin: 0 auto; padding: 0.7rem 1rem; display: flex; align-items: center; gap: 0.55rem; }
  .logo-badge { width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 1.05rem; box-shadow: 0 4px 14px rgba(124,58,237,0.5); }
  .logo { font-weight: 900; font-size: 1.02rem; white-space: nowrap; background: linear-gradient(90deg, #fff, #9db8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo small { display: block; font-size: 0.62rem; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.5px; }
  .spacer { flex: 1; }
  .icon-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 12px; padding: 0.45rem 0.65rem; font-size: 0.95rem; cursor: pointer; font-weight: 600; transition: transform .12s, border-color .12s; }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.speaking { background: var(--success); color: #0a0e1e; border-color: var(--success); }
  .info-overlay { position: fixed; inset: 0; z-index: 120; background: rgba(5,8,20,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; animation: fadein .18s ease; }
  .info-sheet { width: 100%; max-width: 760px; max-height: 82vh; overflow-y: auto; background: linear-gradient(160deg, var(--bg-secondary), #151a36); border: 1px solid var(--border); border-bottom: none; border-radius: 20px 20px 0 0; padding: 1.1rem 1.1rem 1.4rem; box-shadow: var(--shadow); }
  .info-sheet h3 { margin: 0 0 0.4rem; font-size: 1.02rem; font-weight: 900; display: flex; align-items: center; gap: 0.45rem; }
  .info-sheet .info-fr { direction: ltr; text-align: left; font-size: 0.92rem; line-height: 1.55; margin: 0.55rem 0 0.4rem; }
  .info-sheet .info-ar { direction: rtl; text-align: right; font-size: 0.92rem; line-height: 1.6; color: #ffd9a0; border-top: 1px dashed var(--border); padding-top: 0.5rem; margin-top: 0.35rem; }
  .info-sheet .info-note { color: var(--text-secondary); font-size: 0.8rem; margin: 0.6rem 0; }
  main { max-width: 760px; margin: 0 auto; padding: 0.9rem 0.9rem 3rem; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .hero { position: relative; overflow: hidden; background: linear-gradient(120deg, rgba(124,58,237,0.34), rgba(255,255,255,0.10) 50%, rgba(230,57,80,0.16)); border: 1px solid rgba(124,58,237,0.4); border-radius: var(--radius); padding: 1.25rem 1.3rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .hero::after { content: ""; position: absolute; top: -45px; left: -45px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.16), transparent 65%); pointer-events: none; }
  .hero h1 { margin: 0 0 0.35rem; font-size: 1.28rem; font-weight: 900; }
  .hero p { margin: 0; color: #cfd3f2; font-size: 0.88rem; }
  .hero .stats-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
  .hero .stat-chip { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 0.76rem; font-weight: 700; }

  .card { background: linear-gradient(160deg, var(--bg-secondary), #151a36); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem; margin-bottom: 0.9rem; box-shadow: var(--shadow-sm); }
  .mode-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.45rem; }
  .mode-desc { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.8rem; }
  .big-btn { width: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; border: none; border-radius: var(--radius-sm); padding: 0.95rem; font-size: 1.05rem; font-weight: 900; cursor: pointer; font-family: inherit; box-shadow: 0 6px 18px rgba(124,58,237,0.4); transition: transform .12s, box-shadow .12s, filter .12s; }
  .big-btn:hover { filter: brightness(1.08); }
  .big-btn:active { transform: scale(0.98); }
  .big-btn:disabled { opacity: 0.45; box-shadow: none; cursor: default; filter: none; }
  .ghost-btn { width: 100%; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.8rem; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit; margin-top: 0.5rem; transition: border-color .12s, transform .12s; }
  .ghost-btn:hover { border-color: var(--accent); }
  .ghost-btn:active { transform: scale(0.98); }

  .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.55rem; margin: 0.7rem 0 0.9rem; }
  .theme-tile { position: relative; background: var(--bg-tertiary); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.7rem 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; transition: transform .12s, border-color .12s, background .12s; }
  .theme-tile:active { transform: scale(0.97); }
  .theme-tile .t-icon { width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; }
  .theme-tile .t-name { font-size: 0.85rem; font-weight: 800; line-height: 1.3; }
  .theme-tile .t-count { font-size: 0.72rem; color: var(--text-secondary); font-weight: 600; }
  .theme-tile.active { border-color: var(--accent); background: rgba(124,58,237,0.16); }
  .theme-tile.active::after { content: "✓"; position: absolute; top: 6px; left: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; font-weight: 900; }

  .progress-wrap { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.8rem; }
  .progress-info { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; font-weight: 800; }
  .timerbar { flex: 1; height: 9px; background: var(--bg-tertiary); border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }
  .timerbar > div { height: 100%; background: linear-gradient(90deg, var(--success), #4ade80); border-radius: 999px; transition: width 0.2s linear; }
  .timerbar > div.warn { background: linear-gradient(90deg, var(--gold), #ffb020); }
  .timerbar > div.danger { background: linear-gradient(90deg, var(--danger), #ff4d4d); }
  .score-pill { background: linear-gradient(135deg, rgba(255,200,87,0.18), rgba(255,200,87,0.08)); border: 1px solid rgba(255,200,87,0.35); border-radius: 999px; padding: 0.22rem 0.75rem; font-size: 0.78rem; font-weight: 800; color: var(--gold); white-space: nowrap; }

  .q-img { background: linear-gradient(180deg, #ffffff, #eef1fb); border-radius: var(--radius-sm); padding: 0.7rem; display: flex; justify-content: center; align-items: center; margin-bottom: 0.8rem; min-height: 110px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .q-img svg { max-width: 100%; height: auto; display: block; }

  .q-label { font-size: 0.72rem; color: var(--info); font-weight: 800; margin-bottom: 0.5rem; letter-spacing: 1.2px; text-transform: uppercase; }
  .q-block { background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.2); border-radius: 16px; padding: 0.85rem 1rem; margin-bottom: 0.9rem; }
  .q-fr { direction: ltr; text-align: left; font-size: 1.13rem; font-weight: 800; margin-bottom: 0.45rem; white-space: pre-wrap; font-family: "Segoe UI", Roboto, "Noto Sans", sans-serif; line-height: 1.5; }
  .q-ar { font-size: 0.93rem; color: var(--text-secondary); white-space: pre-wrap; border-top: 1px dashed var(--border); padding-top: 0.45rem; line-height: 1.7; }
  .multi-hint { font-size: 0.78rem; color: var(--gold); margin-bottom: 0.6rem; font-weight: 800; background: rgba(255,200,87,0.1); border: 1px solid rgba(255,200,87,0.3); border-radius: 10px; padding: 0.4rem 0.7rem; display: inline-block; }

  .opt { width: 100%; display: flex; align-items: flex-start; gap: 0.7rem; direction: ltr; text-align: left; background: var(--bg-tertiary); color: var(--text-primary); border: 2px solid var(--border); border-radius: 16px; padding: 0.75rem 0.85rem; margin-bottom: 0.55rem; cursor: pointer; font-family: inherit; font-size: 0.98rem; transition: transform .1s, border-color .12s, background .12s; }
  .opt:active { transform: scale(0.985); }
  .opt .letter { flex-shrink: 0; width: 32px; height: 32px; border-radius: 11px; border: 2px solid var(--text-secondary); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.9rem; transition: all .12s; margin-top: 0.1rem; }
  .opt .opt-body { flex: 1; min-width: 0; }
  .opt .opt-fr { display: block; font-weight: 700; line-height: 1.45; }
  .opt .opt-ar { display: block; direction: rtl; text-align: right; color: var(--text-secondary); font-size: 0.84rem; margin-top: 0.35rem; padding-top: 0.35rem; border-top: 1px dashed var(--border); line-height: 1.6; }
  .opt.sel { border-color: var(--accent); background: rgba(124,58,237,0.14); }
  .opt.sel .letter { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct { border-color: var(--success); background: rgba(0,230,118,0.1); }
  .opt.correct .letter { background: var(--success); border-color: var(--success); color: #0a0e1e; }
  .opt.wrong { border-color: var(--danger); background: rgba(255,107,107,0.1); }
  .opt.wrong .letter { background: var(--danger); border-color: var(--danger); color: #fff; }
  .opt.missed { border-color: var(--gold); border-style: dashed; }
  .opt.missed .letter { border-color: var(--gold); color: var(--gold); }
  .opt:disabled { cursor: default; }

  .answer-bar { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
  .answer-bar button { flex: 1; }

  .exp { margin-top: 0.9rem; border-top: 1px dashed var(--border); padding-top: 0.8rem; background: rgba(255,200,87,0.05); border-radius: 12px; padding: 0.8rem; margin-top: 0.9rem; border: 1px solid rgba(255,200,87,0.18); }
  .exp-label { font-size: 0.75rem; color: var(--gold); font-weight: 800; margin-bottom: 0.25rem; }
  .exp-fr { direction: ltr; text-align: left; font-size: 0.92rem; margin-bottom: 0.25rem; }
  .exp-ar { font-size: 0.88rem; color: var(--text-secondary); }
  .verdict { text-align: center; font-weight: 900; font-size: 1.15rem; margin: 0.8rem 0 0.2rem; }
  .verdict.ok { color: var(--success); }
  .verdict.ko { color: var(--danger); }

  .result-hero { text-align: center; padding: 1.8rem 1rem; background: linear-gradient(160deg, var(--bg-secondary), #151a36); }
  .result-score { font-size: 3.2rem; font-weight: 900; line-height: 1.1; }
  .result-score.ok { color: var(--success); text-shadow: 0 0 30px rgba(0,230,118,0.4); }
  .result-score.ko { color: var(--danger); text-shadow: 0 0 30px rgba(255,107,107,0.4); }
  .result-sub { color: var(--text-secondary); margin-top: 0.4rem; font-weight: 700; }
  .review-item { border-top: 1px solid var(--border); padding-top: 0.7rem; margin-top: 0.7rem; }
  .review-item .badge { display: inline-block; font-size: 0.75rem; font-weight: 800; border-radius: 999px; padding: 0.1rem 0.6rem; margin-left: 0.3rem; }
  .badge.ok { background: rgba(0,230,118,0.15); color: var(--success); }
  .badge.ko { background: rgba(255,107,107,0.15); color: var(--danger); }
  .mini { font-size: 0.8rem; color: var(--text-secondary); }

  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.6rem 1.1rem; z-index: 100; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-weight: 700; }
  .toast.show { opacity: 1; }
  footer { text-align: center; padding: 1.5rem 1rem; color: var(--text-secondary); font-size: 0.78rem; }

  .lvl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.55rem; margin: 0.7rem 0 0.2rem; }
  .lvl-btn { background: var(--bg-tertiary); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.75rem 0.4rem; cursor: pointer; text-align: center; font-family: inherit; color: var(--text-primary); transition: transform .12s, border-color .12s; }
  .lvl-btn:active { transform: scale(0.96); }
  .lvl-btn.active { border-color: var(--accent); background: rgba(124,58,237,0.16); }
  .lvl-btn .lvl-icon { font-size: 1.4rem; display: block; }
  .lvl-btn .lvl-name { font-size: 0.8rem; font-weight: 800; display: block; margin-top: 0.25rem; }
  .lvl-btn .lvl-sub { font-size: 0.68rem; color: var(--text-secondary); display: block; margin-top: 0.15rem; }
  .lesson-item { display: flex; align-items: center; gap: 0.7rem; background: var(--bg-tertiary); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.7rem 0.75rem; margin-bottom: 0.55rem; cursor: pointer; transition: transform .12s, border-color .12s; }
  .lesson-item:active { transform: scale(0.98); }
  .lesson-item.done { border-color: rgba(0,230,118,0.4); }
  .lesson-item .li-icon { width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; background: rgba(124,58,237,0.18); }
  .lesson-item .li-body { flex: 1; min-width: 0; }
  .lesson-item .li-fr { direction: ltr; text-align: left; font-size: 0.88rem; font-weight: 800; }
  .lesson-item .li-ar { font-size: 0.76rem; color: var(--text-secondary); margin-top: 0.15rem; }
  .lesson-item .li-meta { font-size: 0.68rem; color: var(--text-secondary); margin-top: 0.2rem; }
  .lesson-item .li-check { flex-shrink: 0; font-size: 1.1rem; }
  .slide-card { background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.25); border-radius: 16px; padding: 1rem 1.05rem; margin-bottom: 0.9rem; }
  .slide-fr { direction: ltr; text-align: left; font-size: 1.05rem; font-weight: 800; line-height: 1.55; margin-bottom: 0.55rem; }
  .slide-ar { font-size: 0.92rem; color: var(--text-secondary); border-top: 1px dashed var(--border); padding-top: 0.55rem; line-height: 1.75; }
  .slide-nav { display: flex; gap: 0.5rem; }
  .slide-nav .big-btn { flex: 1; }
  .slide-nav .ghost-btn { flex: 1; margin-top: 0; }
</style>
</head>

function imgHtml(q){
  if(!q.img) return '';
  var s;
  if(q.img.indexOf('lim') === 0 && SIGNS[q.img] === undefined){
    var n = q.img.replace(/\D/g,'');
    s = q.img.indexOf('fin') === 0 ? finLimSign(n) : limSign(n);
  }
  if(!s && q.img.indexOf('finlim') === 0){ s = finLimSign(q.img.replace(/\D/g,'')); }
  if(!s && q.img.indexOf('feu_') === 0){ s = feuSign(q.img.slice(4)); }
  if(!s) s = SIGNS[q.img] || PICTOS[q.img] || DIAGRAMS[q.img] || CIVIC_IMGS[q.img];
  if(!s) return '';
  return '<div class="q-img">' + s + '</div>';
}

function startQuiz(mode, poolOverride){
  var pool = poolOverride || DATA;
  if(!poolOverride && mode === 'train' && state.theme) pool = DATA.filter(function(q){ return q.theme === state.theme; });
  state.questions = shuffle(pool);
  if(mode === 'exam'){ state.questions = state.questions.slice(0, Math.min(40, state.questions.length)); state.examEndsAt = 0; }
  else state.questions = state.questions.slice(0, Math.min(50, state.questions.length));
  state.mode = mode;
  state.idx = 0;
  state.results = [];
  state.screen = 'quiz';
  render();
}
function startMistakes(){
  var ids = stats.wrongIds;
  state.questions = DATA.filter(function(q){ return ids.indexOf(q.id) !== -1; });
  if(!state.questions.length){ showToast('لا أخطاء مسجلة'); return; }
  state.mode = 'train';
  state.idx = 0;
  state.results = [];
  state.screen = 'quiz';
  render();
}

function currentQ(){ return state.questions[state.idx]; }

function startTimer(){
  clearInterval(state.timer);
  if(state.mode !== 'exam') return;
  if(!state.examEndsAt) state.examEndsAt = Date.now() + state.examTotalSeconds * 1000;
  state.timer = setInterval(function(){
    var left = Math.max(0, (state.examEndsAt - Date.now()) / 1000);
    var bar = document.querySelector('.timerbar > div');
    var clock = document.getElementById('exam-clock');
    if(bar){
      var pct = Math.max(0, left / state.examTotalSeconds * 100);
      bar.style.width = pct + '%';
      bar.className = pct < 15 ? 'danger' : (pct < 35 ? 'warn' : '');
    }
    if(clock){
      var m = Math.floor(left / 60), s = Math.floor(left % 60);
      clock.textContent = '⏱ ' + m + ':' + (s < 10 ? '0' : '') + s;
    }
    if(left <= 0){
      clearInterval(state.timer);
      finishQuiz();
    }
  }, 250);
}

function pickOption(i, multi){
  if(state.answered) return;
  if(multi){
    var p = state.selected.indexOf(i);
    if(p === -1) state.selected.push(i); else state.selected.splice(p, 1);
    document.querySelectorAll('.opt').forEach(function(b){
      b.classList.toggle('sel', state.selected.indexOf(+b.dataset.i) !== -1);
    });
    document.getElementById('btn-validate').disabled = !state.selected.length;
  } else {
    state.selected = [i];
    document.querySelectorAll('.opt').forEach(function(b){
      b.classList.toggle('sel', +b.dataset.i === i);
    });
    submitAnswer(false);
  }
}

function arraysEqual(a, b){
  if(a.length !== b.length) return false;
  var s = a.slice().sort(), t = b.slice().sort();
  return s.every(function(v, i){ return v === t[i]; });
}

var audioCtx = null;
function playFeedback(ok){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var t0 = audioCtx.currentTime;
    function tone(freq, start, dur, type, vol){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t0 + start);
      g.gain.linearRampToValueAtTime(vol || 0.25, t0 + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + start + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + start); o.stop(t0 + start + dur);
    }
    if(ok){ tone(660, 0, 0.15); tone(880, 0.12, 0.3); }
    else { tone(220, 0, 0.18, 'square', 0.15); tone(165, 0.15, 0.3, 'square', 0.15); }
  }catch(e){}
}

function submitAnswer(skipped){
  if(state.answered) return;
  state.answered = true;
  clearInterval(state.timer);
  var q = currentQ();
  var correct = !skipped && arraysEqual(state.selected, q.ok);
  if(state.mode !== 'exam') playFeedback(correct);
  state.results.push({ q: q, ok: correct, picked: state.selected.slice(), skipped: skipped });
  stats.answered++;
  if(correct){ stats.correct++; unmarkWrong(q.id); } else markWrong(q.id);
  saveStats();

  document.querySelectorAll('.opt').forEach(function(b){
    var i = +b.dataset.i;
    b.disabled = true;
    var isOk = q.ok.indexOf(i) !== -1;
    var wasPicked = state.selected.indexOf(i) !== -1;
    b.classList.remove('sel');
    if(isOk && wasPicked) b.classList.add('correct');
    else if(isOk && !wasPicked) b.classList.add(state.mode === 'exam' ? 'correct' : 'missed');
    else if(!isOk && wasPicked) b.classList.add('wrong');
  });

  if(state.mode === 'exam'){
    nextQuestion();
    return;
  }

  var last = state.idx === state.questions.length - 1;
  document.getElementById('after').innerHTML =
    '<div class="verdict ' + (correct ? 'ok' : 'ko') + '">' + (correct ? '✅ إجابة صحيحة' : '❌ إجابة خاطئة') + '</div>' +
    (q.exp ? '<div class="exp"><div class="exp-label">الشرح — Explication</div>' +
      '<div class="exp-fr">' + esc(q.exp) + '</div>' +
      (q.expa ? '<div class="exp-ar">' + esc(q.expa) + '</div>' : '') +
    '</div>' : '') +
    '<div class="answer-bar"><button class="big-btn" id="btn-next2">' + (last ? 'النتيجة 🏁' : 'التالي ⏭') + '</button></div>';
  document.getElementById('btn-next2').onclick = nextQuestion;
}

function nextQuestion(){
  if(state.idx + 1 >= state.questions.length){
    finishQuiz();
  } else {
    state.idx++;
    renderQuiz();
  }
}

function finishQuiz(){
  clearInterval(state.timer);
  if(state.mode === 'exam'){
    while(state.results.length < state.questions.length){
      var rq = state.questions[state.results.length];
      state.results.push({ q: rq, ok: false, picked: [], skipped: true });
    }
    stats.exams++;
    var okCount = state.results.filter(function(r){ return r.ok; }).length;
    if(okCount >= 32) stats.passed++;
  }
  saveStats();
  state.screen = 'result';
  render();
}

function renderResult(){
  var okCount = state.results.filter(function(r){ return r.ok; }).length;
  var total = state.results.length;
  var exam = state.mode === 'exam';
  var passed = !exam || okCount >= 32;
  var wrongs = state.results.filter(function(r){ return !r.ok; });

  var html =
    '<div class="card result-hero">' +
      '<div class="result-score ' + (passed ? 'ok' : 'ko') + '">' + okCount + ' / ' + total + '</div>' +
      '<div class="result-sub">' + (exam ? (passed ? '🎉 ناجح! (الحد الأدنى 32/40)' : '😕 راسب — تحتاج 32 إجابة صحيحة') : (okCount === total ? 'ممتاز! كل الإجابات صحيحة' : 'أكمل التدريب لتحسين نتيجتك')) + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<button class="big-btn" id="btn-again">' + (exam ? 'امتحان جديد' : 'تدريب جديد') + '</button>' +
      '<button class="ghost-btn" id="btn-gohome">🏠 الرئيسية</button>' +
    '</div>';

  if(wrongs.length){
    html += '<div class="card"><div class="mode-title">مراجعة الأخطاء (' + wrongs.length + ')</div>';
    wrongs.forEach(function(r, i){
      var q = r.q;
      html += '<div class="review-item">' +
        '<span class="mini">' + esc(THEMES[q.theme] || q.theme) + '</span>' +
        '<div class="q-fr" style="font-size:0.98rem">' + esc(q.q) + '</div>' +
        (q.qa ? '<div class="q-ar">' + esc(q.qa) + '</div>' : '') +
        '<div class="mini" style="direction:ltr;text-align:left">✔ ' + q.ok.map(function(i2){ return optionLetters(i2) + '. ' + esc(q.opts[i2].f); }).join(' &nbsp;·&nbsp; ') + '</div>' +
        (q.exp ? '<div class="exp-ar" style="margin-top:0.3rem">' + esc(q.expa || q.exp) + '</div>' : '') +
      '</div>';
    });
    html += '</div>';
  }

  app.innerHTML = html;
  document.getElementById('btn-again').onclick = function(){
    if(state.mode === 'exam') startQuiz('exam'); else startQuiz('train');
  };
  document.getElementById('btn-gohome').onclick = function(){ state.screen = 'home'; render(); };
}


/* ---------------- lessons mode ---------------- */
function lessonProgress(){
  var done = 0, total = 0;
  Object.keys(LESSONS).forEach(function(l){
    LESSONS[l].forEach(function(ls){ total++; if(stats.lessons[ls.id]) done++; });
  });
  return done + ' / ' + total + ' درساً مكتملاً';
}
function currentLesson(){
  var list = LESSONS[state.level] || [];
  for(var i = 0; i < list.length; i++) if(list[i].id === state.lessonId) return list[i];
  return null;
}
function renderLessons(){
  var m = LEVELS[state.level];
  var list = LESSONS[state.level] || [];
  var items = list.map(function(ls, i){
    var done = stats.lessons[ls.id];
    var nq = DATA.filter(function(q){ return ls.ids.indexOf(q.id) !== -1; }).length;
    return '<div class="lesson-item' + (done ? ' done' : '') + '" data-id="' + ls.id + '">' +
      '<span class="li-icon">' + ls.icon + '</span>' +
      '<span class="li-body">' +
        '<div class="li-fr">' + (i + 1) + '. ' + esc(ls.fr) + '</div>' +
        '<div class="li-ar">' + esc(ls.ar) + '</div>' +
        '<div class="li-meta">' + ls.slides.length + ' شرائح · ' + nq + ' سؤالاً' + (done ? ' · ✅ مكتمل' : '') + '</div>' +
      '</span>' +
      '<span class="li-check">' + (done ? '✅' : '▶️') + '</span>' +
    '</div>';
  }).join('');
  app.innerHTML =
    '<div class="progress-wrap">' +
      '<button class="icon-btn" id="btn-lback" title="رجوع">🔙</button>' +
      '<span class="score-pill">📚 وضع الدروس</span>' +
    '</div>' +
    '<div class="lvl-grid">' +
      Object.keys(LEVELS).map(function(l){
        var lm = LEVELS[l], n = (LESSONS[l] || []).length;
        var done = (LESSONS[l] || []).filter(function(ls){ return stats.lessons[ls.id]; }).length;
        return '<button class="lvl-btn' + (state.level === l ? ' active' : '') + '" data-lvl="' + l + '">' +
          '<span class="lvl-icon">' + lm.icon + '</span>' +
          '<span class="lvl-name">' + lm.name + '</span>' +
          '<span class="lvl-sub">' + lm.fr + ' · ' + done + '/' + n + '</span>' +
        '</button>';
      }).join('') +
    '</div>' +
    '<div class="card" style="margin-top:0.7rem"><div class="mode-title">' + m.icon + ' دروس مستوى ' + m.name + '</div>' +
    '<div class="mode-desc">افتح الدرس، اقرأ الشرح، ثم تدرّب على أسئلته.</div></div>' +
    items;
  document.getElementById('btn-lback').onclick = function(){ state.screen = 'home'; render(); };
  document.querySelectorAll('.lvl-btn').forEach(function(b){
    b.onclick = function(){ state.level = b.dataset.lvl; renderLessons(); };
  });
  document.querySelectorAll('.lesson-item').forEach(function(c){
    c.onclick = function(){ state.lessonId = c.dataset.id; state.slideIdx = 0; state.screen = 'lesson'; render(); };
  });
}
function renderLesson(){
  var ls = currentLesson();
  if(!ls){ state.screen = 'lessons'; render(); return; }
  var n = ls.slides.length;
  var last = state.slideIdx === n - 1;
  var sl = ls.slides[state.slideIdx];
  var nq = DATA.filter(function(q){ return ls.ids.indexOf(q.id) !== -1; }).length;
  app.innerHTML =
    '<div class="progress-wrap">' +
      '<button class="icon-btn" id="btn-lback2" title="الدروس">🔙</button>' +
      '<span class="progress-info">' + (state.slideIdx + 1) + ' / ' + n + '</span>' +
      '<div class="timerbar"><div style="width:' + Math.round((state.slideIdx + 1) * 100 / n) + '%"></div></div>' +
      '<span class="score-pill">' + ls.icon + ' ' + esc(ls.ar) + '</span>' +
      '<button class="icon-btn" id="btn-lspeak" title="نطق">🔊</button>' +
    '</div>' +
    '<div class="card">' +
      '<div class="mode-title">' + ls.icon + ' ' + esc(ls.fr) + '</div>' +
      '<div class="slide-card">' +
        '<div class="slide-fr">' + esc(sl.f) + '</div>' +
        '<div class="slide-ar">' + esc(sl.a) + '</div>' +
      '</div>' +
      '<div class="slide-nav">' +
        (state.slideIdx > 0 ? '<button class="ghost-btn" id="btn-lprev">السابق ⏮</button>' : '') +
        (last ? '<button class="big-btn" id="btn-lfinish">✅ أنهيت الدرس</button>'
              : '<button class="big-btn" id="btn-lnext">التالي ⏭</button>') +
      '</div>' +
    '</div>';
  document.getElementById('btn-lback2').onclick = function(){ state.screen = 'lessons'; render(); };
  document.getElementById('btn-lspeak').onclick = function(){ speakOnce(sl.f, this); };
  var bp = document.getElementById('btn-lprev');
  if(bp) bp.onclick = function(){ state.slideIdx--; renderLesson(); };
  var bn = document.getElementById('btn-lnext');
  if(bn) bn.onclick = function(){ state.slideIdx++; renderLesson(); };
  var bf = document.getElementById('btn-lfinish');
  if(bf) bf.onclick = function(){
    stats.lessons[ls.id] = 1;
    saveStats();
    app.innerHTML =
      '<div class="card result-hero">' +
        '<div class="result-score ok">✅</div>' +
        '<div class="result-sub">أنهيت درس «' + esc(ls.ar) + '» — الآن تدرّب على ' + nq + ' سؤالاً</div>' +
      '</div>' +
      '<div class="card">' +
        '<button class="big-btn" id="btn-lquiz">📝 تدرّب على هذا الدرس (' + nq + ' سؤالاً)</button>' +
        '<button class="ghost-btn" id="btn-llist">📚 لائحة الدروس</button>' +
      '</div>';
    document.getElementById('btn-lquiz').onclick = function(){
      var pool = DATA.filter(function(q){ return ls.ids.indexOf(q.id) !== -1; });
      state.mode = 'train';
      state.questions = shuffle(pool);
      state.idx = 0;
      state.results = [];
      state.screen = 'quiz';
      render();
    };
    document.getElementById('btn-llist').onclick = function(){ state.screen = 'lessons'; render(); };
  };
}

document.getElementById('btn-stop').onclick = stopSpeech;
document.getElementById('btn-home').onclick = function(){
  clearInterval(state.timer);
  state.screen = 'home';
  render();
};

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
