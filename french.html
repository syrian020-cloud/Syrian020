<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<title>Learn French — French / Arabic / English</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg-primary: #1a1a1a;
    --bg-secondary: #252525;
    --bg-tertiary: #333333;
    --text-primary: #e8e6e3;
    --text-secondary: #b8b5b0;
    --accent: #4a9eff;
    --accent-hover: #3a8eef;
    --danger: #ff6b6b;
    --success: #6bcb77;
    --gold: #ffc857;
    --border: #3d3d3d;
    --radius: 12px;
    --shadow: 0 4px 12px rgba(0,0,0,0.3);
  }
  [data-theme="light"] {
    --bg-primary: #f5f2eb;
    --bg-secondary: #ffffff;
    --bg-tertiary: #e8e5de;
    --text-primary: #2c2c2c;
    --text-secondary: #5c5c5c;
    --border: #d4d0c8;
    --shadow: 0 4px 12px rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    padding-bottom: 3rem;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .header-inner {
    max-width: 900px; margin: 0 auto; padding: 0.6rem 1rem;
    display: flex; align-items: center; gap: 0.6rem;
  }
  .logo { font-weight: 700; color: var(--accent); font-size: 1.05rem; white-space: nowrap; }
  .spacer { flex: 1; }
  .icon-btn {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.4rem 0.7rem; font-size: 1rem; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .lang-switch { display: flex; gap: 0.25rem; }
  .lang-btn {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.35rem 0.55rem; font-size: 0.78rem; font-weight: 700;
    cursor: pointer; min-width: 2.2rem;
  }
  .lang-btn:hover { border-color: var(--accent); }
  .lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding: 1rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  #search {
    flex: 1; min-width: 200px;
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.6rem 0.8rem; font-size: 1rem;
  }
  select.ctl {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.6rem 0.5rem; font-size: 0.9rem;
  }
  .breadcrumb {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.8rem;
  }
  .breadcrumb button {
    background: none; border: none; color: var(--accent);
    cursor: pointer; padding: 0; font-size: 0.9rem;
  }
  .stage-card, .lesson-card {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.9rem 1rem; margin-bottom: 0.6rem;
    cursor: pointer; display: flex; align-items: center; gap: 0.8rem;
    transition: border-color 0.2s, transform 0.1s;
  }
  .stage-card:hover, .lesson-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .num {
    min-width: 2.2rem; height: 2.2rem; border-radius: 50%;
    background: var(--bg-tertiary); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-weight: 700; }
  .card-sub { color: var(--text-secondary); font-size: 0.85rem; }
  .chev { color: var(--text-secondary); }
  .phrase {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.9rem; margin-bottom: 0.7rem;
  }
  .phrase.playing { border-color: var(--success); box-shadow: 0 0 0 1px var(--success); }
  .phrase-top { display: flex; gap: 0.6rem; align-items: flex-start; }
  .lines { flex: 1; min-width: 0; }
  .fr {
    direction: ltr; text-align: left; font-size: 1.15rem; font-weight: 700;
    color: var(--accent); word-wrap: break-word;
  }
  .fr .spk { color: var(--text-secondary); font-weight: 400; font-size: 0.85rem; }
  .ar { direction: rtl; text-align: right; font-size: 1.05rem; }
  .en { direction: ltr; text-align: left; color: var(--text-secondary); font-size: 0.95rem; }
  .line.active { background: rgba(107,203,119,0.14); border-radius: 6px; }
  .btns { display: flex; flex-direction: column; gap: 0.35rem; flex-shrink: 0; }
  .btns button {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    width: 2.4rem; height: 2.2rem; font-size: 1rem; cursor: pointer;
  }
  .btns button:hover { border-color: var(--accent); }
  .btns button.active { background: var(--success); color: #1a1a1a; border-color: var(--success); }
  .btns button.fav-on { color: var(--gold); border-color: var(--gold); }
  .lesson-head { margin-bottom: 1rem; }
  .lesson-head h2 { margin: 0 0 0.2rem; font-size: 1.25rem; }
  .lesson-head .sub { color: var(--text-secondary); font-size: 0.95rem; direction: ltr; text-align: initial; }
  .lesson-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.8rem 0; }
  .btn {
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); padding: 0.55rem 0.9rem;
    font-size: 0.95rem; cursor: pointer;
  }
  .btn.ghost { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
  .btn:hover { filter: brightness(1.08); }
  .empty { color: var(--text-secondary); text-align: center; padding: 2rem 1rem; }
  .hint {
    background: var(--bg-tertiary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.7rem 0.9rem;
    font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem;
  }
  .pill {
    display: inline-block; background: var(--bg-tertiary); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.1rem 0.6rem; font-size: 0.75rem; color: var(--text-secondary);
  }
  .searchmeta { color: var(--text-secondary); font-size: 0.8rem; margin-top: 0.4rem; }
  footer { text-align: center; color: var(--text-secondary); font-size: 0.8rem; padding: 1.5rem 1rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo">🇫🇷 <span data-t="appName">Learn French</span></span>
    <span class="spacer"></span>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ar">AR</button>
      <button class="lang-btn" data-lang="fr">FR</button>
    </div>
    <button class="icon-btn" id="btn-fav" data-t-title="favourites" title="Favourites">⭐</button>
    <button class="icon-btn" id="btn-theme" data-t-title="themeMode" title="Dark / light mode">🌙</button>
    <button class="icon-btn" id="btn-stop" data-t-title="stopAudio" title="Stop audio">⏹</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" data-t="searchPlaceholder" placeholder="Search in Arabic, French, or English…">
    <select class="ctl" id="rate" data-t-title="rateTitle" title="Speech rate">
      <option value="0.6">0.6×</option>
      <option value="0.8">0.8×</option>
      <option value="1" selected>1×</option>
      <option value="1.2">1.2×</option>
    </select>
    <select class="ctl" id="loopmode" data-t-title="loopModeTitle" title="Loop content">
      <option value="fr,ar,en" data-t="loopFrenchArabicEnglish" selected>🔁 French + Arabic + English</option>
      <option value="fr,ar" data-t="loopFrenchArabic">🔁 French + Arabic</option>
      <option value="fr" data-t="loopFrenchOnly">🔁 French only</option>
    </select>
  </div>
  <div id="view"></div>
</main>

<footer>
  <span data-t="footerText">Everyday phrases in France app · </span><a href="index.html" data-t="footerLink">My video lessons</a>
</footer>

<script src="data/manifest.js"></script>
<script>
(function () {
  'use strict';

  var STAGES = window.FR_STAGES || [];
  var loaded = {};          // stageId -> true when its phrases are loaded
  var loading = {};         // stageId -> Promise
  var view = document.getElementById('view');

  var state = {
    route: { name: 'stages' },
    loop: null,             // { key: string, langs: [] }
    favs: JSON.parse(localStorage.getItem('fr_favs') || '[]'),
    rate: 1,
    langs: ['fr', 'ar', 'en'],
    uiLang: localStorage.getItem('fr_ui_lang') || 'en'
  };

  /* ---------------- UI translations ---------------- */

  var UI = {
    appName: { en: 'Learn French', ar: 'تعلم الفرنسية', fr: 'Apprendre le français' },
    appTitle: { en: 'Learn French — French / Arabic / English', ar: 'تعلم الفرنسية — فرنسي / عربي / إنجليزي', fr: 'Apprendre le français — Français / Arabe / Anglais' },
    searchPlaceholder: { en: 'Search in Arabic, French, or English…', ar: 'ابحث بالعربية أو الفرنسية أو الإنجليزية…', fr: 'Rechercher en arabe, français ou anglais…' },
    rateTitle: { en: 'Speech rate', ar: 'سرعة النطق', fr: 'Vitesse de la voix' },
    loopModeTitle: { en: 'Loop content', ar: 'محتوى التكرار', fr: 'Contenu de la répétition' },
    loopFrenchArabicEnglish: { en: '🔁 French + Arabic + English', ar: '🔁 فرنسي + عربي + إنجليزي', fr: '🔁 Français + Arabe + Anglais' },
    loopFrenchArabic: { en: '🔁 French + Arabic', ar: '🔁 فرنسي + عربي', fr: '🔁 Français + Arabe' },
    loopFrenchOnly: { en: '🔁 French only', ar: '🔁 فرنسي فقط', fr: '🔁 Français seulement' },
    favourites: { en: 'Favourites', ar: 'المحفوظات', fr: 'Favoris' },
    themeMode: { en: 'Dark / light mode', ar: 'الوضع الليلي/النهاري', fr: 'Mode sombre / clair' },
    stopAudio: { en: 'Stop audio', ar: 'إيقاف الصوت', fr: 'Arrêter le son' },
    hintStages: { en: 'Choose a stage ← then a lesson. Each phrase has a 🔊 button to speak and a 🔁 button to repeat (French ← Arabic ← English) until you stop it.', ar: 'اختر المرحلة ← ثم الدرس. كل عبارة فيها زر 🔊 للنطق وزر 🔁 لتكرار النطق (فرنسي ← عربي ← إنجليزي) حتى توقفه.', fr: "Choisissez un stage ← puis une leçon. Chaque phrase a un bouton 🔊 pour parler et un bouton 🔁 pour répéter (français ← arabe ← anglais) jusqu'à l'arrêt." },
    stagesLabel: { en: 'Stages', ar: 'المراحل', fr: 'Stages' },
    lessons: { en: 'lessons', ar: 'دروس', fr: 'leçons' },
    phrases: { en: 'phrases', ar: 'عبارة', fr: 'phrases' },
    speakOnce: { en: 'Speak once', ar: 'نطق مرة واحدة', fr: 'Parler une fois' },
    loopTitle: { en: 'Repeat: French ← Arabic ← English', ar: 'تكرار: فرنسي ← عربي ← إنجليزي', fr: 'Répéter : Français ← Arabe ← Anglais' },
    favTitle: { en: 'Save', ar: 'حفظ', fr: 'Enregistrer' },
    playAll: { en: '▶ Play whole lesson', ar: '▶ تشغيل كل الدرس', fr: '▶ Lire toute la leçon' },
    stopAll: { en: '⏹ Stop', ar: '⏹ إيقاف', fr: '⏹ Arrêter' },
    loading: { en: '…Loading', ar: '…جاري التحميل', fr: '…Chargement' },
    lessonUnavailable: { en: 'Lesson not available', ar: 'الدرس غير متوفر', fr: 'Leçon non disponible' },
    loadStageFailed: { en: 'Could not load this stage\'s data', ar: 'تعذر تحميل بيانات هذه المرحلة', fr: 'Impossible de charger les données de ce stage' },
    savedPhrasesTitle: { en: '⭐ Saved phrases', ar: '⭐ العبارات المحفوظة', fr: '⭐ Phrases enregistrées' },
    noSavedPhrases: { en: 'No saved phrases yet. Tap ☆ next to any phrase to save it.', ar: 'لا توجد عبارات محفوظة بعد. اضغط ☆ بجانب أي عبارة لحفظها.', fr: 'Aucune phrase enregistrée. Appuyez sur ☆ à côté d\'une phrase pour l\'enregistrer.' },
    searchResults: { en: 'Search results', ar: 'نتائج البحث', fr: 'Résultats de recherche' },
    noResults: { en: 'No results', ar: 'لا نتائج', fr: 'Aucun résultat' },
    stageLabel: { en: 'Stage', ar: 'المرحلة', fr: 'Stage' },
    lessonLabel: { en: 'Lesson', ar: 'الدرس', fr: 'Leçon' },
    footerText: { en: 'Everyday phrases in France app · ', ar: 'تطبيق عبارات الحياة اليومية في فرنسا · ', fr: 'Application de phrases quotidiennes en France · ' },
    footerLink: { en: 'My video lessons', ar: 'دروسي المرئية', fr: 'Mes cours vidéo' },
    uiLangLabel: { en: 'Language', ar: 'اللغة', fr: 'Langue' },
    exitConfirm: { en: 'Do you want to exit the app?', ar: 'هل تريد الخروج من التطبيق؟', fr: 'Voulez-vous quitter l\'application ?' }
  };

  function t(key) {
    var v = UI[key];
    return (v && v[state.uiLang]) || (v && v.en) || (v && v.ar) || key;
  }
  function title(obj) {
    return (obj && obj[state.uiLang]) || (obj && obj.en) || (obj && obj.ar) || (obj && obj.fr) || '';
  }
  function subtitle(obj) {
    if (!obj) return '';
    if (state.uiLang === 'ar') return esc(obj.fr) + ' · ' + esc(obj.en);
    if (state.uiLang === 'en') return esc(obj.fr) + ' · ' + esc(obj.ar);
    return esc(obj.ar) + ' · ' + esc(obj.en);
  }
  function chevron() { return document.documentElement.dir === 'rtl' ? '‹' : '›'; }
  function applyTranslations() {
    document.title = t('appTitle');
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var key = el.dataset.t;
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = t(key);
      else el.textContent = t(key);
    });
    document.querySelectorAll('[data-t-title]').forEach(function (el) { el.title = t(el.dataset.tTitle); });
    var loopmode = document.getElementById('loopmode');
    if (loopmode) {
      [].forEach.call(loopmode.options, function (opt) { opt.textContent = t(opt.dataset.t); });
    }
  }
  function setUILang(lang) {
    state.uiLang = lang;
    localStorage.setItem('fr_ui_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === lang); });
    applyTranslations();
    go(state.route, false);
  }

  /* ---------------- data loading ---------------- */

  function loadStage(id) {
    if (loaded[id]) return Promise.resolve();
    if (loading[id]) return loading[id];
    loading[id] = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'data/stage' + (id < 10 ? '0' + id : id) + '.js';
      s.onload = function () { loaded[id] = true; resolve(); };
      s.onerror = function () { reject(new Error('failed to load stage ' + id)); };
      document.head.appendChild(s);
    });
    return loading[id];
  }

  function loadAll() {
    return Promise.all(STAGES.map(function (st) { return loadStage(st.id); }));
  }

  window.registerStage = function (data) {
    var stage = STAGES.filter(function (s) { return s.id === data.id; })[0];
    if (!stage) { STAGES.push(data); return; }
    stage.lessons = data.lessons;
  };

  function findStage(id) {
    return STAGES.filter(function (s) { return s.id === id; })[0];
  }
  function findLesson(stageId, lessonId) {
    var st = findStage(stageId);
    if (!st || !st.lessons) return null;
    return st.lessons.filter(function (l) { return l.id === lessonId; })[0];
  }

  /* ---------------- speech ---------------- */

  var VOICE_LANG = { fr: 'fr-FR', ar: 'ar-SA', en: 'en-US' };
  var speechRun = 0;         // bumped on every new pass and on stop

  function nativeTTS() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) return window.Capacitor.Plugins.TextToSpeech;
    if (window.Capacitor && window.Capacitor.registerPlugin) {
      window.Capacitor.Plugins = window.Capacitor.Plugins || {};
      window.Capacitor.Plugins.TextToSpeech = window.Capacitor.registerPlugin('TextToSpeech');
      return window.Capacitor.Plugins.TextToSpeech;
    }
    return null;
  }
  function nativeSpeak(text, lang) {
    var tts = nativeTTS();
    if (!tts) return Promise.reject('no tts');
    return tts.speak({ text: text, lang: VOICE_LANG[lang] || 'en-US', rate: state.rate || 1, queueStrategy: 1 });
  }
  function nativeStop() {
    var tts = nativeTTS(); if (!tts) return Promise.resolve(); return tts.stop();
  }

  function speakSupported() { return !!nativeTTS() || 'speechSynthesis' in window; }

  function pickVoice(lang) {
    if (!speakSupported()) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var code = VOICE_LANG[lang];
    var exact = voices.filter(function (v) { return v.lang && v.lang.replace('_', '-') === code; })[0];
    if (exact) return exact;
    var prefix = code.split('-')[0];
    return voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; })[0] || null;
  }

  function utter(text, lang) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE_LANG[lang];
    u.rate = lang === 'fr' ? state.rate * 0.95 : state.rate;
    var v = pickVoice(lang);
    if (v) u.voice = v;
    return u;
  }

  function stopSpeech() {
    state.loop = null;
    speechRun++;
    if (nativeTTS()) nativeStop();
    else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    highlight(null, null);
    refreshButtons();
  }

  // Speaks one pass: French, then Arabic, then English (per selected mode).
  // Every pass carries a run id; stopSpeech() bumps it so pending steps abort.
  function speakOnce(phrase, langs, key, onDone) {
    var seq = langs.filter(function (l) { return phrase[l]; });
    var i = 0;
    var run = ++speechRun;
    if (nativeTTS()) {
      nativeStop();
      (function next() {
        if (run !== speechRun) return;
        if (i >= seq.length) { highlight(null, null); if (onDone) onDone(); return; }
        var lang = seq[i++];
        highlight(key, lang);
        nativeSpeak(phrase[lang], lang).then(function () {
          if (run !== speechRun) return;
          setTimeout(next, 250);
        }).catch(function () {
          if (run !== speechRun) return;
          setTimeout(next, 250);
        });
      })();
      return;
    }
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    (function next() {
      if (run !== speechRun) return;
      if (i >= seq.length) { highlight(null, null); if (onDone) onDone(); return; }
      var lang = seq[i++];
      var u = utter(phrase[lang], lang);
      highlight(key, lang);
      u.onend = function () {
        if (run !== speechRun) return;
        setTimeout(next, 250);
      };
      u.onerror = function () {
        if (run !== speechRun) return;
        setTimeout(next, 250);
      };
      window.speechSynthesis.speak(u);
    })();
  }

  function toggleLoop(phrase, key) {
    if (state.loop && state.loop.key === key) { stopSpeech(); return; }
    state.loop = { key: key };
    refreshButtons();
    (function cycle() {
      if (!state.loop || state.loop.key !== key) return;
      speakOnce(phrase, state.langs, key, function () {
        if (!state.loop || state.loop.key !== key) return;
        setTimeout(cycle, 600);
      });
    })();
  }

  function highlight(key, lang) {
    document.querySelectorAll('.phrase').forEach(function (el) {
      var on = key && el.dataset.key === key;
      el.classList.toggle('playing', !!on);
      el.querySelectorAll('.line').forEach(function (line) {
        line.classList.toggle('active', !!on && line.dataset.lang === lang);
      });
    });
  }

  function refreshButtons() {
    document.querySelectorAll('.phrase').forEach(function (el) {
      var btn = el.querySelector('.loop-btn');
      if (!btn) return;
      var on = state.loop && state.loop.key === el.dataset.key;
      btn.classList.toggle('active', !!on);
      btn.textContent = on ? '⏸' : '🔁';
    });
  }

  /* ---------------- favourites ---------------- */

  function isFav(key) { return state.favs.indexOf(key) !== -1; }
  function toggleFav(key) {
    var i = state.favs.indexOf(key);
    if (i === -1) state.favs.push(key); else state.favs.splice(i, 1);
    localStorage.setItem('fr_favs', JSON.stringify(state.favs));
  }

  /* ---------------- rendering ---------------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function phraseKey(stageId, lessonId, idx) { return stageId + '.' + lessonId + '.' + idx; }

  function phraseHTML(p, key) {
    return '<div class="phrase" data-key="' + key + '">' +
      '<div class="phrase-top">' +
        '<div class="lines">' +
          '<div class="line fr" data-lang="fr">' + esc(p.fr) +
            (p.tr ? ' <span class="spk">[' + esc(p.tr) + ']</span>' : '') + '</div>' +
          '<div class="line ar" data-lang="ar">' + esc(p.ar) + '</div>' +
          '<div class="line en" data-lang="en">' + esc(p.en) + '</div>' +
        '</div>' +
        '<div class="btns">' +
          '<button class="speak-btn" title="' + t('speakOnce') + '">🔊</button>' +
          '<button class="loop-btn" title="' + t('loopTitle') + '">🔁</button>' +
          '<button class="fav-btn ' + (isFav(key) ? 'fav-on' : '') + '" title="' + t('favTitle') + '">' +
            (isFav(key) ? '★' : '☆') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderStages() {
    var html = '<div class="hint">' + t('hintStages') + '</div>';
    html += STAGES.map(function (st) {
      return '<div class="stage-card" data-stage="' + st.id + '">' +
        '<div class="num">' + st.id + '</div>' +
        '<div class="card-body">' +
          '<div class="card-title">' + esc(title(st.title)) + '</div>' +
          '<div class="card-sub" dir="ltr">' + subtitle(st.title) + '</div>' +
          '<div class="card-sub">' + st.lessonTitles.length + ' ' + t('lessons') + '</div>' +
        '</div>' +
        '<div class="chev">' + chevron() + '</div>' +
      '</div>';
    }).join('');
    view.innerHTML = html;
  }

  function renderLessons(stageId) {
    var st = findStage(stageId);
    if (!st) { renderStages(); return; }
    var html = crumbs([{ label: t('stagesLabel'), route: { name: 'stages' } }, { label: title(st.title) }]);
    html += '<div class="lesson-head"><h2>' + st.id + '. ' + esc(title(st.title)) + '</h2>' +
      '<div class="sub" dir="ltr">' + subtitle(st.title) + '</div></div>';
    html += st.lessonTitles.map(function (l) {
      return '<div class="lesson-card" data-stage="' + st.id + '" data-lesson="' + l.id + '">' +
        '<div class="num">' + l.id + '</div>' +
        '<div class="card-body">' +
          '<div class="card-title">' + esc(title(l)) + '</div>' +
          '<div class="card-sub" dir="ltr">' + subtitle(l) + '</div>' +
        '</div>' +
        '<div class="chev">' + chevron() + '</div>' +
      '</div>';
    }).join('');
    view.innerHTML = html;
  }

  function renderLesson(stageId, lessonId) {
    var st = findStage(stageId);
    view.innerHTML = '<div class="empty">' + t('loading') + '</div>';
    loadStage(stageId).then(function () {
      var lesson = findLesson(stageId, lessonId);
      if (!lesson) { view.innerHTML = '<div class="empty">' + t('lessonUnavailable') + '</div>'; return; }
      var html = crumbs([
        { label: t('stagesLabel'), route: { name: 'stages' } },
        { label: title(st.title), route: { name: 'lessons', stage: stageId } },
        { label: title(lesson.title) }
      ]);
      html += '<div class="lesson-head"><h2>' + t('lessonLabel') + ' ' + lesson.id + ': ' + esc(title(lesson.title)) + '</h2>' +
        '<div class="sub" dir="ltr">' + subtitle(lesson.title) + '</div></div>';
      html += '<div class="lesson-actions">' +
        '<button class="btn" id="play-all">' + t('playAll') + '</button>' +
        '<button class="btn ghost" id="stop-all">' + t('stopAll') + '</button>' +
        '<span class="pill">' + lesson.phrases.length + ' ' + t('phrases') + '</span>' +
      '</div>';
      html += lesson.phrases.map(function (p, i) {
        return phraseHTML(p, phraseKey(stageId, lessonId, i));
      }).join('');
      view.innerHTML = html;

      document.getElementById('play-all').onclick = function () { playLesson(lesson, stageId, lessonId); };
      document.getElementById('stop-all').onclick = stopSpeech;
    }).catch(function () {
      view.innerHTML = '<div class="empty">' + t('loadStageFailed') + '</div>';
    });
  }

  function playLesson(lesson, stageId, lessonId) {
    stopSpeech();
    var i = 0;
    var runKey = 'lesson:' + stageId + '.' + lessonId;
    state.loop = { key: runKey };
    (function next() {
      if (!state.loop || state.loop.key !== runKey) return;
      if (i >= lesson.phrases.length) { stopSpeech(); return; }
      var p = lesson.phrases[i];
      var key = phraseKey(stageId, lessonId, i);
      i++;
      var el = document.querySelector('.phrase[data-key="' + key + '"]');
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      speakOnce(p, state.langs, null, function () {
        if (!state.loop || state.loop.key !== runKey) return;
        setTimeout(next, 400);
      });
      highlight(key, 'fr');
    })();
  }

  function renderFavs() {
    view.innerHTML = '<div class="empty">' + t('loading') + '</div>';
    loadAll().then(function () {
      var items = [];
      state.favs.forEach(function (key) {
        var parts = key.split('.');
        var lesson = findLesson(+parts[0], +parts[1]);
        if (!lesson) return;
        var p = lesson.phrases[+parts[2]];
        if (p) items.push({ p: p, key: key, lesson: lesson });
      });
      var html = crumbs([{ label: t('stagesLabel'), route: { name: 'stages' } }, { label: t('favourites') }]);
      html += '<div class="lesson-head"><h2>' + t('savedPhrasesTitle') + '</h2></div>';
      html += items.length
        ? items.map(function (it) {
            return '<div class="pill">' + esc(title(it.lesson.title)) + '</div>' + phraseHTML(it.p, it.key);
          }).join('')
        : '<div class="empty">' + t('noSavedPhrases') + '</div>';
      view.innerHTML = html;
    });
  }

  function renderSearch(q) {
    view.innerHTML = '<div class="empty">' + t('loading') + '</div>';
    loadAll().then(function () {
      var needle = q.trim().toLowerCase();
      var results = [];
      STAGES.forEach(function (st) {
        (st.lessons || []).forEach(function (l) {
          l.phrases.forEach(function (p, i) {
            var hay = (p.fr + ' ' + p.ar + ' ' + p.en).toLowerCase();
            if (hay.indexOf(needle) !== -1) {
              results.push({ p: p, key: phraseKey(st.id, l.id, i), stage: st, lesson: l });
            }
            if (results.length > 300) return;
          });
        });
      });
      var html = '<div class="lesson-head"><h2>' + t('searchResults') + ': ' + esc(q) + '</h2>' +
        '<div class="sub">' + results.length + ' ' + t('phrases') + '</div></div>';
      html += results.length
        ? results.map(function (r) {
            return phraseHTML(r.p, r.key) +
              '<div class="searchmeta">' + t('stageLabel') + ' ' + r.stage.id + ' · ' + t('lessonLabel') + ' ' + r.lesson.id + ' — ' + esc(title(r.lesson.title)) + '</div>';
          }).join('')
        : '<div class="empty">' + t('noResults') + '</div>';
      view.innerHTML = html;
    });
  }

  function crumbs(items) {
    return '<div class="breadcrumb">' + items.map(function (it, i) {
      var sep = i ? '<span>›</span>' : '';
      if (it.route) {
        return sep + '<button data-route=\'' + JSON.stringify(it.route) + '\'>' + esc(it.label) + '</button>';
      }
      return sep + '<span>' + esc(it.label) + '</span>';
    }).join('') + '</div>';
  }

  /* ---------------- routing ---------------- */

  function go(route, push) {
    stopSpeech();
    state.route = route;
    if (push !== false) {
      var hash = route.name === 'stages' ? '#/'
        : route.name === 'lessons' ? '#/stage/' + route.stage
        : route.name === 'lesson' ? '#/stage/' + route.stage + '/lesson/' + route.lesson
        : route.name === 'favs' ? '#/favs' : '#/';
      if (location.hash !== hash) location.hash = hash;
    }
    if (route.name === 'stages') renderStages();
    else if (route.name === 'lessons') renderLessons(route.stage);
    else if (route.name === 'lesson') renderLesson(route.stage, route.lesson);
    else if (route.name === 'favs') renderFavs();
    else if (route.name === 'search') renderSearch(route.q);
    window.scrollTo(0, 0);
  }

  function routeFromHash() {
    var h = location.hash.replace(/^#\/?/, '');
    var m;
    if ((m = h.match(/^stage\/(\d+)\/lesson\/(\d+)$/))) return { name: 'lesson', stage: +m[1], lesson: +m[2] };
    if ((m = h.match(/^stage\/(\d+)$/))) return { name: 'lessons', stage: +m[1] };
    if (h === 'favs') return { name: 'favs' };
    return { name: 'stages' };
  }

  window.addEventListener('hashchange', function () { go(routeFromHash(), false); });

  function goBack() {
    if (state.route.name === 'lesson') go({ name: 'lessons', stage: state.route.stage });
    else if (state.route.name === 'lessons') go({ name: 'stages' });
    else if (state.route.name === 'search' || state.route.name === 'favs') go({ name: 'stages' });
    else {
      var app = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) || null;
      if (window.confirm(t('exitConfirm')) && app && app.exitApp) app.exitApp();
    }
  }

  /* ---------------- events ---------------- */

  document.addEventListener('click', function (e) {
    var routeBtn = e.target.closest('[data-route]');
    if (routeBtn) { go(JSON.parse(routeBtn.dataset.route)); return; }

    var lessonCard = e.target.closest('.lesson-card');
    if (lessonCard) {
      go({ name: 'lesson', stage: +lessonCard.dataset.stage, lesson: +lessonCard.dataset.lesson });
      return;
    }
    var stageCard = e.target.closest('.stage-card');
    if (stageCard) { go({ name: 'lessons', stage: +stageCard.dataset.stage }); return; }

    var phraseEl = e.target.closest('.phrase');
    if (!phraseEl) return;
    var key = phraseEl.dataset.key;
    var parts = key.split('.');
    var lesson = findLesson(+parts[0], +parts[1]);
    var p = lesson && lesson.phrases[+parts[2]];
    if (!p) return;

    if (e.target.closest('.speak-btn')) { stopSpeech(); speakOnce(p, state.langs, null); return; }
    if (e.target.closest('.loop-btn')) { toggleLoop(p, key); return; }
    if (e.target.closest('.fav-btn')) {
      toggleFav(key);
      var btn = e.target.closest('.fav-btn');
      btn.classList.toggle('fav-on', isFav(key));
      btn.textContent = isFav(key) ? '★' : '☆';
    }
  });

  var searchInput = document.getElementById('search');
  var searchTimer;
  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    var q = searchInput.value;
    searchTimer = setTimeout(function () {
      if (q.trim().length >= 2) { state.route = { name: 'search', q: q }; renderSearch(q); }
      else go(routeFromHash(), false);
    }, 350);
  });

  document.getElementById('rate').addEventListener('change', function (e) {
    state.rate = parseFloat(e.target.value);
    localStorage.setItem('fr_rate', e.target.value);
  });
  document.getElementById('loopmode').addEventListener('change', function (e) {
    state.langs = e.target.value.split(',');
    localStorage.setItem('fr_langs', e.target.value);
  });
  document.getElementById('btn-stop').addEventListener('click', stopSpeech);
  document.getElementById('btn-fav').addEventListener('click', function () { go({ name: 'favs' }); });
  document.getElementById('btn-theme').addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('fr_theme', next);
  });

  /* ---------------- init ---------------- */

  document.documentElement.dataset.theme = localStorage.getItem('fr_theme') || 'dark';
  var savedRate = localStorage.getItem('fr_rate');
  if (savedRate) { state.rate = parseFloat(savedRate); document.getElementById('rate').value = savedRate; }
  var savedLangs = localStorage.getItem('fr_langs');
  if (savedLangs) { state.langs = savedLangs.split(','); document.getElementById('loopmode').value = savedLangs; }
  document.querySelector('.lang-switch').addEventListener('click', function (e) {
    var btn = e.target.closest('.lang-btn');
    if (btn) setUILang(btn.dataset.lang);
  });

  if (!nativeTTS() && 'speechSynthesis' in window) window.speechSynthesis.getVoices();
  window.addEventListener('beforeunload', function () { if (speakSupported()) window.speechSynthesis.cancel(); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  var AppPlugin = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) || null;
  if (AppPlugin && AppPlugin.addListener) {
    AppPlugin.addListener('backButton', function () { goBack(); });
  }

  state.route = routeFromHash();
  setUILang(state.uiLang);
})();
</script>
</body>
</html>
