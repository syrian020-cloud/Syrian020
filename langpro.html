<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>langPro</title>
<link rel="manifest" href="./manifest-langpro.json">
<link rel="icon" type="image/png" href="./icon-prolang-192.png">
<style>
  :root {
    --bg: #070b18; --card: #0e1330; --card2: #101427; --field: #0b102a;
    --line: rgba(139, 92, 246, .18); --accent: #8b5cf6; --accent2: #6366f1;
    --txt: #e8eaf6; --dim: #9aa3c7; --gold: #f5c451;
    --danger: #f87171;
  }
  body.light {
    --bg: #f2f4fb; --card: #ffffff; --card2: #eef0fa; --field: #f6f7fd;
    --line: rgba(99, 102, 241, .22); --accent: #6366f1; --accent2: #8b5cf6;
    --txt: #1a1e3d; --dim: #5a6390; --gold: #b8860b;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--txt);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif; overflow-x: clip; }
  body { min-height: 100vh; padding-bottom: 3rem; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(620px 300px at 85% -4%, rgba(139,92,246,.18), transparent 62%),
      radial-gradient(480px 260px at -8% 32%, rgba(99,102,241,.10), transparent 62%); }
  body.light::before { background:
    radial-gradient(620px 300px at 85% -4%, rgba(99,102,241,.10), transparent 62%),
    radial-gradient(480px 260px at -8% 32%, rgba(139,92,246,.07), transparent 62%); }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 100; background: rgba(7,11,24,.72);
    backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35);
    border-bottom: 1px solid var(--line); padding: .6rem .9rem; }
  body.light header { background: rgba(242,244,251,.78); }
  .topbar { display: flex; align-items: center; gap: .5rem; max-width: 860px; margin: 0 auto;
    flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: .5rem; font-weight: 900; font-size: 1.1rem;
    flex: none; min-width: 0; letter-spacing: .2px; }
  .logo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: linear-gradient(90deg, #c4b5fd, #818cf8); -webkit-background-clip: text;
    background-clip: text; -webkit-text-fill-color: transparent; }
  body.light .logo span { background: linear-gradient(90deg, #4f46e5, #7c3aed);
    -webkit-background-clip: text; background-clip: text; }
  .logo img { width: 32px; height: 32px; border-radius: 10px; flex: none;
    box-shadow: 0 4px 12px rgba(99,102,241,.35); }
  .searchbox { flex: 1; display: flex; align-items: center; gap: .4rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: .42rem .7rem; transition: border-color .15s ease, box-shadow .15s ease; }
  .searchbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
  .searchbox input { flex: 1; background: none; border: none; outline: none;
    color: var(--txt); font-size: .9rem; font-family: inherit; min-width: 0; }
  .iconbtn { background: var(--card); border: 1px solid var(--line); color: var(--txt);
    border-radius: 12px; padding: .4rem .65rem; font-size: 1rem; cursor: pointer; flex: none;
    font-family: inherit; transition: transform .12s ease; }
  .iconbtn:active { transform: scale(.92); }
  .iconbtn.on { border-color: var(--gold); color: var(--gold); }
  @media (max-width: 619px) {
    .logo { flex: 1; }
    .searchbox { order: 5; flex: 1 1 100%; }
  }

  main { max-width: 860px; margin: 0 auto; padding: .8rem; }

  /* ---------- sites grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(112px, 100%), 1fr)); gap: .7rem; }
  .site { background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: .95rem .55rem .75rem; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: .5rem; min-width: 0; position: relative;
    box-shadow: 0 4px 14px rgba(3,6,18,.22);
    transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease; }
  body.light .site { box-shadow: 0 4px 14px rgba(90,99,144,.10); }
  .site:active { transform: scale(.95) translateY(1px); border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(124,58,237,.25); }
  .site-icon { width: 56px; height: 56px; border-radius: 18px; flex: none; display: flex;
    align-items: center; justify-content: center; font-weight: 900; font-size: 1.45rem;
    color: #fff; overflow: hidden; background: linear-gradient(135deg, #4338ca, #7c3aed);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 5px 12px rgba(67,56,202,.4); }
  .site-icon img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
  .site-name { font-weight: 800; font-size: .82rem; line-height: 1.25; text-align: center;
    max-width: 100%; overflow-wrap: anywhere; letter-spacing: .15px; }
  .site-dots { position: absolute; top: .3rem; inset-inline-end: .3rem; background: none;
    border: none; color: var(--dim); font-size: 1.05rem; cursor: pointer; padding: .1rem .3rem;
    font-family: inherit; }
  .site-dots:active { color: var(--accent); }
  .site-map { position: absolute; top: .3rem; inset-inline-start: .3rem; background: none;
    border: none; font-size: .95rem; cursor: pointer; padding: .1rem .25rem;
    font-family: inherit; filter: grayscale(.15); }
  .site-map:active { transform: scale(1.15); }
  .site-badges { display: flex; gap: .3rem; flex-wrap: wrap; justify-content: center; }
  .badge { font-size: .62rem; font-weight: 700; padding: .14rem .42rem; border-radius: 999px;
    background: rgba(139,92,246,.15); color: var(--accent); border: 1px solid rgba(139,92,246,.35);
    cursor: pointer; font-family: inherit; line-height: 1.2; }
  .badge.gold { background: rgba(246,185,59,.13); color: var(--gold);
    border-color: rgba(246,185,59,.35); }
  .badge:active { transform: scale(1.12); }
  .site-badges span.badge { cursor: default; }

  .add-card { border: 1.5px dashed var(--line); background: transparent; color: var(--dim);
    font-size: 1.8rem; border-radius: 20px; }
  .add-card:active { border-color: var(--accent); color: var(--accent); }

  /* ---------- toast ---------- */
  #toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
    background: #1a1f3d; border: 1px solid var(--line); color: #e8eaf6;
    border-radius: 14px; padding: .55rem 1rem; font-size: .82rem; z-index: 5000;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }

  /* ---------- sheets & dialogs ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(3,6,18,.66); backdrop-filter: blur(4px);
    z-index: 4000; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; background: var(--card2);
    border: 1px solid var(--line); border-bottom: none; border-radius: 26px 26px 0 0;
    padding: .8rem 1.2rem 1.6rem; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 -14px 44px rgba(0,0,0,.45); }
  .sheet::before { content: ''; display: block; width: 42px; height: 4px; border-radius: 4px;
    background: var(--line); margin: 0 auto .8rem; }
  .sheet h3 { margin: 0 0 .8rem; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 button { background: none; border: none; color: var(--dim); font-size: 1.2rem; cursor: pointer; }

  .flabel { font-size: .72rem; color: var(--dim); margin: .55rem 0 .25rem; }
  .frow { display: flex; gap: .4rem; align-items: center; }
  .field { flex: 1; display: flex; align-items: center; gap: .4rem; min-width: 0;
    background: var(--field); border: 1px solid var(--line); border-radius: 14px;
    padding: .55rem .7rem; transition: border-color .15s ease, box-shadow .15s ease; }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,.14); }
  .field input { flex: 1; background: none; border: none; outline: none; color: var(--txt);
    font-size: .88rem; font-family: inherit; min-width: 0; }
  .field input[readonly] { color: var(--dim); }
  .field input[type=password] { letter-spacing: .1em; }
  .mini { flex: none; background: var(--card); border: 1px solid var(--line); color: var(--txt);
    border-radius: 10px; padding: .35rem .6rem; font-size: .75rem; cursor: pointer; font-family: inherit; }
  .mini:active { background: var(--accent); color: #fff; }

  .actions { display: flex; gap: .5rem; margin-top: .9rem; }
  .btn { flex: 1; border: 1px solid var(--line); border-radius: 14px; padding: .7rem;
    font-size: .9rem; cursor: pointer; font-family: inherit; background: var(--card); color: var(--txt);
    transition: transform .12s ease; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none;
    color: #fff; font-weight: 700; box-shadow: 0 6px 18px rgba(99,102,241,.35); }
  .btn.danger { color: var(--danger); border-color: rgba(248,113,113,.4); }

  .mrow { display: flex; align-items: center; gap: .7rem; width: 100%; background: rgba(139,92,246,.07);
    border: 1px solid var(--line); border-radius: 16px; padding: .8rem 1rem; margin-bottom: .55rem;
    color: var(--txt); font-size: .9rem; cursor: pointer; font-family: inherit; text-align: start; }
  body.light .mrow { background: rgba(99,102,241,.06); }
  .mrow:active { background: rgba(139,92,246,.16); }
  .mrow .mi { font-size: 1.1rem; width: 1.6rem; text-align: center; flex: none; }
  .langs { display: flex; gap: .5rem; margin-bottom: .7rem; }
  .langb { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--txt);
    border-radius: 14px; padding: .6rem; font-size: .85rem; cursor: pointer; font-family: inherit; }
  .langb.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; font-weight: 700; }

  .dlg { width: 100%; max-width: 340px; background: var(--card2); border: 1px solid var(--line);
    border-radius: 22px; padding: 1.3rem; text-align: center; margin: auto 1rem;
    max-height: 86vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .dlg p { font-size: .95rem; margin: 0 0 1rem; }
  .dlg .row { display: flex; gap: .6rem; }
  .dlg button { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: .6rem;
    font-size: .9rem; cursor: pointer; font-family: inherit; background: var(--card); color: var(--txt); }
  .dlg button.yes { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; font-weight: 700; }

  /* ---------- passcode lock ---------- */
  #lock { position: fixed; inset: 0; z-index: 6000; display: flex; align-items: center;
    justify-content: center; background: var(--bg);
    background-image: radial-gradient(520px 330px at 50% 16%, rgba(139,92,246,.22), transparent 65%); }
  body.light #lock { background-image: radial-gradient(520px 330px at 50% 16%, rgba(99,102,241,.14), transparent 65%); }
  #lock .lk { width: min(320px, 86vw); text-align: center; }
  #lock .lk-ico { width: 74px; height: 74px; margin: 0 auto .9rem; border-radius: 24px;
    display: flex; align-items: center; justify-content: center; font-size: 2rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 10px 30px rgba(124,58,237,.35); }
  #lock h2 { margin: 0 0 .2rem; font-size: 1.05rem; }
  #lock .sub { color: var(--dim); font-size: .78rem; margin-bottom: 1.1rem; }
  #lock .pinrow { display: flex; gap: .5rem; }
  #lock .pinrow input { flex: 1; min-width: 0; background: var(--field);
    border: 1px solid var(--line); border-radius: 14px; padding: .8rem; color: var(--txt);
    font-size: 1.25rem; text-align: center; letter-spacing: .55em; font-family: inherit;
    outline: none; transition: border-color .15s ease; }
  #lock .pinrow input:focus { border-color: var(--accent); }
  #lock .pinrow button { flex: none; border: none; border-radius: 14px; padding: 0 1.15rem;
    font-size: 1.15rem; color: #fff; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  #lock .pinrow button:active { transform: scale(.94); }
  #lock .lmsg { min-height: 1.2rem; margin-top: .7rem; font-size: .8rem; color: var(--danger); }

  /* ---------- attachments ---------- */
  .att-add { display: flex; gap: .4rem; margin: .15rem 0 .5rem; }
  .att-add .mini { flex: 1; padding: .5rem .6rem; font-size: .8rem; }
  .attlist { display: flex; flex-direction: column; gap: .4rem; }
  .att { display: flex; align-items: center; gap: .55rem; background: var(--field);
    border: 1px solid var(--line); border-radius: 12px; padding: .4rem .55rem; cursor: pointer; }
  .att:active { border-color: var(--accent); }
  .att .thumb, img.thumb { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; flex: none;
    background: var(--card); display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; overflow: hidden; }
  .att .an { flex: 1; min-width: 0; font-size: .78rem; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .att .ax { flex: none; background: none; border: none; color: var(--dim); font-size: .9rem;
    cursor: pointer; padding: .1rem .3rem; font-family: inherit; }
  .att .ax:active { color: var(--danger); }
  .imgview { position: fixed; inset: 0; z-index: 5500; background: rgba(3,6,18,.93);
    display: flex; align-items: center; justify-content: center; padding: 1.4rem; }
  .imgview img { max-width: 100%; max-height: 100%; border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); }

  .hidden { display: none !important; }

  /* ---------- lesson list ---------- */
  .lrow { display: flex; align-items: center; gap: .55rem; background: var(--card2);
    border: 1px solid var(--line); border-radius: 14px; padding: .55rem .7rem; cursor: pointer; }
  .lrow:active { border-color: var(--accent); }
  .lrow .lic { font-size: 1.15rem; flex: none; }
  .licprev { flex: none; width: 34px; height: 34px; border-radius: 10px; overflow: hidden;
    background: var(--field); border: 1px solid var(--line); display: flex;
    align-items: center; justify-content: center; }
  .licprev img { width: 100%; height: 100%; object-fit: cover; }
  .lrow .ln { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 700; font-size: .88rem; }
  .lrow .lc { font-size: .7rem; color: var(--dim); flex: none; }

  /* ---------- lesson player ---------- */
  .lov { position: fixed; inset: 0; z-index: 4400; background: var(--bg);
    display: flex; flex-direction: column; }
  .lov-top { display: flex; align-items: center; gap: .5rem; padding: .55rem .8rem;
    border-bottom: 1px solid var(--line); flex: none; }
  .lov-top .lt { flex: 1; min-width: 0; font-weight: 800; font-size: .95rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lov-top .iconbtn { padding: .3rem .55rem; font-size: .9rem; }
  .lov-media { position: relative; flex: none; background: #000; max-height: 42vh;
    display: flex; justify-content: center; overflow: hidden; }
  .lov-media video { width: 100%; max-height: 42vh; display: block; position: relative; z-index: 1; }
  .lov-media video.lov-bgv { position: absolute; inset: 0; z-index: 0; width: 100%;
    height: 100%; max-height: none; object-fit: cover; transform: scale(1.12);
    filter: blur(22px) brightness(.5) saturate(1.5); pointer-events: none; }
  .lov-media audio { width: 100%; }
  /* ---------- ProLang featured phrase + tools ---------- */
  .cue-now { text-align: center; font-size: 1rem; font-weight: 800; line-height: 1.4;
    padding: .4rem .3rem .1rem; min-height: 1.5rem; overflow-wrap: anywhere;
    flex: none; max-height: 38vh; overflow-y: auto; }
  .cue-now .cue-line { position: relative; display: flex; align-items: center; gap: .7rem;
    direction: ltr; border-radius: 22px; border-width: 2px; border-style: solid;
    padding: .45rem .95rem; margin: .3rem auto; font-weight: 800; font-size: 1.12rem;
    width: 100%; box-sizing: border-box; overflow-wrap: anywhere; text-align: center;
    line-height: 1.45; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .cue-now .cue-line > span:last-child { flex: 1; min-width: 0; }
  .cue-line { font-family: 'Segoe UI','Noto Sans',Roboto,'Helvetica Neue',sans-serif;
    letter-spacing: .01em; cursor: pointer; }
  .cue-line.spk-on { outline: 3px solid rgba(255,255,255,.7); }
  .cue-line .cue-flag { position: static; transform: none; font-size: 1.7rem;
    line-height: 1; flex: none; }
  .cue-line.lg-fr { background: var(--cap-fr-bg, #3d3d3d); color: var(--cap-fr-fg, #fff);
    border-color: var(--cap-fr-bd, transparent);
    font-family: var(--cap-fr-font, Georgia, 'Times New Roman', 'Segoe UI', serif);
    font-style: var(--cap-fr-style, italic); }
  .cue-line.lg-ar { background: var(--cap-ar-bg, #d9a21b); color: var(--cap-ar-fg, #33260a);
    border-color: var(--cap-ar-bd, transparent);
    font-family: var(--cap-ar-font, 'Noto Kufi Arabic', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif);
    font-style: var(--cap-ar-style, normal); font-size: 1.2rem; }
  .cue-line.lg-en { background: var(--cap-en-bg, #f3ecd9); color: var(--cap-en-fg, #2b2b2b);
    border-color: var(--cap-en-bd, transparent);
    font-family: var(--cap-en-font, 'Segoe UI', 'Noto Sans', Roboto, sans-serif);
    font-style: var(--cap-en-style, normal); }
  .cue-line.lg-x { background: var(--cap-x-bg, linear-gradient(135deg, #a78bfa, #7c3aed));
    color: var(--cap-x-fg, #fff); border-color: var(--cap-x-bd, transparent);
    font-family: var(--cap-x-font, 'Segoe UI', sans-serif); font-style: var(--cap-x-style, normal); }
  .cue-tools { display: flex; gap: .4rem; justify-content: flex-start; margin: .3rem .8rem;
    flex-wrap: nowrap; overflow-x: auto; padding-bottom: .15rem; }
  .cue-tools .mini { flex: none; min-width: 44px; }
  .cue-tools .mini.on { background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-color: transparent; }
  .cue-tools .mini.rec-on { background: #e11d48; color: #fff; border-color: transparent;
    animation: recPulse 1s infinite alternate; }
  @keyframes recPulse { from { box-shadow: 0 0 0 0 rgba(225,29,72,.5); }
    to { box-shadow: 0 0 0 6px rgba(225,29,72,.15); } }
  .vc-loop { position: absolute; top: .5rem; inset-inline-start: .5rem; z-index: 5;
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(0,0,0,.5); color: #fff; font-size: 1rem; }
  .vc-loop.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .lov-media .vcover { position: absolute; inset: 0; z-index: 4; }
  .lov-media .vcover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lov-media .vcover-x { position: absolute; top: .5rem; inset-inline-end: .5rem; z-index: 6;
    width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(0,0,0,.55); color: #fff; font-size: .9rem; }
  .lov-media .vcrop { position: relative; width: 100%; }
  .lov-media .vcrop.crop-on { overflow: hidden; }
  .lov-media .vcrop.crop-on video { object-fit: cover; object-position: top; }
  .lov-media video.fit-cover { object-fit: cover; }
  .lov-media video.fit-fill { object-fit: fill; }
  .lov-media video.fit-tall { max-height: 62vh; }
  .lov-cues { flex: 1; min-height: 0; overflow-y: auto; padding: .3rem .8rem 5.5rem; display: flex;
    flex-direction: column; gap: .4rem; }
  .cue { display: block; margin-bottom: .55rem; }
  .cue.on .crow { box-shadow: 0 0 0 2.5px rgba(139,92,246,.55), 0 4px 12px rgba(3,8,12,.16); }
  .cue .ct { font-size: .68rem; color: var(--accent2); font-variant-numeric: tabular-nums;
    flex: none; padding-top: .15rem; min-width: 2.6rem; }
  .cue .cx { flex: 1; min-width: 0; font-size: 1rem; line-height: 1.55;
    overflow-wrap: anywhere; }
  .cue .cx .cl { display: flex; align-items: flex-start; gap: .3rem; }
  .cue .cx .cl .clt { flex: 1; min-width: 0; }
  .cue .cx .clf { flex: none; background: none; border: none; padding: 0; cursor: pointer;
    font-size: 1.05rem; line-height: 1.55; }
  .cue .cx .clf.cls { font-size: .8rem; opacity: .6; }
  .cue .cx .clf.spk-on { opacity: 1; filter: drop-shadow(0 0 6px var(--accent)); }
  .cue .cx .w { cursor: pointer; border-radius: 4px; padding: 0 1px; }
  .cue .cx .w.spk-on { background: rgba(245,158,11,.28); color: #f6b93b; }
  .cue .cx .ct-ar { display: block; color: var(--dim); font-size: .88rem; }
  .cue .cb { flex: none; display: flex; flex-direction: column; gap: .25rem; }
  .ax.spk-on { background: var(--accent); border-color: var(--accent); }
  .lov-actions { position: fixed; bottom: 0; left: 0; right: 0; z-index: 4401; display: flex;
    gap: .4rem; padding: .55rem .8rem calc(.55rem + env(safe-area-inset-bottom));
    background: rgba(7,11,24,.92); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  body.light .lov-actions { background: rgba(242,244,251,.92); }
  .lov-actions .mini { flex: 1; font-size: .8rem; padding: .55rem .4rem; }
  /* ---------- games (ported from ProLang) ---------- */
  .qz-ov { position: fixed; inset: 0; z-index: 4600; background: var(--bg);

var IDB = {
  db: null,
  open: function () {
    if (IDB.db) return Promise.resolve(IDB.db);
    return new Promise(function (res, rej) {
      if (!window.indexedDB) return rej(new Error('no idb'));
      var r = indexedDB.open('savepro_files', 2);
      r.onupgradeneeded = function () {
        var db = r.result;
        if (!db.objectStoreNames.contains('files')) {
          db.createObjectStore('files', { keyPath: 'id' }).createIndex('siteId', 'siteId');
        }
        if (!db.objectStoreNames.contains('lessons')) {
          db.createObjectStore('lessons', { keyPath: 'id' }).createIndex('siteId', 'siteId');
        }
      };
      r.onsuccess = function () { IDB.db = r.result; res(IDB.db); };
      r.onerror = function () { rej(r.error); };
    });
  },
  put: function (rec) {
    return IDB.open().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction('files', 'readwrite');
        t.objectStore('files').put(rec);
        t.oncomplete = res; t.onerror = function () { rej(t.error); };
      });
    });
  },
  del: function (id) {
    return IDB.open().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction('files', 'readwrite');
        t.objectStore('files').delete(id);
        t.oncomplete = res; t.onerror = function () { rej(t.error); };
      });
    });
  },
  getAll: function () {
    return IDB.open().then(function (d) {
      return new Promise(function (res, rej) {
        var rq = d.transaction('files', 'readonly').objectStore('files').getAll();
        rq.onsuccess = function () { res(rq.result || []); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  },
  lput: function (rec) {
    return IDB.open().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction('lessons', 'readwrite');
        t.objectStore('lessons').put(rec);
        t.oncomplete = res; t.onerror = function () { rej(t.error); };
      });
    });
  },
  ldel: function (id) {
    return IDB.open().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction('lessons', 'readwrite');
        t.objectStore('lessons').delete(id);
        t.oncomplete = res; t.onerror = function () { rej(t.error); };
      });
    });
  },
  lgetAll: function () {
    return IDB.open().then(function (d) {
      return new Promise(function (res, rej) {
        var rq = d.transaction('lessons', 'readonly').objectStore('lessons').getAll();
        rq.onsuccess = function () { res(rq.result || []); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
};

function blobToB64(blob) {
  return new Promise(function (res, rej) {
    var rd = new FileReader();
    rd.onload = function () { res(String(rd.result).split(',')[1] || ''); };
    rd.onerror = function () { rej(rd.error); };
    rd.readAsDataURL(blob);
  });
}
function b64ToBlob(b64, mime) {
  var bin = atob(b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime || 'application/octet-stream' });
}

function addAttachment(siteId, kind, session) {
  var fi = document.createElement('input');
  fi.type = 'file'; fi.multiple = true;
  fi.accept = kind === 'pdf' ? 'application/pdf,.pdf' : kind === 'image' ? 'image/*' : '*/*';
  fi.onchange = function () {
    var files = Array.prototype.slice.call(fi.files || []);
    if (!files.length) return;
    Promise.all(files.map(function (f) {
      var mime = f.type || '';
      var kd = mime.indexOf('image/') === 0 ? 'image' :
        (mime === 'application/pdf' || /\.pdf$/i.test(f.name || '')) ? 'pdf' :
        (kind === 'file' ? 'file' : kind);
      var rec = { id: 'f' + Date.now() + Math.random().toString(36).slice(2, 7),
        siteId: siteId, name: f.name || 'file',
        mime: mime || 'application/octet-stream',
        kind: kd, blob: f, addedAt: Date.now() };
      return IDB.put(rec).then(function () {
        (attMap[siteId] = attMap[siteId] || []).push(rec);
        if (session) session.added.push(rec);
      });
    })).then(function () {
      renderGrid();
      if (lastAttWrap) lastAttWrap.refresh();
    });
  };
  fi.click();
}

function viewAttachment(rec) {
  if (rec.kind === 'image') {
    var ov = el('div', 'imgview');
    var img = new Image();
    img.src = URL.createObjectURL(rec.blob);
    ov.appendChild(img);
    ov.onclick = function () { ov.remove(); };
    document.body.appendChild(ov);
    return;
  }
  // Non-image files (PDF/APK/...): the WebView can't open them — hand to a native app
  var url = URL.createObjectURL(rec.blob);
  var FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
  var SH = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Share;
  if (inCap && FS && SH) {
    var cf = 'langpro-' + rec.id + '-' + (rec.name || 'file').replace(/[^\w.\-]+/g, '_');
    blobToB64(rec.blob).then(function (b64) {
      return FS.writeFile({ path: cf, data: b64,
        directory: 'CACHE', recursive: true });
    }).then(function (w) {
      return SH.share({ title: rec.name, url: w.uri });
    }).catch(function (e) { console.error(e); window.open(url, '_blank'); });
    return;
  }
  if (rec.kind === 'file') {
    var a = document.createElement('a'); a.href = url; a.download = rec.name || 'file'; a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return;
  }
  window.open(url, '_blank');
}

function saveAttachment(rec) {
  var t = T();
  var fname = rec.name || ('langpro-' + rec.id + (rec.kind === 'pdf' ? '.pdf' : '.png'));
  var FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
  var SH = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Share;
  if (inCap && FS && SH) {
    var safe = 'langpro-' + rec.id + '-' + fname.replace(/[^\w.\-]+/g, '_');
    blobToB64(rec.blob).then(function (b64) {
      return FS.writeFile({ path: safe, data: b64, directory: 'CACHE', recursive: true });
    }).then(function (w) {
      return SH.share({ title: fname, url: w.uri });
    }).then(function () { toast(t.attSaved); }).catch(function (e) { console.error(e); });
    return;
  }
  var u = URL.createObjectURL(rec.blob);
  var a = document.createElement('a'); a.href = u; a.download = fname; a.click();
  setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  toast(t.attSaved);
}

function pickIconImage(inp, cb) {
  var fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*';
  fi.onchange = function () {
    var f = fi.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var S = 128;
        var c = document.createElement('canvas');
        c.width = c.height = S;
        var g = c.getContext('2d');
        var m = Math.min(img.width, img.height);
        g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
        try { inp.value = c.toDataURL('image/png'); } catch (e) { inp.value = rd.result; }
        if (cb) cb(inp.value);
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  fi.click();
}

// ---------- games (ported from ProLang) ----------
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
// TTS helpers for games — single-utterance with loop until stopped
var SHORT_BCP = { fr: 'fr-FR', ar: 'ar-SA', en: 'en-US' };
function bcpLang(l) { var s = shortLang(l); return SHORT_BCP[s] || l || 'fr-FR'; }
function ttsOnce(text, lang, rate) {
  var n = nativeTTS();
  if (n && n.speak) {
    return n.speak({ text: String(text || ''), lang: bcpLang(lang), rate: rate || playSpeed })
      .then(function () {}, function () {});
  }
  return new Promise(function (res) {
    if (!('speechSynthesis' in window)) return res();
    try {
      var u = new SpeechSynthesisUtterance(String(text || ''));
      u.lang = bcpLang(lang); u.rate = rate || playSpeed;
      u.onend = res; u.onerror = res;
      speechSynthesis.speak(u);
    } catch (e) { res(); }
  });
}
function ttsAvail() {
  var n = nativeTTS();
  return !!(n && n.speak) || ('speechSynthesis' in window);
}
var gameTok = 0;
function gTtsStop() {
  try { var n = nativeTTS(); if (n && n.stop) n.stop(); } catch (e) {}
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
}
function gClearSpeaking() {
  document.querySelectorAll('.speaking').forEach(function (x) { x.classList.remove('speaking'); });
}
function gSpeak(text, lang, flagEl) {
  gameTok++;
  var was = flagEl && flagEl.classList.contains('speaking');
  gClearSpeaking();
  if (was) { gTtsStop(); return; }
  if (flagEl) flagEl.classList.add('speaking');
  var tok = gameTok;
  pauseMedia();
  if (!ttsAvail()) { if (flagEl) flagEl.classList.remove('speaking'); return; }
  (function play() {
    if (tok !== gameTok) return;
    ttsOnce(text, lang).then(function () { if (tok === gameTok) play(); });
  })();
}
function gSpeakSlow(text, lang, flagEl) {
  gameTok++;
  var was = flagEl && flagEl.classList.contains('speaking');
  gClearSpeaking();
  if (was) { gTtsStop(); return; }
  if (flagEl) flagEl.classList.add('speaking');
  var tok = gameTok;
  pauseMedia();
  if (!ttsAvail()) { if (flagEl) flagEl.classList.remove('speaking'); return; }
  (function play() {
    if (tok !== gameTok) return;
    ttsOnce(text, lang, .5).then(function () { if (tok === gameTok) play(); });
  })();
}
function gStopSpeak() { gameTok++; gClearSpeaking(); gTtsStop(); }
// speak two phrases back to back, alternating in one loop
function speakPair(t1, l1, t2, l2, el1, el2) {
  gameTok++;
  gClearSpeaking();
  if (el1) el1.classList.add('speaking');
  if (el2) el2.classList.add('speaking');
  var tok = gameTok;
  pauseMedia();
  if (!ttsAvail()) { gClearSpeaking(); return; }
  (function play(i) {
    if (tok !== gameTok) return;
    ttsOnce(i ? t2 : t1, i ? l2 : l1).then(function () { if (tok === gameTok) play(1 - i); });
  })(0);
}
// phrase-pool adapters over the cues data model
function gameRows(item) {
  return (item.rows || cueLangLines(item.text || '')).filter(function (r) { return r.text; });
}
function phMap(item) {
  var m = {};
  gameRows(item).forEach(function (r) { var s = shortLang(r.lang); if (!m[s]) m[s] = r.text; });
  return m;
}
function phText(item, lang) { return phMap(item)[lang] || ''; }
function gamePool(lesson) {
  var items = [];
  sortedCues(lesson).forEach(function (c, i) {
    var cp = { id: 'cue-' + lesson.id + '-' + i, rows: cueLangLines(c.text || '') };
    if (Object.keys(phMap(cp)).length >= 2) items.push(cp);
  });
  return items;
}
function gameQLang(p) {
  var rows = gameRows(p);
  return rows.length ? shortLang(rows[0].lang) : 'fr';
}
function lessonMainLang(l) {
  var cs = sortedCues(l);
  for (var i = 0; i < cs.length; i++) {
    var rows = cueLangLines(cs[i].text || '');
    for (var j = 0; j < rows.length; j++) if (rows[j].text) return shortLang(rows[j].lang);
  }
  return 'fr';
}
function flagForLang(l, lang) {
  var fl = '';
  sortedCues(l).forEach(function (c) {
    if (fl) return;
    cueLangLines(c.text || '').forEach(function (r) {
      if (!fl && shortLang(r.lang) === lang && r.flag) fl = r.flag;
    });
  });
  return fl || langFlag(lang) || '🏳';
}
function rrItemsFor(l) {
  var items = [];
  sortedCues(l).forEach(function (c) {
    var m = {};
    cueLangLines(c.text || '').forEach(function (r) {
      if (!r.text) return;
      var rl = shortLang(r.lang);
      if (rl && !m[rl]) m[rl] = r.text;
    });
    if (Object.keys(m).length) items.push(m);
  });
  return items;
}
function rrLangs(items, l) {
  var langs = [];
  var main = lessonMainLang(l);
  items.forEach(function (m) {
    Object.keys(m).forEach(function (k) {
      if (m[k] && langs.indexOf(k) < 0) langs.push(k);
    });
  });
  langs.sort(function (a, b) { return (a === main ? -1 : 0) - (b === main ? -1 : 0); });
  return langs;
}
function rrDir(lang) {
  return (lang === 'ar' || lang === 'he' || lang === 'fa' || lang === 'ur') ? 'rtl' : 'ltr';
}
function quizTone(ok) {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = quizTone.ctx || (quizTone.ctx = new Ctx());
    var t0 = ctx.currentTime;
    [0, .12].forEach(function (d, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = ok ? [523.25, 659.25][i] : (i ? 196 : 220);
      o.type = 'sine';
      g.gain.setValueAtTime(.001, t0 + d);
      g.gain.exponentialRampToValueAtTime(ok ? .14 : .11, t0 + d + .02);
      g.gain.exponentialRampToValueAtTime(.001, t0 + d + (ok ? .22 : .18));
      o.connect(g); g.connect(ctx.destination);
      o.start(t0 + d); o.stop(t0 + d + .3);
    });
  } catch (e) {}
}
function quizShuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function quizStopSpeak() { gStopSpeak(); }
// language-PAIR picker
function gamePairPicker(l, title) {
  var maps = gamePool(l).map(function (p) { return phMap(p); });
  var langs = rrLangs(rrItemsFor(l), l);
  var pairs = [];
  langs.forEach(function (q) {
    langs.forEach(function (a) {
      if (a === q) return;
      var n = maps.filter(function (m) { return m[q] && m[a]; }).length;
      if (n) pairs.push({ q: q, a: a, n: n });
    });
  });
  return '<div class="qz-langs"><h3 style="text-align:center;margin:0">' + esc(title) + '</h3>' +
    pairs.map(function (p) {
      return '<button class="btn" data-q="' + p.q + '" data-a="' + p.a + '">' +
        flagForLang(l, p.q) + ' ' + p.q.toUpperCase() + ' – ' +
        flagForLang(l, p.a) + ' ' + p.a.toUpperCase() + ' — ' + p.n + '</button>';
    }).join('') + '</div>';
}
/* ===== matching game 🧩 ===== */
function openQuiz(lesson) {
  closeQuiz();
  var t = T();
  var ov = document.createElement('div');
  ov.id = 'quiz-overlay';
  ov.className = 'qz-ov';
  ov.innerHTML = '<div class="qz-top"><button class="mini" id="quiz-exit" title="' + esc(t.quizExit) + '">✕</button>' +
    '<div class="qz-prog" id="quiz-progress"></div></div>' +
    '<div id="quiz-body" style="display:flex;flex:1;flex-direction:column"></div>';
  document.body.appendChild(ov);
  document.getElementById('quiz-exit').onclick = closeQuiz;
  var body = document.getElementById('quiz-body');
  body.innerHTML = gamePairPicker(lesson, t.quizChooseLang);
  body.querySelectorAll('button[data-q]').forEach(function (b) {
    b.onclick = function () { startQuiz(lesson, b.dataset.q, b.dataset.a); };
  });
}
function closeQuiz() {
  quizStopSpeak();
  clearTimeout(lz.timer);
  var ov = document.getElementById('quiz-overlay');
  if (ov) ov.remove();
}
function startQuiz(lesson, qlang, alang) {
  var t = T();
  var pool = gamePool(lesson).filter(function (p) {
    var m = phMap(p);
    return m[qlang] && m[alang];
  });
  if (!pool.length) { toast(t.quizNoPhrases); return; }
  var allPicks = quizShuffle(pool).map(function (p, i) {
    return { p: p, id: i, q: qlang, a: alang };
  });
  var body = document.getElementById('quiz-body');
  if (!body) return;
  body.innerHTML = '<div class="qz-flags"><div class="qz-flag">' + flagForLang(lesson, qlang) + '</div><div class="qz-flag">' + flagForLang(lesson, alang) + '</div></div>' +
    '<div class="qz-cols" id="quiz-cols"></div>';
  var correct = 0, wrong = 0, roundOff = 0, solvedRound = 0;
  function setProg() {
    var p2 = document.getElementById('quiz-progress');
    if (p2) p2.textContent = (roundOff + solvedRound) + '/' + allPicks.length;
  }
  function nextRound() {
    solvedRound = 0;
    var round = allPicks.slice(roundOff, roundOff + 8);
    renderRound(round);
    setProg();
  }
  function renderRound(picks) {
    var cols = document.getElementById('quiz-cols');
    cols.innerHTML = '';
    var selFr = null;
    setProg();
    function mkCard(item, lang) {
      var c = document.createElement('div');
      c.className = 'qz-card';
      c.dataset.text = phText(item.p, lang);
      c.dataset.lang = lang;
      c.dataset.pid = item.id;
      c.dataset.pair = phText(item.p, lang === qlang ? alang : qlang);
      c.dir = lang === 'ar' ? 'rtl' : 'ltr';
      c.textContent = c.dataset.text;
      return c;
    }
    function onCard(card, item, lang, isQ) {
      if (card.classList.contains('done')) return;
      var wasSpeaking = card.classList.contains('speaking');
      gSpeak(card.dataset.text, lang, card);
      if (wasSpeaking) return;
      if (isQ) {
        if (selFr) selFr.classList.remove('sel');
        selFr = card;
        card.classList.add('sel');
        return;
      }
      if (!selFr) {
        card.classList.add('sel');
        setTimeout(function () { card.classList.remove('sel'); }, 600);
        return;
      }
      if (selFr.dataset.pid === card.dataset.pid || card.dataset.text === selFr.dataset.pair) {
        correct++;
        quizTone(true);
        selFr.classList.remove('sel');
        selFr.classList.add('done');
        card.classList.add('done');
        solvedRound++;
        speakPair(selFr.dataset.text, selFr.dataset.lang, card.dataset.text, card.dataset.lang, selFr, card);
        selFr = null;
        setProg();
        if (solvedRound === picks.length) {
          roundOff += picks.length;
          setTimeout(function () {
            if (roundOff >= allPicks.length) quizEnd(correct, wrong, lesson, qlang, alang);
            else nextRound();
          }, 650);
        }
      } else {
        wrong++;
        quizTone(false);
        card.classList.add('wrong');
        setTimeout(function () { card.classList.remove('wrong'); }, 520);
        if (selFr) { selFr.classList.remove('sel'); selFr = null; }
      }
    }
    var frOrder = quizShuffle(picks);
    var tgOrder = quizShuffle(picks);
    for (var i = 0; i < picks.length; i++) {
      (function (i2) {
        var f = mkCard(frOrder[i2], frOrder[i2].q);
        f.onclick = function () { onCard(f, frOrder[i2], f.dataset.lang, true); };
        cols.appendChild(f);
        var g = mkCard(tgOrder[i2], tgOrder[i2].a);
        g.onclick = function () { onCard(g, tgOrder[i2], g.dataset.lang, false); };
        cols.appendChild(g);
      })(i);
    }
  }
  nextRound();
}
function quizEnd(correct, wrong, lesson, qlang, alang) {
  quizStopSpeak();
  var t = T();
  var total = correct + wrong;
  var pct = total ? Math.round(correct / total * 100) : 100;
  var color = pct >= 70 ? '#1f9d55' : pct >= 40 ? '#f59e0b' : '#e0245e';
  var body = document.getElementById('quiz-body');
  if (!body) return;
  body.innerHTML = '<div class="qz-end"><div class="qz-pct" style="color:' + color + '">' + pct + '%</div>' +
    '<div style="font-size:1.25rem;margin:.7rem 0 1.4rem">✅ ' + correct + ' &nbsp; ❌ ' + wrong + '</div>' +
    '<div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap">' +
    '<button class="btn" id="quiz-replay">🔁 ' + esc(t.quizReplay) + '</button>' +
    '<button class="btn" id="quiz-exit2">✕ ' + esc(t.quizExit) + '</button></div></div>';
  document.getElementById('quiz-replay').onclick = function () { startQuiz(lesson, qlang, alang); };
  document.getElementById('quiz-exit2').onclick = closeQuiz;

function resizeImageToDataUrl(file, maxDim, quality, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, maxDim / Math.max(img.width || 1, img.height || 1));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * s));
      c.height = Math.max(1, Math.round(img.height * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', quality));

    img.src = reader.result;
  };
  reader.readAsDataURL(file);

/* ================= passcode ================= */
function pinHash(p) {
  var h = 5381, s = 'sp:' + p + ':v1';
  for (var i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(36);
}
function hasPin() { return !!localStorage.getItem('langpro_pin'); }
function showLock() {
  if (!hasPin()) return;
  document.getElementById('lock').classList.remove('hidden');
  var inp = document.getElementById('lockPin');
  inp.value = '';
  document.getElementById('lockMsg').textContent = '';
  setTimeout(function () { try { inp.focus(); } catch (e) {} }, 250);
}
var pinFails = 0, pinLockUntil = 0;
function tryUnlock() {
  var inp = document.getElementById('lockPin');
  var now = Date.now();
  if (now < pinLockUntil) {   // brute-force throttle: longer lockout after each 3 misses
    document.getElementById('lockMsg').textContent =
      T().lockWrong + ' ⏳ ' + Math.ceil((pinLockUntil - now) / 1000) + 's';
    inp.value = ''; try { inp.focus(); } catch (e) {}
    return;
  }
  if (pinHash(inp.value) === localStorage.getItem('langpro_pin')) {
    pinFails = 0;
    document.getElementById('lock').classList.add('hidden');
  } else {
    pinFails++;
    if (pinFails % 3 === 0) pinLockUntil = Date.now() + Math.min(60000, 5000 * Math.pow(2, pinFails / 3 - 1));
    document.getElementById('lockMsg').textContent = T().lockWrong;
    inp.value = ''; try { inp.focus(); } catch (e) {}
  }
}
function pinField(label) {
  return fieldRow(label, '', { ltr: true, type: 'password',
    attrs: { inputmode: 'numeric', maxlength: '4', pattern: '[0-9]*' } });
}
function pinSheet(title, rows, btnTxt, fn) {
  var sh = sheet();
  var h = el('h3');
  h.appendChild(el('span', null, title));
  var x = el('button', null, '✕'); x.onclick = closeOv; h.appendChild(x);
  sh.appendChild(h);
  rows.forEach(function (r) { sh.appendChild(r); });
  var act = el('div', 'actions');
  var b = el('button', 'btn primary', btnTxt);
  b.onclick = fn; act.appendChild(b); sh.appendChild(act);
  setTimeout(function () { try { rows[0].input.focus(); } catch (e) {} }, 250);
}
function pinVerify(cb) {
  var t = T();
  var r = pinField(t.lockEnter);
  pinSheet('🔒 ' + t.lockEnter, [r], '✓', function () {
    if (pinHash(r.input.value) === localStorage.getItem('langpro_pin')) { closeOv(); cb(); }
    else { toast(t.lockWrong); r.input.value = ''; }
  });
}
function pinSetup() {
  var t = T();
  function next() {
    var r1 = pinField(t.lockNew), r2 = pinField(t.lockConfirm);
    pinSheet('🔐 ' + (hasPin() ? t.lockChange : t.lockSet), [r1, r2], '💾 ' + t.save, function () {
      var v1 = r1.input.value.trim(), v2 = r2.input.value.trim();
      if (!/^\d{4}$/.test(v1)) { toast(t.lockNeedPin); return; }
      if (v1 !== v2) { toast(t.lockNoMatch); return; }
      try { localStorage.setItem('langpro_pin', pinHash(v1)); } catch (e) {}
      closeOv(); toast(t.pinSaved);
    });
  }
  if (hasPin()) pinVerify(next); else next();
}
function pinRemove() {
  pinVerify(function () {
    try { localStorage.removeItem('langpro_pin'); } catch (e) {}
    toast(T().unlocked);
  });
}

/* ================= export / import ================= */
// Same flow as gramvip: write to CACHE as base64, then open the native share sheet
var CRC_TABLE = (function () {
  var t = new Uint32Array(256);
  for (var n = 0; n < 256; n++) {
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();
function crc32(d) {
  var c = 0xFFFFFFFF;
  for (var i = 0; i < d.length; i++) c = CRC_TABLE[(c ^ d[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// Minimal ZIP reader/writer, store method only (no compression).
function zipStore(entries) {
  var enc = new TextEncoder();
  var parts = []; var central = []; var off = 0;
  entries.forEach(function (e) {
    var nm = enc.encode(e.name); var d = e.data; var crc = crc32(d);
    var lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, d.length, true);
    lh.setUint32(22, d.length, true); lh.setUint16(26, nm.length, true);
    parts.push(lh.buffer, nm, d);
    var ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, d.length, true);
    ch.setUint32(24, d.length, true); ch.setUint16(28, nm.length, true);
    ch.setUint32(42, off, true);
    central.push(ch.buffer, nm);
    off += 30 + nm.length + d.length;
  });
  var cdLen = central.reduce(function (a, p) { return a + p.byteLength; }, 0);
  var eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdLen, true); eo.setUint32(16, off, true);
  return new Blob(parts.concat(central).concat([eo.buffer]), { type: 'application/zip' });
}
function unzipStored(buf) {
  var dv = new DataView(buf); var entries = {}; var dec = new TextDecoder();
  var pos = buf.byteLength - 22;
  while (pos >= 0 && dv.getUint32(pos, true) !== 0x06054b50) pos--;
  if (pos < 0) return entries;
  var n = dv.getUint16(pos + 10, true);
  var p = dv.getUint32(pos + 16, true);
  for (var i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    var method = dv.getUint16(p + 10, true);
    var csize = dv.getUint32(p + 20, true);
    var nlen = dv.getUint16(p + 28, true);
    var lho = dv.getUint32(p + 42, true);
    var lnlen = dv.getUint16(lho + 26, true);
    var lextra = dv.getUint16(lho + 28, true);
    var name = dec.decode(new Uint8Array(buf, p + 46, nlen));
    if (method === 0) entries[name] = new Uint8Array(buf, lho + 30 + lnlen + lextra, csize);
    p += 46 + nlen + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
  }
  return entries;
}
async function exportData() {
  var t = T();
  var filesOut = [];
  var lessonsOut = [];
  var entries = [];
  try {
    var recs = await IDB.getAll();
    for (var i = 0; i < recs.length; i++) {
      var b64 = await blobToB64(recs[i].blob);
      filesOut.push({ id: recs[i].id, siteId: recs[i].siteId, name: recs[i].name,
        mime: recs[i].mime, kind: recs[i].kind, data: b64 });
      var fn = (recs[i].name || 'file-' + recs[i].id).replace(/[\\/:*?"<>|]/g, '_');
      entries.push({ name: 'files/' + recs[i].id + '-' + fn,
        data: new Uint8Array(await recs[i].blob.arrayBuffer()) });
    }
    var lrecs = await IDB.lgetAll();
    for (var li = 0; li < lrecs.length; li++) {
      var lr = lrecs[li];
      var mo = { id: lr.id, siteId: lr.siteId, name: lr.name, mime: lr.mime, icon: lr.icon || '', cover: lr.cover || '', vfit: lr.vfit || 0, cues: lr.cues || [] };
      if (lr.blob) {
        var mext = String(lr.mime || 'bin').split('/')[1] || 'bin';
        mo.media = 'media/' + lr.id + '.' + mext.split(';')[0];
        entries.push({ name: mo.media, data: new Uint8Array(await lr.blob.arrayBuffer()) });
      }
      lessonsOut.push(mo);
    }
  } catch (e) {}
  var out = { app: 'langpro', version: 3, exportedAt: new Date().toISOString(), sites: sites, files: filesOut, lessons: lessonsOut };
  entries.push({ name: 'langpro-backup.json', data: new TextEncoder().encode(JSON.stringify(out, null, 1)) });
  var blob = zipStore(entries);
  var name = 'langpro-backup-' + new Date().toISOString().slice(0, 10) + '.zip';
  var FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
  var SH = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Share;
  if (inCap && FS && SH) {
    try {
      var text = await new Promise(function (res) {
        var rd = new FileReader(); rd.onload = function () { res(rd.result); }; rd.readAsDataURL(blob);
      });
        var w = await FS.writeFile({ path: name, data: text.split(',')[1], directory: 'CACHE', recursive: true });
      await SH.share({ title: name, url: w.uri });
      toast(t.exported);
      return;
    } catch (e) { console.error(e); }
  }
  var u = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  toast(t.exported);
}
function importData() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json,.zip,application/zip';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var buf = rd.result;
        var jsonText;
        var ents = null;
        if (buf.byteLength > 4 && new DataView(buf).getUint32(0, true) === 0x04034b50) {
          ents = unzipStored(buf); var je = null;
          Object.keys(ents).forEach(function (k) { if (/\.json$/i.test(k)) je = ents[k]; });
          if (!je) throw new Error('nojson');
          jsonText = new TextDecoder().decode(je);
        } else {
          jsonText = new TextDecoder().decode(buf);
        }
        var j = JSON.parse(jsonText);
        var list = j.sites || j;
        if (!Array.isArray(list)) throw new Error('bad');
        var seen = {};
        sites.forEach(function (s) { seen[s.id] = 1; });
        var idMap = {};
        var attOwners = {};
        ((j && Array.isArray(j.files)) ? j.files : []).forEach(function (f) { attOwners[f.siteId] = 1; });
        ((j && Array.isArray(j.lessons)) ? j.lessons : []).forEach(function (lm) { attOwners[lm.siteId] = 1; });
        list.forEach(function (s) {
          if (!s || (!s.url && !s.addr && !s.notes && !s.user && !s.pass && !s.name && !attOwners[s.id])) return;
          var oldId = s.id;
          if (!s.id) s.id = 's' + Date.now() + Math.random().toString(36).slice(2, 6);
          while (seen[s.id]) s.id += '_i';
          seen[s.id] = 1;
          idMap[oldId || s.id] = s.id;
          sites.push({ id: s.id, name: s.name || hostOf(s.url), url: s.url,
            icon: s.icon || '', user: s.user || '', pass: s.pass || '', addr: s.addr || '',
            email: s.email || '', phone: s.phone || '', notes: s.notes || '' });
        });
        var fl = (j && Array.isArray(j.files)) ? j.files : [];
        var ll = (j && Array.isArray(j.lessons)) ? j.lessons : [];
        Promise.all(ll.map(function (lm) {
          var sid = idMap[lm.siteId];
          if (!sid) return null;
          var rec = { id: 'l' + Date.now() + Math.random().toString(36).slice(2, 6),
            siteId: sid, name: lm.name || '', mime: lm.mime || '', icon: lm.icon || '', cover: lm.cover || '', vfit: lm.vfit || 0,
            cues: lm.cues || [], blob: null, addedAt: Date.now() };
          if (lm.media && ents && ents[lm.media]) {
            rec.blob = new Blob([ents[lm.media]], { type: lm.mime || 'application/octet-stream' });
          }
          return IDB.lput(rec).then(function () {
            (lessonMap[sid] = lessonMap[sid] || []).push(rec);
          });
        })).then(function () {
          return Promise.all(fl.map(function (f) {
          var sid = idMap[f.siteId];
          if (!sid || !f.data) return null;
          var rec = { id: 'f' + Date.now() + Math.random().toString(36).slice(2, 7),
            siteId: sid, name: f.name || 'file', mime: f.mime || 'application/octet-stream',
            kind: (f.kind === 'pdf' || f.kind === 'file') ? f.kind : 'image', blob: b64ToBlob(f.data, f.mime) };
          return IDB.put(rec).then(function () {
            (attMap[sid] = attMap[sid] || []).push(rec);
          });
        }));
        }).then(function () {
          saveSites(); renderGrid(); toast(T().imported);
        });
      } catch (e) { toast('import ✗'); }
    };
    rd.readAsArrayBuffer(f);
  };
  inp.click();
}

/* ================= exit confirm ================= */
function confirmExit() {
  var t = T();
  confirmDialog(t.exitTitle, t.yes, function () {
    var A = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
    if (A && A.exitApp) A.exitApp(); else window.close();
  });
}

/* ================= wire up ================= */
document.getElementById('themeBtn').onclick = toggleTheme;
document.getElementById('menuBtn').onclick = openMenu;
document.getElementById('waBtn').onclick = openWhatsApp;
document.getElementById('langBtn').onclick = function () {
  var order = ['ar', 'fr', 'en'];
  setUiLang(order[(order.indexOf(uiLang()) + 1) % order.length]);
};
document.getElementById('mailBtn').onclick = openMail;

var lockInp = document.getElementById('lockPin');
document.getElementById('lockGo').onclick = tryUnlock;
lockInp.addEventListener('input', function () { if (this.value.length >= 4) tryUnlock(); });
lockInp.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });

var CapApp = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
if (CapApp && CapApp.addListener) {
  CapApp.addListener('backButton', function () {
    if (!document.getElementById('lock').classList.contains('hidden')) {
      if (CapApp.exitApp) CapApp.exitApp();
      return;
    }
    if (ovRoot.firstChild) { closeOv(); return; }
    if (document.querySelector('.qz-ov')) { closeQuiz(); closeRR(); return; }
    // close the topmost layer: stacked dialogs (pushOv on body), then lesson/library views
    var views = document.querySelectorAll('body > .overlay, body > .lov, body > .libv');
    if (views.length) {
      stopSpeakLoop();
      var vw = views[views.length - 1];
      if (vw.classList.contains('lov')) {   // recorder/media belong to the lesson, not dialogs stacked over it
        if (recState) { try { recState.rec.stop(); } catch (e) {} }
        vw.querySelectorAll('video, audio').forEach(function (m) { try { m.pause(); } catch (e) {} });
        if (curPlayer && vw.contains(curPlayer)) curPlayer = null;
      }
      vw.remove();
      return;
    }
    confirmExit();
  });
  CapApp.addListener('appStateChange', function (st) {
    if (st && st.isActive && hasPin()) showLock();
  });
}

applyTheme();
document.documentElement.lang = uiLang();
document.documentElement.dir = uiLang() === 'ar' ? 'rtl' : 'ltr';
applyI18n();
renderGrid();
if (hasPin()) showLock();

// Service worker: PWA only, never inside Capacitor
if (!inCap && 'serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw-langpro.js').catch(function () {});
  });
}
})();
