<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2a0a2e">
<meta name="description" content="تعلم الفرنسية مع ترجمة عربية وإنجليزية">
<title>Procap — Français / العربية / English</title>
<link rel="manifest" href="manifest-procap.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg-primary: #1a0b1e;
    --bg-secondary: #24122b;
    --bg-tertiary: #321b3b;
    --text-primary: #f8f0fa;
    --text-secondary: #c9b8cf;
    --accent: #e879c8;
    --accent-2: #8b5cf6;
    --accent-hover: #f0a8d8;
    --danger: #ff6b7a;
    --success: #34d399;
    --gold: #fbbf24;
    --border: #4a2d55;
    --radius: 16px;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --max-width: 880px;
  }
  [data-theme="light"] {
    --bg-primary: #fdf6fb;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f4e9f5;
    --text-primary: #2d0f35;
    --text-secondary: #6b4e73;
    --accent: #b8459e;
    --accent-2: #7c3aed;
    --accent-hover: #d16bb6;
    --border: #e9d5ee;
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(139,92,246,0.18), transparent 60%), var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.65;
    transition: background 0.25s, color 0.25s;
    padding-bottom: 2rem;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(135deg, rgba(232,121,200,0.18), rgba(139,92,246,0.18)), var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
  }
  .toast {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 0.65rem 1.1rem; border-radius: 999px;
    font-size: 0.9rem; box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 100;
    opacity: 0; transition: opacity 0.25s ease; pointer-events: none; max-width: 90%;
  }
  .toast.show { opacity: 1; }
  .action-sheet {
    position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center;
  }
  .action-sheet.show { display: flex; }
  .action-sheet .sheet-content {
    width: 100%; max-width: var(--max-width); background: var(--bg-secondary);
    border-radius: var(--radius) var(--radius) 0 0; padding: 1rem;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.3); animation: sheetUp 0.2s ease;
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .action-sheet .sheet-title { font-weight: 700; margin-bottom: 0.75rem; text-align: center; color: var(--text-secondary); }
  .action-sheet .sheet-actions { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem; }
  .action-sheet .sheet-actions button { justify-content: center; }
  .modal {
    position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; padding: 1rem;
  }
  .modal.show { display: flex; }
  .modal-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; width: 100%; max-width: 480px; box-shadow: var(--shadow); }
  .modal-content h3 { margin: 0 0 0.75rem; color: var(--text-primary); }
  .modal-content textarea { width: 100%; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.65rem; font-size: 0.95rem; resize: vertical; }
  .card .menu-btn {
    background: transparent; color: var(--text-secondary); border: none; font-size: 1.2rem;
    width: 2.2rem; height: 2.2rem; border-radius: 50%; cursor: pointer; margin-inline-start: auto;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .card .menu-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  .card-thumb {
    min-width: 2.6rem; height: 2.6rem; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;
    overflow: hidden; object-fit: cover;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .header-inner {
    max-width: var(--max-width); margin: 0 auto; padding: 0.7rem 1rem;
    display: flex; align-items: center; gap: 0.65rem;
  }
  .logo {
    font-weight: 800; font-size: 1.05rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; display: flex; align-items: center; gap: 0.4rem;
  }
  .logo-icon { width: 1.3rem; height: 1.3rem; border-radius: 6px; object-fit: cover; box-shadow: 0 0 8px rgba(232,121,200,0.35); }
  .spacer { flex: 1; }
  .icon-btn {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 50%;
    width: 2.4rem; height: 2.4rem; font-size: 1.05rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.12s, border-color 0.2s, background 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .icon-btn.active { background: var(--accent); color: #1a0b1e; border-color: var(--accent); }
  .lang-switch { display: flex; gap: 0.3rem; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem; }
  .lang-btn {
    background: transparent; color: var(--text-secondary); border: none;
    border-radius: 999px; padding: 0.35rem 0.65rem; font-size: 0.78rem; font-weight: 700;
    cursor: pointer; min-width: 2.2rem; transition: background 0.2s, color 0.2s;
  }
  .lang-btn:hover { color: var(--text-primary); }
  .lang-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  main { max-width: var(--max-width); margin: 0 auto; padding: 1rem; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.1rem;
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.7rem; box-shadow: var(--shadow);
  }
  #search {
    flex: 1; min-width: 220px;
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 0.65rem 1rem; font-size: 1rem;
  }
  #search::placeholder { color: var(--text-secondary); }
  .ctl {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.55rem 0.6rem; font-size: 0.88rem;
  }
  .breadcrumb {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.9rem;
  }
  .breadcrumb button {
    background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 0.9rem;
  }
  .card {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 0.75rem;
    cursor: pointer; display: flex; align-items: center; gap: 0.9rem;
    transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .num {
    min-width: 2.6rem; height: 2.6rem; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.95rem; flex-shrink: 0; box-shadow: 0 0 12px rgba(232,121,200,0.25);
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-weight: 700; font-size: 1.05rem; }
  .card-sub { color: var(--text-secondary); font-size: 0.86rem; }
  .chev { color: var(--text-secondary); font-size: 1.1rem; }
  .hero {
    background: linear-gradient(135deg, rgba(232,121,200,0.12), rgba(139,92,246,0.12));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.2rem; margin-bottom: 1.1rem; text-align: center;
  }
  .hero h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
  .hero p { margin: 0; color: var(--text-secondary); font-size: 0.95rem; }
  .phrase {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.9rem 1rem; margin-bottom: 0.75rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .phrase.playing { border-color: var(--success); box-shadow: 0 0 0 1px var(--success), 0 0 14px rgba(52,211,153,0.18); }
  .phrase-top { display: flex; gap: 0.7rem; align-items: flex-start; }
  .lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.35rem; }
  .line { padding: 0.25rem 0.45rem; border-radius: 8px; transition: background 0.2s; }
  .line.active { background: rgba(52,211,153,0.12); }
  .fr {
    direction: ltr; text-align: left; font-size: 1.13rem; font-weight: 700;
    color: var(--accent); word-wrap: break-word;
  }
  .ar { direction: rtl; text-align: right; font-size: 1.02rem; }
  .en { direction: ltr; text-align: left; color: var(--text-secondary); font-size: 0.95rem; }
  .btns { display: flex; flex-wrap: wrap; gap: 0.35rem; flex-shrink: 0; max-width: 8.5rem; justify-content: flex-end; }
  [dir="ltr"] .btns { justify-content: flex-start; }
  .btns button {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 10px;
    width: 2.35rem; height: 2.35rem; font-size: 1rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
  }
  .btns button:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btns button.active { background: var(--success); color: #081c15; border-color: var(--success); }
  .btns button.fav-on { color: var(--gold); border-color: var(--gold); }
  .btns .image-btn:hover { border-color: var(--accent); color: var(--accent); }
  .no-lessons { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); }
  .no-lessons .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .no-lessons .card-title { color: var(--text-primary); margin-bottom: 0.3rem; }
  .lesson-head { margin-bottom: 1rem; }
  .lesson-head h2 { margin: 0 0 0.2rem; font-size: 1.25rem; }
  .lesson-head .sub { color: var(--text-secondary); font-size: 0.95rem; }
  .lesson-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.8rem 0; align-items: center; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin: 1rem 0 0.75rem; }
  .section-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
  .action-bar { display: flex; justify-content: space-around; gap: 0.25rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem 0.5rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  .action-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; background: transparent; color: var(--text-secondary); border: none; border-radius: 12px; padding: 0.5rem 0.2rem; font-size: 0.78rem; cursor: pointer; transition: background 0.2s, color 0.2s; }
  .action-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  .action-icon { font-size: 1.4rem; line-height: 1; }
  .action-label { font-weight: 600; }
  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none;
    border-radius: 999px; padding: 0.6rem 1.1rem; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; transition: filter 0.2s, transform 0.1s;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn.ghost { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
  .pill {
    display: inline-block; background: var(--bg-tertiary); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.15rem 0.65rem; font-size: 0.78rem; color: var(--text-secondary);
  }
  .empty { color: var(--text-secondary); text-align: center; padding: 2.5rem 1rem; }
  footer { text-align: center; color: var(--text-secondary); font-size: 0.78rem; padding: 1.5rem 1rem; }
  footer a { color: var(--accent); }

  .add-card .num { background: var(--success); color: #081c15; }
  .folder-card .num { background: var(--accent-2); font-size: 1.15rem; }
  .form-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  .form-group { margin-bottom: 0.9rem; }
  .form-group label { display: block; font-size: 0.9rem; margin-bottom: 0.35rem; color: var(--text-secondary); }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 0.65rem;
    font-size: 1rem; font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 180px; }
  .form-group .hint { font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.3rem; }
  .form-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .delete-btn {
    background: var(--bg-tertiary); color: var(--danger); border: 1px solid var(--danger);
    border-radius: 8px; width: 2.4rem; height: 2.4rem; cursor: pointer; font-size: 1rem;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    margin-inline-start: auto;
  }
  .delete-btn:hover { background: var(--danger); color: #fff; }
  .tts-banner {
    display: none; align-items: center; gap: 0.6rem;
    background: rgba(255,107,122,0.1); border: 1px solid var(--danger); color: var(--danger);
    border-radius: var(--radius); padding: 0.7rem 1rem; margin-bottom: 0.9rem; font-size: 0.95rem;
  }
  @media (max-width: 520px) {
    .header-inner { padding: 0.6rem 0.75rem; }
    .logo { font-size: 0.95rem; }
    .btns { max-width: none; width: 100%; justify-content: flex-start; margin-top: 0.5rem; }
    .phrase-top { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo"><img src="icon-192.png" alt="" class="logo-icon"> <span data-t="appName">Procap</span></span>
    <span class="spacer"></span>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ar">AR</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="fr">FR</button>
    </div>
    <button class="icon-btn" id="btn-fav" data-t-title="favourites" title="Favourites">⭐</button>
    <button class="icon-btn" id="btn-theme" data-t-title="themeMode" title="Dark / light mode">🌙</button>
    <button class="icon-btn" id="btn-stop" data-t-title="stopAudio" title="Stop audio">⏹</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" data-t="searchPlaceholder" placeholder="ابحث بالعربية أو الفرنسية أو الإنجليزية…">
    <select class="ctl" id="rate" data-t-title="rateTitle" title="Speech rate">
      <option value="0.6">0.6×</option>
      <option value="0.8">0.8×</option>
      <option value="1" selected>1×</option>
      <option value="1.2">1.2×</option>
    </select>
    <select class="ctl" id="loopmode" data-t-title="loopModeTitle" title="Loop content">
      <option value="fr,ar,en" data-t="loopFrenchArabicEnglish" selected>🔁 FR + AR + EN</option>
      <option value="fr,ar" data-t="loopFrenchArabic">🔁 FR + AR</option>
      <option value="fr" data-t="loopFrenchOnly">🔁 FR only</option>
    </select>
  </div>
  <div id="tts-banner" class="tts-banner">
    <span id="tts-msg"></span>
    <button id="tts-install" class="btn" style="font-size:0.85rem; padding:0.35rem 0.8rem; margin-inline-start:auto;"></button>
  </div>
  <div id="view"></div>
</main>

<div id="toast" class="toast"></div>

<div id="action-sheet" class="action-sheet">
  <div class="sheet-content">
    <div class="sheet-title" id="sheet-title">--</div>
    <div class="sheet-actions" id="sheet-actions"></div>
    <button type="button" class="btn ghost" id="sheet-cancel" style="width:100%" data-t="cancel">إلغاء</button>
  </div>
</div>

<div id="examples-modal" class="modal">
  <div class="modal-content">
    <h3 data-t="inputExamples">Examples</h3>
    <textarea id="examples-text" rows="10" readonly></textarea>
    <div class="form-actions" style="margin-top:0.75rem">
      <button type="button" class="btn" id="btn-copy-examples" data-t="copy">نسخ</button>
      <button type="button" class="btn ghost" id="btn-close-examples" data-t="cancel">إلغاء</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  function loadLessons() {
    try {
      const raw = JSON.parse(localStorage.getItem('procap_lessons') || '[]');
      if (Array.isArray(raw)) {
        if (raw.length && raw[0].phrases && !raw[0].type) {
          return raw.map((l, i) => ({ id: l.id || i + 1, type: 'lesson', custom: true, title: l.title, phrases: l.phrases }));
        }
        return raw;
      }
      return [];
    } catch (e) { return []; }
  }

  function saveLessons() { localStorage.setItem('procap_lessons', JSON.stringify(LESSONS)); }

  async function exportLessons() {
    const data = JSON.stringify(LESSONS, null, 2);
    const filename = 'procap-lessons.json';
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem && Capacitor.Plugins.Share) {
      try {
        const { Filesystem, Share } = Capacitor.Plugins;
        const dir = (Filesystem.Directory && Filesystem.Directory.Cache) ? Filesystem.Directory.Cache : 'CACHE';
        await Filesystem.writeFile({ path: filename, data: data, directory: dir, encoding: 'utf8' });
        const { uri } = await Filesystem.getUri({ path: filename, directory: dir });
        await Share.share({ title: 'Procap lessons', files: [uri], dialogTitle: 'Procap JSON' });
        showToast(t('exportSuccess'));
        return;
      } catch (e) { console.error('Capacitor export failed', e); }
    }
    const blobUrl = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    showToast(t('exportSuccess'));
  }

  function importLessons(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) throw new Error('invalid');
        if (confirm(t('importConfirm'))) {
          LESSONS = data.map((it, i) => ({ ...it, id: it.id || (Date.now() + i) }));
          saveLessons();
          go({ name: 'home' }, false);
          showToast(t('importSuccess'));
        }
      } catch (err) {
        showToast(t('importError'));
      }
    };
    reader.readAsText(file);
  }

  function showToast(msg, duration = 2200) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    if (el._timer) clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), duration);
  }

  function cleanPhrasePart(s) {
    let r = String(s).trim();
    const trim = '*–—-:=;';
    while (r && trim.includes(r[0])) r = r.slice(1).trim();
    while (r && trim.includes(r[r.length - 1])) r = r.slice(0, -1).trim();
    return r;
  }

  function extractRawParts(line) {
    const cleanLine = String(line).trim();
    if (!cleanLine) return null;
    const delims = /\s*(?:\|{1,2}|,|;|=>|->|→|=|:|\s+-\s+|\s+)\s*/;
    const tokens = cleanLine.split(delims).map(s => s.trim()).filter(Boolean);
    if (tokens.length < 3) return null;
    const isAr = s => /[\u0600-\u06FF]/.test(s);
    const firstAr = tokens.findIndex(isAr);
    if (firstAr === -1) return null;
    const lastAr = tokens.length - 1 - [...tokens].reverse().findIndex(isAr);
    return {
      first: tokens.slice(0, firstAr).join(' '),
      ar: tokens.slice(firstAr, lastAr + 1).join(' '),
      last: tokens.slice(lastAr + 1).join(' ')
    };
  }

  function classifyLatinLang(s) {
    const text = String(s).trim();
    if (!text || /[\u0600-\u06FF]/.test(text)) return '';
    const lower = text.toLowerCase();
    if (/[éèêàâäæçíïîìôöòûüùœ]/.test(lower)) return 'fr';
    const enMatch = lower.match(/\b(the|a|an|and|or|is|are|am|was|were|be|been|have|has|had|do|does|did|will|would|could|should|may|might|can|this|that|these|those|my|your|his|her|its|our|their|in|on|at|to|for|with|of|from|by|about|into|through|during|before|after|i|you|he|she|we|they|it|me|him|them|us|there|here|where|what|when|why|how|all|some|no|not|yes|please|thank|thanks|very|much|more|less)\b/g);
    const frMatch = lower.match(/\b(le|la|les|l'|un|une|des|du|de|d'|et|ou|en|je|tu|il|elle|nous|vous|ils|elles|est|sont|ai|as|a|avons|avez|ont|avoir|faire|suis|es|sommes|etes|êtes|mon|ma|mes|ton|ta|tes|son|sa|ses|ce|cet|cette|ces|que|qui|quoi|pour|avec|dans|sur|par|sous|contre|vers|avant|après|plus|moins|très|bien|oui|non|merci|s'il|te|me|se|lui|y|en|où|dont|quand|comment|pourquoi|parce|car|si|quel|quelle|quels|quelles)\b/g);
    const enWords = enMatch ? enMatch.length : 0;
    const frWords = frMatch ? frMatch.length : 0;
    if (enWords > frWords) return 'en';
    if (frWords > enWords) return 'fr';
    const words = lower.split(/[^a-z0-9'àâäæçéèêëïîôùûüœ'-]+/i).filter(Boolean);
    const frHints = new Set(['vagin','vulve','clitoris','lèvres','grandes','petites','utérus','ovaires','seins','mamelons','col','hymen','mont','vénus','périnée','trompes','fallope','anus','pénis','gland','prépuce','testicules','scrotum','prostate','point']);
    const enHints = new Set(['vagina','vulva','labia','majora','minora','uterus','womb','ovaries','breasts','nipples','cervix','mons','pubis','perineum','fallopian','tubes','penis','glans','foreskin','testicles','balls','scrotum','prostate','g-spot']);
    let frAny = false, enAny = false;
    words.forEach(w => { if (frHints.has(w)) frAny = true; if (enHints.has(w)) enAny = true; });
    if (frAny && !enAny) return 'fr';
    if (enAny && !frAny) return 'en';
    return '';
  }

  function getLineOrder(first, last, blockOrder) {
    const langFirst = classifyLatinLang(first);
    const langLast = classifyLatinLang(last);
    if (langFirst === 'fr' && langLast !== 'fr') return 'fr-ar-en';
    if (langFirst === 'en' && langLast !== 'en') return 'en-ar-fr';
    if (langLast === 'fr' && langFirst !== 'fr') return 'en-ar-fr';
    if (langLast === 'en' && langFirst !== 'en') return 'fr-ar-en';
    return blockOrder;
  }

  function detectBlockOrder(text) {
    let firstFr = 0, firstEn = 0, lastFr = 0, lastEn = 0;
    text.split('\n').forEach(raw => {
      const parts = extractRawParts(raw);
      if (!parts) return;
      const first = cleanPhrasePart(parts.first);
      const last = cleanPhrasePart(parts.last);
      const langFirst = classifyLatinLang(first);
      const langLast = classifyLatinLang(last);
      if (langFirst === 'fr') firstFr++; else if (langFirst === 'en') firstEn++;
      if (langLast === 'fr') lastFr++; else if (langLast === 'en') lastEn++;
    });
    if (firstEn > firstFr && lastFr >= lastEn) return 'en-ar-fr';
    if (firstFr > firstEn && lastEn >= lastFr) return 'fr-ar-en';
    if (firstEn > 0 && lastFr > 0) return 'en-ar-fr';
    if (firstFr > 0 && lastEn > 0) return 'fr-ar-en';
    return 'fr-ar-en';
  }

  function formatTitle(obj) {
    if (!obj) return '';
    const seen = new Set();
    const parts = [];
    [obj.fr, obj.ar, obj.en].forEach(v => { if (v && !seen.has(v)) { seen.add(v); parts.push(v); } });
    return parts.join(' | ');
  }

  function parseTitle(text) {
    const s = String(text).trim();
    if (!s) return null;
    const p = parsePhrases(s, 'auto');
    if (p && p[0]) return p[0];
    const tokens = s.split(/\s*(?:\|{1,2}|,|;|=>|->|→|=|:|\s+-\s+|\s+)\s*/).map(x => x.trim()).filter(Boolean);
    if (!tokens.length) return null;
    if (tokens.length === 1) {
      const v = tokens[0];
      return { fr: v, ar: v, en: v };
    }
    let fr = '', ar = '', en = '';
    tokens.forEach(tok => {
      if (/[\u0600-\u06FF]/.test(tok)) { if (!ar) ar = tok; }
      else {
        const lang = classifyLatinLang(tok);
        if (lang === 'en' && !en) en = tok;
        else if (lang === 'fr' && !fr) fr = tok;
        else if (!fr) fr = tok;
        else if (!en) en = tok;
      }
    });
    if (!fr && !ar && !en) return null;
    return { fr, ar, en };
  }

  function parsePhrases(text, userOrder = 'auto') {
    const phrases = [];
    const blockOrder = (userOrder === 'auto') ? detectBlockOrder(text) : userOrder;
    text.split('\n').forEach(raw => {
      const parts = extractRawParts(raw);
      if (!parts) return;
      const ar = cleanPhrasePart(parts.ar);
      const first = cleanPhrasePart(parts.first);
      const last = cleanPhrasePart(parts.last);
      if (!ar || !first || !last) return;
      const lineOrder = getLineOrder(first, last, blockOrder);
      let fr, en;
      if (lineOrder === 'en-ar-fr') { en = first; fr = last; }
      else { fr = first; en = last; }
      phrases.push({ fr, ar, en });
    });
    return phrases;
  }

    const root = LESSONS.find(it => it.type === 'lesson' && it.id === id);
    if (root) return { lesson: root, parent: null };
    for (let i = 0; i < LESSONS.length; i++) {

        en: await supportsLangTag(tts, ['en-US','en','eng','en-GB','en-CA'])
      };
      state.ttsAvailable = true;
      hideTTSBanner();
    } catch (e) {
      if (retry < 8) {
        setTimeout(() => checkNativeTTS(retry + 1), 600);
      } else {
        state.ttsAvailable = false;
        showTTSBanner(t('ttsNotAvailable'), t('installTTS'));
      }
    }
  }

  function nativeSpeak(text, lang) {
    const tts = nativeTTS();
    if (!tts) return Promise.reject('no tts');
    const tag = (state.voiceLang && state.voiceLang[lang]);
    if (!tag) return Promise.reject('unsupported lang');
    const p = tts.speak({ text: text, lang: tag, rate: state.rate || 1 });
    const timeout = new Promise((_, reject) => setTimeout(() => reject('timeout'), 7000));
    return Promise.race([p, timeout]);
  }

  function nativeStop() {
    const tts = nativeTTS();
    if (tts) tts.stop().catch(() => {});
  }

  function webTTS() {
    const synth = window.speechSynthesis;
    if (!synth) return null;
    const voices = synth.getVoices();
    return (voices && voices.length) ? synth : null;
  }

  function webSpeak(text, lang) {
    const synth = webTTS();
    if (!synth) return Promise.reject('no web tts');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (state.voiceLang && state.voiceLang[lang]) || VOICE_LANG[lang] || 'en-US';
    u.rate = state.rate || 1;
    return new Promise((resolve, reject) => {
      let settled = false;
      u.onend = () => { if (!settled) { settled = true; clearTimeout(timer); resolve(); } };
      u.onerror = () => { if (!settled) { settled = true; clearTimeout(timer); reject('web tts error'); } };
      const timer = setTimeout(() => { if (!settled) { settled = true; resolve(); } }, 2500);
      synth.speak(u);
    });
  }

  function anySpeak(text, lang) {
    if (speakSupported()) return nativeSpeak(text, lang);
    if (webTTS()) return webSpeak(text, lang);
    return Promise.reject('no tts');
  }

  function anyStop() {
    nativeStop();
    const synth = webTTS();
    if (synth) synth.cancel();
  }

  function anyTTSAvailable() {
    return speakSupported() || !!webTTS();
  }

  async function prepareTTS() {
    if (anyTTSAvailable()) { hideTTSBanner(); return true; }
    if (!nativeTTS() && !('speechSynthesis' in window)) return false;
    if (nativeTTS()) checkNativeTTS();
    for (let i = 0; i < 15; i++) {
      await new Promise(r => setTimeout(r, 400));
      if (anyTTSAvailable()) { hideTTSBanner(); return true; }
    }
    return false;
  }

  function speakSupported() { return !!nativeTTS() && state.ttsAvailable; }

  function stopSpeech() {
    state.loop = null;
    speechRun++;
    anyStop();
    highlight(null);
    refreshButtons();
  }

  async function speakOnce(phrase, langs, key, onDone) {
    const run = ++speechRun;
    anyStop();
    const ready = await prepareTTS();
    if (run !== speechRun) return;
    if (!ready) { highlight(null); return; }
    const seq = langs.filter(l => phrase[l] && state.voiceLang[l]);
    let i = 0;
    (function next() {
      if (run !== speechRun) return;
      if (i >= seq.length) { highlight(null); if (onDone) onDone(); return; }
      const lang = seq[i++];
      highlight(key, lang);
      anySpeak(phrase[lang], lang).then(() => { if (run === speechRun) setTimeout(next, 250); }).catch(() => {
        if (run === speechRun) setTimeout(next, 250);
      });
    })();
  }

  async function toggleLoop(phrase, key) {
    if (state.loop && state.loop.key === key) { stopSpeech(); return; }
    const ready = await prepareTTS();
    if (!ready) { return; }
    state.loop = { key: key };
    refreshButtons();
    (function cycle() {
      if (!state.loop || state.loop.key !== key) return;
      speakOnce(phrase, state.langs, key, () => {
        if (!state.loop || state.loop.key !== key) return;
        setTimeout(cycle, 600);
      });
    })();
  }

  function highlight(key, lang) {
    document.querySelectorAll('.phrase').forEach(el => {
      const on = key && el.dataset.key === key;
      el.classList.toggle('playing', !!on);
      el.querySelectorAll('.line').forEach(line => {
        line.classList.toggle('active', !!on && (!lang || line.dataset.lang === lang));
      });
    });
  }

  function refreshButtons() {
    document.querySelectorAll('.phrase').forEach(el => {
      const btn = el.querySelector('.loop-btn');
      if (!btn) return;
      const on = state.loop && state.loop.key === el.dataset.key;
      btn.classList.toggle('active', !!on);
      btn.textContent = on ? '⏸' : '🔁';
    });
  }

  async function playLesson(lesson) {
    const ready = await prepareTTS();
    if (!ready) { return; }
    stopSpeech();
    let i = 0;
    const runKey = 'lesson:' + lesson.id;
    state.loop = { key: runKey };
    (function next() {
      if (!state.loop || state.loop.key !== runKey) return;
      if (i >= lesson.phrases.length) { i = 0; }
      const p = lesson.phrases[i];
      const key = phraseKey(lesson.id, i);
      i++;
      const el = document.querySelector(`.phrase[data-key="${key}"]`);
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      speakOnce(p, state.langs, key, () => {
        if (!state.loop || state.loop.key !== runKey) return;
        setTimeout(next, 400);
      });
    })();
  }

      <form id="edit-lesson-form" class="form-card" data-id="${lesson.id}" data-parent="${parent ? parent.id : ''}">
        <div class="form-group"><label data-t="title">${t('title')}</label><input name="title" required value="${esc(titleText)}" placeholder="Ex: Les organes génitaux"></div>
        <div class="form-group"><button type="button" class="btn ghost info-btn" data-info="phrases" style="font-size:0.85rem;padding:0.35rem 0.7rem;margin-bottom:0.4rem">ℹ ${t('inputExamples')}</button><label data-t="phrasesLabel">${t('phrasesLabel')}</label><textarea name="phrases" rows="10" required>${esc(phrasesText)}</textarea><div class="hint" data-t="phrasesHint">${t('phrasesHint')}</div></div>
        <div class="form-actions">
          <button type="submit" class="btn" data-t="save">${t('save')}</button>
          <button type="button" class="btn ghost" data-route='${JSON.stringify(cancelRoute)}' data-t="cancel">${t('cancel')}</button>
        </div>
      </form>`;
    view.innerHTML = html;
    applyTranslations();
  }

  function updateLesson() {
    const form = document.getElementById('edit-lesson-form');
    const ttl = parseTitle(form.elements.title.value);
    if (!ttl) { alert(t('fillTitleError')); return; }
    const phrases = parsePhrases(form.elements.phrases.value, 'auto');
    if (!phrases.length) { alert(t('noPhrasesError')); return; }
    const id = +form.dataset.id;
    const found = findLesson(id);
    if (!found) return;
    found.lesson.title = ttl;
    found.lesson.phrases = phrases;
    saveLessons();
    showToast(t('saved'));
    go({ name: 'lesson', lesson: id });
  }

  const PHRASE_EXAMPLES = [
    'Bonjour | مرحبا | Hello',
    'Comment allez-vous → كيف حالك → How are you',
    'Je voudrais = أريد = I would like',
    'Merci, شكرا, Thank you',
    'Au revoir: مع السلامة: Goodbye',
    'Pomme - تفاحة - Apple',
    'Où sont les toilettes أين الحمام Where is the bathroom',
    'English | Arabic | French'
  ];

  function showPhraseExamples() {
    const modal = document.getElementById('examples-modal');
    document.getElementById('examples-text').value = PHRASE_EXAMPLES.join('\n');
    modal.classList.add('show');
  }

  function closePhraseExamples() {
    document.getElementById('examples-modal').classList.remove('show');
  }

  function copyPhraseExamples() {
    const ta = document.getElementById('examples-text');
    ta.select();
    try {
      if (navigator.clipboard) { navigator.clipboard.writeText(ta.value); }
      else { document.execCommand('copy'); }
    } catch (e) {}
    showToast(t('copied'));
  }

  function bindViewEvents() {
    view.addEventListener('click', e => {
      const exportBtn = e.target.closest('#btn-export');
      if (exportBtn) { e.stopPropagation(); exportLessons(); return; }

      const infoBtn = e.target.closest('[data-info]');
      if (infoBtn) { e.stopPropagation(); showPhraseExamples(); return; }

      const menuBtn = e.target.closest('[data-menu]');
      if (menuBtn) { e.stopPropagation(); openActionSheet(+menuBtn.dataset.menu, menuBtn.dataset.type); return; }

      const routeBtn = e.target.closest('[data-route]');
      if (routeBtn) { go(JSON.parse(routeBtn.dataset.route)); return; }

      const phrase = e.target.closest('.phrase');
      if (!phrase) return;
      const key = phrase.dataset.key;
      const [lessonId, idx] = key.split('.').map(Number);
      const found = findLesson(lessonId);
      if (!found) return;
      const p = found.lesson.phrases[idx];

      if (e.target.closest('.speak-btn')) {
        stopSpeech();
        speakOnce(p, state.langs, key);
      } else if (e.target.closest('.loop-btn')) {
        toggleLoop(p, key);
      } else if (e.target.closest('.image-btn')) {
        window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(p.fr), '_blank');
      } else if (e.target.closest('.fav-btn')) {
        toggleFav(key);
        const favBtn = phrase.querySelector('.fav-btn');
        const on = isFav(key);
        favBtn.classList.toggle('fav-on', on);
        favBtn.textContent = on ? '★' : '☆';
      }
    });
  }

  function bindActionSheet() {
    const sheet = document.getElementById('action-sheet');
    document.getElementById('sheet-cancel').onclick = closeActionSheet;
    sheet.addEventListener('click', e => {
      if (e.target === sheet) { closeActionSheet(); return; }
      const edit = e.target.closest('[data-edit]');
      if (edit) { closeActionSheet(); editItem(+edit.dataset.edit, edit.dataset.type); return; }
      const del = e.target.closest('[data-delete-sheet]');
      if (del) {
        closeActionSheet();
        const id = +del.dataset.deleteSheet;
        if (del.dataset.type === 'folder') deleteRootItem(id); else deleteLesson(id);
        return;
      }
      const setImg = e.target.closest('[data-set-image]');
      if (setImg) {
        closeActionSheet();
        const id = +setImg.dataset.setImage;
        const type = setImg.dataset.type;
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.style.display = 'none';
        input.onchange = () => {
          if (input.files && input.files[0]) setItemImage(id, type, input.files[0]);
          input.remove();
        };
        document.body.appendChild(input);
        input.click();
        return;
      }
    });
  }

  function go(route, push = true) {
    stopSpeech();
    state.route = route;
    if (push) {
      let hash = '#/';
      if (route.name === 'folder') hash = '#/folder/' + route.folder;
      else if (route.name === 'lesson') hash = '#/lesson/' + route.lesson;
      else if (route.name === 'add-folder') hash = '#/add-folder';
      else if (route.name === 'add-lesson') hash = '#/add-lesson' + (route.folder ? '/' + route.folder : '');
      else if (route.name === 'edit-lesson') hash = '#/edit-lesson/' + route.lesson;
      else if (route.name === 'favs') hash = '#/favs';
      else if (route.name === 'search') hash = '#/search/' + encodeURIComponent(route.q);
      if (location.hash !== hash) location.hash = hash;
    }
    if (route.name === 'home') renderHome();
    else if (route.name === 'folder') renderFolder(route.folder);
    else if (route.name === 'lesson') renderLesson(route.lesson);
    else if (route.name === 'favs') renderFavs();
    else if (route.name === 'search') renderSearch(route.q);
    else if (route.name === 'add-folder') renderAddFolder();
    else if (route.name === 'add-lesson') renderAddLesson(route.folder);
    else if (route.name === 'edit-lesson') renderEditLesson(route.lesson);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function parseHash() {
    const h = location.hash || '#/';
    if (h === '#/favs') return { name: 'favs' };
    if (h === '#/add-folder') return { name: 'add-folder' };
    if (h === '#/add-lesson') return { name: 'add-lesson' };
    let m = h.match(/^#\/folder\/(\d+)$/);
    if (m) return { name: 'folder', folder: +m[1] };
    m = h.match(/^#\/lesson\/(\d+)$/);
    if (m) return { name: 'lesson', lesson: +m[1] };
    m = h.match(/^#\/add-lesson\/(\d+)$/);
    if (m) return { name: 'add-lesson', folder: +m[1] };
    m = h.match(/^#\/edit-lesson\/(\d+)$/);
    if (m) return { name: 'edit-lesson', lesson: +m[1] };
    m = h.match(/^#\/search\/(.+)$/);
    if (m) return { name: 'search', q: decodeURIComponent(m[1]) };
    return { name: 'home' };
  }

  function bindBackButton() {
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
      Capacitor.Plugins.App.addListener('backButton', ({ canGoBack }) => {
        if (canGoBack) { history.back(); }
        else if (confirm(t('exitConfirm'))) { Capacitor.Plugins.App.exitApp(); }
      });
    }
  }

  function init() {
    bindBackButton();
    document.getElementById('btn-copy-examples').onclick = copyPhraseExamples;
    document.getElementById('btn-close-examples').onclick = closePhraseExamples;
    document.getElementById('btn-theme').onclick = toggleTheme;
    document.getElementById('btn-stop').onclick = stopSpeech;
    document.getElementById('btn-fav').onclick = () => go({ name: 'favs' });
    document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => setUILang(b.dataset.lang));
    document.getElementById('rate').onchange = e => { state.rate = +e.target.value; stopSpeech(); };
    document.getElementById('loopmode').onchange = e => { state.langs = e.target.value.split(','); stopSpeech(); };
    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim();
      if (q) go({ name: 'search', q: q }, false);
      else go({ name: 'home' }, false);
    });
    window.addEventListener('hashchange', () => { go(parseHash(), false); });
    view.addEventListener('submit', e => {
      if (e.target.id === 'add-lesson-form') { e.preventDefault(); addLesson(); }
      else if (e.target.id === 'add-folder-form') { e.preventDefault(); addFolder(); }
      else if (e.target.id === 'edit-lesson-form') { e.preventDefault(); updateLesson(); }
    });
    view.addEventListener('change', e => {
      if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) {
        importLessons(e.target.files[0]);
        e.target.value = '';
      }
    });
    bindViewEvents();
    bindActionSheet();
    setTheme(state.theme);
    setUILang(state.uiLang);
    go(parseHash(), false);
    if (nativeTTS()) checkNativeTTS();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
