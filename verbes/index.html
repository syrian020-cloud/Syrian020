<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1025">
<title>Wordpro</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0d1025;--bg2:#161a33;--card:#1b2040;--bd:#2a3060;--txt:#e8ebff;--dim:#8b93b8;--acc:#4f7cff;--acc2:#38d9a9}
[data-theme=light]{--bg:#f2f4fc;--bg2:#ffffff;--card:#ffffff;--bd:#d7dcef;--txt:#1b2040;--dim:#5a6285;--acc:#2f5fe8;--acc2:#0e9f78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
#hdr{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:.4rem;padding:.55rem .7rem;background:var(--bg);border-bottom:1px solid var(--bd)}
#ttl{flex:1;font-size:1.15rem;font-weight:800;text-align:center}
.hbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-size:1.15rem;display:grid;place-items:center;cursor:pointer;flex:none}
.hbtn:active{filter:brightness(1.3)}
#backBtn{display:none}
main{padding:.7rem;max-width:640px;margin:0 auto;padding-bottom:5rem}
#letters{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem}
#cats{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.cat{position:relative;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;cursor:pointer;padding:.7rem .3rem;color:var(--txt)}
.cat:active{transform:scale(.96)}
.cat .ic{font-size:1.8rem}
.cat .nm{font-size:.68rem;font-weight:800;text-align:center;line-height:1.25}
.cat .nm small{display:block;font-size:.58rem;color:var(--dim);font-weight:600}
.cat .cnt{position:absolute;top:4px;inset-inline-end:5px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 5px}
.cat .cnt:empty{display:none}
.cat .cact{position:absolute;top:4px;inset-inline-start:5px;display:flex;gap:3px}
.cat .cact button{width:22px;height:22px;border-radius:7px;border:1px solid var(--bd);background:var(--bg2);color:var(--txt);font-size:.85rem;display:grid;place-items:center;cursor:pointer;font-weight:900;line-height:1}
#catMenu{position:fixed;z-index:5000;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:.3rem;min-width:9.5rem;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#catMenu button{display:flex;width:100%;gap:.5rem;align-items:center;padding:.55rem .7rem;border:none;background:none;color:var(--txt);font-size:.9rem;border-radius:8px;cursor:pointer;text-align:start;font-family:inherit}
#catMenu button:hover{background:var(--acc2)}
#catMenu button.danger{color:#f87171}
.cat .cimg{width:34px;height:34px;border-radius:10px;object-fit:cover}
.let{position:relative;aspect-ratio:1;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;cursor:pointer;font-size:1.7rem;font-weight:800;color:var(--txt)}
.let:active{transform:scale(.96)}
.let small{font-size:.62rem;color:var(--dim);font-weight:600}
.let .cnt{position:absolute;top:4px;inset-inline-end:5px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 5px}
.let .cnt:empty{display:none}
.let.empty{opacity:.55}
.vcard{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:.6rem .65rem;margin-bottom:.6rem}
.vtop{display:flex;align-items:center;gap:.55rem}
.vimg{width:72px;height:72px;border-radius:14px;object-fit:cover;flex:none;border:1px solid var(--bd)}
.vimg.noimg{display:grid;place-items:center;font-size:1.5rem;background:var(--bg2)}
.vname{flex:1;min-width:0;line-height:1.35}
.vname .vf{font-weight:800;font-size:1.05rem}
.vname .vtr{display:block;font-size:.82rem;color:var(--dim);font-weight:600}
.vact{display:flex;flex-direction:column;gap:.3rem;flex:none}
.vact button{width:30px;height:30px;border-radius:9px;border:1px solid var(--bd);background:var(--bg2);color:var(--txt);font-size:.9rem;cursor:pointer}
.vbtns{display:flex;gap:.4rem;margin-top:.3rem}
.vbtns button{width:30px;height:30px;border-radius:9px;border:1px solid var(--bd);background:var(--bg2);font-size:.95rem;cursor:pointer}
.vbtns button.speaking{background:var(--acc);outline:2px solid var(--acc2)}
.phrow{display:flex;gap:.5rem;align-items:flex-start;margin-top:.4rem;border-radius:12px;padding:.35rem .55rem;border:1.5px solid var(--bd)}
.phrow .pht{flex:1;min-width:0;font-weight:600;line-height:1.5;overflow-wrap:anywhere;text-align:start}
.phflag{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);font-size:1.15rem;display:grid;place-items:center;cursor:pointer}
.phflag.speaking{background:var(--acc);outline:2px solid var(--acc2)}
.w{cursor:pointer;border-radius:6px;padding:0 .1rem}
.w.speaking{background:var(--acc);color:#fff}
.w:active{background:var(--bd)}
.lg-ar{direction:rtl}
.lg-fr,.lg-en{direction:ltr}
#empty{text-align:center;color:var(--dim);padding:3rem 1rem;font-weight:600}
#addFab,#pasteFab{position:fixed;inset-inline-end:1.1rem;width:56px;height:56px;border-radius:50%;border:none;color:#fff;font-size:1.6rem;box-shadow:0 6px 20px #0007;cursor:pointer;z-index:8;display:none;place-items:center}
#addFab{bottom:1.1rem;background:var(--acc)}
#pasteFab{bottom:5.1rem;background:var(--acc2)}
#pTa{min-height:180px;font-family:inherit;resize:vertical}
#pHint{font-size:.72rem;color:var(--dim);margin:.2rem 0 .5rem;line-height:1.5;white-space:pre-line}
.shade{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end;justify-content:center}
.shade.on{display:flex}
.sheet{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:1rem}
.sheet h3{margin:.2rem 0 .8rem;text-align:center}
.fld{margin-bottom:.55rem}
.fld label{display:block;font-size:.78rem;color:var(--dim);font-weight:700;margin-bottom:.2rem}
.fld input,.fld textarea{width:100%;padding:.55rem .7rem;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--txt);font-size:.95rem;font-family:inherit}
.fld input[dir=ltr],.fld textarea[dir=ltr]{text-align:left}
.brow{display:flex;gap:.5rem;margin-top:.8rem}
.bbtn{flex:1;padding:.7rem;border-radius:14px;border:none;font-size:1rem;font-weight:800;cursor:pointer}
.bbtn.pri{background:var(--acc);color:#fff}
.bbtn.sec{background:var(--card);color:var(--txt);border:1.5px solid var(--bd)}
#imgPrev{width:64px;height:64px;border-radius:12px;object-fit:cover;display:none;margin-top:.4rem}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#222a;color:#fff;padding:.5rem 1.1rem;border-radius:20px;font-size:.85rem;z-index:99;display:none}
.toast.on{display:block}
/* ---- notebook (ProLang port) ---- */
#noteModal{position:fixed;inset:0;z-index:60;background:#0e1330;display:none;flex-direction:column}
#noteModal.show{display:flex}
.note-topbar{display:flex;align-items:center;gap:.35rem;padding:.5rem .6rem;background:#131a3d;flex-wrap:wrap}
.note-icon{border:1px solid #2a3568;background:#1a2450;color:#fff;border-radius:10px;min-width:2rem;height:2rem;font-size:1rem;display:flex;align-items:center;justify-content:center}
.note-icon.active{background:#7c5cff;border-color:#7c5cff}
.note-icon.danger{background:#a33}
.note-title{font-weight:700;color:#fff;font-size:.95rem}
.note-palette{display:none;flex-wrap:wrap;gap:.45rem;padding:.5rem .6rem;background:#10173a}
.note-palette.show{display:flex}
.note-tool{width:1.5rem;height:1.5rem;border-radius:8px;border:2px solid transparent;padding:0}
.note-tool.active{border-color:#fff;transform:scale(1.15)}
#notePhraseBar{display:flex;flex-wrap:wrap;gap:.4rem;padding:.4rem .6rem;background:#0e1330;max-height:38vh;overflow-y:auto}
.note-phrase-card{position:relative;flex:1 1 46%;min-width:9rem;background:#f4ecd8;color:#1c1c1c;border-radius:10px;padding:.5rem .7rem .9rem;font-size:.95rem}
.note-phrase-card.ar{direction:rtl}
.note-loop{position:absolute;bottom:.3rem;inset-inline-end:.3rem;border:none;background:#1e2a4a;color:#fff;width:1.7rem;height:1.7rem;border-radius:9px;font-size:.8rem;padding:0}
.note-loop.speaking{background:#7c5cff}
.note-canvas-wrap{flex:1;min-height:0;position:relative;background:#fff}
.note-canvas-wrap.lined{background-color:#fffdf5;background-image:linear-gradient(to right,transparent 0,transparent 2.6rem,#f4a3a3 2.6rem,#f4a3a3 calc(2.6rem + 2px),transparent calc(2.6rem + 2px)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.2rem - 1px),#9fc5e8 calc(2.2rem - 1px),#9fc5e8 2.2rem)}
html[dir=rtl] .note-canvas-wrap.lined{background-image:linear-gradient(to left,transparent 0,transparent 2.6rem,#f4a3a3 2.6rem,#f4a3a3 calc(2.6rem + 2px),transparent calc(2.6rem + 2px)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.2rem - 1px),#9fc5e8 calc(2.2rem - 1px),#9fc5e8 2.2rem)}
#noteCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* ---- games (Zeelang port) ---- */
.hidden{display:none}
.mini{background:var(--acc);border:none;color:#fff;border-radius:8px;padding:5px 12px;font-family:inherit;font-size:.75rem;font-weight:800;cursor:pointer}
.btn{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:.7rem 1rem;color:var(--txt);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff}
.btn:disabled{opacity:.4}
.qz-ov{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:.9rem .75rem;box-sizing:border-box}
.qz-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.qz-prog{font-weight:800;font-size:1.05rem}
.qz-flags{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.55rem;direction:ltr;margin-bottom:.5rem}
.qz-flag{text-align:center;font-size:1.4rem}
.qz-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.65rem .55rem;align-content:start;flex:1;direction:ltr}
.qz-card{border:2px solid var(--bd);border-radius:18px;padding:.85rem .7rem;background:var(--card);color:var(--txt);cursor:pointer;font-size:1rem;line-height:1.5;text-align:center;user-select:none;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s}
.qz-card:active{transform:scale(.97)}
.qz-card.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc);transform:scale(1.02)}
.qz-card.speaking{outline:3px solid #f59e0b;outline-offset:1px}
.qz-card.done{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:#fff;pointer-events:none}
.qz-card.wrong{animation:qzShake .45s;border-color:#e0245e;background:#e0245e;color:#fff}
@keyframes qzShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qz-langs{display:flex;flex-direction:column;gap:.9rem;max-width:340px;margin:auto;width:100%}
.qz-langs .btn{width:100%;min-height:3.2rem;font-size:1.1rem}
.qz-end{margin:auto;text-align:center}
.qz-pct{font-size:4.2rem;font-weight:800;line-height:1}
.lz-stage{display:flex;flex-direction:column;align-items:center;gap:.8rem;width:100%;max-width:480px;margin:0 auto}
.lz-hero{position:relative;width:100%;border-radius:18px;overflow:hidden;border:1.5px solid var(--bd);box-shadow:0 2px 10px rgba(0,0,0,.15);background:linear-gradient(135deg,#14b8a6,#0ea5e9);transition:height .2s}
.lz-hero.s1{height:96px}.lz-hero.s2{height:150px}.lz-hero.s3{height:210px}.lz-hero.v{height:250px}
.lz-hero>img{display:block;width:100%;height:100%;object-fit:cover}
.lz-hero-tools{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:6px}
.lz-hero-btn{min-width:34px;height:34px;padding:0 8px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(10,12,30,.55);color:#fff;font-size:.9rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.lz-hero-btn.del{background:rgba(225,29,72,.85);border-color:transparent}
.lz-loop{width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 14px rgba(20,184,166,.4)}
.lz-loop.speaking{animation:lzPulse 1s infinite}
@keyframes lzPulse{0%,100%{box-shadow:0 0 0 0 rgba(20,184,166,.55)}50%{box-shadow:0 0 0 9px rgba(20,184,166,0)}}
.lz-opts{display:flex;flex-direction:column;gap:.6rem;width:100%}
.lz-tile{border:2px solid var(--bd);background:var(--card);border-radius:16px;padding:.7rem .6rem;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center;color:var(--txt);line-height:1.4;transition:all .15s}
.lz-tile.ok{border-color:#22c55e;background:rgba(34,197,94,.13)}
.lz-tile.bad{border-color:#ef4444;background:rgba(239,68,68,.1);animation:qzShake .45s}
.rr-wrap{display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:1rem .5rem;flex:1;justify-content:center;width:100%;max-width:520px;margin:0 auto}
.rr-text{font-size:1.65rem;font-weight:800;text-align:center;line-height:1.45;overflow-wrap:anywhere}
.rr-tr{opacity:.75;font-size:1.05rem;text-align:center;overflow-wrap:anywhere}
.rr-ctrl{display:flex;align-items:center;gap:.9rem}
.rr-ctrl .btn{flex:none;padding:.7rem .9rem}
.rr-count{font-size:1.5rem;font-weight:900;min-width:4.2rem;text-align:center}
.rr-plus{width:4.4rem;height:4.4rem;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:2.1rem;font-weight:900;font-family:inherit;box-shadow:0 4px 14px rgba(20,184,166,.4)}
.rr-plus.dim{opacity:.35}
.rr-sub{min-height:1.5rem;opacity:.85;text-align:center}
.rr-skip{text-decoration:underline;cursor:pointer;color:var(--acc)}
.rr-wrap>.btn{flex:none;width:auto;min-width:12rem}
.rr-w{cursor:pointer}
.rr-w.speaking{color:var(--acc);text-decoration:underline}
.rr-score{font-size:1.6rem;font-weight:800;text-align:center;margin:.4rem 0 .2rem}
.lz-nav{display:flex;gap:.6rem;align-items:center}
.lz-nav button{min-width:52px;height:44px;padding:0 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--txt);font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.lz-nav button.on{border-color:var(--acc);background:rgba(20,184,166,.15);color:var(--acc)}
.lz-verdict{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:.6rem .8rem;text-align:center;background:var(--card);overflow-y:auto}
.lz-face{font-size:2rem;line-height:1}
.lz-v-fr{font-weight:800;font-size:1.05rem;color:var(--txt)}
.lz-verdict.ok .lz-v-fr{color:#16a34a}
.lz-verdict.bad .lz-v-fr{color:#ef4444}
.lz-v-tr{font-size:.9rem;font-weight:700;color:var(--dim)}
.lz-v-line{display:flex;align-items:center;justify-content:center;gap:.4rem;max-width:100%}
.lz-v-loop{flex:none;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.lz-v-loop.speaking{animation:lzPulse 1s infinite}
.ip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;width:100%}
.ip-tile{border:2px solid var(--bd);background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--txt);font-weight:700}
.ip-tile img{width:100%;height:100%;object-fit:cover;display:block}
.ip-tile.ok{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.4)}
.ip-tile.bad{border-color:#ef4444;animation:qzShake .45s;opacity:.55}
</style>
</head>
<body>
<header id="hdr">
<button class="hbtn" id="backBtn">→</button>
<button class="hbtn" id="settingsBtn">⋮</button>
<div id="ttl"></div>
<button class="hbtn" id="muteBtn">🔇</button>
<button class="hbtn" id="copyBtn" style="display:none" title="copy">📋</button>
<button class="hbtn" id="themeBtn">🌙</button>
<button class="hbtn" id="langBtn">🌐</button>
</header>
<main>
<div id="cats"></div>
<div id="letters" style="display:none"></div>
<div id="lv" style="display:none"></div>
</main>
<button id="pasteFab">📥</button>
<button id="addFab">＋</button>
<div class="shade" id="pShade"><div class="sheet">
<h3 id="pTtl"></h3>
<div id="pHint"></div>
<div class="fld"><textarea id="pTa" dir="auto" placeholder="1. Accepter – يَقْبَل – To accept&#10;🇫🇷 J'accepte ton invitation.&#10;🇸🇾 أنا بقبل دعوتك.&#10;🇺🇸 I accept your invitation."></textarea></div>
<div class="brow"><button class="bbtn sec" id="pCopy">📋</button><button class="bbtn sec" id="pCopy1">📄</button><button class="bbtn sec" id="pCancel"></button><button class="bbtn pri" id="pAdd"></button></div>
</div></div>
<div class="shade" id="cShade"><div class="sheet">
<h3 id="cTtl"></h3>
<div class="fld"><input id="cIc" dir="ltr" placeholder="📁 إيموجي الأيقونة" style="font-size:1.2rem;text-align:center"></div>
<div class="fld"><input id="cFr" dir="ltr" placeholder="Les …"></div>
<div class="fld"><input id="cAr" dir="rtl" placeholder="الاسم بالعربي"></div>
<div class="fld"><input id="cEn" dir="ltr" placeholder="English name"></div>
<div class="fld"><button class="bbtn sec" id="cImgBtn" style="width:auto;padding:.45rem .9rem">🖼️</button><img id="cImgPrev" style="width:60px;height:60px;border-radius:10px;margin-inline-start:.5rem"><input type="file" id="cImg" accept="image/*" hidden></div>
<div class="brow"><button class="bbtn sec" id="cCancel"></button><button class="bbtn pri" id="cSave"></button></div>
</div></div>
<div class="shade" id="sShade"><div class="sheet">
<h3 id="sTtl"></h3>
<div class="brow" style="flex-direction:column;gap:.5rem"><button class="bbtn sec" id="sVoice" style="width:100%"></button><button class="bbtn pri" id="sExport" style="width:100%"></button><button class="bbtn sec" id="sImport" style="width:100%"></button><button class="bbtn sec" id="sCancel" style="width:100%"></button></div>
<input type="file" id="sFile" accept=".json,application/json" hidden>
</div></div>
<div class="shade" id="vShade"><div class="sheet">
<h3 id="vTtl"></h3>
<div class="fld"><label id="lVerb"></label><input id="fVerb" dir="ltr" placeholder="Acheter"></div>
<div class="fld"><label id="lAr"></label><input id="fAr" dir="rtl" placeholder="يشتري"></div>
<div class="fld"><label id="lEn"></label><input id="fEn" dir="ltr" placeholder="To buy"></div>
<div class="fld"><label id="lSfr"></label><textarea id="fSfr" dir="ltr" rows="2" placeholder="Je veux acheter du pain."></textarea></div>
<div class="fld"><label id="lSar"></label><textarea id="fSar" dir="rtl" rows="2" placeholder="بدي اشتري خبز."></textarea></div>
<div class="fld"><label id="lSen"></label><textarea id="fSen" dir="ltr" rows="2" placeholder="I want to buy bread."></textarea></div>
<div class="fld"><label id="lImg"></label><button class="bbtn sec" id="fImgBtn" style="width:auto;padding:.45rem .9rem">🖼️</button><img id="imgPrev"><input type="file" id="fImg" accept="image/*" hidden></div>
<div class="brow"><button class="bbtn sec" id="vCancel"></button><button class="bbtn pri" id="vSave"></button></div>
</div></div>
<div id="noteModal">
  <div class="note-topbar">
    <button type="button" class="note-icon" id="noteClose">←</button>
    <span class="note-title">📓</span><span style="flex:1"></span>
    <button type="button" class="note-icon" id="notePaper">📓</button>

 res()})}

 stopSay();btn.classList.add('speaking');const tok=sayTok;
 (async()=>{let k=0;while(btn.classList.contains('speaking')&&tok===sayTok){const r=rows[k++%rows.length];await sayOnce(r.txt,r.lg)}})()}

function parseBulk(txt){
 const L=txt.split(/\r?\n/),blocks=[];let cur=null,pend=[];
 const flush=()=>{if(cur&&cur.title)blocks.push(cur);cur=null};
 for(const l0 of L){let l=l0.trim();if(!l)continue;
  if(/^[#*>\u2022]/.test(l)){if(/^#+\s*\d+\s*\\?[.)]/.test(l))l=l.replace(/^#+\s*/,'');else continue}
  const um=l.match(/https?:\/\/[^\s)]+/);
  if(/^!\[/.test(l)||/^https?:\/\/\S+$/i.test(l)){if(um){if(cur&&cur.title)(cur.imgs=cur.imgs||[]).push(um[0]);else pend.push(um[0])}continue}
  const m=l.match(/^\d+\s*\\?[.):\-–—]\s*(.+)$/);
  if(m){const rest=m[1].trim();
   if(/^🇫🇷|^🇸🇾|^🇺🇸|^🇬🇧/.test(rest)){if(!cur)cur={title:'',lines:[]};cur.lines.push(rest);continue}
   flush();cur={title:rest,lines:[],imgs:pend};pend=[];continue}
  if(!cur)cur={title:'',lines:[]};
  if(!cur.title&&/[–—]/.test(l)||!cur.title&&l.split(' - ').length>=3){cur.title=l;continue}
  cur.lines.push(l)}
 flush();
 const flagOf=l=>/^🇫🇷|^🇫🇷\s/.test(l)?'fr':/^🇸🇾|^🇪🇬|^🇸🇦|^🇦🇪|^🇱🇧|^🇯🇴|^🇵🇸|^🇮🇶|^🇩🇿|^🇲🇦|^🇹🇳/.test(l)?'ar':/^🇺🇸|^🇬🇧|^🇨🇦|^🇦🇺/.test(l)?'en':null;
 return blocks.map(b=>{
  const seg=b.title.split(/\s*[–—]\s*|\s+-\s+/).map(s=>s.trim()).filter(Boolean);
  const v={fr:seg[0]||'',ar:seg[1]||'',en:seg[2]||'',sfr:'',sar:'',sen:'',ph:[],imgurl:(b.imgs||[])[0]||''};
  const FSPLIT=/(?=🇫🇷|🇸🇾|🇪🇬|🇸🇦|🇦🇪|🇱🇧|🇯🇴|🇵🇸|🇮🇶|🇩🇿|🇲🇦|🇹🇳|🇺🇸|🇬🇧|🇨🇦|🇦🇺)/u;
  const used={};(b.lines||[]).forEach(l=>{const t={fr:'',ar:'',en:'',n:0};l.split(FSPLIT).map(x=>x.trim()).filter(Boolean).forEach(p=>{const f=flagOf(p);if(f){t[f]=(t[f]?t[f]+' ':'')+p.replace(/^\S+\s*/,'').trim();t.n++}});
   if(t.n>=2){v.ph.push(t);if(!v.sfr)v.sfr=t.fr;if(!v.sar)v.sar=t.ar;if(!v.sen)v.sen=t.en;['fr','ar','en'].forEach(f=>{if(t[f])used[f]=1})}
   else l.split(FSPLIT).forEach(p=>{const f=flagOf(p.trim());if(f){const s=p.trim().replace(/^\S+\s*/,'').trim();v['s'+f]=(v['s'+f]?v['s'+f]+' ':'')+s;used[f]=1}})});
  const rest=(b.lines||[]).filter(l=>!flagOf(l));
  ['fr','ar','en'].forEach((f,i)=>{if(!used[f]&&rest[i])v['s'+f]=rest[i]});
  return v}).filter(v=>v.fr&&/^\p{Script=Latin}/u.test(v.fr)&&v.fr.split(/\s+/).length<=8)}

var noteKey=null,noteCtx=null,noteDrawing=false,noteErasing=false,noteHighlight=false,noteColor='#111827',noteSize=3,noteUndo=[],noteRedo=[],noteBtn=null;
function noteSnapshot(){if(!noteCtx)return;const c=$('noteCanvas');noteUndo.push(noteCtx.getImageData(0,0,c.width,c.height));if(noteUndo.length>30)noteUndo.shift();noteRedo=[];updNoteHist()}
function noteRestore(img){noteCtx.save();noteCtx.setTransform(1,0,0,1,0,0);noteCtx.globalCompositeOperation='source-over';noteCtx.globalAlpha=1;noteCtx.clearRect(0,0,img.width,img.height);noteCtx.putImageData(img,0,0);noteCtx.restore()}
function updNoteHist(){$('noteUndo').disabled=!noteUndo.length;$('noteRedo').disabled=!noteRedo.length}
function undoNote(){if(!noteCtx||!noteUndo.length)return;const c=$('noteCanvas');noteRedo.push(noteCtx.getImageData(0,0,c.width,c.height));noteRestore(noteUndo.pop());updNoteHist()}
function redoNote(){if(!noteCtx||!noteRedo.length)return;const c=$('noteCanvas');noteUndo.push(noteCtx.getImageData(0,0,c.width,c.height));noteRestore(noteRedo.pop());updNoteHist()}
function setNoteSize(n){noteSize=Math.min(16,Math.max(1,n));$('noteSize').value=noteSize}
function setupNoteCanvas(){const c=$('noteCanvas');noteCtx=c.getContext('2d');const dpr=window.devicePixelRatio||1;const w=c.clientWidth||600,hh=c.clientHeight||400;c.width=Math.max(1,w*dpr);c.height=Math.max(1,hh*dpr);noteCtx.setTransform(1,0,0,1,0,0);noteCtx.scale(dpr,dpr);noteCtx.lineCap='round';noteCtx.lineJoin='round'}
function openNote(v,btn){noteKey='note_'+v.id;noteBtn=btn;$('noteModal').classList.add('show');const bar=$('notePhraseBar');bar.innerHTML='';
 const rows=[{txt:v.fr,lg:'fr'},{txt:v.ar,lg:'ar'},{txt:v.en,lg:'en'},{txt:v.sfr,lg:'fr'},{txt:v.sar,lg:'ar'},{txt:v.sen,lg:'en'}];
 rows.forEach(r=>{if(!r.txt)return;const card=document.createElement('div');card.className='note-phrase-card';if(r.lg==='ar')card.classList.add('ar');
  const sp=document.createElement('span');sp.textContent=r.txt;card.appendChild(sp);
  const lo=document.createElement('button');lo.className='note-loop';lo.textContent='🔁';lo.onclick=e=>{e.stopPropagation();loopSpeak([r],lo)};card.appendChild(lo);bar.appendChild(card)});
 const c=$('noteCanvas');noteUndo=[];noteRedo=[];updNoteHist();
 setTimeout(()=>{setupNoteCanvas();const dpr=window.devicePixelRatio||1;const w=c.width/dpr,hh=c.height/dpr;noteCtx.clearRect(0,0,w,hh);
  idb.get(noteKey).then(r=>{if(r&&r.blob){const img=new Image();img.onload=()=>noteCtx.drawImage(img,0,0,w,hh);img.src=URL.createObjectURL(r.blob)}}).catch(()=>{})},50);
 setNoteTool('pen');$('noteSize').value=noteSize;
 document.querySelectorAll('.note-tool').forEach(b=>b.classList.toggle('active',b.dataset.color===noteColor));
 $('noteSwatchDot').style.background=noteColor;$('notePalette').classList.remove('show');applyNotePaper()}
function applyNotePaper(){const w=$('noteWrap');const lined=localStorage.getItem('verbes_note_paper')==='lined';w.classList.toggle('lined',lined);w.classList.toggle('plain',!lined);const pb=$('notePaper');pb.textContent=lined?'📄':'📓';pb.classList.toggle('active',lined)}
function setNoteTool(tool){noteErasing=tool==='erase';noteHighlight=tool==='hl';$('notePen').classList.toggle('active',tool==='pen');$('noteHl').classList.toggle('active',tool==='hl');$('noteErase').classList.toggle('active',tool==='erase')}
function closeNote(){$('noteModal').classList.remove('show');noteKey=null;noteCtx=null}
function saveNote(){if(!noteKey||!noteCtx)return;const c=$('noteCanvas');c.toBlob(async b=>{try{await idb.set(noteKey,{blob:b});if(noteBtn)noteBtn.textContent='📔'}catch(e){}closeNote();toast(t('saved'))},'image/png')}
function clearNote(){if(!noteCtx)return;noteSnapshot();const c=$('noteCanvas'),dpr=window.devicePixelRatio||1;noteCtx.clearRect(0,0,c.width/dpr,c.height/dpr)}
