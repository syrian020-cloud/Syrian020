<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Freelang</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
  :root {
    --bg: #0d0820; --card: #1a1133; --card2: #22173f; --field: #130c28;
    --line: rgba(167, 139, 250, .20); --accent: #8b5cf6; --accent2: #f97316;
    --txt: #f4efff; --dim: #a99cc8; --gold: #fbbf24;
    --danger: #f87171;
  }
  body.light {
    --bg: #f6f2fe; --card: #ffffff; --card2: #efe8fc; --field: #f9f6ff;
    --line: rgba(124, 58, 237, .20); --accent: #7c3aed; --accent2: #ea580c;
    --txt: #1e1436; --dim: #6b5b8e; --gold: #b45309;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--txt);
    font-family: 'Noto Kufi Arabic', 'Noto Naskh Arabic', 'Segoe UI', Roboto, Tahoma, Arial, sans-serif;
    overflow-x: clip; }
  body { min-height: 100vh; padding-bottom: 5.5rem; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(620px 300px at 85% -4%, rgba(139,92,246,.20), transparent 62%),
      radial-gradient(480px 260px at -8% 32%, rgba(249,115,22,.12), transparent 62%); }
  body.light::before { background:
    radial-gradient(620px 300px at 85% -4%, rgba(139,92,246,.10), transparent 62%),
    radial-gradient(480px 260px at -8% 32%, rgba(249,115,22,.07), transparent 62%); }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 100; background: rgba(7,19,26,.74);
    backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35);
    border-bottom: 1px solid var(--line); padding: .6rem .9rem; }
  body.light header { background: rgba(240,246,247,.80); }
  .topbar { display: flex; align-items: center; gap: .5rem; max-width: 860px; margin: 0 auto;
    flex-wrap: wrap; }
  .backb { background: var(--card); border: 1px solid var(--line); color: var(--txt);
    border-radius: 12px; padding: .4rem .7rem; font-size: 1rem; cursor: pointer; flex: none;
    font-family: inherit; }
  .backb:active { transform: scale(.92); }
  .logo { display: flex; align-items: center; gap: .5rem; font-weight: 900; font-size: 1.1rem;
    flex: none; min-width: 0; letter-spacing: .2px; }
  .logo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: linear-gradient(90deg, #c4b5fd, #fb923c); -webkit-background-clip: text;
    background-clip: text; -webkit-text-fill-color: transparent; }
  body.light .logo span { background: linear-gradient(90deg, #7c3aed, #ea580c);
    -webkit-background-clip: text; background-clip: text; }
  .logo img { width: 32px; height: 32px; border-radius: 10px; flex: none;
    box-shadow: 0 4px 12px rgba(249,115,22,.35); }
  .crumb { flex: 1; min-width: 0; font-weight: 700; font-size: .9rem; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .searchbox { flex: 1; display: flex; align-items: center; gap: .4rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: .42rem .7rem; transition: border-color .15s ease, box-shadow .15s ease; }
  .searchbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
  .searchbox input { flex: 1; background: none; border: none; outline: none;
    color: var(--txt); font-size: .9rem; font-family: inherit; min-width: 0; }
  .iconbtn { background: var(--card); border: 1px solid var(--line); color: var(--txt);
    border-radius: 12px; padding: .4rem .55rem; font-size: 1rem; cursor: pointer; flex: none;
    font-family: inherit; transition: transform .12s ease; }
  .iconbtn:active { transform: scale(.92); }
  .langmini { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 2px; flex: none; }
  .langmini button { border: none; background: none; color: var(--dim); font-size: .66rem; font-weight: 800;
    padding: .32rem .42rem; border-radius: 9px; cursor: pointer; font-family: inherit; }
  .langmini button.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  @media (max-width: 619px) {
    .logo { flex: 1; }
    .searchbox { order: 5; flex: 1 1 100%; }
  }

  main { max-width: 860px; margin: 0 auto; padding: .9rem .8rem; }

  /* ---------- cards / lists ---------- */
  .pl-stats { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; margin: .3rem 0 .9rem; }
  .pl-stat { background: var(--card, #fff); border: 1px solid var(--line, #e5e7eb); border-radius: 999px;
    padding: .45rem 1.1rem; font-size: 1.02rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .pl-stat b { font-size: 1.15rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: .7rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 1rem .7rem .8rem; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: .5rem; min-width: 0; position: relative;
    box-shadow: 0 4px 14px rgba(3,8,12,.22);
    transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease; }
  body.light .card { box-shadow: 0 4px 14px rgba(75,107,116,.10); }
  .card:active { transform: scale(.96) translateY(1px); border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(139,92,246,.25); }
  .cicon { width: 56px; height: 56px; border-radius: 18px; flex: none; display: flex;
    align-items: center; justify-content: center; font-weight: 900; font-size: 1.6rem;
    color: #fff; overflow: hidden; background: linear-gradient(135deg, #6d28d9, #ea580c);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 5px 12px rgba(234,88,12,.4); }
  .cicon img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
  .cname { font-weight: 800; font-size: .85rem; line-height: 1.25; text-align: center;
    max-width: 100%; overflow-wrap: anywhere; }
  .cmeta { font-size: .68rem; color: var(--dim); }
  .dots { position: absolute; top: .3rem; inset-inline-end: .3rem; background: none;
    border: none; color: var(--dim); font-size: 1.05rem; cursor: pointer; padding: .1rem .3rem;
    font-family: inherit; }
  .dots:active { color: var(--accent); }
  .lgrid { grid-template-columns: repeat(auto-fill, minmax(min(118px, 100%), 1fr)); gap: .55rem; }
  .lgrid .card { padding: .7rem .55rem .6rem; border-radius: 16px; gap: .35rem; }
  .lgrid .cicon { width: 44px; height: 44px; border-radius: 14px; font-size: 1.25rem; }
  .lgrid .cname { font-size: .78rem; }
  .lgrid .cmeta { font-size: .62rem; }
  .lgrid .dots { font-size: .95rem; }

  /* ---------- phrase cards ---------- */
  .ph { display: flex; gap: .6rem; align-items: flex-start; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px; padding: .8rem .75rem;
    margin-bottom: .65rem; position: relative; box-shadow: 0 4px 14px rgba(3,8,12,.18); }
  body.light .ph { box-shadow: 0 4px 14px rgba(75,107,116,.09); }
  .ph-flag { flex: none; width: 44px; height: 44px; border-radius: 14px; font-size: 1.5rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: linear-gradient(135deg, var(--field), var(--card2)); border: 1px solid var(--line);
    font-family: inherit; transition: transform .12s ease; }
  .ph-flag:active { transform: scale(.88); }
  .ph-flag.speaking { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,.2); }
  .ph-body { flex: 1; min-width: 0; }
  .ph-row { display: flex; gap: .6rem; align-items: flex-start; margin-top: .65rem; }
  .ph-row .ph-text { flex: 1; }
  .ph-text { font-size: 1.12rem; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
  .ph-text.wlg-ar { font-family: 'Noto Kufi Arabic', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif;
    font-size: 1.18rem; }
  .ph-text.wlg-fr { font-family: Georgia, 'Times New Roman', 'Segoe UI', serif; }
  .ph-text.wlg-en { font-family: 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', sans-serif; }
  .ph-text .w { cursor: pointer; border-radius: 6px; padding: 0 1px; }
  .ph-text .w.speak, .ph-text .w.speaking { background: var(--accent); color: #fff; }
  .ph-line { font-size: .8rem; color: var(--dim); margin-top: .2rem; line-height: 1.5; }
  .ph-line b { color: var(--txt); font-weight: 700; }
  button.ph-line.ph-speak { display: block; width: 100%; text-align: start; background: none;
    border: none; padding: .15rem .3rem; border-radius: 8px; cursor: pointer; font-family: inherit; }
  button.ph-line.ph-speak:active { background: var(--accent2); color: var(--accent); }
  button.ph-line.ph-speak.speaking { color: var(--accent); }
  .ph-dots { position: absolute; top: .4rem; inset-inline-end: .4rem; background: none;
    border: none; color: var(--dim); font-size: 1rem; cursor: pointer; padding: .1rem .3rem;
    font-family: inherit; }
  .note { text-align: center; font-size: .98rem; font-weight: 700; color: var(--txt);
    padding: .7rem .4rem; }

  .empty { text-align: center; color: var(--dim); padding: 3rem 1rem; font-size: .9rem; }
  .empty .big { font-size: 2.6rem; display: block; margin-bottom: .6rem; }

  /* ---------- FAB ---------- */
  .fab { position: fixed; bottom: 1.3rem; inset-inline-end: 1.1rem; z-index: 300;
    width: 58px; height: 58px; border-radius: 19px; border: none; cursor: pointer;
    font-size: 1.55rem; color: #fff; font-family: inherit;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 10px 26px rgba(139,92,246,.45); transition: transform .12s ease; }
  .fab:active { transform: scale(.9); }

  /* ---------- toast ---------- */
  #toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
    background: #12242f; border: 1px solid var(--line); color: #e6f4f3;
    border-radius: 14px; padding: .55rem 1rem; font-size: .82rem; z-index: 5000;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }

  /* ---------- sheets & dialogs ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(2,7,11,.66); backdrop-filter: blur(4px);
    z-index: 4000; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; background: var(--card2);
    border: 1px solid var(--line); border-bottom: none; border-radius: 26px 26px 0 0;
    padding: .8rem 1.2rem 1.6rem; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 -14px 44px rgba(0,0,0,.45); }
  .sheet::before { content: ''; display: block; width: 42px; height: 4px; border-radius: 4px;
    background: var(--line); margin: 0 auto .8rem; }
  .sheet h3 { margin: 0 0 .8rem; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 button { background: none; border: none; color: var(--dim); font-size: 1.2rem; cursor: pointer; }

  .flabel { font-size: .72rem; color: var(--dim); margin: .55rem 0 .25rem; }
  .frow { display: flex; gap: .4rem; align-items: center; }
  .field { flex: 1; display: flex; align-items: center; gap: .4rem; min-width: 0;
    background: var(--field); border: 1px solid var(--line); border-radius: 14px;
    padding: .55rem .7rem; transition: border-color .15s ease, box-shadow .15s ease; }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,.14); }
  .field input, .field textarea { flex: 1; background: none; border: none; outline: none;
    color: var(--txt); font-size: .88rem; font-family: inherit; min-width: 0; resize: vertical; }
  .mini { flex: none; background: var(--card); border: 1px solid var(--line); color: var(--txt);
    border-radius: 10px; padding: .35rem .6rem; font-size: .75rem; cursor: pointer; font-family: inherit; }
  .mini:active { background: var(--accent); color: #fff; }

  .flagpick { display: flex; gap: .35rem; overflow-x: auto; padding: .15rem 0 .35rem; }
  .flagpick button { flex: none; width: 42px; height: 42px; border-radius: 12px; font-size: 1.35rem;
    background: var(--field); border: 1.5px solid var(--line); cursor: pointer; font-family: inherit; }
  .flagpick button.on { border-color: var(--accent); background: var(--card);
    box-shadow: 0 0 0 3px rgba(139,92,246,.18); }

  .actions { display: flex; gap: .5rem; margin-top: .9rem; }
  .btn { flex: 1; border: 1px solid var(--line); border-radius: 14px; padding: .7rem;
    font-size: .9rem; cursor: pointer; font-family: inherit; background: var(--card); color: var(--txt);
    transition: transform .12s ease; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none;
    color: #fff; font-weight: 700; box-shadow: 0 6px 18px rgba(249,115,22,.35); }
  .btn.danger { color: var(--danger); border-color: rgba(248,113,113,.4); }
  .xhead { display: flex; align-items: center; justify-content: space-between; margin-top: .3rem; }
  .xbox { border: 1.5px solid var(--line); border-radius: 14px; max-height: 36vh;
    overflow-y: auto; margin: .35rem 0 .6rem; }
  .xrow { display: flex; align-items: center; gap: .6rem; width: 100%; padding: .55rem .7rem;
    background: none; border: none; border-bottom: 1px solid var(--line); cursor: pointer;
    font-family: inherit; font-size: 1rem; color: var(--txt); text-align: start; }
  .xrow:last-child { border-bottom: none; }
  .xrow input, .xtypes input { width: 1.2rem; height: 1.2rem; accent-color: #7c3aed;
    flex: none; cursor: pointer; }
  .xtypes { display: flex; gap: 1.1rem; flex-wrap: wrap; justify-content: center;
    margin: .4rem 0 .7rem; }
  .xtypes label { display: flex; align-items: center; gap: .35rem; font-weight: 700; cursor: pointer; }
  .xact { display: flex; flex-direction: column; gap: .45rem; }
  .xw { width: 100%; flex: none; padding: .85rem; font-size: 1rem; border-radius: 999px; }

  .mrow { display: flex; align-items: center; gap: .7rem; width: 100%; background: rgba(139,92,246,.07);
    border: 1px solid var(--line); border-radius: 16px; padding: .8rem 1rem; margin-bottom: .55rem;
    color: var(--txt); font-size: .9rem; cursor: pointer; font-family: inherit; text-align: start; }
  body.light .mrow { background: rgba(249,115,22,.06); }
  .mrow:active { background: rgba(139,92,246,.16); }
  .mrow .mi { font-size: 1.1rem; width: 1.6rem; text-align: center; flex: none; }
  .mrow.fl-danger { color: var(--danger); }
  .langs { display: flex; gap: .5rem; margin-bottom: .7rem; }
  .langb { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--txt);
    border-radius: 14px; padding: .6rem; font-size: .85rem; cursor: pointer; font-family: inherit; }
  .langb.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; font-weight: 700; }

  .tplbox { background: var(--field); border: 1px solid var(--line); border-radius: 14px;
    padding: .7rem .8rem; font-size: .78rem; line-height: 1.8; color: var(--dim);
    white-space: pre-wrap; direction: rtl; margin-bottom: .5rem;
    max-height: 130px; overflow-y: auto; }
  .tplhead { display: flex; align-items: center; justify-content: space-between;
    gap: .5rem; margin: .35rem 0 .15rem; }
  .tplname { font-size: .8rem; font-weight: 800; color: var(--txt); }
  .dlg { width: 100%; max-width: 340px; background: var(--card2); border: 1px solid var(--line);
    border-radius: 22px; padding: 1.3rem; text-align: center; margin: auto 1rem; }
  .dlg p { font-size: .95rem; margin: 0 0 1rem; }
  .dlg .row { display: flex; gap: .6rem; }
  .dlg button { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: .6rem;
    font-size: .9rem; cursor: pointer; font-family: inherit; background: var(--card); color: var(--txt); }
  .dlg button.yes { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; font-weight: 700; }

  /* ---------- timed media (zeek-style) ---------- */
  .media-box { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: .6rem; margin-bottom: .7rem; box-shadow: 0 4px 14px rgba(3,8,12,.18); }
  .media-box video { width: 100%; border-radius: 12px; background: #000; max-height: 300px; }
  .media-box video.fit-cover { object-fit: cover; }
  .media-box video.fit-fill { object-fit: fill; }
  .media-box video.fit-tall { max-height: 62vh; }
  .media-box .vcrop { position: relative; }
  .media-box .vcrop.crop-on { overflow: hidden; border-radius: 12px; }
  .media-box .vcrop.crop-on video { object-fit: cover; object-position: top; }
  .vc-loop { position: absolute; top: .5rem; inset-inline-start: .5rem; z-index: 5;
    width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
    background: rgba(10,16,22,.55); font-size: 1.15rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0; }
  .vc-loop.on { background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent; box-shadow: 0 0 10px rgba(139,92,246,.6); }
  .media-box .vcover { position: absolute; inset: 0; z-index: 4; border-radius: 12px;
    overflow: hidden; background: #000; }
  .media-box .vcover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media-box .vcover-x { position: absolute; top: .5rem; inset-inline-end: .5rem; z-index: 6;
    width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 2px solid rgba(255,255,255,.4);
    background: rgba(10,16,22,.65); color: #fff; font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0; }
  .media-box audio { width: 100%; height: 42px; }
  /* caption pills — zeelang style: solid colored box per language, flag at the edge */
  .cue-now .cue-line { position: relative; display: flex; align-items: center; gap: .8rem;
    direction: ltr; border-radius: 26px; border-width: 2px; border-style: solid;
    padding: .55rem 1.1rem; margin: .35rem auto;
    font-weight: 800; font-size: 1.35rem; width: 100%; box-sizing: border-box;
    overflow-wrap: anywhere; text-align: center; line-height: 1.45;
    box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .cue-now .cue-line > span:last-child { flex: 1; min-width: 0; }
  .cue-line { font-family: 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', sans-serif;
    letter-spacing: .01em; cursor: pointer; }
  .cue-line.speaking { outline: 3px solid rgba(255,255,255,.7); }
  .cue-line .cue-flag { position: static; transform: none; font-size: 2rem;
    line-height: 1; flex: none; }
  .cue-line.lg-fr { background: var(--cap-fr-bg, #3d3d3d); color: var(--cap-fr-fg, #fff);
    border: 2px solid var(--cap-fr-bd, transparent);
    font-family: var(--cap-fr-font, Georgia, 'Times New Roman', 'Segoe UI', serif);
    font-style: var(--cap-fr-style, italic); }
  .cue-line.lg-ar { background: var(--cap-ar-bg, #d9a21b); color: var(--cap-ar-fg, #33260a);
    border: 2px solid var(--cap-ar-bd, transparent);
    font-family: var(--cap-ar-font, 'Noto Kufi Arabic', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif);
    font-style: var(--cap-ar-style, normal); font-size: 1.45rem; }
  .cue-line.lg-en { background: var(--cap-en-bg, #f3ecd9); color: var(--cap-en-fg, #2b2b2b);
    border: 2px solid var(--cap-en-bd, transparent);
    font-family: var(--cap-en-font, 'Segoe UI', 'Noto Sans', Roboto, sans-serif);
    font-style: var(--cap-en-style, normal); }
  .cue-line.lg-x { background: var(--cap-x-bg, linear-gradient(135deg, #a78bfa, #7c3aed));
    color: var(--cap-x-fg, #fff); border: 2px solid var(--cap-x-bd, transparent);
    font-family: var(--cap-x-font, 'Segoe UI', sans-serif); font-style: var(--cap-x-style, normal); }
  .cue-tools .mini.rec-on { background: #e11d48; color: #fff; border-color: transparent;
    animation: recPulse 1s infinite alternate; }
  @keyframes recPulse { from { box-shadow: 0 0 0 0 rgba(225,29,72,.5); }
    to { box-shadow: 0 0 0 6px rgba(225,29,72,.15); } }
  .cue-now { text-align: center; font-size: 1.05rem; font-weight: 800; line-height: 1.45;
    padding: .55rem .3rem .2rem; min-height: 1.5rem; overflow-wrap: anywhere; }
  .cue-tools { display: flex; gap: .4rem; justify-content: center; margin-top: .35rem; }
  .cue-tools .mini { font-size: .78rem; padding: .3rem .55rem; border-radius: 10px; }
  .cue-tools .mini.on { background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-color: transparent; }
  .cue { display: block; margin-bottom: .8rem; border-inline-start: 3px solid transparent; }
  .cue.on { border-inline-start-color: var(--accent); }
  /* cue rows — big pastel pills, flag inside at the left edge (grok style) */
  .crow { display: flex; align-items: center; gap: 1rem; direction: ltr;
    border-radius: 26px; border: 2px solid; padding: .85rem 1.3rem;
    margin-bottom: .7rem; box-shadow: 0 4px 12px rgba(3,8,12,.16); }
  .crow .crow-flag { flex: none; font-size: 2rem; line-height: 1; background: none;
    border: none; cursor: pointer; padding: 0; font-family: inherit;
    transition: transform .12s ease; }
  .crow .crow-flag:active { transform: scale(.88); }

var backupTimer = null;
function writeBackup(json) {
  try {
    var FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
    if (!FS) return;
    if (backupTimer) clearTimeout(backupTimer);
    backupTimer = setTimeout(function () {
      FS.writeFile({ path: (FL_ADMIN ? 'freelang-admin-backup.json' : 'freelang-backup.json'), data: json, directory: 'DATA', recursive: true }).catch(function () {});

  } catch (e) {}
}

(function restoreBackup() {
  try {
    var FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
    if (!FS) return;
    var raw = localStorage.getItem(DATA_KEY);
    if (raw && raw !== '[]') return;   // localStorage intact — nothing to restore
    FS.readFile({ path: (FL_ADMIN ? 'freelang-admin-backup.json' : 'freelang-backup.json'), directory: 'DATA' }).then(function (r) {
      try {
        var txt = typeof r.data === 'string' ? r.data : '';

/* ================= speech ================= */
var speakTok = 0;
// never mix voices: any TTS start pauses the lesson video/audio
if (window.EdgeTTS) {
  var _edgePlay = EdgeTTS.play;
  EdgeTTS.play = function () {
    if (mediaEl) { try { mediaEl.pause(); } catch (e) {} }
    return _edgePlay.apply(EdgeTTS, arguments);
  };
}
// per-phrase voice for dialogues: explicit p.voice wins, otherwise the
// voice set on the first phrase of the same parity (odd/even) is reused —
// setting voices on phrase 1 & 2 casts the whole conversation.
function phraseVoice(l, p, lang) {
  var v = p.voice;
  if (!v && l) {
    var ph = l.phrases || [];
    var i = ph.indexOf(p);
    if (i > 1 && ph[i % 2] && ph[i % 2].voice) v = ph[i % 2].voice;
  }
  // a custom voice only applies to lines spoken in its own language
  return (v && v.split('-')[0] === lang) ? v : null;
}
function speak(text, lang, flagEl, voice) {
  if (!window.EdgeTTS) return;
  stopReadAll();
  speakTok++;
  var was = flagEl && flagEl.classList.contains('speaking');
  document.querySelectorAll('.speaking, .w.speak').forEach(function (x) {
    x.classList.remove('speaking'); x.classList.remove('speak');
  });
  if (was) { EdgeTTS.stop(); return; }   // tap again = stop the loop
  if (flagEl) flagEl.classList.add('speaking');
  var tok = speakTok;
  (function play() {
    if (tok !== speakTok) return;
    EdgeTTS.play(text, lang || 'fr', voice).then(function () {
      if (tok === speakTok) play();       // loop until stopped
    }, function () {
      toast('TTS ✗');
      if (flagEl) flagEl.classList.remove('speaking');
    });
  })();
}
// letters spelled out one by one in the phrase's own language, e.g. H-e-l-l-o
function speakLetters(text, lang, flagEl) {
  var s = (text || '').replace(/[^\p{L}\p{N}]/gu, ' ').split('').join(' ');
  speak(s || text, lang, flagEl);
}
// 🐢 slow loop — half-speed speak() variant for the Read & Repeat game
function speakSlow(text, lang, flagEl) {
  if (!window.EdgeTTS) return;
  stopReadAll();
  speakTok++;
  var was = flagEl && flagEl.classList.contains('speaking');
  document.querySelectorAll('.speaking, .w.speak').forEach(function (x) {
    x.classList.remove('speaking'); x.classList.remove('speak');
  });
  var prev = EdgeTTS.speed;
  if (was) { EdgeTTS.stop(); EdgeTTS.speed = playSpeed; return; }
  if (flagEl) flagEl.classList.add('speaking');
  var tok = speakTok;
  EdgeTTS.speed = 0.5;
  (function play() {
    if (tok !== speakTok) { EdgeTTS.speed = prev; return; }
    EdgeTTS.play(text, lang || 'fr').then(function () {
      if (tok === speakTok) play(); else EdgeTTS.speed = prev;
    }, function () {
      EdgeTTS.speed = prev;
      toast('TTS ✗');
      if (flagEl) flagEl.classList.remove('speaking');
    });
  })();
}
var readAllJob = null;
// which languages read-all speaks — zeelang's 🔁 selector
var READ_LANG_SETS = [
  { id: 'all', label: 'French + Arabic + English', short: 'FR+AR+EN', langs: null },
  { id: 'fr_ar', label: 'French + Arabic', short: 'FR+AR', langs: ['fr', 'ar'] },

];
var readLangSet = localStorage.getItem('freelang_readlangs') || 'all';
function readSetShort() {

  return s ? s.short : READ_LANG_SETS[0].short;
}
function readSetLabel() {

  return s ? s.label : READ_LANG_SETS[0].label;
}
function stopReadAll() {
  if (readAllJob) readAllJob.cancelled = true;
  speakTok++;
  if (window.EdgeTTS) EdgeTTS.stop();
  if (mediaEl) { try { mediaEl.pause(); } catch (e) {} }
  readAllJob = null;
  var b = document.getElementById('readAllBtn');

// ⏹ stop EVERYTHING that can make sound: read-all, TTS loops, media
function stopAllSound() {
  stopReadAll();
  speakTok++;
  if (window.EdgeTTS) EdgeTTS.stop();
  if (mediaEl) { try { mediaEl.pause(); } catch (e) {} }
  loopSeg = null;
  document.querySelectorAll('.speaking').forEach(function (x) { x.classList.remove('speaking'); });
  document.querySelectorAll('.loop-btn.on, .mini.on').forEach(function (x) {
    if (x.textContent.trim() === '🔂') x.classList.remove('on');
  });
}
function readAll(lesson) {
  var t = T();
  if (readAllJob) { stopReadAll(); return; }
  var set = READ_LANG_SETS.filter(function (x) { return x.id === readLangSet; })[0] || READ_LANG_SETS[0];
  var items = [];
  (lesson.phrases || []).forEach(function (p) {
    if (p.type === 'note') return;
    var pLang = p.lang || langOfFlag(p.flag);
    items.push({ t: p.text, lang: pLang, el: 'phflag-' + p.id, voice: phraseVoice(lesson, p, pLang) });
    (p.rows || []).forEach(function (r, i) {
      items.push({ t: r.text, lang: r.lang || langOfFlag(r.flag), el: 'phflag-' + p.id + '-' + i });
    });
    if (p.meaning) items.push({ t: p.meaning, lang: 'ar', el: 'phflag-' + p.id + '-m' });
    if (p.en) items.push({ t: p.en, lang: 'en', el: 'phflag-' + p.id + '-e' });
  });
  // timed caption cues are read too — every language row in order
  (lesson.cues || []).forEach(function (c) {
    cueRows(c.text).forEach(function (r) {
      var lang = r.lang === 'auto' ? 'fr' : (r.lang || langOfFlag(r.flag));
      items.push({ t: r.text, lang: lang, el: null });
    });
  });
  if (set.langs) items = items.filter(function (it) { return set.langs.indexOf(it.lang) >= 0; });
  if (!items.length) return;
  var btn = document.getElementById('readAllBtn');
  btn.textContent = '⏹';
  var btn2 = document.getElementById('readAllBar');
  if (btn2) btn2.textContent = '⏹';
  var job = { cancelled: false, i: 0 };
  readAllJob = job;
  speakTok++;   // stop any single-phrase loop
  function next() {
    if (job.cancelled) {
      if (readAllJob === job) readAllJob = null;
      return;
    }
    if (job.i >= items.length) job.i = 0;   // loop the whole lesson until ⏹
    var it = items[job.i++];
    var flagEl = document.getElementById(it.el);
    document.querySelectorAll('.ph-flag.speaking').forEach(function (x) { x.classList.remove('speaking'); });
    if (flagEl) flagEl.classList.add('speaking');
    EdgeTTS.play((it.t || '').slice(0, 400), it.lang, it.voice)
      .catch(function () {})
      .then(function () {
        if (flagEl) flagEl.classList.remove('speaking');
        if (!job.cancelled) setTimeout(next, 260);
      });
  }
  next();
}

// words are individually tappable: tap = speak, double-tap = Google Images
function wordRow(text, lang) {
  var tx = el('div', 'ph-text');
  tx.classList.add('wlg-' + (lang === 'ar' || lang === 'en' || lang === 'fr' ? lang : 'x'));
  (text || '').split(/\s+/).forEach(function (w) {
    if (!w) return;
    var ws = el('span', 'w', w);
    var last = 0;
    ws.onclick = function () {
      var now = Date.now();
      if (now - last < 330) {
        openExternal('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(w));
      } else {
        speak(w, lang, ws);   // tap = speak the word in a loop, tap again = stop

  };
  ptl.appendChild(ci);

  var sl2 = el('button', 'ctime-say', '🔁');
  sl2.title = 'speak phrase loop';
  sl2.onclick = function (e) {
    e.stopPropagation();
    var rows = [{ text: p.text, lang: p.lang || langOfFlag(p.flag) }];
    (p.rows || []).forEach(function (r) { rows.push({ text: r.text, lang: r.lang || langOfFlag(r.flag) }); });
    if (p.meaning) rows.push({ text: p.meaning, lang: 'ar' });

    rows = rows.filter(function (r) { return r.text; });
    if (!rows.length || !window.EdgeTTS) return;
    if (sl2.classList.contains('speaking')) {

function shareTextFile(txt, name) {
  var FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
  var SH = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Share;
  if (inCap && FS && SH) {
    return FS.writeFile({ path: name, data: txt, directory: 'CACHE', encoding: 'utf8', recursive: true })
      .then(function (w) { return SH.share({ title: name, url: w.uri, dialogTitle: 'Gemini' }); });
  }
  var blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  try {
    var file = new File([blob], name, { type: 'text/plain' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: name });
  } catch (e) {}
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  return Promise.resolve();
}

// serialize the whole lesson to the editable text format (flag lines + meta)
function lessonToText(l) {
  var out = [];
  (l.phrases || []).forEach(function (p) {
    if (p.type === 'note') { out.push('📝 ' + p.text, ''); return; }
    out.push((p.flag || '🏳') + ' ' + (p.text || ''));
    if (p.latin) out.push('🔤 ' + p.latin);
    if (p.arp) out.push('🔊 ' + p.arp);
    (p.rows || []).forEach(function (r) {
      out.push((r.flag || '🏳') + ' ' + (r.text || ''));
      if (r.latin) out.push('🔤 ' + r.latin);
      if (r.arp) out.push('🔊 ' + r.arp);
    });
    if (p.meaning) out.push('🇸🇾 ' + p.meaning);
    if (p.en) out.push('🇺🇸 ' + p.en);
    if (p.note) out.push('📝 ' + p.note);
    out.push('');
  });
  (l.cues || []).forEach(function (c) {
    out.push(fmtT(c.start) + ' --> ' + fmtT(c.end) + ' ' + (c.text || ''));
  });
  return out.join('\n');

      });

function blobDataURL(blob) {
  return new Promise(function (res) {

    rd.onload = function () { res(rd.result); };
    rd.onerror = function () { res(null); };

function dataURLtoBlob(durl) {
  var p = (durl || '').split(',');

  var parts = [];

    for (var i = 0; i < b64.length; i += CH) {
      var bin = atob(b64.slice(i, i + CH));
      var u8 = new Uint8Array(bin.length);
      for (var j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);
      parts.push(u8);
    }
    return new Blob(parts, { type: mime });
  } catch (e) { return null; }
}
// stream a blob to a JSON file as base64 — 3 MB slices (multiple of 3 bytes so

function streamBlobB64(path, blob, directory) {

  var CH = 3 * 1024 * 1024;

    if (off >= blob.size) return Promise.resolve();
    return new Promise(function (res, rej) {
      var rd = new FileReader();
      rd.onload = function () { res(rd.result); };
      rd.onerror = rej;
      rd.readAsDataURL(blob.slice(off, Math.min(blob.size, off + CH)));

      off += CH;
      var b64 = String(r).split(',')[1] || '';
      return FS.appendFile({ path: path, data: b64, directory: directory, encoding: 'utf8' });
    }).then(pump);
  }
  return pump();
}

  };

function mediaGetP(key) { return new Promise(function (res) { mediaGet(key, function (b) { res(b || null); }); }); }

async function blobHash(blob) {
  try {
    if (!(window.crypto && crypto.subtle)) return '';

    // every byte is read, memory stays bounded for large videos
    var CH = 4 * 1048576, digests = [], off = 0;

      var b = await blob.slice(off, Math.min(off + CH, blob.size)).arrayBuffer();
      digests.push(new Uint8Array(await crypto.subtle.digest('SHA-256', b)));
      off += CH;
    }
    if (!digests.length) digests.push(new Uint8Array(await crypto.subtle.digest('SHA-256', new ArrayBuffer(0))));
    var buf = new Uint8Array(digests.length * 32);
    for (var i = 0; i < digests.length; i++) buf.set(digests[i], i * 32);
    var v = new Uint8Array(await crypto.subtle.digest('SHA-256', buf.buffer)), h = '';

function findInstalled(id) {
  for (var i = 0; i < folders.length; i++) {
    var ls = folders[i].lessons || [];
    for (var j = 0; j < ls.length; j++) if (ls[j].id === id && ls[j].remote) return { f: folders[i], l: ls[j] };
  }
  return null;
}
function removeInstalled(id) {
  var hit = findInstalled(id);
  if (!hit) return;
  MEDIA_KEYS.forEach(function (k) { mediaDel(k + id); });
  hit.f.lessons = hit.f.lessons.filter(function (x) { return x.id !== id; });
  if (hit.f.remote && !hit.f.lessons.length) folders = folders.filter(function (x) { return x !== hit.f; });
}
function mediaPutP(key, blob) { return new Promise(function (res) { mediaPut(key, blob, function (ok) { res(ok); }); }); }
async function downloadLesson(cf, e) {
  var data = await fetchPub(e.file, false);
  if (!data) throw new Error('lesson');
  for (var i = 0; i < (e.media || []).length; i++) {
    var m = e.media[i];
    var b = await fetchPub(m.path, true);
    if (!b) throw new Error('media');
    if (m.type && b.type !== m.type) b = new Blob([b], { type: m.type });
    if (!(await mediaPutP(m.key, b))) throw new Error('media store');
  }
  var nl = cleanLesson(data);
  nl.id = e.id;
  nl.remote = { rev: e.rev, mode: e.mode, at: Date.now() };
  var f = folders.filter(function (x) { return x.id === cf.id; })[0];
  if (!f) {
    f = { id: cf.id, name: cf.name, icon: cf.icon, img: cf.img, lessons: [], remote: true };
    folders.unshift(f);
  }
  var old = (f.lessons || []).filter(function (x) { return x.id === e.id; })[0];
  // media keys that disappeared in the new revision
  if (old) MEDIA_KEYS.forEach(function (k) {
    if (!(e.media || []).some(function (m) { return m.key === k + e.id; })) mediaDel(k + e.id);
  });
  var order = (cf.lessons || []).map(function (x) { return x.id; });
  f.lessons = (f.lessons || []).filter(function (x) { return x.id !== e.id; });
  f.lessons.push(nl);
  f.lessons.sort(function (a, b) {
    var ia = order.indexOf(a.id), ib = order.indexOf(b.id);
    return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib);
  });
  saveData();
}
function catEntries(cat) {
  var out = [];
  ((cat && cat.folders) || []).forEach(function (cf) { (cf.lessons || []).forEach(function (e) { out.push({ cf: cf, e: e }); }); });
  return out;
}
function applyCatalog(cat) {
  var changed = false;
  (cat.revoked || []).forEach(function (id) { if (findInstalled(id)) { removeInstalled(id); changed = true; } });
  (cat.folders || []).forEach(function (cf) {
    var f = folders.filter(function (x) { return x.id === cf.id && x.remote; })[0];
    if (f && (f.name !== cf.name || f.icon !== cf.icon || f.img !== cf.img)) { f.name = cf.name; f.icon = cf.icon; f.img = cf.img; changed = true; }
  });
  catEntries(cat).forEach(function (x) {
    var hit = findInstalled(x.e.id);
    if (hit && hit.l.remote.mode !== x.e.mode) { hit.l.remote.mode = x.e.mode; changed = true; }
  });
  if (changed) saveData();
  return changed;
}
async function syncLibrary(manual) {
  var c = FT();
  if (FL_ADMIN || cloud.syncing) return;
  cloud.syncing = true;
  if (manual) setBusy('⏳ ' + c.syncing);
  var got = 0;
  try {
    var cat = await fetchCatalog();
    if (!cat) { if (manual) toast(c.offline); return; }
    saveCatalog(cat);
    var changed = applyCatalog(cat);
    var jobs = catEntries(cat).filter(function (x) {
      if (x.e.mode === 'lock' || !x.e.file) return false;
      var hit = findInstalled(x.e.id);
      if (hit) return hit.l.remote.rev < x.e.rev;   // installed lessons always follow admin updates
      return x.e.mode === 'auto';
    });
    for (var i = 0; i < jobs.length; i++) {
      if (manual) setBusy('⏳ ' + c.syncing + ' ' + (i + 1) + '/' + jobs.length);
      try { await downloadLesson(jobs[i].cf, jobs[i].e); got++; } catch (e) {}
    }
    if (got) toast(c.autoGot + got);
    else if (manual) toast(c.syncOk);
    if (changed || got || nav.lib) render();
  } catch (e) {
    if (manual) toast(c.offline);
  } finally {
    cloud.syncing = false;
    if (manual) setBusy('');
  }
}

function quizTone(ok) {

    var ctx = quizTone.ctx || (quizTone.ctx = new Ctx());
    var t0 = ctx.currentTime;
    [0, .12].forEach(function (d, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = ok ? [523.25, 659.25][i] : (i ? 196 : 220);
      o.type = 'sine';
      g.gain.setValueAtTime(.001, t0 + d);
      g.gain.exponentialRampToValueAtTime(ok ? .14 : .11, t0 + d + .02);
      g.gain.exponentialRampToValueAtTime(.001, t0 + d + (ok ? .22 : .18));
      o.connect(g); g.connect(ctx.destination);
      o.start(t0 + d); o.stop(t0 + d + .3);
    });
  } catch (e) {}
}

  if (el2) el2.classList.add('speaking');

  (function play(i) {
    if (tok !== speakTok) return;
    EdgeTTS.play(i ? t2 : t1, (i ? l2 : l1) || 'fr').then(function () {
      if (tok === speakTok) play(1 - i);

    var map = phMap(p);
    var html = '<div class="lz-verdict ' + (ok ? 'ok' : 'bad') + '"><div class="lz-face">' + (ok ? '😄' : '😢') + '</div>';
    var pmLang = gameQLang(p);
    Object.keys(map).forEach(function (li) {
      var txt = map[li];
      if (txt) html += '<div class="lz-v-line"><span class="' + (li === pmLang ? 'lz-v-fr' : 'lz-v-tr') + '" dir="' + (li === 'ar' ? 'rtl' : 'ltr') + '">' + esc(txt) + '</span>' +
        '<button class="lz-v-loop" data-lang="' + li + '" title="🔁">🔁</button></div>';
    });
    html += '</div>';
    hero.innerHTML = html;
    hero.querySelectorAll('.lz-v-loop').forEach(function (b) {
      var span = b.parentNode.querySelector('span');
      b.onclick = function () { speak(span.textContent, b.dataset.lang, b); };
    });
    // after answering, loop-speak the correct answer (the green tile = lz.lang)
    var aLoopBtn = hero.querySelector('.lz-v-loop[data-lang="' + lz.lang + '"]');
    if (aLoopBtn) speak(phText(p, lz.lang), lz.lang, aLoopBtn);
  }
  lz.answered = true;
  clearTimeout(lz.timer);
  if (lz.auto) lz.timer = setTimeout(lzNext, 5000);
}
function lzNext() {
  if (!document.getElementById('quiz-overlay')) return;
  clearTimeout(lz.timer);
  lz.answered = false;
  quizStopSpeak();
  lz.idx++;
  if (lz.idx >= lz.qs.length) { lzFinish(); return; }
  lzQuestion();
}
function lzFinish() {
  var t = T();
  var total = lz.correct + lz.wrong;
  var pct = total ? Math.round(lz.correct / total * 100) : 100;
  var color = pct >= 70 ? '#1f9d55' : pct >= 40 ? '#f59e0b' : '#e0245e';
  var body = document.getElementById('quiz-body');
  if (!body) return;
  body.innerHTML = '<div class="qz-end"><div class="qz-pct" style="color:' + color + '">' + pct + '%</div>' +
    '<div style="font-size:1.25rem;margin:.7rem 0 1.4rem">✅ ' + lz.correct + ' &nbsp; ❌ ' + lz.wrong + '</div>' +
    '<div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap">' +
    '<button class="btn" id="lz-again">🔁 ' + esc(t.quizReplay) + '</button>' +
    '<button class="btn" id="lz-exit">✕ ' + esc(t.quizExit) + '</button></div></div>';
  document.getElementById('quiz-progress').textContent = t.quizScore + ': ' + pct + '%';
  document.getElementById('lz-again').onclick = function () { openListen(lz.lesson); };
  document.getElementById('lz-exit').onclick = closeQuiz;
}

/* ================= notebook (zeelang) ================= */
var notesMap = {};
try { notesMap = JSON.parse(localStorage.getItem('freelang_notes') || '{}'); } catch (e) { notesMap = {}; }
function saveNotes() { try { localStorage.setItem('freelang_notes', JSON.stringify(notesMap)); } catch (e) {} }
var noteKey = null, noteCtx = null, noteDrawing = false, noteErasing = false,
  noteHighlight = false, noteColor = '#111827', noteSize = 3, noteUndo = [], noteRedo = [];

function noteSnapshot() {
  if (!noteCtx) return;
  var canvas = document.getElementById('noteCanvas');
  noteUndo.push(noteCtx.getImageData(0, 0, canvas.width, canvas.height));
  if (noteUndo.length > 30) noteUndo.shift();
  noteRedo = [];
  updateNoteHistoryButtons();
}
function noteRestore(img) {
  noteCtx.save();
  noteCtx.setTransform(1, 0, 0, 1, 0, 0);
  noteCtx.globalCompositeOperation = 'source-over';
  noteCtx.globalAlpha = 1;
  noteCtx.clearRect(0, 0, img.width, img.height);
  noteCtx.putImageData(img, 0, 0);
  noteCtx.restore();
}
function undoNote() {
  if (!noteCtx || !noteUndo.length) return;
  var canvas = document.getElementById('noteCanvas');
  noteRedo.push(noteCtx.getImageData(0, 0, canvas.width, canvas.height));
  noteRestore(noteUndo.pop());
  updateNoteHistoryButtons();
}
function redoNote() {
  if (!noteCtx || !noteRedo.length) return;
  var canvas = document.getElementById('noteCanvas');
  noteUndo.push(noteCtx.getImageData(0, 0, canvas.width, canvas.height));
  noteRestore(noteRedo.pop());
  updateNoteHistoryButtons();
}
function updateNoteHistoryButtons() {
  var u = document.getElementById('noteUndo');
  var r = document.getElementById('noteRedo');
  if (u) u.disabled = !noteUndo.length;
  if (r) r.disabled = !noteRedo.length;
}
function setNoteSize(n) {
  noteSize = Math.min(16, Math.max(1, n));
  var s = document.getElementById('noteSize');
  if (s) s.value = noteSize;
}
function setupNoteCanvas() {
  var canvas = document.getElementById('noteCanvas');
  noteCtx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var cssWidth = canvas.clientWidth || 600;
  var cssHeight = canvas.clientHeight || 400;
  canvas.width = Math.max(1, cssWidth * dpr);
  canvas.height = Math.max(1, cssHeight * dpr);
  noteCtx.setTransform(1, 0, 0, 1, 0, 0);
  noteCtx.scale(dpr, dpr);
  noteCtx.lineCap = 'round';
  noteCtx.lineJoin = 'round';
}
function openNote(key, phraseOverride) {
  noteKey = key;
  document.getElementById('noteModal').classList.add('show');
  var phrase = phraseOverride || findPhraseById(key);
  var bar = document.getElementById('notePhraseBar');
  if (bar) {
    bar.innerHTML = '';
    if (phrase) {
      var m = phMap(phrase);
      Object.keys(m).forEach(function (l) {
        if (!m[l]) return;
        var card = document.createElement('div');
        card.className = 'note-phrase-card ' + l;
        card.dir = l === 'ar' ? 'rtl' : 'ltr';
        card.appendChild(wordRow(m[l], l));
        var lo = document.createElement('button');
        lo.className = 'note-loop';
        lo.textContent = '🔁';
        lo.title = l;
        lo.onclick = function () { speak(m[l], l, lo); };
        card.appendChild(lo);
        bar.appendChild(card);
      });
    }
  }
  var canvas = document.getElementById('noteCanvas');
  noteUndo = [];
  noteRedo = [];
  updateNoteHistoryButtons();
  setTimeout(function () {
    setupNoteCanvas();
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.width / dpr;
    var h = canvas.height / dpr;
    noteCtx.clearRect(0, 0, w, h);
    if (notesMap[key]) {
      var img = new Image();
      img.onload = function () { noteCtx.drawImage(img, 0, 0, w, h); };
      img.src = notesMap[key];
    }
  }, 50);
  setNoteTool('pen');
  document.getElementById('noteSize').value = noteSize;
  document.querySelectorAll('.note-tool').forEach(function (b) {
    b.classList.toggle('active', b.dataset.color === noteColor);
  });
  document.getElementById('noteSwatchDot').style.background = noteColor;
  document.getElementById('notePalette').classList.remove('show');
  applyNotePaper();
}
function applyNotePaper() {
  var wrap = document.getElementById('noteWrap');
  var lined = localStorage.getItem('freelang_note_paper') === 'lined';
  wrap.classList.toggle('lined', lined);
  wrap.classList.toggle('plain', !lined);
  var pb = document.getElementById('notePaper');
  pb.textContent = lined ? '📄' : '📓';
  pb.classList.toggle('active', lined);
}
function setNoteTool(tool) {
  noteErasing = tool === 'erase';
  noteHighlight = tool === 'hl';
  document.getElementById('notePen').classList.toggle('active', tool === 'pen');
  document.getElementById('noteHl').classList.toggle('active', tool === 'hl');
  document.getElementById('noteErase').classList.toggle('active', tool === 'erase');
}
function closeNote() {
  document.getElementById('noteModal').classList.remove('show');
  noteKey = null;
  noteCtx = null;
}
function saveNote() {
  if (!noteKey || !noteCtx) return;
  var canvas = document.getElementById('noteCanvas');
  notesMap[noteKey] = canvas.toDataURL('image/png');
  saveNotes();
  var btn = document.querySelector('[data-pk="' + noteKey + '"]');
  if (btn) { btn.classList.add('note-on'); btn.textContent = '📔'; }
  closeNote();
  toast('✓ ' + T().saved);
}
function clearNote() {
  if (!noteCtx) return;
  noteSnapshot();
  var canvas = document.getElementById('noteCanvas');
  noteCtx.clearRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
}
function getNotePos(e) {
  var canvas = document.getElementById('noteCanvas');
  var rect = canvas.getBoundingClientRect();
  var clientX = e.touches ? e.touches[0].clientX : e.clientX;
  var clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}
function noteStart(e) {
  if (!noteCtx) return;
  e.preventDefault();
  noteSnapshot();
  noteDrawing = true;
  var p = getNotePos(e);
  noteCtx.beginPath();
  noteCtx.moveTo(p.x, p.y);
  noteCtx.globalCompositeOperation = noteErasing ? 'destination-out' : 'source-over';
  noteCtx.globalAlpha = noteHighlight ? 0.35 : 1;
  noteCtx.lineCap = noteHighlight ? 'square' : 'round';
  noteCtx.strokeStyle = noteColor;
  noteCtx.lineWidth = noteErasing ? noteSize * 4 : (noteHighlight ? noteSize * 3 : noteSize);
}
function noteMove(e) {
  if (!noteDrawing || !noteCtx) return;
  e.preventDefault();
  var p = getNotePos(e);
  noteCtx.lineTo(p.x, p.y);
  noteCtx.stroke();
}
function noteEnd() {
  if (!noteCtx) return;
  noteDrawing = false;
  noteCtx.closePath();
}
function bindNoteUI() {
  var canvas = document.getElementById('noteCanvas');
  canvas.addEventListener('mousedown', noteStart);
  canvas.addEventListener('mousemove', noteMove);
  window.addEventListener('mouseup', noteEnd);
  canvas.addEventListener('touchstart', noteStart, { passive: false });
  canvas.addEventListener('touchmove', noteMove, { passive: false });
  canvas.addEventListener('touchend', noteEnd);
  document.getElementById('noteClose').onclick = closeNote;
  document.getElementById('noteSave').onclick = saveNote;
  document.getElementById('noteClear').onclick = clearNote;
  document.getElementById('noteUndo').onclick = undoNote;
  document.getElementById('noteRedo').onclick = redoNote;
  document.getElementById('notePen').onclick = function () { setNoteTool('pen'); };
  document.getElementById('noteHl').onclick = function () { setNoteTool('hl'); };
  document.getElementById('noteErase').onclick = function () { setNoteTool('erase'); };
  document.getElementById('notePaper').onclick = function () {
    var lined = localStorage.getItem('freelang_note_paper') === 'lined';
    try { localStorage.setItem('freelang_note_paper', lined ? 'plain' : 'lined'); } catch (e) {}
    applyNotePaper();
  };
  document.getElementById('noteSwatch').onclick = function () {
    document.getElementById('notePalette').classList.toggle('show');
  };
  document.getElementById('noteSizeDec').onclick = function () { setNoteSize(noteSize - 1); };
  document.getElementById('noteSizeInc').onclick = function () { setNoteSize(noteSize + 1); };
  document.getElementById('noteSize').oninput = function () { setNoteSize(parseInt(this.value, 10) || 3); };
  document.querySelectorAll('.note-tool').forEach(function (b) {
    b.onclick = function () {
      noteColor = b.dataset.color;
      document.getElementById('noteSwatchDot').style.background = noteColor;
      document.querySelectorAll('.note-tool').forEach(function (x) {
        x.classList.toggle('active', x === b);
      });
      document.getElementById('notePalette').classList.remove('show');
    };
  });
}
bindNoteUI();
applyFont();
applyCapTheme();

document.getElementById('themeBtn').onclick = toggleTheme;
document.getElementById('menuBtn').onclick = openMenu;
document.getElementById('waBtn').onclick = openWhatsApp;
document.getElementById('mailBtn').onclick = openMail;

var CapApp = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
if (CapApp && CapApp.addListener) {
  CapApp.addListener('backButton', function () {
    var nm = document.getElementById('noteModal');
    if (nm && nm.classList.contains('show')) { closeNote(); return; }
    if (document.getElementById('quiz-overlay')) { closeQuiz(); return; }
    if (ovRoot.firstChild) { closeOv(); return; }
    goBack();
  });
}

  document.body.classList.add('fl-admin');

  document.title = 'Freelang Pro';
}

applyI18n();
render();

  setTimeout(function () { syncLibrary(false); }, 1200);

  document.addEventListener('visibilitychange', function () { if (!document.hidden) syncLibrary(false); });
} else {
  fetchCatalog().then(function (c) { if (c) { saveCatalog(c); if (!nav.f) render(); } });
}

// Service worker: PWA only, never inside Capacitor
if (!inCap && 'serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
})();
