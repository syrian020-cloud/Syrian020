<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d1f">
<title>أسئلة وأجوبة السياقة</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg-primary: #0b0d1f;
    --bg-secondary: #13162b;
    --bg-tertiary: #1e213d;
    --text-primary: #f0f1ff;
    --text-secondary: #8c90b5;
    --accent: #7b79ff;
    --accent-hover: #5c5bdb;
    --success: #00e676;
    --gold: #ffc857;
    --border: rgba(255,255,255,0.08);
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --shadow-sm: 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    padding-bottom: 3rem;
    -webkit-font-smoothing: antialiased;
  }
  header { position: sticky; top: 0; z-index: 60; background: rgba(11,13,31,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .header-inner { max-width: 960px; margin: 0 auto; padding: 0.7rem 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .logo { font-weight: 800; color: var(--accent); font-size: 1.05rem; white-space: nowrap; }
  .spacer { flex: 1; }
  .icon-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 12px; padding: 0.45rem 0.65rem; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
  main { max-width: 960px; margin: 0 auto; padding: 0.9rem; }
  .hero { background: linear-gradient(135deg, rgba(123,121,255,0.18), rgba(0,230,118,0.08)); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.25rem; margin-bottom: 0.9rem; }
  .hero h1 { margin: 0 0 0.35rem; font-size: 1.22rem; }
  .hero p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.85rem; align-items: center; }
  #search { flex: 1; min-width: 0; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.75rem 1rem; font-size: 0.98rem; font-family: inherit; }
  #search:focus { outline: none; border-color: var(--accent); }
  select.ctl { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.65rem 0.55rem; font-size: 0.88rem; font-family: inherit; }
  .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.85rem; }
  .filter-chip { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.75rem; font-size: 0.82rem; cursor: pointer; user-select: none; }
  .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .stats { color: var(--text-secondary); font-size: 0.88rem; margin: 0 0 0.9rem; }
  .qa-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 0.85rem; box-shadow: var(--shadow-sm); }
  .qa-card.playing { border-color: var(--success); box-shadow: 0 0 0 2px rgba(0,230,118,0.18); }
  .qa-meta { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; align-items: center; }
  .qa-num { background: rgba(123,121,255,0.12); color: var(--accent); border: 1px solid rgba(123,121,255,0.3); border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.72rem; font-weight: 700; }
  .qa-cat { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.72rem; }
  .qa-block { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.75rem; margin-bottom: 0.65rem; position: relative; }
  .qa-label { font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 0.25rem; }
  .qa-text { direction: ltr; text-align: left; font-size: 1.05rem; color: var(--text-primary); font-weight: 600; white-space: pre-wrap; }
  .qa-text.ar { direction: rtl; text-align: right; color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.35rem; }
  .qa-actions { display: flex; gap: 0.4rem; margin-top: 0.55rem; }
  .qa-actions button, .qa-actions a { flex: 1; background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 10px; padding: 0.45rem; font-size: 0.8rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem; font-weight: 600; }
  .qa-actions button:hover, .qa-actions a:hover { border-color: var(--accent); }
  .qa-actions button.active { background: var(--success); color: #0b0d1f; border-color: var(--success); }
  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); }
  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 0.6rem 1.1rem; z-index: 100; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-weight: 600; }
  .toast.show { opacity: 1; }
  footer { text-align: center; padding: 1.5rem 1rem; color: var(--text-secondary); font-size: 0.8rem; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo">أسئلة السياقة</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-stop" title="إيقاف الصوت">🔇</button>
  </div>
</header>

<main>
  <div class="hero">
    <h1>أسئلة وأجوبة امتحان السياقة الفرنسي</h1>
    <p>اضغط 🔁 للنطق بالتكرار، و🔍 للبحث في Google AI مع الترجمة والتحليل.</p>
  </div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="ابحث في الأسئلة أو الأجوبة...">
    <select class="ctl" id="rate" title="سرعة النطق">
      <option value="0.7">0.7×</option>
      <option value="0.9" selected>0.9×</option>
      <option value="1">1×</option>
      <option value="1.2">1.2×</option>
    </select>
    <select class="ctl" id="loopcount" title="عدد التكرارات">
      <option value="1">1×</option>
      <option value="3" selected>3×</option>
      <option value="5">5×</option>
    </select>
  </div>

  <div class="filters" id="filters"></div>
  <div class="stats" id="stats"></div>
  <div id="list"></div>
</main>

<footer>تطبيق تعليمي للأسئلة والأجوبة</footer>
<div class="toast" id="toast"></div>

<script src="data/qanda.js"></script>
<script>
(function(){
  'use strict';
  var DATA = window.QANDA_DATA || [];
  var list = document.getElementById('list');
  var search = document.getElementById('search');
  var rate = document.getElementById('rate');
  var loopcount = document.getElementById('loopcount');
  var stats = document.getElementById('stats');
  var filters = document.getElementById('filters');
  var toast = document.getElementById('toast');
  var state = { q: '', cat: '', playing: null };
  var speechRun = 0;

  var CAT_LABELS = { 'VE': 'فحص المركبة', 'QSER': 'السلامة المرورية', '1ers secours': 'الإسعافات الأولية' };

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 2000); }

  function buildFilters(){
    var cats = {};
    DATA.forEach(function(d){ cats[d.cat] = (cats[d.cat] || 0) + 1; });
    var html = '<button class="filter-chip' + (state.cat === '' ? ' active' : '') + '" data-cat="">الكل (' + DATA.length + ')</button>';
    Object.keys(cats).forEach(function(c){ html += '<button class="filter-chip' + (state.cat === c ? ' active' : '') + '" data-cat="' + esc(c) + '">' + esc(CAT_LABELS[c] || c) + ' (' + cats[c] + ')</button>'; });
    filters.innerHTML = html;
  }

  function filtered(){
    var q = state.q.trim().toLowerCase();
    return DATA.filter(function(d){
      if(state.cat && d.cat !== state.cat) return false;
      if(!q) return true;
      return (d.q + ' ' + d.a + ' ' + d.cat).toLowerCase().indexOf(q) !== -1;
    });
  }

  function aiQuery(text){
    return 'ترجم هذه الجملة الفرنسية إلى العربية واشرح معناها وتحليلها: ' + text;
  }

  function render(){
    var items = filtered();
    stats.textContent = items.length + ' سؤال/جواب' + (state.q ? ' · "' + esc(state.q) + '"' : '');
    if(!items.length){ list.innerHTML = '<div class="empty">لا توجد نتائج</div>'; return; }
    list.innerHTML = items.map(function(d, idx){
      var aiQ = 'https://www.google.com/search?udm=50&q=' + encodeURIComponent(aiQuery(d.q));
      var aiA = d.a ? 'https://www.google.com/search?udm=50&q=' + encodeURIComponent(aiQuery(d.a)) : null;
      return '<div class="qa-card" data-idx="' + idx + '" data-id="' + esc(d.n + '-' + d.cat) + '">' +
        '<div class="qa-meta"><span class="qa-num">#' + esc(d.n || (idx+1)) + '</span><span class="qa-cat">' + esc(CAT_LABELS[d.cat] || d.cat) + '</span></div>' +
        '<div class="qa-block">' +
          '<div class="qa-label">السؤال</div>' +
          '<div class="qa-text" dir="ltr">' + esc(d.q) + '</div>' +
          '<div class="qa-actions">' +
            '<button class="loop-btn" data-idx="' + idx + '" data-type="q">🔁 تكرار</button>' +
            '<a href="' + esc(aiQ) + '" target="_blank" rel="noopener">🔍 Google AI</a>' +
          '</div>' +
        '</div>' +
        (d.a ? '<div class="qa-block">' +
          '<div class="qa-label">الجواب</div>' +
          '<div class="qa-text" dir="ltr">' + esc(d.a).replace(/\n/g, '<br>') + '</div>' +
          '<div class="qa-actions">' +
            '<button class="loop-btn" data-idx="' + idx + '" data-type="a">🔁 تكرار</button>' +
            '<a href="' + esc(aiA) + '" target="_blank" rel="noopener">🔍 Google AI</a>' +
          '</div>' +
        '</div>' : '') +
      '</div>';
    }).join('');
  }

  function nativeTTS(){
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) return window.Capacitor.Plugins.TextToSpeech;
    return null;
  }

  function pickVoice(){
    if(!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    return voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('fr') === 0; })[0] || null;
  }

  function stopSpeech(){
    speechRun++;
    state.playing = null;
    if(nativeTTS()) nativeTTS().stop();
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.loop-btn').forEach(function(b){ b.classList.remove('active'); b.textContent = '🔁 تكرار'; });
    document.querySelectorAll('.qa-card').forEach(function(c){ c.classList.remove('playing'); });
  }

  function playText(text, btn, card){
    if(!text) return;
    stopSpeech();
    var run = ++speechRun;
    state.playing = btn;
    btn.classList.add('active'); btn.textContent = '⏸ إيقاف';
    if(card) card.classList.add('playing');
    var count = parseInt(loopcount.value, 10) || 1;
    var i = 0;

    function nativePlay(){
      var tts = nativeTTS(); if(!tts){ webPlay(); return; }
      function next(){
        if(run !== speechRun) return;
        if(i >= count){ finish(); return; }
        i++;
        tts.speak({ text: text, lang: 'fr-FR', rate: parseFloat(rate.value) || 0.9, queueStrategy: 1 }).then(function(){ setTimeout(next, 250); }).catch(function(){ setTimeout(next, 250); });
      }
      next();
    }

    function webPlay(){
      if(!('speechSynthesis' in window)){ finish(); showToast('النطق غير مدعوم'); return; }
      function next(){
        if(run !== speechRun) return;
        if(i >= count){ finish(); return; }
        i++;
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR'; u.rate = (parseFloat(rate.value) || 0.9) * 0.95;
        var v = pickVoice(); if(v) u.voice = v;
        u.onend = function(){ setTimeout(next, 250); };
        u.onerror = function(){ setTimeout(next, 250); };
        window.speechSynthesis.speak(u);
      }
      next();
    }

    function finish(){
      if(run === speechRun) stopSpeech();
    }

    nativePlay();
  }

  function bind(){
    search.addEventListener('input', function(){ state.q = this.value; render(); });
    rate.addEventListener('change', function(){ localStorage.setItem('qanda_rate', this.value); });
    loopcount.addEventListener('change', function(){ localStorage.setItem('qanda_loopcount', this.value); });
    document.getElementById('btn-stop').addEventListener('click', stopSpeech);
    filters.addEventListener('click', function(e){
      if(e.target.classList.contains('filter-chip')){
        state.cat = e.target.dataset.cat;
        buildFilters(); render();
      }
    });
    list.addEventListener('click', function(e){
      var btn = e.target.closest('.loop-btn');
      if(!btn) return;
      var idx = parseInt(btn.dataset.idx, 10);
      var type = btn.dataset.type;
      var items = filtered();
      var d = items[idx];
      if(!d) return;
      var text = type === 'q' ? d.q : d.a;
      var card = btn.closest('.qa-card');
      playText(text, btn, card);
    });
  }

  var savedRate = localStorage.getItem('qanda_rate');
  var savedLoop = localStorage.getItem('qanda_loopcount');
  if(savedRate) rate.value = savedRate;
  if(savedLoop) loopcount.value = savedLoop;

  buildFilters();
  render();
  bind();

  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
